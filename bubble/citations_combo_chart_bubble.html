<!--
  UPSTREEM — CITATIONS COMBO CHART

  LEFT = Citation Share line chart (per-domain/per-URL series over time), RIGHT = Citation Type /
  URL Type doughnut-or-bar chart — the same two chart types as visibility-chart's line chart and
  topcitations-dashboard's doughnut/bar chart, side by side in one component.

  Hovering the line chart reveals a small gear button top-right (after a short delay); its "Chart
  Settings" dropdown has only Line Width (Thin/Thick) — no color picker, colors on this line stay
  fixed. Line Width itself is shared across the WHOLE APP: the same localStorage key visibility-
  chart's own Chart Settings menu writes, so a change made in either place is felt in both
  immediately, no page reload, no Bubble event.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance   = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin    = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the literal
                    "CDN_PIN" placeholder) to load @main. Point this at a Bubble constant/Option
                    Set field you control so every placement can be repinned to a new commit in
                    one edit instead of hunting down every embed's URL by hand — @main itself lags
                    jsDelivr's cache, sometimes for hours, so a fresh fix may not actually be live
                    yet even right after it's pushed. The loader script at the bottom reads this
                    once and builds every asset URL from it.
  data-isdark     = "yes" / "no"
  data-processing  = "yes" / "no"   loading state, source 1 (ORed together)
  data-processing2 = "yes" / "no"   loading state, source 2 (ORed together)

  ── Event name must be unique per placement ──────────────────────────────────
  data-gran-fn="bubble_fn_comboGranularity_[dynamic id]"

  Fires via fn(granularity) — ONE argument, only on a user click of a non-disabled, non-active
  granularity button:
    granularity   fn(g)   g: "day" | "week" | "month"

  ── Filling the component ─────────────────────────────────────────────────────
  window.renderComboChart({
    instanceId: "...",
    isDark: "yes" | "no",
    dataMode: "domain" | "url",              // which line-chart series identity + doughnut split to show
                                              // ("mode" also accepted as an alias, in case your
                                              // Run-JS step passes the backend response through
                                              // close to as-is — that response calls this field
                                              // "mode", not "dataMode")
    chartMode: "doughnut" | "bar",           // only applied on first load — a user's manual switcher
                                              // click is remembered (localStorage) and never overridden
    total: 128,                              // doughnut/bar centre total ("Citations")
    typeSplit: [{ type, share_pct }, ...],   // citation-type slices in domain mode, url-type slices
                                              // in url mode (same field reused for both, matching
                                              // topcitations-dashboard's types_breakdown convention)
    series: [{ domain, day, share_pct }, ...],       // domain mode, OR:
    // series: [{ url, day, share_pct }, ...],       // url mode — one point per series/day
    domains: [{ domain, citation_type, favicon, global_share }, ...],  // line-series metadata, domain mode
    urls: [{ url, title, url_type, favicon, global_share }, ...],      // line-series metadata, url mode
                                              // title is what the legend and the line's tooltip
                                              // actually show in url mode — url itself is only
                                              // the lookup key now. Omit title and both fall back
                                              // to showing the raw url, same as before this field
                                              // existed, so this is safe to add whenever you're
                                              // ready rather than something that breaks today.
    granularity: "day" | "week" | "month"    // optional explicit override — otherwise inferred from
                                              // the spacing between series data points, UNLESS the
                                              // user has already manually clicked a granularity
                                              // button for this instance (their choice always wins)
  });
  window.setComboChartLoading("INSTANCE_ID", "yes" | "no");
  window.resetComboChart("INSTANCE_ID");    // clears the per-series line filter and granularity,
                                             // empties both chart halves back to skeleton — does NOT
                                             // fire bubble_fn_comboGranularity or request new data

     ── DER RUN-JS-SCHRITT: EIN BACKTICK, KEIN OBJEKT (STYLEGUIDE §46) ────────────────────────
     NIEMALS ein JS-Objekt im Schritt von Hand bauen. Also NICHT so:

       renderComboChart({ instanceId: "INSTANCE_ID", granularity: <ausdruck> })   FALSCH

     Ist einer der Ausdruecke leer, steht dort  granularity: ,  -- und das ist kein gueltiges JavaScript.
     Der Schritt scheitert dann beim PARSEN, bevor eine einzige Zeile laeuft: "Uncaught
     SyntaxError: Unexpected token ','". Kein Sanitizer und kein Code im Kit kann das abfangen,
     weil nichts davon zur Ausfuehrung kommt -- und weil der GANZE Schritt stirbt, gehen auch die
     Aufrufe DARUNTER mit. So gemeldet am 24.08. an brand-detail: die Komponente blieb im
     Ladezustand stehen, weil ein leerer _prev-Wert den Schritt getoetet hatte, ehe ihr Setter
     ueberhaupt an die Reihe kam.

     RICHTIG ist immer EIN Backtick mit dem ROHEN Text und die beiden Ersetzungen darauf. Im
     Backtick ist ein leeres Feld nur Text; die erste Ersetzung macht daraus null, die zweite
     quotiert Bubbles unquotiertes yes/no. BEIDE Zeilen sind Pflicht.

       (function () {
         var ROH = `{
           "instanceId": "INSTANCE_ID",
           "granularity": "day",
           "dataMode": "domain",
           "series": [RPC: day, value, domain oder url],
           "types": [RPC: type, count],
           "domains": [RPC: domain, favicon_url],
           "total":
         }`
           .replace(/:\s*([,}\]])/g, ": null$1")
           .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
         /* Jeder Aufruf in seinem EIGENEN try: ein kaputter oder fehlender Ausdruck darf die
            anderen nicht mitnehmen. Und window.<name> statt des nackten Namens -- haengt das
            Element noch an einem aelteren Pin, ist der Name schlicht undefined statt ein
            ReferenceError, der den ganzen Schritt mitnimmt. */
         try { if (window.renderComboChart) window.renderComboChart(ROH); } catch (e) {}
       })();

     Zahlen bleiben OHNE Anfuehrungszeichen -- 3.0, nicht "3.0" -- sonst kommt der Wert als Text
     an und jede Rechnung darauf geht daneben.

     "instanceId" steht ABSICHTLICH als ERSTES Feld. Bricht der Payload mitten ab, fischt core die
     Id trotzdem aus dem Rohtext, und die richtige Platzierung zeigt den Fehler. Steht sie hinten,
     ist sie mit abgeschnitten -- auf einer Seite mit zwei Platzierungen meldet dann die falsche.

     Was bei einem unlesbaren Payload passiert (gemessen am 24.08.): die Komponente beendet den
     Ladezustand und schreibt "The data could not be read. Please reload the page." an die Stelle
     der Daten. Ein WIRKLICH leerer Payload ("" oder "[]") bleibt dagegen der normale
     Leerzustand -- leer und kaputt sind zwei verschiedene Dinge und sehen jetzt auch verschieden
     aus. Ein neuer Ladeversuch raeumt die Meldung weg.

     setComboChartLoading nimmt zwei EINFACHE Werte und braucht keinen Backtick.

     Die EINZIGE Zeichenfolge, die im Backtick selbst gefaehrlich bleibt, ist ein Backtick oder
     ein Dollar mit geschweifter Klammer in einem WERT. Beides kommt in Marken-, Domain- und
     Themennamen nicht vor; alles andere -- Anfuehrungszeichen, Apostrophe, Umlaute,
     Zeilenumbrueche, Emoji -- traegt er unbeschadet.
-->

<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). The pin is found by looking the root element up BY CLASS — deliberately
   NOT via document.currentScript, because Bubble injects an HTML element's inline scripts in a way
   that leaves document.currentScript null/misattached. That made the previous loader read no pin
   and silently fall back to @main for every file (and jsDelivr caches @main for hours, so it served
   stale code) — which is why setting data-cdn-pin appeared to do nothing. Loading core.js once per
   component is fine: the browser caches the (immutable, commit-pinned) URL, and the component's own
   init is idempotent. */
(function(){
  /* Boot-Stub fuer den Brand-Store. Bubble ruft setUpstreemBrands() im Page-Load-Workflow, also
     regelmaessig BEVOR core.js geladen ist. Ohne diesen Stub ist window.setUpstreemBrands zu dem
     Zeitpunkt undefined, der Run-JS-Schritt wirft, und der GANZE Aufruf ist weg -- die Seite sieht
     danach aus wie eine ohne Marken, ohne dass irgendwo ein Fehler steht. core.js leert die Queue
     beim Start. Dasselbe Muster wie bei Topics und Markets (__upTopicsQueue / __upMarketsQueue). */
  window.__upBrandsQueue = window.__upBrandsQueue || [];
  if (typeof window.setUpstreemBrands !== "function"){
    window.setUpstreemBrands = function(rows){ window.__upBrandsQueue.push(rows); };
  }

  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       jsDelivr antwortet mit 404, und weder CSS noch JS landen. Ohne trim greift auch kein
       Rueckfall, weil "   " truthy ist.
       Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
       Waechter treffen, und der Loader liefe dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* ---- Rueckfall: einen Pin nehmen, der auf DIESER Seite schon gilt ----------------------
       Gemeldet am 31.08. mit drei Stapelspuren, alle aus einem solchen Loader: "core.css ist
       schon von einem anderen Pin geladen ... ignoriert wird @main" -- obwohl der Pin am Element
       stand. Der Grund ist die Reihenfolge: Bubble baut ein Element bei jedem Rerender neu und
       fuehrt Scripts nicht in DOM-Reihenfolge aus, dieser Loader lief also, waehrend seine eigene
       Wurzel noch nicht im Dokument stand -- die Klasse oben fand nichts.
       Und das war mehr als eine Warnung: core kam durch die Entdoppelung unten noch aus dem Pin,
       die Dateien DIESER Komponente aber tatsaechlich von @main. Eine Seite, die zur Haelfte auf
       @main laeuft, ist genau das, was ein Pin verhindern soll.
       Geraten wird nichts: jede der drei Stufen liest einen Pin, der auf dieser Seite schon in
       Gebrauch ist. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* Aus einer schon geladenen Datei ablesen. Diese Stufe greift auch dann, wenn alle anderen
       Elemente der Seite noch die ALTE Fassung dieses Loaders tragen -- die fuellen
       __upAssetsLoaded genauso. "main" wird NICHT gemerkt: das ist kein Pin, und die naechste
       Komponente wuerde ihn sonst fuer einen halten. */
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("combo-root") + "/";
  /* Bubble re-injects this whole block (this script tag included) every time the reusable this
     component sits in re-renders — i.e. on every drawer/view open. Without this guard each of
     those re-runs appended ANOTHER <link> + <script> for the SAME urls, forever: 4 more tags per
     render, never cleaned up (measured: 14 tags after one page build, 64 after ~25 navigations).
     Inserting a stylesheet <link> is render-blocking, so that landed right in the middle of the
     open animation — which is what made drawers/views "pop" in instead of animating.
     The registry lives on window, not in this closure, because every component ships its own copy
     of this loader. Skipping the re-run is safe: a re-rendered root is picked up and initialised
     by core.js's own root observer + 1.5s heartbeat, it does not need the scripts evaluated
     again (verified against a root injected with the scripts deliberately run only once). */
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL. Zwei Elemente mit verschiedenen data-cdn-pin
     ergeben zwei URLs fuer dieselbe Datei -- vorher lud der Loader dann beide: core.js lief
     zweimal, und core.css stand zweimal im Dokument, wobei die spaetere die fruehere ueberschrieb.
     Wer gewinnt, entschied die Reihenfolge, in der Bubble die Elemente baut.
     Der erste Pin gewinnt jetzt, und ein zweiter wird gemeldet -- sonst sucht man den Unterschied
     zwischen zwei Seiten, auf denen dieselbe Version verschiedene Dinge tut. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("citations-combo-chart.css");
  js("core.js"); js("citations-combo-chart.js");
})();
</script>
