<!-- ============================================================
     Upstreem — Topics Filter (dropdown)
     Paste this whole block into a Bubble HTML element.

     The visible element is just the 32px trigger button; the panel is rendered by the script and
     is absolutely positioned, so it does not affect the element's own box.
     Bubble element size: FIT TO CONTENT, or a fixed 32px height. Make sure the group AROUND it
     does not have "clip content" on — the script calls UC.unclipAncestors() for the usual cases.

     ── Root attributes ─────────────────────────────────────────
     data-instance     = "topics_v1_[dynamic id]"  unique per placement. Several of these on one
                         page is the normal case; every API call below targets one by this id.
     data-cdn-pin      = commit hash. NEVER leave blank: blank falls back to @main, and jsDelivr
                         caches branch URLs for days.
     data-isdark       = "yes" / "no"
     data-isprocessing = "yes" while the page is fetching. Trigger goes inert, open panel closes.

     ── Events to Bubble ────────────────────────────────────────
     Create these as Toolbox "JavaScript to Bubble" elements (type: text) and put their names in
     the attributes on the root div.

       data-topics-fn    ONE NAME PER PLACEMENT -- see "Routing" below. Fires on EVERY
                         selection change. Default if left unset: bubble_fn_utfTopics
                         {"instance_id":"...","topic_ids":"id1,id2","tag_mode":"or","count":2}
       data-newtopic-fn  default bubble_fn_utfNewTopic  fires when "New Topic" is saved
                         {"name":"...","emoji":"...","hex_light":"#...","hex_dark":"#..."}

     There is NO Apply button — every click publishes. The payload is always the FULL state, never
     a delta, so a single dropped event cannot leave your filter out of sync with the UI.
     tag_mode is "or" whenever fewer than two topics are selected: with one topic both modes
     produce the same rows, so the payload says what actually applies.

     If the function is missing the component still dispatches a "utf-topics" CustomEvent on the
     root element with the same payload, so nothing is silently lost.

     ── Control from "Run JavaScript" ───────────────────────────
  ═══ ROUTING: one JavaScript-to-Bubble element PER PLACEMENT ═══════════════════

  Give every placement its OWN function name, derived from the same dynamic id you already put in
  data-instance:

      data-instance="topics_prompts"
      data-topics-fn="bubble_fn_utfTopics_topics_prompts"

  Then the Prompts page carries a JavaScript-to-Bubble element named utfTopics_topics_prompts, and
  its workflow refreshes the prompts table. Nothing else. No condition, no branching, no checking
  which instance sent it.

  Why not one shared element for all of them: nothing would fire that you did not want -- the event
  is tied to the click, so only the dropdown the user actually operated calls anything, never the
  others. But a shared name means a single workflow that has to work out WHICH consumer to refresh,
  and with a dozen placements that becomes a dozen conditions on one workflow. One name per
  placement removes the question instead of answering it.

  The payload still carries instance_id, so a shared element remains a valid choice where two
  dropdowns genuinely drive the SAME table (for example a mobile and a desktop copy of the toolbar)
  -- there, one workflow for both is the point.

  Wrong or missing name? The component says so by name in the console ("... not found — this change
  reached no Bubble workflow."), so a typo shows up on the first click rather than as silence.

  The JavaScript-to-Bubble element must sit ON THE PAGE, not inside the reusable that holds the
  dropdown. The lookup walks window.top and every reachable frame, so it finds a page-level element
  from inside a reusable -- but not the other way round.

  ═══ FEEDING THE TOPICS: do it ONCE per page, not once per dropdown ════════════

    setUpstreemTopics(<list>)        ← no instance id. THIS is the one you want.

  One call feeds every topic picker on the page. Not just the ones that exist at that moment --
  the list is kept in a page-wide store, and any picker built LATER reads it on mount. That last
  part matters more than it sounds: Bubble re-renders its HTML elements repeatedly while dynamic
  expressions resolve (measured: three rebuilds across ~8 seconds), and anything inside a drawer
  is not built at all until the drawer opens. With the old per-instance setter those placements
  simply missed the call and stayed empty.

  ── The three things to build, once per page ──────────────────────────────────

  1) A custom event "Load Topics", two steps:
       Step 1  your topics RPC
       Step 2  Run JavaScript:
                 setUpstreemTopics(`[{ "id": "...", "name": "SHK", "emoji": null,
                   "hex_light": "#9145e8", "hex_dark": "#9145e8", "is_active": true,
                   "created_at": "...", "prompt_count": 9 }]`);

     BACKTICKS around the array, not quotes. The payload is multi-line and full of " -- a quoted
     JS string ends at the first inner quote and cannot span lines at all. Empty dynamic values
     are handled: UC.parseLoose turns "key": , into null rather than letting the step die.

  2) Page is loaded → Trigger custom event "Load Topics".

  3) A Toolbox "JavaScript to Bubble" element named upTopicsChanged (tick "Trigger event", no
     value), with one workflow:
       When JavascriptToBubble upTopicsChanged event → Trigger custom event "Load Topics"

     This is the invalidation channel, and it is why nothing else needs wiring. Every component
     in this library that creates, edits, deletes or reassigns a topic calls
     bubble_fn_upTopicsChanged() by itself after firing its own save event -- the New Topic
     button here, topics-manager's add/edit/delete, the prompts table's Add Topic and bulk
     assign. They fire their normal events so you can save; the refresh then runs on its own.

     Resolved through window.top and every reachable iframe, so it works from inside a reusable
     element or a popup -- where a page-level custom event cannot be triggered directly. The
     JavaScript-to-Bubble element itself must sit ON THE PAGE, not inside the reusable element.

  ── What is left for you to wire by hand ──────────────────────────────────────
  Only changes that happen OUTSIDE these components and move prompt_count: a prompt created,
  deleted or deactivated elsewhere. Add "Trigger custom event: Load Topics" at the end of those
  workflows. One step, always the same one.

  ── Adding another topics dropdown, anywhere ──────────────────────────────────
  Place the element, set data-instance. That is all. No workflow edit, no extra line in the RPC
  step, no new setter call.

  ── The per-instance setter still exists ──────────────────────────────────────
     setTopicsFilterTopics('topics_v1_dashboard', <list>)   feed the topics (array or JSON text)
                                                            ONLY for the rare case where one
                                                            dropdown must show a DIFFERENT list
                                                            than the rest of the page. It does not
                                                            touch the store, so the next
                                                            setUpstreemTopics() overwrites it.
       Same shape your topics RPC already returns:
       [{id, name, emoji, hex_light, hex_dark, is_active, created_at, prompt_count}, ...]
       is_active:false entries are not offered. A selected topic that disappears from a later
       delivery is dropped from the selection AND published, so the trigger can never count
       something the list cannot show.

     setTopicsFilterSelected('topics_v1_dashboard', 'id1,id2')   preselect, SILENT
     setTopicsFilterMode('topics_v1_dashboard', 'and'|'or')      set match mode, SILENT
     setTopicsFilterTheme('topics_v1_dashboard', 'dark'|'light')
     resetTopicsFilter('topics_v1_dashboard')                    clear everything, SILENT

     Silent is deliberate for all of these: you call them to mirror state Bubble already has.
     Emitting would kick off a second page-wide refresh nobody asked for.

     Every one of these accepts an exact id OR a prefix — resetTopicsFilter('topics_v1_') hits all
     of them. And a call that arrives before its element exists is queued and replayed the moment
     that picker mounts, so it does not matter whether the group is visible yet.

     ── State across page changes ───────────────────────────────
     Selection, match mode and sort survive Bubble swapping the element out and back in, keyed by
     data-instance. In memory only, on purpose.
     ============================================================ -->
<div class="up-root utf-root"
     data-instance="topics_v1_[dynamic id]"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-isprocessing="IS_PROCESSING"
     data-topics-fn="bubble_fn_utfTopics_[dynamic id]"
     data-newtopic-fn="bubble_fn_utfNewTopic">
  <!-- ── OPTIONAL, und normalerweise LEER LASSEN ──────────────────────────────
       Since the page-wide store exists, this element needs NO topics input of its own. Leave
       TOPICS_JSON standing (it is then ignored) or delete the line entirely, and let the page's
       "Load Topics" event call setUpstreemTopics() -- see the header of this file. That is one
       expression on the page instead of one per placement, and it is the only version that also
       reaches pickers Bubble has not built yet.

       Filling it in is still allowed and does exactly one thing: it paints a list before the
       first setUpstreemTopics() arrives. Worth it only where there is no RPC at all, e.g. a page
       carrying a fixed list. Be aware the seed does NOT resolve any earlier than the RPC does --
       it is a Bubble dynamic expression like any other -- so on a normal page it mostly buys a
       brief flash of whatever the list looked like at page build. The store always wins once it
       has a value.

       If you do fill it: no quotes around it, no escaping. type="application/json" means the
       browser never executes this, so a topic name may contain quotes, apostrophes or slashes
       without breaking anything.
       Shape: [{id, name, emoji, hex_light, hex_dark, is_active, created_at, prompt_count}, ...]
       ──────────────────────────────────────────────────────────────────────── -->
  <script class="utf-topics-json" type="application/json">TOPICS_JSON</script>
</div>

<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash in data-cdn-pin on the
   root div above. Byte-for-byte the same loader every other component in this repo ships. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("utf-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("topics-filter.css");
  js("core.js"); js("topics-filter.js");
})();
</script>
