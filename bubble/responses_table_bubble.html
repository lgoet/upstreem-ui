<!--

  ── Marken kommen jetzt SEITENWEIT ───────────────────────────────────────────
  Ein Aufruf pro Seite, nicht mehr einer pro Placement:

      window.setUpstreemBrands(brandsJson);
        Feldnamen frei: {id|company_id, name|label, logo|logo_url|favicon|favicon_url} -- der Store
        normalisiert und legt jede Zeile unter ALLEN diesen Namen ab, damit jede Komponente
        findet, was sie sucht. Zusatzfelder (role, position, ...) bleiben erhalten.
        Protokoll-relative Logo-URLs ("//cdn...") werden auf https:// gezogen.

  Jede Komponente mit einer Marken-Auswahlliste zieht daraus -- Tabellen, Charts, Quick Actions,
  Performance Radar. Der komponenteneigene Setter weiter unten bleibt bestehen und funktioniert
  unveraendert; er ist ab jetzt nur noch der Rueckfall. Ein LEERER Store ueberschreibt nie, eine
  Seite ohne setUpstreemBrands() verhaelt sich also exakt wie vorher.

  Gegenrichtung: wer eine Marke anlegt, umbenennt oder deaktiviert, ruft
  window.upstreemBrandsChanged() -- dafuer ein Toolbox-Element "JavaScript to Bubble" namens
  upBrandsChanged anlegen (Trigger event angehakt), dessen Workflow den Marken-RPC neu laufen
  laesst und setUpstreemBrands() ruft. Ohne das erscheinen neue Marken erst nach einem Reload.
  UPSTREEM — RESPONSES TABLE

  One row per prompt_run (a single LLM response) — the same prompt_id repeats once per
  model/run. Two views of the same result set, switchable in the toolbar: Table and Cards.
  Each view keeps its own pagination (page + page size) independently — switching views does
  NOT reset the other view's position.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance        = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin         = commit hash to load from — leave EMPTY (or the literal "CDN_PIN"
                         placeholder) to load @main. See STYLEGUIDE §26 for why this matters.
  data-isdark          = "yes" / "no"
  data-brand-name      = the brand's display name (for the "X mentioned" toggle)
  data-brand-logo      = the brand's logo url (optional)
  data-spotlight-mode  = "yes" / "no" (TEXT, not a boolean -- same convention as data-isdark).
                         "no" or empty: nothing changes, the table behaves exactly as before.
                         "yes": the "<brand> mentioned" toggle shows its SELECTED state, is greyed
                         out and cannot be clicked -- it fires no event and changes no filter. Use
                         it where the page already filters to that brand and the toggle would only
                         let the user contradict the page it sits on.
  data-export-instance = the instanceId of the EXPORT POPUP component on the same page
  data-sticky-top      = px offset from the top at which the sticky header pins (desktop only)
  data-sticky          = "yes" / "no" — same dynamic-input convention as data-isdark. "no" turns
                         off the sticky header entirely on this placement; any other value (or
                         omitted) keeps the default sticky-on-desktop behaviour.
  data-default-view    = "table" / "cards" — which view this placement opens into. Only applies
                         on this instanceId's FIRST load; once a visitor switches views by hand
                         that choice is remembered from then on, same as every other preference
                         here. Cards-as-default also starts the card grid at page size 6 instead
                         of 12 (a lighter first paint), same reasoning STYLEGUIDE §1c gives for
                         table page sizes.

  ── Event names must be unique per placement ─────────────────────────────────
  data-search-fn="bubble_fn_urtSearch_[dynamic id]"
  data-sort-fn="bubble_fn_urtSort_[dynamic id]"
  data-filter-fn="bubble_fn_urtFilter_[dynamic id]"          (rank/sentiment range, from the Fader)
  data-mentioned-fn="bubble_fn_urtMentioned_[dynamic id]"    (multi-select brands dropdown)
  data-brand-fn="bubble_fn_urtBrand_[dynamic id]"            (single "X mentioned" toggle)
  data-page-fn="bubble_fn_urtPage_[dynamic id]"
  data-view-fn="bubble_fn_urtView_[dynamic id]"              (Table <-> Cards)
  data-rowclick-fn="bubble_fn_urtRowClick_[dynamic id]"      (fires from BOTH a table row and a card)

  Every one fires ONE JSON string, values pulled out on the Bubble side by regex. All SERVER-side:
  this component never filters/sorts/paginates locally.

    search    {"query":"...","query_folded":"...","query_de":"...","requestId":"urt_…"}
    sort      {"sort_field":"date"|"sentiment"|"rank","sort_dir":"asc"|"desc"}
    filter    {"rank_min":1,"rank_max":20,"rank_active":true,"sent_min":0,"sent_max":100,"sent_active":false}
              rank_max:20 means "20+" (open upper end) — the slider's own top handle has no ceiling
    mentioned {"brands":"id1,id2"}
    brand     {"brand_mentioned":"yes"}        "yes" | "no" | ""  (empty = off)
    page      {"limit":25,"offset":50,"page":3,"view":"table"|"cards"}   -> p_limit / p_offset in
              your RPC, same convention as urls-table/domains-table/prompts-table. "view" rides
              along so you know which pagesize set the request came from (table vs cards).
    view      {"view":"table"|"cards"}
    rowclick  {"prompt_run_id":"..."}

  Regex, as everywhere else:
    (?<="query":")[^"]*   (?<="query_folded":")[^"]*   (?<="query_de":")[^"]*   (?<="requestId":")[^"]*
    (?<="sort_field":")[^"]*   (?<="sort_dir":")[^"]*
    (?<="rank_min":)[0-9]+   (?<="rank_max":)[0-9]+   (?<="rank_active":)(true|false)
    (?<="sent_min":)[0-9]+   (?<="sent_max":)[0-9]+   (?<="sent_active":)(true|false)
    (?<="brands":")[^"]*   (?<="brand_mentioned":")[^"]*
    (?<="limit":)[0-9]+   (?<="offset":)[0-9]+   (?<="page":)[0-9]+   (?<="view":")[^"]*
    (?<="prompt_run_id":")[^"]*

  ── Export ───────────────────────────────────────────────────────────────────
  Same pattern as every other table: place the export popup component on the page, give it an
  instanceId, put that id in data-export-instance here.

  ── Filling the table ────────────────────────────────────────────────────────
  window.renderResponsesTable({ instanceId: "...", rows: RAW_STRING_OR_ARRAY, totalCount: 123 });
  window.setResponsesTableLoading("INSTANCE_ID", "yes" | "no");
  window.resetResponsesTable("INSTANCE_ID");
  window.setResponsesTableModels("INSTANCE_ID", RAW_STRING_OR_ARRAY);
  window.setResponsesTableBrands("INSTANCE_ID", RAW_STRING_OR_ARRAY);

  !! NEVER paste the RPC result straight into the JS as an array literal. Bubble's raw output is
  NOT valid JavaScript: a null column arrives as `"user_sentiment":,` — nothing at all between
  the colon and the comma — and the Run-JS step dies with "Unexpected token ','" before any of
  this component's code runs. Bare yes/no and unescaped emoji/quotes break it the same way.
  ALWAYS put the raw text in a backtick string and hand THAT over: every entry point here runs
  strings through UpstreemCore.parseBubbleJson, the one shared repair pass (same as every other
  table in this repo).

  ── Run-JS "Render" step (paste as-is, swap the bracketed dynamic values) ────

  (function () {
    var RAW = `[RESPONSES_RPC_RESPONSE]`;          // backticks — do NOT wrap in [ ] yourself

    var t = 0;
    (function go () {
      var w  = window,
          fn = w.renderResponsesTable
            || (w.parent && w.parent.renderResponsesTable)
            || (w.top && w.top.renderResponsesTable);
      if (typeof fn === "function") {
        fn({ instanceId: `INSTANCE_ID`, rows: RAW });   // rows stays a STRING on purpose
        return;
      }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[responses-table] renderResponsesTable never appeared after 6s — " +
        "check data-cdn-pin and that the component is actually on this page.");
    })();
  })();

  totalCount is read off row 0's `total_count`… no: that field is the CITATIONS total. Pass the
  row count total explicitly if your RPC returns one, e.g. fn({instanceId, rows: RAW,
  totalCount: Number(`[TOTAL_COUNT]`)}). Omitted, the head count shows the number of loaded rows.

  ── Models — own Run-JS step, run ONCE on page load ─────────────────────────
  Keyed by `key`, which is what each row's `model` field references. A row whose `model` is not
  in this list still renders (raw key as text, no logo, no crash).

  OPTIONAL `short_name` per model: the Model column is narrow, so a long display_name gets
  abbreviated. Set short_name to control that yourself; without it "google-aio" falls back to
  "Google AIO" and everything else uses display_name unchanged. The full display_name stays
  available as the cell's tooltip whenever the two differ.

  (function () {
    var INSTANCE_ID = `INSTANCE_ID`;
    var RAW = `[MODELS_RPC_RESPONSE]`;   // [{key,logo_url,provider,is_active,display_name}, …]
    var t = 0;
    (function go () {
      var fn = window.setResponsesTableModels
            || (window.parent && window.parent.setResponsesTableModels)
            || (window.top && window.top.setResponsesTableModels);
      if (typeof fn === "function") { fn(INSTANCE_ID, RAW); return; }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[responses-table] setResponsesTableModels never appeared.");
    })();
  })();

  ── Brands — own Run-JS step, run ONCE on page load ─────────────────────────
  Same "fed in once at page load, full unfiltered list" contract as every other table's brands
  dropdown. An empty list is ignored (keeps whatever was already loaded).

  (function () {
    var INSTANCE_ID = `INSTANCE_ID`;
    var RAW = `[BRANDS_RPC_RESPONSE]`;   // [{company_id,name,logo_url}, …]
    var t = 0;
    (function go () {
      var fn = window.setResponsesTableBrands
            || (window.parent && window.parent.setResponsesTableBrands)
            || (window.top && window.top.setResponsesTableBrands);
      if (typeof fn === "function") { fn(INSTANCE_ID, RAW); return; }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[responses-table] setResponsesTableBrands never appeared.");
    })();
  })();

  ── Loading state — own Run-JS step ─────────────────────────────────────────
  (function () {
    var INSTANCE_ID = `INSTANCE_ID`;
    var LOADING = `IS_LOADING`;          // "yes" / "no"
    var t = 0;
    (function go(){
      var fn = window.setResponsesTableLoading
        || (window.parent && window.parent.setResponsesTableLoading)
        || (window.top && window.top.setResponsesTableLoading);
      if (typeof fn === "function") { fn(INSTANCE_ID, LOADING); return; }
      if (t++ < 60) setTimeout(go, 100);
    })();
  })();

  Row fields (straight from your RPC, no renaming needed):
    prompt_run_id, run_at, model, prompt_id, prompt_text, user_rank, user_sentiment,
    has_user_brand, companies_preview_totalcount, companies_preview[{name,rank,company_id,
    favicon_url,brand_name_raw}], sources_totalcount, sources_preview[{pos,url,title,domain,
    favicon}] (capped to the first 5 server-side — sources_totalcount is the real count behind
    the "+N" badge, same "preview + separate total" pattern as companies_preview/
    companies_preview_totalcount above it), total_count (the RESULT-SET total across every row —
    drives pagination and the heading count, NOT a per-row citations total), response_preview
    (Cards view only)

     ── DER RUN-JS-SCHRITT: EIN BACKTICK, KEIN OBJEKT (STYLEGUIDE §46) ────────────────────────
     NIEMALS ein JS-Objekt im Schritt von Hand bauen. Also NICHT so:

       renderResponsesTable({ instanceId: "INSTANCE_ID", rows: <ausdruck> })   FALSCH

     Ist einer der Ausdruecke leer, steht dort  rows: ,  -- und das ist kein gueltiges JavaScript.
     Der Schritt scheitert dann beim PARSEN, bevor eine einzige Zeile laeuft: "Uncaught
     SyntaxError: Unexpected token ','". Kein Sanitizer und kein Code im Kit kann das abfangen,
     weil nichts davon zur Ausfuehrung kommt -- und weil der GANZE Schritt stirbt, gehen auch die
     Aufrufe DARUNTER mit. So gemeldet am 24.08. an brand-detail: die Komponente blieb im
     Ladezustand stehen, weil ein leerer _prev-Wert den Schritt getoetet hatte, ehe ihr Setter
     ueberhaupt an die Reihe kam.

     RICHTIG ist immer EIN Backtick mit dem ROHEN Text und die beiden Ersetzungen darauf. Im
     Backtick ist ein leeres Feld nur Text; die erste Ersetzung macht daraus null, die zweite
     quotiert Bubbles unquotiertes yes/no. BEIDE Zeilen sind Pflicht.

       (function () {
         var ROH = `{
           "instanceId": "INSTANCE_ID",
           "rows": [RPC-Ergebnis],
           "totalCount":
         }`
           .replace(/:\s*([,}\]])/g, ": null$1")
           .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
         /* Jeder Aufruf in seinem EIGENEN try: ein kaputter oder fehlender Ausdruck darf die
            anderen nicht mitnehmen. Und window.<name> statt des nackten Namens -- haengt das
            Element noch an einem aelteren Pin, ist der Name schlicht undefined statt ein
            ReferenceError, der den ganzen Schritt mitnimmt. */
         try { if (window.renderResponsesTable) window.renderResponsesTable(ROH); } catch (e) {}
       })();

     Zahlen bleiben OHNE Anfuehrungszeichen -- 3.0, nicht "3.0" -- sonst kommt der Wert als Text
     an und jede Rechnung darauf geht daneben.

     "instanceId" steht ABSICHTLICH als ERSTES Feld. Bricht der Payload mitten ab, fischt core die
     Id trotzdem aus dem Rohtext, und die richtige Platzierung zeigt den Fehler. Steht sie hinten,
     ist sie mit abgeschnitten -- auf einer Seite mit zwei Platzierungen meldet dann die falsche.

     Was bei einem unlesbaren Payload passiert (gemessen am 24.08.): die Komponente beendet den
     Ladezustand und schreibt "The data could not be read. Please reload the page." an die Stelle
     der Daten. Ein WIRKLICH leerer Payload ("" oder "[]") bleibt dagegen der normale
     Leerzustand -- leer und kaputt sind zwei verschiedene Dinge und sehen jetzt auch verschieden
     aus. Ein neuer Ladeversuch raeumt die Meldung weg.

     setResponsesTableModels und setResponsesTableBrands tragen Listen und brauchen je EINEN
     eigenen Backtick. setResponsesTableLoading nimmt einfache Werte und braucht keinen.

     Die EINZIGE Zeichenfolge, die im Backtick selbst gefaehrlich bleibt, ist ein Backtick oder
     ein Dollar mit geschweifter Klammer in einem WERT. Beides kommt in Marken-, Domain- und
     Themennamen nicht vor; alles andere -- Anfuehrungszeichen, Apostrophe, Umlaute,
     Zeilenumbrueche, Emoji -- traegt er unbeschadet.
-->

<script>
(function(){
  /* Boot-Stub fuer den Brand-Store. Bubble ruft setUpstreemBrands() im Page-Load-Workflow, also
     regelmaessig BEVOR core.js geladen ist. Ohne diesen Stub ist window.setUpstreemBrands zu dem
     Zeitpunkt undefined, der Run-JS-Schritt wirft, und der GANZE Aufruf ist weg -- die Seite sieht
     danach aus wie eine ohne Marken, ohne dass irgendwo ein Fehler steht. core.js leert die Queue
     beim Start. Dasselbe Muster wie bei Topics und Markets (__upTopicsQueue / __upMarketsQueue). */
  window.__upBrandsQueue = window.__upBrandsQueue || [];
  if (typeof window.setUpstreemBrands !== "function"){
    window.setUpstreemBrands = function(rows){ window.__upBrandsQueue.push(rows); };
  }

  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      /* Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
         Waechter treffen -- der Vergleich waere dann pin === "<der Hash>" und der Loader liefe
         dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
      if (p && p !== "CDN_" + "PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("urt-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL. Zwei Elemente mit verschiedenen data-cdn-pin
     ergeben zwei URLs fuer dieselbe Datei -- vorher lud der Loader dann beide: core.js lief
     zweimal, und core.css stand zweimal im Dokument, wobei die spaetere die fruehere ueberschrieb.
     Wer gewinnt, entschied die Reihenfolge, in der Bubble die Elemente baut.
     Der erste Pin gewinnt jetzt, und ein zweiter wird gemeldet -- sonst sucht man den Unterschied
     zwischen zwei Seiten, auf denen dieselbe Version verschiedene Dinge tut. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("responses-table.css");
  js("core.js"); js("responses-table.js");
})();
</script>
