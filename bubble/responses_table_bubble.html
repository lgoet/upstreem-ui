<!--
  UPSTREEM — RESPONSES TABLE

  One row per prompt_run (a single LLM response) — the same prompt_id repeats once per
  model/run. Two views of the same result set, switchable in the toolbar: Table and Cards.
  Each view keeps its own pagination (page + page size) independently — switching views does
  NOT reset the other view's position.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance        = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin         = commit hash to load from — leave EMPTY (or the literal "CDN_PIN"
                         placeholder) to load @main. See STYLEGUIDE §26 for why this matters.
  data-isdark          = "yes" / "no"
  data-brand-name      = the brand's display name (for the "X mentioned" toggle)
  data-brand-logo      = the brand's logo url (optional)
  data-export-instance = the instanceId of the EXPORT POPUP component on the same page
  data-sticky-top      = px offset from the top at which the sticky header pins (desktop only)

  ── Event names must be unique per placement ─────────────────────────────────
  data-search-fn="bubble_fn_urtSearch_[dynamic id]"
  data-sort-fn="bubble_fn_urtSort_[dynamic id]"
  data-filter-fn="bubble_fn_urtFilter_[dynamic id]"          (rank/sentiment range, from the Fader)
  data-mentioned-fn="bubble_fn_urtMentioned_[dynamic id]"    (multi-select brands dropdown)
  data-brand-fn="bubble_fn_urtBrand_[dynamic id]"            (single "X mentioned" toggle)
  data-page-fn="bubble_fn_urtPage_[dynamic id]"
  data-view-fn="bubble_fn_urtView_[dynamic id]"              (Table <-> Cards)
  data-rowclick-fn="bubble_fn_urtRowClick_[dynamic id]"      (fires from BOTH a table row and a card)

  Every one fires ONE JSON string, values pulled out on the Bubble side by regex. All SERVER-side:
  this component never filters/sorts/paginates locally.

    search    {"query":"...","query_folded":"...","query_de":"...","requestId":"urt_…"}
    sort      {"sort_field":"date"|"sentiment"|"rank","sort_dir":"asc"|"desc"}
    filter    {"rank_min":1,"rank_max":20,"rank_active":true,"sent_min":0,"sent_max":100,"sent_active":false}
              rank_max:20 means "20+" (open upper end) — the slider's own top handle has no ceiling
    mentioned {"brands":"id1,id2"}
    brand     {"brand_mentioned":"yes"}        "yes" | "no" | ""  (empty = off)
    page      {"page":3,"size":25,"view":"table"|"cards"}
    view      {"view":"table"|"cards"}
    rowclick  {"prompt_run_id":"..."}

  Regex, as everywhere else:
    (?<="query":")[^"]*   (?<="query_folded":")[^"]*   (?<="query_de":")[^"]*   (?<="requestId":")[^"]*
    (?<="sort_field":")[^"]*   (?<="sort_dir":")[^"]*
    (?<="rank_min":)[0-9]+   (?<="rank_max":)[0-9]+   (?<="rank_active":)(true|false)
    (?<="sent_min":)[0-9]+   (?<="sent_max":)[0-9]+   (?<="sent_active":)(true|false)
    (?<="brands":")[^"]*   (?<="brand_mentioned":")[^"]*
    (?<="page":)[0-9]+   (?<="size":)[0-9]+   (?<="view":")[^"]*
    (?<="prompt_run_id":")[^"]*

  ── Export ───────────────────────────────────────────────────────────────────
  Same pattern as every other table: place the export popup component on the page, give it an
  instanceId, put that id in data-export-instance here.

  ── Filling the table ────────────────────────────────────────────────────────
  window.renderResponsesTable({ instanceId: "...", rows: [...], totalCount: 123 });
  window.setResponsesTableLoading("INSTANCE_ID", "yes" | "no");
  window.resetResponsesTable("INSTANCE_ID");

  window.setResponsesTableModels("INSTANCE_ID", [
    { key: "chatgpt", logo_url: "https://...", provider: "OpenAI", is_active: "yes", display_name: "ChatGPT" },
    ...
  ]);
  Called once at page load (like setUrlsTableBrands below) — keyed by `key`, which is what each
  row's `model` field references. A row whose `model` isn't in this list still renders (the raw
  key as plain text, no logo, no crash) rather than breaking.

  window.setResponsesTableBrands("INSTANCE_ID", [ {company_id, name, logo_url}, ... ]);
  Same "fed in once at page load, full unfiltered list" contract as every other table's brands
  dropdown. An empty list is ignored (keeps whatever was already loaded).

  Row fields (straight from your RPC, no renaming needed):
    prompt_run_id, run_at, model, prompt_id, prompt_text, user_rank, user_sentiment,
    has_user_brand, companies_preview_totalcount, companies_preview[{name,rank,company_id,
    favicon_url,brand_name_raw}], sources_preview[{pos,url,title,domain,favicon}], total_count
    (the citations total — sources_preview is only a preview, same "+N" pattern as brand mentions),
    response_preview (Cards view only)
-->
<div class="up-root urt-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-brand-name="BRAND_NAME"
     data-brand-logo="BRAND_LOGO"
     data-export-instance="EXPORT_INSTANCE_ID"
     data-sticky-top="171"
     data-search-fn="bubble_fn_urtSearch"
     data-sort-fn="bubble_fn_urtSort"
     data-filter-fn="bubble_fn_urtFilter"
     data-mentioned-fn="bubble_fn_urtMentioned"
     data-brand-fn="bubble_fn_urtBrand"
     data-page-fn="bubble_fn_urtPage"
     data-view-fn="bubble_fn_urtView"
     data-rowclick-fn="bubble_fn_urtRowClick">
  <div class="up-head">
    <div class="up-heading"><span class="up-head-label">Responses</span><span class="up-head-sep"></span><span class="up-head-count"></span></div>
    <div class="up-head-tools">
      <button class="urt-brand-toggle" type="button" data-tip="Filter by brand mention">
        <span class="urt-brand-toggle-lbl">
          <img class="urt-brand-logo" src="" style="display:none" alt=""/>
          <span class="urt-brand-label"></span>
        </span>
        <span class="urt-brand-check">
          <svg class="urt-brand-check-yes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <svg class="urt-brand-check-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </span>
      </button>

      <div class="up-ment">
        <button class="up-ment-btn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span class="up-ment-lbl">All Brands</span>
          <svg class="up-ment-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          <svg class="up-ment-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="up-ment-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="urt-fader">
        <button class="urt-fader-btn" type="button" data-tip="Filter by rank &amp; sentiment" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
        </button>
        <div class="urt-fader-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="up-sort">
        <button class="up-sort-btn up-iconbtn" type="button" data-tip="Sort" aria-label="Sort">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
        </button>
        <div class="up-sort-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="up-search">
        <button class="up-search-btn up-iconbtn" type="button" data-tip="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div class="up-search-box">
          <input class="up-search-input" type="text" placeholder="Search prompts..." autocomplete="off" spellcheck="false" aria-label="Search responses"/>
          <button class="up-search-clear" type="button" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="up-cols">
        <button class="up-cols-btn up-iconbtn" type="button" data-tip="Table Settings" aria-label="Table settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <span class="urt-cols-badge"></span>
        <div class="up-cols-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="urt-viewswitch">
        <button class="urt-viewswitch-btn is-active" type="button" data-view="table" data-tip="Table view" aria-label="Table view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
        </button>
        <button class="urt-viewswitch-btn" type="button" data-view="cards" data-tip="Card view" aria-label="Card view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
      </div>

      <button class="up-export" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Export</span>
      </button>
    </div>
  </div>

  <div class="up-box">
    <div class="up-table">
      <div class="up-thead">
        <div class="up-th up-th-prompt">Prompt</div>
        <div class="up-th up-th-mentioned">Mentioned?</div>
        <div class="up-th up-th-sentiment is-sortable" data-sortcol="sentiment">
          <span class="up-th-txt">Sentiment</span>
          <span class="up-thsort" data-for="sentiment">
            <svg class="up-thsort-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
            <svg class="up-thsort-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="up-th up-th-rank is-sortable" data-sortcol="rank">
          <span class="up-th-txt">Rank</span>
          <span class="up-thsort" data-for="rank">
            <svg class="up-thsort-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
            <svg class="up-thsort-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="up-th up-th-brands">Brand Mentions</div>
        <div class="up-th up-th-citations">Citations</div>
        <div class="up-th up-th-model">Model</div>
        <div class="up-th up-th-date is-sortable" data-sortcol="date">
          <span class="up-th-txt">Date</span>
          <span class="up-thsort" data-for="date">
            <svg class="up-thsort-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
            <svg class="up-thsort-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
      </div>
      <div class="up-tbody"></div>
    </div>
  </div>

  <div class="urt-cards"></div>

  <div class="up-foot">
    <div class="up-pagesize">
      <span class="up-pagesize-lbl">Rows per page</span>
      <div class="up-pagesize-seg" role="group" aria-label="Rows per page"></div>
    </div>
    <div class="up-pager"></div>
  </div>
</div>
<script>
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("urt-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("responses-table.css");
  js("core.js"); js("responses-table.js");
})();
</script>
