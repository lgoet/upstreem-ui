<!--
  upstreem — URL DETAIL
  ============================================================================================
  Die Detailseite einer einzelnen zitierten URL. Aufbau von oben, jede Karte erscheint nur,
  wenn sie etwas zu zeigen hat:

      1. KPIs        Last Seen, Domain Share, Global Share, URL Rank, Citation Type, URL Type
      2. Mentions    "Relevant brands referenced on this page"
      3. Embed       das Video oder der Post selbst, wenn die Adresse zu einem Anbieter passt
      4. Meta        die SEO-Beschreibung -- erscheint NICHT neben einem Embed
      5. AI Summary  die Zusammenfassung des Hintergrundlaufs
      6. Conversion  kompakte Tabelle: zitiert, genannt, Quote je Marke

  Abschnitte, keine Karten. Titel, Favicon und Domain stehen NICHT hier -- die Seite faengt mit
  den KPIs an.

  ── Attribute am Element ────────────────────────────────────────────────────────────────────
      data-instance    die Instanz-Id, frei waehlbar. MUSS gesetzt sein: steht dort noch
                       INSTANCE_ID, baut die Komponente sich absichtlich nicht auf.
      data-cdn-pin     der Commit-Hash, aus dem geladen wird
      data-isdark      "yes" | "no" -- nur die ERSTE Farbe. Danach gewinnt das Thema der App
                       (UC.themeParam), damit ein spaeter Render-Aufruf mit altem Wert die
                       Komponente nicht hinter der App zurueckdreht.
      data-brand-fn    Name der Bubble-Funktion fuer den Klick auf einen Mention-Chip,
                       Standard bubble_fn_uudBrand

  ── Ereignis ────────────────────────────────────────────────────────────────────────────────
      uudBrand   JSON-TEXT beim Klick auf einen Mention-Chip ODER auf eine Zeile der
                 Conversion-Tabelle -- beide Wege feuern dasselbe Ereignis, es ist derselbe
                 Sprung zur Marke:
                   {"company_id":"26dd1507-...","company_name":"Parookaville"}
                 Ist ein Team gesetzt, steht team_id VORNE als erster Schluessel.
                 Extraktion:
                   (?<="company_id":")[^"]*
                   (?<="company_name":")(?:[^"\\]|\\.)*
                 company_name ist FREITEXT -- ein Anfuehrungszeichen im Markennamen kommt als \"
                 an, deshalb das escape-feste Muster und dahinter ein
                   :find & replace  \"  ->  "

  ── Setter ──────────────────────────────────────────────────────────────────────────────────
      window.setUrlDetail("INSTANCE_ID", <text>)             das url_detailed-Objekt
      window.setUrlDetailConversion("INSTANCE_ID", <text>)   die conversion-Liste
      window.setUrlDetailSummary("INSTANCE_ID", <text>)      die Zusammenfassung, EIGENER Weg
      window.setUrlDetailLoading("INSTANCE_ID", "yes"|"no")  Skelett an/aus
      window.resetUrlDetail("INSTANCE_ID")                   alles leer

  Beide Payloads gehen als TEXT rein, roh zwischen Backticks. NICHT im Schritt parsen und nicht
  JSON-safe formatieren: UC.readBubble in der Komponente ist der eine geteilte Leseweg. Er liest
  gueltiges JSON unveraendert, repariert Bubbles Eigenheiten (nacktes yes/no, leere Werte,
  unescapte Anfuehrungszeichen, abgeschnittene Felder) und trennt LEER von UNLESBAR -- ein
  unlesbarer Payload steht als Fehlerband oben in der Komponente statt als leere Seite.

  ── Felder von url_detailed ─────────────────────────────────────────────────────────────────
      url, title, domain, favicon
      last_seen           ISO-Zeitstempel -> "23. Aug 2026"
      domain_share        Zahl -> 99.2%   (eine Nachkommastelle)
      global_share        Zahl -> 11.6%
      global_rank         Platzziffer -> #1
      citation_type       Brand_Platform | Editorial | Competition | You | Institutional |
                          Knowledge_Base | UGC_Community  -> Chip OHNE Punkt
      url_type            listicle | article | guide | ... -> Chip MIT Punkt
                          Der Punkt ist die Hausregel: er haelt die beiden Vokabulare
                          auseinander, wenn sie nebeneinander stehen.
      description         die Meta-Beschreibung. Darf HTML-kodiert sein (&amp;) -- die
                          Komponente dekodiert einmal und schreibt sie als Text zurueck.
      markdown_summary    Darf GENAU so mitgeschickt werden, wie die RPC es liefert -- auch
                          wenn es selbst unescaptes JSON ist ({"summary": "...", roh, ohne \"
                          davor). Die Komponente erkennt dieses eine, bekannte Muster, zieht das
                          Feld gezielt heraus und liest den Rest normal weiter. Gemessen (24.08.,
                          der reale ADAC-Payload aus einem Bugreport): 14 Felder, 11 Firmen,
                          Zusammenfassung -- alle korrekt, 0 Konsolenfehler.
                          Optional: window.setUrlDetailSummary("INSTANCE_ID", <text>) fuer
                          Aufbauten, die markdown_summary als EIGENEN Bubble-Wert getrennt vom
                          Rest der Zeile haben. Wird er gerufen, gewinnt er; sonst zaehlt
                          automatisch das Feld aus dem DETAIL-Payload.
      companies           [{company_id, company_name, logo_url}, ...] -> die Mention-Chips

  ── Felder von conversion ───────────────────────────────────────────────────────────────────
      company_id, company_name, logo_url, role ("own" | "competitor"),
      cited_runs, mentioned_runs, citation_conversion_pct
      Sortiert wird nach citation_conversion_pct, absteigend. Die eigene Marke traegt die
      You-Farbe, alle anderen die Competition-Farbe.

  ── Embeds ──────────────────────────────────────────────────────────────────────────────────
  Erkannt werden YouTube (auch Shorts und youtu.be), TikTok, Instagram, X/Twitter, LinkedIn,
  Reddit und Facebook -- an der URL, ohne zusaetzliches Feld. Fuenf davon sind reine iframes;
  Instagram und X brauchen ihr eigenes Script, das die Komponente laedt und danach ausdruecklich
  zum Verarbeiten auffordert. Kommt ein Script nicht durch, steht ein Link nach draussen da und
  kein leerer Rahmen.

  YouTube und TikTok liefern zusaetzlich Kanal und Titel ueber oEmbed -- ohne Schluessel und mit
  CORS, gemessen am 23.08. AUFRUFZAHLEN gibt es dort nicht: die stehen nur hinter der Data API
  mit Schluessel, und ein Schluessel in Client-JS ist oeffentlich. Lieber eine Zeile weniger als
  eine Zahl, die nicht stimmt.

  ── Run-JS "Render" step (paste as-is, mit echten Beispieldaten, sofort lauffaehig) ─────────

  EIN Backtick je Aufruf, roher JSON-Text -- dasselbe Muster wie in JEDER anderen Komponente
  dieses Repos. Kein Objekt, das aus mehreren Backtick-Werten zusammengebaut wird: jeder
  zusaetzliche Backtick in einem Statement ist eine zusaetzliche Stelle, an der Bubbles rohe
  Einfuegung auf JavaScript-Syntax trifft statt auf den geteilten Textreparatur-Weg (readBubble),
  der genau dafuer gebaut ist.

  Zum Wiring: den Wert ZWISCHEN den Anfuehrungszeichen ersetzen, z.B. wird aus
  "title":"Festivals in Deutschland..."  ->  "title":<dein Bubble-Ausdruck>
  Die Anfuehrungszeichen bleiben stehen. Ein Wert, der selbst ein " enthaelt (ein Titel mit
  Zitat, ein Firmenname mit Anfuehrungszeichen), bricht NICHT mehr: readBubble erkennt am
  naechsten Zeichen, ob das " zur Struktur gehoert oder zum Text, und repariert nur dort, wo es
  noetig ist. markdown_summary hat zusaetzlich sein EIGENES, bekanntes Muster erkannt -- auch
  wenn es selbst unescaptes JSON ist, darf es einfach im Payload stehen bleiben. Gemessen
  (24.08., realer ADAC-Payload aus einem Bugreport, wortgleich): Titel mit Zitat, elf
  Firmennamen, eine Zusammenfassung mit eigenem JSON-in-JSON -- alle liefen roh durch, 0
  Konsolenfehler.

  Jeder der drei Aufrufe unten steht in einem EIGENEN try/catch: fehlt einer der Bubble-
  Ausdruecke (noch), reisst das NICHT die anderen beiden mit. Genau das ist am 24.08. passiert --
  ein undefinierter Wert hat per ReferenceError den ganzen Schritt gestoppt, auch die Aufrufe
  DAVOR liefen dadurch nie durch.

  (function () {
    var INSTANCE_ID = "INSTANCE_ID";   // muss zum data-instance des Elements passen

    var DETAIL = `{"url":"https://www.paulcamper.de/magazin/festivals-2025-in-deutschland","title":"Festivals in Deutschland mit Camping: der Guide für Camper","domain":"paulcamper.de","favicon":"https://www.google.com/s2/favicons?domain=paulcamper.de&sz=128","url_type":"listicle","citation_type":"Brand_Platform","last_seen":"2026-08-23T13:25:01.38037+00:00","domain_share":99.15,"global_share":11.60,"global_rank":1,"description":"Die besten Festivals in Deutschland mit Camping – Techno, Rock, Metal, Reggae &amp; Elektro. Mit dem Camper campst du direkt vor Ort, mitten im Geschehen.","markdown_summary":"{"summary": "Der Festivalguide von Paulcamper stellt die beliebtesten Open-Air-Festivals in Deutschland vor."}","companies":[{"logo_url":"https://www.google.com/s2/favicons?domain=airbeat-one.de&sz=64","company_id":"c392c676-6327-4874-8e3f-a919fff7a76c","company_name":"Airbeat One Festival"}]}`;

    var CONVERSION = `[{"company_id":"215378ad-9322-498a-9331-b44d3d52a98b","company_name":"Nature One","logo_url":"https://www.google.com/s2/favicons?domain=nature-one.de&sz=64","role":"competitor","cited_runs":117,"mentioned_runs":73,"citation_conversion_pct":62.39}]`;

    var t = 0;
    (function go () {
      if (typeof window.setUrlDetail !== "function") { if (t++ < 60) setTimeout(go, 100); return; }
      try { window.setUrlDetail(INSTANCE_ID, DETAIL); } catch (e) { if (window.console) console.error("[url-detail] setUrlDetail:", e); }
      try { window.setUrlDetailConversion(INSTANCE_ID, CONVERSION); } catch (e) { if (window.console) console.error("[url-detail] setUrlDetailConversion:", e); }
      /* Optional -- nur wenn markdown_summary als EIGENER Bubble-Wert vorliegt:
      try { window.setUrlDetailSummary(INSTANCE_ID, `[SUMMARY_TEXT]`); } catch (e) { if (window.console) console.error("[url-detail] setUrlDetailSummary:", e); }
      */
    })();
  })();

  ── Eine Grenze bleibt (gemessen 24.08.) ────────────────────────────────────────────────────
  Ein Wert, der selbst einen BACKTICK oder die Zeichenfolge ${ enthaelt, sprengt weiterhin die
  Zeile -- Eigenschaft von JavaScript-Template-Strings, keine dieser Vorlage. Kommt in normalem
  Seiteninhalt praktisch nie vor (Titel, Beschreibungen); anders als Anfuehrungszeichen, die in
  echtem Text staendig auftauchen.

     ── DER RUN-JS-SCHRITT: EIN BACKTICK, KEIN OBJEKT (STYLEGUIDE §46) ────────────────────────
     NIEMALS ein JS-Objekt im Schritt von Hand bauen. Also NICHT so:

       setUrlDetail("INSTANCE_ID", { url: <ausdruck> })   FALSCH

     Ist einer der Ausdruecke leer, steht dort  url: ,  -- und das ist kein gueltiges JavaScript.
     Der Schritt scheitert dann beim PARSEN, bevor eine einzige Zeile laeuft: "Uncaught
     SyntaxError: Unexpected token ','". Kein Sanitizer und kein Code im Kit kann das abfangen,
     weil nichts davon zur Ausfuehrung kommt -- und weil der GANZE Schritt stirbt, gehen auch die
     Aufrufe DARUNTER mit. So gemeldet am 24.08. an brand-detail: die Komponente blieb im
     Ladezustand stehen, weil ein leerer _prev-Wert den Schritt getoetet hatte, ehe ihr Setter
     ueberhaupt an die Reihe kam.

     RICHTIG ist immer EIN Backtick mit dem ROHEN Text und die beiden Ersetzungen darauf. Im
     Backtick ist ein leeres Feld nur Text; die erste Ersetzung macht daraus null, die zweite
     quotiert Bubbles unquotiertes yes/no. BEIDE Zeilen sind Pflicht.

       (function () {
         var ROH = `{
           "url": "",
           "domain": "",
           "title": "",
           "mentions":
           "citations":
         }`
           .replace(/:\s*([,}\]])/g, ": null$1")
           .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
         /* Jeder Aufruf in seinem EIGENEN try: ein kaputter oder fehlender Ausdruck darf die
            anderen nicht mitnehmen. Und window.<name> statt des nackten Namens -- haengt das
            Element noch an einem aelteren Pin, ist der Name schlicht undefined statt ein
            ReferenceError, der den ganzen Schritt mitnimmt. */
         try { if (window.setUrlDetail) window.setUrlDetail("INSTANCE_ID", ROH); } catch (e) {}
       })();

     Zahlen bleiben OHNE Anfuehrungszeichen -- 3.0, nicht "3.0" -- sonst kommt der Wert als Text
     an und jede Rechnung darauf geht daneben.

     Was bei einem unlesbaren Payload passiert (gemessen am 24.08.): die Komponente beendet den
     Ladezustand und schreibt "The data could not be read. Please reload the page." an die Stelle
     der Daten. Ein WIRKLICH leerer Payload ("" oder "[]") bleibt dagegen der normale
     Leerzustand -- leer und kaputt sind zwei verschiedene Dinge und sehen jetzt auch verschieden
     aus. Ein neuer Ladeversuch raeumt die Meldung weg.

     setUrlDetailSummary und setUrlDetailConversion tragen ebenfalls Daten -- je EIN eigener
     Backtick, je ein try. setUrlDetailLoading nimmt einfache Werte und braucht keinen.

     Die EINZIGE Zeichenfolge, die im Backtick selbst gefaehrlich bleibt, ist ein Backtick oder
     ein Dollar mit geschweifter Klammer in einem WERT. Beides kommt in Marken-, Domain- und
     Themennamen nicht vor; alles andere -- Anfuehrungszeichen, Apostrophe, Umlaute,
     Zeilenumbrueche, Emoji -- traegt er unbeschadet.
-->

<div class="up-root uud-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-brand-fn="bubble_fn_uudBrand"></div>

<script>
(function(){
  /* Loader nach STYLEGUIDE §26: den Pin ueber getElementsByClassName lesen, NIEMALS ueber
     document.currentScript — Bubble fuehrt Scripts nicht in DOM-Reihenfolge aus. */
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_" + "PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("uud-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL: zwei Elemente mit verschiedenen Pins ergeben sonst
     zwei Dateien im Dokument, und welche gewinnt, entscheidet die Ladereihenfolge. Der erste Pin
     gewinnt, ein zweiter wird gemeldet. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  /* core zuerst, async=false haelt die Reihenfolge ein. */
  css("core.css");            js("core.js");
  css("url-detail.css");      js("url-detail.js");
})();
</script>
