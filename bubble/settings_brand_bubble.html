<!--
  UPSTREEM — SETTINGS / YOUR BRAND

  Die erste Unterseite der Einstellungen. Vier Abschnitte: Brand Settings, Model Settings,
  Meta Settings, Danger Zone.

  ── Was hier bearbeitet wird und was nicht ───────────────────────────────────
  Name und Matching Aliases werden NICHT hier bearbeitet. Der Knopf feuert nur usbEditBrand; der
  Editor dafuer ist ein eigener Dialog auf deiner Seite.

  Model Settings und Meta Settings haben je EINEN Speichern-Knopf. Aenderungen laufen bis dahin in
  einen Entwurf und feuern nichts. Der Nutzer stellt in Meta Settings ueblicherweise mehreres
  hintereinander um, und vier einzelne Serverrunden dafuer waeren vier Gelegenheiten, auf halbem
  Weg stehen zu bleiben.

  ── Statisches Markup, Pflicht (bubble/STATISCHES_MARKUP_PFLICHT.md) ─────────
  data-instance    = feste, pro Platzierung eindeutige Zeichenkette. KEIN dynamischer Ausdruck.
  data-cdn-pin     = Commit-Hash, z.B. "a0571a1". Leer oder "CDN_PIN" laedt @main.
  data-isdark      = fest "no". Theme ueber window.upstreemSetTheme("yes"/"no").

  ── Events, alle fn(json) mit EINEM Argument ─────────────────────────────────

  data-editbrand-fn   = "bubble_fn_usbEditBrand_[dynamic id]"
      fn('{}')
      Der Nutzer will Name und Aliases bearbeiten. Oeffne deinen eigenen Editor.

  data-logofile-fn    = "bubble_fn_usbLogoFile_[dynamic id]"
      fn('{"name":"logo.png","type":"image/png","size":21544,"data":"data:image/png;base64,…"}')
      Der Nutzer hat eine Datei gewaehlt. Die Komponente hat Typ und Groesse bereits geprueft
      (PNG oder SVG, hoechstens 1 MB) und zeigt die Vorschau schon an -- kommt dieses Event an,
      ist die Datei gueltig. `data` ist eine Data-URL, die Bubble direkt ablegen kann. Melde die
      endgueltige URL danach zurueck:
          window.setSettingsBrandLogo("INSTANCE_ID", "https://…/logo.png", "logo.png");

  data-logourl-fn     = "bubble_fn_usbLogoUrl_[dynamic id]"
      fn('{"url":"https://…/logo.png"}')
      Der eingeklappte Weg ohne Upload: eine Bild-URL wurde eingetragen.

  data-models-fn      = "bubble_fn_usbModels_[dynamic id]"
      fn('{"model_keys":"gpt-4o,claude,gemini"}')
      Feuert ERST beim Klick auf "Save models", nicht bei jedem Umschalten. Die VOLLSTAENDIGE neue
      Auswahl als kommagetrennte Liste, nicht die Aenderung. In Bubble mit ":split by" Komma zu
      einer Liste machen. Ueber dem Limit laesst die Komponente kein weiteres Modell zu -- pruefe
      es serverseitig trotzdem, ein Klick im DOM ist keine Berechtigung.

  data-meta-fn        = "bubble_fn_usbMeta_[dynamic id]"
      fn('{"market_id":"de","business_model":"b2b","industry":"Consulting & Agencys","summary":"…"}')
      EIN Event fuer den ganzen Meta-Settings-Block, gefeuert beim Klick auf "Save settings".
      Markt, Business Model, Industry und Summary laufen bis dahin in einen Entwurf. business_model
      ist "b2b" | "b2c" | "hybrid".

  data-saved-fn       = "bubble_fn_usbSaved_[dynamic id]"
      fn('{"block":"models"}')     block: "models" | "meta"
      Feuert direkt nach einem erfolgreichen Klick auf einen der beiden Speichern-Knoepfe, noch
      bevor der Server geantwortet hat. Gedacht fuer die Rueckmeldung "Changes saved". Fehlt das
      Attribut, meldet die Konsole bei jedem Speichern "usbSaved not found on window/parent/top" --
      die Komponente selbst funktioniert weiter, der Knopf graut aus und "Unsaved changes"
      verschwindet.

  data-leave-fn       = "bubble_fn_usbLeaveTeam_[dynamic id]"
  data-delete-fn      = "bubble_fn_usbDeleteTeam_[dynamic id]"
      fn('{"team_id":"…","team_name":"…"}')
      Beide feuern ERST, wenn der Nutzer den Teamnamen korrekt getippt hat. Delete zusaetzlich
      erst nach einem zweiten Klick auf denselben Knopf. Kommt eines dieser Events an, ist die
      Bestaetigung vollstaendig durchlaufen -- du brauchst keinen weiteren Sicherheitsdialog.

  ── Der Speicher-Rundlauf: Settings -> Seite -> Header -> zurueck ────────────
  Nach dem Speichern zeigt der Team-Header oben auf der Seite noch die alten Daten. Der
  Speicher-Workflow haengt aber an diesem Element -- von hier erreicht kein Bubble-Workflow ein
  Custom Event der Seite. Die Bruecke dorthin ist upstreemSignal aus core.js.

  EINMAL PRO SEITE anzulegen, nicht pro Element:
    Ein JavaScriptToBubble-Element namens  bubble_fn_upSignal  (Value type TEXT, Trigger event an).
    Es bekommt   {"team_id":"…","channel":"account_updated","detail":"meta"}
    channel  :extract with Regex  "channel":"([^"]*)"   :first item
    detail   :extract with Regex  "detail":"([^"]*)"    :first item   (hier "meta" oder "models")

  Der Ablauf, Schritt fuer Schritt:

    1. Nutzer klickt Save.
       -> usbMeta bzw. usbModels feuert. Die Komponente sperrt sich im selben Moment SELBST:
          Skelett an, Klicks und Tastatur aus. Dafuer ist nichts zu tun.
    2. Workflow am usbMeta-Element:
       Schritt 1  Run javascript:  setSettingsBrandLoading("<instance>", "yes")
                  (schadet nicht doppelt, deckt aber den Fall ab, dass der Nutzer die Seite
                   zwischendurch wechselt und die Komponente neu aufgebaut wird)
       Schritt 2  die Daten schreiben (RPC / Make changes)
       Schritt 3  Run javascript:  upstreemSignal("account_updated", "meta")
                  ERST HIER, nicht frueher. Feuerte die Komponente das Signal selbst beim Klick,
                  liefen Schreiben und Header-Neuladen gleichzeitig, und der Header holte mit
                  guter Wahrscheinlichkeit noch den alten Stand.
    3. Workflow am bubble_fn_upSignal-Element (auf der SEITE, nicht im Element):
       Only when: channel is "account_updated"
       -> Team-Header-RPC neu holen, Header setzen.
    4. Am Ende DESSELBEN Workflows, wenn die Header-Daten da sind, genau EIN Schritt:
       Run javascript:  setSettingsBrandLoading("<instance>", "no")

       Kein renderSettingsBrand. Die Werte stehen zu diesem Zeitpunkt schon im Element: sie
       kommen als data-Attribute aus den Reusable-Properties (siehe "Fuellen" weiter unten), und
       die Komponente beobachtet diese Attribute und zeichnet von selbst neu, sobald Bubble sie
       neu schreibt. Dieser Aufruf sagt nur "die Daten sind jetzt da" und loest die Sperre.

       EINE Ausnahme: die Modellauswahl steht in KEINEM Attribut, sie kommt nur ueber
       renderSettingsBrand. Beim Speichern der Modelle braucht es das trotzdem nicht -- die
       Komponente hat die Auswahl beim Klick selbst uebernommen, die Anzeige stimmt also schon.
       Noetig wird es nur, wenn der Server die Auswahl KORRIGIERT (Planlimit, ein Modell nicht
       mehr verfuegbar). Dann in Schritt 4 zusaetzlich renderSettingsBrand mit der models-Liste,
       sonst zeigt die Seite eine Auswahl, die der Server so nicht gespeichert hat.

       Ohne ihn bleibt die Komponente gesperrt, bis der eingebaute Wecker nach 12s von selbst
       entsperrt und eine gelbe Hinweiszeile zeigt ("Saving is taking longer than expected").
       Das ist die Notbremse, nicht der Normalweg -- steht die Zeile im Alltag da, fehlt Schritt 4.

  Waehrend der Sperre ist die ganze Komponente inert: kein Klick, kein Tabben, kein Tippen. Das
  ist Absicht -- eine Aenderung, die waehrenddessen gemacht wird, waere gegen einen Stand gemacht,
  den der Server schon nicht mehr hat, und die zurueckkommenden Daten wuerden sie kommentarlos
  ueberschreiben.

  upstreemSignal ist nicht auf die Einstellungen beschraenkt. Der Kanal ist frei waehlbar, und ein
  weiterer Anlass braucht kein zweites Element -- nur einen weiteren Zweig im selben Workflow:
    upstreemSignal("topics_changed")     upstreemSignal("brands_changed")

  Liegt kein bubble_fn_upSignal auf der Seite, stirbt der Run-JavaScript-Schritt NICHT: die
  Funktion existiert ueberall, wo core.js geladen ist, versucht es 3s lang und schreibt dann eine
  Warnung in die Konsole. Der Rest des Schrittes laeuft weiter.

  ── Fuellen ──────────────────────────────────────────────────────────────────
  Die einzelnen Werte kommen als data-Attribute ins Markup, NICHT ueber Run-JS. Grund: ein Wert,
  der als Quelltext in einen JS-String eingesetzt wird, bricht ihn, sobald er ein
  Anfuehrungszeichen oder einen Zeilenumbruch enthaelt -- ein Teamname mit " oder eine mehrzeilige
  Zusammenfassung reichen. Dann wird der GANZE Schritt nicht mehr geparst, und alles darin faellt
  aus, auch setUpstreemAllMarkets. Als Attribut kann das nicht passieren: Bubble schreibt den Wert
  selbst ins Markup und kodiert ihn dabei.

    data-brand-name        Name der Marke
    data-brand-logo        Logo-URL
    data-team-id           Team-ID, geht in die Leave/Delete-Events
    data-team-name         Teamname, muss im Danger-Dialog getippt werden
    data-brand-market      Alpha-2 des Standardmarkts, z.B. "de"
    data-brand-business    "b2b" | "b2c" | "hybrid"
    data-brand-industry    die gewaehlte Branche
    data-brand-summary     die Zusammenfassung, darf mehrzeilig sein

  Alle duerfen dynamische Ausdruecke sein und spaeter aufloesen -- die Komponente beobachtet die
  Attribute und zeichnet neu, sobald sich eines aendert.

  ── Die Marktliste braucht einen Stub IM SEITENKOPF ──────────────────────────
  Zeigt die Diagnose beim Oeffnen der Marktauswahl "Aufrufe 0", dann ist der Aufruf gar nicht bei
  core.js angekommen: setUpstreemAllMarkets existiert zu dem Zeitpunkt noch nicht, der Aufruf wirft
  "is not a function" und reisst den Rest desselben Workflow-Schrittes mit.

  Der Stub gehoert deshalb an die frueheste Stelle der Seite -- in Bubble unter
  Settings > SEO/metatags > "Script/meta tags in header":

      <script>
      (function(){
        var q = window.__upstreemMarketQueue = window.__upstreemMarketQueue || [];
        if (typeof window.setUpstreemAllMarkets !== "function")
          window.setUpstreemAllMarkets = function(rows){ q.push({ all: true,  rows: rows }); return true; };
        if (typeof window.setUpstreemMarkets !== "function")
          window.setUpstreemMarkets    = function(rows){ q.push({ all: false, rows: rows }); return true; };
      })();
      </script>

  core.js holt beim Laden nach, was dort gemerkt wurde. Der Stub im Loader dieser Komponente
  reicht dafuer NICHT: er laeuft erst, wenn das Element gerendert wird, und der Pageload-Workflow
  ist frueher dran.

  Die Marktliste kommt NICHT hierher. Sie steht seitenweit im Store: ein
  window.setUpstreemAllMarkets(...) beim Seitenaufbau, und jede Komponente liest sie von dort --
  dieselbe wie in add-prompts und den Markt-Filtern. Diese Seite liest UC.getAllMarkets() und
  horcht auf Aenderungen, ein zweiter Aufruf hier waere dieselbe RPC ein zweites Mal.

  Ueber Run-JS kommt nur, was kein Attribut sein kann:

      var RAW = `[Ergebnis der Modelle-RPC]`
        .replace(/:\s*([,}\]])/g, ": null$1")
        .replace(/:\s*(yes|no)\s*([,}\]])/g, function(_, v, t){ return ": " + (v === "yes") + t; });
      var models = [];
      try { models = JSON.parse(RAW); } catch (e) { console.error("[settings] models: " + e.message); }
      window.renderSettingsBrand({ instanceId: "settings_brand", models: models });

  Der Wert ist JSON aus einer RPC und gehoert in Backticks. Die beiden replace-Zeilen sind der
  Sanitizer, und beide reparieren einen Bubble-Transportschaden am JSON:

    Zeile 1  Ein Schluessel, auf den direkt , } oder ] folgt, bekommt null. Bubble laesst JSON-null
             sonst spurlos verschwinden:  "rank_prev": ,
    Zeile 2  Ein nacktes yes/no wird zu true/false. Bubble schreibt einen Boolean als yes bzw. no
             OHNE Anfuehrungszeichen ins JSON:  "user_can_manage": yes,   Das ist kein gueltiges
             JSON, und JSON.parse bricht genau dort ab ("Unexpected token 'y'"). Ein echter
             Textwert "yes" steht in Anfuehrungszeichen und bleibt unberuehrt.

  window.setSettingsBrandLoading("INSTANCE_ID", "yes" | "no");
  window.setSettingsBrandLogo("INSTANCE_ID", "https://…", "datei.png");
  window.resetSettingsBrand("INSTANCE_ID");

  renderSettingsBrand versteht weiterhin brand/team/market/business_model/industry/summary im
  Payload. Das uebersteuert die Attribute und ist der Weg, eine Speicher-Bestaetigung
  zurueckzuspielen: { instanceId, summary } aktualisiert nur die Zusammenfassung.

  ── Beim Seitenwechsel ───────────────────────────────────────────────────────
  Der Danger-Dialog haengt am document.body, nicht im Markup dieser Komponente, damit ihn kein
  overflow:hidden eines Vorfahren abschneidet. Verlaesst der Nutzer die Seite, waehrend der Dialog
  offen ist, ruf window.resetSettingsBrand("INSTANCE_ID") -- sonst steht er ueber der neuen
  Ansicht.

  ── Markup ───────────────────────────────────────────────────────────────────
-->
<div class="up-root usb-root"
     data-instance="settings_brand"
     data-cdn-pin="CDN_PIN"
     data-isdark="no"
     data-brand-name="BRAND_NAME"
     data-brand-logo="BRAND_LOGO_URL"
     data-team-id="TEAM_ID"
     data-team-name="TEAM_NAME"
     data-brand-market="de"
     data-brand-business="b2b"
     data-brand-industry="INDUSTRY"
     data-brand-summary="SUMMARY"
     data-editbrand-fn="bubble_fn_usbEditBrand_ID"
     data-logofile-fn="bubble_fn_usbLogoFile_ID"
     data-logourl-fn="bubble_fn_usbLogoUrl_ID"
     data-models-fn="bubble_fn_usbModels_ID"
     data-meta-fn="bubble_fn_usbMeta_ID"
     data-saved-fn="bubble_fn_usbSaved_ID"
     data-leave-fn="bubble_fn_usbLeaveTeam_ID"
     data-delete-fn="bubble_fn_usbDeleteTeam_ID"></div>

<script>
(function(){
  /* Stub VOR core.js: ein Run-JS-Schritt beim Seitenaufbau kann frueher laufen als core.js. Ohne
     diesen Stub wirft setUpstreemAllMarkets("...") mit "is not a function", der Store bleibt leer,
     und die Marktauswahl zeigt kommentarlos die gefilterte Liste. Der Aufruf wird hier gemerkt und
     von core.js nachgeholt, sobald es da ist. */
  if (typeof window.setUpstreemAllMarkets !== "function"){
    window.__upstreemMarketQueue = window.__upstreemMarketQueue || [];
    window.setUpstreemAllMarkets = function(rows){
      window.__upstreemMarketQueue.push({ all: true, rows: rows }); return true;
    };
  }
  if (typeof window.setUpstreemMarkets !== "function"){
    window.__upstreemMarketQueue = window.__upstreemMarketQueue || [];
    window.setUpstreemMarkets = function(rows){
      window.__upstreemMarketQueue.push({ all: false, rows: rows }); return true;
    };
  }
  /* Dasselbe fuer die Setter dieser Komponente. Der Pageload-Workflow ruft
     setSettingsBrandLoading und renderSettingsBrand, bevor settings-brand.js vom CDN da ist --
     ohne diese Stubs wirft der Aufruf "is not a function" und ist verloren. Genau daran lagen der
     tote Ladezustand und die leere Modell-Liste. */
  window.__usbBootQueue = window.__usbBootQueue || [];
  ["renderSettingsBrand", "setSettingsBrandLoading", "setSettingsBrandLogo", "resetSettingsBrand"]
    .forEach(function(n){
      if (typeof window[n] === "function") return;
      window[n] = function(){ window.__usbBootQueue.push([n, arguments]); };
    });
  var root = document.querySelector(".usb-root[data-cdn-pin]");
  var pin = root ? String(root.getAttribute("data-cdn-pin") || "").trim() : "";
  /* Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
     Waechter treffen -- der Vergleich waere dann pin === "<der Hash>" und der Loader liefe
     dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
  if (!pin || pin === "CDN_" + "PIN") pin = "main";
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + pin + "/";
  function css(href){
    if (document.querySelector('link[href="' + href + '"]')) return;
    var l = document.createElement("link"); l.rel = "stylesheet"; l.href = href;
    document.head.appendChild(l);
  }
  function js(src, done){
    if (document.querySelector('script[src="' + src + '"]')) { done && done(); return; }
    var s = document.createElement("script"); s.src = src; s.onload = function(){ done && done(); };
    document.head.appendChild(s);
  }
  css(base + "core.css");
  css(base + "settings-brand.css");
  js(base + "core.js", function(){ js(base + "settings-brand.js"); });
})();
</script>

<!--
  ── Der Render-Schritt in Bubble ─────────────────────────────────────────────
  Bubble reicht den RPC-Text als Quelltext in den Run-JS-Schritt, und dabei geht JSON-null
  verloren: aus  "score": null,  wird  "score": ,  und JSON.parse wirft. Gleiche Bauart wie in
  brands_overview_bubble.html:

      var RAW = `[RPC-Ergebnis]`
        .replace(/:\s*([,}\]])/g, ": null$1")
        .replace(/:\s*(yes|no)\s*([,}\]])/g, function(_, v, t){ return ": " + (v === "yes") + t; });
      var payload = JSON.parse(RAW);
      payload.instanceId = "settings_brand";
      window.renderSettingsBrand(payload);

  Die replace-Zeile setzt einen Schluessel, auf den direkt , } oder ] folgt, auf null. Heiles JSON
  laesst sie unangetastet. Sie gehoert in JEDEN Run-JS-Schritt, der diese RPC liest.
-->
