<!--
  ============================================================================================
  TEAM ORGA — Bubble-Vorlage (Settings-Bereich)
  ============================================================================================
  Mitglieder, offene Einladungen und das Protokoll des Teams -- drei Abschnitte in EINEM Element.

  EINSETZEN
  1. HTML-Element auf die Settings-Seite, dieses Markup hinein.
  2. INSTANCE_ID durch eine FESTE Kennung ersetzen (z. B. "teamorga"). Kein dynamischer Ausdruck --
     siehe bubble/STATISCHES_MARKUP_PFLICHT.md: ein Element mit dynamischem Inhalt wird von Bubble
     bei jeder Aenderung komplett neu gebaut.
  3. CDN_PIN durch den Commit-Hash ersetzen, denselben wie an allen anderen Elementen der Seite.
  4. data-isdark bleibt "no" und wird NICHT dynamisch gesetzt. Das Thema kommt ueber
     window.setUpstreemTheme("dark") / ("light").
  5. data-team auf die Id des AKTUELLEN Teams (Current User's Team's unique id). core haengt sie an
     jedes Ereignis dieser Komponente -- ohne sie weiss der Workflow nicht, welches Team gemeint ist.
  6. data-user auf die Id des angemeldeten Nutzers (Current User's unique id). Nur dafuer: die
     Marke "You" an der eigenen Zeile. Wer lieber die E-Mail einsetzt, nimmt data-user-email --
     eines von beiden genuegt. Steht keines, gibt es die Marke nicht (geraten wird nicht, und in
     der echten Nutzlast stehen zwei Zeilen mit demselben Anzeigenamen).
  7. FIT HEIGHT am HTML-Element und "Fit height to content" auch an der Gruppe darum. Die drei
     Tabellen wachsen mit ihren Zeilen; steht dort eine feste Hoehe, schneidet Bubble den Rest ab.
  8. Der Seitenkopf der Settings-Seite ist ein EIGENES Element (page-headers/settings-...). Diese
     Komponente bringt keinen mit -- sie faengt mit dem Abschnitt "Team Members" an.

  DATEN HINEIN (ein Run-javascript-Schritt, unten in diesem Kommentar)
     renderTeamOrga({ instanceId, members, permissions, viewer_role, pending_invites })
     setTeamOrgaInvites(INSTANCE_ID, { count, invites })
     setTeamOrgaLog(INSTANCE_ID, [ ... ])
     setTeamOrgaLoading(INSTANCE_ID, "yes")     Skelett an, waehrend die RPCs laufen
     resetTeamOrga(INSTANCE_ID)                 zurueck auf leer

  WER WAS DARF -- das entscheidet der SERVER, nicht diese Komponente
  Die Komponente zeigt eine Aktion nur, wenn BEIDES zutrifft: das passende Flag aus
  permissions steht auf true UND die Rollenregel erlaubt es. Die Regeln sind:

     Member   sieht keine Aktion.
     Admin    verwaltet MEMBER: entfernen und zum Admin machen. Admins und Besitzer nicht.
     Owner    alles -- ausser: der LETZTE Besitzer kann sich weder entfernen noch seine Rolle
              abgeben, sonst stuende ein Team ohne Besitzer da.

  Das ist AUSSCHLIESSLICH die Sichtbarkeit im Menue. Die Pruefung muss im RPC stehen: ein Klick,
  den nur die Seite verbietet, ist ein Loch. In der Beispielnutzlast steht viewer_role "admin" mit
  can_manage_members: true und can_manage_roles: false -- dann gibt es Entfernen, aber kein
  Befoerdern, und genau so zeigt es die Komponente.

  EREIGNISSE HERAUS (jedes mit einem JSON-Text als erstem Parameter)
     utoInvite   { "team_id":"...", "email":"neu@test.de", "role":"member" }
     utoRevoke   { "team_id":"...", "invite_id":"...", "email":"..." }
     utoRemove   { "team_id":"...", "user_id":"...", "email":"...", "self":false }
     utoRole     { "team_id":"...", "user_id":"...", "email":"...", "role":"admin" }

  DIE WERTE IN BUBBLE LESEN (extract with Regex)
     Ids, Rollen und Adressen enthalten kein Anfuehrungszeichen:

         (?<="email":")[^"]*
         (?<="role":")[^"]*
         (?<="user_id":")[^"]*
         (?<="invite_id":")[^"]*
         (?<="self":)[a-z]+

  NACH JEDEM EREIGNIS: Daten neu holen und die drei Setter erneut rufen. Die Komponente aendert
  ihren Zustand NICHT von sich aus -- eine Zeile, die sich schon geaendert hat, waehrend der RPC
  noch laeuft, luegt bei jedem Fehlschlag. Siehe auch die Refresh-Anhaenge der anderen Seiten.

  WAS DIE KOMPONENTE NICHT TUT
  - Sie laedt nichts nach und blaettert nicht. Ein Team hat eine Handvoll Mitglieder; das
    Protokoll kommt in einem Stueck und scrollt ab 14 Zeilen in seinem eigenen Ausschnitt.
  - Sie sortiert die Mitglieder nicht um. Die Reihenfolge ist die des RPC.
  - Sie schickt keine E-Mail. Der Dialog feuert utoInvite, den Versand macht der Workflow.
  ============================================================================================
-->
<div class="up-root uto-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="no"
     data-team="TEAM_ID"
     data-user="USER_ID"
     data-user-email=""
     data-invite-fn="bubble_fn_utoInvite"
     data-revoke-fn="bubble_fn_utoRevoke"
     data-remove-fn="bubble_fn_utoRemove"
     data-role-fn="bubble_fn_utoRole"></div>

<script>
(function(){
  /* ---- Boot-Stubs, VOR dem Nachladen ------------------------------------------------------
     Bubble ruft die Setter im Page-Load-Workflow, regelmaessig BEVOR team-orga.js geladen ist.
     Ohne diesen Block laeuft der Run-JS-Schritt in seinen typeof-Waechter und der Aufruf ist WEG
     -- die Seite steht danach im Skelett, ohne dass irgendwo ein Fehler steht. Dieselbe Loesung
     wie in teams_bubble.html: hier stubben, team-orga.js erkennt es an __utoBootStubbed und laesst
     die Namen stehen, makeMount arbeitet die Queue in der Reihenfolge ab, in der Bubble gerufen
     hat. */
  window.__utoBootQueue = window.__utoBootQueue || [];
  if (!window.__utoBootStubbed){
    window.__utoBootStubbed = true;
    ["renderTeamOrga", "setTeamOrgaInvites", "setTeamOrgaLog", "setTeamOrgaLoading",
     "resetTeamOrga"].forEach(function(n){
      if (typeof window[n] === "function") return;
      window[n] = function(){ window.__utoBootQueue.push([n, [].slice.call(arguments)]); };
    });
  }

  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       jsDelivr antwortet mit 404, und weder CSS noch JS landen. Ohne trim greift auch kein
       Rueckfall, weil "   " truthy ist.
       Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
       Waechter treffen, und der Loader liefe dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* ---- Rueckfall: einen Pin nehmen, der auf DIESER Seite schon gilt ----------------------
       Gemeldet am 31.08. mit drei Stapelspuren, alle aus einem solchen Loader: "core.css ist
       schon von einem anderen Pin geladen ... ignoriert wird @main" -- obwohl der Pin am Element
       stand. Der Grund ist die Reihenfolge: Bubble baut ein Element bei jedem Rerender neu und
       fuehrt Scripts nicht in DOM-Reihenfolge aus, dieser Loader lief also, waehrend seine eigene
       Wurzel noch nicht im Dokument stand -- die Klasse oben fand nichts.
       Und das war mehr als eine Warnung: core kam durch die Entdoppelung unten noch aus dem Pin,
       die Dateien DIESER Komponente aber tatsaechlich von @main. Eine Seite, die zur Haelfte auf
       @main laeuft, ist genau das, was ein Pin verhindern soll.
       Geraten wird nichts: jede der drei Stufen liest einen Pin, der auf dieser Seite schon in
       Gebrauch ist. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* Aus einer schon geladenen Datei ablesen. Diese Stufe greift auch dann, wenn alle anderen
       Elemente der Seite noch die ALTE Fassung dieses Loaders tragen -- die fuellen
       __upAssetsLoaded genauso. "main" wird NICHT gemerkt: das ist kein Pin, und die naechste
       Komponente wuerde ihn sonst fuer einen halten. */
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("uto-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  css("core.css");   js("core.js");
  css("team-orga.css");  js("team-orga.js");
})();
</script>

  RUN JAVASCRIPT — Schritt 2: die ECHTEN RPCs
  ============================================================================================
  Sobald Schritt 1 sichtbar funktioniert, kommt derselbe Aufruf mit den Bubble-Ausdruecken. Die

  anderen Komponenten darunter.

<script>
