  ── Was die Seite selbst regelt ───────────────────────────────────────────────
  - Team aus setUpstreemTeam, Marken aus setUpstreemBrands (die Liste "All Brands" im Chart-
    Filter), Models/Markets/Topics der Filter aus den globalen Stores.
  - Zeitraum aus dem eigenen Kalender; "Apply everywhere" gilt app-weit wie bisher. Models,
    Markets und Topics gelten fuer Tracked UND Discover.
  - "Add Brand" (Kopf) und "Track" (Discover) oeffnen den Dialog add-brand.js; gespeichert wird
    ueber die Seite, nicht ueber den Bubble-Workflow.
  - Nach Aenderungen fuellt die Seite die Marken-Ablage der App selbst (aus brands_page_meta_v1,
    mit role) -- Seitenleiste, Filter und alle Marken-Menues stimmen sofort, ohne Workflow.
  - Loeschen: nur owner/admin (fuer member fehlt der Menueeintrag), mit Bestaetigungsdialog.
  - Reiter in der Adresse: ?br=discover. Zurueck/Vor wechselt den Reiter.
  - Zeilenklick: openDrawer("brand", company_id). "Edit": openDrawer("companysettings",
    company_id) -- der Marken-Editor ist #drawer-companysettings (11.10. bestaetigt).

  ── Attribute ─────────────────────────────────────────────────────────────────
  data-instance   optional, Vorgabe "brands_page". Nur noetig, wenn die Seite zweimal steht.
  data-adresse    optional, "aus": die Komponente laesst die Adresse in Ruhe (?br).
  data-export-instance  optional: die Kennung des Export-Elements. Ohne Angabe nimmt die Seite
                  das Export-Element, das auf der Seite steht (Typ brands).
  Kein data-isdark, kein data-cdn-pin: das Thema setzt core, den Pin das Header-Script.
