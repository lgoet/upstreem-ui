  ── Marken kommen jetzt SEITENWEIT ───────────────────────────────────────────
  Ein Aufruf pro Seite, nicht mehr einer pro Placement:

      window.setUpstreemBrands(brandsJson);
        Feldnamen frei: {id|company_id, name|label, logo|logo_url|favicon|favicon_url} -- der Store
        normalisiert und legt jede Zeile unter ALLEN diesen Namen ab, damit jede Komponente
        findet, was sie sucht. Zusatzfelder (role, position, ...) bleiben erhalten.
        Protokoll-relative Logo-URLs ("//cdn...") werden auf https:// gezogen.

  Jede Komponente mit einer Marken-Auswahlliste zieht daraus -- Tabellen, Charts, Quick Actions,
  Performance Radar. Der komponenteneigene Setter weiter unten bleibt bestehen und funktioniert
  unveraendert; er ist ab jetzt nur noch der Rueckfall. Ein LEERER Store ueberschreibt nie, eine
  Seite ohne setUpstreemBrands() verhaelt sich also exakt wie vorher.

  Gegenrichtung: wer eine Marke anlegt, umbenennt oder deaktiviert, ruft
  window.upstreemBrandsChanged() -- dafuer ein Toolbox-Element "JavaScript to Bubble" namens
  upBrandsChanged anlegen (Trigger event angehakt), dessen Workflow den Marken-RPC neu laufen
  laesst und setUpstreemBrands() ruft. Ohne das erscheinen neue Marken erst nach einem Reload.
  UPSTREEM — BRANDS OVERVIEW

  Standalone page component, two stacked containers 32px apart:

    1) CHART CONTAINER
       Header: "Visibility over Time" left; right (in order) the Day/Week/Month granularity
       switcher, the "All Brands" filter and the chart-type switch (Linechart | Landscape).
       · Linechart (default) is the SAME chart visibility-chart draws, from the same RPC.
       · Landscape is a matrix: Visibility on X, Sentiment on Y, one brand logo per point, split
         into four quadrants (High-Potential Players / Dominant & Trusted / At Risk / Controversial).
       In Linechart mode, hovering the chart reveals the gear "Chart Settings" button. Both of its
       settings (colour scale, Line Width) are PAGE-WIDE: set either one here or in the
       visibility-chart component and every chart on the page follows immediately.
       In Landscape mode there is no gear — a scatter of logos has no lines to style. It gets a
       Sentiment | Ranking switch instead, which is what the Y axis plots (X is always Visibility).
       The eye button top right hides/shows the whole chart container, same as citations-combo-chart.
       Switching Linechart <-> Landscape is PURELY CLIENT-SIDE — both are drawn from the payload
       already in the browser, so there is no event and nothing to refetch.

    2) TABLE CONTAINER
       Header: Active/Inactive switcher left; right (left to right) Sort, Search, Table Settings,
       Export. Columns in the ACTIVE view: #, Brand, Visibility, Ranking, Sentiment, Actions.
       The INACTIVE view is a different table: Brand, Deactivated, Actions.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance    = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin     = commit hash to load from — leave EMPTY (or the literal "CDN_PIN" placeholder)
                     to load @main. Point this at a Bubble constant you control so every placement
                     can be repinned in one edit; @main itself lags jsDelivr's cache for hours.
  data-isdark      = "yes" / "no"
  data-processing  = "yes" / "no"   loading state, source 1 (ORed together)
  data-processing2 = "yes" / "no"   loading state, source 2 (ORed together)

  ── Event names must be unique per placement ─────────────────────────────────
  data-gran-fn         = "bubble_fn_uboGranularity_[dynamic id]"
  data-submit-fn       = "bubble_fn_uboSubmitBrands_[dynamic id]"
  data-sort-fn         = "bubble_fn_uboSortTable_[dynamic id]"
  data-status-fn       = "bubble_fn_uboStatus_[dynamic id]"
  data-export-fn       = "bubble_fn_uboExportTable_[dynamic id]"
  data-rowclick-fn     = "bubble_fn_uboRowClick_[dynamic id]"
  data-setinactive-fn  = "bubble_fn_uboSetInactive_[dynamic id]"
  data-edit-fn         = "bubble_fn_uboEdit_[dynamic id]"
  data-activate-fn     = "bubble_fn_uboActivate_[dynamic id]"

  Each fires ONE RAW value via fn(value) — not JSON, no regex needed on your side:

    NOTE: the toolbar Search is NOT in this list. It filters the rows already in the table, in the
    browser, and fires nothing — there is no bubble_fn_uboSearch and no data-search-fn any more.
    Matches are highlighted the same way every other table highlights them.

    gran         "day" | "week" | "month"
    submit       comma-joined company-id string, e.g. "12,47,90"
                 -> Bubble field type must be "text", NOT "list of texts"
    sort         "<field>_<dir>", field is visibility | rank | sentiment  (e.g. "rank_asc")
    status       "active" | "inactive"   -> refill the TABLE only, the chart does not change
    export       the instanceId
    rowclick     a company_id — fired by a TABLE ROW, a LEGEND item and a LANDSCAPE logo alike,
                 so one workflow covers all three
    setinactive  the row's company_id      (Actions -> Set Inactive)
    edit         the row's company_id      (Actions -> Edit)
    activate     the row's company_id      (Actions -> Activate, Inactive view only)

  ── Filling the component ────────────────────────────────────────────────────
  One Run-JS step, exactly like visibility-chart's — several RPCs, each in its own backtick slot,
  assembled into ONE payload. renderBrandsOverview merges per key (a key you leave out stays as it
  was), so you can also re-run a stripped-down copy of the step that only carries `table` when
  sort/search/status change.

  window.renderBrandsOverview({ instanceId, isDark, granularity, totalCount, totalCountInactive,
                                series, companies, filterCompanies, table, inactive });
  window.setBrandsOverviewInactive("INSTANCE_ID", RAW_STRING_OR_ARRAY);   // refresh only that list
  window.setBrandsOverviewLoading("INSTANCE_ID", "yes" | "no");
  window.setBrandsOverviewTheme("INSTANCE_ID", "yes" | "no");
  window.resetBrandsOverview("INSTANCE_ID");

  Which RPC feeds what:
    series          [{ company_id, day, visibility_pct }, ...]                    Linechart
    companies       [{ company_id, name, color, favicon_url,
                       visibility_window_pct }, ...]                              Linechart + legend
    filterCompanies [{ company_id, name, color, favicon_url }, ...]               "All Brands" list
    table           [{ company_id, name, logo_url, position,
                       visibility_pct, visibility_delta_pct,
                       avg_rank, avg_rank_delta,
                       sentiment, sentiment_delta }, ...]                         Active table
    inactive        [{ company_id, name, favicon_url, deactivated_at }, ...]      Inactive table
    totalCount / totalCountInactive                                               the two head counts
    granularity     "day" | "week" | "month"   optional, only applied before the user picks one

  The Landscape chart is drawn from `table`, not from `series` — it needs visibility_pct +
  sentiment + avg_rank per brand, and only that array carries them. A payload without `table`
  shows the Linechart but leaves Landscape empty.

  !! NEVER paste an RPC result straight into the JS as an array literal. Bubble's raw output is NOT
  valid JavaScript: a null column arrives as `"sentiment":,` — nothing between colon and comma —
  and the step dies with "Unexpected token ','" before any of this code runs. Every raw slot below
  sits in a backtick string and goes through toArr(), which repairs exactly that.

  ── Run-JS "Render" step (paste as-is, drop your RPC expressions into the slots) ──
  Same step as visibility-chart's, one payload per component, one backtick slot per RPC.

  (function () {
    // --- Sanitizer: rohen/kaputten Bubble-Output -> gueltige Arrays ---
    function toArr(raw) {
      var s = String(raw == null ? "" : raw).trim();
      if (!s) return [];
      if (s[0] === "{") s = "[" + s + "]";
      s = s.replace(/:\s*([,}\]])/g, ": null$1");
      s = s.replace(/,\s*([}\]])/g, "$1");
      try { return eval("(" + s + ")"); } catch (e) { return []; }
    }
    // --- Sanitizer: rohen/leeren Bubble-Output -> gueltige Zahl ---
    function toNum(raw) {
      var s = String(raw == null ? "" : raw).trim();
      var n = parseFloat(s.replace(/,/g, ""));   // falls Bubble Tausender-Kommas liefert
      return isNaN(n) ? 0 : n;
    }
    var payload = {
      instanceId: "brands_overview_",
      isDark: ``,
      granularity: ``,
      totalCount: toNum(``),
      totalCountInactive: toNum(``),
      series: toArr(`[]`),


      companies: toArr(`[]`),


      table: toArr(`[]`),


      filterCompanies: toArr(`[]`),


      inactive: toArr(`[]`)
    };

    var t = 0;
    (function go () {
      var fn = window.renderBrandsOverview
            || (window.parent && window.parent.renderBrandsOverview)
            || (window.top && window.top.renderBrandsOverview);
      if (typeof fn === "function") { fn(payload); return; }
      if (t++ < 60) setTimeout(go, 100);
    })();
  })();

  Every key is applied on its own and a key you leave out stays as it was, so you can also run a
  stripped copy of this step that carries only `table` + `totalCount` when sort or the
  Active/Inactive switch fires — the chart then does not refetch.

  ── Inactive brands — optional extra step ────────────────────────────────────
  The `inactive` slot in the step above already covers the normal case. This smaller step exists
  for refreshing ONLY that list without re-sending the whole payload — after an Activate or
  Set Inactive action, so the two tabs stay in sync without refetching the chart.

  (function () {
    var INSTANCE_ID = `INSTANCE_ID`;
    var RAW = `[INACTIVE_BRANDS_RPC_RESPONSE]`;
    // [{company_id, name, favicon_url, deactivated_at}, …]
    var t = 0;
    (function go () {
      var fn = window.setBrandsOverviewInactive
            || (window.parent && window.parent.setBrandsOverviewInactive)
            || (window.top && window.top.setBrandsOverviewInactive);
      if (typeof fn === "function") { fn(INSTANCE_ID, RAW); return; }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[brands-overview] setBrandsOverviewInactive never appeared.");
    })();
  })();

  ── Loading state — own Run-JS step ──────────────────────────────────────────
  (function () {
    var INSTANCE_ID = `INSTANCE_ID`;
    var LOADING = `IS_LOADING`;          // "yes" / "no"
    var t = 0;
    (function go(){
      var fn = window.setBrandsOverviewLoading

<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash in data-cdn-pin on the
   root div above (falls back to @main only if it is blank or still the literal "CDN_PIN"). The pin
   is found BY CLASS, deliberately NOT via document.currentScript — Bubble injects an HTML element's
   inline scripts in a way that leaves currentScript null/misattached, which silently sent every
   file to @main (cached for hours) and made data-cdn-pin look like it did nothing. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("ubo-root") + "/";
  /* Bubble re-injects this whole block every time the reusable re-renders (every drawer/view open).
     Without this guard each re-run appended ANOTHER <link>+<script> for the SAME urls forever, and
     a render-blocking stylesheet landing mid-animation is what made drawers "pop" instead of
     animate. A re-rendered root is picked up by core.js's own root observer + heartbeat — the
     scripts do not need evaluating again. */
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("brands-overview.css");
  js("core.js");   js("brands-overview.js");
})();
</script>
