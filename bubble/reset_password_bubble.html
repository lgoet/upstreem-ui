<!-- ==========================================================================================
     upstreem — Reset Password (Praefix `urp`, Stand 07.10.)

     Das Ziel des Ruecksetzlinks: neues Passwort setzen. Die GANZE Seite ist dieses eine
     HTML-Element: auf volle Breite und volle Hoehe setzen, ohne eigenes Padding.

     ── FRISCHE INSTALLATION ──────────────────────────────────────────────────────────────────
     Diese Datei ist eine VORLAGE. Aenderungen daran erreichen ein bereits eingebautes Element
     NICHT -- dort muss dasselbe von Hand nachgezogen werden.

     ── WAS DIE SEITE NICHT BRAUCHT ───────────────────────────────────────────────────────────
     Kein data-cdn-pin, kein data-isdark, kein data-logo (Begruendung wie in
     check_email_bubble.html: Pin aus dem Seitenkopf, Thema aus pref_theme, Wortmarke je Thema).

     ── ATTRIBUTE ─────────────────────────────────────────────────────────────────────────────
       data-instance    eindeutig pro Seite. Die Setter sprechen ueber diese ID.
       data-submit-fn   das JavaScriptToBubble-Element, siehe unten.
       data-login-url   wohin "Back to sign in" und "Continue to sign in" fuehren.
                        Vorgabe: /signup?mode=login
       data-forgot-url  wohin "Request a new link" fuehrt (abgelaufener Link). Vorgabe:
                        /forgot-password -- mit ?email=, wenn die Seite die Adresse kennt.
       data-bg          optional: das Hintergrundbild der Anmeldeseite fuer die Flaeche unten.

     ── EVENT (JavaScriptToBubble "urpSubmit", Value type TEXT, Trigger event an) ─────────────
       data-submit-fn = "bubble_fn_urpSubmit"
       ROHER WERT, kein JSON: der Wert IST das neue Passwort. Geprueft sind: vorhanden,
       mindestens 8 Zeichen, beide Felder gleich. Die Staerkeanzeige ist die der Anmeldeseite.
       In Bubble also schlicht:  This JavaScriptToBubble's value
       Den State des Passworts nach dem Workflow ausdruecklich wieder leeren, in BEIDEN Zweigen.
       Danach steht die Seite im Ladezustand; heraus kommt sie nur durch einen der zwei Setter,
       nach 20 Sekunden ohne beides durch die Notbremse ("That took longer than expected.").

     ── DATEN HEREIN ──────────────────────────────────────────────────────────────────────────
       setResetPasswordDone(instanceId)
         "Password updated" mit dem Knopf "Continue to sign in". Eigene Texte als zweiter und
         dritter Wert: setResetPasswordDone(id, titel, text).

       setResetPasswordError(instanceId, fehlertext)
         Der Fehler, WIE SUPABASE IHN LIEFERT (Code, Meldung oder beides hintereinander). Die
         Seite macht daraus einen Satz am richtigen Ort:
           same_password / "should be different"  -> rote Zeile am Passwortfeld
           weak_password / "at least ..."          -> rote Zeile am Passwortfeld
           pwned / "data breach"                   -> rote Zeile am Passwortfeld
           otp_expired / "Auth session missing!"   -> ueber dem Formular, mit "Request a new link"
           reauthentication_needed                 -> "Please sign in again to change your password."
           over_request_rate_limit                 -> "Too many attempts ..."
           Netzwerkfehler                          -> "We could not reach the server ..."
           alles andere                            -> "Something went wrong. Please try again."

       Ein abgelaufener oder schon benutzter Link braucht KEINEN Workflow: Supabase schickt den
       Browser mit #error_code=otp_expired zurueck, und die Seite zeigt Satz und "Request a new
       link" schon beim Laden. Den Rest der Adresse (die Sitzung aus dem Link) fasst sie nicht an.

     ── EINBAU ────────────────────────────────────────────────────────────────────────────────
     1. Bubble-Seite "reset-password", dieses Element darauf. Das Supabase-Plugin muss auf
        dieser Seite stehen: es liest die Sitzung aus dem Ruecksetzlink (#access_token bzw.
        ?code=), ohne die kein Passwort gesetzt werden kann.
     2. JavaScriptToBubble-Element "urpSubmit" (Value type TEXT, Trigger event an).
     3. Workflow "When urpSubmit event":
        a) Supabase-Plugin: Benutzer aktualisieren (updateUser), password = urpSubmit's value
        b) Erfolg -> Run JavaScript, DER ERFOLGSSCHRITT unten. Empfohlen danach: Log the user
           out -- der Link hat eine Sitzung eroeffnet, und ohne Abmelden fuehrt "Continue to
           sign in" auf eine Anmeldeseite, waehrend man schon angemeldet ist.
        c) Fehler -> Run JavaScript, DER FEHLERSCHRITT unten.
        d) In BEIDEN Zweigen den State des Passworts wieder leeren.

     ── DER ERFOLGSSCHRITT ────────────────────────────────────────────────────────────────────
       (function () {
         try { if (window.setResetPasswordDone) window.setResetPasswordDone("reset_page"); } catch (e) {}
       })();

     ── DER FEHLERSCHRITT ─────────────────────────────────────────────────────────────────────
     Der Fehlertext ist TEXT, kein JSON. Deshalb OHNE die beiden Ersetzungen aus STYLEGUIDE §46
     (sie machten aus "AuthApiError: ," ein "AuthApiError: null,"). Ein Backtick, der rohe Text,
     ein try, window.<name> -- wie der Fehlerschritt in bubble/signup_invite_setup.md.

       (function () {
         var FEHLER = `[Fehlertext des Supabase-Plugins, z.B. Supabase Auth A's error message]`;
         try { if (window.setResetPasswordError) window.setResetPasswordError("reset_page", FEHLER); } catch (e) {}
       })();

     Welcher Ausdruck: der, den das Plugin fuer den letzten Fehler anbietet (meist ein State
     "error message" am Supabase-Element, gefuellt in dessen Event "an error occurs"). Hat es
     Code und Meldung getrennt, beide hintereinander in denselben Backtick: `[code] [message]`.

     DIESELBE FASSUNG STATISCH, mit echten Supabase-Antworten -- zum Ausprobieren:

       (function () {
         var FEHLER = `same_password New password should be different from the old password.`;
         try { if (window.setResetPasswordError) window.setResetPasswordError("reset_page", FEHLER); } catch (e) {}
       })();

       (function () {
         var FEHLER = `AuthSessionMissingError: Auth session missing!`;
         try { if (window.setResetPasswordError) window.setResetPasswordError("reset_page", FEHLER); } catch (e) {}
       })();

     Die drei Zeichen, die im Backtick gefaehrlich sind (Backtick, Dollar mit geschweifter
     Klammer, Backslash), kommen in Supabase-Meldungen nicht vor.
-->

<div class="up-root urp-root"
     data-instance="reset_page"
     data-submit-fn="bubble_fn_urpSubmit"
     data-login-url="/signup?mode=login"
     data-forgot-url="/forgot-password"></div>

<script>
(function(){
  /* Derselbe Loader wie in auth_page_bubble.html -- dort stehen die Begruendungen zu jeder Stufe.
     Ohne data-cdn-pin am Element greift die zweite Stufe: window.__upPin aus dem Seitenkopf. */
  function echterPin(p){
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("urp-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  css("core.css");             js("core.js");
  css("reset-password.css");   js("reset-password.js");
})();
</script>
