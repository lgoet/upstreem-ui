<!-- ==========================================================================================
     upstreem — Auth Page: Login und Signup (Praefix `uau`)

     Die GANZE Seite ist dieses eine HTML-Element. Es bringt seinen eigenen Hintergrund, die
     Karte, beide Spalten und die Fusszeile mit -- auf der Bubble-Seite gehoert nichts darum
     herum. Setze das Element auf volle Breite und volle Hoehe, ohne eigenes Padding.

     ── FRISCHE INSTALLATION ──────────────────────────────────────────────────────────────────
     Diese Datei ist eine VORLAGE. Aenderungen daran erreichen ein bereits eingebautes Element
     NICHT -- dort muss dasselbe von Hand nachgezogen werden.

     ── ATTRIBUTE ─────────────────────────────────────────────────────────────────────────────
       data-instance   eindeutig pro Platzierung. Alle Setter sprechen ueber diese ID.
       data-cdn-pin    Commit-Hash. NIEMALS leer lassen: leer zieht "@main", und das liefern
                       jsDelivr und der Browser aus einem bis zu tagealten Cache.
       data-mode       "login" (Standard) oder "signup". Bestimmt, womit die Seite startet.
                       Kann aus einem URL-Parameter kommen, dann landen /login und /signup
                       auf derselben Seite.
       data-isdark     "yes"/"no". Schaltet die --vc-*-Tokens auf dunkel und tont das
                       Hintergrundbild der rechten Spalte ab. Aenderungen wirken sofort, das
                       Attribut wird beobachtet -- ein Umschalten braucht keinen Neuaufbau.
       data-logo-dark  Optional: eigener Schriftzug fuer den Dark Mode. Fehlt er, wird data-logo
                       auch dort genommen -- ein fehlendes Dark-Logo darf nicht heissen, dass
                       gar keines dasteht.
       data-logo       URL des upstreem-Schriftzugs, 18px hoch dargestellt. Fehlt sie, bleibt
                       die Stelle leer statt ein kaputtes Bild zu zeigen.
       data-submit-delay  Millisekunden zwischen uauName/uauPassword und uauSubmit. Standard 0.
                       Die drei Aufrufe laufen synchron durch, die States sollten also stehen,
                       wenn der Submit-Workflow startet. Kommt bei dir sporadisch ein leeres
                       Passwort an -- was sich wie "falsche Zugangsdaten" anfuehlt und nicht wie
                       ein Zeitproblem -- setze hier 300. Der Nutzer merkt davon nichts, der
                       Ladezustand laeuft ab dem Klick.
       data-bg         URL des blauen Hintergrundbildes fuer die rechte Spalte. EIN Link fuer
                       beide Modi: im Dunkeln legt die CSS eine dunkle Decke darueber, statt ein
                       zweites Bild zu verlangen. Fehlt die URL, bleibt der Farbverlauf allein
                       stehen -- die Spalte sieht ruhiger aus, aber nicht kaputt.

     ── EVENTS (JavaScriptToBubble, Value type TEXT, Trigger event an) ────────────────────────

       data-submit-fn  = "bubble_fn_uauSubmit_[dynamic id]"
         {"team_id":"","mode":"signup","token":"INV-abc123","email":"alex@company.com","opt_in":"yes"}

         Feuert NUR, wenn die Pruefung im Browser durchgelaufen ist. Danach geht die Seite von
         selbst in den Ladezustand: Knopf mit Spinner, alle Felder gesperrt. Aus dem kommt sie
         ausschliesslich durch setAuthPageError oder setAuthPageDone zurueck.

         mode       "login" | "signup"
         token      der Einladungstoken aus ?token= -- leer heisst "normale Anmeldung".
                    Immer dabei, auch leer: ein Feld, das mal fehlt, zwingt jeden Workflow zu
                    einer Fallunterscheidung beim Auslesen.
         opt_in     "yes" | "no" -- der Haken "Send me product updates". Nur im Signup sichtbar
                    und UNGEHAKT vorbelegt: eine vorangekreuzte Box ist als Einwilligung nach
                    DSGVO nicht gueltig, die muss aktiv erfolgen. Im Login gibt es den Haken
                    nicht, dort kommt immer "no" -- ignoriere das Feld dort.
                    Speichere die Einwilligung MIT Zeitpunkt (marketing_opt_in_at). Ohne den
                    laesst sich spaeter nicht belegen, wann sie erteilt wurde.

         Extraktion (jedes Feld einzeln):
           mode   :extract with Regex  "mode":"([^"]*)"    :first item
           token  :extract with Regex  "token":"([^"]*)"   :first item
           email  :extract with Regex  "email":"([^"]*)"   :first item
           opt_in :extract with Regex  "opt_in":"([^"]*)"  :first item

         Alle vier sind sicher per Regex lesbar: keiner dieser Werte kann ein Anfuehrungszeichen
         enthalten.

         Passwort und Name stehen NICHT in diesem Payload -- sie kommen als eigene Events, siehe
         unten. Grund: beide duerfen Anfuehrungszeichen enthalten, und die werden in einem
         JSON-Text zu \" -- eine Regex-Extraktion schnitte dann mittendrin ab. Der Nutzer bekaeme
         "falsches Passwort" fuer ein richtiges, und zwar nur manchmal.

       data-name-fn      = "bubble_fn_uauName_[dynamic id]"
       data-password-fn  = "bubble_fn_uauPassword_[dynamic id]"
         ROHER WERT, kein JSON. Der Wert IST der Name bzw. das Passwort -- keine Extraktion,
         keine Regex, kein Abschneiden moeglich. In Bubble also schlicht:
           This JavaScriptToBubble's value

         Beide feuern UNMITTELBAR VOR uauSubmit. Bubble arbeitet die Aufrufe nacheinander ab,
         die States stehen also, wenn der Submit-Workflow laeuft. Lies sie dort aus den States,
         nicht aus dem uauSubmit-Payload -- dort sind sie nicht drin.

         uauName ist im Login-Modus ein leerer Text. Das ist kein Fehler, dort gibt es kein
         Namensfeld.

         Beide Elemente sind PFLICHT, wenn du uauSubmit verdrahtest. Fehlt eines, meldet die
         Konsole "nicht gefunden" und der Wert erreicht keinen Workflow -- der Login schluege
         dann bei jedem Versuch fehl, ohne dass die Ursache sichtbar waere.

         Das Passwort liegt zwischen diesen beiden Schritten als Bubble-State vor. Setze es im
         Erfolgs- wie im Fehlerzweig ausdruecklich wieder auf leer, damit es nicht bis zum
         naechsten Seitenwechsel dort stehen bleibt.

       data-google-fn  = "bubble_fn_uauGoogle_[dynamic id]"
         {"team_id":"","mode":"login","token":"INV-abc123","email":"alex@company.com"}
         Startet den OAuth-Fluss. Die Adresse faehrt mit, damit du serverseitig pruefen kannst,
         ob der Google-Account zur Einladung passt.

       data-mode-fn    = "bubble_fn_uauMode_[dynamic id]"
         {"team_id":"","mode":"signup","token":"INV-abc123"}
         Der Nutzer hat unten auf "Sign up" / "Sign in" geklickt. Die Seite hat schon
         umgeschaltet -- du musst nichts zurueckgeben. Nur verdrahten, wenn die URL mitwandern
         soll (Go to page /signup) oder du den Wechsel zaehlen willst.

       data-side-fn    = "bubble_fn_uauSide_[dynamic id]"
         {"team_id":"","mode":"login","token":"","email":"alex@company.com"}
         Der Link rechts neben dem Haken: "Forgot password?" im Login, "Need help?" im Signup.
         Die eingetippte Adresse faehrt mit, damit der Zuruecksetzen-Fluss nicht noch einmal
         danach fragen muss.

     ── DATEN HEREIN ──────────────────────────────────────────────────────────────────────────

       setAuthPageMode(instanceId, "login"|"signup")
         Umschalten von aussen. Fehler des anderen Modus werden dabei verworfen.

       setAuthPageLoading(instanceId, "yes"|"no")
         Nur noetig, wenn du den Ladezustand selbst steuern willst -- der Klick setzt ihn bereits.

       setAuthPageError(instanceId, feld, text)
         DER wichtigste Aufruf. Er beendet den Ladezustand IMMER, auch bei unbekanntem Feld.
           feld = "email" | "password" | "name"   -> rote Zeile unter genau diesem Feld
           feld = ""                              -> Fehlerkasten ueber dem Feldstapel
         Beispiele:
           setAuthPageError("auth", "email", "We do not know this address.")
           setAuthPageError("auth", "password", "That password is not correct.")
           setAuthPageError("auth", "", "Too many attempts. Try again in a few minutes.")

       setAuthPageDone(instanceId, titel, text)
         Ersetzt das Formular durch den Erfolgsblock, an Ort und Stelle, ohne Sprung.
           setAuthPageDone("auth", "Welcome aboard", "Check your inbox to confirm your email.")
         Fuer einen Login, der direkt weiterleitet, brauchst du das nicht -- dann navigiere
         einfach; der Ladezustand bleibt bis zum Seitenwechsel stehen, und das ist richtig.

       resetAuthPage(instanceId)
         Felder leeren, Fehler weg, zurueck aus dem Erfolgsblock.

     ── DIE NOTBREMSE ─────────────────────────────────────────────────────────────────────────
     Kommt nach dem Absenden 20 Sekunden lang weder setAuthPageError noch setAuthPageDone,
     entsperrt sich die Seite von selbst und zeigt "That took longer than expected."
     Das ist die Notbremse, nicht der Normalweg. Steht der Satz im Alltag da, fehlt in deinem
     Workflow der Rueckweg -- ein Auth-Workflow braucht IMMER einen Fehlerzweig, sonst dreht der
     Knopf bei jedem Tippfehler im Passwort zwanzig Sekunden ins Leere.

     ── WAS DIE SEITE SELBST PRUEFT ───────────────────────────────────────────────────────────
     Name vorhanden (nur Signup), E-Mail grob auf Form, Passwort vorhanden und im Signup
     mindestens 8 Zeichen. Dazu die Staerkeanzeige unter dem Passwortfeld (nur Signup).

     Das ist Bequemlichkeit, KEINE Sicherheit: der Code laeuft im Browser des Nutzers und laesst
     sich dort abschalten. Jede dieser Regeln muss serverseitig ein zweites Mal stehen.

     Die Laengenregel gilt bewusst nur beim Anlegen. Im Login waere sie falsch -- ein bestehendes
     Konto kann ein kuerzeres Passwort haben, und dann verweigerte die Seite die Anmeldung fuer
     etwas, das der Nutzer gar nicht mehr aendern kann.

     ── EINBAU IN KUERZE ──────────────────────────────────────────────────────────────────────
     1. Element auf die Seite, volle Breite und Hoehe, kein Padding drumherum.
        data-instance, data-cdn-pin, data-logo, data-bg setzen.
     2. JavaScriptToBubble-Elemente anlegen. PFLICHT: uauName, uauPassword, uauSubmit.
        Nach Bedarf: uauGoogle, uauMode, uauSide.
     3. Workflow auf uauSubmit: mode/token/email/opt_in aus dem Wert extrahieren, Name und
        Passwort aus den States der beiden anderen Elemente nehmen.
        Erfolgszweig -> navigieren oder setAuthPageDone.
        FEHLERZWEIG -> setAuthPageError. Ohne ihn laeuft jeder Fehlversuch in die Notbremse.
        In BEIDEN Zweigen den Passwort-State wieder leeren.
     4. data-mode aus dem URL-Parameter binden, wenn /login und /signup dieselbe Seite sind.
     ========================================================================================== 
     ── DER RUN-JS-SCHRITT: EIN BACKTICK, KEIN OBJEKT (STYLEGUIDE §46) ────────────────────────
     NIEMALS ein JS-Objekt im Schritt von Hand bauen. Also NICHT so:

       renderAuthPage({ instanceId: "INSTANCE_ID", mode: <ausdruck> })   FALSCH

     Ist einer der Ausdruecke leer, steht dort  mode: ,  -- und das ist kein gueltiges JavaScript.
     Der Schritt scheitert dann beim PARSEN, bevor eine einzige Zeile laeuft: "Uncaught
     SyntaxError: Unexpected token ','". Kein Sanitizer und kein Code im Kit kann das abfangen,
     weil nichts davon zur Ausfuehrung kommt -- und weil der GANZE Schritt stirbt, gehen auch die
     Aufrufe DARUNTER mit. So gemeldet am 24.08. an brand-detail: die Komponente blieb im
     Ladezustand stehen, weil ein leerer _prev-Wert den Schritt getoetet hatte, ehe ihr Setter
     ueberhaupt an die Reihe kam.

     RICHTIG ist immer EIN Backtick mit dem ROHEN Text und die beiden Ersetzungen darauf. Im
     Backtick ist ein leeres Feld nur Text; die erste Ersetzung macht daraus null, die zweite
     quotiert Bubbles unquotiertes yes/no. BEIDE Zeilen sind Pflicht.

       (function () {
         var ROH = `{
           "instanceId": "INSTANCE_ID",
           "mode": "signup"
         }`
           .replace(/:\s*([,}\]])/g, ": null$1")
           .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
         /* Jeder Aufruf in seinem EIGENEN try: ein kaputter oder fehlender Ausdruck darf die
            anderen nicht mitnehmen. Und window.<name> statt des nackten Namens -- haengt das
            Element noch an einem aelteren Pin, ist der Name schlicht undefined statt ein
            ReferenceError, der den ganzen Schritt mitnimmt. */
         try { if (window.renderAuthPage) window.renderAuthPage(ROH); } catch (e) {}
       })();

     Zahlen bleiben OHNE Anfuehrungszeichen -- 3.0, nicht "3.0" -- sonst kommt der Wert als Text
     an und jede Rechnung darauf geht daneben.

     "instanceId" steht ABSICHTLICH als ERSTES Feld. Bricht der Payload mitten ab, fischt core die
     Id trotzdem aus dem Rohtext, und die richtige Platzierung zeigt den Fehler. Steht sie hinten,
     ist sie mit abgeschnitten -- auf einer Seite mit zwei Platzierungen meldet dann die falsche.

     Was bei einem unlesbaren Payload passiert: dieser Setter hat NOCH KEINEN Lesefehler-Zustand.
     Der Payload landet dann als leere Liste, und die Ansicht sieht aus wie ein sauberes leeres
     Ergebnis. Der Backtick ist hier also nicht eine von zwei Absicherungen, sondern die einzige.
     (Die 12 Komponenten mit render*-Einstieg haben den Zustand seit dem 24.08.; hier steht er
     noch offen.)

     setAuthPageMode, -Loading, -Error, -Done und -Invite nehmen einfache Werte und brauchen
     keinen Backtick.

     Die EINZIGE Zeichenfolge, die im Backtick selbst gefaehrlich bleibt, ist ein Backtick oder
     ein Dollar mit geschweifter Klammer in einem WERT. Beides kommt in Marken-, Domain- und
     Themennamen nicht vor; alles andere -- Anfuehrungszeichen, Apostrophe, Umlaute,
     Zeilenumbrueche, Emoji -- traegt er unbeschadet.
-->

<div class="up-root uau-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-mode="login"
     data-logo="LOGO_URL"
     data-logo-dark="LOGO_DARK_URL"
     data-isdark="IS_DARK"
     data-bg="BG_URL"
     data-name-fn="bubble_fn_uauName"
     data-password-fn="bubble_fn_uauPassword"
     data-submit-fn="bubble_fn_uauSubmit"
     data-google-fn="bubble_fn_uauGoogle"
     data-mode-fn="bubble_fn_uauMode"
     data-side-fn="bubble_fn_uauSide"></div>

<script>
(function(){
  /* Loader nach STYLEGUIDE 26: den Pin ueber getElementsByClassName lesen, NIEMALS ueber
     document.currentScript — Bubble fuehrt Scripts nicht in DOM-Reihenfolge aus. */
  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       jsDelivr antwortet mit 404, und weder CSS noch JS landen. Ohne trim greift auch kein
       Rueckfall, weil "   " truthy ist.
       Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
       Waechter treffen, und der Loader liefe dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* ---- Rueckfall: einen Pin nehmen, der auf DIESER Seite schon gilt ----------------------
       Gemeldet am 31.08. mit drei Stapelspuren, alle aus einem solchen Loader: "core.css ist
       schon von einem anderen Pin geladen ... ignoriert wird @main" -- obwohl der Pin am Element
       stand. Der Grund ist die Reihenfolge: Bubble baut ein Element bei jedem Rerender neu und
       fuehrt Scripts nicht in DOM-Reihenfolge aus, dieser Loader lief also, waehrend seine eigene
       Wurzel noch nicht im Dokument stand -- die Klasse oben fand nichts.
       Und das war mehr als eine Warnung: core kam durch die Entdoppelung unten noch aus dem Pin,
       die Dateien DIESER Komponente aber tatsaechlich von @main. Eine Seite, die zur Haelfte auf
       @main laeuft, ist genau das, was ein Pin verhindern soll.
       Geraten wird nichts: jede der drei Stufen liest einen Pin, der auf dieser Seite schon in
       Gebrauch ist. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* Aus einer schon geladenen Datei ablesen. Diese Stufe greift auch dann, wenn alle anderen
       Elemente der Seite noch die ALTE Fassung dieses Loaders tragen -- die fuellen
       __upAssetsLoaded genauso. "main" wird NICHT gemerkt: das ist kein Pin, und die naechste
       Komponente wuerde ihn sonst fuer einen halten. */
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("uau-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL. Zwei Elemente mit verschiedenen data-cdn-pin
     ergeben zwei URLs fuer dieselbe Datei -- vorher lud der Loader dann beide: core.js lief
     zweimal, und core.css stand zweimal im Dokument, wobei die spaetere die fruehere ueberschrieb.
     Wer gewinnt, entschied die Reihenfolge, in der Bubble die Elemente baut.
     Der erste Pin gewinnt jetzt, und ein zweiter wird gemeldet -- sonst sucht man den Unterschied
     zwischen zwei Seiten, auf denen dieselbe Version verschiedene Dinge tut. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  /* core zuerst, async=false haelt die Reihenfolge ein. */
  css("core.css");        js("core.js");
  css("auth-page.css");   js("auth-page.js");
})();
</script>
