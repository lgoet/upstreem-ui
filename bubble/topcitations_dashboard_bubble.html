<!--
  UPSTREEM — TOP CITATIONS DASHBOARD

  LEFT = Citation Type / URL Type doughnut-or-bar chart, RIGHT = Top Domains / Top URLs table.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance   = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin    = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the literal
                    "CDN_PIN" placeholder) to load @main. Point this at a Bubble constant/Option
                    Set field you control so every placement can be repinned to a new commit in
                    one edit instead of hunting down every embed's URL by hand — @main itself lags
                    jsDelivr's cache, sometimes for hours, so a fresh fix may not actually be live
                    yet even right after it's pushed. The loader script at the bottom reads this
                    once and builds every asset URL from it.
  data-isdark     = "yes" / "no"
  data-export-instance = die instanceId der EXPORT-Komponente auf derselben Seite. Ohne sie
                         oeffnet der Export-Knopf keinen Dialog -- er feuert dann nur das eigene
                         Export-Event. Das Element der Export-Komponente muss in Bubble SICHTBAR
                         sein, sonst veroeffentlicht Bubble ihre Funktionen nicht.
  data-processing  = "yes" / "no"   loading state, source 1 (ORed together)
  data-processing2 = "yes" / "no"   loading state, source 2 (ORed together)

  ── Event names must be unique per placement ─────────────────────────────────
  data-mode-fn="bubble_fn_tcdMode_[dynamic id]"
  data-rowclick-fn="bubble_fn_tcdRowClick_[dynamic id]"
  data-goto-fn="bubble_fn_tcdGoTo_[dynamic id]"
  data-export-fn="bubble_fn_tcdExportTable_[dynamic id]"
  data-types-fn="bubble_fn_tcdApplyTypeFilter_[dynamic id]"
  data-dimension-fn="bubble_fn_tcdFilterDimension_[dynamic id]"
  data-brand-fn="bubble_fn_tcdBrandMentioned_[dynamic id]"

  Every one fires via fn(value, instanceId) — TWO arguments, unlike the single-argument events on
  urls-table/domains-table/visibility-chart — except Go-To and Export, which are single-argument
  (just the instanceId):
    mode      fn(mode, instanceId)         mode: "domain" | "url"
    rowclick  fn(id, instanceId)           id = domain string, or url/title string in url mode
    goto      fn(instanceId)
    export    fn(instanceId)
    types     fn(combined, instanceId)     combined = "<citationIds>;<urlIds>", each side comma-
                                            joined, e.g. "Editorial,Competition;guide,review" —
                                            MUST be Bubble type "text", NOT "list of texts" (a list
                                            field auto-splits on comma and breaks this delimiter
                                            scheme). On the Bubble side: value:split by ";" -> item
                                            #1 = citation types, item #2 = url types, each further
                                            :split by "," for a clean list of texts.
    dimension fn(dimension, instanceId)    dimension: "citation_type" | "url_type"
                                           only fires on a manual switch inside the filter menu,
                                           NOT when the mode button changes the default
    brand     fn(brandMentioned, instanceId)   ""  |  "yes"  |  "no"

  ── Filling the component ─────────────────────────────────────────────────────
  window.renderTopCitations({
    instanceId: "...",
    mode: "domain" | "url",                 // which list/chart is active
    totalCountDomain: 42,                    // shown next to "Top Domains" while in domain mode
    totalCountUrl: 128,                      // shown next to "Top URLs" while in url mode
    citations_total: 15899,
    top_domains: [{ domain, favicon, share_pct, share_delta_pct, used_total, citation_type }, ...],
    top_urls: [{ url, title, favicon, global_share_pct, share_delta_pct, used_total, url_type }, ...],
    // the API reuses THIS SAME field for both dimensions: citation-type slices in domain mode,
    // url-type slices in url mode — there is no separate url_types_breakdown field in practice.
    types_breakdown: [{ type, share_pct }, ...],
    brand: { id: "...", name: "ADAC", logo: "https://..." },   // for the "ADAC mentioned?" toggle
    filterTypeSel: [...], filterUrlTypeSel: [...],             // optional, pre-check on first load
    brandMentioned: ""                                         // "" | "yes" | "no"
  });

  // NOT a render parameter: filterDimension. The component owns which dimension the type filter
  // opens on and never reads it back from a render call — passing it does nothing. It defaults to
  // URL Type in url mode and Citation Type in domain mode, switching modes resets it to that
  // mode's default, and an explicit pick by the user survives re-renders. You still get the
  // dimension event when the user switches it by hand, if you want to mirror it into a state.
  ── Run-JS "Render" step (paste as-is, swap the bracketed dynamic values) ────

  !! NEVER parse the RPC result inside the step. Bubble puts its expressions between BACKTICKS,
  and a template literal resolves backslash escapes before a single line of the step runs:

      RPC sends   "title":"NATURE ONE \\"rave. now. together.\\" | 30. Juli"
      step gets   "title":"NATURE ONE "rave. now. together." | 30. Juli"

  A JSON.parse/eval in the step throws on that, and a catch that returns [] turns it into an
  empty table with a silent console. Measured on 22.08.: 7 URLs in the RPC, array:0 in the step,
  "No data" in the table while the chart beside it kept its data. Same story for a \\n in a
  multi-line text and for any backslash in a path.

  Hand the raw text over as a STRING, exactly like responses-table and every other table here.
  UpstreemCore.parseBubbleJson is the one shared repair pass and knows these cases.

  (function () {
    var URLS    = `[TOP_URLS_RPC]`;              // backticks -- do NOT wrap in [ ] yourself
    var DOMAINS = `[TOP_DOMAINS_RPC]`;
    var TYPES   = `[TYPES_BREAKDOWN_RPC]`;
    var UTYPES  = `[URL_TYPES_BREAKDOWN_RPC]`;
    var BRAND   = `[BRAND_RPC]`;

    var t = 0;
    (function go () {
      var w  = window,
          fn = w.renderTopCitations
            || (w.parent && w.parent.renderTopCitations)
            || (w.top && w.top.renderTopCitations);
      if (typeof fn === "function") {
        fn({
          instanceId: `INSTANCE_ID`,
          isDark: `IS_DARK`,
          mode: `MODE`,                          // "domain" | "url"
          totalCountDomain: Number(`[TOTAL_COUNT_DOMAIN]`),
          totalCountUrl:    Number(`[TOTAL_COUNT_URL]`),
          citations_total:  Number(`[CITATIONS_TOTAL]`),
          brand:               BRAND,            // all five stay STRINGS on purpose
          top_domains:         DOMAINS,
          top_urls:            URLS,
          types_breakdown:     TYPES,
          url_types_breakdown: UTYPES
        });
        return;
      }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[top-citations] renderTopCitations never appeared after 6s -- " +
        "check data-cdn-pin and that the component is actually on this page.");
    })();
  })();

  window.setTopCitationsLoading("INSTANCE_ID", "yes" | "no");
  window.resetTopCitations("INSTANCE_ID");    // resets every filter (Brand Mentioned, both type
                                               // selections, filter dimension) — does NOT fire any
                                               // of the events above or request new data
-->
<div class="up-root tcd-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-export-instance="EXPORT_INSTANCE_ID"
     data-processing="IS_PROCESSING"
     data-processing2="IS_PROCESSING_2"
     data-mode-fn="bubble_fn_tcdMode"
     data-rowclick-fn="bubble_fn_tcdRowClick"
     data-goto-fn="bubble_fn_tcdGoTo"
     data-export-fn="bubble_fn_tcdExportTable"
     data-types-fn="bubble_fn_tcdApplyTypeFilter"
     data-dimension-fn="bubble_fn_tcdFilterDimension"
     data-brand-fn="bubble_fn_tcdBrandMentioned">

  <div class="tcd-unit tcd-unit-left">
    <div class="tcd-head">
      <div class="tcd-mode" role="tablist" aria-label="Mode">
        <button class="tcd-mode-btn is-active" data-mode="domain" type="button" role="tab">Domains</button>
        <button class="tcd-mode-btn" data-mode="url" type="button" role="tab">URLs</button>
      </div>
      <div class="tcd-head-tools">
        <div class="tcl-seg" role="tablist" aria-label="Chart type">
          <button class="tcl-seg-btn is-active" data-chart="doughnut" role="tab" aria-selected="true" data-tip="Doughnut" aria-label="Doughnut">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z" /> <path d="M21.21 15.89A10 10 0 1 1 8 2.83" /></svg>
          </button>
          <button class="tcl-seg-btn" data-chart="bar" role="tab" aria-selected="false" data-tip="Bars" aria-label="Bars">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><rect x="7" y="13" width="9" height="4" rx="1"/><rect x="7" y="5" width="12" height="4" rx="1"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="tcd-box">
      <div class="tcd-panel-body">
        <div class="tcl-top-total"><span class="n">0</span><span class="lbl">Citations</span></div>
        <div class="up-donut-body"></div>
      </div>
    </div>
  </div>

  <div class="tcd-unit tcd-unit-right">
    <div class="tcd-head">
      <div class="tcd-heading tcd-heading-right"><span class="tcd-head-label">Top Domains</span><span class="tcd-head-sep"></span><span class="tcd-head-count"></span></div>
      <div class="tcd-head-tools">
        <button class="tcd-brand-toggle" type="button" data-tip="Filter for your brand mentions">
          <span class="tcd-brand-toggle-lbl">
            <img class="tcd-brand-logo" src="" style="display:none"/>
            <span class="tcd-brand-label"></span>
          </span>
          <span class="tcd-brand-check">
            <svg class="tcd-brand-check-yes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
            <svg class="tcd-brand-check-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /></svg>
          </span>
        </button>
        <div class="tcd-filter">
          <button class="tcd-filter-btn tcd-iconbtn" type="button" data-tip="Filter" aria-label="Filter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            <span class="tcd-filter-badge"></span>
          </button>
          <div class="up-filter-menu" role="menu" aria-hidden="true"></div>
        </div>
        <button class="tcd-export tcd-iconbtn" type="button" data-tip="Export" aria-label="Export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></svg>
        </button>
        <button class="tcd-goto tcd-iconbtn" type="button" data-tip="Open" aria-label="Open">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /> <path d="M7 17 17 7" /></svg>
        </button>
      </div>
    </div>
    <div class="tcd-box">
      <div class="tct-table"></div>
    </div>
  </div>
</div>
<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). The pin is found by looking the root element up BY CLASS — deliberately
   NOT via document.currentScript, because Bubble injects an HTML element's inline scripts in a way
   that leaves document.currentScript null/misattached. That made the previous loader read no pin
   and silently fall back to @main for every file (and jsDelivr caches @main for hours, so it served
   stale code) — which is why setting data-cdn-pin appeared to do nothing. Loading core.js once per
   component is fine: the browser caches the (immutable, commit-pinned) URL, and the component's own
   init is idempotent. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      /* Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
         Waechter treffen -- der Vergleich waere dann pin === "<der Hash>" und der Loader liefe
         dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
      if (p && p !== "CDN_" + "PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("tcd-root") + "/";
  /* Bubble re-injects this whole block (this script tag included) every time the reusable this
     component sits in re-renders — i.e. on every drawer/view open. Without this guard each of
     those re-runs appended ANOTHER <link> + <script> for the SAME urls, forever: 4 more tags per
     render, never cleaned up (measured: 14 tags after one page build, 64 after ~25 navigations).
     Inserting a stylesheet <link> is render-blocking, so that landed right in the middle of the
     open animation — which is what made drawers/views "pop" in instead of animating.
     The registry lives on window, not in this closure, because every component ships its own copy
     of this loader. Skipping the re-run is safe: a re-rendered root is picked up and initialised
     by core.js's own root observer + 1.5s heartbeat, it does not need the scripts evaluated
     again (verified against a root injected with the scripts deliberately run only once). */
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL. Zwei Elemente mit verschiedenen data-cdn-pin
     ergeben zwei URLs fuer dieselbe Datei -- vorher lud der Loader dann beide: core.js lief
     zweimal, und core.css stand zweimal im Dokument, wobei die spaetere die fruehere ueberschrieb.
     Wer gewinnt, entschied die Reihenfolge, in der Bubble die Elemente baut.
     Der erste Pin gewinnt jetzt, und ein zweiter wird gemeldet -- sonst sucht man den Unterschied
     zwischen zwei Seiten, auf denen dieselbe Version verschiedene Dinge tut. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("topcitations-dashboard.css");
  js("core.js"); js("topcitations-dashboard.js");
})();
</script>
