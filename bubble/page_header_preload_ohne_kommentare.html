  function saeubern(n, wo){
    if (!n) return;
    var art = n.nodeType;
    if (art !== 1 && art !== 11) return;
    var drin;
    if (art === 11){
      if (!n.querySelectorAll) return;
      drin = [].slice.call(n.querySelectorAll("script[src], link[href]"));
    } else {
      if (!n.getElementsByTagName || !n.childElementCount) return;
      drin = [].slice.call(n.getElementsByTagName("script"))
               .concat([].slice.call(n.getElementsByTagName("link")));
    }
    for (var i = 0; i < drin.length; i++){
      if (!schonDa(drin[i])) continue;
      notiereDoppel(drin[i], wo, true);
      if (drin[i].parentNode) drin[i].parentNode.removeChild(drin[i]);
    }
  }
  var SPUR_JE_DATEI = {};
  function notiereDoppel(n, wo, vorher){
    var u = quelleVon(n), name = dateiname(u);
    var wieOft = (SPUR_JE_DATEI[name] = (SPUR_JE_DATEI[name] || 0) + 1);
    var spur = [];
    if (wieOft <= 2){
      try { spur = (new Error().stack || "").split("\n").slice(3, 6)
              .map(function(x){ return x.trim(); }); } catch(e){}
    }
    (window.__upDoppel || (window.__upDoppel = [])).push({
      datei: name, wann: vorher ? "vor" : "nach", wo: wo || "?",
      zeit: Math.round(window.performance && performance.now ? performance.now() : 0),
      spur: spur
    });
  }
  function einhaengeSperre(){
    var ziele = [document.head, document.body, document.documentElement];
    ["appendChild", "insertBefore"].forEach(function(m){
      ziele.forEach(function(z){
        if (!z || z["__upGesperrt_" + m]) return;
        var orig = z[m];
        if (typeof orig !== "function") return;
        z["__upGesperrt_" + m] = 1;
        z[m] = function(n){
          try {
            if (schonDa(n)){ notiereDoppel(n, "nackt", true); return n; }
            saeubern(n, "teilbaum");
          } catch(e){}
          return orig.apply(this, arguments);
        };
      });
    });
  }
  function quelleVon(n){
    if (!n || n.nodeType !== 1 || !n.getAttribute) return null;
    if (n.tagName === "SCRIPT") return n.getAttribute("src");
    if (n.tagName === "LINK" && (n.getAttribute("rel") || "").indexOf("stylesheet") >= 0) return n.getAttribute("href");
    return null;
  }
  function dateiname(u){
    return String(u || "").slice(String(u || "").lastIndexOf("/") + 1)
      .replace(/[?#].*$/, "").replace(".min.", ".");
  }
  function tagImDokument(name){
    var listen = [document.getElementsByTagName("script"), document.getElementsByTagName("link")];
    for (var l = 0; l < listen.length; l++){
      var els = listen[l];
      for (var i = 0; i < els.length; i++){
        var u = els[i].getAttribute("src") || els[i].getAttribute("href");
        if (u && u.indexOf("upstreem-ui@") >= 0 && dateiname(u) === name) return true;
      }
    }
    return false;
  }
  function schonDa(n){
    if (!n || n.nodeType !== 1 || !n.getAttribute) return false;
    if (n.getAttribute("data-up-preload")) return false;
    var u = quelleVon(n);
    if (!u || u.indexOf("upstreem-ui@") < 0) return false;
    var name = dateiname(u);
    return !!geladen[name] || tagImDokument(name);
  }

  function doppelWaechter(){
    if (!window.MutationObserver) return;
    function pruefen(n){
      if (!n || n.nodeType !== 1 || !n.getAttribute) return;
      if (!n.getAttribute("data-up-preload")){
        var u = null;
        if (n.tagName === "SCRIPT") u = n.getAttribute("src");
        else if (n.tagName === "LINK" && (n.getAttribute("rel") || "").indexOf("stylesheet") >= 0) u = n.getAttribute("href");
        if (u && u.indexOf("upstreem-ui@") >= 0){
          var name = dateiname(u);
          if (geladen[name]){
            if (n.parentNode) n.parentNode.removeChild(n);
            notiereDoppel(n, "beobachter", false);
            return;
          }
        }
      }
      if (!n.querySelectorAll) return;
      var drin = n.querySelectorAll('script[src*="upstreem-ui@"], link[href*="upstreem-ui@"]');
      for (var q = 0; q < drin.length; q++) pruefen(drin[q]);
    }
    new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++){
        var neu = muts[i].addedNodes;
        for (var j = 0; j < neu.length; j++) pruefen(neu[j]);
      }
    }).observe(document.documentElement, { childList: true, subtree: true });
  }
  einhaengeSperre();
  if (!document.body){
    document.addEventListener("DOMContentLoaded", einhaengeSperre);
    var koerperUhr = setInterval(function(){
      if (!document.body) return;
      clearInterval(koerperUhr); einhaengeSperre();
    }, 50);
  }
  doppelWaechter();

  function pinWaechter(){
    var versuche = 0;
    (function schauen(){
      var els = document.querySelectorAll("[data-cdn-pin]");
      for (var i = 0; i < els.length; i++){
        var p = (els[i].getAttribute("data-cdn-pin") || "").trim();
        if (!p || p === "CDN_" + "PIN") continue;
        if (gleicherPin(p, PIN)) return;
        if (window.console) console.error("upstreem: Der Pin im Header-Snippet (" + PIN +
          ") ist nicht derselbe wie am Element \"" + (els[i].className || els[i].id) + "\" (" + p +

          "Zeichenfolge setzen (nicht nur denselben Commit: kurzer und langer Hash sind zwei URLs).");
        return;
      }
      if (++versuche < 20) setTimeout(schauen, 500);
    })();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", pinWaechter);
  else pinWaechter();

  function welle2Planen(){
