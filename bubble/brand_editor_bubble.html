<!--
  ============================================================================================
  BRAND EDITOR — Bubble-Vorlage
  ============================================================================================
  Der Editor fuer EINE getrackte Marke: Name, Aliase, Farbe, Zeitraeume. Er ist das Gegenstueck
  zu settings-brand (das ist die eigene Marke) und funktioniert fuer jede Marke, auch fuer
  Wettbewerber.

  EINSETZEN
  1. HTML-Element auf die Seite, dieses Markup hinein.
  2. INSTANCE_ID durch eine FESTE Kennung ersetzen (z. B. "brandedit"). Kein dynamischer Ausdruck
     -- siehe bubble/STATISCHES_MARKUP_PFLICHT.md: ein Element mit dynamischem Inhalt wird von
     Bubble bei jeder Aenderung komplett neu gebaut. Welche Marke gezeigt wird, entscheidet der
     Payload, nicht das Markup.
  3. CDN_PIN durch den Commit-Hash ersetzen, denselben wie an allen anderen Elementen der Seite.
  4. data-isdark bleibt "no" und wird NICHT dynamisch gesetzt. Das Thema kommt ueber
     window.setUpstreemTheme("dark") / ("light") -- core stempelt es an jede Wurzel, und die
     Komponente zieht mit (gemessen: Waehler, Tabelle und Knopf wechseln mit).
  5. Die fuenf data-*-fn Namen zeigen auf deine Bubble-Funktionen (Toolbox "JavaScript to Bubble").
     Wer einen davon weglaesst, schaltet die Funktion ab -- die Komponente feuert dann nichts.
  6. RAND OBEN 32 am Container (Gruppe oder Schublade), links/rechts/unten wie bei den anderen
     Detail-Ansichten. Die Komponente bringt KEIN eigenes Polster mit -- sonst kaeme es zu dem
     der Schublade dazu, und ueber der Kopfzeile stuende mehr Luft als darunter. 32 ist das Mass,
     das zwischen zwei Bloecken steht; damit ist es ueber und unter der Kopfzeile gleich.
  7. FIT HEIGHT am HTML-Element, und "Fit height to content" auch an der Gruppe darum. Der Editor
     waechst mit der Zahl der Aliase und der Zeitraeume; steht dort eine feste Hoehe, schneidet
     Bubble den Rest ab, und die Schublade zeigt eine Scrollleiste, die nichts zu scrollen hat --
     genau das Bild von "man sieht die Leiste, aber es scrollt nicht".
     Nachpruefen laesst sich das auf der Seite mit
        window.upstreemScrollDiag()
     Der Aufruf meldet fuer jeden Vorfahren sichtbare Hoehe, Inhaltshoehe und overflow. Wer den
     Inhalt abschneidet (Inhaltshoehe groesser, overflow: hidden) oder eine Leiste ohne Inhalt
     zeigt (beide Hoehen gleich, overflow: scroll), steht damit fest.

  DATEN HINEIN (Run javascript, Schritt unten in diesem Kommentar)
     setBrandEditor(INSTANCE_ID, payload)        die ganze Ansicht
     setBrandEditorLoading(INSTANCE_ID, "yes")   Skelett an, waehrend die RPC laeuft
     resetBrandEditor(INSTANCE_ID)               zurueck auf leer

  EREIGNISSE HERAUS (jedes mit einem JSON-Text als erstem Parameter)
     Gemessene Werte, so wie sie ankommen. team_id steht VORNE und kommt aus core -- es haengt an
     jedem Ereignis der App, damit ein Workflow pruefen kann, ob die Antwort zum Team auf dem
     Bildschirm gehoert. Fehlt kein Team, fehlt auch das Feld.

     ubeRename        Save neben dem Namensfeld
       {"team_id":"t1","company_id":"fd2f56a4-...","name":"Anfragenfluss GmbH"}
     ubeAliasAdd      Add geklickt oder Enter im Alias-Feld
       {"team_id":"t1","company_id":"fd2f56a4-...","pattern":"anfragenfluss.de"}
     ubeAliasToggle   Schalter in der Alias-Zeile
       {"team_id":"t1","company_id":"fd2f56a4-...","alias_id":"8f4fcc2c-...","is_active":true}
     ubeAliasDelete   Papierkorb in der Alias-Zeile
       {"team_id":"t1","company_id":"fd2f56a4-...","alias_id":"8f4fcc2c-..."}
     ubeColor         Save neben dem Farbfeld, oder Reset
       {"team_id":"t1","company_id":"fd2f56a4-...","color":"#1a7f5a"}
       Reset schickt dasselbe Ereignis mit "color":"" -- leer heisst "zurueck auf die vergebene
       Farbe". WELCHE das ist, entscheidet der Server; hier eine auszurechnen waere geraten.

  DIE WERTE IN BUBBLE LESEN (extract with Regex)
     Diese vier sind unbedenklich -- Ids und Hex enthalten kein Anfuehrungszeichen:

         (?<="team_id":")[^"]*
         (?<="company_id":")[^"]*
         (?<="alias_id":")[^"]*
         (?<="color":")[^"]*                 leer = zuruecksetzen

     is_active kommt OHNE Anfuehrungszeichen, es ist ein Wahrheitswert:

         (?<="is_active":)(?:true|false)     ergibt den Text true bzw. false

     Im Workflow also auf = "true" pruefen, nicht auf yes.

     name und pattern NICHT per Regex. Beides ist Freitext: ein Markenname darf Anfuehrungs-
     zeichen, spitze Klammern und Emoji enthalten, und im Payload stehen Anfuehrungszeichen
     escaped (\"). (?<="name":")[^"]* schneidet dann genau an der Stelle ab, auf die es ankommt.
     Der sichere Weg ist derselbe wie bei add-prompts: den GANZEN Payload als einen Text-Parameter
     an den RPC geben und dort per JSON parsen. Geprueft mit Mueller & "Soehne" <GmbH> und Emoji.

  WICHTIG, WEIL ES SCHON ZWEIMAL SCHIEFGING
  - Die Komponente aendert NICHTS von sich aus. Ein Klick auf den Schalter legt ihn optisch um und
    feuert das Ereignis; die Wahrheit kommt mit dem naechsten setBrandEditor zurueck. Wer den
    Workflow vergisst, sieht einen Schalter, der beim naechsten Laden wieder zurueckspringt.
  - Der Name wird IN der Komponente getippt: Feld plus Save-Knopf, wie Alias und Farbe. ubeRename
    traegt den NEUEN Namen (nicht mehr den alten) -- der Workflow schreibt ihn und schickt die RPC
    erneut. Kein Dialog auf der Bubble-Seite noetig.
  ============================================================================================
-->
<div class="up-root ube-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="no"
     data-rename-fn="bubble_fn_ubeRename"
     data-aliasadd-fn="bubble_fn_ubeAliasAdd"
     data-aliastoggle-fn="bubble_fn_ubeAliasToggle"
     data-aliasdelete-fn="bubble_fn_ubeAliasDelete"
     data-color-fn="bubble_fn_ubeColor"></div>

<script>
(function(){
  /* Loader nach STYLEGUIDE §26: den Pin ueber getElementsByClassName lesen, NIEMALS ueber
     document.currentScript — Bubble fuehrt Scripts nicht in DOM-Reihenfolge aus. */
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_" + "PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("ube-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  /* core zuerst, async=false haelt die Reihenfolge ein. Coloris (der Farbwaehler) laedt die
     Komponente selbst nach, einmal pro Seite -- er steht hier absichtlich nicht: faellt er aus,
     bleibt das Hexfeld ein Textfeld, und dafuer muss niemand etwas einbauen. */
  css("core.css");           js("core.js");
  css("brand-editor.css");   js("brand-editor.js");
})();
</script>

<!--
  ============================================================================================
  RUN-JAVASCRIPT-SCHRITTE (Toolbox) — die Daten hinein
  ============================================================================================
  Reines JavaScript, wie in jeder anderen Vorlage: ab "(function () {" bis "})();" markieren.
  Ein <script> gehoert NICHT hinein -- Bubble wertet den Text als JavaScript aus, und das Tag
  killt den Schritt mit "Unexpected token '<'" samt aller Setter, die danach kommen.

  Die zwei Ersetzungen sind Pflicht (§46): leeres Feld -> null, nacktes yes/no -> true/false.
  Namen mit Anfuehrungszeichen, spitzen Klammern oder Emoji brauchen nichts weiter -- die
  Komponente escapet jeden Text. Geprueft mit Mueller & "Soehne" <GmbH> und Emoji im Alias.

  ── SCHRITT 1: statisch, zum Ausprobieren ohne Datenbank ───────────────────────────────────
  Genau der Payload aus der Uebergabe, damit man den Editor in Bubble sehen kann, bevor die RPC
  steht. Derselbe Text laeuft im Harness _h_ube.html gegen die fertige Komponente.

  (function () {
    var STATISCH = `{
      "aliases": [
        {
          "mode": "exact_ci",
          "pattern": "anfragenfluss.de",
          "alias_id": "8f4fcc2c-f61b-414c-92e9-694f64fa7da4",
          "priority": 100,
          "is_active": true,
          "created_at": "2026-02-27T07:20:18.290477+00:00"
        }
      ],
      "company": {
        "name": "Anfragenfluss",
        "domain": "www.anfragenfluss.de",
        "company_id": "fd2f56a4-d11d-45a3-b10e-bd93a249b75f",
        "favicon_url": "https://www.google.com/s2/favicons?domain=anfragenfluss.de&sz=64",
        "default_color": null,
        "color_override": null,
        "effective_color": null
      },
      "tracking_periods": [
        { "ended_at": null, "started_at": "2026-02-26T20:59:16.117706+00:00", "start_reason": "created" }
      ]
    }`
      .replace(/:\s*([,}\]])/g, ": null$1")
      .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });

    if (typeof window.setBrandEditor === "function") {
      window.setBrandEditor("INSTANCE_ID", STATISCH);
    }
  })();

  ── SCHRITT 2: Skelett AN, vor der RPC ─────────────────────────────────────────────────────

  (function () {
    if (typeof window.setBrandEditorLoading === "function") {
      window.setBrandEditorLoading("INSTANCE_ID", "yes");
    }
  })();

  ── SCHRITT 2b: Skelett AUS, wenn die RPC NICHT geliefert hat ──────────────────────────────
  Nur fuer den Fehlerzweig. Im Gutfall beendet setBrandEditor den Ladezustand selbst -- diesen
  Schritt danach zu rufen, waere ein zweiter Weg zum selben Ziel.
  Ohne Daten zeigt die Komponente danach "This brand could not be loaded. Please open it again."
  statt eines Skeletts, das ewig laeuft.

  (function () {
    if (typeof window.setBrandEditorLoading === "function") {
      window.setBrandEditorLoading("INSTANCE_ID", "no");
    }
  })();

  ── SCHRITT 3: Marke anzeigen, NACH der RPC ────────────────────────────────────────────────
  Bubble-Ausdruecke stehen in <>. Alles andere bleibt, wie es ist.

  (function () {
    var INSTANCE_ID = "INSTANCE_ID";

    var ROH = `<Result of step X (Supabase RPC)'s data:formatted as JSON-safe>`;

    var payload = ROH
      .replace(/:\s*([,}\]])/g, ": null$1")
      .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });

    if (typeof window.setBrandEditor === "function") {
      window.setBrandEditor(INSTANCE_ID, payload);
    }
  })();

  ── SCHRITT 4: zuruecksetzen, wenn die Schublade schliesst ─────────────────────────────────

  (function () {
    if (typeof window.resetBrandEditor === "function") {
      window.resetBrandEditor("INSTANCE_ID");
    }
  })();
-->
