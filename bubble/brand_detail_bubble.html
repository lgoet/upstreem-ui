<!-- ==========================================================================================
     upstreem — Brand Detail (Praefix `ubd`)

     Der Kopfbereich der Marken-Detailseite: ein Switcher mit vier Ansichten, darunter eine Karte
     mit Ueberschrift, grosser Kennzahl und Kurve. Im vierten Modus tritt an die Stelle der Kurve
     die Variantentabelle.

     Dieses HTML-Element traegt NUR das Wurzel-Div. Alles darunter baut die Komponente selbst --
     hier ist keine Stelle, an der von Hand etwas eingesetzt werden soll.

     ── FRISCHE INSTALLATION ──────────────────────────────────────────────────────────────────
     Diese Datei ist eine VORLAGE. Aenderungen daran erreichen ein bereits eingebautes Element
     NICHT -- dort muss dasselbe von Hand nachgezogen werden.

     ── ATTRIBUTE ─────────────────────────────────────────────────────────────────────────────
       data-instance      eindeutig pro Platzierung. Alle Setter sprechen ueber diese ID.
       data-cdn-pin       Commit-Hash. NIEMALS leer lassen: leer zieht "@main", und das liefern
                          jsDelivr und der Browser aus einem bis zu tagealten Cache. Eine zweite,
                          aeltere Kopie auf derselben Seite kann eine korrekt gepinnte Komponente
                          aushebeln -- core.js meldet das in der Konsole, sobald es passiert.
       data-isdark        "yes"/"no". Steuert Dark Mode.
       data-isprocessing  "yes"/"no". Optional; solange "yes", zeigt die Karte ihr Skelett.

     Die Event-Namen sind ebenfalls Attribute, damit mehrere Seiten dieselbe Komponente mit
     eigenen Workflows benutzen koennen:
       data-mode-fn       Standardname bubble_fn_ubdMode
       data-gran-fn       Standardname bubble_fn_ubdGran

     ── EVENTS (JavaScriptToBubble, Value type: TEXT) ─────────────────────────────────────────
     Beide bekommen EINEN JSON-Text (STYLEGUIDE §13). Beide tragen mode UND gran, damit ein
     Workflow nie einen der beiden Werte aus einem State nachschlagen muss:

       bubble_fn_ubdMode   {"mode":"visibility|rank|sentiment|variations","gran":"day|week|month"}
                           Feuert, wenn der Nutzer die Ansicht wechselt.
       bubble_fn_ubdGran   {"mode":"...","gran":"..."}
                           Feuert beim Wechsel der Granularitaet.

     Beide bedeuten dasselbe fuer dich: LADE NEU. Der Unterschied steht nur im Payload, damit du
     bei Bedarf unterschiedlich reagieren kannst -- etwa den Varianten-RPC nur beim Moduswechsel
     auf "variations" anzustossen.

     WICHTIG: Die Komponente wechselt die Ansicht SOFORT und fragt erst danach. Sie zeigt bis zur
     Antwort ihr Skelett. Es gibt also keinen Zustand, in dem sie auf dich wartet, ohne dass der
     Nutzer das sieht.

     ── DATEN HEREIN ──────────────────────────────────────────────────────────────────────────
       setBrandDetailCompany(instanceId, payload)
         Die Zeile aus dem Marken-RPC, als Text oder als Liste mit einer Zeile -- beides wird
         angenommen. Gelesen werden: name, logo_url, avg_visibility_pct, avg_visibility_delta_pct,
         avg_rank, avg_rank_delta, avg_sentiment, avg_sentiment_delta.

       setBrandDetailSeries(instanceId, payload)
         {"mode":"visibility","series":[{"day":"2026-08-08","value":38.54}, ...],
          "company_id":"..."}
         EIN Modus pro Aufruf. Der mode im Payload MUSS zum gewaehlten Modus passen -- eine Antwort
         aus einem anderen Modus wird verworfen und das Skelett bleibt stehen. Das ist Absicht:
         sonst laege eine Rang-Kurve unter der Visibility-Ueberschrift, wenn zwei Antworten sich
         ueberholen.

       setBrandDetailVariations(instanceId, rows)
         Die Varianten dieser Marke, GESAMT (nicht pro Thema). Erwartet name und mentioned_count.

       setBrandDetailLoading(instanceId, "yes"|"no")
       resetBrandDetail(instanceId)

     ── SANITIZER (STYLEGUIDE §46) ────────────────────────────────────────────────────────────
     NIEMALS ein JS-Objekt im Step von Hand bauen. Also NICHT so:

       setBrandDetailCompany("x", { name: <ausdruck>, visibility_prev: <ausdruck> })   FALSCH

     Ist einer der Ausdruecke leer, steht dort "visibility_prev": , -- und das ist kein
     gueltiges JavaScript. Der Step scheitert dann beim PARSEN, bevor eine einzige Zeile laeuft:
     "Uncaught SyntaxError: Unexpected token ','". Kein Sanitizer und kein Code im Kit kann das
     abfangen, weil nichts davon zur Ausfuehrung kommt. Und weil der ganze Step stirbt, gehen
     auch die Aufrufe darunter mit -- die Komponente bleibt im Ladezustand stehen.
     Gemeldet am 24.08. an brand-detail, mit einem leeren _prev-Wert.

     RICHTIG ist immer: EIN Backtick, der den ROHEN Text der RPC traegt, und die beiden
     Ersetzungen darauf. Im Backtick ist ein leeres Feld nur Text und bringt nichts zum Absturz;
     die erste Ersetzung macht daraus null, die zweite quotiert yes/no.

       (function () {
         var roh = `PAYLOAD_HIER`
           .replace(/:\s*([,}\]])/g, ": null$1")
           .replace(/:\s*(yes|no)\s*([,}\]])/g, function(_, v, t){ return ": " + (v === "yes") + t; });
         /* Jeder Aufruf in seinem EIGENEN try: ein kaputter oder fehlender Ausdruck darf die
            anderen nicht mitnehmen. */
         try { window.setBrandDetailCompany("INSTANCE_ID", roh); } catch (e) {}
       })();

     Mehrere Setter im selben Step: je EIN Backtick pro RPC, je ein try. Nicht zusammenfassen --
     eine Zeichenkette fuer zwei Antworten ist wieder eine Stelle, an der beides zugleich kippt.

     Die EINZIGE Zeichenfolge, die im Backtick selbst gefaehrlich bleibt, ist ein Backtick oder
     ${ im Wert. Beides kommt in Marken- und Domainnamen nicht vor; alles andere -- Anfuehrungs-
     zeichen, Apostrophe, Umlaute, Zeilenumbrueche, Emoji -- traegt der Backtick unbeschadet.

     ── EINBAU IN KUERZE ──────────────────────────────────────────────────────────────────────
     1. Dieses HTML-Element auf die Seite, data-instance und data-cdn-pin setzen.
     2. Zwei JavaScriptToBubble-Elemente anlegen (Suffix ubdMode und ubdGran, Value type TEXT,
        Trigger event an).
     3. Je einen Workflow: mode/gran aus dem Wert lesen, passenden RPC laden, Ergebnis ueber
        setBrandDetailSeries bzw. setBrandDetailVariations zurueckgeben.
     4. Beim Seitenaufbau einmal setBrandDetailCompany und setBrandDetailSeries mit mode
        "visibility" -- das ist der Startzustand der Komponente.
     ========================================================================================== -->

<div class="up-root ubd-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-isprocessing="IS_PROCESSING"
     data-mode-fn="bubble_fn_ubdMode"
     data-gran-fn="bubble_fn_ubdGran"></div>

<script>
(function(){
  /* Loader nach STYLEGUIDE 26: den Pin ueber getElementsByClassName lesen, NIEMALS ueber
     document.currentScript — Bubble fuehrt Scripts nicht in DOM-Reihenfolge aus. */
  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       jsDelivr antwortet mit 404, und weder CSS noch JS landen. Ohne trim greift auch kein
       Rueckfall, weil "   " truthy ist.
       Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
       Waechter treffen, und der Loader liefe dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* ---- Rueckfall: einen Pin nehmen, der auf DIESER Seite schon gilt ----------------------
       Gemeldet am 31.08. mit drei Stapelspuren, alle aus einem solchen Loader: "core.css ist
       schon von einem anderen Pin geladen ... ignoriert wird @main" -- obwohl der Pin am Element
       stand. Der Grund ist die Reihenfolge: Bubble baut ein Element bei jedem Rerender neu und
       fuehrt Scripts nicht in DOM-Reihenfolge aus, dieser Loader lief also, waehrend seine eigene
       Wurzel noch nicht im Dokument stand -- die Klasse oben fand nichts.
       Und das war mehr als eine Warnung: core kam durch die Entdoppelung unten noch aus dem Pin,
       die Dateien DIESER Komponente aber tatsaechlich von @main. Eine Seite, die zur Haelfte auf
       @main laeuft, ist genau das, was ein Pin verhindern soll.
       Geraten wird nichts: jede der drei Stufen liest einen Pin, der auf dieser Seite schon in
       Gebrauch ist. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* Aus einer schon geladenen Datei ablesen. Diese Stufe greift auch dann, wenn alle anderen
       Elemente der Seite noch die ALTE Fassung dieses Loaders tragen -- die fuellen
       __upAssetsLoaded genauso. "main" wird NICHT gemerkt: das ist kein Pin, und die naechste
       Komponente wuerde ihn sonst fuer einen halten. */
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("ubd-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL. Zwei Elemente mit verschiedenen data-cdn-pin
     ergeben zwei URLs fuer dieselbe Datei -- vorher lud der Loader dann beide: core.js lief
     zweimal, und core.css stand zweimal im Dokument, wobei die spaetere die fruehere ueberschrieb.
     Wer gewinnt, entschied die Reihenfolge, in der Bubble die Elemente baut.
     Der erste Pin gewinnt jetzt, und ein zweiter wird gemeldet -- sonst sucht man den Unterschied
     zwischen zwei Seiten, auf denen dieselbe Version verschiedene Dinge tut. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  /* core zuerst, async=false haelt die Reihenfolge ein. */
  css("core.css");             js("core.js");
  css("brand-detail.css");     js("brand-detail.js");
})();
</script>
