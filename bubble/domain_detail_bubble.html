<!--
  UPSTREEM — DOMAIN DETAIL (Praefix udd)

  WOHIN: ein HTML-Element auf der Domain-Detailseite. Das Element ist LEER bis auf das Wurzel-Div;
  die Komponente baut ihren gesamten Innenaufbau selbst.

  ── Die drei Abschnitte ──────────────────────────────────────────────────────
  1. Umschalter "Citation Share" / "Domain Share" ueber einer Karte mit Favicon, Ueberschrift,
     Tag/Woche/Monat-Schalter, KPI (globaler Anteil samt Trend) und der Kurve.
     Im Domain-Share kommt ein zweiter Schalter dazu (Global / Domain) und die KPI-Zeile faellt
     weg -- dort fuellt die Kurve deren Platz.
  2. "Source Funnel": DREI Stufen mit absoluten Werten. "Responses citing this domain" ist raus --
     die Stufe zaehlte Antworten, die anderen zaehlen URLs, und weil jede Stufenhoehe ihr Anteil an
     der ERSTEN ist, war die Verjuengung danach willkuerlich.
     ai_searches_citing_domain darf im Payload bleiben, es wird nur nicht mehr gezeichnet.
  3. "Model Breakdown": ein Balken je Modell.

  ── Attribute am Wurzel-Div ──────────────────────────────────────────────────
  | Attribut          | Pflicht | Bedeutung                                                |
  |-------------------|---------|----------------------------------------------------------|
  | data-instance     | JA      | eindeutig je Platzierung; die Setter sprechen sie darueber an |
  | data-cdn-pin      | JA      | derselbe Commit-Hash wie auf allen anderen Elementen der Seite |
  | data-isdark       | nein    | "yes"/"no". Kennt core ein Thema, gewinnt core (UC.themeParam) |
  | data-brand        | nein    | Name der eigenen Marke -- steht in der vierten Trichterstufe  |
  | data-mode-fn      | nein    | Toolbox-Funktion fuer den Wechsel Citation/Domain Share    |
  | data-gran-fn      | nein    | Toolbox-Funktion fuer Tag/Woche/Monat                      |
  | data-scope-fn     | nein    | Toolbox-Funktion fuer Global/Domain im Domain-Share        |

  Die drei *-fn-Attribute sind der Weg nach Bubble: jeder Klick feuert das Ereignis mit
  { mode, gran, scope } als JSON.

  ── Welches Ereignis welche Daten braucht ────────────────────────────────────
  | Ereignis  | ausgeloest durch        | der Workflow ruft                                |
  |-----------|------------------------|--------------------------------------------------|
  | uddMode   | Citation/Domain Share  | domain -> setDomainDetailUrls, citation -> nichts (die Daten sind schon da) |
  | uddScope  | Global/Domain          | setDomainDetailUrls mit dem anderen Bezug        |
  | uddGran   | Day/Week/Month         | citation -> setDomainDetail, domain -> setDomainDetailUrls |

  Die URL-Serie ist also ein EIGENER Schritt an drei Ereignissen -- dieselbe Abfrage, andere
  Parameter. Der Payload sagt mit share_mode selbst, welchen Bezug er hat; die Komponente richtet
  ihren Schalter danach, statt ihn zu ueberschreiben. So kann eine Antwort, die noch unterwegs war,
  den Schalter nicht verdrehen.

  DARAUS FOLGT eine Pflicht fuer die RPC: bei scope "domain" muss sie
    a) share_pct je Punkt auf die Domain bezogen liefern (Anteil an den Zitationen DIESER Domain,
       nicht an allen), und
    b) share_mode: "domain" mitschicken.
  Kommt die Antwort mit share_mode "global" zurueck, springt der Schalter zurueck auf Global --
  richtig, denn die gelieferten Zahlen SIND global. Gemessen: Klick setzt den Schalter auf domain,
  die Antwort mit share_mode "global" setzt ihn zurueck, die Kurve bleibt unveraendert. Das ist
  kein Fehler der Komponente, sondern die Antwort auf einen Payload, der den Bezug nicht wechselt.

  Solange eine angeforderte URL-Serie nicht da ist, zeigt das Chart ein SKELETT -- nicht "No URL
  data". Der Satz waere eine Aussage ueber die Daten, und die kann niemand treffen, solange der
  Workflow noch laeuft. Bleibt die Antwort 25 Sekunden aus, steht "No data" im Chart -- und der
  Grund in der Konsole, nicht im UI. Trichter und Model Breakdown bleiben davon unberuehrt: sie
  haengen an setDomainDetail.

  OHNE diese Workflows schaltet die Ansicht um, aber es kommen keine neuen Zahlen -- der
  Domain-Share bleibt dann im Skelett und zeigt nach 25 Sekunden "No data"; die Konsole sagt,
  welcher Workflow gefehlt hat.

  ── Die vier Setter ──────────────────────────────────────────────────────────
    setDomainDetail("<instance>", <json>)         Kopf, Zeitreihen, Modelle, Trichter
    setDomainDetailUrls("<instance>", <json>)     die Top-URLs fuer den Domain-Share
    setDomainDetailLoading("<instance>", "yes")   Skelette an
    resetDomainDetail("<instance>")               alles leer, zurueck auf Citation Share / Day

  Beide Daten-Setter nehmen den JSON als TEXT oder als Objekt. Ein Payload, den core nicht lesen
  kann, endet als benannter Fehler in der Karte -- nicht als endloses Skelett.

  ── URL-Typen (neu) ──────────────────────────────────────────────────────────
  types_breakdown: [{ type, share_pct }, ...] im Payload von setDomainDetail. Dieselbe Form, die
  das Combo-Chart und das Topcitations-Dashboard schon bekommen -- Namen und Farben holt core aus
  URL_LABEL und der URL-Farbskala, es ist nichts mitzugeben.
  Fehlt das Feld, bleibt die Karte im Skelett: "keine Typen" waere eine Aussage ueber Daten, die
  gar nicht geschickt wurden.
  url_share bleibt ein EIGENER Aufruf (setDomainDetailUrls) und kommt nicht im Pageload mit.

  ── Sanitizer (STYLEGUIDE §46) ───────────────────────────────────────────────
  Ein Bubble-Ausdruck liefert leere Werte als "key": , und Ja/Nein unquotiert. Beides bricht
  JSON.parse. Diese zwei Zeilen gehoeren an JEDEN Aufruf, der einen Bubble-Text weitergibt:

      .replace(/:\s*([,}\]])/g, ": null$1")
      .replace(/:\s*(yes|no)\s*([,}\]])/g, function(_, v, t){ return ": " + (v === "yes") + t; })

  ── Statischer Start zum Ausprobieren ────────────────────────────────────────
  Die Beispieldaten liegen NICHT in diesem Element: sie kommen als Run-JS-Schritte in die
  Workflows, getestet im Repo als
      _h_udd_runjs.js        Schritt 1, Seitenstart -> setDomainDetail
      _h_udd_runjs_urls.js   Schritt 2, an uddMode/uddScope/uddGran -> setDomainDetailUrls
  So ist der Weg vom ersten Tag der echte -- Workflow ruft Setter --, und fuer den Livegang wird
  nur der Inhalt der Schritte getauscht, nicht das Element angefasst.
-->

<div class="up-root udd-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-brand="BRAND_NAME"
     data-mode-fn="bubble_fn_uddMode"
     data-gran-fn="bubble_fn_uddGran"
     data-scope-fn="bubble_fn_uddScope"></div>

<script>
(function(){
  /* Loader nach STYLEGUIDE §26: den Pin ueber getElementsByClassName lesen, NIEMALS ueber
     document.currentScript — Bubble fuehrt Scripts nicht in DOM-Reihenfolge aus. */
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_" + "PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("udd-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL: zwei Elemente mit verschiedenen Pins ergeben sonst
     zwei Dateien im Dokument, und welche gewinnt, entscheidet die Ladereihenfolge. Der erste Pin
     gewinnt, ein zweiter wird gemeldet. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  /* core zuerst, async=false haelt die Reihenfolge ein. */
  css("core.css");            js("core.js");
  css("domain-detail.css");   js("domain-detail.js");
})();
</script>
