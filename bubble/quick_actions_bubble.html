<!-- ============================================================

  ── Marken kommen jetzt SEITENWEIT ───────────────────────────────────────────
  Ein Aufruf pro Seite, nicht mehr einer pro Placement:

      window.setUpstreemBrands(brandsJson);
        Feldnamen frei: {id|company_id, name|label, logo|logo_url|favicon|favicon_url} -- der Store
        normalisiert und legt jede Zeile unter ALLEN diesen Namen ab, damit jede Komponente
        findet, was sie sucht. Zusatzfelder (role, position, ...) bleiben erhalten.
        Protokoll-relative Logo-URLs ("//cdn...") werden auf https:// gezogen.

  Jede Komponente mit einer Marken-Auswahlliste zieht daraus -- Tabellen, Charts, Quick Actions,
  Performance Radar. Der komponenteneigene Setter weiter unten bleibt bestehen und funktioniert
  unveraendert; er ist ab jetzt nur noch der Rueckfall. Ein LEERER Store ueberschreibt nie, eine
  Seite ohne setUpstreemBrands() verhaelt sich also exakt wie vorher.

  Gegenrichtung: wer eine Marke anlegt, umbenennt oder deaktiviert, ruft
  window.upstreemBrandsChanged() -- dafuer ein Toolbox-Element "JavaScript to Bubble" namens
  upBrandsChanged anlegen (Trigger event angehakt), dessen Workflow den Marken-RPC neu laufen
  laesst und setUpstreemBrands() ruft. Ohne das erscheinen neue Marken erst nach einem Reload.
     upstreem · Quick Actions (Cmd-K command menu)
     Paste into a Bubble HTML element — once, page-level (this is a singleton, id="mira-quick-actions",
     not a repeatable per-instance .up-root component like the tables/charts).

     MIGRATION NOTE: this component was previously fully standalone (markup + <style> + <script>
     all inline in one HTML element, no CDN, no dependency on this repo). This file only moves its
     CSS/JS onto the same jsDelivr-pinned loading system every other component here uses — every
     JS event name, every bubble_fn_* it calls, the whole window.MiraQuickActions API, and the
     data-theme/data-team attributes are byte-for-byte unchanged from the standalone version.
     Deliberately does NOT load core.css/core.js: this component never used any shared UC.* kit
     function or .up-root token, it already shipped its own complete --am-* token set and its own
     box-sizing reset, so pulling core.css in would just be a second Geist @import for no benefit.

     ONE NEW RISK worth knowing, purely a side effect of moving off inline <script>: the inline
     version's whole init ran again every time Bubble re-injected this HTML block, so a torn-down-
     and-rebuilt element (e.g. inside a repeating group or a conditional) always got wired back up.
     The loader below dedupes network requests — quick-actions.js is fetched and its IIFE executed
     exactly ONCE per page load, same as every other component's script here. If Bubble ever tears
     down and rebuilds #mira-quick-actions itself (not just its container), that rebuilt copy won't
     get its listeners re-attached, because nothing here re-runs the IIFE. In practice this is very
     likely fine — a global Cmd-K palette normally lives in a persistent page header/floating group
     that Bubble never rebuilds — but if you ever see the trigger button stop responding after a
     specific workflow step, that is the thing to check first.

     Fixed in passing: the CSS had `background: var(--am-hover-bg)` on three hover states
     (.mqa-chip-x, .mqa-clear, .mqa-recent-x) but never defined --am-hover-bg — those hovers never
     showed a background. Added the token in quick-actions.css. Nothing else about the visuals or
     behavior changed; everything else already matched this repo's conventions (avatar radius,
     trend up/down colors, spacing scale).
     ============================================================

     ── ATTRIBUTES on the root div (all optional) ──────────────────────────────
       data-theme     "light" | "dark"        — same as MiraQuickActions.setTheme(), start-up value
       data-team      team id (string)        — same as MiraQuickActions.setTeam(), start-up value
       data-cdn-pin   commit hash             — pins the CDN load below; blank/"CDN_PIN" -> @main

     ── PUBLIC JS API (window.MiraQuickActions) — unchanged ────────────────────
       .open() / .close() / .clear()
       .setTheme(theme)              "light" | "dark"
       .setTeam(id)                  scopes recent-searches memory; drops them if the team changes
       .setBrands([{id,name,logo|favicon}, ...])     feeds the "/mentioning" sub-menu
       .setMarkets([{value}, ...] | ["de","us",...]) feeds the "/market" sub-menu
       .setLoading(requestId)        ignored if requestId isn't the current search's id
       .setResults({requestId, items})   items: array, or a JSON string (auto-repaired if a value
                                          inside it has a stray unescaped quote)
       .setError({requestId, message})
       .parseItems(items)            exposed so a Bubble "Run JavaScript" step can pre-sanitize:
                                        MiraQuickActions.setResults({ requestId: `ID`,
                                          items: MiraQuickActions.parseItems(`[RESPONSE]`) });

     ── OUTBOUND: search ─────────────────────────────────────────────────────
       Fires once per debounced keystroke / filter change / rank pick. Calls
       window.bubble_fn_quick_actions_search(JSON.stringify(detail)) AND dispatches
       CustomEvent("mira_quick_actions_search", {detail}) — wire up whichever your workflow reads.
       detail = {
         query, query_folded (diacritics stripped), query_de (German transliteration),
         scope,            "" | "url" | "brand" | "domain" | "prompt"
         rank,              "" | "top" | "trending"
         citation_type,     "" | "You" | "Competition" | "Brand_Platform" | "Editorial" |
                             "Institutional" | "Knowledge_Base" | "UGC_Community"
         url_type,           "" | one of the 15 URL types (scope=url only)
         market, mentioning (brand id or name),
         limit,              15 if a scope is picked, else 5
         requestId            echo this back in setResults/setError/setLoading
       }
       Reply with MiraQuickActions.setResults({requestId, items}), items each shaped:
         { type: "brand"|"domain"|"url"|"prompt", id, name, logo, domain, favicon, url, title,
           prompt_text, market, share_pct, trend_pct, metric (ready-made string, optional) }

     ── OUTBOUND: static actions ──────────────────────────────────────────────
       add_new_prompt  -> bubble_fn_qa_add_prompt()   + CustomEvent("mira_qa_add_prompt")
       add_new_brand   -> bubble_fn_qa_add_brand()    + CustomEvent("mira_qa_add_brand")
       export_data     -> bubble_fn_qa_export_data()  + CustomEvent("mira_qa_export_data")
       edit_your_brand -> bubble_fn_qa_edit_brand()   + CustomEvent("mira_qa_edit_brand")

     ── OUTBOUND: selecting a result row ────────────────────────────────────
       bubble_fn_qa_select_brand(value)   value = company/brand id
       bubble_fn_qa_select_domain(value)  value = domain
       bubble_fn_qa_select_url(value)     value = url
       bubble_fn_qa_select_prompt(value)  value = prompt id
       Each also dispatches CustomEvent("mira_qa_select_" + cat, {detail:{value}}).

     ── per-row "more" menu (hover a result OR a Recent row for ~750ms) ─────
       Shows on real search results AND on the "Recent" (last-viewed) rows — NOT on the
       separate "Recent Searches" list (those are saved queries/filters, not a single item).
       Open              same as clicking the row — calls the bubble_fn_qa_select_* above.
       Open in new tab   pure client-side, fires NOTHING to Bubble. Builds
                           <current origin+path>?view=<current ?view= value, if any>
                             &detail=<type>:<value>
                         and window.open()s it. This mirrors the app's own drawer-URL convention
                         (?detail=brand:<id> / domain:<domain> / url:<url> / prompt:<id>) — no
                         Bubble workflow step needed, nothing to wire up on that side.
                         Any ?detail= already on the CURRENT page is dropped, not carried over —
                         "open in new tab" always means the current view plus exactly ONE fresh
                         drawer, never whatever was already open here.

     ── keyboard ────────────────────────────────────────────────────────────
       Cmd/Ctrl+K opens/closes globally (capture phase). Inside: ↑/↓ move, Enter activates the
       highlighted row, Esc closes, Backspace on an empty field with active filters removes the
       most recent one, ↑ on an untouched empty field recalls the last search.

       Enter also runs the search when there is nothing to activate: with chips set but neither
       /top nor /trending picked, no row is pre-highlighted and Enter adds /top, which is what
       makes the search runnable without a query. A "Press Enter to search" hint appears under
       the input field in exactly that state (clicking it does the same thing). While a selection
       list is open — the command list, or the brand/type sub-lists — a row IS highlighted, so
       Enter keeps picking that row as before.

     ── favourite searches (localStorage, no Bubble involvement) ─────────────
       Once a search is running, a star button appears in the input, left of the trash icon. It
       saves the current query+chips under "Favorites" in the idle screen, below "Recent
       Searches"; max 5, hovering a row swaps its star for an x to remove it. Stored in
       localStorage under "mqa_fav_<team id>" — so favourites survive a reload (unlike Recent
       Searches, which stay session-only on purpose) but never leak between teams. Switching
       teams via MiraQuickActions.setTeam() switches the list with it.
     ============================================================ -->
<div id="mira-quick-actions" data-theme="light" data-team="" data-cdn-pin="CDN_PIN">
  <button class="mqa-trigger" type="button" aria-label="Open quick actions">
    <svg class="mqa-trigger-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span class="mqa-trigger-label">Quick Actions</span>
    <span class="mqa-kbd" data-kbd>⌘K</span>
  </button>

  <div class="mqa-overlay" role="presentation" aria-hidden="true">
    <div class="mqa-modal" role="dialog" aria-modal="true" aria-label="Quick actions">
      <div class="mqa-search">
        <svg class="mqa-search-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span class="mqa-chips" id="mqa-chips"></span>
        <span class="mqa-inputwrap">
          <input class="mqa-input" type="text" autocomplete="off" spellcheck="false" placeholder="" aria-label="Search" />
          <span class="mqa-ph" id="mqa-ph" aria-hidden="true">Search brands, domains, URLs, prompts…</span>
        </span>
        <span class="mqa-ph-cmd" id="mqa-ph-cmd" aria-hidden="true">/ for filters</span>
        <span class="mqa-kbd mqa-esc" id="mqa-esc">esc</span>
        <button class="mqa-fav is-hidden" type="button" id="mqa-fav" aria-pressed="false" aria-label="Save as Favorite">
          <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
        <button class="mqa-clear is-hidden" type="button" id="mqa-clear" aria-label="Reset search">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
      <button class="mqa-entercta is-hidden" type="button" id="mqa-entercta">
        Press
        <span class="mqa-kbd"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>Enter</span>
        to search
      </button>
      <div class="mqa-scroll">
        <div class="mqa-results" aria-live="polite"></div>
      </div>
      <div class="mqa-recent-wrap" id="mqa-recent"></div>
      <div class="mqa-actions-wrap"></div>
    </div>
  </div>
</div>
<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). Same dedupe-registry pattern as every other component's loader in this
   repo — see e.g. bubble/domains_table_bubble.html for the full rationale. Reads the pin by ID
   since this component is a page-level singleton, not a repeatable class-based root. */
(function(){
  /* Boot-Stub fuer den Brand-Store. Bubble ruft setUpstreemBrands() im Page-Load-Workflow, also
     regelmaessig BEVOR core.js geladen ist. Ohne diesen Stub ist window.setUpstreemBrands zu dem
     Zeitpunkt undefined, der Run-JS-Schritt wirft, und der GANZE Aufruf ist weg -- die Seite sieht
     danach aus wie eine ohne Marken, ohne dass irgendwo ein Fehler steht. core.js leert die Queue
     beim Start. Dasselbe Muster wie bei Topics und Markets (__upTopicsQueue / __upMarketsQueue). */
  window.__upBrandsQueue = window.__upBrandsQueue || [];
  if (typeof window.setUpstreemBrands !== "function"){
    window.setUpstreemBrands = function(rows){ window.__upBrandsQueue.push(rows); };
  }

  function readPin(){
    var el = document.getElementById("mira-quick-actions");
    var p = el ? (el.getAttribute("data-cdn-pin") || "").trim() : "";
    return (p && p !== "CDN_PIN") ? p : "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin() + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  /* core.js zuerst -- der Marken-Store (setUpstreemBrands) lebt dort, und dieser Loader war der
     einzige, der ihn nicht mitgeladen hat. core.css bleibt aussen vor: die Palette bringt ihr
     eigenes Styling mit. */
  js("core.js");
  css("quick-actions.css");
  js("quick-actions.js");
})();
</script>
