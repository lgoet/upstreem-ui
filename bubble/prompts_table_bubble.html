<!--
  UPSTREEM — PROMPTS TABLE

  Classic table listing the team's tracked prompts: search, sortable columns, per-row selection,
  and a Table Settings menu with column visibility PLUS a 3-way row height (Default / Compact /
  Dynamic — the first two are the familiar 72px/55px, Dynamic grows the row to fit the full
  prompt text instead of clamping it).

  Column order: Prompt, Visibility, Rank, Sentiment, Brand Mentions, Topics, Market, Created.
  Visibility/Rank/Sentiment are all about the ONE tracked brand (data-brand-name) — its logo
  sits in the Visibility header instead of repeating it per row. Those three plus Brand Mentions
  and Market have a hover info icon (same "i" pattern as visibility-chart/urls-table).

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance   = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin    = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the literal
                    "CDN_PIN" placeholder) to load @main. Point this at a Bubble constant/Option
                    Set field you control so every placement can be repinned to a new commit in
                    one edit instead of hunting down every embed's URL by hand — @main itself lags
                    jsDelivr's cache, sometimes for hours, so a fresh fix may not actually be live
                    yet even right after it's pushed. The loader script at the bottom reads this
                    once and builds every asset URL from it.
  data-isdark     = "yes" / "no"
  data-brand-name = the brand's display name (for the "X mentioned" quick toggle) — leave the
                    literal "BRAND_NAME" placeholder to hide the toggle entirely
  data-brand-logo = the brand's logo url (optional)
  data-sticky-top = px offset from the top at which the sticky header pins
                    (= height of your page's topbar, e.g. "171"). Desktop only (>=1000px page
                    width). Set "no" on data-sticky to disable.

  ── Event names must be unique per placement ─────────────────────────────────
  data-search-fn    = "bubble_fn_uptSearch_[dynamic id]"
  data-sort-fn      = "bubble_fn_uptSort_[dynamic id]"
  data-brand-fn     = "bubble_fn_uptBrand_[dynamic id]"
  data-mentioned-fn = "bubble_fn_uptMentioned_[dynamic id]"    multi-select brands filter dropdown
  data-page-fn      = "bubble_fn_uptPage_[dynamic id]"
  data-rowclick-fn  = "bubble_fn_uptRowClick_[dynamic id]"
  data-select-fn    = "bubble_fn_uptSelect_[dynamic id]"
  data-topics-fn    = "bubble_fn_uptTopicsClick_[dynamic id]"
  data-status-fn      = "bubble_fn_uptStatus_[dynamic id]"        view switch Active/Inactive
  data-bulktopics-fn  = "bubble_fn_uptBulkTopics_[dynamic id]"    unused — kept for back-compat, see below
  data-applybulktopics-fn = "bubble_fn_uptApplyBulkTopics_[dynamic id]"  the topic editor's Apply button
  data-bulkstatus-fn  = "bubble_fn_uptBulkStatus_[dynamic id]"    bulk set active/inactive
  data-bulkdelete-fn  = "bubble_fn_uptBulkDelete_[dynamic id]"    bulk hard-delete, Inactive view only
  data-addtopics-fn   = "bubble_fn_uptAddTopics_[dynamic id]"      "Add Topic" in the bulk editor

  data-export-instance = the instanceId of the EXPORT POPUP component you place on the same
                         page. The Export button calls window.upstreemExportOpen(thatId), exactly
                         as in urls-table/domains-table.

  Every one fires ONE JSON string, values pulled out on the Bubble side by regex — same
  convention as the other tables. All of these except rowclick/select are SERVER-side: they tell
  Bubble to re-run the RPC, this component never filters/sorts/paginates locally.

    search   {"query":"nike","query_folded":"nike","query_de":"nike","requestId":"upt_…"}
    sort     {"order":"visibility_desc","sort_field":"visibility","sort_dir":"desc"}
    brand    {"brand_mentioned":"yes"}          "yes" | "no" | ""  (empty = off)
    mentioned {"brands":"id1,id2"}              multi-select brands filter, same shape/behaviour
                                                  as urls-table/responses-table's dropdown
    page     {"limit":25,"offset":50,"page":3}
    rowclick {"prompt_id":"614ebcc4-c784-440c-aff8-0394e59ae266"}
    select   {"selected":"id1,id2,id3","count":3}   -> fires on every checkbox change; carries the
                                                        WHOLE selection, which deliberately
                                                        survives paging and sorting
    topics   {"prompt_id":"614ebcc4-…","prompt_text":"Best running shoes 2026","tag_ids":"t1,t2"}
                -> click on the Topics cell. Deliberately does NOT also fire rowclick — open your
                   topic management for that prompt here. prompt_text and tag_ids (comma-joined,
                   same convention as "selected"/"ids" elsewhere) are read straight off that row's
                   already-loaded data, no extra lookup needed on your side. Inactive prompts have
                   no topic management at all — the cell is inert there and this event never fires
                   (see "status" below).
    status   {"status":"inactive","is_active":"no","limit":25,"offset":0,"page":1}
                -> Active/Inactive view switch. Re-run the RPC filtered to that status. limit/
                   offset/page are ALWAYS page 1 here (same shape as "page" above) — the mode
                   switch always resets to the first page client-side, and rides along explicitly
                   so your workflow re-runs at offset 0 instead of whatever page/offset custom
                   state it separately kept from the last "page" event.

  The bulk bar's own action buttons differ by that same status. Active view: Topics + Set
  Inactive. Inactive view: Set Active + Delete instead — Topics management doesn't exist there at
  all (inactive prompts aren't tagged), Delete takes its place. Delete is the one bulk action
  that isn't trivially reversible, so it needs two clicks: the first arms the button (turns red,
  label becomes "Confirm delete?") without firing anything; the second, on the now-armed button,
  fires bulkdelete below and clears the selection. Any selection change while armed (ticking a
  different row, Select all N, Undo) disarms it silently — an armed confirm never survives onto a
  different set of rows than the one it was armed for.

  ── Bulk actions (the floating bar, shown while rows are selected) ────────────
  Both carry the SELECTION in one of two shapes. Branch your workflow on "mode":

    mode:"ids"     {"mode":"ids","count":12,"ids":"id1,id2,…"}
    mode:"filter"  {"mode":"filter","count":1240,"query":"…","brand_mentioned":"yes",
                    "status":"active","order":"visibility_desc"}

  "filter" appears only after the user takes the "Select all N prompts" link. That link is
  offered ONLY once the header checkbox has selected the whole visible page AND more pages exist
  — after a single manual tick, "select all 94" would be a non-sequitur. It deliberately sends
  the PREDICATE rather than 1240 ids: the ids would blow up the payload and go stale against rows
  that changed since. Resolve it server-side with the SAME where-clause your render RPC uses —
  the field names here are chosen to match it. If they ever drift apart, the table and the bulk
  action will silently disagree about which rows they mean.

    applybulktopics  -> fires ONCE, from the topic editor's Apply button — never per click.
                   Clicking a topic chip only stages/unstages it locally; nothing reaches Bubble
                   until Apply. ADDS every tag in tag_ids to every prompt the selection resolves to
                   (never "replace the tags with this" — topics the user didn't touch stay
                   untouched). tag_ids is capped at 5 client-side (the per-prompt topic limit) —
                   your RPC still has final say for rows that were already close to that limit.
                   Every field that can appear, spelled out in full — no other field is ever
                   present beyond these:

                   mode:"ids" (an explicit row-by-row selection):
                     {"mode":"ids","count":3,"ids":"id1,id2,id3","prompt_ids":"id1,id2,id3",
                      "tag_ids":"t1,t2"}
                     ids and prompt_ids are always identical (same comma-joined id list, sent
                     under both keys — "ids" is the general selection-payload field every bulk
                     action carries, "prompt_ids" is the older name this specific event has always
                     used; both stay for back-compat, pick whichever your workflow already reads).

                   mode:"filter" (the "Select all N matching" case):
                     {"mode":"filter","count":1240,"query":"nike","brand_mentioned":"yes",
                      "status":"active","order":"visibility_desc","tag_ids":"t1,t2"}
                     No ids/prompt_ids field at all in this shape (there IS no fixed id list — that
                     is the whole point of "filter" mode). count is the exact total, not an
                     estimate. Resolve the actual target prompts server-side from
                     query/brand_mentioned/status/order using the SAME where-clause your render RPC
                     already applies for those fields, then apply tag_ids to every prompt that
                     resolves to.

                   Field-by-field meanings (present in one or both shapes above):
                     mode             "ids" | "filter" — which shape this payload is
                     count            exact number of prompts targeted, either way
                     ids              (mode:"ids" only) comma-joined prompt ids ticked by hand
                     prompt_ids       (mode:"ids" only) identical value to ids, see above
                     query            (mode:"filter" only) the active search text at apply time
                     brand_mentioned  (mode:"filter" only) "yes" | "no" | "" — the brand-mention
                                      toggle's state at apply time
                     status           (mode:"filter" only) "active" | "inactive" — which tab was
                                      open, so the filter matches the same rows the user was
                                      looking at
                     order            (mode:"filter" only) sort token, see the order-tokens list
                                      below — included so "select all" resolves the exact same
                                      ordering the visible table used, in case your RPC's default
                                      order differs
                     tag_ids          comma-joined topic ids staged in the panel — present in BOTH
                                      shapes, always at least one id (Apply is disabled at 0 staged)
    addtopics   <selection> + {"new_topic_name":"SUV","new_topic_emoji":"🚙",
                             "new_topic_hex_light":"#1860dc","new_topic_hex_dark":"#1860dc"}
                -> fires from TWO places, both producing this exact same shape (no need to branch
                   on Bubble's side): the "Add Topic" button at the foot of the bulk topic editor
                   (opens the SAME create modal topics-manager uses — UC.makeTopicModal, shared via
                   core.js — and fires this once the user saves it) and the inline "Create '…'" row
                   shown when a topic search has zero matches (name pre-filled from the search box).
                   Neither closes the topic editor or touches the staged selection — the selection
                   rides along purely so a freshly created topic can be applied to it straight away
                   if you want that; emoji is "" (empty string, not omitted) when none was picked.
                   Emoji via emoji-picker-element (a free self-contained CDN-loaded web component —
                   https://github.com/nolanlawson/emoji-picker-element — loaded lazily only once the
                   emoji trigger is clicked, no Bubble-side setup needed), color one of 30 preset
                   swatches, contrast-checked against both light and dark chip backgrounds since
                   only hex_light ever actually gets rendered — see topicListHtml()/doTopics().
                   hex_light and hex_dark are always sent as the SAME value: only one color is ever
                   picked.
    bulkstatus  <selection> + {"status":"inactive"}
                -> set every selected prompt to that status. Reversible, so no confirm dialog is
                   shown; surface an undo in your own toast instead.
    bulkdelete  <selection>, no extra fields
                -> Inactive view only (see above) — the bar's Delete button, armed by a first click.
                   Hard-delete every prompt in the selection; there is no separate "restore"
                   surface on this component's side, so treat this as destructive on your end too.
                   Same two shapes as every other bulk action: {"mode":"ids","count":2,
                   "ids":"id1,id2"} or, after "Select all N", {"mode":"filter","count":140,
                   "query":"…","brand_mentioned":"yes","status":"inactive","order":"…"}.

  order tokens: name_asc/desc, visibility_asc/desc, rank_asc/desc, sentiment_asc/desc,
  created_at_asc/desc.   Default (and fallback) is visibility_desc — the table is never unsorted.

  ── Reading tag_ids / prompt_ids into two separate Bubble states ──────────────
  Both arrive as plain comma-joined text — same convention as "ids" above — specifically so no
  JSON parsing is needed on the Bubble side:
    1. Regex them out same as everything else:
         (?<="tag_ids":")[^"]*        (?<="prompt_ids":")[^"]*
    2. In the workflow step that reads the event payload, run each captured text through Bubble's
       own ":split by" operator with "," as the separator — that alone turns it into a proper
       Bubble list of texts.
    3. Store each list in its own custom state (e.g. State "Selected Tag IDs" = list of texts,
       State "Selected Prompt IDs" = list of texts). If your backend workflow expects numbers/IDs
       of a data type instead of raw text, chain ":converted to number" (or a "Search for Tags
       where unique id is this text" lookup) on top of the split list before saving it to state —
       the split step itself only ever produces texts.
    Net result: two independent states, each a real Bubble list, ready to feed a "Schedule API
    Workflow on a list" (tags) nested inside one (prompts), or however your bulk-tag backend
    action is shaped.

  Regex, as everywhere else:
    (?<="query":")[^"]*        (?<="query_folded":")[^"]*   (?<="query_de":")[^"]*
    (?<="requestId":")[^"]*    (?<="order":")[^"]*          (?<="sort_field":")[^"]*
    (?<="sort_dir":")[^"]*     (?<="prompt_id":")[^"]*      (?<="selected":")[^"]*
    (?<="prompt_text":")[^"]*
    (?<="brand_mentioned":")[^"]*                           (?<="status":")[^"]*
    (?<="mode":")[^"]*         (?<="ids":")[^"]*            (?<="tag_ids":")[^"]*
    (?<="prompt_ids":")[^"]*   (?<="new_topic_name":")[^"]*
    (?<="new_topic_emoji":")[^"]*     (?<="new_topic_hex_light":")[^"]*  (?<="new_topic_hex_dark":")[^"]*
    (?<="brands":")[^"]*
    (?<="limit":)[0-9]+        (?<="offset":)[0-9]+         (?<="page":)[0-9]+
    (?<="count":)[0-9]+

  ── Filling the table ────────────────────────────────────────────────────────
  window.renderPromptsTable({ instanceId: "...", rows: [...], totalCount: 94 });
  window.setPromptsTableLoading("INSTANCE_ID", "yes" | "no");
  window.resetPromptsTable("INSTANCE_ID");
  window.setPromptsTableTopics("INSTANCE_ID", [ {id,name,emoji,hex_light,hex_dark}, … ]);
  window.setPromptsTableBrands("INSTANCE_ID", RAW_STRING_OR_ARRAY);

  ── Leaving the page: cleanup ─────────────────────────────────────────────────
  The bulk bar and the "Add Topic" modal both mount to document.body (so they can escape any
  overflow:hidden ancestor), not inside this component's own root — so if the user navigates to a
  different page/reusable while either is open, they're left floating over whatever Bubble shows
  next. Two layers of defense:
    1. Automatic: if this component's root element is ever actually removed from the DOM (a
       repeating structure re-rendering, a conditional "only when" going false), it's detected and
       cleaned up on its own — no action needed on your side.
    2. Bubble reusable elements are more often just hidden (display:none) than removed outright,
       which layer 1 can't see. For that case, call window.resetPromptsTable("INSTANCE_ID") from a
       "user leaves this page" workflow event — it closes the Add Topic modal if open, closes the
       bulk topic panel, and clears the selection (which hides the bulk bar). Checks first: if
       nothing is selected and neither the topic panel nor the Add Topic modal is open, it's a true
       no-op (no persist, no re-render) — cheap and safe to call unconditionally, e.g. on every
       search/filter change, not just on page-leave.

       NOTE: this deliberately does NOT touch search/sort/paging/status/column widths — it only
       resets popover/selection state. If you also want the table itself back to its default view
       (Active tab, default sort, empty search) on page-leave, re-render it with fresh data instead
       of relying on resetPromptsTable for that.

  renderPromptsTable also accepts, both optional:
    totalCountInactive  -> puts a count on the Inactive tab. Until you send it the tab simply
                           renders without one, rather than claiming a number it doesn't have.
                           Comes from row 0's total_count_inactive, same idea as total_count —
                           see the Render step below, which reads both off row 0 for you.
    topics              -> same list as setPromptsTableTopics, if it's easier to send it here.

  Row fields (straight from your RPC, no renaming needed):
    prompt_id, prompt_text, market, tags [{id,name,emoji,hex_light,hex_dark}], visibility_pct,
    avg_rank, avg_sentiment_30d, top_mentions [{name,favicon,mention_count,mentioned_pct}],
    companies_preview_totalcount, created_at
  Not used by the table (kept in the row for later): source, is_active, runs_total,
  mentioned_runs, last_seen_run_at. is_active is worth calling out specifically: whatever popup you
  build off the rowclick event (prompt detail, actions) can branch its own layout on it directly —
  e.g. show a Topics action only when true, and Set Active/Delete instead when false — since the
  whole visible page is always ONE status at a time, sourced from your own "status" event already.

  Your RPC repeats TWO grand totals on every row, rather than separate scalar outputs — total_count
  (the count for whichever status you asked for) and total_count_inactive (the count for the OTHER
  status, so the tab you're not currently on can show a number too). The Render step below reads
  both off row 0, same idea as "Used" reading a per-row field elsewhere in this app.

  ── Run-JS "Render" step (paste as-is, swap the bracketed dynamic values) ────
  The raw RPC text is NOT parsed here: the step waits until the component is on the page and then
  uses UpstreemCore.parseBubbleJson, the one shared implementation of Bubble's quirks (unquoted
  emoji, bare yes/no, trailing commas, double-encoded strings).

  (function () {
    var RAW = `[PROMPTS_RPC_RESPONSE]`;

    var t = 0;
    (function go () {
      var w  = window,
          fn = w.renderPromptsTable
            || (w.parent && w.parent.renderPromptsTable)
            || (w.top && w.top.renderPromptsTable);
      var UC = w.UpstreemCore
            || (w.parent && w.parent.UpstreemCore)
            || (w.top && w.top.UpstreemCore);

      if (typeof fn === "function" && UC && UC.parseBubbleJson) {
        var rows = UC.parseBubbleJson(RAW);
        var total = rows.length ? Number(rows[0].total_count) : null;
        var totalInactive = rows.length ? Number(rows[0].total_count_inactive) : null;
        var payload = {
          instanceId: `INSTANCE_ID`,
          isDark: `ISDARK`,
          rows: rows,
          totalCount: isFinite(total) ? total : null,
          totalCountInactive: isFinite(totalInactive) ? totalInactive : null
        };
        console.log("[prompts-table] sending", rows.length, "rows, total", payload.totalCount,
          "total inactive", payload.totalCountInactive);
        fn(payload);
        return;
      }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[prompts-table] renderPromptsTable / UpstreemCore never appeared after 6s — " +
        "check data-cdn-pin and that the component is actually on this page.");
    })();
  })();

  ── Topics for the bulk editor — own Run-JS step, run ONCE on page load ──────
  Same pattern as the brand lists in urls-table/domains-table: the full topic list is static for
  the session, so it's loaded once rather than riding along with every page of rows.

  Note there is no parsing here — the raw RPC text is handed over as-is and the component runs it
  through UpstreemCore.parseBubbleJson. That parser handles Bubble's unquoted emoji and bare
  yes/no. Keeping a second copy of it in this step is exactly how the emoji bug survived a round
  of fixes once already: only one of the two copies got repaired.

  (function () {
    var INSTANCE_ID = `INSTANCE_ID`;
    var RAW = `[TOPICS_RPC_RESPONSE]`;      // [{id,name,emoji,hex_light,hex_dark}, …]

    var t = 0;
    (function go () {
      var fn = window.setPromptsTableTopics
            || (window.parent && window.parent.setPromptsTableTopics)
            || (window.top && window.top.setPromptsTableTopics);
      if (typeof fn === "function") { fn(INSTANCE_ID, RAW); return; }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[prompts-table] setPromptsTableTopics never appeared — is the component on this page?");
    })();
  })();

  ── Brands for the mentioned-brands filter — own Run-JS step, run ONCE on page load ─────
  Same "fed in once at page load, full unfiltered list" contract as urls-table/responses-table's
  brands dropdown. An empty list is ignored (keeps whatever was already loaded).

  (function () {
    var INSTANCE_ID = `INSTANCE_ID`;
    var RAW = `[BRANDS_RPC_RESPONSE]`;   // [{company_id,name,logo_url}, …]
    var t = 0;
    (function go () {
      var fn = window.setPromptsTableBrands
            || (window.parent && window.parent.setPromptsTableBrands)
            || (window.top && window.top.setPromptsTableBrands);
      if (typeof fn === "function") { fn(INSTANCE_ID, RAW); return; }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[prompts-table] setPromptsTableBrands never appeared.");
    })();
  })();

  ── Loading state — own Run-JS step, same reasoning as the other tables ──────
  Driven via Run-JS (not a dynamic attribute) so a Reusable placed more than once on a page
  doesn't force a full re-render on every processing-flag change.

  (function () {
    const INSTANCE_ID = `INSTANCE_ID`;
    const LOADING = `IS_LOADING`;          // "yes" / "no"
    let t = 0;
    (function go(){
      const fn = window.setPromptsTableLoading
        || (window.parent && window.parent.setPromptsTableLoading)
        || (window.top && window.top.setPromptsTableLoading);
      if (typeof fn === "function") { fn(INSTANCE_ID, LOADING); return; }
      if (t++ < 60) setTimeout(go, 100);
    })();
  })();

  GRUPPIERTE TOPIC-ANSICHT (optional)
  ══════════════════════════════════════════════════════════════════════════════
  Ein Layer ÜBER der flachen Tabelle, kein Ersatz: Suche, Sortierung, Brand-Toggle,
  Mentioned-Filter und Table Settings bleiben unverändert und bestimmen nur, woraus die Gruppen
  berechnet werden. Der Toggle sitzt im neuen Icon-Button "Grouping" rechts in der Topbar.

  NUR IN DER ACTIVE-ANSICHT. Inaktive Prompts bleiben die flache Tabelle, die sie immer waren --

  ── Drei neue Attribute am Root (MÜSSEN ergänzt werden) ──────────────────────
  data-groups-fn        = "bubble_fn_uptGroups_[dynamic id]"
  data-groupopen-fn     = "bubble_fn_uptGroupOpen_[dynamic id]"
  data-generatemore-fn  = "bubble_fn_uptGenerateMore_[dynamic id]"

  ── Was wann feuert ──────────────────────────────────────────────────────────
  uptGroups         beim Einschalten der Ansicht und nach jeder Filteränderung.
                    {"grouped":"yes"}                       -- keine eigenen Gruppen
                    {"grouped":"yes","groups":"[{\"key\":\"SUV & Hybrid\",\"tag_ids\":[...]}]"}
                    -> RPC cached_prompt_topics_grouped_v1 mit DENSELBEN Filtern wie die flache
                       Tabelle (p_team, p_search, p_tag_ids, p_only_active, p_models, p_markets,
                       p_date_from, p_date_to, p_tagmode, p_mentioned, p_company_ids). `groups`
                       nur dann als p_groups mitsenden, wenn der Key im Payload überhaupt da ist
                       -- fehlt er, liefert der RPC seinen Default: eine Gruppe pro Topic +
                       untagged.
                    Antwort zurück per window.setPromptsTableGroups("INSTANCE_ID", RAW).

  uptGroupOpen      beim Aufklappen einer Gruppe und bei jedem Seitenwechsel darin.
                    {"group_key":"TagA","tag_ids":"a1,b2","untagged":"no","is_custom":"no",
                     "tagmode":"and","limit":25,"offset":0,"page":1,
                     "order":"visibility_desc","request_id":3}
                    -> RPC cached_prompt_insights_alltime_v18, unverändert wie in der flachen
                       Tabelle, nur zusätzlich:
                         normale Topic-Gruppe  p_tag_ids = [tag_ids]
                         Custom Group          p_tag_ids = tag_ids der Gruppe, p_tagmode = 'and'
                                               (der Modus steht auch als `tagmode` im Event)
                         untagged = "yes"      p_untagged = true
                    Antwort per window.setPromptsTableGroupPrompts("INSTANCE_ID", RAW, REQUEST_ID).
                    REQUEST_ID unbedingt durchreichen: eine langsame Antwort auf eine ältere
                    Anfrage überschreibt sonst eine neuere.

  uptGenerateMore   Klick auf "Generate More" im Gruppen-Header.
                    {"group_key":"TagA","tag_ids":"a1,b2"}
                    Feuert NUR dieses Event -- kein Refetch, kein Zustandswechsel.


  ── Run-JS "Groups" Step (der Step, den uptGroups ausloest) ──────────────────
  KEIN toArr hier. Der Setter nimmt den ROHEN String und schickt ihn selbst durch
  UC.parseBubbleJson -- denselben Parser, den jede andere Komponente benutzt, inklusive der
  Reparatur von Bubbles `"avg_rank":,`-Loechern. toArr davorzuschalten kann nur schaden: es
  verschluckt jeden eval-Fehler zu einem leeren Array, und dann sieht "der Slot war leer" genauso
  aus wie "der Text liess sich nicht lesen".

  (function () {
    var INSTANCE_ID = `INSTANCE_ID`;
    var RAW = `[GROUPS_RPC_RESULT]`;          // roh reingeben, nicht vorverarbeiten

    var t = 0;
    (function go () {
      var fn = window.setPromptsTableGroups
            || (window.parent && window.parent.setPromptsTableGroups)
            || (window.top && window.top.setPromptsTableGroups);
      if (typeof fn === "function") { fn(INSTANCE_ID, RAW); return; }
      if (t++ < 60) setTimeout(go, 100);
    })();
  })();

  Wenn danach etwas fehlt, sagt die Konsole welcher Fall vorliegt:
    "Second argument was: String(0 chars)"   -> der Slot war zur Laufzeit leer
    "Second argument was: String(863 chars) — value: …"  -> Text da, aber nicht als Array lesbar
    gar keine Meldung                        -> die Gruppen sind angekommen


  ── Regex zum Extrahieren (Bubble: "extract with Regex") ─────────────────────
  So sehen die Strings wirklich aus, live abgegriffen:

    uptGroupOpen
    {"group_key":"Solar","tag_ids":"a1-uuid","untagged":"no","is_custom":"no",
     "tagmode":"and","limit":15,"offset":0,"page":1,"order":"visibility_desc","request_id":1}

    uptGenerateMore
    {"group_key":"SUV & Hybrid","tag_ids":"t1,t3"}

    uptGroups  (ohne eigene Gruppierungen)
    {"grouped":"yes"}

    uptGroups  (mit eigenen Gruppierungen — `groups` ist ein JSON-String IM JSON,
                seine Anfuehrungszeichen sind deshalb mit \ maskiert)
    {"grouped":"yes","groups":"[{\"key\":\"SUV & Hybrid\",\"tag_ids\":[\"t1\",\"t3\"],\"color\":\"#b47476\"}]"}

  Feld            Regex                              Ergebnis (Beispiel)
  ─────────────── ────────────────────────────────── ──────────────────────────
  group_key       (?<="group_key":")[^"]*            SUV & Hybrid
  tag_ids         (?<="tag_ids":")[^"]*              t1,t3      -> :split by ","
  untagged        (?<="untagged":")[^"]*             no
  is_custom       (?<="is_custom":")[^"]*            no
  tagmode         (?<="tagmode":")[^"]*              and
  order           (?<="order":")[^"]*                visibility_desc
  limit           (?<="limit":)[0-9]+                15
  offset          (?<="offset":)[0-9]+               0
  page            (?<="page":)[0-9]+                 1
  request_id      (?<="request_id":)[0-9]+           1
  grouped         (?<="grouped":")[^"]*              yes
  groups          (?<="groups":").*(?="\}$)          siehe unten

  `groups` braucht einen zweiten Schritt: das Extrahierte ist noch maskiert
  ([{\"key\":\"SUV & Hybrid\",...). Danach :find & replace  \"  ->  "  , dann ist es
  gueltiges JSON und kann direkt als p_groups gehen.

  Zwei Fallstricke:
  · tag_ids ist eine KOMMAGETRENNTE Textliste, kein JSON-Array. In Bubble
    :split by "," verwenden -- das Feld muss "text" sein, nicht "list of texts".
  · [^"]* bricht ab, wenn ein Gruppenname selbst ein Anfuehrungszeichen enthaelt
    (es steht dann als \" im String). Betrifft nur selbst vergebene Gruppennamen.

  ── Eigene Gruppierungen ─────────────────────────────────────────────────────
  Liegen AUSSCHLIESSLICH im localStorage des Browsers, unter genau diesem Key und Format:
      promptGroups = [{ "key": "SUV & Hybrid", "tag_ids": ["uuid1","uuid2"] }]
  Kein DB-Schreiben, kein Backend-Call beim Erstellen. Die Topic-Liste im Erstellen-Popup ist die
  aus window.setPromptsTableTopics(...) -- ohne die bleibt das Popup leer.

  Ein Prompt mit mehreren Topics erscheint in mehreren Gruppen. Das ist so gewollt; es wird über
  Gruppengrenzen hinweg NICHT dedupliziert.

-->

<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). The pin is found by looking the root element up BY CLASS — deliberately
   NOT via document.currentScript, because Bubble injects an HTML element's inline scripts in a way
   that leaves document.currentScript null/misattached. Each asset url is fetched and evaluated at most
   ONCE per page — see the dedupe guard below for why that matters. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("upt-root") + "/";
  /* Bubble re-injects this whole block (this script tag included) every time the reusable this
     component sits in re-renders — i.e. on every drawer/view open. Without this guard each of
     those re-runs appended ANOTHER <link> + <script> for the SAME urls, forever: 4 more tags per
     render, never cleaned up (measured: 14 tags after one page build, 64 after ~25 navigations).
     Inserting a stylesheet <link> is render-blocking, so that landed right in the middle of the
     open animation — which is what made drawers/views "pop" in instead of animating.
     The registry lives on window, not in this closure, because every component ships its own copy
     of this loader. Skipping the re-run is safe: a re-rendered root is picked up and initialised
     by core.js's own root observer + 1.5s heartbeat, it does not need the scripts evaluated
     again (verified against a root injected with the scripts deliberately run only once). */
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("prompts-table.css");
  js("core.js"); js("prompts-table.js");
})();
</script>
