<!--
  UPSTREEM — PROMPTS TABLE

  Classic table listing the team's tracked prompts: search, sortable columns, per-row selection,
  and a Table Settings menu with column visibility PLUS a 3-way row height (Default / Compact /
  Dynamic — the first two are the familiar 72px/55px, Dynamic grows the row to fit the full
  prompt text instead of clamping it).

  Column order: Prompt, Visibility, Rank, Sentiment, Brand Mentions, Topics, Market, Created.
  Visibility/Rank/Sentiment are all about the ONE tracked brand (data-brand-name) — its logo
  sits in the Visibility header instead of repeating it per row. Those three plus Brand Mentions
  and Market have a hover info icon (same "i" pattern as visibility-chart/urls-table).

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance   = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin    = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the literal
                    "CDN_PIN" placeholder) to load @main. Point this at a Bubble constant/Option
                    Set field you control so every placement can be repinned to a new commit in
                    one edit instead of hunting down every embed's URL by hand — @main itself lags
                    jsDelivr's cache, sometimes for hours, so a fresh fix may not actually be live
                    yet even right after it's pushed. The loader script at the bottom reads this
                    once and builds every asset URL from it.
  data-isdark     = "yes" / "no"
  data-brand-name = the brand's display name (for the "X mentioned" quick toggle) — leave the
                    literal "BRAND_NAME" placeholder to hide the toggle entirely
  data-brand-logo = the brand's logo url (optional)
  data-sticky-top = px offset from the top at which the sticky header pins
                    (= height of your page's topbar, e.g. "171"). Desktop only (>=1000px page
                    width). Set "no" on data-sticky to disable.

  ── Event names must be unique per placement ─────────────────────────────────
  data-search-fn    = "bubble_fn_uptSearch_[dynamic id]"
  data-sort-fn      = "bubble_fn_uptSort_[dynamic id]"
  data-brand-fn     = "bubble_fn_uptBrand_[dynamic id]"
  data-page-fn      = "bubble_fn_uptPage_[dynamic id]"
  data-rowclick-fn  = "bubble_fn_uptRowClick_[dynamic id]"
  data-select-fn    = "bubble_fn_uptSelect_[dynamic id]"
  data-topics-fn    = "bubble_fn_uptTopicsClick_[dynamic id]"
  data-status-fn      = "bubble_fn_uptStatus_[dynamic id]"        view switch Active/Inactive
  data-bulktopics-fn  = "bubble_fn_uptBulkTopics_[dynamic id]"    unused — kept for back-compat, see below
  data-applybulktopics-fn = "bubble_fn_uptApplyBulkTopics_[dynamic id]"  the topic editor's Apply button
  data-bulkstatus-fn  = "bubble_fn_uptBulkStatus_[dynamic id]"    bulk set active/inactive
  data-addtopics-fn   = "bubble_fn_uptAddTopics_[dynamic id]"      "Add Topic" in the bulk editor

  data-export-instance = the instanceId of the EXPORT POPUP component you place on the same
                         page. The Export button calls window.upstreemExportOpen(thatId), exactly
                         as in urls-table/domains-table.

  Every one fires ONE JSON string, values pulled out on the Bubble side by regex — same
  convention as the other tables. All of these except rowclick/select are SERVER-side: they tell
  Bubble to re-run the RPC, this component never filters/sorts/paginates locally.

    search   {"query":"nike","query_folded":"nike","query_de":"nike","requestId":"upt_…"}
    sort     {"order":"visibility_desc","sort_field":"visibility","sort_dir":"desc"}
    brand    {"brand_mentioned":"yes"}          "yes" | "no" | ""  (empty = off)
    page     {"limit":25,"offset":50,"page":3}
    rowclick {"prompt_id":"614ebcc4-c784-440c-aff8-0394e59ae266"}
    select   {"selected":"id1,id2,id3","count":3}   -> fires on every checkbox change; carries the
                                                        WHOLE selection, which deliberately
                                                        survives paging and sorting
    topics   {"prompt_id":"614ebcc4-…"}             -> click on the Topics cell. Deliberately does
                                                        NOT also fire rowclick — open your topic
                                                        management for that prompt here.
    status   {"status":"inactive"}                  -> Active/Inactive view switch. Re-run the RPC
                                                        filtered to that status.

  ── Bulk actions (the floating bar, shown while rows are selected) ────────────
  Both carry the SELECTION in one of two shapes. Branch your workflow on "mode":

    mode:"ids"     {"mode":"ids","count":12,"ids":"id1,id2,…"}
    mode:"filter"  {"mode":"filter","count":1240,"query":"…","brand_mentioned":"yes",
                    "status":"active","order":"visibility_desc"}

  "filter" appears only after the user takes the "Select all N prompts" link. That link is
  offered ONLY once the header checkbox has selected the whole visible page AND more pages exist
  — after a single manual tick, "select all 94" would be a non-sequitur. It deliberately sends
  the PREDICATE rather than 1240 ids: the ids would blow up the payload and go stale against rows
  that changed since. Resolve it server-side with the SAME where-clause your render RPC uses —
  the field names here are chosen to match it. If they ever drift apart, the table and the bulk
  action will silently disagree about which rows they mean.

    applybulktopics  <selection> + {"tag_ids":"id1,id2,…","prompt_ids":"id1,id2,…"}
                -> fires ONCE, from the topic editor's Apply button — never per click. Clicking a
                   topic chip only stages/unstages it locally; nothing reaches Bubble until Apply.
                   ADDS every tag in tag_ids to every prompt in prompt_ids (never "replace the
                   tags with this" — topics the user didn't touch stay untouched). prompt_ids is
                   only present when mode:"ids" (an explicit selection); under mode:"filter" (the
                   "select all N matching" case) resolve the target prompts server-side from the
                   filter fields the same way the render RPC does, same as every other bulk action.
                   tag_ids is capped at 5 client-side (the per-prompt topic limit) — your RPC still
                   has final say for rows that were already close to that limit.
    addtopics   <selection> + optionally {"new_topic_name":"SUV","new_topic_emoji":"🚙",
                             "new_topic_hex_light":"#1860dc","new_topic_hex_dark":"#1860dc"}
                -> the "Add Topic" button at the foot of the bulk topic editor. Open your own
                   topic-creation UI; the selection rides along so a freshly created topic can be
                   applied straight away. Does NOT close the topic editor or touch the staged
                   selection. All four new_topic_* fields are only present when this came from the
                   inline "Create '…'" row shown when a topic search has zero matches — a first
                   pass at the fuller tag creator this table will eventually need, with a name
                   (pre-filled from the search box), an emoji (via emoji-picker-element, a free
                   self-contained CDN-loaded web component — https://github.com/nolanlawson/
                   emoji-picker-element — loaded lazily only once the emoji trigger is clicked, no
                   Bubble-side setup needed), and a color (one of 32 preset swatches, contrast-
                   checked against both light and dark chip backgrounds since only hex_light ever
                   actually gets rendered — see topicListHtml()/doTopics()). hex_light and hex_dark
                   are always sent as the SAME value: this creator only ever picks one color.
    bulkstatus  <selection> + {"status":"inactive"}
                -> set every selected prompt to that status. Reversible, so no confirm dialog is
                   shown; surface an undo in your own toast instead.

  order tokens: name_asc/desc, visibility_asc/desc, rank_asc/desc, sentiment_asc/desc,
  created_at_asc/desc.   Default (and fallback) is visibility_desc — the table is never unsorted.

  ── Reading tag_ids / prompt_ids into two separate Bubble states ──────────────
  Both arrive as plain comma-joined text — same convention as "ids" above — specifically so no
  JSON parsing is needed on the Bubble side:
    1. Regex them out same as everything else:
         (?<="tag_ids":")[^"]*        (?<="prompt_ids":")[^"]*
    2. In the workflow step that reads the event payload, run each captured text through Bubble's
       own ":split by" operator with "," as the separator — that alone turns it into a proper
       Bubble list of texts.
    3. Store each list in its own custom state (e.g. State "Selected Tag IDs" = list of texts,
       State "Selected Prompt IDs" = list of texts). If your backend workflow expects numbers/IDs
       of a data type instead of raw text, chain ":converted to number" (or a "Search for Tags
       where unique id is this text" lookup) on top of the split list before saving it to state —
       the split step itself only ever produces texts.
    Net result: two independent states, each a real Bubble list, ready to feed a "Schedule API
    Workflow on a list" (tags) nested inside one (prompts), or however your bulk-tag backend
    action is shaped.

  Regex, as everywhere else:
    (?<="query":")[^"]*        (?<="query_folded":")[^"]*   (?<="query_de":")[^"]*
    (?<="requestId":")[^"]*    (?<="order":")[^"]*          (?<="sort_field":")[^"]*
    (?<="sort_dir":")[^"]*     (?<="prompt_id":")[^"]*      (?<="selected":")[^"]*
    (?<="brand_mentioned":")[^"]*                           (?<="status":")[^"]*
    (?<="mode":")[^"]*         (?<="ids":")[^"]*            (?<="tag_ids":")[^"]*
    (?<="prompt_ids":")[^"]*   (?<="new_topic_name":")[^"]*
    (?<="new_topic_emoji":")[^"]*     (?<="new_topic_hex_light":")[^"]*  (?<="new_topic_hex_dark":")[^"]*
    (?<="limit":)[0-9]+        (?<="offset":)[0-9]+         (?<="page":)[0-9]+
    (?<="count":)[0-9]+

  ── Filling the table ────────────────────────────────────────────────────────
  window.renderPromptsTable({ instanceId: "...", rows: [...], totalCount: 94 });
  window.setPromptsTableLoading("INSTANCE_ID", "yes" | "no");
  window.resetPromptsTable("INSTANCE_ID");
  window.setPromptsTableTopics("INSTANCE_ID", [ {id,name,emoji,hex_light,hex_dark}, … ]);

  renderPromptsTable also accepts, both optional:
    totalCountInactive  -> puts a count on the Inactive tab. Until you send it the tab simply
                           renders without one, rather than claiming a number it doesn't have.
    topics              -> same list as setPromptsTableTopics, if it's easier to send it here.

  Row fields (straight from your RPC, no renaming needed):
    prompt_id, prompt_text, market, tags [{id,name,emoji,hex_light,hex_dark}], visibility_pct,
    avg_rank, avg_sentiment_30d, top_mentions [{name,favicon,mention_count,mentioned_pct}],
    companies_preview_totalcount, created_at
  Not used by the table (kept in the row for later): source, is_active, runs_total,
  mentioned_runs, last_seen_run_at.

  Your RPC returns one flat array with the grand total repeated on every row (total_count) rather
  than a separate scalar output — the sanitizer below reads it off row 0, same idea as "Used"
  reading a per-row field elsewhere in this app.

  ── Run-JS "Render" step (paste as-is, swap the bracketed dynamic values) ────
  The raw RPC text is NOT parsed here: the step waits until the component is on the page and then
  uses UpstreemCore.parseBubbleJson, the one shared implementation of Bubble's quirks (unquoted
  emoji, bare yes/no, trailing commas, double-encoded strings).

  (function () {
    var RAW = `[PROMPTS_RPC_RESPONSE]`;

    var t = 0;
    (function go () {
      var w  = window,
          fn = w.renderPromptsTable
            || (w.parent && w.parent.renderPromptsTable)
            || (w.top && w.top.renderPromptsTable);
      var UC = w.UpstreemCore
            || (w.parent && w.parent.UpstreemCore)
            || (w.top && w.top.UpstreemCore);

      if (typeof fn === "function" && UC && UC.parseBubbleJson) {
        var rows = UC.parseBubbleJson(RAW);
        var total = rows.length ? Number(rows[0].total_count) : null;
        var payload = {
          instanceId: `INSTANCE_ID`,
          isDark: `ISDARK`,
          rows: rows,
          totalCount: isFinite(total) ? total : null
        };
        console.log("[prompts-table] sending", rows.length, "rows, total", payload.totalCount);
        fn(payload);
        return;
      }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[prompts-table] renderPromptsTable / UpstreemCore never appeared after 6s — " +
        "check data-cdn-pin and that the component is actually on this page.");
    })();
  })();

  ── Topics for the bulk editor — own Run-JS step, run ONCE on page load ──────
  Same pattern as the brand lists in urls-table/domains-table: the full topic list is static for
  the session, so it's loaded once rather than riding along with every page of rows.

  Note there is no parsing here — the raw RPC text is handed over as-is and the component runs it
  through UpstreemCore.parseBubbleJson. That parser handles Bubble's unquoted emoji and bare
  yes/no. Keeping a second copy of it in this step is exactly how the emoji bug survived a round
  of fixes once already: only one of the two copies got repaired.

  (function () {
    var INSTANCE_ID = `INSTANCE_ID`;
    var RAW = `[TOPICS_RPC_RESPONSE]`;      // [{id,name,emoji,hex_light,hex_dark}, …]

    var t = 0;
    (function go () {
      var fn = window.setPromptsTableTopics
            || (window.parent && window.parent.setPromptsTableTopics)
            || (window.top && window.top.setPromptsTableTopics);
      if (typeof fn === "function") { fn(INSTANCE_ID, RAW); return; }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[prompts-table] setPromptsTableTopics never appeared — is the component on this page?");
    })();
  })();

  ── Loading state — own Run-JS step, same reasoning as the other tables ──────
  Driven via Run-JS (not a dynamic attribute) so a Reusable placed more than once on a page
  doesn't force a full re-render on every processing-flag change.

  (function () {
    const INSTANCE_ID = `INSTANCE_ID`;
    const LOADING = `IS_LOADING`;          // "yes" / "no"
    let t = 0;
    (function go(){
      const fn = window.setPromptsTableLoading
        || (window.parent && window.parent.setPromptsTableLoading)
        || (window.top && window.top.setPromptsTableLoading);
      if (typeof fn === "function") { fn(INSTANCE_ID, LOADING); return; }
      if (t++ < 60) setTimeout(go, 100);
    })();
  })();
-->

     data-sticky-top="171"
     data-search-fn="bubble_fn_uptSearch"
     data-sort-fn="bubble_fn_uptSort"
     data-brand-fn="bubble_fn_uptBrand"
     data-page-fn="bubble_fn_uptPage"
     data-rowclick-fn="bubble_fn_uptRowClick"
     data-select-fn="bubble_fn_uptSelect"
     data-topics-fn="bubble_fn_uptTopicsClick"

<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). The pin is found by looking the root element up BY CLASS — deliberately
   NOT via document.currentScript, because Bubble injects an HTML element's inline scripts in a way
   that leaves document.currentScript null/misattached. Loading core.js once per component is fine:
   the browser caches the (immutable, commit-pinned) URL, and the component's own init is idempotent. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("upt-root") + "/";
  function css(f){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = base + f; document.head.appendChild(l); }
  function js(f){ var s = document.createElement("script"); s.src = base + f; s.async = false; document.head.appendChild(s); }
  css("core.css"); css("prompts-table.css");
  js("core.js"); js("prompts-table.js");
})();
</script>
