<!--
  ============================================================================================
  ACCESS GATE -- Bubble-Vorlage (die Sperre der App ohne laufendes Abo)
  ============================================================================================
  Ein Fenster ueber der ganzen App, das nicht zugeht. Es erscheint, sobald die Quota-RPC
  (get_team_plan_quota, laeuft ohnehin beim Seitenaufbau) sagt, dass das Team keinen Zugang hat:
  has_access false. Es bietet an, was den Zugang zurueckbringt -- den alten Tarif wieder buchen,
  einen anderen waehlen, die Zahlungsmethode richten -- und die Wege hinaus: anderes Team, neues
  Team, abmelden. Hat das Team Zugang, zeigt das Element NICHTS.

  DAS IST DAS SCHILD, NICHT DAS SCHLOSS. Wer die Entwicklerwerkzeuge oeffnet, nimmt das Fenster
  weg. Die Daten muss die Datenbank verweigern: bubble/access_gate_setup.md -- dort steht auch,
  welche sieben Spalten die Quota-RPC dazubekommt. Ohne sie tut dieses Element nichts.

  EINSETZEN
  1. HTML-Element in DENSELBEN Reusable wie die Seitenleiste (sidebar_bubble.html) -- er steht auf
     jeder Seite der App, und genau dort gehoert die Sperre hin. NICHT auf Anmeldung, Onboarding
     und Einladung: dort gibt es noch kein Team, das gesperrt sein koennte.
     Das Element zeigt nichts und ist 0x0 wie die Seitenleiste; das Fenster haengt am body. Es muss
     trotzdem auf SICHTBAR stehen, und die JavaScript-to-Bubble-Elemente daneben ebenso -- ein
     unsichtbares veroeffentlicht seine bubble_fn_* nicht, und jeder Knopf im Fenster saesse dann
     auf "could not be ... Please reload the page".
  2. INSTANCE_ID durch eine FESTE Kennung ersetzen (z. B. "access_gate"). Kein dynamischer
     Ausdruck -- siehe bubble/STATISCHES_MARKUP_PFLICHT.md.
  3. CDN_PIN durch den Commit-Hash ersetzen, denselben wie an allen anderen Elementen der Seite
     und im Kopf-Snippet.
  4. data-isdark bleibt "no". Das Thema kommt ueber window.setUpstreemTheme(); das Fenster folgt
     von selbst.
  5. data-team auf die Id des AKTUELLEN Teams (Current User's Team's unique id). Wechselt sie ohne
     Neuladen, faellt die Sperre des alten Teams sofort weg.
  6. Die drei Ereignisse der Seitenleiste NICHT neu bauen: data-team-fn, data-newteam-fn und
     data-logout-fn bekommen DIESELBEN Namen wie an der Seitenleiste. Die Werte haben dieselbe
     Form, die Workflows gibt es schon. Neu sind nur drei: select-plan, plans, manage.
  7. Das Kopf-Snippet (bubble/page_header_preload_ohne_kommentare.html) laedt das Gate gleich nach
     der Seitenleiste -- das Snippet mit dem neuen Pin einsetzen.
  8. Das Logo oben links nimmt das Gate von der Seitenleiste im selben Reusable
     (data-upstreem-logo / data-upstreem-logo-dark) -- dafuer ist NICHTS zu tun. Ein eigenes nur,
     wenn es ein anderes sein soll: data-logo und data-logo-dark am Element (dieselben Namen wie
     auf der Anmeldeseite). Ohne jedes Bild steht der Schriftzug "upstreem" als Text da.

  DATEN HINEIN (Run-javascript-Schritte, unten dynamisch und statisch)
     setAccessGate(TEXT)        die Zeile der Quota-RPC, unveraendert -- im Seiten-Workflow des
                                Reusables, direkt hinter dem Aufruf von get_team_plan_quota, den es
                                beim Seitenaufbau schon gibt. KEIN zusaetzlicher RPC-Aufruf.
     setAccessGatePlans(TEXT)   alle Tarife -- im Workflow von uagPlans, hinter der Tarif-RPC
                                (derselben wie im Billing-Reiter)
     resetAccessGate()          Fenster weg, Vorrat geleert -- nur fuer einen Teamwechsel OHNE
                                Neuladen; mit Neuladen braucht es ihn nicht
  Die Teams fuer "Switch team" kommen NICHT von hier: die liest das Gate aus der Seitenleiste
  (setSidebarTeams), die sie auf jeder Seite ohnehin bekommt.

  WANN DAS FENSTER KOMMT -- entschieden von der Datenbank (team_access), gelesen aus der
  Quota-Zeile:
     has_access true, oder die Spalte fehlt   KEIN Fenster (auch bei einem Loeschdatum in der
                                              Zukunft: bis dahin hat das Team Zugang)
     has_access false, und dann nach access_state:
       deleted       "This team has been deleted" -- Knopf "Create a new team". KEIN
                     "Reactivate": ein geloeschtes Team wieder zu buchen hiesse, fuer etwas zu
                     zahlen, das es nicht mehr gibt
       past_due      "The last payment didn't go through" -- Knopf "Update payment method" (Portal)
       trial_ended   "Your free trial has ended" -- "Continue with <Tarif>" und "See all plans"
       no_plan       "This team doesn't have a plan yet" -- "See all plans"
       ended (und jeder unbekannte Wert)
                     "Your subscription has ended" -- "Reactivate <Tarif>" und "See all plans"
     can_manage_billing false   dieselbe Lage, aber OHNE Kauf-Knoepfe -- statt dessen "Ask a team
                                owner to ..."; Stripe wuerde diesem Nutzer die Kasse verweigern
     "Reactivate"/"Continue with" gibt es nur mit plan_id UND billing_interval -- ohne Takt waere
     es eine Kasse zu einem geratenen Preis; dann steht "See all plans" allein da.
     Unter jeder Lage: "Manage Billing" (nur ended/trial_ended, fuer Rechnungen), "Switch team"
     (nur mit einem anderen Team), "Log out" (immer).
     Leer ("[]"), unlesbar, ok:false oder Schritt kommt nie: KEIN Fenster -- ein Fehler in der
     Anlieferung sperrt keinen zahlenden Kunden aus. Die Konsole sagt es ("[access-gate] ...").
  Datum im Satz: access_ended_at, nur wenn es schon war.

  "SEE ALL PLANS" ist KEIN eigenes Fenster: es ist das Tarif-Fenster des Billing-Reiters
  (UC.makePlanDialog aus core), das ueber dem Gate aufgeht. X, Escape oder ein Klick daneben
  schliessen es, darunter steht wieder das Gate.

  EREIGNISSE HERAUS (jedes mit einem JSON-Text als einzigem Parameter)

  data-select-plan-fn  = "bubble_fn_uagSelectPlan"
      {"team_id":"…","plan_id":"a980c741-…","plan_name":"Enterprise","billing_interval":"yearly",
       "price_eur":4380,"monthly_price_eur":429,"yearly_price_eur":4380,"trial_days":null,
       "current_plan_id":""}
      DIESELBEN Schluessel in derselben Reihenfolge wie ublSelectPlan im Billing-Reiter: derselbe
      Kassen-Workflow kann beide bedienen. Aus "Reactivate <Tarif>" / "Continue with <Tarif>"
      (plan_id und billing_interval der Quota-Zeile; die Preise nur, wenn die Zeile
      monthly_price_eur / yearly_price_eur mitbringt, sonst null; trial_days null) oder aus "Get
      started" auf einer Karte im Tarif-Fenster (dort alles aus der Tarif-RPC). Ob ein
      zurueckkehrender Kunde noch einmal eine Testphase bekommt, entscheidet EUER Workflow.
      Danach stehen alle Knoepfe 4s still (gegen zwei Kassen durch einen Doppelklick). Die Kasse
      direkt oeffnen ("Open an external website", selber Tab) -- ein Bubble-Popup laege UNTER dem
      Fenster.

  data-plans-fn        = "bubble_fn_uagPlans"
      {"team_id":"…","current_plan_id":""}
      Das Tarif-Fenster ist aufgegangen. Der Workflow holt die Tarif-RPC und ruft Schritt 2. Bis
      die Antwort da ist, stehen die Tarife vom letzten Mal (oder drei Kartenhuellen); nach 8s
      ohne Antwort "Could not load the plans". Fehlt das Element, steht der Fehler sofort da.

  data-manage-fn       = "bubble_fn_uagManage"
      {"team_id":"…"}
      "Update payment method" bzw. "Manage Billing": Portal-Sitzung (Stripe billing_portal) und
      weiterleiten, im selben Tab -- derselbe Ablauf wie ublManage im Billing-Reiter.

  data-team-fn         = DERSELBE Name wie data-team-fn an der Seitenleiste
      {"team_id":"…"}   -- team_id ist das GEWAEHLTE Team, wie bei usnTeam
  data-newteam-fn      = DERSELBE Name wie data-newteam-fn an der Seitenleiste
      {"team_id":"…","action":"new_team"}    -- wie usnNewTeam
  data-logout-fn       = DERSELBE Name wie data-logout-fn an der Seitenleiste
      {"team_id":"…","action":"logout"}      -- wie usnLogout

  Fehlt ein Empfaenger, steht im Fenster, dass es gerade nicht ging ("... Please reload the
  page."), statt dass ein Knopf still nichts tut -- in einem Fenster, das man nicht schliessen
  kann, waere das eine Falle.

  DIE WERTE IN BUBBLE LESEN (extract with Regex auf den Wert des Ereignisses) -- wie im
  Billing-Reiter:
         (?<="team_id":")[^"]*
         (?<="plan_id":")[^"]*
         (?<="plan_name":")[^"]*
         (?<="billing_interval":")[^"]*
         (?<="price_eur":)[0-9.]+
         (?<="monthly_price_eur":)[0-9.]+
         (?<="yearly_price_eur":)[0-9.]+
         (?<="trial_days":)[0-9]+
     Steht dort null, findet der Regex nichts -- der Wert ist in Bubble leer.
  ============================================================================================
-->
<div class="up-root uag-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="no"
     data-team="TEAM_ID"
     data-select-plan-fn="bubble_fn_uagSelectPlan"
     data-plans-fn="bubble_fn_uagPlans"
     data-manage-fn="bubble_fn_uagManage"
     data-team-fn="bubble_fn_usnTeam"
     data-newteam-fn="bubble_fn_usnNewTeam"
     data-logout-fn="bubble_fn_usnLogout"></div>

<script>
(function(){
  /* ---- Boot-Stubs, VOR dem Nachladen ------------------------------------------------------
     Bubble ruft den Setter im Seiten-Workflow, regelmaessig BEVOR access-gate.js geladen ist.
     Ohne diesen Block liefe der Run-JS-Schritt in seinen typeof-Waechter und der Aufruf waere
     WEG -- die App stuende offen, ohne dass irgendwo ein Fehler steht. Nur Namen, die es noch
     nicht gibt: den Platzhalter des Kopf-Snippets holt access-gate.js selbst ab. */
  window.__uagBootQueue = window.__uagBootQueue || [];
  ["setAccessGate", "setAccessGatePlans", "resetAccessGate"].forEach(function(n){
    if (typeof window[n] === "function") return;
    window[n] = function(){ window.__uagBootQueue.push([n, [].slice.call(arguments)]); };
  });

  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       und jsDelivr antwortet mit 404. Gespaltener Platzhalter: wer "CDN_PIN" global im Element
       ersetzt, wuerde sonst auch diesen Waechter treffen. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* Rueckfall: ein Pin, der auf DIESER Seite schon gilt (team_orga_bubble.html, 31.08.) --
       Bubble fuehrt Scripts nicht in DOM-Reihenfolge aus, die eigene Wurzel steht dann evtl.
       noch nicht im Dokument. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("uag-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  css("core.css");   js("core.js");
  css("access-gate.css");  js("access-gate.js");
})();
</script>

  ============================================================================================
  RUN JAVASCRIPT -- ZWEI SCHRITTE, je einer hinter seiner RPC
  ============================================================================================
  Jeder Schritt ist REINES JavaScript fuer die Aktion "Run javascript" -- ohne <script>-Zeilen.
  Hausform (CLAUDE.md 2a, wie bubble/urls_table_bubble.html "DER RUN-JS-SCHRITT"): der ROHE Text
  der RPC in einen Backtick, beide Sanitizer-Zeilen dahinter, so in den Setter. KEIN JSON.parse,
  kein JSON-safe, kein handgebautes Objekt -- die Komponente liest selbst (UC.readBubble).
  window.<name> statt des nackten Namens: haengt das Element an einem aelteren Pin, ist der Name
  undefined statt eines ReferenceError, der den ganzen Schritt mitnimmt. Jeder Aufruf in seinem
  eigenen try. Laeuft hinter der Quota-RPC schon ein Schritt fuer eine andere Komponente, kommt
  dieser als EIGENER Block dazu (eigener Backtick, eigene Variable, eigenes try).

  ---- SCHRITT 1: DIE QUOTA-ZEILE (Reusable, "Page is loaded", hinter get_team_plan_quota) ----
(function () {
  var QUOTA = `RPC_QUOTA_JSON`
    .replace(/:\s*([,}\]])/g, ": null$1")
    .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
  try { if (window.setAccessGate) window.setAccessGate(QUOTA); } catch (e) {}
})();

  ---- SCHRITT 2: DIE TARIFE (im Workflow von bubble_fn_uagPlans, hinter der Tarif-RPC) ----
(function () {
  var TARIFE = `RPC_PLANS_JSON`

  try { if (window.setAccessGatePlans) window.setAccessGatePlans(TARIFE); } catch (e) {}
})();

  DIE WORKFLOWS (im Reusable der Seitenleiste)

  "Page is loaded":  der Aufruf von get_team_plan_quota, den es schon gibt -> Schritt 1. Kein
