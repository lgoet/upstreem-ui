<!-- ============================================================
     Upstreem — Add Prompts (modal)

     YOU PROBABLY DO NOT NEED THIS FILE. The prompts page header already loads add-prompts.js and
     add-prompts.css itself, because its Add button is what opens the dialog — putting the include
     anywhere else would mean a button that works only if you remembered to place a second element.

     Use this block only on a page that needs the dialog WITHOUT the prompts page header: a
     dashboard shortcut, a Quick Actions entry, an empty-state button somewhere else. Paste it into
     one HTML element, size it 0×0, put it anywhere. It renders nothing; the dialog builds itself
     into <body>. Loading it twice on one page is harmless — the loader deduplicates by URL.

     ── What opens it ───────────────────────────────────────────
     Nothing on this element. It is opened from JavaScript:

         openAddPrompts();                       // manual tab
         openAddPrompts({ tab: "csv" });         // start on the import tab
         openAddPrompts({ market: "de" });       // preselect the batch market

     The Add button in the prompts page header already calls this by itself — no workflow needed
     any more. If add-prompts.js is NOT loaded on a page, that button falls back to the event it
     always fired (data-add-fn / bubble_fn_pphAdd), so the old wiring keeps working untouched on
     pages you have not migrated yet.

     To open it from anywhere else (Quick Actions, a row action, a link), use a "Run JavaScript"
     step with the same one-liner.

     ── The event back to Bubble ────────────────────────────────
     ONE Toolbox "JavaScript to Bubble" element, type text, "Trigger event" checked:

         bubble_fn_uapAddPrompts

     It fires ONCE per Add click, carrying the whole batch. One workflow run for fifty prompts,
     not fifty — the same shape prompt-research's acceptAllSuggestedPrompts already uses.

         {"team_id":"…",
          "count":3,
          "prompt_texts":["Wer bietet …?","Which tools …?","Welche Anbieter …?"],
          "markets":["de","us",""],
          "tag_ids":"t1,t2",
          "source":"csv"}

     ZWEI Listen und ein Skalar. prompt_texts und markets sind INDEX-ALIGNED und immer so lang
     wie count: Element i von prompt_texts gehoert zu Element i von markets. tag_ids gilt fuer
     den ganzen Stapel und ist deshalb ein einzelner Wert, keine Liste.

       team_id       prepended by core, as on every other event.
       markets       alpha-2, lowercase. Eine Liste, weil der Markt wirklich pro Zeile sein kann:
                     die CSV-Vorlage hat dafuer eine eigene Spalte, importierte Zeilen behalten
                     ihren eigenen Markt, und der Batch-Picker fuellt nur die Luecken. Leerer
                     String, wenn weder Zeile noch Picker einen gab — ob das ein Fehler oder ein
                     Default ist, entscheidest du serverseitig.
       tag_ids       Kommaverbundene Topic-Ids fuer den GANZEN Stapel, leer wenn keins gewaehlt
                     wurde. Kein Array: der Topics-Picker gilt fuer alle Zeilen, und es gibt
                     nirgends eine Quelle fuer zeilenweise Topics — weder im Dialog noch als
                     CSV-Spalte. Frueher stand hier derselbe String N-mal wiederholt; das hat
                     einen Zeilenbezug behauptet, den es nicht gibt.
       input_method  "manual" oder "csv" — wie der Text in den Dialog kam. Fuer Auswertungen,
                     ignorierbar. Hiess frueher `source` und trug dieselben zwei Werte.
       source        IMMER "user_generated". Das Feld hat genau zwei gueltige Werte,
                     ai_generated und user_generated, und dieser Dialog erzeugt nur den zweiten:
                     ob getippt oder aus einer CSV — den Text hat der Nutzer formuliert.
                     ACHTUNG bei einer bestehenden Verdrahtung: bis Commit 5580a50 stand hier
                     "manual" bzw. "csv". Wer darauf verzweigt, muss das umstellen.

     READING IT IN BUBBLE. Der sichere Weg ist EIN Text-Parameter an den RPC, der den ganzen
     Payload traegt, und JSON-Parsing auf der Serverseite. Das ist keine Bequemlichkeit: zwei der
     fuenf Felder lassen sich per Regex gar nicht zeilenweise lesen, siehe unten.

     Diese vier sind unbedenklich, keiner der Werte enthaelt ein Anfuehrungszeichen:

         (?<="team_id":")[^"]*
         (?<="count":)[0-9]+
         (?<="tag_ids":")[^"]*             ergibt  t1,t2   (leer, wenn kein Topic gewaehlt)
         (?<="source":")[^"]*

     tag_ids traegt die Kommas IM Wert -- das ist die Liste der Topic-Ids und genau so gewollt.
     Nicht weiter zerlegen, es sei denn du willst die Ids einzeln; dann auf "," splitten, und
     zwar auf diesem Wert, nicht auf dem Payload.

     markets: der Rumpf laesst sich holen, die Elemente kommen aber MIT Anfuehrungszeichen und
     ein leerer Markt ist "" -- also nichts, was ein Split sauber trennt:

         (?<="markets":\[)[^\]]*            ergibt  "de","us",""

     prompt_texts: gar nicht per Regex. Prompt-Text ist Freitext mit Kommas und Anfuehrungszeichen,
     und die Anfuehrungszeichen stehen im Payload escaped (\") -- ein Split trifft genau die
     Prompts falsch, auf die es ankommt. Zeilenumbrueche koennen nicht vorkommen, die Komponente
     macht daraus eigene Zeilen.

     ── The refresh append, and it is not optional ──────────────
     Creating prompts changes which markets the team has prompts for and how many each holds. The
     component already calls upstreemMarketsChanged() for you, which fires:

         bubble_fn_upMarketsChanged

     Answer it the way you answer bubble_fn_upTopicsChanged: re-run the markets RPC and feed the
     result back with setUpstreemMarkets(`[MARKETS]`). Without that step every markets dropdown on
     the page keeps showing the list from page load, and a market that only exists because of the
     prompts just created will not be offered at all.

     Same rule for topics if a workflow of yours creates one: end it with the RPC plus
     setUpstreemTopics(`[TOPICS]`).

     ── The team's default market ───────────────────────────────
     One Run-JavaScript step at page load, no instance id involved:

         setUpstreemDefaultMarket("de");

     Lowercase alpha-2. The market picker starts on it every time the dialog opens, and rows
     imported from a CSV that carry their OWN market keep theirs — the default only fills the gaps.
     The user can still change or clear it, and that choice lasts for that one batch.

     Leave the call out and the picker simply starts empty; nothing else changes.

     ── Filling the pickers ─────────────────────────────────────
     The market and topics pickers read the page-level stores, so if the page already runs

         setUpstreemMarkets(`[MARKETS]`);
         setUpstreemTopics(`[TOPICS]`);

     at page load, this dialog needs nothing of its own. It subscribes to both stores, so a list
     that arrives after the modal was built still shows up.

     ══ THE CSV SIDE ══════════════════════════════════════════════════════════════

     Reading and writing the file happens entirely in the browser. No upload, no plugin, no
     workflow, no file ever leaves the machine until the user presses Add.

     THE TEMPLATE the Download button hands out is semicolon-separated with a UTF-8 BOM:

         prompt_text;market
         Wer bietet Schulungen …?;de
         Which tools help …?;us

     Semicolons because that is what Excel in a German locale both expects and writes: a
     comma-separated template drops every value into column A on the first double-click. The BOM is
     what makes Excel read the file as UTF-8 rather than the system code page, which is what keeps
     the umlauts. If your users are on an English Excel and complain, say so and it becomes a
     one-line change.

     WHAT THE IMPORTER ACCEPTS is deliberately wider than what it writes:

       Delimiter   ; , tab or | — detected from the header row, not assumed.
       Encoding    UTF-8 or Windows-1252. A file saved by Excel on Windows is usually the latter,
                   and read as UTF-8 its umlauts turn to rubbish, so it is decoded as UTF-8 first
                   and re-decoded as 1252 if that produced replacement characters.
       Quoting     Full CSV quoting: delimiters, line breaks and doubled "" inside a quoted field.
       Headers     prompt_text / prompt / text / query / frage for the text,
                   market / markt / country / land / alpha2 / country_code for the market.
                   Case, spaces and underscores are ignored.
       No header   A file whose first row matches none of those is read as headerless data, first
                   column as the prompt. Pasting a bare column of prompts into a file is the most
                   common thing people try, and refusing it would be pedantry.
       Market cell An alpha-2 code, or a full country name or alpha-3 that matches the markets
                   list. Anything else imports the row WITHOUT a market rather than dropping it.
       Empty rows  Skipped, and the count of skipped rows is shown under the drop zone.

     Rows land in the same staged list as manually typed ones and can be edited or removed before
     anything is sent.

     ── DER RUN-JS-SCHRITT: EIN BACKTICK, KEIN OBJEKT (STYLEGUIDE §46) ────────────────────────
     NIEMALS ein JS-Objekt im Schritt von Hand bauen. Also NICHT so:

       setUpstreemTopics([{ id: <ausdruck>, name: <ausdruck> }])   FALSCH

     Ist einer der Ausdruecke leer, steht dort  name: ,  -- und das ist kein gueltiges JavaScript.
     Der Schritt scheitert dann beim PARSEN, bevor eine einzige Zeile laeuft: "Uncaught
     SyntaxError: Unexpected token ','". Kein Sanitizer und kein Code im Kit kann das abfangen,
     weil nichts davon zur Ausfuehrung kommt -- und weil der GANZE Schritt stirbt, gehen auch die
     Aufrufe DARUNTER mit. So gemeldet am 24.08. an brand-detail: die Komponente blieb im
     Ladezustand stehen, weil ein leerer _prev-Wert den Schritt getoetet hatte, ehe ihr Setter
     ueberhaupt an die Reihe kam.

     RICHTIG ist immer EIN Backtick mit dem ROHEN Text und die beiden Ersetzungen darauf. Im
     Backtick ist ein leeres Feld nur Text; die erste Ersetzung macht daraus null, die zweite
     quotiert Bubbles unquotiertes yes/no. BEIDE Zeilen sind Pflicht.

       (function () {
         var ROH = `[RPC-Ergebnis: id, name, hex_light, hex_dark]`
           .replace(/:\s*([,}\]])/g, ": null$1")
           .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
         /* Jeder Aufruf in seinem EIGENEN try: ein kaputter oder fehlender Ausdruck darf die
            anderen nicht mitnehmen. Und window.<name> statt des nackten Namens -- haengt das
            Element noch an einem aelteren Pin, ist der Name schlicht undefined statt ein
            ReferenceError, der den ganzen Schritt mitnimmt. */
         try { if (window.setUpstreemTopics) window.setUpstreemTopics(ROH); } catch (e) {}
       })();

     Zahlen bleiben OHNE Anfuehrungszeichen -- 3.0, nicht "3.0" -- sonst kommt der Wert als Text
     an und jede Rechnung darauf geht daneben.

     Was bei einem unlesbaren Payload passiert: dieser Setter hat NOCH KEINEN Lesefehler-Zustand.
     Der Payload landet dann als leere Liste, und die Ansicht sieht aus wie ein sauberes leeres
     Ergebnis. Der Backtick ist hier also nicht eine von zwei Absicherungen, sondern die einzige.
     (Die 12 Komponenten mit render*-Einstieg haben den Zustand seit dem 24.08.; hier steht er
     noch offen.)

     setUpstreemMarkets traegt ebenfalls eine Liste -- eigener Backtick, eigenes try.
     setUpstreemDefaultMarket nimmt einen einzelnen Wert. Alle drei sind SEITENWEIT und nehmen
     nur den Payload, ohne instanceId.

     Die EINZIGE Zeichenfolge, die im Backtick selbst gefaehrlich bleibt, ist ein Backtick oder
     ein Dollar mit geschweifter Klammer in einem WERT. Beides kommt in Marken-, Domain- und
     Themennamen nicht vor; alles andere -- Anfuehrungszeichen, Apostrophe, Umlaute,
     Zeilenumbrueche, Emoji -- traegt er unbeschadet.
-->

<div class="up-root uap-host"
     data-cdn-pin="CDN_PIN"
     style="width:0;height:0;overflow:hidden"></div>
<script>
/* Loads core plus this component from jsDelivr, pinned to the commit hash in data-cdn-pin on the
   div above (falls back to @main only if left blank or at the literal "CDN_PIN" placeholder).
   Byte-for-byte the same loader every other component in this repo ships. */
(function(){
  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       jsDelivr antwortet mit 404, und weder CSS noch JS landen. Ohne trim greift auch kein
       Rueckfall, weil "   " truthy ist.
       Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
       Waechter treffen, und der Loader liefe dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* ---- Rueckfall: einen Pin nehmen, der auf DIESER Seite schon gilt ----------------------
       Gemeldet am 31.08. mit drei Stapelspuren, alle aus einem solchen Loader: "core.css ist
       schon von einem anderen Pin geladen ... ignoriert wird @main" -- obwohl der Pin am Element
       stand. Der Grund ist die Reihenfolge: Bubble baut ein Element bei jedem Rerender neu und
       fuehrt Scripts nicht in DOM-Reihenfolge aus, dieser Loader lief also, waehrend seine eigene
       Wurzel noch nicht im Dokument stand -- die Klasse oben fand nichts.
       Und das war mehr als eine Warnung: core kam durch die Entdoppelung unten noch aus dem Pin,
       die Dateien DIESER Komponente aber tatsaechlich von @main. Eine Seite, die zur Haelfte auf
       @main laeuft, ist genau das, was ein Pin verhindern soll.
       Geraten wird nichts: jede der drei Stufen liest einen Pin, der auf dieser Seite schon in
       Gebrauch ist. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* Aus einer schon geladenen Datei ablesen. Diese Stufe greift auch dann, wenn alle anderen
       Elemente der Seite noch die ALTE Fassung dieses Loaders tragen -- die fuellen
       __upAssetsLoaded genauso. "main" wird NICHT gemerkt: das ist kein Pin, und die naechste
       Komponente wuerde ihn sonst fuer einen halten. */
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("uap-host") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL. Zwei Elemente mit verschiedenen data-cdn-pin
     ergeben zwei URLs fuer dieselbe Datei -- vorher lud der Loader dann beide: core.js lief
     zweimal, und core.css stand zweimal im Dokument, wobei die spaetere die fruehere ueberschrieb.
     Wer gewinnt, entschied die Reihenfolge, in der Bubble die Elemente baut.
     Der erste Pin gewinnt jetzt, und ein zweiter wird gemeldet -- sonst sucht man den Unterschied
     zwischen zwei Seiten, auf denen dieselbe Version verschiedene Dinge tut. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("add-prompts.css");
  js("core.js"); js("add-prompts.js");
})();
</script>
