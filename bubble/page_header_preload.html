<!--
  UPSTREEM — ASSET-PRELOAD IM SEITENKOPF

  WOHIN: Bubble → Settings → SEO/metatags → "Script/meta tags in header" (bzw. das Header-Script
  der jeweiligen Page), UNTER page_theme_preload.html. NICHT in ein HTML-Element auf der Page —
  es muss laufen, BEVOR irgendeine Komponente im DOM auftaucht.

  ── WARUM ES DAS GIBT ────────────────────────────────────────────────────────
  Jede Komponente bringt am Fuß ihres Markups einen eigenen Loader mit, der core.css/core.js und
  ihre eigenen Assets nachlädt. Bubble injiziert dieses Markup aber erst in dem Moment, in dem das
  Reusable gerendert wird — also exakt WÄHREND ein Drawer aufgeht oder eine View eingeblendet wird.
  Ein in diesem Moment eingehängtes <link rel="stylesheet"> hält das Zeichnen an, und die
  Öffnungsanimation läuft ins Leere. Dieses Script zieht die Ladevorgänge auf den Seitenaufbau vor.

  Dass das reicht, hängt an einer Eigenschaft der Komponenten: ein neu im DOM auftauchender Root
  braucht die Scripts NICHT erneut. core.js' watchRoots-Observer plus sein 1.5s-Heartbeat finden
  ihn und initialisieren ihn von selbst.

  ── WAS SICH AM 28.08. GEÄNDERT HAT UND WARUM ────────────────────────────────
  Vorher lud dieses Script ALLES sofort: core plus 23 Komponenten plus Chart.js, auf jeder Seite,
  unabhängig davon, was die Seite braucht. Gemessen sind das 3.7 MB Quelltext. Das ist nicht
  render-blockierend (media="print" unten), aber es ist Download, Parsen und Ausführen im
  Hauptstrang, genau während die Seite aufgebaut wird — und mit offener Konsole vervielfacht sich
  der Parse-Aufwand. Zwei Änderungen, beide gemessen:

  1. MINIFIZIERTE FASSUNGEN. jsDelivr minifiziert die Dateien auf Anfrage: dieselbe URL mit
     .min.js / .min.css. Über alle 72 Dateien sind das 3740 KB → 1584 KB, also 58% weniger
     Zeichen; core.js allein 516 → 179 KB. Geprüft wurde jede einzelne Datei: jede minifizierte
     JS-Datei parst (new Function über den ganzen Text), und core.min.js läuft nachweislich
     (UpstreemCore mit seinen 215 Einträgen, UC.icon und UC.fmtPct liefern richtig).
     GENAU EINE Ausnahme: responses-table.min.css antwortet mit 404 — der Minifizierer von
     jsDelivr kommt mit dieser Datei nicht klar. Deshalb hat jeder Ladevorgang unten einen
     onerror-Rückfall auf die rohe Datei. Ohne den stünde diese Komponente ungestylt da.

  2. ZWEI WELLEN, MIT EINEM SCHALTER. Welle 1 lädt sofort, Welle 2 erst wenn der Browser nach dem
     load-Ereignis Luft hat. WAS in Welle 2 gehört, hängt an einer Eigenschaft der Seite, und die
     ist gemessen: solange das View-System alle Views beim Seitenaufbau baut, holen deren
     Element-Loader ihre Dateien noch VOR dem load-Ereignis — eine Welle 2 käme dann zu spät, der
     Loader war schneller und hat die rohe Datei geholt. Gemessen in der laufenden App: 77 Dateien,
     3914 KB, davon 3914 KB vor load; 10 Views gebaut, 135 Komponenten, 23604 DOM-Knoten.
     Deshalb steht VORRAT unten auf "sofort": dann liegt alles im Vorlauf und wird minifiziert
     geholt, statt roh von den Element-Loadern. 3914 KB werden damit rund 1640 KB.
     Erst wenn Views nur noch beim ersten Öffnen gebaut werden, ist "idle" richtig: dann braucht
     die Seite wirklich nur ihre eigenen Komponenten, und der Rest ist Vorrat für Drawer.

  ── DIE REGISTRY, UND WARUM SIE DIE ROHEN NAMEN TRÄGT ────────────────────────
  window.__upAssetsLoaded ist dieselbe Liste, die die Loader in den Komponenten benutzen. Sie
  entdoppelt nach DATEINAME. Dieses Script trägt deshalb den ROHEN Namen und die ROHE URL ein,
  lädt aber die minifizierte Datei: der Loader in einem Element sucht "core.js" und findet genau
  seine eigene URL vor — er lädt nichts nach und meldet auch keinen Pin-Unterschied. Kein Element
  muss dafür angefasst werden.

  ── ACHTUNG, EINZIGE FALLE ───────────────────────────────────────────────────
  PIN unten MUSS identisch sein mit dem data-cdn-pin auf den Komponenten. Weichen sie ab, lädt
  dieses Script Version A, die Loader der Komponenten finden ihre eigenen (anderen) URLs nicht in
  der Registry und laden Version B zusätzlich nach — dann hast du beides doppelt und in zwei
  Ständen. Am saubersten: beide auf dieselbe Bubble-Konstante zeigen lassen.

  ── UND DAS WICHTIGSTE ZUERST ────────────────────────────────────────────────
  Ein FRISCHER Pin ist beim ersten Abruf kalt: jsDelivr holt jede Datei dann einzeln von GitHub.
  Gemessen an core.js: 10 051 ms kalt gegen 119 ms warm. Kein Kniff in diesem Script kann das
  ausgleichen. Nach jedem Ausrollen einmal _h_pin_check2.html?pin=<hash> laufen lassen (76 Dateien
  parallel, wärmt und prüft in einem) — erst dann ist ein Pin für Nutzer gedacht.
-->
<script>
(function(){
  var PIN = "CDN_PIN";   // <-- exakt derselbe Wert wie data-cdn-pin auf den Komponenten
  if (!PIN || PIN === "CDN_" + "PIN") PIN = "main";
  /* "sofort": der Vorrat wird gleich mitgeladen. Richtig, solange die Seite ohnehin alle Views
     baut -- dann kommen die Dateien so oder so, und hier kommen sie minifiziert.
     "idle": der Vorrat wartet auf den Leerlauf nach dem load-Ereignis. Richtig, sobald eine Seite
     nur noch ihre eigenen Komponenten baut. */
  var VORRAT = "sofort";
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + PIN + "/";

  /* Die Verbindung zum CDN vorbereiten, bevor die erste Datei angefragt wird: DNS, TCP und TLS
     kosten auf einer frischen Verbindung ein paar hundert Millisekunden, und die liegen sonst vor
     dem ersten Byte von core.css. dns-prefetch daneben fuer Browser ohne preconnect. */
  ["preconnect", "dns-prefetch"].forEach(function(rel){
    var l = document.createElement("link");
    l.rel = rel; l.href = "https://cdn.jsdelivr.net";
    if (rel === "preconnect") l.crossOrigin = "anonymous";
    document.head.appendChild(l);
  });

  /* Dieselbe Registry, die die Loader in den Komponenten benutzen -- mit dem ROHEN Namen und der
     ROHEN URL als Eintrag, siehe Kopf. */
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(rohUrl, make){
    var name = rohUrl.slice(rohUrl.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== rohUrl && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + rohUrl + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = rohUrl; make();
  }
  function minUrl(f){ return base + f.replace(/\.(js|css)$/, ".min.$1"); }

  /* CSS: media="print" nimmt das Blatt aus der Bildschirm-Auswertung, es laedt also ohne das
     Zeichnen anzuhalten; onload schaltet auf "all". Der Timer ist die Absicherung -- feuert onload
     nicht, waere das Blatt dauerhaft nur fuer den Druck gueltig und die Komponente stuende
     ungestylt da. Der Rueckfall auf die rohe Datei ist fuer responses-table.min.css, das einzige
     404 unter 72 Dateien. */
  function css(f){ once(base + f, function(){
    var l = document.createElement("link"); l.rel = "stylesheet"; l.href = minUrl(f);
    l.media = "print";
    var an = function(){ l.media = "all"; };
    l.onload = an;
    l.onerror = function(){
      var r = document.createElement("link"); r.rel = "stylesheet"; r.href = base + f;
      r.media = "print"; r.onload = function(){ r.media = "all"; };
      setTimeout(function(){ r.media = "all"; }, 2000);
      document.head.appendChild(r);
      if (l.parentNode) l.parentNode.removeChild(l);
    };
    setTimeout(an, 2000);
    document.head.appendChild(l);
  }); }
  /* async=false haelt die Reihenfolge der eingehaengten Skripte ein -- die Komponenten brauchen
     core.js vor ihrem eigenen. Der Rueckfall wird sofort im Fehlerfall eingehaengt, also lange
     bevor Bubble das erste Element baut; die Reihenfolge bleibt damit gewahrt. */
  function js(f){ once(base + f, function(){
    var s = document.createElement("script"); s.src = minUrl(f); s.async = false;
    s.onerror = function(){
      var r = document.createElement("script"); r.src = base + f; r.async = false;
      document.head.appendChild(r);
    };
    document.head.appendChild(s);
  }); }

  /* ── Boot-Stubs für die vier seitenweiten Stores ────────────────────────────
     core.js kommt über das Netz, der Page-Load-Workflow nicht. Ruft Bubble also setUpstreemTopics/
     Markets/Brands, bevor core.js durch ist, ist die Funktion noch undefined: der Run-JS-Schritt
     wirft, und der GANZE Aufruf ist weg. Die Seite sieht danach aus wie eine ohne Daten, und
     nirgends steht ein Fehler.

     Diese Stubs schreiben den Aufruf in eine Queue, die core.js beim Start leert. Sie stehen hier
     und nicht in einer Komponente, weil hier der einzige Code der Seite läuft, der garantiert vor
     jedem CDN-Script dran ist. Drei davon teilen sich die Mechanik; der vierte,
     setUpstreemAllMarkets, braucht eine eigene Form und steht darum darunter. */
  ["Topics","Markets","Brands"].forEach(function(n){
    var q = "__up" + n + "Queue";
    window[q] = window[q] || [];
    if (typeof window["setUpstreem" + n] !== "function"){
      window["setUpstreem" + n] = function(rows){ window[q].push(rows); };
    }
  });
  /* setUpstreemAllMarkets ist ein VIERTER Store, nicht dieselbe Mechanik: er hat eine eigene
     Warteschlange mit einer anderen Form ({all:true, rows}), weil core.js darin gefilterte und
     volle Marktliste auseinanderhalten muss. Die Schleife oben kann ihn deshalb nicht mitnehmen.
     Fehlt er, zeigt jede Auswahl mit voller Marktliste kommentarlos die GEFILTERTE Liste, und die
     Diagnose meldet "Aufrufe 0". */
  window.__upstreemMarketQueue = window.__upstreemMarketQueue || [];
  if (typeof window.setUpstreemAllMarkets !== "function"){
    window.setUpstreemAllMarkets = function(rows){
      window.__upstreemMarketQueue.push({ all: true, rows: rows }); return true;
    };
  }

  /* ── WELLE 1: was JEDE Seite braucht ───────────────────────────────────────
     core zuerst, dann die Leiste -- sie steht auf jeder Seite und ihr Loader wuerde sie sonst
     ungekuerzt holen. Wer die Hauptseite noch schneller haben will, traegt HIER die zwei bis drei
     Komponenten ein, die auf ihr wirklich sichtbar sind; alles andere gehoert in Welle 2. */
  css("core.css");     js("core.js");
  css("sidebar.css");  js("sidebar.js");

  /* ── WELLE 2: der Vorrat ───────────────────────────────────────────────────
     Wann sie laeuft, entscheidet VORRAT oben. Bei "idle" requestIdleCallback mit Frist, damit es
     auch auf einer dauerbeschaeftigten Seite laeuft; ohne die Funktion ein Timer. */
  function welle2(){
    css("visibility-chart.css");        js("visibility-chart.js");
    css("topcitations-dashboard.css");  js("topcitations-dashboard.js");
    css("citations-combo-chart.css");   js("citations-combo-chart.js");
    css("prompts-table.css");           js("prompts-table.js");
    css("urls-table.css");              js("urls-table.js");
    css("domains-table.css");           js("domains-table.js");
    css("topics-manager.css");          js("topics-manager.js");
    css("responses-table.css");         js("responses-table.js");
    css("brands-overview.css");         js("brands-overview.js");
    css("performance-radar.css");       js("performance-radar.js");
    css("quick-actions.css");           js("quick-actions.js");
    css("performance-detail.css");      js("performance-detail.js");
    css("discover-brands.css");         js("discover-brands.js");
    css("settings-brand.css");          js("settings-brand.js");
    css("opportunities.css");           js("opportunities.js");
    css("ask-mira.css");                js("ask-mira.js");
    css("prompt-research.css");         js("prompt-research.js");
    css("add-prompts.css");             js("add-prompts.js");
    css("create-with-ai.css");          js("create-with-ai.js");

    /* Chart.js vorwärmen. Ohne das wird es erst beim ERSTEN Chart-Render geholt -- also mitten im
       Öffnen des ersten Drawers, der einen Chart enthält. Das data-Attribut ist genau das, worauf
       core.js' loadChartJs() prüft: findet es dieses Script schon vor, lädt es nichts nach.
       Es ist bereits minifiziert, hier gibt es also nichts zu holen. */
    once("chartjs", function(){
      var c = document.createElement("script");
      c.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js";
      c.setAttribute("data-upstreem-chartjs", "1");
      c.async = false;
      document.head.appendChild(c);
    });
  }
  function welle2Planen(){
    if (window.requestIdleCallback) window.requestIdleCallback(welle2, { timeout: 2500 });
    else setTimeout(welle2, 1200);
  }
  if (VORRAT === "sofort") welle2();
  else if (document.readyState === "complete") welle2Planen();
  else window.addEventListener("load", welle2Planen);
})();
</script>
