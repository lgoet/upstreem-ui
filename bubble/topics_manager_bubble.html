<!--
  UPSTREEM — TOPICS MANAGER

  Standalone page for managing the topics used to tag prompts: search, sort, add new ones, edit
  existing ones (name/emoji/color), delete. Not a table — a wrapped grid of chips, each showing
  how many prompts currently use that topic. Search/sort/filter are all CLIENT-SIDE: the whole
  topics list arrives once per render call and this component filters/sorts it locally, no server
  round-trip. Only Add/Edit/Delete talk to Bubble — after any of those, re-call
  window.renderTopicsManager(...) with the fresh list so the modal can close.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance   = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin    = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the literal
                    "CDN_PIN" placeholder) to load @main. Point this at a Bubble constant/Option
                    Set field you control so every placement can be repinned to a new commit in
                    one edit instead of hunting down every embed's URL by hand — @main itself lags
                    jsDelivr's cache, sometimes for hours, so a fresh fix may not actually be live
                    yet even right after it's pushed. The loader script at the bottom reads this
                    once and builds every asset URL from it.
  data-isdark     = "yes" / "no"
  data-processing  = "yes" / "no"   loading state, source 1 (ORed together)
  data-processing2 = "yes" / "no"   loading state, source 2 (ORed together)

  ── Event names must be unique per placement ─────────────────────────────────
  data-add-fn    = "bubble_fn_utmAdd_[dynamic id]"
  data-edit-fn   = "bubble_fn_utmEdit_[dynamic id]"
  data-delete-fn = "bubble_fn_utmDelete_[dynamic id]"

  Every one fires ONE JSON string, values pulled out on the Bubble side by regex — same
  convention as the other components. None of these are server-side searches/sorts/filters (this
  component does all of that itself, locally) — they are the only three things this component
  ever actually asks Bubble to do.

    add     {"name":"Sedans","emoji":"","hex_light":"#134e4a","hex_dark":"#134e4a"}
              -> create a new topic. No id — Bubble/your RPC assigns one. emoji is "" (empty
              string, not omitted) when none was picked.
    edit    {"id":"94fc124b-...","name":"Sedans","emoji":"","hex_light":"#134e4a","hex_dark":"#134e4a"}
              -> full replace of the editable fields, not a diff — same "send the whole current
              draft" convention as every other topic-editing flow in this app.
    delete  {"id":"94fc124b-..."}
              -> HARD delete. This component's job ends at firing the event; your RPC does the
              actual removal (and can still soft-delete/set is_active on its own side if you want
              — this component never reads or acts on is_active).

  Regex reference for a Bubble "extract" step:
    (?<="name":")[^"]*        (?<="emoji":")[^"]*
    (?<="hex_light":")[^"]*    (?<="hex_dark":")[^"]*
    (?<="id":")[^"]*

  ── Filling the component ─────────────────────────────────────────────────────
  window.renderTopicsManager({
    instanceId: "...",
    topics: [
      { id, name, emoji /* string or null */, hex_light, hex_dark, is_active, created_at, prompt_count },
      ...
    ]
  });
  window.setTopicsManagerLoading("INSTANCE_ID", "yes" | "no");
  window.resetTopicsManager("INSTANCE_ID");   // clears search/sort, closes an open modal, fires 0 events
-->

<div class="up-root utm-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-processing="IS_PROCESSING"
     data-processing2="IS_PROCESSING_2"
     data-add-fn="bubble_fn_utmAdd"
     data-edit-fn="bubble_fn_utmEdit"
     data-delete-fn="bubble_fn_utmDelete">
  <div class="up-head">
    <div class="up-heading"><span class="up-head-label">Topics</span><span class="up-head-sep"></span><span class="up-head-count"></span></div>
    <div class="up-head-tools">
      <button class="up-export utm-addbtn" type="button" data-topic-add-new>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Add Topic</span>
      </button>
      <div class="up-search">
        <button class="up-search-btn up-iconbtn" type="button" data-tip="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div class="up-search-box">
          <input class="up-search-input" type="text" placeholder="Search topics..." autocomplete="off" spellcheck="false" aria-label="Search topics"/>
          <button class="up-search-clear" type="button" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="up-sort">
        <button class="up-sort-btn up-iconbtn" type="button" data-tip="Sort" aria-label="Sort">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
        </button>
        <div class="up-sort-menu" role="menu" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div class="up-box utm-box">
    <div class="utm-chipgrid"></div>
  </div>
</div>
<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). The pin is found by looking the root element up BY CLASS — deliberately
   NOT via document.currentScript, because Bubble injects an HTML element's inline scripts in a way
   that leaves document.currentScript null/misattached. Loading core.js once per component is fine:
   the browser caches the (immutable, commit-pinned) URL, and the component's own init is idempotent. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("utm-root") + "/";
  function css(f){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = base + f; document.head.appendChild(l); }
  function js(f){ var s = document.createElement("script"); s.src = base + f; s.async = false; document.head.appendChild(s); }
  css("core.css"); css("topics-manager.css");
  js("core.js"); js("topics-manager.js");
})();
</script>
