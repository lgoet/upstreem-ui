<!--
  UPSTREEM — TOPICS MANAGER

  Standalone page for managing the topics used to tag prompts: search, sort, add new ones, edit
  existing ones (name/emoji/color), delete. Not a table — a wrapped grid of chips, each showing
  how many prompts currently use that topic. Search/sort/filter are all CLIENT-SIDE: the whole
  topics list arrives once per render call and this component filters/sorts it locally, no server
  round-trip. Only Add/Edit/Delete talk to Bubble — after any of those, re-call
  window.renderTopicsManager(...) with the fresh list so the modal can close.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance   = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin    = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the literal
                    "CDN_PIN" placeholder) to load @main. Point this at a Bubble constant/Option
                    Set field you control so every placement can be repinned to a new commit in
                    one edit instead of hunting down every embed's URL by hand — @main itself lags
                    jsDelivr's cache, sometimes for hours, so a fresh fix may not actually be live
                    yet even right after it's pushed. The loader script at the bottom reads this
                    once and builds every asset URL from it.
  data-isdark     = "yes" / "no"
  data-processing  = "yes" / "no"   loading state, source 1 (ORed together)
  data-processing2 = "yes" / "no"   loading state, source 2 (ORed together)

  ── Event names must be unique per placement ─────────────────────────────────
  data-add-fn    = "bubble_fn_utmAdd_[dynamic id]"
  data-edit-fn   = "bubble_fn_utmEdit_[dynamic id]"
  data-delete-fn = "bubble_fn_utmDelete_[dynamic id]"

  Every one fires ONE JSON string, values pulled out on the Bubble side by regex — same
  convention as the other components. None of these are server-side searches/sorts/filters (this
  component does all of that itself, locally) — they are the only three things this component
  ever actually asks Bubble to do.

    add     {"name":"Sedans","emoji":"","hex_light":"#134e4a","hex_dark":"#134e4a"}
              -> create a new topic. No id — Bubble/your RPC assigns one. emoji is "" (empty
              string, not omitted) when none was picked.
    edit    {"id":"94fc124b-...","name":"Sedans","emoji":"","hex_light":"#134e4a","hex_dark":"#134e4a"}
              -> full replace of the editable fields, not a diff — same "send the whole current
              draft" convention as every other topic-editing flow in this app.
    delete  {"id":"94fc124b-..."}
              -> HARD delete. This component's job ends at firing the event; your RPC does the
              actual removal (and can still soft-delete/set is_active on its own side if you want
              — this component never reads or acts on is_active).

  Regex reference for a Bubble "extract" step:
    (?<="name":")[^"]*        (?<="emoji":")[^"]*
    (?<="hex_light":")[^"]*    (?<="hex_dark":")[^"]*
    (?<="id":")[^"]*

  ── Filling the component — Run-JS "Render" step (paste as-is, swap the bracketed value) ────
  DO NOT splice your RPC's dynamic output directly into a JS array/object literal here (i.e. never
  write `topics: [<dynamic value>]`) — Bubble's own text output for a list containing emoji is not
  valid JSON (unquoted emoji, bare yes/no), so the instant a topic has an emoji this breaks with
  exactly the "Invalid or unexpected token" syntax error prompts-table.js already hit once before.
  The fix, and the ONLY safe way to hand data to any component in this library: put the raw dynamic
  text inside backticks as a single JS string (backticks don't care what's inside them, syntax-wise
  — that's what protects you here), then let UpstreemCore.parseBubbleJson do the real parsing. Never
  keep a second, ad-hoc parsing/escaping attempt in the Run-JS step itself — that's exactly how the
  emoji bug survived a round of fixes once already: only one of two copies got repaired.

  (function () {
    var RAW = `[TOPICS_RPC_RESPONSE]`;      // [{id,name,emoji,hex_light,hex_dark,is_active,created_at,prompt_count}, …]

    var t = 0;
    (function go () {
      var w  = window,
          fn = w.renderTopicsManager
            || (w.parent && w.parent.renderTopicsManager)
            || (w.top && w.top.renderTopicsManager);
      var UC = w.UpstreemCore
            || (w.parent && w.parent.UpstreemCore)
            || (w.top && w.top.UpstreemCore);

      if (typeof fn === "function" && UC && UC.parseBubbleJson) {
        var topics = UC.parseBubbleJson(RAW);
        fn({ instanceId: `INSTANCE_ID`, isDark: `ISDARK`, topics: topics });
        return;
      }
      if (t++ < 60) { setTimeout(go, 100); return; }
      console.error("[topics-manager] renderTopicsManager / UpstreemCore never appeared after 6s — " +
        "check data-cdn-pin and that the component is actually on this page.");
    })();
  })();

  ── Loading state — own Run-JS step, same reasoning as every other component ─
  (function () {
    const INSTANCE_ID = `INSTANCE_ID`;
    const LOADING = `IS_LOADING`;          // "yes" / "no"
    let t = 0;
    (function go(){
      const fn = window.setTopicsManagerLoading
        || (window.parent && window.parent.setTopicsManagerLoading)
        || (window.top && window.top.setTopicsManagerLoading);
      if (typeof fn === "function") { fn(INSTANCE_ID, LOADING); return; }
      if (t++ < 60) setTimeout(go, 100);
    })();
  })();

  window.resetTopicsManager("INSTANCE_ID");   // clears search/sort, closes an open modal, fires 0 events
-->

<div class="up-root utm-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-processing="IS_PROCESSING"
     data-processing2="IS_PROCESSING_2"
     data-add-fn="bubble_fn_utmAdd"
     data-edit-fn="bubble_fn_utmEdit"
     data-delete-fn="bubble_fn_utmDelete">
  <div class="up-head">
    <div class="up-heading"><span class="up-head-label">Topics</span><span class="up-head-sep"></span><span class="up-head-count"></span></div>
    <div class="up-head-tools">
      <!-- Sorter vor der Suche: dieselbe Reihenfolge wie in allen anderen Kopfzeilen. -->
      <div class="up-sort">
        <button class="up-sort-btn up-iconbtn" type="button" data-tip="Sort" aria-label="Sort">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
        </button>
        <div class="up-sort-menu" role="menu" aria-hidden="true"></div>
      </div>
      <div class="up-search">
        <button class="up-search-btn up-iconbtn" type="button" data-tip="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg>
        </button>
        <div class="up-search-box">
          <input class="up-search-input" type="text" placeholder="Search topics..." autocomplete="off" spellcheck="false" aria-label="Search topics"/>
          <button class="up-search-clear" type="button" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg>
          </button>
        </div>
      </div>
      <button class="up-export utm-addbtn" type="button" data-topic-add-new>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /> <path d="M12 5v14" /></svg>
        <span>Add Topic</span>
      </button>
    </div>
  </div>

  <div class="utm-chipgrid"></div>
</div>
<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). The pin is found by looking the root element up BY CLASS — deliberately
   NOT via document.currentScript, because Bubble injects an HTML element's inline scripts in a way
   that leaves document.currentScript null/misattached. Each asset url is fetched and evaluated at most
   ONCE per page — see the dedupe guard below for why that matters. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      /* Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
         Waechter treffen -- der Vergleich waere dann pin === "<der Hash>" und der Loader liefe
         dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
      if (p && p !== "CDN_" + "PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("utm-root") + "/";
  /* Bubble re-injects this whole block (this script tag included) every time the reusable this
     component sits in re-renders — i.e. on every drawer/view open. Without this guard each of
     those re-runs appended ANOTHER <link> + <script> for the SAME urls, forever: 4 more tags per
     render, never cleaned up (measured: 14 tags after one page build, 64 after ~25 navigations).
     Inserting a stylesheet <link> is render-blocking, so that landed right in the middle of the
     open animation — which is what made drawers/views "pop" in instead of animating.
     The registry lives on window, not in this closure, because every component ships its own copy
     of this loader. Skipping the re-run is safe: a re-rendered root is picked up and initialised
     by core.js's own root observer + 1.5s heartbeat, it does not need the scripts evaluated
     again (verified against a root injected with the scripts deliberately run only once). */
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL. Zwei Elemente mit verschiedenen data-cdn-pin
     ergeben zwei URLs fuer dieselbe Datei -- vorher lud der Loader dann beide: core.js lief
     zweimal, und core.css stand zweimal im Dokument, wobei die spaetere die fruehere ueberschrieb.
     Wer gewinnt, entschied die Reihenfolge, in der Bubble die Elemente baut.
     Der erste Pin gewinnt jetzt, und ein zweiter wird gemeldet -- sonst sucht man den Unterschied
     zwischen zwei Seiten, auf denen dieselbe Version verschiedene Dinge tut. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("topics-manager.css");
  js("core.js"); js("topics-manager.js");
})();
</script>
