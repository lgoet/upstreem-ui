<!--
  UPSTREEM — POWER DASHBOARD (power-dashboard.js / power-dashboard.css)

  Die zweite Ansicht des Dashboards: kompakt, Mira im Vordergrund, nur minimal Daten.
  Umgeschaltet wird im Dashboard-Seitenkopf ("Standard | Power", siehe
  page-headers/bubble/dashboard_page_header_bubble.html, data-mode-fn).

  ── WOHIN ─────────────────────────────────────────────────────────────────────────────────────
  In die Ansicht des Dashboards, in eine EIGENE Gruppe neben dem Standard-Dashboard:
      Gruppe "Standard"   sichtbar, wenn der Custom State dash_mode NICHT "power" ist
      Gruppe "Power"      sichtbar, wenn dash_mode "power" ist  -- darin dieses HTML-Element
  dash_mode setzt der Workflow auf dem Ereignis dphMode des Seitenkopfs (Nutzlast { mode }).
  Das Element NICHT auf volle Breite begrenzen: die Komponente haelt ihre Spalte selbst, genau so
  breit wie Mira (hoechstens 920px Inhalt, mittig, links und rechts Luft).

  ── MIRA ──────────────────────────────────────────────────────────────────────────────────────
  Das Eingabefeld oben IST Miras Feld, keine Kopie. Das Dashboard leiht sich das Mira-Element
  der Seite, solange es sichtbar ist, und gibt es beim naechsten Ansichtswechsel zurueck. Dafuer
  muss Mira auf DERSELBEN SEITE eingebaut sein (die Ansicht view=mira) und auf DEMSELBEN PIN
  stehen. Kein Workflow noetig:
      Senden          -> Miras Ansicht, neuer Chat, der Text geht dort ab
      ein Chip        -> Miras Ansicht, neuer Chat, der hinterlegte Prompt geht dort ab
      Recent chats    -> Miras Ansicht, genau dieser Chat
      "All"           -> Miras Ansicht, die Chatliste offen
  Den Wechsel macht die Komponente selbst (closeDrawer fuer offene Drawer, dann showView("mira")),
  derselbe Weg wie der Mira-Knopf der Drawer-Topbar.
  "Recent chats" liest Miras eigene Liste (askMiraSetPreviousChats). Traegt ein Chat updated_at
  (oder last_message_at / created_at), stehen die neuesten oben und rechts "Today", "Yesterday"
  oder das Datum; sonst gilt die Reihenfolge, in der Bubble die Liste schickt.

  ── WENN RECENT CHATS UND DAS BRETT LEER BLEIBEN (14.09., gemeldet) ──────────────────────────
  Bild: man kommt frisch auf die Seite, das Power Dashboard steht da, "Recent chats" zeigt erst
  das Skelett und dann "No chats yet", die Opportunity-Karten fehlen. Geht man EINMAL in Miras
  bzw. die Opportunities-Ansicht und kommt zurueck, ist alles da.

  DAS LIEGT NICHT AM KIT. Gemessen: schickt man askMiraSetPreviousChats bzw.
  opportunitiesSetItems neun Sekunden nach dem Laden -- also lange nach der Frist, mit der
  "No chats yet" erscheint --, nimmt die Oberflaeche beides an und zeigt es sofort. Sie wartet
  beliebig lange.

  Es liegt daran, WANN Bubble die zwei Setter ruft. Haengt der Workflow an der Sichtbarkeit der
  jeweiligen Gruppe ("Do when Group Mira is visible", "When element is visible") oder speist sich
  die Liste aus einer Repeating Group INNERHALB dieser Gruppe, dann laeuft er nicht, solange die
  Gruppe nie gezeigt wurde -- und das Dashboard bekommt nie etwas.

  ZU TUN: die Workflows, die askMiraSetPreviousChats und opportunitiesSetItems rufen, an
  "When page is loaded" haengen statt an die Sichtbarkeit. Beide Setter vertragen das: Kommt der
  Aufruf, bevor das jeweilige Skript geladen ist, legt dessen Boot-Warteschlange ihn ab und spielt
  ihn beim Start nach.
  Das gilt AUCH, wenn der Nutzer die Seite direkt auf dem Power Dashboard betritt -- und das ist
  der Normalfall, sobald "Power" seine gespeicherte Ansicht ist.

  ── ATTRIBUTE ─────────────────────────────────────────────────────────────────────────────────
  data-instance    = "ROOTID_[dynamic id]"    eindeutig je Platzierung
  data-cdn-pin     = derselbe Commit-Hash wie alle anderen Elemente
  data-isdark      = "yes" / "no"             nur Rueckfall; das Thema kommt aus core
  data-brand-name  = der Name der eigenen Marke. Wird im Chip "Compare me with …" ausgeschlossen:
                     der Chip nennt den staerksten WETTBEWERBER aus "Competitive field".
  data-view        = der Name, den die App an showView() fuer die Ansicht dieses Dashboards
                     uebergibt. Standard "dashboard". Stimmt er nicht, funktioniert alles
                     trotzdem -- Mira erscheint dann nur eine Viertelsekunde spaeter.
  data-demo        = "yes"  Beispieldaten, bis der erste renderPowerDashboard-Aufruf kommt
                     "no"   Skelett, bis die echten Daten da sind
                     JETZT "yes" (angefordert: erst einmal Beispieldaten). Sobald die Run-JS-
                     Schritte unten angeschlossen sind, auf "no" stellen -- sonst stehen beim
                     Laden fuer einen Moment die Beispielzahlen da.

  ── DER UMSCHALTER UNTER DEN KENNZAHLEN (14.09. umgebaut) ─────────────────────────────────────
  ZWEI Bereiche, nicht mehr drei Reiter: "Main Metrics" zeigt die zwei schmalen Listen
  nebeneinander -- links "Competitive field", rechts "Trending Citations" --, "Opportunities" das
  geliehene Brett. Der Umschalter selbst ist rein lokal (kein Workflow, die Wahl liegt im
  localStorage, ebenso die Domains/URL-Wahl der Zitierungen).
  Die Markenliste zeigt FUENF Zeilen und haengt die eigene Marke unten an, wenn sie weiter hinten
  steht -- mit ihrer echten Position. Dafuer braucht der Payload is_own an der eigenen Marke und
  position als Rang in der VOLLSTAENDIGEN Liste. Rang und Sentiment zeigt sie nicht mehr; die
  Felder duerfen bleiben, gelesen werden sie nicht.
  Unter jeder Liste steht ein Weiterweg ("All 8 brands" / "All domains"), der data-brands-fn bzw.
  data-citations-fn feuert -- dieselben Ereignisse wie das Zeichen oben rechts.
  DER DRITTE REITER ZEIGT DAS ECHTE OPPORTUNITIES-BRETT, nicht eine Kopie: das Dashboard leiht
  sich dessen Element, solange der Reiter vorne steht, und gibt es beim Reiter- oder
  Ansichtswechsel zurueck -- derselbe Weg wie bei Miras Eingabefeld oben. Dafuer muss
  opportunities.js auf DERSELBEN SEITE eingebaut sein und auf DEMSELBEN PIN stehen. Seine
  Werkzeugleiste (Sortierer, Suche, Board/List, Brett-Einstellungen) zieht dabei nach oben rechts
  in die Kopfzeile dieses Umschalters. Fehlt das Element auf der Seite, bleibt der Reiter einfach
  leer -- es geht nichts kaputt.

  ── EREIGNISSE (JavaScriptToBubble), Namen je Platzierung eindeutig ──────────────────────────
  Je ein Zeichen (Pfeil nach oben rechts, 16px) steht ganz rechts in der Ueberschriftzeile der
  beiden Listen und fuehrt in die jeweilige volle Ansicht. Was es tut, sagt sein Tooltip -- bei den
  Marken mit Anzahl ("Go to all 8 brands"), bei den Zitierungen je nach Umschalterstellung.
  data-brands-fn    = "bubble_fn_upwBrands_[dynamic id]"
                      Klick auf das Zeichen in der Ueberschrift von "Competitive field". Leere
                      Nutzlast {} -- im Workflow einfach zur Brands-Ansicht wechseln.
  data-citations-fn = "bubble_fn_upwCitations_[dynamic id]"
                      Klick auf das Zeichen in der Ueberschrift von "Trending Citations". Nutzlast
                      { "mode": "domains" | "urls" } -- welcher der beiden Domains/URL-Umschalter
                      gerade steht. Im Workflow: zur Citations-Ansicht wechseln, ggf. denselben
                      Modus dort vorwaehlen.
  data-opportunities-fn = ENTFAELLT SEIT DEM 14.09. -- nichts feuert es mehr.
                      Es hing am Oeffnen-Zeichen in der Umschalterzeile, und das ist gestrichen:
                      die zwei Listen tragen ihres jetzt selbst, je in ihrer Ueberschriftzeile, und
                      die fuehren zu Brands bzw. Citations. Aus dem Opportunities-Bereich gibt es
                      damit KEINEN Weg mehr in die volle Opportunities-Ansicht -- wer einen will,
                      sagt Bescheid, dann kommt das Zeichen dort wieder hin.
                      Das Attribut darf am Element stehen bleiben, es wird nur nicht mehr gelesen.
  data-needs-fn     = "bubble_fn_upwNeeds_[dynamic id]"
                      Sagt, welche Datenabschnitte gerade gebraucht werden. Nutzlast
                      { "mode": "metrics" | "opportunities",
                        "needs": [ "brands" | "citations_domain" | "citations_url" | "opportunities" ] }
                      needs ist eine LISTE: "Main Metrics" zeigt zwei Listen nebeneinander und
                      braucht darum beide Datensaetze zugleich.
                      Feuert EINMAL beim Aufbau -- mit dem Bereich, den der Browser gespeichert hat,
                      denn den kann Bubble nicht kennen -- und danach bei jedem Bereichswechsel
                      sowie beim Umschalten Domains/URLs.
                      Im Workflow: nachsehen, ob dieser Abschnitt schon geladen wurde; wenn nicht,
                      ihn nachladen und an seinen Setter geben. Ist er schon da, nichts tun -- das
                      Ereignis kommt bei jedem Wechsel, auch beim Zurueckwechseln.
                      Wer alles beim Seitenladen holt, braucht dafuer keinen Workflow; das Ereignis
                      laeuft dann ins Leere und stoert nicht. Siehe power_dashboard_daten_nachtrag.md.
  data-rowclick-fn  = "bubble_fn_upwRowClick_[dynamic id]"
                      Klick auf eine Zeile. Nutzlast
                      { "team_id": "...", "type": "brand" | "domain" | "url", "id": "..." }
                      id ist bei brand die company_id, bei domain die Domain, bei url die Adresse --
                      dieselben Kennungen wie in Quick Actions.
                      KEIN WORKFLOW NOETIG (15.09.): die Komponente ruft openDrawer(type, id)
                      selbst, und openDrawer meldet die Kennung von sich aus an
                      bubble_fn_drawer_<type>. Die drei Zeilentypen heissen genau wie die drei
                      Drawer-Arten aus DRAWER_LEVELS im Header-Snippet. Das Ereignis feuert
                      trotzdem weiter -- fuer alles, was ZUSAETZLICH passieren soll.

  ── NAVIGATION: DAS KIT GEHT SELBST HIN ───────────────────────────────────────────────────────
  Die Host-App wechselt Ansichten mit showView(name) und oeffnet Drawer mit openDrawer(art, id).
  Beides ruft die Komponente direkt, genau wie Miras Senden aus dem Dashboard. Fuer diese vier
  Klicks braucht es also KEINEN Bubble-Workflow mehr:

      Zeile "Competitive field"   -> openDrawer("brand",  company_id)
      Zeile "Trending Citations"  -> openDrawer("domain", domain)   im Domain-Modus
                                     openDrawer("url",    url)      im URL-Modus
      Pfeil ueber "Competitive field"  -> showView("brands")
      Pfeil ueber "Trending Citations" -> showView("citations")

  Gibt es showView/openDrawer auf der Seite nicht (Prueftand, Landingpage), steht eine Zeile in
  der Konsole und das Ereignis feuert trotzdem -- kein stiller Ausfall.

  Der Umschalter Standard/Power ist die Ausnahme: er entscheidet, WELCHE Bubble-Gruppe sichtbar
  ist, und das kann nur Bubble. Dafuer bleibt data-mode-fn am Seitenkopf.

  ── DATEN: renderPowerDashboard ───────────────────────────────────────────────────────────────
  EIN Aufruf, jeder Teil darf einzeln kommen (ein Workflow je RPC ist in Ordnung):

    renderPowerDashboard(`{ "instanceId": "...", "overview": {...}, "brands": [...],
                            "top_domains": [...], "top_urls": [...], "citations_label": "Last 30 days" }`)

  overview -- EIN Objekt:
    range_label             der Zeitraum, z.B. "Last 30 days". Er steht in der Kopfzeile der
                            Tabelle ("8 brands · Last 30 days"); neben "Overview" stand er bis
                            zum 12.09. ein zweites Mal, das ist gestrichen.
    visibility_pct          3.0        visibility_delta_pct   1.0     (Prozentpunkte)
    visibility_position     2          brand_count            8       -> "#2 of 8 brands"
    avg_rank                3.3        avg_rank_delta        -0.9     (kleiner ist besser)
    best_rank               2.6                                        -> "Best in field 2.6"
    sentiment               76         sentiment_delta        1.6
    field_avg_sentiment     74                                         -> "Field average 74"

    NICHT MEHR GELESEN (13.09. aufgeraeumt, die Anzeigen dazu sind gestrichen): die drei
    *_series (die Verlaufslinien sind weg), leader_name/leader_visibility_pct,
    first_count/prompt_count und negative_count/response_count -- sie standen in der zweiten
    Haelfte der Fusszeilen, und die Fusszeile traegt jetzt nur noch eine Angabe. Sie duerfen im
    Payload stehen bleiben, kosten aber nur Bandbreite; wer den RPC neu baut, laesst sie weg.

    Fehlen visibility_position oder brand_count, rechnet die Komponente sie aus
    "brands" aus (die eigene Marke traegt is_own: true).

  brands -- DIESELBEN Felder wie brands-overview (derselbe RPC fuellt beide):
    company_id, position, name, logo_url (oder favicon_url), visibility_pct,
    visibility_delta_pct, avg_rank, avg_rank_delta, sentiment, sentiment_delta,
    is_own (true bei der eigenen Marke)
    avg_rank_delta und sentiment_delta sind seit dem 12.09. dabei: die Tabelle zeigt den Trend
    jetzt in ALLEN drei Wertspalten, wie die maximierte Tabelle im Visibility Chart. Fehlen sie,
    steht dort einfach kein Trend -- kein Fehler, nur weniger Aussage.

  top_domains -- dieselben Felder wie topcitations-dashboard:
    domain, favicon, citation_type (Editorial | UGC_Community | Brand_Platform | Institutional |
    Competition | Knowledge_Base | You), share_pct, share_delta_pct, used_total
  top_urls -- ebenso:
    url, title, favicon, url_type, global_share_pct, share_delta_pct, used_total
    used_total fuellt die Spalte "Used" (ebenfalls seit dem 12.09., wie im Top Citations
    Dashboard). Fehlt es, bleibt die Zelle leer.

  citations_label -- der Text neben der Zahl in der Tabellen-Kopfzeile, z.B. "Last 30 days"
  totalCountDomain, totalCountUrl -- die GESAMTZAHL der Domains bzw. URLs im Zeitraum, NICHT die
    Laenge von top_domains/top_urls (die zeigen nur die "top" 7). Fuer die Kopfzeile der Tabelle
    im Citations-Modus: "32.5k citations · 7 days" (UC.fmtTotal, wortgleich zu
    topcitations-dashboard). Im Brands-Modus steht dort stattdessen overview.brand_count:
    "8 brands · Last 30 days" -- kein eigenes Feld noetig, das gibt es schon.

  chips (optional) -- eigene Chips statt der eingebauten:
    [{ "emoji": "📅", "label": "Create a Daily Briefing", "prompt": "…" }, …]
    {TIMEFRAME} im Prompt ersetzt Mira mit dem Zeitraum ihrer Report-Karten, {COMPETITOR} die
    Komponente mit dem staerksten Wettbewerber.

  setPowerDashboardLoading("INSTANCE_ID", "yes" | "no")   Skelett an/aus. Echte Daten beenden
  es auch ohne "no".

  ── DER RUN-JS-SCHRITT: EIN BACKTICK JE AUSDRUCK (wie urls-table, brand-detail, ask-mira) ────
  NIEMALS ein JS-Objekt im Schritt von Hand bauen und nie im Schritt parsen. Ist ein Ausdruck
  leer, steht dort  "key": ,  -- kein gueltiges JavaScript, der Schritt stirbt beim PARSEN, und
  mit ihm alle Aufrufe darunter. Im Backtick ist ein leeres Feld nur Text; die erste Ersetzung
  macht null daraus, die zweite quotiert Bubbles unquotiertes yes/no. BEIDE Zeilen sind Pflicht.

  Der ROHE Text geht in den Setter. UC.readBubble in der Komponente ist der EINE geteilte
  Leseweg -- er repariert unescapte Anfuehrungszeichen, leere Werte, abgeschnittene Felder,
  Zeilenumbrueche und Emoji und trennt LEER von UNLESBAR. Kein JSON.parse, kein
  :formatted as JSON-safe, kein find & replace.

  Vier Setter, JE EIN EIGENER BACKTICK, JE EIN TRY -- und jeder in einer eigenen Variablen, nicht
  in einem Aufruf. Der Unterschied ist nicht Geschmack: steht das Literal in einem Aufruf, meldet
  ein Fehler darin "missing ) after argument list" statt der Stelle, an der er wirklich sitzt.

    (function () {
      var HAUPT = `[Power-Dashboard-RPC, :format as text]`
        .replace(/:\s*([,}\]])/g, ": null$1")
        .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
      var CHATS = `[Power-Dashboard-RPC's chats, :format as text]`
        .replace(/:\s*([,}\]])/g, ": null$1")
        .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
      var PROJ = `[Power-Dashboard-RPC's chat_projects, :format as text]`
        .replace(/:\s*([,}\]])/g, ": null$1")
        .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
      var OPPS = `[Power-Dashboard-RPC's opportunities, :format as text]`
        .replace(/:\s*([,}\]])/g, ": null$1")
        .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });

      /* Jeder Aufruf in seinem EIGENEN try, und window.<name> statt des nackten Namens: haengt
         ein Element noch an einem aelteren Pin, ist der Name schlicht undefined statt ein
         ReferenceError, der den ganzen Schritt mitnimmt. */
      try { if (window.renderPowerDashboard) window.renderPowerDashboard(HAUPT); } catch (e) {}
      try { if (window.askMiraSetPreviousChats) window.askMiraSetPreviousChats(CHATS); } catch (e) {}
      try { if (window.askMiraSetProjects) window.askMiraSetProjects(PROJ); } catch (e) {}
      try { if (window.opportunitiesSetItems) window.opportunitiesSetItems(OPPS); } catch (e) {}
    })();

  Der erste Aufruf nimmt die GANZE RPC-Antwort. Die Komponente liest daraus overview, brands,
  top_domains, top_urls, citations_label und errors; chats, chat_projects und opportunities
  liegen darin und stoeren nicht.

  Zahlen bleiben OHNE Anfuehrungszeichen -- 3.0, nicht "3.0".

  ── DIE EINE ZEICHENFOLGE, DIE IM BACKTICK GEFAEHRLICH BLEIBT ───────────────────────────────
  Ein BACKTICK oder ein Dollar mit geschweifter Klammer in einem WERT. Alles andere --
  Anfuehrungszeichen, Apostrophe, Umlaute, Zeilenumbrueche, Emoji -- traegt der Backtick
  unbeschadet. Das steht so in jeder Vorlage, und es stimmt: in Marken-, Domain- und Themennamen
  kommt beides nicht vor.

  Es kommt aber in TEXT VOR, DEN EIN SPRACHMODELL GESCHRIEBEN HAT -- ein Modell setzt Backticks
  um URLs und Feldnamen. Deshalb steht in KEINER Nutzlast dieser App ein solches Feld: Miras
  Chatliste traegt id, title und updated_at, sonst nichts. Genau das war der Fehler am 15.09. --
  der RPC lieferte zusaetzlich chats.preview, ein Feld, das in KEINER Datenspezifikation steht und
  das KEINE Komponente liest (nachgesehen in ask-mira.js und power-dashboard.js). Darin stand:

      "preview": "Die URL `https://de.trustpilot.com/review/lee-up.de` ist deine ..."
      -> Uncaught SyntaxError: missing ) after argument list

  Abhilfe im RPC, nicht im Schritt: das Feld faellt weg. Es kostete nebenbei den groessten Teil
  der Nutzlast -- 50 Chats mal 200 Zeichen Vorschau, fuer nichts.

  Bleibt opportunities: headline und reason SIND Modelltext und werden angezeigt. Fuer die zwei
  gehoert ein replace in den RPC, damit kein roher Backtick herauskommt:

      replace(o.headline, chr(96), '')

  STATISCH ZUM TESTEN -- dieselben Werte wie die Beispieldaten, als Run-JS-Schritt:
  Hier steht ein Backtick-Literal, weil diese Daten von Hand geschrieben sind und keinen Backtick
  enthalten. Wer ECHTE Daten hier einsetzt, muss darin jeden Backtick als \` schreiben und jedes
  ${ als \${ -- oder dieselbe Form wie oben nehmen. Ein Backtick in einer Chat-Vorschau hat den
  Schritt am 15.09. mit "Unexpected identifier" zum Absturz gebracht.

    (function () {
      var ROH = `{
        "instanceId": "INSTANCE_ID",
        "overview": { "range_label": "Last 30 days", "visibility_pct": 3.0, "visibility_delta_pct": 1.0,
          "visibility_position": 2, "brand_count": 8, "avg_rank": 3.3, "avg_rank_delta": -0.9,
          "best_rank": 2.6, "sentiment": 76, "sentiment_delta": 1.6, "field_avg_sentiment": 74 },
        "brands": [
          { "company_id": "d1", "position": 1, "name": "Anfragenfluss", "visibility_pct": 5.2, "visibility_delta_pct": 4.0, "avg_rank": 2.6, "avg_rank_delta": -0.4, "sentiment": 75, "sentiment_delta": 2.1 },
          { "company_id": "d2", "position": 2, "name": "LeeUp Media", "visibility_pct": 3.0, "visibility_delta_pct": 1.0, "avg_rank": 3.3, "avg_rank_delta": -0.9, "sentiment": 76, "sentiment_delta": 1.6, "is_own": yes }
        ],
        "top_domains": [
          { "domain": "reddit.com", "citation_type": "UGC_Community", "share_pct": 6.8, "share_delta_pct": 9.1, "used_total": 1840 },
          { "domain": "trustpilot.com", "citation_type": "Brand_Platform", "share_pct": 4.1, "share_delta_pct": 5.2, "used_total": 1120 }
        ],
        "top_urls": [],
        "citations_label": "Last 30 days",
        "totalCountDomain": 128,
        "totalCountUrl": 32500
      }`
        .replace(/:\s*([,}\]])/g, ": null$1")
        .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
      try { if (window.renderPowerDashboard) window.renderPowerDashboard(ROH); } catch (e) {}
    })();

  Bubble-seitig NEU sind also: diese Gruppe mit dem Element, der Custom State dash_mode samt
  Workflow auf dphMode (Seitenkopf), die drei Ereignisse oben und die Run-JS-Schritte.
-->
<div class="up-root upw-root"
     data-instance="ROOTID_[dynamic id]"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-brand-name="BRAND_NAME"
     data-view="dashboard"
     data-demo="yes"
     data-brands-fn="bubble_fn_upwBrands"
     data-citations-fn="bubble_fn_upwCitations"
     data-opportunities-fn="bubble_fn_upwOpportunities"
     data-needs-fn="bubble_fn_upwNeeds"
     data-rowclick-fn="bubble_fn_upwRowClick"></div>
<script>
(function(){
  /* Loader nach STYLEGUIDE 26: den Pin ueber getElementsByClassName lesen, NIEMALS ueber
     document.currentScript — Bubble fuehrt Scripts nicht in DOM-Reihenfolge aus. */
  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       jsDelivr antwortet mit 404, und weder CSS noch JS landen. Ohne trim greift auch kein
       Rueckfall, weil "   " truthy ist.
       Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
       Waechter treffen, und der Loader liefe dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* ---- Rueckfall: einen Pin nehmen, der auf DIESER Seite schon gilt ----------------------
       Gemeldet am 31.08. mit drei Stapelspuren, alle aus einem solchen Loader: "core.css ist
       schon von einem anderen Pin geladen ... ignoriert wird @main" -- obwohl der Pin am Element
       stand. Der Grund ist die Reihenfolge: Bubble baut ein Element bei jedem Rerender neu und
       fuehrt Scripts nicht in DOM-Reihenfolge aus, dieser Loader lief also, waehrend seine eigene
       Wurzel noch nicht im Dokument stand -- die Klasse oben fand nichts.
       Und das war mehr als eine Warnung: core kam durch die Entdoppelung unten noch aus dem Pin,
       die Dateien DIESER Komponente aber tatsaechlich von @main. Eine Seite, die zur Haelfte auf
       @main laeuft, ist genau das, was ein Pin verhindern soll.
       Geraten wird nichts: jede der drei Stufen liest einen Pin, der auf dieser Seite schon in
       Gebrauch ist. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
