<!-- ==========================================================================================
     upstreem — Forgot Password (Praefix `ufp`, Stand 07.10.)

     Passwort vergessen: Adresse eingeben, Ruecksetzlink anfordern. Die GANZE Seite ist dieses
     eine HTML-Element: auf volle Breite und volle Hoehe setzen, ohne eigenes Padding.

     ── FRISCHE INSTALLATION ──────────────────────────────────────────────────────────────────
     Diese Datei ist eine VORLAGE. Aenderungen daran erreichen ein bereits eingebautes Element
     NICHT -- dort muss dasselbe von Hand nachgezogen werden.

     ── WAS DIE SEITE NICHT BRAUCHT ───────────────────────────────────────────────────────────
     Kein data-cdn-pin, kein data-isdark, kein data-logo (Begruendung wie in
     check_email_bubble.html: Pin aus dem Seitenkopf, Thema aus pref_theme, Wortmarke je Thema).

     ── ATTRIBUTE ─────────────────────────────────────────────────────────────────────────────
       data-instance   eindeutig pro Seite. Die Setter sprechen ueber diese ID.
       data-submit-fn  das JavaScriptToBubble-Element, siehe unten.
       data-login-url  wohin "Back to sign in" fuehrt. Vorgabe: /signup?mode=login
     Die Adresse fuellt die Seite aus ?email= vor (auch ?mail=).

     ── EVENT (JavaScriptToBubble "ufpSubmit", Value type TEXT, Trigger event an) ─────────────
       data-submit-fn = "bubble_fn_ufpSubmit"
       ROHER WERT, kein JSON: der Wert IST die Adresse, schon geprueft (Form) und getrimmt.
       In Bubble also schlicht:  This JavaScriptToBubble's value
       Feuert beim Klick auf "Send reset link" (oder Enter) UND bei "Resend link" in der
       Bestaetigung. "Resend" wartet 60 Sekunden -- so lange sperrt Supabase dieselbe Adresse.
       Danach steht die Seite im Ladezustand. Heraus kommt sie nur durch einen der zwei Setter.
       Nach 20 Sekunden ohne beides entsperrt sie sich selbst mit "That took longer than
       expected." -- das ist die Notbremse. Steht der Satz im Alltag da, fehlt der Fehlerzweig.

     ── DATEN HEREIN ──────────────────────────────────────────────────────────────────────────
       setForgotPasswordDone(instanceId)
         Der Link ist verschickt. Die Seite zeigt an derselben Stelle "Check your email" und
         "If an account exists for <adresse>, we sent a reset link." --
         ABSICHTLICH neutral, ob es das Konto gibt oder nicht. Sonst liesse sich mit der Seite
         pruefen, welche Adressen ein Konto haben. Eigene Texte als zweiter und dritter Wert:
         setForgotPasswordDone(id, titel, text).

       setForgotPasswordError(instanceId, fehlertext)
         Der Fehler, WIE SUPABASE IHN LIEFERT (Code, Meldung oder beides hintereinander). Die
         Seite macht daraus einen Satz, kein Technikertext erreicht den Nutzer:
           "after 47 seconds"             -> "Please wait 47 seconds before trying again."
           over_email_send_rate_limit     -> "Too many emails were sent. Please wait a few minutes ..."
           over_request_rate_limit        -> "Too many attempts. Please wait a moment ..."
           email_address_invalid          -> rote Zeile am Feld
           user_not_found                 -> die neutrale Bestaetigung, KEIN Fehler (siehe oben)
           Netzwerkfehler                 -> "We could not reach the server ..."
           alles andere                   -> "Something went wrong. Please try again."

     ── EINBAU ────────────────────────────────────────────────────────────────────────────────
     1. Bubble-Seite "forgot-password", dieses Element darauf.
     2. JavaScriptToBubble-Element "ufpSubmit" (Value type TEXT, Trigger event an).
     3. Workflow "When ufpSubmit event":
        a) Supabase-Plugin: Passwort-Ruecksetzung anfordern (resetPasswordForEmail)
             email       = ufpSubmit's value
             redirect_to = https://app.upstreem.ai/reset-password
           Diese Adresse muss in Supabase unter Authentication > URL Configuration > Redirect URLs
           stehen, sonst fuehrt der Link in der Mail auf die Site URL statt auf die Seite.
        b) Erfolg -> Run JavaScript, DER ERFOLGSSCHRITT unten.
        c) Fehler -> Run JavaScript, DER FEHLERSCHRITT unten.
     4. Hinfuehren: der Link "Forgot password?" der Anmeldeseite feuert uauSide (mode "login",
        mit der eingetippten Adresse). Workflow dort:
          Go to page forgot-password, Send more parameters: email = <email aus uauSide>

     ── DER ERFOLGSSCHRITT ────────────────────────────────────────────────────────────────────
       (function () {
         try { if (window.setForgotPasswordDone) window.setForgotPasswordDone("forgot_page"); } catch (e) {}
       })();

     ── DER FEHLERSCHRITT ─────────────────────────────────────────────────────────────────────
     Der Fehlertext ist TEXT, kein JSON. Deshalb OHNE die beiden Ersetzungen aus STYLEGUIDE §46:
     die sind fuer JSON-Nutzlasten gebaut und machten aus "AuthApiError: ," ein
     "AuthApiError: null,". Ein Backtick, der rohe Text, ein try -- wie der Fehlerschritt in
     bubble/signup_invite_setup.md. window.<name> statt des nackten Namens: haengt das Element
     noch an einem aelteren Pin, ist der Name undefined statt ein ReferenceError.

       (function () {
         var FEHLER = `[Fehlertext des Supabase-Plugins, z.B. Supabase Auth A's error message]`;
         try { if (window.setForgotPasswordError) window.setForgotPasswordError("forgot_page", FEHLER); } catch (e) {}
       })();

     Welcher Ausdruck: der, den das Plugin fuer den letzten Fehler anbietet (meist ein State
     "error message" am Supabase-Element, gefuellt in dessen Event "an error occurs"). Hat es
     Code und Meldung getrennt, beide hintereinander in denselben Backtick: `[code] [message]`.

     DIESELBE FASSUNG STATISCH, mit einer echten Supabase-Antwort -- zum Ausprobieren, ob die
     Seite antwortet, bevor das Plugin verdrahtet ist:

       (function () {
         var FEHLER = `over_email_send_rate_limit For security purposes, you can only request this after 47 seconds.`;
         try { if (window.setForgotPasswordError) window.setForgotPasswordError("forgot_page", FEHLER); } catch (e) {}
       })();

     Die drei Zeichen, die im Backtick gefaehrlich sind (Backtick, Dollar mit geschweifter
     Klammer, Backslash), kommen in Supabase-Meldungen nicht vor.
-->

<div class="up-root ufp-root"
     data-instance="forgot_page"
     data-submit-fn="bubble_fn_ufpSubmit"
     data-login-url="/signup?mode=login"></div>

<script>
(function(){
  /* Derselbe Loader wie in auth_page_bubble.html -- dort stehen die Begruendungen zu jeder Stufe.
     Ohne data-cdn-pin am Element greift die zweite Stufe: window.__upPin aus dem Seitenkopf. */
  function echterPin(p){
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("ufp-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  css("core.css");              js("core.js");
  css("forgot-password.css");   js("forgot-password.js");
})();
</script>
