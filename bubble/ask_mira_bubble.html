     Upstreem — Ask Mira (the agent)
     Paste this whole block into a Bubble HTML element. The loader at the bottom pulls
     core.css/core.js + ask-mira.css/js from jsDelivr, pinned to the commit in data-cdn-pin.

     Ported from the standalone ask_mira.html. The LOGIC IS UNTOUCHED: every window.askMira*
     method, every bubble_fn_ask_mira_* call, every CustomEvent name and every payload key is
     byte-identical, so the existing Bubble workflows keep working without a single change.

     ── Bubble dynamic values on the root element ────────────────────────────────
     data-instance = "ROOTID_[dynamic id]"
     data-cdn-pin  = commit hash to load from. NEVER leave this empty: blank falls back to @main,
                     and jsDelivr caches branch URLs for days.
     data-isdark   = "yes" / "no"   (askMiraSetTheme("dark"|"light") also works)

     ── Was gegenueber dem Standalone anders ist ─────────────────────────────────
     - Farben kommen aus core (--vc-*). Das eigene Palettenset wird nur noch abgeleitet, keine
       einzige der ~370 Regeln wurde angefasst: Chat, Antwort-Tabellen und die Brand-/Prompt-/
       Response-/URL-Highlight-Chips sind unveraendert.
     - Das zweite Theme-System (OS prefers-color-scheme) ist raus. core's data-theme fuehrt, sonst
       hattest du bei dunklem OS ein helles App-Fenster mit dunklem Agent-Panel.
     - Die drei Highlight-Dropdowns laufen auf UC.makePopover (Aussenklick, Escape, gegenseitiges
       Schliessen aus core statt zwei eigener document-Listener).
     - Die Buttons der Komponenten-Chrome haben das App-Tooltip statt title=.
     - Stub-Queue: askMira*-Aufrufe vor dem Laden von core.js gehen nicht mehr verloren.
     Chat-Bereich, Modell-/Detail-Dropdown, Chat-Kontextmenue, Voice und das Previous-Chats-Panel
     sind bewusst unveraendert.

     ── Fixes/Aenderungen nach dem ersten Live-Test ──────────────────────────────
     - Evidence-Chip-Klicks (open_prompt/open_url/open_domain/open_response/open_brand/
       open_competitor): entity_id im bubble_fn_ask_mira_open_evidence-Payload kam manchmal leer
       an. Ursache war der HTML-Sanitizer -- der hat data-mira-prompt-id/-prompt-run-id/-company-id
       stillschweigend rausgefiltert, obwohl Mira sie im content_html mitschickt. Jetzt erlaubt,
       plus eine Fallback-Kette (entity_id -> typspezifisches Feld -> Span-Attribut -> entity_key/
       url/domain), damit die id auch dann steht, wenn evidence_items nur eins davon fuellt.
       Payload-Form unveraendert.
     - Highlight-Settings-Panel (in der Previous-Chats-Sidebar) oeffnet/schliesst jetzt mit

     - Evidence-Hover-Tooltip ("Connected data points") nutzte window.RichTooltip -- das gab es im
       Code nirgends, zeigte also nie etwas an. Läuft jetzt auf core's UC.makeExplain, dem gleichen

     ============================================================ 
     ── DER RUN-JS-SCHRITT: EIN BACKTICK, KEIN OBJEKT (STYLEGUIDE §46) ────────────────────────
     NIEMALS ein JS-Objekt im Schritt von Hand bauen. Also NICHT so:

       askMiraSetMessages([{ id: <ausdruck>, name: <ausdruck> }])   FALSCH

     Ist einer der Ausdruecke leer, steht dort  name: ,  -- und das ist kein gueltiges JavaScript.
     Der Schritt scheitert dann beim PARSEN, bevor eine einzige Zeile laeuft: "Uncaught
     SyntaxError: Unexpected token ','". Kein Sanitizer und kein Code im Kit kann das abfangen,
     weil nichts davon zur Ausfuehrung kommt -- und weil der GANZE Schritt stirbt, gehen auch die
     Aufrufe DARUNTER mit. So gemeldet am 24.08. an brand-detail: die Komponente blieb im
     Ladezustand stehen, weil ein leerer _prev-Wert den Schritt getoetet hatte, ehe ihr Setter
     ueberhaupt an die Reihe kam.

     RICHTIG ist immer EIN Backtick mit dem ROHEN Text und die beiden Ersetzungen darauf. Im
     Backtick ist ein leeres Feld nur Text; die erste Ersetzung macht daraus null, die zweite
     quotiert Bubbles unquotiertes yes/no. BEIDE Zeilen sind Pflicht.

       (function () {
         var ROH = `[RPC-Ergebnis: id, role, text, created_at]`
           .replace(/:\s*([,}\]])/g, ": null$1")
           .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
         /* Jeder Aufruf in seinem EIGENEN try: ein kaputter oder fehlender Ausdruck darf die
            anderen nicht mitnehmen. Und window.<name> statt des nackten Namens -- haengt das
            Element noch an einem aelteren Pin, ist der Name schlicht undefined statt ein
            ReferenceError, der den ganzen Schritt mitnimmt. */
         try { if (window.askMiraSetMessages) window.askMiraSetMessages(ROH); } catch (e) {}
       })();

     Zahlen bleiben OHNE Anfuehrungszeichen -- 3.0, nicht "3.0" -- sonst kommt der Wert als Text
     an und jede Rechnung darauf geht daneben.

     Was bei einem unlesbaren Payload passiert: dieser Setter hat NOCH KEINEN Lesefehler-Zustand.
     Der Payload landet dann als leere Liste, und die Ansicht sieht aus wie ein sauberes leeres
     Ergebnis. Der Backtick ist hier also nicht eine von zwei Absicherungen, sondern die einzige.
     (Die 12 Komponenten mit render*-Einstieg haben den Zustand seit dem 24.08.; hier steht er
     noch offen.)

     askMiraSetPreviousChats, askMiraSetTopics, askMiraSetModels, askMiraSetCompanies und
     askMiraSetProjects tragen ebenfalls Listen -- je EIN eigener Backtick, je ein try.

     Die EINZIGE Zeichenfolge, die im Backtick selbst gefaehrlich bleibt, ist ein Backtick oder
     ein Dollar mit geschweifter Klammer in einem WERT. Beides kommt in Marken-, Domain- und
     Themennamen nicht vor; alles andere -- Anfuehrungszeichen, Apostrophe, Umlaute,
     Zeilenumbrueche, Emoji -- traegt er unbeschadet.
-->

<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to data-cdn-pin on the root div above.
   Same loader every other component in this repo ships. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      /* Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
         Waechter treffen -- der Vergleich waere dann pin === "<der Hash>" und der Loader liefe
         dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
      if (p && p !== "CDN_" + "PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("am-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL. Zwei Elemente mit verschiedenen data-cdn-pin
     ergeben zwei URLs fuer dieselbe Datei -- vorher lud der Loader dann beide: core.js lief
     zweimal, und core.css stand zweimal im Dokument, wobei die spaetere die fruehere ueberschrieb.
     Wer gewinnt, entschied die Reihenfolge, in der Bubble die Elemente baut.
     Der erste Pin gewinnt jetzt, und ein zweiter wird gemeldet -- sonst sucht man den Unterschied
     zwischen zwei Seiten, auf denen dieselbe Version verschiedene Dinge tut. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("ask-mira.css");
  js("core.js");   js("ask-mira.js");
  /* Der Topics-Picker in der Reporting-Leiste IST die geteilte topics-filter-Komponente. Mira hat
     sie eingehaengt, aber nie mitgeliefert -- sie stand nur da, wenn zufaellig ein anderes Element
     auf derselben Seite sie geladen hat. Wer eine Komponente einhaengt, liefert sie auch aus. */
  css("filters/topics-filter.css"); js("filters/topics-filter.js");
})();
</script>
