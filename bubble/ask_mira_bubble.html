<!-- ============================================================
     Upstreem — Ask Mira (the agent)
     Paste this whole block into a Bubble HTML element. The loader at the bottom pulls
     core.css/core.js + ask-mira.css/js from jsDelivr, pinned to the commit in data-cdn-pin.

     Ported from the standalone ask_mira.html. The LOGIC IS UNTOUCHED: every window.askMira*
     method, every bubble_fn_ask_mira_* call, every CustomEvent name and every payload key is
     byte-identical, so the existing Bubble workflows keep working without a single change.

     ── Bubble dynamic values on the root element ────────────────────────────────
     data-instance = "ROOTID_[dynamic id]"
     data-cdn-pin  = commit hash to load from. NEVER leave this empty: blank falls back to @main,
                     and jsDelivr caches branch URLs for days.
     data-isdark   = "yes" / "no"   (askMiraSetTheme("dark"|"light") also works)

     ── Bubble element height ────────────────────────────────────────────────────
     FIXED height. Mira is a full-height app surface with its own internal scrolling (the chat
     scrolls, the composer and hero stay put). Fit-to-content would put the page scroll and the
     chat scroll in the same place.

     ── Data in (unchanged from the standalone) ──────────────────────────────────
     askMiraSetMessages / askMiraAddMessage / askMiraExpectAnswer / askMiraTypeLastAnswer
     askMiraSetExtras / askMiraSetLoading / askMiraSetPreviousChats / askMiraSetProjects
     askMiraSetTopics / askMiraSetActiveChat / askMiraSetTitlePending / askMiraSetExportPending
     askMiraClearInput / askMiraSetTheme / askMiraSetMarket / askMiraSetSettings
     askMiraSetModels / askMiraSetFavicons / askMiraSetBrandLogos (alias askMiraSetCompanies)
     askMiraSetTool / askMiraGetState / askMiraOpportunityResult
     askMiraResolveVoice / askMiraRejectVoice / askMiraSetTranscript / askMiraVoiceCancel
     …plus every *FromEl variant and the auto-bind on #mira-*-data elements, all as before.

     Every one of these is stubbed and QUEUED before core.js finishes loading, then replayed in
     call order — new in this port, and the reason an early Bubble workflow no longer gets lost.

     ── Events to Bubble (all unchanged) ─────────────────────────────────────────
       bubble_fn_ask_mira_send                     bubble_fn_ask_mira_feedback
       bubble_fn_ask_mira_select_chat              bubble_fn_ask_mira_new_chat
       bubble_fn_ask_mira_settings_change          bubble_fn_ask_mira_suggested_question
       bubble_fn_ask_mira_open_evidence            bubble_fn_ask_mira_export_pdf
       bubble_fn_ask_mira_create_opportunity       bubble_fn_ask_mira_move_opportunity_status
       bubble_fn_ask_mira_opportunity_created      bubble_fn_miraAction  (or window.askMiraActionFn)
       bubble_fn_ask_mira_voice / _voice_start / _voice_cancel / _voice_error
       bubble_fn_ask_mira_rename_chat / _delete_chat / _pin_chat / _move_chat
       bubble_fn_ask_mira_create_project / _rename_project / _delete_project
     Each falls back to a window CustomEvent when the function is missing, exactly as before.
     ============================================================ -->

<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to data-cdn-pin on the root div above.
   Same loader every other component in this repo ships. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();

    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("am-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("ask-mira.css");
  js("core.js");   js("ask-mira.js");
})();
</script>
