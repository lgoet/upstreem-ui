<!--
  UPSTREEM — OPPORTUNITIES (Kanban board)

  A kanban board of AI-visibility opportunities: four status lanes (Pending / In Progress / Done /
  Ignored), a list alternative, and a right-hand detail drawer per card. Cards are dragged between
  lanes, or moved via the drawer's status switcher, or moved a whole lane at a time via the column
  kebab.

  Everything visual comes from core.css's shared kit (icon buttons, dropdowns, switches, the
  segmented control, topic chips, favicon boxes, tooltips, skeletons) — the board only adds the
  lane layout, the card, the potential bars and the drawer. Load core.css/core.js first; the loader
  at the bottom does that for you.

  The board scrolls with the PAGE, like every table in this app: the toolbar (heading, count,
  search, sort, view switch, settings) pins at data-sticky-top, and each lane's header pins right
  underneath it so the lane stays labelled on the way down. The element has no scrollbar of its own.

  The detail drawer is a PAGE-LEVEL drawer: on init the script moves the scrim and the panel out of
  this element and into <body>, so they span the full viewport height instead of just the board's
  own box (a Bubble group with a transform/blur on it would otherwise trap them inside the
  component). They sit at z-index 8000/8001 — above the page, deliberately below your own drawers
  and their backdrops. Nothing to configure; the element is cleaned up automatically when Bubble
  swaps this component out.

  If the headers do NOT pin on your page, run  opportunitiesDiagnoseSticky()  in the console. It
  reports the page width (pinning is off below 1000px app-wide), the two data-sticky* values, and
  every ancestor between this element and <html> that clips or establishes a containing block —
  which is what breaks position:sticky when it breaks.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin  = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the literal
                  "CDN_PIN" placeholder) to load @main. Point this at a Bubble constant/Option Set
                  field you control so every placement can be repinned in one edit.
  data-isdark   = "yes" / "no"
  data-sticky-top = how far below the viewport top the toolbar pins while you scroll, in px.
                  Set it to the height of whatever floating topbar sits above this component on the
                  page (the tables use 171 for the app's own topbar); 16 is the default here, which
                  suits a page where the board is the first thing under the page header. Pass "no"
                  in data-sticky to switch pinning off entirely.

  ── Events to Bubble ─────────────────────────────────────────────────────────
  Unlike the table components, this one does NOT read its function names off data-* attributes —
  it calls six fixed globals directly. Create these as Toolbox "JavaScript to Bubble" elements with
  exactly these names:

  | Action                       | Bubble function                            | Payload (ONE JSON string) |
  |------------------------------|--------------------------------------------|---------------------------|
  | Card moved (drag or drawer)  | bubble_fn_opportunity_change_status        | {"opportunity_id":"…","status":"In Progress","status_key":"in_progress","previous_status":"Created","previous_status_key":"pending"} |
  | Whole lane moved (kebab)     | bubble_fn_opportunity_move_all             | {"from_status_key":"pending","from_status":"Created","to_status_key":"done","to_status":"Done","status":"Done","opportunity_ids":["…","…"]} |
  | "Create this with AI"        | bubble_fn_opportunity_create_with_ai       | {"opportunity_id":"…"} |
  | Source link / Open-URL icon  | bubble_fn_opportunity_open_url             | {"opportunity_id":"…","lead_url":"https://…","lead_title":"…","lead_domain":"…"} |
  | Ignore icon in the drawer    | bubble_fn_opportunity_ignore               | {"opportunity_id":"…"} |
  | Mentioned-competitor click   | bubble_fn_opportunity_competitor_click     | {"opportunity_id":"…","competitor_name":"…","company_id":"…","favicon_url":"…"} |

  Regex for a Bubble "extract" step, same convention as every other component:
    (?<="opportunity_id":")[^"]*      (?<="status":")[^"]*        (?<="status_key":")[^"]*
    (?<="previous_status":")[^"]*     (?<="previous_status_key":")[^"]*
    (?<="from_status_key":")[^"]*     (?<="to_status_key":")[^"]*
    (?<="lead_url":")[^"]*            (?<="lead_title":")[^"]*    (?<="lead_domain":")[^"]*
    (?<="competitor_name":")[^"]*     (?<="company_id":")[^"]*
  opportunity_ids is a JSON ARRAY, not a comma string — extract it with (?<="opportunity_ids":\[)[^\]]*
  and split on "," , or handle the whole payload in a Backend Workflow instead.

  NOTE: the "Ignore" icon fires ignore AND then a normal change_status to "Ignored" — two events,
  by design, so a workflow can react to the explicit ignore separately from a plain lane move.

  IMPORTANT: the board mutates its own copy of the data the moment a card moves, so the UI never
  waits on a round trip. Your workflow only has to persist the change; do NOT push the whole list
  back in afterwards on every move, or the board will visibly re-render under the user.

  ── Filling the component ─────────────────────────────────────────────────────
  One Run-JS step per data load:

    window.opportunitiesSetItems(LIST);            // array (or a JSON string of one)
    window.opportunitiesSetLoading("yes"/"no");    // skeleton lanes on/off
    window.opportunitiesSetTheme("dark"/"light");  // optional, data-isdark also works
    window.opportunitiesSetMode("board"/"list");
    window.opportunitiesSetShowIgnored(true/false);
    window.opportunitiesSetVisibleBoards({pending:true,in_progress:true,done:true,ignored:false});
    window.opportunitiesOpenDetail("OPPORTUNITY_ID");
    window.opportunitiesCloseDetail();

  Until opportunitiesSetItems() is called the board shows skeleton lanes; after 12 seconds without
  data it falls back to the empty state so a broken RPC does not leave a shimmering board forever.

  One item looks like this (only id/headline are strictly required, everything else degrades):

    {
      "id": "opp_1",
      "label": "Create matching content",
      "recommendation_type": "create_matching_content",   // also: build_presence | get_listed | improve_existing_content
      "headline": "Reddit thread ranks for 'beste CRM Software' but you're absent",
      "reason": "Competitors are mentioned 4x in this thread while your brand never appears.",
      "status": "Created",                    // Created | In Progress | Done | Ignored
      "priority_label": "High",               // High | Medium | Low  (drives the potential bars)
      "priority_score": 88,                   // fallback when priority_label is missing
      "created_at": "2026-08-01T10:00:00Z",
      "lead_title": "Welches CRM nutzt ihr 2026?",
      "lead_domain": "reddit.com",
      "lead_favicon": "https://www.google.com/s2/favicons?domain=reddit.com&sz=64",
      "lead_url": "https://reddit.com/…",
      "effective_citation_type": "UGC_Community",  // Editorial | UGC_Community | Knowledge_Base |
                                                   // Brand_Platform | Institutional | Competition | You
      "market": "DE",
      "source_scope": "external_only",        // only this value passes the "External only" filter
      "competitor_count": 7,
      "global_share_pct": 12.4,
      "trend_pct": -2.1,
      "gap": -18.3,
      "your_conversion": 8.2,
      "avg_competitor_conversion": 24.5,
      "supporting_urls_count": 3,
      "topics": [ {"name":"CRM","emoji":"💼","hex_light":"#1860dc"} ],
      "mentioned_competitors": [ {"name":"HubSpot","company_id":"c1","favicon_url":"https://…"} ]
    }

  A card whose effective_citation_type is "UGC_Community" hides the "Create this with AI" button —
  you cannot publish into someone else's forum thread, so the action would be a dead end.

     ── DER RUN-JS-SCHRITT: EIN BACKTICK, KEIN OBJEKT (STYLEGUIDE §46) ────────────────────────
     NIEMALS ein JS-Objekt im Schritt von Hand bauen. Also NICHT so:

       opportunitiesSetItems([{ id: <ausdruck>, name: <ausdruck> }])   FALSCH

     Ist einer der Ausdruecke leer, steht dort  name: ,  -- und das ist kein gueltiges JavaScript.
     Der Schritt scheitert dann beim PARSEN, bevor eine einzige Zeile laeuft: "Uncaught
     SyntaxError: Unexpected token ','". Kein Sanitizer und kein Code im Kit kann das abfangen,
     weil nichts davon zur Ausfuehrung kommt -- und weil der GANZE Schritt stirbt, gehen auch die
     Aufrufe DARUNTER mit. So gemeldet am 24.08. an brand-detail: die Komponente blieb im
     Ladezustand stehen, weil ein leerer _prev-Wert den Schritt getoetet hatte, ehe ihr Setter
     ueberhaupt an die Reihe kam.

     RICHTIG ist immer EIN Backtick mit dem ROHEN Text und die beiden Ersetzungen darauf. Im
     Backtick ist ein leeres Feld nur Text; die erste Ersetzung macht daraus null, die zweite
     quotiert Bubbles unquotiertes yes/no. BEIDE Zeilen sind Pflicht.

       (function () {
         var ROH = `[RPC-Ergebnis: id, title, board, score, ...]`
           .replace(/:\s*([,}\]])/g, ": null$1")
           .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
         /* Jeder Aufruf in seinem EIGENEN try: ein kaputter oder fehlender Ausdruck darf die
            anderen nicht mitnehmen. Und window.<name> statt des nackten Namens -- haengt das
            Element noch an einem aelteren Pin, ist der Name schlicht undefined statt ein
            ReferenceError, der den ganzen Schritt mitnimmt. */
         try { if (window.opportunitiesSetItems) window.opportunitiesSetItems(ROH); } catch (e) {}
       })();

     Zahlen bleiben OHNE Anfuehrungszeichen -- 3.0, nicht "3.0" -- sonst kommt der Wert als Text
     an und jede Rechnung darauf geht daneben.

     Was bei einem unlesbaren Payload passiert: dieser Setter hat NOCH KEINEN Lesefehler-Zustand.
     Der Payload landet dann als leere Liste, und die Ansicht sieht aus wie ein sauberes leeres
     Ergebnis. Der Backtick ist hier also nicht eine von zwei Absicherungen, sondern die einzige.
     (Die 12 Komponenten mit render*-Einstieg haben den Zustand seit dem 24.08.; hier steht er
     noch offen.)

     opportunitiesSetLoading, -Mode, -Theme und -ShowIgnored nehmen einfache Werte und brauchen
     keinen Backtick.

     Die EINZIGE Zeichenfolge, die im Backtick selbst gefaehrlich bleibt, ist ein Backtick oder
     ein Dollar mit geschweifter Klammer in einem WERT. Beides kommt in Marken-, Domain- und
     Themennamen nicht vor; alles andere -- Anfuehrungszeichen, Apostrophe, Umlaute,
     Zeilenumbrueche, Emoji -- traegt er unbeschadet.
-->

<div class="up-root uo-root"

<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). Byte-for-byte the same loader every other component in this repo ships —
   see prompts_table_bubble.html's own copy for the full reasoning in comments. */
(function(){
  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       jsDelivr antwortet mit 404, und weder CSS noch JS landen. Ohne trim greift auch kein
       Rueckfall, weil "   " truthy ist.
       Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
       Waechter treffen, und der Loader liefe dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* ---- Rueckfall: einen Pin nehmen, der auf DIESER Seite schon gilt ----------------------
       Gemeldet am 31.08. mit drei Stapelspuren, alle aus einem solchen Loader: "core.css ist
       schon von einem anderen Pin geladen ... ignoriert wird @main" -- obwohl der Pin am Element
       stand. Der Grund ist die Reihenfolge: Bubble baut ein Element bei jedem Rerender neu und
       fuehrt Scripts nicht in DOM-Reihenfolge aus, dieser Loader lief also, waehrend seine eigene
       Wurzel noch nicht im Dokument stand -- die Klasse oben fand nichts.
       Und das war mehr als eine Warnung: core kam durch die Entdoppelung unten noch aus dem Pin,
       die Dateien DIESER Komponente aber tatsaechlich von @main. Eine Seite, die zur Haelfte auf
       @main laeuft, ist genau das, was ein Pin verhindern soll.
       Geraten wird nichts: jede der drei Stufen liest einen Pin, der auf dieser Seite schon in
       Gebrauch ist. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* Aus einer schon geladenen Datei ablesen. Diese Stufe greift auch dann, wenn alle anderen
       Elemente der Seite noch die ALTE Fassung dieses Loaders tragen -- die fuellen
       __upAssetsLoaded genauso. "main" wird NICHT gemerkt: das ist kein Pin, und die naechste
       Komponente wuerde ihn sonst fuer einen halten. */
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("uo-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL. Zwei Elemente mit verschiedenen data-cdn-pin
     ergeben zwei URLs fuer dieselbe Datei -- vorher lud der Loader dann beide: core.js lief
     zweimal, und core.css stand zweimal im Dokument, wobei die spaetere die fruehere ueberschrieb.
     Wer gewinnt, entschied die Reihenfolge, in der Bubble die Elemente baut.
     Der erste Pin gewinnt jetzt, und ein zweiter wird gemeldet -- sonst sucht man den Unterschied
     zwischen zwei Seiten, auf denen dieselbe Version verschiedene Dinge tut. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("opportunities.css");
  js("core.js"); js("opportunities.js");
})();
</script>
