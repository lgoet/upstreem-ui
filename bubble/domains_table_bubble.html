<!--
  UPSTREEM — DOMAINS TABLE

  Table only, mirrors the URLs table's structure/architecture with domains-table's own
  columns and events (see below — these are UNCHANGED from the pre-migration component and
  are wired into live Bubble workflows; do not rename).

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance        = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin         = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the
                         literal "CDN_PIN" placeholder) to load @main. Point this at a Bubble
                         constant/Option Set field you control so every placement can be repinned
                         to a new commit in one edit instead of hunting down every embed's URL by
                         hand — @main itself lags jsDelivr's cache, sometimes for hours, so a fresh
                         fix may not actually be live yet even right after it's pushed. The loader
                         script at the bottom reads this once and builds every asset URL from it.
  data-isdark          = "yes" / "no"
  data-brand-name      = the brand's display name (for the "X mentioned" toggle)
  data-brand-logo      = the brand's logo url (optional)
  data-export-instance = the instanceId of the EXPORT POPUP component you place on
                         the same page (e.g. "export_citations"). Clicking Export here
                         calls window.upstreemExportOpen(thatId) — see "Export" below.
  data-sticky-top      = px offset from the top at which the sticky header pins
                         (= height of your page's topbar, e.g. "171"). Desktop only
                         (>=1000px page width). Set "no" on data-sticky to disable.

  ── Event names must be unique per placement ─────────────────────────────────
  data-search-fn="bubble_fn_udtSearch_[dynamic id]"
  data-sort-fn="bubble_fn_udtSort_[dynamic id]"
  data-filter-fn="bubble_fn_udtFilter_[dynamic id]"
  data-brand-fn="bubble_fn_udtBrand_[dynamic id]"
  data-rowclick-fn="bubble_fn_udtRowClick_[dynamic id]"
  data-showpages-fn="bubble_fn_udtShowPages_[dynamic id]"   drilldown: asks for a domain's URLs
  data-openurl-fn="bubble_fn_udtOpenUrl_[dynamic id]"       drilldown: a page row was clicked
  data-page-fn="bubble_fn_udtPage_[dynamic id]"
  data-mentioned-fn="bubble_fn_udtMentioned_[dynamic id]"

  Every one fires ONE JSON string (same shape as Mira's miraAction and the export
  popup), values pulled out on the Bubble side by regex. All of them are SERVER-side:
  they tell Bubble to re-run the RPC — this component never filters or sorts locally.

    search   {"query":"nike","query_folded":"nike","query_de":"nike","requestId":"udt_…"}
    sort     {"order":"share_desc","sort_field":"share","sort_dir":"desc"}
    filter   {"citation_types":"Editorial,Competition"}    -- single dimension, no url_types
    brand    {"brand_mentioned":"yes"}          "yes" | "no" | ""  (empty = off)
    rowclick {"domain":"youtube.com"}                       -- key is "domain", not "url"
    page      {"limit":25,"offset":50,"page":3}   -> p_limit / p_offset in your RPC
    mentioned {"brands":"id1,id2"}                -> multi-brand mention filter
    showpages {"domain":"carwow.de","query":"","url_types":"","page":1,"page_size":10,
               "offset":0,"request_id":3}
              -> the drilldown needs data for this exact combination; answer it with
                 setDomainsTablePages (see "Drilldown" below). Fires on open AND again on every
                 later search / type-filter / page / page-size change inside the drilldown —
                 it is the ONLY event the drilldown has, deliberately: everything it asks for
                 (query, url_types, page, page_size) has to travel together anyway, since your
                 RPC needs all four to know what to return, so one event carrying all four is
                 simpler to wire than four separate ones that would each still need the other
                 three tagging along.
    openurl   {"url":"https://…","domain":"carwow.de"}  -> a page inside an expanded row was clicked

  ANY of the outer-table events above (search, sort, filter, brand, page, mentioned) — or a
  render call you push in from OUTSIDE this component's own UI — closes an open drilldown first.
  There is no separate "drilldown closed" event for this; it is silent on your side.

  ORDER tokens (in the sort event's "order" key) — note last_used_*, not last_seen_*:
    share_desc | share_asc | share_delta_desc | share_delta_asc | last_used_desc | last_used_asc

  Regex, as everywhere else:
    (?<="query":")[^"]*        (?<="query_folded":")[^"]*   (?<="query_de":")[^"]*
    (?<="requestId":")[^"]*    (?<="sort_field":")[^"]*     (?<="sort_dir":")[^"]*
    (?<="citation_types":")[^"]*
    (?<="brand_mentioned":")[^"]*                           (?<="brands":")[^"]*
    (?<="domain":")[^"]*     (?<="url":")[^"]*
    (?<="limit":)[0-9]+        (?<="offset":)[0-9]+         (?<="page":)[0-9]+
    -- showpages-specific (its "query"/"page"/"offset" keys are the SAME regex as the ones
       above — "offset" is (page-1)*page_size, already computed for you, same field your RPC
       already reads as p_offset off the outer table's own page event):
    (?<="url_types":")[^"]*     (?<="page_size":)[0-9]+      (?<="request_id":)[0-9]+

  ── Export ───────────────────────────────────────────────────────────────────
  Place the export popup component anywhere on the same page and give it an
  instanceId, e.g. "export_citations". Put that same string in data-export-instance
  here. The Export button then just calls upstreemExportOpen() on it — no second
  popup, no duplicated markup. If the id doesn't match anything, the button logs a
  warning naming the id it looked for rather than doing nothing silently.

  ── Filling the table ────────────────────────────────────────────────────────
  window.renderDomainsTable({ instanceId: "...", rows: [...], totalCount: 123 });
  window.setDomainsTableLoading("INSTANCE_ID", "yes" | "no");
  window.setDomainsTableBrands("INSTANCE_ID", [...]);
  window.resetDomainsTable("INSTANCE_ID");
  window.setDomainsTablePages("INSTANCE_ID", "carwow.de", [ … ]);   // drilldown, see below
  window.setDomainsTablePages("INSTANCE_ID", "carwow.de", [ … ], 3);  // …with the optional
                                                                       // request_id echoed back

  ── Drilldown: the pages of one domain ───────────────────────────────────────
  "N pages" in the domain cell is a button; hovering a row for ~1.5s also fades/slides its go-to
  arrow into an explicit "Show Pages" control, wired to the exact same click. Either one expands the row and
  lists the domain's pages underneath as a real, independently paginated mini table: its own
  search, its own URL-type filter, its own pager, its own column headers. Exactly ONE domain is
  expanded at a time — opening a second one closes the first (see below for what closing does).

  This is now GENUINELY paginated, not "fetch everything once and page through it locally": the
  drilldown never holds more than the current page, and your RPC needs to return exactly the
  slice showpages asked for. The upside is it scales to a domain with thousands of pages the same
  way the outer table scales to thousands of domains; the cost is that opening the drilldown,
  paging inside it, searching inside it, or changing its type filter ALL round-trip to Bubble —
  there is no "already loaded, just re-filter" shortcut any more.

  The flow, all of it driven by the two events documented above:
    1. Something inside the drilldown needs data (opening it, a search debounce elapsing, a type
       toggled, a page or page-size clicked) -> the ROW LIST shows a skeleton (5 rows) while its
       toolbar (search box, type filter, the X that closes the drilldown) stays fully live and
       interactive throughout — you can keep typing in the search field while a previous
       keystroke's request is still in flight.
    2. The component fires  showpages  {"domain":"carwow.de","query":"","url_types":"",
       "page":1,"page_size":10,"request_id":1}. Pull each field out with the regexes above.
       query/url_types are empty strings on the very first open; url_types is a comma-joined list
       of the SAME keys used everywhere else (see below), empty meaning "all types".
    3. Your workflow runs the URLs-for-this-domain RPC with those exact filters/page/page_size,
       then a Run-JS step:

         window.setDomainsTablePages("INSTANCE_ID", "[domain]", `[RPC_RESPONSE]`, [request_id]);

       The third argument takes the raw RPC text OR a ready array — it goes through
       UpstreemCore.parseBubbleJson, same as setDomainsTableBrands, so no Bubble-side parsing.
       An EMPTY array is a valid answer and renders "No pages found for this domain" (or "No
       pages match those filters", if query/url_types were non-empty) instead of leaving the
       skeleton spinning forever.
       The fourth argument (request_id) is OPTIONAL — echo back the request_id the showpages
       payload carried and a response that arrives after a newer request already fired gets
       dropped instead of briefly flashing stale rows over the current search/filter/page; omit
       it and every response is accepted as-is, same as before this round.
    4. Clicking one of those page rows fires  openurl  {"url":"…","domain":"…"}.
       Pull the url out with:   (?<="url":")[^"]*

  Page fields (straight from the RPC):
    url, title, domain_share, url_type, last_seen, total_count   — rendered
    description, first_seen                                      — accepted, not shown

  total_count is new and REQUIRED for pagination to work: put the grand total for the current
  domain+query+url_types combination (not just the page size) on every single row in the array —
  the component reads it off the first row of whatever you send back. Missing it doesn't break
  anything visually (the footer falls back to the row count you actually sent), it just means the
  page numbers/"1–10 of N" can undercount whenever a domain has more pages than fit on one screen.

  url_type takes the SAME keys as the URL types everywhere else in the app (article, guide,
  review, comparison, homepage, product_service, marketplace, company_info, listicle,
  documentation, forum, directory, video, social_post). A null/empty value renders as a grey
  "Uncategorized" chip — same convention as everywhere else that chip appears — never a blank
  cell. A non-empty value that just doesn't match one of those keys still renders as its own raw
  text: that's a real (if unmapped) type, not an absent one, so a new type on your side never
  breaks the table, it just shows up uncoloured until it's added to the shared list.

  The drilldown's type-filter DROPDOWN always lists all 14 keys, regardless of what happens to be
  on the currently-loaded page — with server-side paging this view never holds the full list for
  a domain, so deriving "which types exist" from what's loaded would silently hide options that
  are one page away.

  Note on domain_share: this is the URL's share WITHIN its domain, not the global share the
  parent row shows — the two numbers answer different questions and are deliberately not mixed,
  which is also why the drilldown's column is headed "Domain Share" and not "Global Share".
  A missing domain_share renders as a bare dash, not "–%".

  What the drilldown gives the user:
    · a search field over page title and URL (server-side now — see the flow above)
    · a URL-type filter, all 14 types always offered
    · an X button next to the search field that closes the whole drilldown
    · pagination, 10 or 25 rows per page
    · column headers, and the full title on hover whenever it is clipped

  Closing (the row's own toggle, the drilldown's own X, OR any outer-table action per the note
  above) is instant client-side state — it fires no event and costs no RPC. Re-opening a domain
  you closed earlier is a fresh fetch, same as any other page-1/no-filters request; there is no
  cache to reuse any more (see "genuinely paginated" above). Nothing about the drilldown is
  persisted across a reload, because restoring an expansion over a different result set would
  show one domain's pages under another domain's row.

  Row fields (straight from your RPC, no renaming needed):
    domain, favicon, share_pct, share_delta_pct, urls_count, last_used_at, citation_type,
    runs_with_domain
  "Used" reads runs_with_domain (falling back to used_total / used / total_used) —
  NOT total_count, which is the same grand total on every row.
-->
<div class="up-root udt-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-brand-name="BRAND_NAME"
     data-brand-logo="BRAND_LOGO"
     data-export-instance="EXPORT_INSTANCE_ID"
     data-sticky-top="171"
     data-search-fn="bubble_fn_udtSearch"
     data-sort-fn="bubble_fn_udtSort"
     data-filter-fn="bubble_fn_udtFilter"
     data-brand-fn="bubble_fn_udtBrand"
     data-rowclick-fn="bubble_fn_udtRowClick"
     data-showpages-fn="bubble_fn_udtShowPages"
     data-openurl-fn="bubble_fn_udtOpenUrl"
     data-page-fn="bubble_fn_udtPage"
     data-mentioned-fn="bubble_fn_udtMentioned">

  <div class="up-head">

      <div class="up-ment">

      <div class="up-filter">

          <span class="up-filter-btn-lbl">All Types</span>
          <svg class="up-filter-btn-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          <svg class="up-filter-btn-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 7.5L16.5 4.5L19.5 7.5"/><path d="M16.5 19.5V4.5"/><path d="M10.5 16.5L7.5 19.5L4.5 16.5"/><path d="M7.5 4.5V19.5"/></svg>

      <div class="up-search">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

  <div class="up-box">
    <div class="up-table">
      <div class="up-thead">

        <div class="up-th up-th-type">Type<span class="up-th-info" data-explain="type"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span></div>
        <div class="up-th up-th-lastseen is-sortable" data-sortcol="last_seen">
          <span class="up-th-txt">Last Seen</span>
          <span class="up-thsort" data-for="last_seen">
            <svg class="up-thsort-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
            <svg class="up-thsort-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
        <div class="up-th udt-th-actions">Actions</div>
      </div>
      <div class="up-tbody"></div>
    </div>
  </div>

  <div class="up-foot">
    <div class="up-pagesize">
      <span class="up-pagesize-lbl">Rows per page</span>
      <div class="up-pagesize-seg" role="group" aria-label="Rows per page"></div>
    </div>
    <div class="up-pager"></div>
  </div>
</div>
<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). The pin is found by looking the root element up BY CLASS — deliberately
   NOT via document.currentScript, because Bubble injects an HTML element's inline scripts in a way
   that leaves document.currentScript null/misattached. That made the previous loader read no pin
   and silently fall back to @main for every file (and jsDelivr caches @main for hours, so it served
   stale code) — which is why setting data-cdn-pin appeared to do nothing. Loading core.js once per
   component is fine: the browser caches the (immutable, commit-pinned) URL, and the component's own
   init is idempotent. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("udt-root") + "/";
  /* Bubble re-injects this whole block (this script tag included) every time the reusable this
     component sits in re-renders — i.e. on every drawer/view open. Without this guard each of
     those re-runs appended ANOTHER <link> + <script> for the SAME urls, forever: 4 more tags per
     render, never cleaned up (measured: 14 tags after one page build, 64 after ~25 navigations).
     Inserting a stylesheet <link> is render-blocking, so that landed right in the middle of the
     open animation — which is what made drawers/views "pop" in instead of animating.
     The registry lives on window, not in this closure, because every component ships its own copy
     of this loader. Skipping the re-run is safe: a re-rendered root is picked up and initialised
     by core.js's own root observer + 1.5s heartbeat, it does not need the scripts evaluated
     again (verified against a root injected with the scripts deliberately run only once). */
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("domains-table.css");
  js("core.js"); js("domains-table.js");
})();
</script>
