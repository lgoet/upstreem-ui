<!--
  UPSTREEM — RESPONSE DETAIL (Praefix urd)

  WOHIN: ein HTML-Element auf der Response-Detailseite. Das Element ist LEER bis auf das
  Wurzel-Div; die Komponente baut ihren gesamten Innenaufbau selbst.

  ERSETZT die drei alten Full-Response-Elemente (zenith-response-v4 fuer ChatGPT, zenith-aio-v1
  fuer Google AIO, zenith-response-v3 fuer Perplexity). EIN Element fuer alle drei Modelle: die
  Unterschiede sind genau drei Zitatschreibweisen, und die erkennt core am Text. Ein viertes
  Modell braucht kein viertes Element.

  ── Die Abschnitte (v2, 05.10.) ──────────────────────────────────────────────
  1. Kopf: der Prompt-Text als Titel, VOLLSTAENDIG (nie gekuerzt). Darunter Modell und Laufzeit
     links, Market und Themen rechts, und die Zeile "Mentioned" mit den Marken ("+N more").
  2. "Products": die Shopping-Produkte DIESER Antwort als Karten, in ihrer Reihenfolge. Nur wenn
     die Antwort welche hat (shopping_products, get_mention_detail_v8) -- sonst fehlt der Abschnitt.
  2b. "Ads" (06.10.): die Anzeigen DIESER Antwort als Ad-Karten (dieselbe Karte wie im Ads-Bereich),
     unter Products, ueber Full Response. Nur wenn die Antwort welche hat (Feld ads am Eintrag,
     get_mention_detail_v8 -- DB-Auftrag bubble/db_auftrag_response_ads.md) -- sonst fehlt der
     Abschnitt. Beim Laden drei Skelettkarten (Handoff).
  3. "Full Response": der Antworttext mit Tabellen, nummerierten Zitat-Chips, Markenauszeichnung
     und den Produkten im Text (gepunktet unterstrichen, mit ihrer Karte verbunden).
  4. "Citations": die Quellen, nummeriert (dieselbe Zahl wie am Zitat im Text), umschaltbar
     zwischen Kacheln (Standard) und Liste.

  ── Attribute am Wurzel-Div ──────────────────────────────────────────────────
  | Attribut        | Pflicht | Bedeutung                                                  |
  |-----------------|---------|------------------------------------------------------------|
  | data-instance   | JA      | eindeutig je Platzierung; die Setter sprechen sie darueber an |
  | data-cdn-pin    | JA      | derselbe Commit-Hash wie auf allen anderen Elementen der Seite |
  | data-isdark     | nein    | "yes"/"no". Kennt core ein Thema, gewinnt core (UC.themeParam) |
  | data-prompt-fn  | nein    | Toolbox-Funktion fuer den Klick auf den Prompt-Titel        |
  | data-brand-fn   | nein    | Toolbox-Funktion fuer den Klick auf eine Marke              |
  | data-url-fn     | nein    | Toolbox-Funktion fuer den Klick auf eine Quelle             |
  | data-view-fn    | nein    | Toolbox-Funktion fuer den Wechsel Kacheln/Liste             |
  | data-domain-fn  | nein    | Toolbox-Funktion fuer den Klick auf eine Domain             |
  | data-product-fn | nein    | Toolbox-Funktion fuer den Klick auf eine Produktkarte (siehe urdProduct) |
  | data-topbar     | nein    | Instanz der drawer-topbar, die diese Komponente fuellt. Ohne: die im selben Drawer |

  ── DRAWER OEFFNEN SICH SELBST (05.10.) ──────────────────────────────────────
  urdPrompt, urdBrand, urdUrl und urdDomain sind nicht mehr noetig: ohne Empfaenger oeffnet die
  Komponente den Drawer selbst (openDrawer wie die Host-App, die meldet das an
  bubble_fn_drawer_<art>). Kennungen: prompt = prompt_id, brand = company_id, url = Adresse,
  domain = Name. Steht ein JavaScriptToBubble-Element fuer eines davon noch auf der Seite,
  gewinnt es -- sonst ginge der Drawer zweimal auf. Zum Umstellen die vier Elemente und ihre
  Workflows loeschen. urdView bleibt optional wie bisher.

  ── Die Ereignisse und ihre Werte ────────────────────────────────────────────
  Die ersten drei tragen einen BLANKEN Wert, kein JSON -- Bubble liest sie ohne Umweg:

  | Ereignis   | ausgeloest durch                          | Wert                            |
  |------------|-------------------------------------------|---------------------------------|
  | urdPrompt  | Klick auf den Prompt-Titel                | prompt_id                       |
  | urdBrand   | Klick auf einen Marken-Chip (Mentions ODER die Auszeichnung im Antworttext) | company_id |
  | urdUrl     | Klick auf eine Quelle (Kachel, Zeile) ODER "Open detail page" im Menue eines Zitat-Chips | citations[].id -- und wenn die RPC keine id liefert, die URL |
  | urdView    | Umschalter Kacheln/Liste                  | "grid" oder "list", roh         |
  | urdDomain  | Klick auf die Domain einer Quelle (Kachel oder Zeile) | die Domain als Text  |
  | urdProduct | Klick auf eine Produktkarte, NUR wenn ein Empfaenger verdrahtet ist ODER kein Shopping-Element auf der Seite steht | source_product_id, roh |
  | urdAd      | Klick auf eine Ad-Karte, NUR wenn ein Empfaenger verdrahtet ist ODER kein Ads-Element auf der Seite steht | die id der Ad, roh |

  urdProduct braucht KEINEN Workflow: ohne Empfaenger oeffnet der Klick das Produkt selbst -- der
  Drawer geht zu, die Seitenleiste wechselt auf Shopping (usnNav wie ein Klick dort), und das
  Shopping-Element zeigt das Product Detail. Wer etwas anderes will, legt ein JavaScriptToBubble
  "urdProduct" an; dann entscheidet der Workflow.

  urdAd ebenso (06.10.): ohne Empfaenger geht der Drawer zu, die Seitenleiste wechselt auf Ads,
  und der Ad-Drawer des Ads-Elements zeigt genau diese Anzeige (ohne neuen Abruf). Wer etwas anderes
  will (z. B. die Ad Library), legt ein JavaScriptToBubble "urdAd" an und data-ad-fn.

  urdView ist der EINZIGE dieser Auslöser, der optional ist. Die Komponente merkt sich die
  Wahl Kacheln/Liste ohnehin selbst (UC.prefSet), Bubble braucht davon nichts zu wissen.
  Wer das Ereignis nicht will, laesst data-view-fn am Element einfach weg -- dann feuert
  nichts. Steht der Name dort, muss es das JavaScriptToBubble-Element auch geben, sonst
  meldet die Konsole "bubble_fn_urdView not found ... this action reached no Bubble
  workflow". Kaputt ist dann optisch nichts, die Meldung ist aber berechtigt.
  (Hier stand bis zum 20.09. { view: "grid" } -- eine Huelle um einen einzigen Wert, die in
  Bubble eine Extraktion kostete, die nichts extrahiert. Die JS gibt den Wert seither roh.)

  Die Domain ist ein EIGENES Ziel: sie fuehrt zur Domain-Detailseite, die Kachel zur URL. Ein Klick
  auf die Domain feuert deshalb nur urdDomain und laeuft nicht bis zur Kachel durch.

  WICHTIG zu urdUrl: in den drei Beispiel-Payloads tragen die Eintraege in citations KEIN Feld
  id. Solange das so ist, kommt die URL als Wert -- sonst waere der Klick wirkungslos. Der
  Workflow muss die Zeile also ueber die URL finden. Liefert die RPC eine id mit, gewinnt sie
  automatisch und es ist nichts umzustellen.

  ── Die drei Setter ──────────────────────────────────────────────────────────
    setResponseDetail("<instance>", <json>, <fehler>)  alles: Prompt, Modell, Marken, Produkte,
                                                     Text, Quellen. <fehler> = Bubbles "error body"
                                                     (optional, zaehlt nur ohne lesbare Antwort)
    setResponseDetailFrom("<instance>", "<selektor>")  dasselbe, aber der Payload wird aus dem
                                                     Inhalt eines DOM-Elements gelesen
    setResponseDetailLoading("<instance>", "yes")    Skelette an
    resetResponseDetail("<instance>")                alles leer, zurueck auf Kacheln

  Der Payload ist seit get_mention_detail_v8 EIN OBJEKT (das Feld json des Umschlags); die Liste
  aus v7 mit einem Eintrag geht weiter, ebenso der ganze Umschlag {"json": "..."}. Gelesen wird
  mit UC.readBubble; source_product_id bleibt Text, auch ueber 2^53.
  Fehler der RPC (dritter Wert): mention_not_found -> "This response could not be found.",
  team_access_* / forbidden -> "Your team doesn't have access right now.", alles andere -> "This
  response could not be loaded. Please try again." Ein Payload, den core nicht lesen kann, endet als benannter Fehler in den
  Abschnitten, nicht als endloses Skelett. Bleibt der Setter 25 Sekunden aus, steht "No data" da
  und der Grund in der Konsole.

  ── Themenfarben ─────────────────────────────────────────────────────────────
  tags[] traegt hex_light und hex_dark. Beide werden benutzt: hex_light im hellen, hex_dark im
  dunklen Thema. Fehlt eines, gilt das andere; fehlen beide, wird im Themen-Store nachgeschlagen
  (setUpstreemTopics), und erst dann bleibt der Chip grau.

  ── Der Marken-Filter bei den Citations ──────────────────────────────────────
  Links neben dem Grid/List-Umschalter steht ein dreistufiger Schalter
  "<Marke> mentioned?" (aus -> ja -> nein -> aus). Er filtert AUSSCHLIESSLICH clientseitig, in den
  Daten, die schon da sind: kein zweiter Aufruf, kein Ereignis nach Bubble, kein Attribut.
  Er erscheint nur, wenn er etwas aendern kann -- also wenn mindestens eine, aber nicht jede
  Quelle die eigene Marke nennt. Bei 0 Treffern oder bei 100 Prozent bleibt er weg, weil ein
  Filter, der nichts aendert, ein toter Knopf ist.
  Name und Logo kommen aus der ersten Erwaehnung mit role "own" (Rueckfall fuer den Namen:
  data-brand am Element). Liefert die RPC diese Rolle nicht, gibt es den Schalter nicht.

  ── Die Einstellungen der Hervorhebungen ─────────────────────────────────────
  Ein Menue am Kopf der Antwort, gespeichert im localStorage (teambezogen ueber UC.prefKey):
    Marken   All mentions | First mention only (Standard) | Your brand only | Off
    Quellen  Zitat-Chips an/aus (Standard an), benachbarte Quellen gruppieren (Standard AN)
  "Your brand only" braucht die Rolle, und die steht NUR an den Erwaehnungen der Zitationen
  (citations[].mentions[].role === "own"). Liefert die RPC sie nicht, zeigt der Modus alle Marken
  statt stumm keine.

  ── Was die Seite ausserdem braucht ──────────────────────────────────────────
  Der Modell-Chip holt Logo und Anzeigename aus dem seitenweiten Modell-Store -- er braucht keine
  eigenen Daten. Laeuft setUpstreemModels irgendwo auf der Seite, ist nichts zu tun; der Block im
  Run-JS-Schritt ist nur fuer Seiten, auf denen der Store sonst leer bleibt, und kann ERSATZLOS
  geloescht werden -- der Aufruf im Schritt prueft mit typeof:

      if (typeof MODELLE !== "undefined" && typeof window.setUpstreemModels === "function") {
        window.setUpstreemModels(JSON.stringify(MODELLE));
      }

  typeof und nicht die Variable selbst: bei geloeschter Deklaration wirft jede andere Form
  "MODELLE is not defined" und reisst den ganzen Schritt mit -- dann laedt NICHTS mehr.

      setUpstreemModels(<json-liste>)     [{ key, display_name, short_name, logo_url }, ...]

  Die REIHENFOLGE ist gleichgueltig: die Komponente haengt an UC.onModels und holt Logo und Namen
  nach, sobald der Store gefuellt wird. Vorher blieb bei "erst Daten, dann Modelle" der rohe
  Schluessel stehen -- gemessen: ohne Store "google-aio" ohne Logo, nach dem Store
  "Google AI Overviews" mit Logo, ohne dass die Antwortdaten erneut geschickt wurden.
  Der Schluessel wird nachsichtig verglichen (google-aio und google_aio sind dasselbe).

  Der Market-Chip holt die Flagge aus dem Markt-Store (setUpstreemAllMarkets); fehlt er, faellt
  er auf flagcdn.com anhand des Laendercodes zurueck -- die Flagge stimmt dann, nur nicht das
  eigene Bild.

  ── Sanitizer (STYLEGUIDE §46) ───────────────────────────────────────────────
  Ein Bubble-Ausdruck liefert leere Werte als "key": , und Ja/Nein unquotiert. Beides bricht
  JSON.parse. Diese zwei Zeilen gehoeren an JEDEN Aufruf, der einen Bubble-Text weitergibt:

      .replace(/:\s*([,}\]])/g, ": null$1")
      .replace(/:\s*(yes|no)\s*([,}\]])/g, function(_, v, t){ return ": " + (v === "yes") + t; })

  Beides muss NICHT von Hand geschrieben werden: core.parseLoose macht es selbst, und es macht
  mehr als das. Es reparariert auch, was ein Template-Literal am Payload beschaedigt: verlorene
  \n als echte Zeilenumbrueche, verlorene \" als nackte Anfuehrungszeichen, verlorene Backslashes.
  Der Payload gehoert also in BACKTICKS, wie in jeder anderen Komponente:

      window.setResponseDetail(INSTANCE_ID, `<Bubble-Ausdruck: die GANZE RPC-Antwort>`);

  Kein :formatted as JSON-safe, kein String.raw. Gemessen mit einem absichtlich beschaedigten
  Payload (34 echte Zeilenumbrueche, nackte Anfuehrungszeichen in zwei Beschreibungen, strikt NICHT
  parsebar): 0 Fehler, 0 Warnungen, Prompt da, 10 Absaetze, 4 Zitat-Gruppen, 12 Kacheln,
  2 Mentions, Antworttext vollstaendig bei 3789 Zeichen.

  Eine Stelle im Sanitizer war dafuer zu erweitern: er hielt ein : nach einem Anfuehrungszeichen
  auch im WERT-Kontext fuer ein String-Ende. An dieser echten Beschreibung brach er deshalb:
      "... — title: \"LeeUP Media ...\" meta: \"og:title\": \"LeeUP Media ...\""
  Ein JSON-WERT wird nie von : gefolgt, ein Schluessel immer -- diese Unterscheidung fehlte.

  ── Der Workflow mit get_mention_detail_v8 (05.10.) ──────────────────────────
  Ereignis: "When drawer_response event" (bzw. dort, wo bisher v7 lief).
  Schritt 1: API Connector get_mention_detail_v8, Parameter body:
      {"p_prompt_run_id": "<prompt_run_id aus dem Ereignis>", "p_team": "<Team>"}
      Beispiel: {"p_prompt_run_id":"f0e1d2c3-0000-4000-8000-000000000005","p_team":"877c649c-f5f2-44e9-bb04-155f5bf44e70"}
      "Include errors in response and allow workflow actions to continue" AN.
  Schritt 2: Run javascript, OHNE "Only when":

      (function () {
        var ROH = `[Result of step 1's json]`
          .replace(/:\s*([,}\]])/g, ": null$1")
          .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
        var FEHLER = `[Result of step 1's error body]`;
        try { if (window.setResponseDetail) window.setResponseDetail("INSTANCE_ID", ROH, FEHLER); } catch (e) {}
      })();

  DIE LEISTE UEBER DEM DRAWER fuellt die Komponente selbst (05.10.): Typ response, Name
  "<Modell>, <Datum>", item_id = prompt_run_id. Ein eigener setDrawerTopbar-Schritt ist nicht mehr
  noetig (und mit v8 auch nicht mehr moeglich, es gibt keine einzelnen Felder). Beim Laden geht die
  Leiste ins Skelett, bei einem Fehler steht dort ein Strich.

  Statisch zum Ausprobieren: derselbe Schritt, im Backtick statt des Ausdrucks das Beispiel aus der
  v8-Uebergabe (ausgepackt) -- im Pruefstand urd06/_v8.js unveraendert gegen die Komponente gelaufen.

  ── Statischer Start zum Ausprobieren ────────────────────────────────────────
  Die Beispieldaten liegen NICHT in diesem Element, sondern als Run-JS-Schritt im
  Pageload-Workflow. Die getesteten Fassungen liegen im Repo als _h_urd_daten.js (alle drei
  Modelle). Fuer den Livegang wird nur der Inhalt des Schritts getauscht.
-->

<div class="up-root urd-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-prompt-fn="bubble_fn_urdPrompt"
     data-brand-fn="bubble_fn_urdBrand"
     data-url-fn="bubble_fn_urdUrl"
     data-view-fn="bubble_fn_urdView"
     data-domain-fn="bubble_fn_urdDomain">
  <!-- data-product-fn="bubble_fn_urdProduct" nur, wenn ein Workflow den Klick auf ein Produkt
       selbst behandeln soll -- ohne oeffnet die Komponente das Produkt im Shopping-Bereich.
       data-ad-fn="bubble_fn_urdAd" ebenso fuer den Klick auf eine Ad (ohne: Ad-Drawer im Ads-Bereich). -->
  <!--
    DER EINFACHSTE WEG, die Daten hereinzugeben: den dynamischen Ausdruck als INHALT dieses Blocks.
    Die Komponente liest ihn beim Aufbau selbst, es braucht dafuer keinen Run-JS-Schritt.
    Warum das der sichere Weg ist: im Quelltext eines Run-JS-Schritts ist ein Antworttext nicht
    unterzubringen. "..." vertraegt keinen echten Zeilenumbruch (SyntaxError: Invalid or unexpected
    token) und `...` keine Backticks (eine Antwort mit ```python bricht). Im Inhalt eines Elements
    ist JEDES Zeichen erlaubt -- der Browser parst hier keinen Code.
    Steht hier noch der Platzhalter, wird der Block ignoriert.
  -->
  <script type="application/json">PAYLOAD_JSON</script>
</div>

<script>
(function(){
  /* Loader nach STYLEGUIDE §26: den Pin ueber getElementsByClassName lesen, NIEMALS ueber
     document.currentScript — Bubble fuehrt Scripts nicht in DOM-Reihenfolge aus. */
  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       jsDelivr antwortet mit 404, und weder CSS noch JS landen. Ohne trim greift auch kein
       Rueckfall, weil "   " truthy ist.
       Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
       Waechter treffen, und der Loader liefe dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* ---- Rueckfall: einen Pin nehmen, der auf DIESER Seite schon gilt ----------------------
       Gemeldet am 31.08. mit drei Stapelspuren, alle aus einem solchen Loader: "core.css ist
       schon von einem anderen Pin geladen ... ignoriert wird @main" -- obwohl der Pin am Element
       stand. Der Grund ist die Reihenfolge: Bubble baut ein Element bei jedem Rerender neu und
       fuehrt Scripts nicht in DOM-Reihenfolge aus, dieser Loader lief also, waehrend seine eigene
       Wurzel noch nicht im Dokument stand -- die Klasse oben fand nichts.
       Und das war mehr als eine Warnung: core kam durch die Entdoppelung unten noch aus dem Pin,
       die Dateien DIESER Komponente aber tatsaechlich von @main. Eine Seite, die zur Haelfte auf
       @main laeuft, ist genau das, was ein Pin verhindern soll.
       Geraten wird nichts: jede der drei Stufen liest einen Pin, der auf dieser Seite schon in
       Gebrauch ist. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* Aus einer schon geladenen Datei ablesen. Diese Stufe greift auch dann, wenn alle anderen
       Elemente der Seite noch die ALTE Fassung dieses Loaders tragen -- die fuellen
       __upAssetsLoaded genauso. "main" wird NICHT gemerkt: das ist kein Pin, und die naechste
       Komponente wuerde ihn sonst fuer einen halten. */
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("urd-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  /* Entdoppelt nach DATEINAME, nicht nach URL: zwei Elemente mit verschiedenen Pins ergeben sonst
     zwei Dateien im Dokument, und welche gewinnt, entscheidet die Ladereihenfolge. Der erste Pin
     gewinnt, ein zweiter wird gemeldet. */
  function once(url, make){
    var name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + L[name] +
        ", ignoriert wird " + url + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = url; make(url);
  }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }

  /* core zuerst, async=false haelt die Reihenfolge ein. */
  css("core.css");              js("core.js");
  css("response-detail.css");   js("response-detail.js");
})();
</script>
