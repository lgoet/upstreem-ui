<!--
  UPSTREEM — THEMA UND DASHBOARD-MODUS VOR DEM ERSTEN BILD

  WOHIN: Bubble → Settings → SEO/metatags → "Script/meta tags in header". Ganz nach OBEN, vor das
  Asset-Preload aus page_header_preload.html. Es muss laufen, bevor der Browser das erste Mal malt.

  ── DAS PROBLEM ────────────────────────────────────────────────────────────────────────────────
  Der Seitengrund und der Loader waren im Dunkelmodus fuer eine bis zwei Sekunden weiss, bis der
  Pageload-Workflow das Thema gesetzt hat. Die Komponenten (Sidebar und so weiter) waren dabei
  richtig gefaerbt -- core.js stampft das gespeicherte Thema selbst auf jede .up-root, bevor
  Bubbles Attribute ankommen. Nur der Seitengrund gehoert keiner Komponente, also hat ihn niemand
  gesetzt.

  Das bisherige Header-Snippet fragte NUR prefers-color-scheme ab:

      html, body { background-color: #ffffff !important; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #121212 !important; } }

  Das trifft genau EINEN der drei Faelle. Die App kennt drei:

      pref_theme = "dark"    der Nutzer hat ausdruecklich dunkel gewaehlt
      pref_theme = "light"   der Nutzer hat ausdruecklich hell gewaehlt
      Schluessel fehlt       "System" -- dann und nur dann gilt prefers-color-scheme

  Wer im hellen Betriebssystem sitzt und in der App dunkel gewaehlt hat, bekam mit dem alten
  Snippet einen weissen Grund; umgekehrt einen dunklen. Und CSS kann den localStorage nicht lesen,
  also braucht es die drei Zeilen Javascript -- eine Media Query allein kann das nicht loesen.

  ── DER SCHLUESSEL ─────────────────────────────────────────────────────────────────────────────
  "pref_theme" ist derselbe Schluessel, den core.js schreibt (setUpstreemTheme) und liest
  (readPrefTheme). Nichts Neues, nichts Zusaetzliches zu pflegen: waehlt der Nutzer in der App das
  Thema, steht es danach hier drin, und dieses Snippet liest genau das.

  ── FARBEN ─────────────────────────────────────────────────────────────────────────────────────
  #ffffff und #101114 sind der Seitengrund aus core.css (--up-surface), hell und dunkel. Bis zum
  27.09. stand hier #121212 -- der alte Wert. Weichen sie dort einmal ab, muessen sie hier
  mitgezogen werden: das Snippet laeuft, BEVOR core.css da ist, kann seine Variablen also nicht
  benutzen.

  ── ZUR LAUFZEIT (27.09.) ──────────────────────────────────────────────────────────────────────
  Das Attribut setzt dieses Snippet beim Laden. Beim UMSCHALTEN zieht core.js es seit dem 27.09.
  nach (setUpstreemTheme) -- vorher blieb es auf dem Thema vom Laden stehen, und der Grund hinter
  der Seite (das, was beim Ueberscrollen sichtbar wird) war nach einem Wechsel auf dunkel weiss.
  color-scheme sagt dem Browser dasselbe fuer das, was er selbst malt: Scrollbalken und den Rand
  beim Ueberscrollen.

  ── BEIM EINFUEGEN ─────────────────────────────────────────────────────────────────────────────
  Kommentare nur GANZ oder gar nicht mitnehmen. Ein Rest wie "... */" ohne sein "/*" davor ist
  fuer den Browser ein Selektor: er verwirft damit die ganze naechste Regel -- genau so fehlte am
  27.09. der dunkle Grund fuer "System". Im Zweifel die Fassung ohne Kommentare nehmen
  (page_theme_preload_ohne_kommentare.html).
-->
<script>
(function () {
  /* Synchron im <head>: laeuft vor dem ersten Bild, also blitzt nichts. try/catch, weil
     localStorage in einem privaten Fenster werfen kann -- dann bleibt es bei der Media Query. */
  var t = "";
  try { t = String(window.localStorage.getItem("pref_theme") || "").trim().toLowerCase(); } catch (e) {}
  if (t === "dark" || t === "light") {
    document.documentElement.setAttribute("data-up-pagetheme", t);
  }
  /* Kein else: fehlt der Schluessel, ist "System" gemeint, und dann soll die Media Query unten
     entscheiden. Ein Attribut zu setzen wuerde sie ausschalten. */

  /* ── DASSELBE FUER DEN DASHBOARD-MODUS (15.09.) ──────────────────────────────────────────────
     Der Seitenkopf des Dashboards bekommt seine schmale Power-Form erst, wenn
     dashboard-page-header.js geladen und gemountet ist. Bis dahin steht dort der breite
     Standardkopf, und danach springt er sichtbar zusammen. Dieselbe Bauart wie beim Thema:
     der Wert liegt schon im localStorage, CSS kann ihn nicht lesen, also drei Zeilen hier.
     "up_dashboard" ist derselbe Schluessel, den core.js schreibt (setDashboardMode) und liest
     (getDashboardMode) -- nichts Neues zu pflegen. core stempelt dasselbe Attribut beim Start
     noch einmal, damit es auch ohne diesen Schnipsel stimmt.
     Nur "power" wird gesetzt: "standard" ist die Vorgabe der CSS, und ein Attribut dafuer waere
     eine zweite Wahrheit ohne Wirkung. */
  /* DASH_VORGABE muss mit data-mode-default am Dashboard-Seitenkopf uebereinstimmen (15.09.).
     Zwei Orte, weil dieser Schnipsel laeuft, BEVOR es ein Element auf der Seite gibt -- er kann
     das Attribut nicht lesen. Stehen sie auseinander, blitzt beim allerersten Besuch eines
     Geraets kurz die andere Kopfform auf; ab dem ersten Umschalten entscheidet ohnehin der
     localStorage und die Vorgabe spielt keine Rolle mehr. */
  var DASH_VORGABE = "power";
  var d = "";
  try { d = String(window.localStorage.getItem("up_dashboard") || "").trim().toLowerCase(); } catch (e) {}
  if (d !== "power" && d !== "standard") d = DASH_VORGABE;
  if (d === "power") document.documentElement.setAttribute("data-up-dashboard", "power");
})();
</script>
<style>
  /* Vorgabe HELL. Steht zuerst, damit die zwei Faelle darunter sie ueberschreiben koennen.
     Ohne !important: Bubble setzt den Seitengrund selbst, und !important hier hat schon einmal
     verhindert, dass eine Seite ihren eigenen Grund bekommt. */
  html, body { background-color: #ffffff; }
  html { color-scheme: light; }

  /* "System" -- gilt nur, wenn der Nutzer NICHTS gewaehlt hat (kein Attribut gesetzt). Der
     :not()-Teil ist entscheidend: ohne ihn schlaegt ein dunkles Betriebssystem die ausdrueckliche
     Wahl "hell". */
  @media (prefers-color-scheme: dark) {
    html:not([data-up-pagetheme]), html:not([data-up-pagetheme]) body { background-color: #101114; }
    html:not([data-up-pagetheme]) { color-scheme: dark; }
  }

  /* Die ausdrueckliche Wahl. Ein Selektorteil mehr als die Vorgabe, gewinnt also ueber
     Spezifitaet und nicht ueber die Reihenfolge. */
  html[data-up-pagetheme="dark"], html[data-up-pagetheme="dark"] body { background-color: #101114; }
  html[data-up-pagetheme="dark"] { color-scheme: dark; }
  html[data-up-pagetheme="light"], html[data-up-pagetheme="light"] body { background-color: #ffffff; }

  /* Der Loader: dieselbe Frage, dasselbe Attribut. */
  html[data-up-pagetheme="dark"] .bubble-element.Group.loader,
  html[data-up-pagetheme="dark"] .page-loader,
  html[data-up-pagetheme="dark"] #app-loader { background-color: #101114; }
</style>
