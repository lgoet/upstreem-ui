<meta charset="utf-8">
<body style="margin:0;padding:20px;font-family:system-ui,sans-serif">
<pre id="out" style="font:11px/1.6 ui-monospace,monospace;background:#f6f6f6;padding:10px;white-space:pre-wrap">läuft…</pre>

<!-- Die echten Dateien vom Pin, nicht die lokalen. Wenn core.js beim Laden wirft, initialisiert
     danach keine einzige Komponente mehr, und die Seite sieht unformatiert aus. -->
<script>
var FEHLER = [];
window.addEventListener("error", function(e){
  FEHLER.push((e.filename || "?").split("/").pop() + ":" + e.lineno + "  " + e.message);
}, true);
</script>




<div id="mira-quick-actions" data-theme="light" data-team="t1"></div>
<script>
/* Pin aus der URL: ?pin=8adbee2 gegen ?pin=0b40a36, sonst identische Seite. */
var PIN = new URLSearchParams(location.search).get("pin") || "8adbee2";
var BASE = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + PIN + "/";
var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
function once(u, make){ if (L[u]) return; L[u] = 1; make(u); }
function css(f){ once(BASE + f, function(u){ var l = document.createElement("link"); l.rel="stylesheet"; l.href=u; document.head.appendChild(l); }); }
function js(f){ once(BASE + f, function(u){ var s = document.createElement("script"); s.src=u; s.async=false; document.head.appendChild(s); }); }
/* Quick Actions zuerst, wie im Header-Reusable -- OHNE core. */
css("quick-actions.css"); js("quick-actions.js");
/* Eine andere Komponente kommt spaeter, mit ihrem eigenen Loader-Block. */
setTimeout(function(){ css("core.css"); js("core.js"); css("visibility-chart.css"); js("visibility-chart.js"); }, 1600);
</script>

<script>
setTimeout(function(){
  var UC = window.UpstreemCore, o = [];
  o.push("JS-Fehler beim Laden: " + (FEHLER.length ? "\n  " + FEHLER.join("\n  ") : "keine"));
  o.push("window.UpstreemCore: " + typeof UC);
  if (UC){
    var fehlt = ["makeMount","makePopover","brandStack","sentColor","getBrands","getTopics",
                 "storeStats","makeTooltips","makeColumns","makePager","unclipAncestors"]
                .filter(function(k){ return typeof UC[k] === "undefined"; });
    o.push("fehlende Kits: " + (fehlt.length ? fehlt.join(", ") : "keine"));
  }
  /* Greift core.css? Eine Regel daraus gegen ein Testelement pruefen. */
  var t = document.createElement("div");
  t.className = "up-root"; t.style.position = "absolute"; t.style.left = "-9999px";
  t.innerHTML = '<span class="up-badge is-dot"></span><span class="up-stack-item"><span class="up-stack-vis"></span></span>';
  document.body.appendChild(t);
  var dot = getComputedStyle(t.querySelector(".up-badge"));
  var vis = getComputedStyle(t.querySelector(".up-stack-vis"));
  o.push("visibility-chart geladen: " + (typeof window.setVisibilityChartTheme === "function" ? "ja" : "NEIN"));
  o.push("core.js-Tags: " + [].slice.call(document.querySelectorAll("script[src]")).filter(function(x){return /\/core\.js/.test(x.src);}).map(function(x){return x.src.split("@")[1];}).join(" + "));
  o.push("core.css greift: .up-badge.is-dot " + dot.width + "x" + dot.height +
         " (soll 6x6)   .up-stack-vis radius " + vis.borderRadius + " (soll 8px)");
  document.getElementById("out").textContent = o.join("\n");
}, 4000);
</script>
