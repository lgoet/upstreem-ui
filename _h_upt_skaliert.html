      var el = document.querySelector("#" + id + " .upt-root");
      if (!el) return "(keine Wurzel)";
      var sp = el.querySelector(".upt-grp-sidepanel");
      return { rechteckBreite: Math.round(el.getBoundingClientRect().width),
               layoutBreite: el.offsetWidth,
               listenansicht: el.classList.contains("is-groups-wide"),
               engGeschaltet: el.classList.contains("is-groups-cramped"),
               seitenlisteBreite: sp ? Math.round(sp.getBoundingClientRect().width) : -1 };
    }
    document.getElementById("out").textContent = JSON.stringify({ fassung: /alt=1/.test(location.search) ? "ALT" : "NEU", inDerSkaliertenBuehne: s("skaliert"), ohneSkalierung: s("unskaliert") }, null, 1);
  }, 1200);
}, 700);
</script>
