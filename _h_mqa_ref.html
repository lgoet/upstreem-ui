<!doctype html><meta charset="utf-8">
<title>Quick Actions: Referenz aufklappen und die Typen darin</title>
<pre id="out" style="font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="rahmen"></div>
<script>
/* Zwei Meldungen vom 07.09. an derselben Stelle: "Citation und URL Typen im DE Setting
   uebersetzen" und "Citation Typ bei Referenz kann ich nicht mehr oeffnen". Das zweite klingt
   nach einem Fehler beim Aufbau des Abschnitts -- und der Aufbau ruft seit gestern citeLabel,
   das jetzt ueber core geht. Also beides in einem Lauf: aufklappen, und nachsehen, was in den
   Chips steht. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function ja(b){ return b ? "RICHTIG" : "FALSCH"; }

Promise.all(["core.css","quick-actions.css","core.js","quick-actions.js",
             "bubble/quick_actions_bubble.html"].map(hol)).then(function(t){
  var f = document.createElement("iframe");
  f.style.cssText = "width:1240px;height:560px;border:1px solid #ccc;display:block";
  document.getElementById("rahmen").appendChild(f);
  var d = f.contentDocument, v = f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  try { v.localStorage.setItem("up_prefs", JSON.stringify({ locale:"de" })); } catch(e){}
  try { v.localStorage.setItem("pref_theme", "light"); } catch(e){}
  v.__fehler = [];
  v.addEventListener("error", function(e){
    v.__fehler.push(String(e.message) + " | " + ((e.error && e.error.stack) || "").split("\n")[1]);
  });
  [t[0], t[1]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var roh = t[4].replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim();
  d.body.innerHTML = roh;
  var r = d.querySelector(".mqa-root") || d.querySelector("[class*='mqa']");
  if (r){ r.setAttribute("data-cdn-pin","t"); r.setAttribute("data-isdark","no"); }
  var j1=d.createElement("script"); j1.textContent=t[2]; d.head.appendChild(j1);
  var j2=d.createElement("script"); j2.textContent=t[3]; d.head.appendChild(j2);
  return warte(1600).then(function(){ return { d:d, v:v }; });
}).then(function(u){
  var d = u.d, v = u.v;
  var trigger = d.querySelector(".mqa-trigger");
  log("Ausloeser da: " + !!trigger + "   Fehler bisher: " + v.__fehler.length);
  if (trigger) trigger.click();
  return warte(600).then(function(){
    /* Die Referenzliste oeffnen, dann den Eintrag "citation-types". */
    var reftop = d.querySelector("[data-reflist]");
    log("Referenzliste da: " + !!reftop);
    if (reftop) reftop.click();
    return warte(600).then(function(){
      var eintrag = d.querySelector('[data-ref="citation-types"]');
      log("Eintrag citation-types da: " + !!eintrag);
      if (eintrag) eintrag.click();
      return warte(800).then(function(){
        var offen = d.querySelector(".mqa-ref-item.is-open");
        var chips = [].map.call(d.querySelectorAll(".mqa-ref-item.is-open .mqa-ref-chip"),
                                function(c){ return c.textContent.trim(); });
        if (!chips.length){
          chips = [].map.call(d.querySelectorAll(".mqa-ref-item.is-open [class*='chip']"),
                              function(c){ return c.textContent.trim(); });
        }
        log("");
        log("1) LAESST SICH DER ABSCHNITT OEFFNEN?");
        log("   offen: " + !!offen + "   Fehler im Rahmen: " + v.__fehler.length +
            (v.__fehler.length ? "\n      " + v.__fehler.slice(0,2).join("\n      ") : ""));
        log("   ==> " + ja(!!offen && !v.__fehler.length));
        log("");
        log("2) STEHEN DIE TYPEN AUF DEUTSCH?");
        log("   " + JSON.stringify(chips));
        var deutsch = chips.some(function(c){ return /Wettbewerb|Wissensdatenbank|Institutionell|Du/.test(c); });
        log("   ==> " + ja(chips.length > 0 && deutsch));
        /* Und die URL-Typen im Abschnitt darunter. */
        var url = d.querySelector('[data-ref="url-types"]');
        if (url) url.click();
        return warte(800).then(function(){
          var uchips = [].map.call(d.querySelectorAll(".mqa-ref-item.is-open [class*='chip']"),
                                   function(c){ return c.textContent.trim(); });
          log("");
          log("3) URL-TYPEN");
          log("   " + JSON.stringify(uchips.slice(0, 8)));
          log("   ==> " + ja(uchips.some(function(c){ return /Artikel|Startseite|Leitfaden/.test(c); })));
          log("FERTIG");
        });
      });
    });
  });
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"").split("\n").slice(0,3).join("\n")); });
</script>
