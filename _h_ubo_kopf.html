<meta charset="utf-8"><title>brands overview kopfzeile</title>
<link rel="stylesheet" href="core.css?v=k1">
<link rel="stylesheet" href="brands-overview.css?v=k1">
<body style="margin:0;background:#fff;font-family:system-ui,sans-serif">
<div style="padding:8px;background:#eee;display:flex;gap:6px">
  <button onclick="zeigen()">MESSEN</button>
  <button onclick="dunkel()">DUNKEL</button>
</div>
<pre id="out" style="font:11px/1.5 ui-monospace,monospace;background:#f6f6f6;padding:8px;margin:0;white-space:pre-wrap">bereit</pre>
<div class="up-root ubo-root" data-theme="light" style="padding:24px">
  <!-- ============ chart container ============ -->
  <div class="ubo-unit">
    <div class="ubo-head">
      <div class="ubo-heading">Visibility over Time</div>
      <div class="ubo-head-tools">
        <div class="vc-gran" role="tablist" aria-label="Granularity">
          <button class="vc-gran-btn is-active" data-gran="day" type="button" role="tab">Day</button>
          <button class="vc-gran-btn" data-gran="week" type="button" role="tab">Week</button>
          <button class="vc-gran-btn" data-gran="month" type="button" role="tab">Month</button>
        </div>

        <div class="ubo-filter">
          <button class="ubo-filter-btn ubo-iconbtn" type="button" data-tip="Filter brands" aria-label="Filter brands">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            <span class="ubo-filter-badge"></span>
          </button>
          <div class="up-ment-menu" role="menu" aria-hidden="true"></div>
        </div>

        <div class="ubo-yaxis" role="tablist" aria-label="Y axis">
          <button class="ubo-yaxis-btn is-active" data-yaxis="sentiment" type="button" role="tab">Sentiment</button>
          <button class="ubo-yaxis-btn" data-yaxis="ranking" type="button" role="tab">Ranking</button>
        </div>
        <div class="ubo-seg" role="tablist" aria-label="Chart type">
          <button class="ubo-seg-btn is-active" data-chartmode="line" type="button" role="tab">Linechart
          </button>
          <button class="ubo-seg-btn" data-chartmode="landscape" type="button" role="tab">Landscape
          </button>
        </div>
        <button class="ubo-hide ubo-iconbtn" type="button" data-tip="Hide" aria-label="Hide">
          <svg class="ic-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></svg>
          <svg class="ic-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /> <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /> <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /> <path d="m2 2 20 20" /></svg>
        </button>
      </div>
    </div>

  </div>
</div>
<script>
function dunkel(){ var r=document.querySelector('.ubo-root'); r.setAttribute('data-theme', r.getAttribute('data-theme')==='dark'?'light':'dark'); }
/* Gemessen wird die REIHENFOLGE auf dem Schirm (linke Kante), nicht die im Markup: genau das
   verschiebt flex order, und genau das soll geprueft werden. */
function zeigen(){
  var tools=document.querySelector('.ubo-head-tools');
  var teile=[].slice.call(tools.children).map(function(e){
    var r=e.getBoundingClientRect();
    return { klasse: e.className.split(' ')[0], x: Math.round(r.left), order: getComputedStyle(e).order,
             selbst: getComputedStyle(e).alignSelf, hoehe: Math.round(r.height) };
  }).sort(function(a,b){ return a.x-b.x; });
  var gran=tools.querySelector('.vc-gran'), kr=tools.getBoundingClientRect();
  var gr=gran?gran.getBoundingClientRect():null;
  document.getElementById('out').textContent = JSON.stringify({
    reihenfolge: teile.map(function(t){ return t.klasse; }),
    teile: teile,
    granMittig: gr ? { oben: Math.round(gr.top-kr.top), unten: Math.round(kr.bottom-gr.bottom) } : null
  }, null, 1);
}
</script>
