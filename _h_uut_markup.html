<div class="up-root uut-root"
     data-instance="u1"
     data-cdn-pin=""
     data-isdark="no"
     data-domain-mode="no"
     data-brand-name="Acme"
     data-brand-logo=""
     data-export-instance="EXPORT_u1"
     data-sticky-top="171"
     data-search-fn="bubble_fn_uutSearch"
     data-sort-fn="bubble_fn_uutSort"
     data-filter-fn="bubble_fn_uutFilter"
     data-brand-fn="bubble_fn_uutBrand"
     data-rowclick-fn="bubble_fn_uutRowClick"
     data-page-fn="bubble_fn_uutPage"
     data-mentioned-fn="bubble_fn_uutMentioned">
  <div class="up-head">
    <div class="up-heading"><span class="up-head-label">URLs</span><span class="up-head-sep"></span><span class="up-head-count"></span></div>
    <div class="up-head-tools">
      <button class="uut-brand-toggle" type="button" data-tip="Filter for your brand mentions">
        <span class="uut-brand-toggle-lbl">
          <img class="uut-brand-logo" src="" style="display:none" alt=""/>
          <span class="uut-brand-label"></span>
        </span>
        <span class="uut-brand-check">
          <svg class="uut-brand-check-yes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
          <svg class="uut-brand-check-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /></svg>
        </span>
      </button>

      <div class="up-ment">
        <button class="up-ment-btn" type="button" data-tip="Filter for brand mentions" aria-haspopup="menu" aria-expanded="false">
          <span class="up-ment-lbl">All Brands</span>
          <svg class="up-ment-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
          <svg class="up-ment-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg>
        </button>
        <div class="up-ment-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="up-filter">
        <button class="up-filter-btn" type="button" data-tip="Filter Citation and URL Types" aria-haspopup="menu" aria-expanded="false">
          <span class="up-filter-btn-lbl">All Types</span>
          <svg class="up-filter-btn-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
          <svg class="up-filter-btn-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg>
        </button>
        <div class="up-filter-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="up-sort">
        <button class="up-sort-btn up-iconbtn" type="button" data-tip="Sort" aria-label="Sort">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
        </button>
        <div class="up-sort-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="up-search">
        <button class="up-search-btn up-iconbtn" type="button" data-tip="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg>
        </button>
        <div class="up-search-box">
          <input class="up-search-input" type="text" placeholder="Type in url..." autocomplete="off" spellcheck="false" aria-label="Search URLs"/>
          <button class="up-search-clear" type="button" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg>
          </button>
        </div>
      </div>

      <div class="up-cols">
        <button class="up-cols-btn up-iconbtn" type="button" data-tip="Table Settings" aria-label="Table settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <span class="uut-cols-badge"></span>
        <div class="up-cols-menu" role="menu" aria-hidden="true"></div>
      </div>

      <button class="up-export" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></svg>
        <span>Export</span>
      </button>
    </div>
  </div>

  <div class="up-box">
    <div class="up-table">
      <div class="up-thead">
        <div class="up-th up-th-domain">URL<span class="up-grip" data-grip="domain"></span></div>
        <div class="up-th up-th-share is-sortable" data-sortcol="share">
          <span class="up-th-txt">Share</span>
          <span class="up-th-info" data-explain="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /></svg></span>
          <span class="up-thsort" data-for="share">
            <svg class="up-thsort-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6" /></svg>
            <svg class="up-thsort-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
          </span>

        </div>
        <div class="up-th up-th-type">Type<span class="up-th-info" data-explain="type"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /></svg></span></div>
        <div class="up-th up-th-ment">
          <img class="up-th-brandlogo" src="" alt="" style="display:none"/>
          <span class="up-th-mentlbl">mentioned?</span>

        </div>
        <div class="up-th up-th-brands">Brands mentioned<span class="up-th-info" data-explain="brands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /></svg></span></div>
        <div class="up-th up-th-lastseen is-sortable" data-sortcol="last_seen">
          <span class="up-th-txt">Last Seen</span>
          <span class="up-thsort" data-for="last_seen">
            <svg class="up-thsort-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6" /></svg>
            <svg class="up-thsort-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
          </span>

        </div>
        <div class="up-th uut-th-actions">Actions</div>
      </div>
      <div class="up-tbody"></div>
    </div>
  </div>

  <div class="up-foot">
    <div class="up-pagesize">
      <span class="up-pagesize-lbl">Rows per page</span>
      <div class="up-pagesize-seg" role="group" aria-label="Rows per page"></div>
    </div>
    <div class="up-pager"></div>
  </div>
</div>
