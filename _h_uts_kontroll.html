<meta charset="utf-8">
<title>Kontrolltest: Deckstreifen der klebenden Werkzeugleiste</title>
<link rel="stylesheet" href="core.css?v=1">
<style>
  /* Gegentest zur Frage: malt .up-sticky .up-head::before (171px, --up-surface) auch auf der
     ECHTEN App ueber den Seitenkopf, der als EIGENES Bubble-Element davor steht? Wenn ja, ist das
     ein Bestandsfehler und kein Sonderfall von teams. Wenn nein, gibt es einen Mechanismus, der
     ihn schuetzt -- und den will ich kennen, bevor ich einen eigenen baue.
     Reiner CSS-Test, kein JS: .up-sticky wird von Hand gesetzt. */
  html, body { margin: 0; height: 100%; }
  body { font-family: sans-serif; overflow: hidden; background: #fff; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 171px; z-index: 100;
    background: rgba(255,255,255,.6); border-bottom: 1px solid #e6e6e6;
    display: flex; align-items: flex-end; padding: 0 24px 12px; box-sizing: border-box; }
  #main { height: 100vh; overflow-y: auto; padding: 0 24px 400px; box-sizing: border-box; }
  #spacer { height: 171px; }
</style>
<div id="topbar">topbar 171px (halbtransparent, wie in der App)</div>
<div id="main">
  <div id="spacer"></div>

  <!-- Seitenkopf als EIGENES Element, so wie auf der Brands-/Prompts-Seite -->
  <div class="up-root up-ph-root" id="ph">
    <div class="up-ph-top">
      <div class="up-ph-left">
        <div class="up-ph-meta"><span class="up-ph-metatxt">Acme Workspace</span></div>
        <h1 class="up-ph-heading">Brands</h1>
        <p class="up-ph-desc">Diese Beschreibung darf NICHT verdeckt werden.</p>
      </div>
    </div>
    <div class="up-ph-nav"><div class="up-ph-navitem is-selected"><span class="up-ph-navlabel">Overview</span></div></div>
  </div>

  <!-- Tabellenelement, sticky wie in der App -->
  <div class="up-root up-sticky" id="tbl" data-sticky-top="171" style="--up-sticky-top:171px">
    <div class="up-head">
      <span class="up-heading"><span class="up-head-label">Brands</span></span>
      <div class="up-head-tools"><button class="up-iconbtn" id="probe">i</button></div>
    </div>
    <div class="up-box"><div class="up-table">
      <div class="up-thead"><div class="up-th">A</div><div class="up-th">B</div></div>
      <div class="up-tbody">
        <div class="up-row"><div class="up-td">1</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">2</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">3</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">4</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">5</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">6</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">7</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">8</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">9</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">10</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">11</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">12</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">13</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">14</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">15</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">16</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">17</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">18</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">19</div><div class="up-td">x</div></div>
        <div class="up-row"><div class="up-td">20</div><div class="up-td">x</div></div>
      </div>
    </div></div>
  </div>
</div>
<script>
window.__mess = function(){
  var h1 = document.querySelector("#ph .up-ph-heading").getBoundingClientRect();
  var desc = document.querySelector("#ph .up-ph-desc").getBoundingClientRect();
  var nav = document.querySelector("#ph .up-ph-nav").getBoundingClientRect();
  function wer(x, y){ var e = document.elementFromPoint(x, y);
    return e ? (e.tagName + "." + String(e.className||"").split(" ").join(".")) : "null"; }
  return {
    scrollTop: document.getElementById("main").scrollTop,
    h1Top: Math.round(h1.top), descTop: Math.round(desc.top), navTop: Math.round(nav.top),
    headTop: Math.round(document.querySelector("#tbl .up-head").getBoundingClientRect().top),
    /* Wer liegt oben auf der Ueberschrift, der Beschreibung und der Nav? */
    aufH1: wer(200, h1.top + h1.height/2),
    aufDesc: wer(200, desc.top + desc.height/2),
    aufNav: wer(200, nav.top + nav.height/2)
  };
};
</script>
