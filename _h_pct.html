<meta charset="utf-8"><title>fmtPct: kleine Werte luegen nicht</title>
<style>html,body{margin:0;font:13px/1.5 system-ui,sans-serif;padding:8px}
#out{font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;padding:10px;background:#f6f6f6}</style>
<body><pre id="out">laeuft…</pre>
<script>
/* Gemeldet 04.09.: im Doughnut und den Balken des Citations Combo Chart stand "0.0%" fuer einen
   Wert, der nicht 0 ist. Der Chart rechnet mit EINER Stelle (CLAUDE.md 2b), und die "<1%"-Regel
   in fmtPct galt nur fuer ganze Prozente.
   Geprueft wird beides: dass kleine Werte jetzt "<0.1%" ergeben UND dass alles andere sich nicht
   geaendert hat -- eine Formatierung, die ploetzlich ueberall "<" schreibt, waere schlimmer. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
fetch("core.js?n="+Math.random(),{cache:"no-store"}).then(function(r){ return r.text(); }).then(function(js){
  var s=document.createElement("script"); s.textContent=js; document.head.appendChild(s);
  return new Promise(function(ok){ setTimeout(ok,400); });
}).then(function(){
  var UC=window.UpstreemCore, falsch=0;
  function p(v,n,soll){
    var ist=UC.fmtPct(v,n);
    var ok=(ist===soll); if(!ok) falsch++;
    log("   fmtPct("+v+(n===undefined?"":", "+n)+") = \""+ist+"\"   soll \""+soll+"\"   "+(ok?"RICHTIG":"FALSCH"));
  }
  log("OHNE Nachkommastellen (unveraendert)");
  p(0,0,"0%"); p(0.4,0,"<1%"); p(0.6,0,"<1%"); p(1,0,"1%"); p(34.3,0,"34%"); p(99.9,0,"<1%"===""?"":"100%");
  log("EINE Stelle -- der gemeldete Fall");
  p(0,1,"0.0%"); p(0.04,1,"<0.1%"); p(0.0001,1,"<0.1%"); p(0.1,1,"0.1%"); p(0.14,1,"0.1%"); p(34.34,1,"34.3%");
  log("ZWEI Stellen");
  p(0.004,2,"<0.01%"); p(0.01,2,"0.01%");
  log("Grenzfaelle: 0 bleibt 0, negativ bleibt wie es war");
  p(0,1,"0.0%"); p(-1,1,"-1.0%");
  log((falsch?falsch+" FALSCH":"0 FALSCH")+"   FERTIG");
}).catch(function(e){ log("ABBRUCH: "+e.message); });
</script>
