}).then(function(o){
  var d=o.d, sk=o.sk();
  var reihen=d.querySelectorAll(".upt-kpi-topics .up-bar-row").length;
  log("PHASE 10  Tabellendaten da: die Karten ziehen nach");
  log("   Skelett-Zeilen: topics="+sk.topics+"  quota="+sk.quota+"   Balken: "+reihen);
  log("   Kontingent: \""+(d.querySelector(".upt-kpi-quota-used")||{}).textContent+"\""+
      "   Notiz: \""+(d.querySelector(".upt-kpi-topics .upt-kpi-note")||{}).textContent+"\"");
  log("   ==> "+(sk.topics===0 && reihen===3 &&
                 (d.querySelector(".upt-kpi-quota-used")||{}).textContent==="102"
        ? "RICHTIG (gemerkte Nutzlast, kein zweiter Setter noetig)"
        : "FALSCH -- die Karten bleiben leer, bis die Ablage zufaellig noch einmal schickt"));
  /* DIE DOPPELTE ANIMATION: dieselben Themen ein zweites Mal schicken (auf der echten Seite
     passiert das, weil viele Kopien derselben Wurzel im DOM liegen). Es darf NICHT neu
     gezeichnet werden -- makeBarList laesst die Balken bei jedem render() einfahren. */
  var vorher=d.querySelector(".upt-kpi-topics .up-bar-row");
  o.__marke = vorher;
  o.v.setUpstreemTopics([
    {id:"t1",name:"Pricing",hex_light:"#3b82f6",prompt_count:42},
    {id:"t2",name:"Support",hex_light:"#22c55e",prompt_count:31},
    {id:"t3",name:"Security",hex_light:"#f59e0b",prompt_count:18}]);
  return new Promise(function(ok){ setTimeout(function(){ ok(o); },600); });
}).then(function(o){
  var d=o.d;
  var jetzt=d.querySelector(".upt-kpi-topics .up-bar-row");
  log("PHASE 11  dieselben Themen ein zweites Mal");
  log("   Zeilen neu gebaut: "+(jetzt!==o.__marke)+
      "   ==> "+(jetzt===o.__marke
        ? "RICHTIG (nicht neu gezeichnet, also keine zweite Einfahr-Animation)"
        : "FALSCH -- zweite Animation"));
  /* GEGENPROBE: GEAENDERTE Themen MUESSEN neu gezeichnet werden. */
  o.v.setUpstreemTopics([
    {id:"t1",name:"Pricing",hex_light:"#3b82f6",prompt_count:99},
    {id:"t2",name:"Support",hex_light:"#22c55e",prompt_count:31}]);
  return new Promise(function(ok){ setTimeout(function(){ ok(o); },600); });
}).then(function(o){
  var d=o.d;
  var jetzt=d.querySelector(".upt-kpi-topics .up-bar-row");
  var reihen=d.querySelectorAll(".upt-kpi-topics .up-bar-row").length;
  log("   Gegenprobe mit GEAENDERTEN Zahlen: neu gebaut="+(jetzt!==o.__marke)+"  Balken="+reihen);
  log("   ==> "+(jetzt!==o.__marke && reihen===2
        ? "RICHTIG (aendert sich etwas, wird gezeichnet -- Phase 11 hat also den Vergleich gemessen)"
        : "FALSCH"));
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: "+e.message+"\n"+(e.stack||"").split("\n").slice(0,3).join("\n")); });
</script>
