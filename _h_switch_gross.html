<!doctype html><meta charset="utf-8">
<title>Grosse Umschalter im Dunkeln: hebt sich die Pille von ihrer Schiene ab?</title>
<pre id="out" style="font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne" style="position:absolute;left:-4000px;top:0"></div>
<script>
/* Gemeldet am 07.09.: "die grossen Switcher, die 32px hoch sind, muessen im Darkmode denselben
   Grund bekommen wie die kleinen -- der Selected-State unterscheidet sich sonst zu wenig davon.
   Der Selected-State soll bleiben, nur die Schiene aendern."
   Gemessen wird die HELLIGKEIT beider Flaechen, deckend ausgerechnet: die Schiene ist
   halbtransparent, und ein Vergleich der Rohwerte waere ein Vergleich zweier verschiedener
   Dinge. Untergrund ist die Karte (--vc-bg), denn dort liegen diese Umschalter. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }

var SCHIENEN = [
  { name:"up-seg (klein, 26px)",  klasse:"up-seg",                gross:false },
  { name:"vc-gran (klein, 26px)", klasse:"vc-gran",               gross:false },
  { name:"up-seg.is-lg (32px)",   klasse:"up-seg is-lg",          gross:true },
  { name:"up-seg.umf-seg (32px)", klasse:"up-seg umf-seg",        gross:true },
  { name:"up-seg.umk-seg (32px)", klasse:"up-seg umk-seg",        gross:true },
  { name:"up-pagesize-seg (32px)",klasse:"up-pagesize-seg",       gross:true },
  { name:"up-filter-dim (32px)",  klasse:"up-filter-dim",         gross:true },
  { name:"up-dense (34px)",       klasse:"up-dense",              gross:true },
  { name:"tcd-mode (32px)",       klasse:"tcd-mode",              gross:true },
  { name:"udt-sub-dispseg (32px)",klasse:"udt-sub-dispseg",       gross:true },
  { name:"uca-format-seg (32px)", klasse:"uca-format-seg",        gross:true },
  { name:"uap-tabs (32px)",       klasse:"uap-tabs",              gross:true }
];

Promise.all(["core.css","topcitations-dashboard.css","domains-table.css","create-with-ai.css",
             "add-prompts.css"].map(hol)).then(function(t){
  var f=document.createElement("iframe");
  f.style.cssText="width:900px;height:600px;border:0";
  document.getElementById("buehne").appendChild(f);
  var d=f.contentDocument, v=f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  t.forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  /* .up-root MUSS an der Huelle stehen: die Regel fuer die grossen Schienen haengt daran, und
     die Menues der App tragen sie ebenfalls (sie haengen am body als .up-root.up-portal). Ohne
     sie wuerde hier eine Regel gemessen, die es auf der Seite nicht gibt. */
  var root=d.createElement("div");
  root.className="up-root"; root.setAttribute("data-theme","dark");
  d.body.appendChild(root);

  function deckend(farbe, unter){
    var c=d.createElement("canvas"); c.width=c.height=1;
    var x=c.getContext("2d");
    x.fillStyle=unter; x.fillRect(0,0,1,1);
    x.fillStyle=farbe; x.fillRect(0,0,1,1);
    var p=x.getImageData(0,0,1,1).data;
    function z(n){ n=n.toString(16); return n.length<2?"0"+n:n; }
    return "#"+z(p[0])+z(p[1])+z(p[2]);
  }
  /* DIESELBE SKALA wie in _h_dunkel_leiter.html: die Kanalwerte roh, mit den Augengewichten
     verrechnet, also 0 bis 255. NICHT die linearisierte Leuchtdichte -- die drueckt im Dunkeln
     alles auf Werte unter zehn zusammen, und dann sind zwei Prueftaende nicht mehr
     vergleichbar, obwohl beide "Stufen" sagen. Der Wert ist ein Abstand auf der Leiter, kein
     Kontrastverhaeltnis; fuer Text waere Letzteres richtig, fuer "sieht man den Unterschied
     zwischen zwei benachbarten Flaechen" ist es dieser. */
  function hell(h){
    h=h.replace("#","");
    function k(i){ return parseInt(h.slice(i,i+2),16); }
    return Math.round((0.2126*k(0)+0.7152*k(2)+0.0722*k(4))*100)/100;
  }

  /* DREI GRUENDE, nicht einer. Eine Schiene liegt auf einer Karte, in einer Kopfzeile ODER in
     einem Menue -- und weil sie halbtransparent ist, kommt auf jedem ein anderer Wert heraus.
     Genau daran ist der erste Anlauf gescheitert: auf der Karte sah es gut aus, im Menue waren
     es drei Stufen. Also wird ueberall gemessen, und die SCHLECHTESTE Stelle entscheidet. */
  var GRUENDE = [
    ["Karte",     "--vc-bg"],
    ["Kopfzeile", "--vc-heading-bg"],
    ["Menue",     "--up-menu-bg"]
  ];
  var MINDEST = 8;   /* darunter ist die Pille im Menue nicht mehr von ihrer Schiene zu trennen */
  var alleGut = true;

  function messeThema(thema, pilleWert){
    root.setAttribute("data-theme", thema);
    var cs2=v.getComputedStyle(root);
    log(thema.toUpperCase() + "   Pille " + pilleWert + " (Helligkeit " + hell(pilleWert) + ")" +
        "   Mindestabstand " + MINDEST);
    log("");
    GRUENDE.forEach(function(g){
      var grund=cs2.getPropertyValue(g[1]).trim();
      var grundRgb=deckend(grund, "#ffffff");
      log("   auf " + g[0] + " (" + g[1] + " " + grundRgb + ")");
      SCHIENEN.forEach(function(sch){
        var el=d.createElement("div"); el.className=sch.klasse;
        if (sch.klasse.indexOf("Match") >= 0) el.setAttribute("aria-label","Match mode");
        root.appendChild(el);
        var roh=v.getComputedStyle(el).backgroundColor;
        el.remove();
        var dk=deckend(roh, grundRgb);
        var abstand=Math.round((hell(pilleWert)-hell(dk))*100)/100;
        var ok = abstand >= MINDEST;
        if (!ok) alleGut = false;
        log("      " + ja(ok) + " " + sch.name.padEnd(26," ") + " Schiene deckend " + dk +
            "   Pille liegt " + String(abstand).padStart(6," ") + " Stufen darueber");
      });
      log("");
    });
  }
  messeThema("dark", "#28282c");
  messeThema("light", "#ffffff");
  log("==> " + ja(alleGut) + "  jede Schiene liegt auf JEDEM Grund mindestens " + MINDEST +
      " Stufen unter ihrer Pille");
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"")); });
</script>
