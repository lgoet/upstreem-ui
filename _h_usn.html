<script>
window.__ev = [];
/* Angeheftete Eintraege liegen im localStorage -- fuer den Test vier verschiedene Typen. */
try { localStorage.setItem("usn_pins__s1@ca880309-251e-4513-8901-8c5f8583f624", JSON.stringify([
  {type:"brand", id:"b1", label:"Mercedes Benz", logo:""},
  {type:"domain", id:"auto-motor-sport.de", label:"auto-motor-sport.de", logo:""},
  {type:"url", id:"https://x.de/a", label:"Die zehn besten Elektroautos 2026 im Vergleich", logo:""},
  {type:"prompt", id:"p9", label:"Welches Elektroauto hat die beste Reichweite?", logo:"https://flagcdn.com/de.svg"}
])); localStorage.setItem("usn_pins__s1@FREMDES-TEAM", JSON.stringify([
  {type:"brand", id:"darf-nicht-auftauchen", label:"FREMDES TEAM", logo:""}
])); localStorage.removeItem("usn_closed__s1"); } catch(e){}
function log(){ var o=document.getElementById("out"); if(o) o.textContent = window.__ev.slice(-8).join("\n"); }
["usnNav","usnTeam","usnAccount","usnTheme","usnLogout","usnNewTeam","usnState","usnPinned"].forEach(function(n){
  window["bubble_fn_"+n] = function(j){ window.__ev.push(n+" "+j); log(); };
});
window.bubble_fn_theme_pref = function(v){ window.__ev.push("theme_pref "+v); log(); };

/* Frische BEWEISEN statt hoffen: alles per fetch(no-store) holen und inline einsetzen.
   Ein ?v=-Anhang hat in diesem Repo mehrfach nicht gewirkt. */
(function(){
  /* Reihenfolge ABSICHTLICH andersherum als in der Vorlage: core.css NACH sidebar.css.
     Genau so kam es auf der Bubble-Seite an, und genau so fiel die Leiste um -- .up-portal
     (display:contents) und .up-root (position:relative) gewannen ueber die Reihenfolge.
     Wer hier die bequeme Reihenfolge misst, misst sein eigenes Glueck. */
  var files = ["sidebar.css","core.css","quick-actions.css","core.js","sidebar.js","quick-actions.js"];
  var texts = {};
  Promise.all(files.map(function(f){
    return fetch(f + "?nocache=" + Math.random(), { cache: "no-store" })
      .then(function(r){ return r.text(); }).then(function(t){ texts[f] = t; });
  })).then(function(){
    files.forEach(function(f){
      var el;
      if (/\.css$/.test(f)){ el = document.createElement("style"); }
      else { el = document.createElement("script"); }
      el.textContent = texts[f];
      document.head.appendChild(el);
    });
    window.__geladen = { core_js: texts["core.js"].length, sidebar_js: texts["sidebar.js"].length,
                         sidebar_css: texts["sidebar.css"].length };
    setTimeout(los, 1200);   /* Verzoegert, damit die Skelette messbar sind */
  });
})();

function los(){

    {"id": "eee8727a-ee98-4d2a-a25e-f3ca8fce8307", "name": "Allianz", "domain": "allianz.de", "favicon_url": "https://www.google.com/s2/favicons?domain=allianz.de&sz=64"},

    {"id": "f95f59c3-4871-49e6-afaf-409bb090e472", "name": "Der Sanitätscoach", "domain": "sanitaetscoach.de", "favicon_url": "https://www.google.com/s2/favicons?domain=sanitaetscoach.de&sz=64"}
  ]);

  window.__brandsNachSetter = { rueckgabe: undefined, store: (window.getUpstreemBrands ? (window.getUpstreemBrands()||[]).length : "keine Fn"),
                                anzeige: (document.querySelector("[data-brandcount]")||{}).innerHTML };
  window.__skelNachher = { anzahl: document.querySelectorAll(".usn-sk").length,
                           teamname: document.querySelector(".usn-teamname").textContent };
  window.__ev.push("setter durch"); log();
  /* Bubble injiziert das Traegerelement waehrend des Ladens neu -- genau der Moment, in dem die
     Palette bisher verschwand. */
  setTimeout(function(){
    var alt = document.querySelector(".usn-root");
    var neu = alt.cloneNode(true);
    alt.parentNode.replaceChild(neu, alt);
    setTimeout(function(){
      window.__nachReinjektion = {
        paletten: document.querySelectorAll("#mira-quick-actions").length,
        imSlot: !!(document.querySelector("[data-qa]") && document.querySelector("[data-qa]").firstElementChild),
        trigger: document.querySelectorAll(".mqa-trigger").length,
        baren: document.querySelectorAll(".usn-bar").length
      };
    }, 900);
  }, 300);
}
</script>
