<!doctype html><meta charset="utf-8">
<title>Der helle Modus gegen Linears hellen Modus, Token fuer Token</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne" style="position:absolute;left:-4000px;top:0"></div>
<script>
/* Angefordert am 07.09.: "checke bitte auch alle Linear Lightmode Farben, und wie die noch von
   meinen unterschiedlich sind. alle Farben checken, die wir jetzt im Darkmode auch angepasst
   haben."
   Linears Werte sind am 07.09. live von linear.app ausgelesen (data-theme auf "light" gesetzt und
   die Custom Properties der Wurzel abgefragt) -- dieselbe Methode wie fuer die dunkle Leiter.
   Unsere Werte liest dieser Prueftand aus der geladenen core.css, damit hier nichts behauptet
   wird, was in der Datei anders steht. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }

/* Am 07.09. von linear.app gelesen, helles Thema. */
var LINEAR = {
  "bg-primary":     "#ffffff",
  "bg-secondary":   "#f9f8f9",
  "bg-tertiary":    "#f4f2f4",
  "bg-quaternary":  "#eeedef",
  "bg-quinary":     "#e9e8ea",
  "border-primary": "#e9e8ea",
  "border-secondary":"#e4e2e4",
  "border-tertiary":"#dcdbdd",
  "translucent":    "#00000005",
  "text-primary":   "#282a30",
  "text-secondary": "#3c4149",
  "text-tertiary":  "#6f6e77",
  "text-quaternary":"#86848d"
};

/* Rolle -> unser Token -> Linears Rolle. Genau die Rollen, die im Dunkeln am 08.09. umgestellt
   wurden; die Schriftfarben stehen nur zum Vergleich mit, sie waren ausdruecklich ausgenommen. */
/* Seit dem 07.09. nachmittags sitzt jede Rolle eine Sprosse HOEHER -- gemeldet als "die Tabellen,
   Cards und Kopfzeilen sind mir etwas zu dunkel", und hoeher ist im hellen Spektrum die einzige
   Richtung, die es dafuer gibt. Die Zuordnung unten ist die geltende; verglichen wird weiter
   gegen Linears Werte, nur eben gegen die jeweils naechste ihrer Sprossen. */
var ROLLEN = [
  ["Seitengrund",        "--up-surface",      "bg-primary",      "Flaeche"],
  ["Karte / Panel",      "--vc-bg",           "bg-primary",      "Flaeche"],
  ["Kopfzeile",          "--vc-heading-bg",   "bg-secondary",    "Flaeche"],
  ["Auswahl",            "--up-sel-bg",       "bg-tertiary",     "Flaeche"],
  ["Skelett",            "--vc-sk",           "bg-quaternary",   "Flaeche"],
  ["Menuegrund",         "--up-menu-bg",      "bg-primary",      "Flaeche"],
  ["Rahmen auf Flaechen","--vc-border",       "border-secondary","Rahmen"],
  ["Menuerahmen",        "--up-menu-border",  "border-tertiary", "Rahmen"],
  ["Feld",               "--vc-field",        "bg-secondary",    "Flaeche"],
  ["Umschalterflaeche",  "--vc-switch-bg",    "bg-secondary",    "Flaeche"],
  ["Umschalterrahmen",   "--vc-switch-border","border-secondary","Rahmen"],
  ["Tabellenkopf",       "--vt-head-bg",      "bg-secondary",    "Flaeche"],
  ["Zeilenhover",        "--vt-row-hover",    "bg-secondary",    "Flaeche"],
  ["Text",               "--vc-text",         "text-primary",    "Schrift"],
  ["Text gedaempft",     "--vc-muted",        "text-tertiary",   "Schrift"],
  ["Text dritte Stufe",  "--vc-third",        "text-quaternary", "Schrift"]
];

function rgb(hexOderRgba, unter){
  /* Alles auf ein deckendes RGB bringen: halbtransparente Werte auf ihrem Untergrund
     ausgerechnet, sonst vergleicht man eine Farbe mit einer Farbe plus Untergrund. */
  var c = document.createElement("canvas"); c.width = c.height = 1;
  var x = c.getContext("2d");
  x.fillStyle = unter || "#ffffff"; x.fillRect(0,0,1,1);
  x.fillStyle = hexOderRgba;
  if (x.fillStyle === "#000000" && !/^#0{3,6}$|black/i.test(hexOderRgba)) return null;   /* nicht lesbar */
  x.fillRect(0,0,1,1);
  var d = x.getImageData(0,0,1,1).data;
  function z(n){ n = n.toString(16); return n.length<2 ? "0"+n : n; }
  return "#" + z(d[0]) + z(d[1]) + z(d[2]);
}
function hell(hex){
  var h = hex.replace("#","");
  function lin(c){ c = parseInt(c,16)/255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
  return Math.round((0.2126*lin(h.slice(0,2)) + 0.7152*lin(h.slice(2,4)) + 0.0722*lin(h.slice(4,6)))*255*100)/100;
}
function kontrast(a,b){
  function w(hex){ var h=hex.replace("#",""); function l(c){ c=parseInt(c,16)/255;
    return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
    return 0.2126*l(h.slice(0,2))+0.7152*l(h.slice(2,4))+0.0722*l(h.slice(4,6)); }
  var x=w(a), y=w(b); if (x<y){ var t=x; x=y; y=t; } return (x+0.05)/(y+0.05);
}

hol("core.css").then(function(css){
  var f = document.createElement("iframe");
  f.style.cssText = "width:200px;height:80px;border:0";
  document.getElementById("buehne").appendChild(f);
  var d = f.contentDocument, v = f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body></body></html>"); d.close();
  var st = d.createElement("style"); st.textContent = css; d.head.appendChild(st);
  var el = d.createElement("div"); el.className = "up-root"; d.body.appendChild(el);
  var cs = v.getComputedStyle(el);

  log("HELLER MODUS: unsere Werte gegen Linears (live gelesen am 07.09.)");
  log("");
  log("   Rolle                  unser Token          unser Wert   deckend    Linear     Stufen");
  var abweichung = 0, gleich = 0;
  ROLLEN.forEach(function(r){
    var roh = cs.getPropertyValue(r[1]).trim();
    var lin = LINEAR[r[2]];
    var unser = roh ? rgb(roh, "#ffffff") : null;
    if (!unser){ log("   " + r[0].padEnd(22," ") + r[1].padEnd(21," ") + " NICHT LESBAR (" + roh + ")"); return; }
    var stufen = Math.round(Math.abs(hell(unser) - hell(lin)) * 100) / 100;
    var marke = stufen < 1.2 ? "gleich " : "ANDERS ";
    if (stufen < 1.2) gleich++; else abweichung++;
    log("   " + r[0].padEnd(22," ") + r[1].padEnd(21," ") +
        roh.padEnd(12," ").slice(0,12) + " " + unser + "  " + lin + "  " +
        String(stufen).padStart(6," ") + "  " + marke + " (" + r[3] + ")");
  });
  log("");
  log("   " + gleich + " Rollen praktisch gleich, " + abweichung + " weichen ab (Schwelle 1.2 Helligkeitsstufen)");
  log("");
  log("DIE LEITER, wenn man Linears helle Werte nimmt");
  ["bg-primary","bg-secondary","bg-tertiary","bg-quaternary","bg-quinary"].forEach(function(k,i,a){   /* zum Vergleich */
    var v1 = LINEAR[k], vor = i ? LINEAR[a[i-1]] : null;
    log("   " + k.padEnd(15," ") + v1 + "   Helligkeit " + String(hell(v1)).padStart(6," ") +
        (vor ? "   Abstand zur vorigen " + (Math.round((hell(vor)-hell(v1))*100)/100) : ""));
  });
  log("");
  log("UNSERE LEITER HEUTE");
  [["--up-surface","Seite"],["--vc-bg","Karte"],["--vc-heading-bg","Kopfzeile"],["--up-sel-bg","Auswahl"],["--vc-sk","Skelett"]]   /* Seite und Karte teilen die oberste Sprosse */
    .forEach(function(p, i, a){
      var w = rgb(cs.getPropertyValue(p[0]).trim(), "#ffffff");
      var vorher = i ? rgb(cs.getPropertyValue(a[i-1][0]).trim(), "#ffffff") : null;
      log("   " + p[1].padEnd(15," ") + w + "   Helligkeit " + String(hell(w)).padStart(6," ") +
          (vorher ? "   Abstand zur vorigen " + (Math.round((hell(vorher)-hell(w))*100)/100) : ""));
    });
  log("");
  function ja(x){ return x ? "RICHTIG" : "FALSCH "; }
  var karte = rgb(cs.getPropertyValue("--vc-bg").trim(), "#ffffff");
  var seite = rgb(cs.getPropertyValue("--up-surface").trim(), "#ffffff");
  log("   Karte gegen Seite: unser Kontrast " + kontrast(karte, seite).toFixed(3) +
      "   mit Linears Werten " + kontrast(LINEAR["bg-secondary"], LINEAR["bg-primary"]).toFixed(3));
  log("");
  log("URTEILE");
  /* Karte und Seite teilen sich seit dem 07.09. nachmittags die oberste Sprosse -- das ist der
     Preis dafuer, dass jede Rolle eine Stufe hoeher sitzt, und es ist eine Entscheidung, kein
     Versehen. Getragen wird die Karte dann vom Rahmen, und GENAU DAS wird hier geprueft. */
  var rbTest = rgb(cs.getPropertyValue("--vc-border").trim(), "#ffffff");
  log("   " + ja(karte === seite ? (hell(karte) - hell(rbTest)) > 25 : true) +
      " die Karte traegt sich ueber ihren Rahmen (Karte " + karte + " wie die Seite, Rahmen " +
      rbTest + ", Abstand " + (Math.round((hell(karte)-hell(rbTest))*100)/100) + ", verlangt > 25)");
  /* Ab der Kopfzeile MUSS die Leiter fallen. Genau hier lag der Fehler am Vormittag -- die
     Auswahl war heller als die Kopfzeile darueber. Die Karte steht bewusst nicht mit drin: sie
     liegt auf derselben Sprosse wie die Seite. */
  var stufen = [["Karte","--vc-bg"],["Kopfzeile","--vc-heading-bg"],
                ["Auswahl","--up-sel-bg"],["Skelett","--vc-sk"]]
    .map(function(p){ return { n:p[0], h:hell(rgb(cs.getPropertyValue(p[1]).trim(), "#ffffff")) }; });
  var monoton = true, kleinster = 999;
  for (var i=1;i<stufen.length;i++){
    var d = stufen[i-1].h - stufen[i].h;
    if (d <= 0) monoton = false;
    if (d < kleinster) kleinster = d;
  }
  log("   " + ja(monoton) + " ab der Karte faellt die Leiter durchgehend (kleinster Schritt " +
      (Math.round(kleinster*100)/100) + ")");
  /* Menue und Tooltip liegen OBEN, also auf Weiss -- sonst waeren sie von der Karte darunter
     nicht zu unterscheiden. */
  var menue = rgb(cs.getPropertyValue("--up-menu-bg").trim(), "#ffffff");
  log("   " + ja(hell(menue) >= hell(karte)) + " das Menue liegt nicht UNTER der Karte (" + menue +
      " gegen " + karte + "; getrennt wird es durch Rahmen und Schatten)");
  /* Rahmen: der auf einer Karte darf leiser sein als der einer schwebenden Schicht. */
  var rb = rgb(cs.getPropertyValue("--vc-border").trim(), "#ffffff");
  var rm = rgb(cs.getPropertyValue("--up-menu-border").trim(), "#ffffff");
  log("   " + ja(hell(rb) - hell(karte) < 0 && (hell(karte) - hell(rb)) > 8) +
      " Rahmen auf der Karte sichtbar: " + rb + " auf " + karte + ", Abstand " +
      (Math.round((hell(karte)-hell(rb))*100)/100));
  log("   " + ja(hell(rm) < hell(rb)) + " Menuerahmen kraeftiger als der auf der Karte (" + rm + " gegen " + rb + ")");
  /* Und der Tabellenkopf, der vorher bei 1.01 Kontrast praktisch nicht da war. */
  var tk = rgb(cs.getPropertyValue("--vt-head-bg").trim(), karte);
  log("   " + ja((hell(karte) - hell(tk)) > 10) + " Tabellenkopf hebt sich von der Karte ab: " +
      tk + " auf " + karte + ", Abstand " + (Math.round((hell(karte)-hell(tk))*100)/100));
  /* Schrift: unveraendert, aber sie liegt jetzt auf einer getoenten Karte statt auf Weiss. */
  /* BEIDE Werte ausgeben -- auf Weiss und auf der neuen Karte. Nur so ist zu sehen, ob ein
     Unterschreiten von dieser Aenderung kommt oder vorher schon dastand. --vc-third war schon auf
     Weiss unter 3 (2.68): das ist Beiwerk, kein AA-Text, und die Schwelle steht hier trotzdem,
     damit der Wert nicht unbemerkt weiter absinkt. */
  [["--vc-text",4.5],["--vc-muted",4.5],["--vc-third",3]].forEach(function(p){
    var f = cs.getPropertyValue(p[0]).trim();
    var kw = kontrast(rgb(f,"#ffffff"), "#ffffff");
    var k = kontrast(rgb(f,"#ffffff"), karte);
    log("   " + ja(k >= p[1]) + " " + p[0] + " " + f + ": auf Weiss " + kw.toFixed(2) +
        ", auf der Karte " + k.toFixed(2) + " (verlangt " + p[1] +
        (kw < p[1] ? ", lag schon auf Weiss darunter" : "") + ")");
  });
  /* Die sechs schwebenden Schichten machen eigene Paletten auf. Sie MUESSEN den Menuerahmen
     tragen, nicht den fuer Karten -- sonst loest sich ihre Kante gegen die Seite auf. Geprueft
     wird der Wert in der Datei, weil diese Bloecke am body haengen und hier nicht gemountet
     werden koennen. */
  log("");
  log("SCHWEBENDE SCHICHTEN: tragen sie den Menuerahmen?");
  var SCHICHTEN = [
    ["core.css",             ".up-scale-menu"],
    ["core.css",             ".up-topicmodal-card"],
    ["prompts-table.css",    ".upt-bulkbar"],
    ["brands-overview.css",  ".ubo-mxtip"],
    ["brands-overview.css",  ".ubo-actmenu"],
    ["performance-radar.css",".uhm-tip"],
    ["settings-brand.css",   ".usb-dlg"]
  ];
  var dateien = {};
  return Promise.all(SCHICHTEN.map(function(p){ return p[0]; })
      .filter(function(n, i, a){ return a.indexOf(n) === i; })
      .map(function(n){ return hol(n).then(function(txt){ dateien[n] = txt; }); }))
    .then(function(){
      var alleGut = true;
      SCHICHTEN.forEach(function(p){
        var txt = dateien[p[0]] || "";
        /* Der Block einer Schicht: ab ihrem Namen bis zur naechsten schliessenden Klammer. */
        function block(bei){
          var i = txt.indexOf(bei); if (i < 0) return "";
          var j = txt.indexOf("}", i); return j < 0 ? "" : txt.slice(i, j);
        }
        var hellB = block(p[1] + " {");
        var dunkelB = block(p[1] + "[data-theme=\"dark\"]");
        if (!dunkelB) dunkelB = block("[data-theme=\"dark\"] " + p[1]);
        if (!dunkelB) dunkelB = block("[data-theme=\"dark\"]" + p[1]);
        function wert(b){ var m = b.match(/--vc-border:\s*(#[0-9a-fA-F]{6})/); return m ? m[1].toLowerCase() : null; }
        var h = wert(hellB), dk = wert(dunkelB);
        var ok = h === "#dcdbdd" && dk === "#3e3e44";
        if (!ok) alleGut = false;
        log("   " + ja(ok) + " " + p[1].padEnd(22," ") + " hell " + (h || "-") + "   dunkel " + (dk || "-"));
      });
      log("   " + ja(alleGut) + " alle sieben tragen border-tertiary in beiden Themen");
      log("FERTIG");
    });
}).catch(function(e){ log("ABBRUCH: " + e.message); });
</script>
