<meta charset="utf-8">
<link rel="stylesheet" href="core.css?v=24">
<link rel="stylesheet" href="discover-brands.css?v=24">
<style>
  /* Kopiert die Form der echten Bubble-Seite: der Koerper scrollt nicht, #main scrollt, und
     darueber schwebt eine 171px hohe Topbar -- genau der Wert, den --up-sticky-top annimmt.
     Ohne diese Form ist ein Sticky-Test wertlos: klebt der Kopf am Fenster statt am scrollenden
     Vorfahren, sieht es lokal richtig aus und in der App falsch. */
  html, body { margin: 0; height: 100%; }
  body { font-family: sans-serif; overflow: hidden; }
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 171px; z-index: 100;
    background: #fff; border-bottom: 1px solid #e6e6e6;
    display: flex; align-items: flex-end; padding: 0 24px 12px; box-sizing: border-box;
    font: 600 20px/1 sans-serif; color: #111;
  }
  /* KEIN padding-top hier. Kontrolltest im Harness: ein nacktes position:sticky-DIV mit top:171px
     landete bei 342px, also 171 + 171 -- Chrome rechnet das obere Padding des Scrollcontainers auf
     den sticky-Versatz drauf. Mit padding-top misst man also den Harness, nicht die Komponente.
     Der Platz unter der schwebenden Topbar kommt darum aus einem Abstandhalter im Fluss. */
  #main { height: 100vh; overflow-y: auto; padding: 0 24px 400px; box-sizing: border-box; }
  #spacer { height: 171px; }
  /* Der zu kurze Bubble-Wrapper mit overflow:hidden, den unclipAncestors aufmachen muss. */
  #wrap { overflow: hidden; }
</style>

<div id="topbar">Floating page topbar (171px)</div>
<div id="main">
  <div id="spacer"></div>
  <div id="wrap">
    <div class="up-root udb-root"
         data-instance="brands1"
         data-isdark="no"
         data-sticky-top="171"
         data-search-fn="bubble_fn_udbSearch"
         data-matched-fn="bubble_fn_udbMatched"
         data-track-fn="bubble_fn_udbTrack"></div>
  </div>
</div>

<script src="core.js?v=24"></script>
<script src="discover-brands.js?v=24"></script>
<script>
window.__ev = [];
["udbSearch","udbMatched","udbTrack"].forEach(function(n){
  window["bubble_fn_" + n] = function(p){ window.__ev.push([n, p]); };
});

var NAMES = ["Notion","Linear","Figma","Slack","Airtable","Vercel","Retool","Miro","Loom","Asana",
             "Coda","Webflow","Framer","Supabase","Render","Railway","Clerk","Sentry","Datadog","Amplitude",
             "Mixpanel","Segment","Twilio","Stripe","Plaid","Ramp","Brex","Gusto","Rippling","Deel"];
/* Form wie der echte RPC: recognized_urls als Liste, visibility_pct, runs_total in jeder Zeile.
   Jede siebte Zeile OHNE recognized_urls -- das ist der Fall, in dem die Domainspalte einen
   Strich zeigen muss statt leer zu bleiben. */
window.__rows = NAMES.map(function(n, i){
  var d = n.toLowerCase() + ".com";
  return {
    name: n,
    visibility_pct: Math.round((90 - i * 2.6) * 10) / 10,
    mentioned_count: 480 - i * 14,
    runs_total: 12480,
    recognized_urls: i % 7 === 3 ? [] : [{
      domain: d, root_url: "https://" + d,
      favicon_url: "https://www.google.com/s2/favicons?domain=" + d + "&sz=64"
    }]
  };
});

window.__load = function(){
  renderDiscoverBrands({ instanceId: "brands1", rows: window.__rows });
};
</script>
