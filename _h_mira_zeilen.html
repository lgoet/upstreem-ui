<body><iframe id="r" src="_h_mira_zelle.html"></iframe><pre id="out">laeuft…</pre>
<script>
/* Kurz mit Absicht: kein Klicken, keine Wartekette. Die Flaeche ist eingeklappt, Uhren werden
   dort gedrosselt (gemessen: eine 20ms-Uhr nach 996ms), und der lange Aufbau kam nicht durch.
   Gefragt ist nur: tragen die zwei Zeilen jetzt die Form aus core, und ueberschreibt der Rest
   die alten Karten-Regeln. */
document.getElementById("r").addEventListener("load", function(){
  var w=this.contentWindow;
  var t=setInterval(function(){ if(!w.__fertig) return; clearInterval(t);
    document.getElementById("out").textContent=JSON.stringify(w.__R,null,1);
    window.__R=w.__R; window.__fertig=true; },250);
});
</script>
