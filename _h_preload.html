<meta charset="utf-8"><title>preload: beide Loader-Generationen</title>
<body style="font:12px ui-monospace,monospace;padding:14px">
<pre id="out">laeuft</pre>
<script>
/* ---- DAS ECHTE SNIPPET, NICHT EINE KOPIE ----------------------------------------------------
   Hier stand bis zum 05.09. eine ABSCHRIFT von bubble/page_header_preload.html. Damit hat dieser
   Prueftand seine eigene Kopie geprueft: die Abschrift war zwei Fassungen alt (noch mit dem
   media="print"-Trick), und eine Aenderung an der echten Datei konnte er gar nicht sehen.
   Gemerkt daran, dass er nach dem Erweitern der Welle 2 unveraendert "42 Dateien" meldete.

   Jetzt wird die Datei geholt und ihr Script ausgefuehrt. SYNCHRON, und das ist Absicht: die
   Reihenfolge IST der Test -- das Snippet muss vor den Element-Loadern laufen, so wie im
   Seitenkopf. Ein fetch().then() waere ein Makrotask spaeter, und die Loader unten haengen an
   window.load. */
var PIN_EL = "05a22abe655051e26ffef86522e8d3c2be8a0839";
(function(){
  var x = new XMLHttpRequest();
  /* Welche Datei geprueft wird, sagt ?datei= -- so kann derselbe Prueftand auch eine Fassung
     pruefen, die zur Weitergabe entsteht (etwa die kommentarfreie). Ohne Angabe: die echte. */
  var DATEI = (/[?&]datei=([^&]+)/.exec(location.search) || [])[1];
  DATEI = DATEI ? decodeURIComponent(DATEI) : "bubble/page_header_preload.html";
  x.open("GET", DATEI + "?n=" + Math.random(), false);
  x.send(null);
  var t = x.responseText;
  var a = t.indexOf("<" + "script>"), b = t.lastIndexOf("</" + "script>");
  var code = t.slice(a + 8, b);
  /* FRISCHE BEWEISEN, nicht hoffen: zwei Marker, die es in der alten Fassung nicht gab. Fehlt
     einer, ist jede Zahl darunter wertlos -- und der Prueftand sagt es, statt gruen zu melden. */
  window.__snippet = {
    datei: DATEI,
    zeichen: code.length,
    hatUpPin: code.indexOf("window.__upPin") >= 0,
    hatFilter: code.indexOf('filters/date-range.css') >= 0
  };
  code = code.replace('var PIN = "CDN_' + 'PIN";', 'var PIN = "' + PIN_EL + '";');
  /* Eine fertige Fassung traegt den Pin schon -- dann steht dort ein anderer als der des
     Prueftands, und die Element-Loader unten muessen denselben benutzen, sonst prueft der Test
     nicht die Entdoppelung, sondern zwei verschiedene Pins. */
  var mPin = /upstreem-ui@" \+ PIN|var PIN = "([0-9a-f]{7,40})"/.exec(code);
  if (mPin && mPin[1]) PIN_EL = mPin[1];
  window.__snippet.pinGesetzt = code.indexOf(PIN_EL) >= 0;
  (new Function(code))();
})();
</script>

<script>
/* ---- Die Element-Loader in BEIDEN Generationen ----------------------------------------------
   Das war der Fehler im ersten Kontrolltest: hier stand nur die NEUERE Fassung (entdoppelt nach
   Dateiname), und die traf zufaellig die einzige Schluesselform, die das Snippet damals eintrug.
   In der laufenden App sind 59 von 67 Eintraegen ganze URLs -- also die AELTERE Fassung. Beide
   muessen null Dateien nachladen; was sie doch laden, steht unten namentlich da. */
window.__warnungen = [];
var echteWarnung = console.warn;
console.warn = function(){ window.__warnungen.push([].join.call(arguments, " ")); echteWarnung.apply(console, arguments); };
var BASE_EL;

BASE_EL = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + PIN_EL + "/";
function hole(url){
  if (/\.css$/.test(url)){ var l=document.createElement("link"); l.rel="stylesheet"; l.href=url; document.head.appendChild(l); }
  else { var s=document.createElement("script"); s.src=url; s.async=false; document.head.appendChild(s); }
}
/* ALT: Schluessel ist die ganze URL. */
function loaderAlt(dateien){
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  var geladen = [];
  dateien.forEach(function(f){
    var url = BASE_EL + f;
    if (L[url]) return;
    L[url] = url; hole(url); geladen.push(f);
  });
  return geladen;
}
/* NEU: Schluessel ist der Dateiname. */
function loaderNeu(dateien){
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  var geladen = [];
  dateien.forEach(function(f){
    var url = BASE_EL + f, name = url.slice(url.lastIndexOf("/") + 1);
    if (L[name]){
      if (L[name] !== url && window.console) console.warn("upstreem: " + name + " ist schon von einem anderen Pin geladen.");
      return;
    }
    L[name] = url; hole(url); geladen.push(f);
  });
  return geladen;
}

function messen(){
  var r = performance.getEntriesByType("resource").filter(function(e){ return e.name.indexOf("upstreem-ui@") >= 0; });
  var kurz = function(e){ return e.name.replace(/^.*upstreem-ui@[^/]+\//, ""); };
  var roh = r.filter(function(e){ return e.name.indexOf(".min.") < 0; });
  var reg = window.__upAssetsLoaded || {};
  var UC = window.UpstreemCore;
  /* ROH duerfen GENAU ZWEI sein: core.css und core.js holt das Snippet absichtlich
     unminifiziert (Begruendung dort). Jede weitere rohe Datei heisst, dass ein Element-Loader
     nachgeladen hat -- und genau das soll dieser Prueftand fangen. */
  var rohOhneKern = roh.map(kurz).filter(function(n){ return n !== "core.css" && n !== "core.js"; });
  var urteil = [];
  urteil.push((window.__snippet && window.__snippet.hatUpPin && window.__snippet.hatFilter)
    ? "FRISCH: das echte Snippet ist geladen"
    : "ABBRUCH: das geladene Snippet ist zu alt (Marker fehlen) -- alle Zahlen wertlos");
  urteil.push(rohOhneKern.length === 0
    ? "RICHTIG: kein Element-Loader hat eine rohe Datei nachgeholt"
    : "FALSCH: roh nachgeladen -> " + rohOhneKern.join(", "));
  urteil.push((window.__altGeladen||[]).length === 0 && (window.__neuGeladen||[]).length === 0
    ? "RICHTIG: beide Loader-Generationen laden null Dateien"
    : "FALSCH: ALT " + JSON.stringify(window.__altGeladen) + "  NEU " + JSON.stringify(window.__neuGeladen));
  urteil.push(window.__upPin === PIN_EL
    ? "RICHTIG: window.__upPin steht -- ein Element mit leerem data-cdn-pin erbt ihn"
    : "FALSCH: window.__upPin fehlt (" + window.__upPin + ")");
  var dp = window.__doppelProbe || {};
  urteil.push(dp.gelaufen === 0
    ? "RICHTIG: die Datei eines alten Loaders wurde NICHT ausgefuehrt (nacktes Script im Kopf)"
    : "FALSCH: \"" + dp.name + "\" ist " + dp.gelaufen + "x GELAUFEN" +
      (dp.nochImDokument ? " -- und der Waechter hat den Tag nicht einmal entfernt"
                         : " -- OBWOHL der Waechter den Tag entfernt hat: Entfernen bricht die " +
                           "Ausfuehrung eines dynamisch eingehaengten Scripts nicht ab"));
  /* DIE SORTE, DIE AUF DER ECHTEN SEITE VORKOMMT. Der Bericht vom 05.09. zeigte 17 abgewehrte
     core.js -- und ALLE 17 in der Form, die der Beobachter NACH dem Einhaengen entfernt, keine
     einzige vor dem Einhaengen verweigert. Der Grund steht in der Sperre selbst: sie prueft den
     eingehaengten Knoten, und Bubble haengt das Script nicht nackt ein, sondern als Kind eines
     Teilbaums (Stack cleanChildren/insertExpression). Ein Container hat keine src, also greift
     die Sperre nicht -- und der Beobachter kommt zu spaet, weil ein eingehaengtes Script sich
     durch Entfernen nicht mehr anhalten laesst.
     Drei Formen, alle drei kommen in Bubble vor. */
  (window.__teilbaumProben || []).forEach(function(pr){
    urteil.push(pr.gelaufen === 0
      ? "RICHTIG: " + pr.was + " -- nicht ausgefuehrt"
      : "FALSCH: " + pr.was + " -- " + pr.gelaufen + "x GELAUFEN" +
        (pr.nochImDokument ? " (Tag steht noch im Dokument)" : " (Tag wurde entfernt, zu spaet)"));
  });
  urteil.push(document.querySelectorAll('script[src*="/core."]').length === 1
    ? "RICHTIG: genau EIN core-Script im Kopf"
    : "FALSCH: " + document.querySelectorAll('script[src*="/core."]').length + " core-Scripts");
  document.getElementById("out").textContent = urteil.join("\n") + "\n\n" + JSON.stringify({
    snippet: window.__snippet,
    dateien_gesamt: r.length,
    minifiziert: r.filter(function(e){ return e.name.indexOf(".min.") >= 0; }).length,
    roh: roh.length,
    roh_namen: roh.map(kurz),
    nachgeladen_ALT: window.__altGeladen,
    nachgeladen_NEU: window.__neuGeladen,
    warnungen: window.__warnungen,
    registry_schluessel: Object.keys(reg).length,
    davon_urls: Object.keys(reg).filter(function(k){ return k.indexOf("http") === 0; }).length,
    kern_laeuft: !!UC, kern_teile: UC ? Object.keys(UC).length : 0,
    kern_probe: UC && UC.fmtPct ? UC.fmtPct(34.25, 1) : null,
    kern_einmal: document.querySelectorAll('script[src*="core"]').length
  }, null, 1);
}
/* ---- DIE FRAGE AUS DEM REPORT VOM 05.09. ---------------------------------------------------
   Auf der echten Seite wurde core.js 17x eingehaengt: 1x vom Kopf-Snippet, 16x von
   Element-Loadern, die die Registry nicht benutzen. Der Doppel-Waechter im Snippet NIMMT diese
   Tags wieder aus dem Dokument -- und trotzdem meldete der Trace 17 Evaluierungen.

   Also die Probe: ein Loader der aeltesten Sorte haengt eine Datei ein, deren Name das Snippet
   schon geholt hat. Danach wird gezaehlt, ob sie GELAUFEN ist. Die Datei liegt lokal unter einem
   Pfad mit "upstreem-ui@" darin, damit der Waechter sie fuer eine unserer haelt. */
function alteGeneration(){
  var s = document.createElement("script");
  /* OHNE Query. Der erste Anlauf hatte "?n=..." dran -- damit heisst die Datei fuer den
     Waechter "core.js?n=0.49..." und stand nicht in seiner Liste: er hat sie gar nicht
     angefasst. Das ist ein eigener Fund (die Namensermittlung schneidet den Query nicht ab),
     aber nicht die Frage hier. Ohne Query trifft der Waechter zu -- und erst dann sagt die
     Zahl, ob Entfernen die Ausfuehrung verhindert. */
  s.src = "_h_fake/upstreem-ui@testpin/core.js";
  document.head.appendChild(s);
  return s;
}
/* Die drei Formen, in denen ein Script als Teil eines Teilbaums hereinkommt. Gezaehlt wird immer
   dasselbe: hat die Datei GELAUFEN. window.__coreLaeufe erhoeht sich in der Datei selbst. */
function teilbaumProbe(was, einhaengen){
  var vorher = window.__coreLaeufe || 0;
  var s = document.createElement("script");
  s.src = "_h_fake/upstreem-ui@testpin/core.js";
  var traeger = einhaengen(s);
  return function(){
    return { was: was, gelaufen: (window.__coreLaeufe || 0) - vorher,
             nochImDokument: !!(s.parentNode), traeger: traeger };
  };
}
window.addEventListener("load", function(){
  /* Wie in Bubble: die Element-Loader laufen NACH dem Seitenaufbau. Zwei Elemente der alten
     Generation, zwei der neuen -- alle vier fordern Dateien, die das Snippet schon geholt hat. */
  setTimeout(function(){
    window.__altGeladen = loaderAlt(["core.css","core.js","brands-overview.css","brands-overview.js"])
      .concat(loaderAlt(["core.css","core.js","prompts-table.css","prompts-table.js"]));
    window.__neuGeladen = loaderNeu(["core.css","core.js","ask-mira.css","ask-mira.js"])
      .concat(loaderNeu(["core.css","core.js","sidebar.css","sidebar.js"]));
  }, 60);
  setTimeout(function(){
    window.__coreLaeufe = 0;
    var tag = alteGeneration();
    setTimeout(function(){
      window.__doppelProbe = {
        gelaufen: window.__coreLaeufe || 0,
        nochImDokument: !!(tag.parentNode),
        name: tag.src.slice(tag.src.lastIndexOf("/") + 1)
      };
    }, 900);
  }, 1200);
  /* Nach der nackten Probe, damit die Zaehler sich nicht ueberlagern. */
  /* EINE NACH DER ANDEREN, mit Pause. Der erste Anlauf hat alle drei im selben Tick eingehaengt
     und danach abgelesen -- jede Probe sah dann die Laeufe der anderen mit und meldete 3 statt 1.
     Die Aussage war dieselbe, die Zahl war Unsinn. */
  var FORMEN = [
    ["Script als Kind eines DIV, in den Kopf", function(s){
      var d = document.createElement("div"); d.appendChild(s); document.head.appendChild(d); }],
    ["Script in einem DocumentFragment, in den Kopf", function(s){
      var f = document.createDocumentFragment(); f.appendChild(s); document.head.appendChild(f); }],
    ["Script als Kind eines DIV, in den Koerper", function(s){
      var d = document.createElement("div"); d.appendChild(s); document.body.appendChild(d); }]
  ];
  window.__teilbaumProben = [];
  setTimeout(function(){
    (function naechste(i){
      if (i >= FORMEN.length) return;
      var lesen = teilbaumProbe(FORMEN[i][0], function(s){ FORMEN[i][1](s); return ""; });
      setTimeout(function(){
        window.__teilbaumProben.push(lesen());
        naechste(i + 1);
      }, 700);
    })(0);
  }, 2200);
  setTimeout(messen, 7000);
});
</script>
