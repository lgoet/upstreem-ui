<meta charset="utf-8"><title>response-detail</title>
<style>
  /* Form der echten Seite: der Koerper scrollt nicht, #main scrollt. */
  html, body { margin: 0; height: 100%; font-family: Geist, system-ui, sans-serif; }
  body { overflow: hidden; background: #fff; }
  #main { height: 100vh; overflow-y: auto; padding: 24px; box-sizing: border-box; }
  #bar { position: fixed; right: 12px; bottom: 12px; z-index: 999; display: flex; gap: 6px; flex-wrap: wrap; max-width: 62vw; }
  #bar button { font: 12px ui-monospace, monospace; padding: 6px 9px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  #out { position: fixed; left: 12px; bottom: 12px; z-index: 999; font: 11px ui-monospace, monospace;
         background: #111; color: #eee; padding: 8px; max-width: 34vw; max-height: 44vh; overflow: auto; white-space: pre-wrap; }
  .schmal #main { max-width: 560px; }
  .sehrschmal #main { max-width: 430px; }
</style>
<body>
<div id="main">
  <div class="up-root urd-root" data-instance="response_detail_page" data-isdark="no"
       id="wurzel"
       data-prompt-fn="bubble_fn_urdPrompt" data-brand-fn="bubble_fn_urdBrand"
       data-url-fn="bubble_fn_urdUrl" data-view-fn="bubble_fn_urdView"></div>
</div>
<div id="bar">
  <button onclick="laden('URD_AIO')">AIO</button>
  <button onclick="laden('URD_CHATGPT')">ChatGPT</button>
  <button onclick="laden('URD_PPLX')">Perplexity</button>
  <button onclick="setResponseDetailLoading('response_detail_page','yes')">loading</button>
  <button onclick="resetResponseDetail('response_detail_page')">reset</button>
  <button onclick="thema()">dark/light</button>
  <button onclick="document.body.classList.toggle('schmal')">schmal</button>
  <button onclick="document.body.classList.toggle('sehrschmal')">sehr schmal</button>
  <button onclick="mess().then(function(t){document.getElementById('out').textContent=t;})">MESSEN</button>
</div>
<pre id="out">laeuft</pre>
<script>
window.__ev = []; window.__fehler = []; window.__warn = [];
window.addEventListener("error", function(e){ window.__fehler.push(String(e.message)); });
(function(){ var w = console.warn; console.warn = function(){ window.__warn.push([].join.call(arguments," ")); w.apply(console, arguments); }; })();
["urdPrompt","urdBrand","urdUrl","urdView"].forEach(function(n){ window["bubble_fn_"+n] = function(p){ window.__ev.push([n, p]); }; });
/* Der Modell-Store der Seite: dieselbe Form, die setModels erwartet. */
window.__MODELS = [
  { key: "chatgpt",    display_name: "ChatGPT",
    logo_url: "https://cdn-icons-png.freepik.com/512/12222/12222588.png" },
  { key: "google-aio", display_name: "Google AI Overviews", short_name: "Google AIO",
    logo_url: "https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" },
  { key: "perplexity", display_name: "Perplexity",
    logo_url: "https://www.google.com/s2/favicons?domain=perplexity.ai&sz=64" }
];
/* Thema und Startbeispiel kommen aus der Adresse: so hat jeder Lauf EINEN Zustand, statt
   mitten in der Messung umzuschalten. */
window.__P = new URLSearchParams(location.search);
var __dunkel = window.__P.get("dark") === "1";
try { localStorage.setItem("pref_theme", __dunkel ? "dark" : "light"); } catch(e){}
document.getElementById("wurzel").setAttribute("data-isdark", __dunkel ? "yes" : "no");
</script>
<script src="_h_urd_daten.js"></script>
<script>
/* Frische beweisen statt hoffen: alles per fetch(no-store) inline, kein <link>/<script src>. */
window.__GELADEN = Promise.all(["core.css","response-detail.css","core.js","response-detail.js"].map(function(f){
  return fetch(f + "?n=" + Math.random(), { cache: "no-store" }).then(function(r){ return r.text(); })
    .then(function(t){ return [f, t]; });
})).then(function(paare){
  paare.forEach(function(p){
    var e = document.createElement(/\.css$/.test(p[0]) ? "style" : "script");
    e.textContent = p[1]; document.head.appendChild(e);
  });
});

function laden(name){ window.setResponseDetail("response_detail_page", JSON.stringify(window[name])); }
function thema(){
  var r = document.querySelector(".urd-root");
  window.setUpstreemTheme(r.getAttribute("data-theme") === "dark" ? "light" : "dark");
}
window.__GELADEN.then(function(){
  setTimeout(function(){
    /* Modelle in den seitenweiten Store, wie es die echte Seite beim Pageload tut. */
    if (window.setUpstreemModels) window.setUpstreemModels(JSON.stringify(window.__MODELS));
    else if (window.UpstreemCore && window.UpstreemCore.setModels) window.UpstreemCore.setModels(window.__MODELS);
    laden(window.__P.get("bsp") || "URD_AIO");
    setTimeout(function(){ window.__bereit = true; }, 500);
  }, 300);
});

function mess(){
  return new Promise(function(r){
    var root = document.querySelector(".urd-root");
    function q(s){ return root.querySelector(s); }
    function txt(s){ var e = q(s); return e ? e.textContent.trim() : null; }
    var res = {
      fehler: window.__fehler,
      warnungen: window.__warn,
      ereignisse: window.__ev,
      klassen: root.className,
      prompt: txt(".urd-prompt"),
      prompt_gekuerzt: (function(){ var e=q(".urd-prompt"); return e ? (e.scrollHeight > e.clientHeight + 1) : null; })(),
      kpis: [].map.call(root.querySelectorAll(".urd-kpis > *"), function(e){ return e.className + ":" + e.textContent.trim(); }),
      modell_logo: !!q(".urd-kpis .up-model-chip .up-ment-logo img"),
      flagge: !!q(".urd-kpis .up-flag img"),
      mentions: [].map.call(root.querySelectorAll(".urd-ment-name"), function(e){ return e.textContent; }),
      mention_logos: root.querySelectorAll(".urd-ment .up-logo-box.has-img").length,
      /* Der Antworttext */
      absaetze: root.querySelectorAll(".up-rb-p").length,
      ueberschriften: [].map.call(root.querySelectorAll(".up-rb-h"), function(e){ return e.textContent.slice(0,42); }),
      listen: root.querySelectorAll(".up-rb-list").length,
      listenpunkte: root.querySelectorAll(".up-rb-list li").length,
      tabellen: root.querySelectorAll(".up-rb-table").length,
      tabellen_spalten: [].map.call(root.querySelectorAll(".up-rb-table"), function(t){ return t.querySelectorAll("thead th").length; }),
      tabellen_zeilen: [].map.call(root.querySelectorAll(".up-rb-table"), function(t){ return t.querySelectorAll("tbody tr").length; }),
      zitate: root.querySelectorAll(".up-rb-cite").length,
      zitate_mit_id: [].filter.call(root.querySelectorAll(".up-rb-cite"), function(e){ return e.getAttribute("data-rb-id"); }).length,
      zitat_texte: [].map.call(root.querySelectorAll(".up-rb-cite-txt"), function(e){ return e.textContent; }).slice(0,4),
      marken_im_text: [].map.call(root.querySelectorAll(".up-rb-brand-txt"), function(e){ return e.textContent; }),
      /* Muell, der nicht mehr drinstehen darf */
      fussnoten_rest: (q(".up-rb") ? /\[\[\d+\]/.test(q(".up-rb").textContent) : null),
      laufmarken_rest: (q(".up-rb") ? /0;[0-9a-f]{1,6};/i.test(q(".up-rb").textContent) : null),
      roh_markdown: (q(".up-rb") ? /\]\(https?:\/\//.test(q(".up-rb").textContent) : null),
      /* Citations */
      kacheln: root.querySelectorAll(".urd-cite-card").length,
      zeilen: root.querySelectorAll(".urd-cite-row").length,
      spalten: q(".urd-cites-grid") ? getComputedStyle(q(".urd-cites-grid")).getPropertyValue("--urd-cols").trim() : null,
      raster_sichtbar: q(".urd-cites-grid") ? getComputedStyle(q(".urd-cites-grid")).display : null,
      liste_sichtbar: q(".urd-cites-list") ? getComputedStyle(q(".urd-cites-list")).display : null,
      erste_kachel: q(".urd-cc-title") ? q(".urd-cc-title").textContent.slice(0,44) : null,
      kachel_marken: root.querySelectorAll(".urd-cite-card .up-stack-item").length,
      /* Waagerechtes Ausbrechen: der Koerper darf nie breiter sein als sein Kasten */
      body_scrollt_quer: document.getElementById("main").scrollWidth > document.getElementById("main").clientWidth + 1,
      tabelle_scrollt_selbst: (function(){ var w=q(".up-rb-tablewrap");
        return w ? { scroll: w.scrollWidth, sicht: w.clientWidth, kann: w.scrollWidth > w.clientWidth } : null; })()
    };
    r(JSON.stringify(res, null, 1));
  });
}
</script>
