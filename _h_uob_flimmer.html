<!doctype html><meta charset="utf-8">
<title>Blinkende Quadrate: Ruhewert, Funkeln, Glaette, beide Themen</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne"></div>
<script>
/* Angefordert am 07.09.: an die Stelle der vier Sternmarken im Onboarding-Hintergrund das
   Flickering Grid von magicui -- "etwas spaceter als aktuell, deutlich smoother und etwas
   langsamer".

   ALLE DREI SIND VERGLEICHE, also wird verglichen: neben unserem Raster laeuft eine Nachbildung
   der VORLAGE (4px Kachel, 6px Luecke, flickerChance 0.3, jedes Bild ein Sprung, 60 Bilder je
   Sekunde). Ohne sie stuende hier "0.4 Alphastufen je Bild" -- eine Zahl ohne Bedeutung.

   DIE UHR WIRD VON HAND GEDREHT. requestAnimationFrame laeuft in der verdeckten Browserflaeche
   des Werkzeugs GAR NICHT -- gemessen: 0 Bilder in 300ms. Der erste Anlauf hat daraufhin fuer
   unser Raster UND fuer die Vorlage "0.000 Sprung" gemeldet und daraus einen Faktor NaN
   gerechnet; beides war die Umgebung und nicht der Code. Darum ersetzt der Prueftand rAF im
   Rahmen durch eine Warteschlange und ruft die Bilder selbst auf, mit einem dt, das er kennt.
   Das ist genauer als die echte Uhr: derselbe Ablauf ist wiederholbar, und "je Bild" heisst
   wirklich je Bild.

   GEMESSEN WIRD AM BILD, nicht am Zustand des Kits: die Pixel des Canvas sind, was der Nutzer
   sieht. Abstand und Kachel kommen aus den Pixelreihen, die Glaette aus dem Unterschied zweier
   aufeinanderfolgender Bilder, die Farbe aus einem gefuellten Pixel. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
var gut=0, schlecht=0;
function pruef(t,b){ if(b) gut++; else schlecht++; log("   "+ja(b)+" "+t); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok,ms); }); }

Promise.all([hol("core.css"), hol("core.js"), hol("onboarding-page.css")]).then(function(t){
  var f=document.createElement("iframe");
  f.style.cssText="width:900px;height:900px;border:1px solid #ccc;display:block";
  document.getElementById("buehne").appendChild(f);
  var d=f.contentDocument, v=f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  /* Das Thema ausdruecklich: pref_theme gehoert dem Ursprung, und core gewinnt gegen ein von
     Hand gesetztes data-theme. Der erste Anlauf hat im "dunklen" Abschnitt die hellen Farben
     gemessen, weil ein anderer Prueftand pref_theme auf light gestellt hatte. */
  try { v.localStorage.clear(); v.localStorage.setItem("pref_theme","dark"); } catch(e){}
  [t[0], t[2]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });

  /* ---- DIE UHR. Eingehaengt VOR core.js, damit auch das Kit sie nimmt. ---- */
  var warteschlange=[], zeit=0, echteRaf=v.requestAnimationFrame;
  v.requestAnimationFrame=function(fn){ warteschlange.push(fn); return warteschlange.length; };
  v.cancelAnimationFrame=function(){ };
  function bilder(n, dtMs, jeBild){
    for (var i=0;i<n;i++){
      zeit+=dtMs;
      var jetzt=warteschlange; warteschlange=[];
      for (var k=0;k<jetzt.length;k++){ try { jetzt[k](zeit); } catch(e){} }
      if (jeBild) jeBild(i);
    }
  }
  /* document.hidden AUCH VON HAND. Das Kit haelt an, wenn der Tab verdeckt ist -- und die
     Browserflaeche des Werkzeugs IST verdeckt, sobald hier JavaScript ausgewertet wird. Der
     erste Anlauf mit gedrehter Uhr meldete daraufhin "groesster Sprung 0" fuer unser Raster und
     74 fuer die Vorlage (die nicht auf document.hidden schaut): kein Ergebnis, sondern die
     Umgebung. Also wird die Verdeckung hier gesetzt, und beide Faelle werden gemessen. */
  var verdeckt = false;
  try { Object.defineProperty(d, "hidden", { get: function(){ return verdeckt; } }); } catch(e){}

  v.performance = v.performance || {};
  var echtesNow = v.performance.now ? v.performance.now.bind(v.performance) : function(){ return Date.now(); };
  try { v.performance.now = function(){ return zeit; }; } catch(e){}

  var wurzel=d.createElement("div");
  wurzel.className="up-root uob-root"; wurzel.setAttribute("data-theme","dark");
  wurzel.style.cssText="position:relative;width:720px;height:420px;background:#1c1c1f";
  wurzel.innerHTML='<span class="up-bgart-flimmer" data-flimmer></span>';
  d.body.appendChild(wurzel);
  var sc=d.createElement("script"); sc.textContent=t[1]; d.head.appendChild(sc);

  return warte(400).then(function(){
    var UC=v.UpstreemCore;
    if (!UC || !UC.makeFlickerGrid){ log("ABBRUCH: UC.makeFlickerGrid fehlt"); return; }
    if (v.setUpstreemTheme) v.setUpstreemTheme("dark");
    var host=wurzel.querySelector("[data-flimmer]");
    /* Die ANGEFORDERTEN Zahlen (07.09., woertlich aus dem Aufruf des Nutzers):
       squareSize 3, gridGap 20, flickerChance 0.05, maxOpacity 0.4. Dazu fadeMs -- das ist das
       "smoother", magicui hat dafuer keine Angabe, weil es dort keine Fahrt gibt. */
    var kit=UC.makeFlickerGrid(host, { squareSize:3, gap:20, blinksPerSecond:0.2,
      blinkMs:1100, baseOpacity:0.10, maxOpacity:0.4, fps:30 });
    var cv=host.querySelector("canvas");

    log("1  Es malt ueberhaupt");
    pruef("ein Canvas liegt in der Huelle", !!cv);
    if (!cv){ log("ABBRUCH"); return; }
    var r=cv.getBoundingClientRect();
    log("      Canvas " + Math.round(r.width) + "x" + Math.round(r.height) +
        "   Puffer " + cv.width + "x" + cv.height +
        "   Geraetefaktor " + (v.devicePixelRatio||1));
    pruef("es deckt die Huelle", Math.abs(r.width-720)<1 && Math.abs(r.height-420)<1);
    pruef("der Puffer laeuft hoechstens mit Faktor 1.5 (" +
      (cv.width/Math.round(r.width)).toFixed(2) + ")", cv.width/Math.round(r.width) <= 1.51);
    var ctx=cv.getContext("2d");
    var faktor=cv.width/Math.round(r.width);
    function alphaFeld(cvx){
      var b=cvx.getContext("2d").getImageData(0,0,cvx.width,cvx.height).data;
      var a=new Uint8Array(cvx.width*cvx.height);
      for (var i=0;i<a.length;i++) a[i]=b[i*4+3];
      return a;
    }
    /* UEBER EINE SEKUNDE MESSEN, nicht im ersten Bild. Beim Aufbau stehen fast alle Zellen auf
       dem Ruhewert -- der erste Anlauf las darum "groesste Deckkraft 28" und meldete, das Kit
       halte die angeforderten 0.4 nicht ein. Der Gipfel entsteht MITTEN in einem Blinken, also
       muss die Messung ein paar Bilder mitlaufen. */
    bilder(30, 34);
    var feld=alphaFeld(cv);
    var maxUeberZeit=0;
    for (var mz=0; mz<8; mz++){
      bilder(4, 34);
      var f2=alphaFeld(cv);
      for (var iz=0; iz<f2.length; iz++) if (f2[iz]>maxUeberZeit) maxUeberZeit=f2[iz];
    }
    var gefuellt=0; for (var i=0;i<feld.length;i++) if (feld[i]>0) gefuellt++;
    log("      gefuellte Pixel: " + gefuellt + " von " + feld.length +
        " (" + (100*gefuellt/feld.length).toFixed(1) + "%)  -- ob das die richtige Zahl " +
        "ist, rechnet Abschnitt 2 aus dem gemessenen Raster");
    /* Die Erwartung wird aus den GEMESSENEN Laufweiten gerechnet und nicht aus 5 und 18: bei
       Geraetefaktor 1.5 rundet das Kit auf ganze Pufferpixel (8 von 27), und (8/27)^2 sind 8.8
       Prozent, nicht 7.7. Der erste Anlauf hat 7.7 erwartet und die Rundung als Fehler
       gemeldet -- die Rundung ist aber der Grund, warum die Kanten hart sind. */
    var lwAll=null;
    var maxA=maxUeberZeit;
    log("      groesste gemalte Deckkraft in einer Sekunde: " + maxA +
        " von 255  (angefordert 0.4 -> 102)");
    var minA=255; for (var im2=0;im2<feld.length;im2++) if (feld[im2]>0 && feld[im2]<minA) minA=feld[im2];
    log("      kleinste gemalte Deckkraft: " + minA + " von 255  (Ruhewert 0.10 -> 26)");
    pruef("es malt mit hoechstens 0.4 Deckkraft, wie angefordert",
      maxA <= 103 && maxA >= 88);
    pruef("und der Ruhewert traegt das Raster (0.10 -> etwa 26)",
      minA >= 20 && minA <= 32);
    log("");

    log("2  Abstand und Kachelgroesse, aus den Pixeln gelesen");
    var bild=ctx.getImageData(0,0,cv.width,cv.height);
    function laufweiten(y){
      var an=[], aus=[], zaehl=0, letzter=null;
      for (var x=0;x<cv.width;x++){
        var a=bild.data[(y*cv.width+x)*4+3]>0;
        if (letzter===null){ letzter=a; zaehl=1; continue; }
        if (a===letzter){ zaehl++; continue; }
        (letzter?an:aus).push(zaehl); letzter=a; zaehl=1;
      }
      return { an:an, aus:aus };
    }
    function haeufigste(a){
      var z={}, best=null;
      a.forEach(function(x){ z[x]=(z[x]||0)+1; if(!best||z[x]>z[best])best=x; });
      return best==null?0:Number(best);
    }
    var lw=laufweiten(Math.round(2*faktor));
    var pixK=haeufigste(lw.an), pixS=pixK+haeufigste(lw.aus);
    var kachel=pixK/faktor, luecke=haeufigste(lw.aus)/faktor;
    var erwartet=100*Math.pow(pixK/pixS,2);
    log("      Puffer: Kachel " + pixK + "px, Abstand " + pixS + "px  -> erwartete Flaeche " +
        erwartet.toFixed(1) + "%,  gemessen " + (100*gefuellt/feld.length).toFixed(1) + "%");
    pruef("die gemalte Flaeche stimmt mit dem gemessenen Raster ueberein",
      Math.abs(100*gefuellt/feld.length - erwartet) < 0.6);
    pruef("die Kachel liegt auf ganzen Pufferpixeln (harte Kanten)", pixK === Math.round(pixK));
    log("      haeufigste Laufweite AN " + kachel.toFixed(1) + "px,  AUS " + luecke.toFixed(1) +
        "px   -> Abstand " + (kachel+luecke).toFixed(1) + "px   (magicui: 4 + 6 = 10px)");
    pruef("Kachel 3px, wie angefordert", Math.abs(kachel-3)<0.7);
    pruef("Abstand 23px (3 + 20), wie angefordert", Math.abs(kachel+luecke-23)<1.2);
    log("");

    /* ---- 3  GLAETTE UND GESCHWINDIGKEIT, mit gedrehter Uhr und gegen die Vorlage ---- */
    log("3  Glaette: wie weit springt ein Pixel von einem Bild zum naechsten?");
    /* Die Nachbildung der Vorlage. Sie haengt an derselben Uhr, damit "je Bild" fuer beide
       dasselbe heisst -- nur laeuft sie mit 60 Bildern, wie magicui. */
    var cv2=d.createElement("canvas");
    cv2.width=cv.width; cv2.height=cv.height;
    cv2.style.cssText="position:absolute;left:0;top:430px;width:720px;height:420px;background:#1c1c1f";
    d.body.appendChild(cv2);
    (function vorlage(){
      var c=cv2.getContext("2d"), schritt=10*faktor, k=4*faktor;
      var sp=Math.ceil(cv2.width/schritt), ze=Math.ceil(cv2.height/schritt);
      var o=new Float32Array(sp*ze);
      for (var i=0;i<o.length;i++) o[i]=Math.random()*0.3;
      function malen(){
        /* magicui: je Bild und Zelle mit flickerChance * dt ein SOFORTIGER neuer Wert. */
        for (var i=0;i<o.length;i++) if (Math.random() < 0.3*(1/60)) o[i]=Math.random()*0.3;
        c.clearRect(0,0,cv2.width,cv2.height);
        for (var y=0;y<ze;y++) for (var x=0;x<sp;x++){
          var a=o[y*sp+x]; if (a<=0.002) continue;
          c.fillStyle="rgba(224,224,224,"+a+")";
          c.fillRect(x*schritt,y*schritt,k,k);
        }
        v.requestAnimationFrame(malen);
      }
      v.requestAnimationFrame(malen);
    })();

    function sprungReihe(cvx, n, dtMs){
      /* ZWEI BILDER WARMLAUFEN, bevor gemessen wird. Das Kit laesst Bilder aus, deren dt unter
         1/TAKT liegt, und es merkt sich dabei die vergangene Zeit -- kommt der Prueftand aus
         einem Abschnitt mit kuerzerem Takt (die Vorlage laeuft mit 60), traegt das erste
         gemessene Bild einen Rest von bis zu 33ms zusaetzlich. Genau daran ist die Schranke im
         ersten Anlauf gerissen: gemessen 26 gegen eine fuer 67ms gerechnete Schranke von 22.4,
         weil das erste Bild in Wahrheit 100ms trug. Zwei Bilder Vorlauf verbrauchen den Rest. */
      bilder(2, dtMs);
      var vor=alphaFeld(cvx), summe=0, zahl=0, groesster=0;
      bilder(n, dtMs, function(){
        var jetzt=alphaFeld(cvx), s=0, m=0;
        for (var i=0;i<vor.length;i+=7){
          var dd=Math.abs(jetzt[i]-vor[i]); s+=dd; if (dd>groesster) groesster=dd; m++;
        }
        summe+=s/m; zahl++; vor=jetzt;
      });
      return { mittel: summe/Math.max(1,zahl), max: groesster };
    }
    /* Unser Raster mit 30 Bildern (das ist sein Takt), die Vorlage mit 60. Verglichen wird der
       Sprung JE BILD -- das ist, was das Auge als Zucken sieht. */
    /* 34ms UND NICHT GENAU 1000/30. Das Kit laesst ein Bild aus, wenn dt unter 1/TAKT liegt --
       und bei genau 1000/30 entscheidet das Rundungsverhalten der Fliesskommazahl, ob es
       darunter liegt. Dann traegt das naechste Bild das doppelte dt, die Fahrt macht einen
       doppelten Schritt, und die Messung meldete 20 statt der gerechneten 12.9. Das ist echtes
       Verhalten (auf einer beschaeftigten Seite fallen Bilder aus, und die Fahrt behaelt dann
       ihre Dauer in Sekunden statt in Bildern) -- nur ist es nicht der Takt, dessen Glaette hier
       geprueft wird. Der ausgelassene Fall steht darunter mit seiner eigenen Schranke. */
    var uns=sprungReihe(cv, 20, 34);
    var vgl=sprungReihe(cv2, 20, 1000/60);
    log("      unser Raster: im Mittel " + uns.mittel.toFixed(2) +
        " Alphastufen je Bild, groesster Sprung " + uns.max);
    log("      die Vorlage:  im Mittel " + vgl.mittel.toFixed(2) +
        " Alphastufen je Bild, groesster Sprung " + vgl.max);
    pruef("unser groesster Sprung ist deutlich kleiner als der der Vorlage (" +
      (vgl.max/Math.max(1,uns.max)).toFixed(1) + "-mal)", uns.max * 2 < vgl.max);
    /* DIE SCHRANKE IST GERECHNET, nicht gewuenscht. Zwei Dinge bewegen einen Pixel:
         die Fahrt      1-exp(-dt/tau) der Restspanne = 8.0 Prozent bei dt=1/30 und tau=400ms,
                        auf 0.25 Deckkraft also 0.020 -> 5.1 Alphastufen
         die Rundung    die gemalte Deckkraft liegt auf 32 Stufen, eine Stufe ist
                        0.25/32 -> 2.0 Alphastufen
       Zusammen 7.1. Der erste Anlauf hatte 12 Stufen und damit 5.3 Alphastufen je Stufe -- die
       Messung meldete 11, und die Schranke von 7 war falsch, nicht die Messung. Genau deshalb
       stehen jetzt 32 Stufen im Kit. Die Vorlage setzt in EINEM Bild bis zu 0.3, also 76. */
    /* Die Schranke fuer EIN BLINKEN. Die Kurve ist sin^2 ueber die Blinkdauer, ihre groesste
       Steigung ist Amplitude * PI / Dauer -- bei 0.3 Amplitude (Gipfel 0.4 minus Ruhe 0.10) und
       1.1s also 0.856 je Sekunde, in einem Bild bei 30 Bildern 0.0285, mal 255 also 7.3
       Alphastufen. Dazu eine Rundungsstufe (0.4/48 * 255 = 2.1). */
    var dt=1/30, stufen=48, dauer=1.1, amp=0.4-0.10;
    var schranke=255*(amp*Math.PI/dauer*dt) + 0.4*255/stufen;
    log("      gerechnete Schranke: " + schranke.toFixed(1) + " Alphastufen" +
        "  (steilste Stelle des Blinkens " + (255*(amp*Math.PI/dauer*dt)).toFixed(1) +
        " + eine Rundungsstufe " + (0.4*255/stufen).toFixed(1) + ")");
    pruef("und liegt unter der gerechneten Schranke", uns.max <= Math.ceil(schranke));
    /* Und der Fall mit ausgelassenem Bild, damit auch er eine Zahl hat statt eine Ueberraschung
       zu sein: doppeltes dt, also doppelter Schritt. */
    var unsLang=sprungReihe(cv, 10, 67);
    var schranke2=255*(amp*Math.PI/dauer*2*dt) + 0.4*255/stufen;
    log("      mit ausgelassenem Bild (dt doppelt): groesster Sprung " + unsLang.max +
        ", Schranke " + schranke2.toFixed(1));
    pruef("auch mit ausgelassenem Bild bleibt es unter seiner Schranke",
      unsLang.max <= Math.ceil(schranke2));
    log("");

    log("4  Geschwindigkeit -- und zwar in BEIDE Richtungen");
    /* HIER LAG DER FEHLER. Abschnitt 4 hat nur "langsamer als die Vorlage" geprueft, und das
       war eine einseitige Schwelle: ein Bild, das sich GAR NICHT bewegt, ist auch langsamer.
       Genau das ist ausgeliefert worden und wurde als "das ist ein statisches Bild" gemeldet --
       zu Recht, bei 0.05 Wechseln je Sekunde und 2.2s Fahrt bewegten sich 11 Prozent der Zellen
       mit 0.5 Alphastufen je Bild, also unter der Wahrnehmungsschwelle.
       Also wird jetzt beides gemessen: langsamer als die Vorlage UND sichtbar. Sichtbar heisst
       hier: welcher ANTEIL DER PUNKTE aendert innerhalb einer Sekunde seine Helligkeit um
       mindestens 2 Alphastufen. Und als Gegenprobe dasselbe an einem Canvas, das wirklich
       steht -- der muss 0 melden, sonst prueft die Messung nicht, was sie behauptet. */
    function bewegung(cvx, n, dtMs){
      var vor=alphaFeld(cvx);
      bilder(n, dtMs);
      var jetzt=alphaFeld(cvx), s=0, m=0, geaendert=0, punkte=0;
      for (var i=0;i<vor.length;i+=3){
        s+=Math.abs(jetzt[i]-vor[i]); m++;
        if (vor[i]>0 || jetzt[i]>0){ punkte++; if (Math.abs(jetzt[i]-vor[i])>=2) geaendert++; }
      }
      return { mittel: s/m, anteil: punkte ? 100*geaendert/punkte : 0 };
    }
    var b1=bewegung(cv, 30, 1000/30);
    var b2=bewegung(cv2, 60, 1000/60);
    /* Ein Standbild als Gegenprobe: derselbe Inhalt, aber niemand malt es neu. */
    var cv3=d.createElement("canvas"); cv3.width=cv.width; cv3.height=cv.height;
    cv3.getContext("2d").drawImage(cv, 0, 0);
    var b3=bewegung(cv3, 30, 1000/30);
    log("      in einer Sekunde, Anteil der Punkte mit sichtbarer Aenderung:");
    log("        unser Raster " + b1.anteil.toFixed(1) + "%   (mittlere Bewegung " +
        b1.mittel.toFixed(2) + " Alphastufen je Pixel)");
    log("        die Vorlage  " + b2.anteil.toFixed(1) + "%   (" + b2.mittel.toFixed(2) + ")");
    log("        ein Standbild " + b3.anteil.toFixed(1) + "%   (" + b3.mittel.toFixed(2) +
        ")  <- die Gegenprobe");
    pruef("das Standbild meldet 0 -- die Messung prueft also wirklich Bewegung",
      b3.anteil === 0);
    pruef("unser Raster IST eine Animation: mehr als 15 Prozent der Punkte aendern sich je Sekunde",
      b1.anteil > 15);
    pruef("und es bewegt sich trotzdem weniger als die Vorlage", b1.mittel < b2.mittel);
    log("");

    log("4b  Ist es ein BLINKEN oder ein Zufallslauf?");
    /* Der Unterschied ist messbar und nicht Geschmack: beim Blinken RUHT eine Zelle die meiste
       Zeit auf dem Ruhewert und faehrt selten hoch -- die Verteilung der Deckkraft ist also
       stark am unteren Ende geballt. Beim Zufallslauf (Anlauf 2 und die Vorlage) sitzt jede
       Zelle auf einem beliebigen Zwischenwert, die Verteilung ist flach. Genau daran lag
       "sieht aus wie eine statische Textur".
       Gemessen wird der Anteil der Punkte, die auf dem Ruhewert stehen (Ruhe +/- 3 Alphastufen).
       Und die Vorlage wird mitgemessen: sie MUSS hier durchfallen, sonst prueft die Zahl nichts. */
    function anteilRuhe(cvx, ruheAlpha){
      var a=alphaFeld(cvx), punkte=0, ruhe=0;
      for (var i=0;i<a.length;i+=3){
        if (a[i]<=0) continue;
        punkte++; if (Math.abs(a[i]-ruheAlpha) <= 3) ruhe++;
      }
      return punkte ? 100*ruhe/punkte : 0;
    }
    var ruheAlpha=Math.round(0.10*255);
    var rUns=anteilRuhe(cv, ruheAlpha);
    var rVgl=anteilRuhe(cv2, ruheAlpha);
    log("      Anteil der Punkte auf dem Ruhewert (" + ruheAlpha + " von 255, +/- 3):");
    log("        unser Raster " + rUns.toFixed(1) + "%   <- die meisten ruhen, einzelne funkeln");
    log("        die Vorlage  " + rVgl.toFixed(1) + "%   <- flach verteilt, kein Ruhewert");
    pruef("die Mehrheit der Punkte steht auf dem Ruhewert (ueber 60 Prozent)", rUns > 60);
    pruef("und die Vorlage tut das NICHT -- die Zahl unterscheidet also die zwei Modelle",
      rVgl < 20);
    var iB=kit.info();
    log("      info(): " + iB.blinkenJetzt + " von " + iB.zellen + " Zellen blinken gerade (" +
        (100*iB.blinkenJetzt/iB.zellen).toFixed(1) + "%),  gerechnet " +
        (100*Math.min(1, iB.blinkenJeSekunde*iB.blinkMs/1000)).toFixed(0) + "%");
    pruef("es blinken so viele Zellen wie gerechnet",
      Math.abs(100*iB.blinkenJetzt/iB.zellen - 100*iB.blinkenJeSekunde*iB.blinkMs/1000) < 12);
    log("");

    log("4c  Die Maske: wie gross ist die freie Mitte?");
    /* GEMESSEN WIRD DIE ANGABE, nicht das Bild. Die Maske wirkt beim Zeichnen der Seite, nicht
       im Canvas -- getImageData sieht sie also nie. Was hier geprueft werden KANN, ist zweierlei
       und beides ist etwas wert: dass die geladene CSS wirklich die neue Geometrie traegt (der
       Frischebeweis aus CLAUDE.md 3), und was diese Geometrie in PIXELN bedeutet. Das Urteil
       darueber, ob es ruhig genug wirkt, faellt am Blick -- _h_uob_flimmer_blick.html, im
       Hellen, denn dort war es gemeldet. */
    var maske=v.getComputedStyle(host).maskImage || v.getComputedStyle(host).webkitMaskImage || "";
    /* AUS DEM GERECHNETEN WERT und nicht aus dem Quelltext: der Browser normt "transparent" zu
       rgba(0, 0, 0, 0) und die Kurzform "ellipse" verschwindet, sobald zwei Radien dastehen.
       Der erste Anlauf suchte nach dem Wort "transparent" und fand null davon -- und las den
       freien Stopp an der falschen Stelle (die Zahlenliste beginnt mit den Radien UND der
       Position, der Stopp ist erst der sechste Wert). Beides gemessen am eigenen Ausdruck statt
       am gewuenschten. */
    var zahlen=(maske.match(/(\d+(?:\.\d+)?)%/g)||[]).map(parseFloat);
    var klarStopps=(maske.match(/rgba\(0,\s*0,\s*0,\s*0\)\s+(\d+(?:\.\d+)?)%/g)||[]);
    var klarBis=0;
    klarStopps.forEach(function(x){ var m=x.match(/(\d+(?:\.\d+)?)%/); if (m) klarBis=Math.max(klarBis, parseFloat(m[1])); });
    log("      " + maske.replace(/\s+/g," ").slice(0, 150));
    log("      freie Stopps: " + klarStopps.length + ", frei bis " + klarBis +
        " Prozent des Radius");
    pruef("die Maske hat eine FREIE MITTE und nicht nur einen Verlauf ab dem Mittelpunkt",
      klarStopps.length >= 2 && klarBis >= 20);
    /* Die Radien und die freie Zone in Pixeln, gerechnet fuer die Seitengroesse der App. */
    if (zahlen.length >= 6){
      var rx=zahlen[0]/100*1440, ry=zahlen[1]/100*890, klar=klarBis/100;
      function anteil(dx){ return dx <= klar*rx ? 0 : Math.min(1,(dx-klar*rx)/(rx-klar*rx)); }
      log("      auf 1440x890: Radien " + Math.round(rx) + " x " + Math.round(ry) +
          ", voll frei bis " + Math.round(klar*rx) + " x " + Math.round(klar*ry) + "px");
      log("      Maskenstaerke bei 240px von der Mitte (Rand des Textblocks): " +
          Math.round(100*anteil(240)) + "%   bei 480px (Rand der Karte): " +
          Math.round(100*anteil(480)) + "%");
      pruef("hinter dem Textblock (240px) ist die Flaeche vollstaendig frei", anteil(240) === 0);
      pruef("und am Rand der Karte (480px) noch unter einem Drittel", anteil(480) < 0.34);
    }
    log("");

    log("5  Farbe und Gewicht je Thema");
    function ersteFarbe(){
      var b=ctx.getImageData(0,0,cv.width,cv.height).data;
      for (var i=0;i<b.length;i+=4) if (b[i+3]>40) return [b[i],b[i+1],b[i+2],b[i+3]];
      return null;
    }
    var dunkel=ersteFarbe(), opDunkel=v.getComputedStyle(host).opacity;
    log("      dunkel: Thema am Element \"" + wurzel.getAttribute("data-theme") +
        "\"   gemalt rgb(" + (dunkel?dunkel.slice(0,3).join(","):"-") + ")   Ebene " + opDunkel);
    pruef("im Dunkeln malt es hell (die Textfarbe des dunklen Themas)",
      !!dunkel && dunkel[0] > 200 && dunkel[1] > 200);
    /* KEINE Daempfung mehr ueber die Ebene: angefordert ist maxOpacity 0.4 als die Zahl, die
       magicui auch benutzt, und dort gibt es keine Ebene darueber. */
    pruef("die Ebene daempft nicht mehr (1)", Math.abs(parseFloat(opDunkel)-1)<0.01);
    if (v.setUpstreemTheme) v.setUpstreemTheme("light");
    return warte(300).then(function(){
      bilder(3, 1000/30);
      var hell=ersteFarbe(), opHell=v.getComputedStyle(host).opacity;
      log("      hell:   Thema am Element \"" + (wurzel.getAttribute("data-theme")||"(keins)") +
          "\"   gemalt rgb(" + (hell?hell.slice(0,3).join(","):"-") + ")   Ebene " + opHell);
      pruef("im Hellen malt es dunkel", !!hell && hell[0] < 80 && hell[1] < 80);
      pruef("auch im Hellen keine Daempfung (1)", Math.abs(parseFloat(opHell)-1)<0.01);
      log("");

        log("6  Verdeckter Tab: es haelt an und laeuft danach weiter");
      verdeckt = true;
      var vorV=alphaFeld(cv);
      bilder(20, 1000/30);
      var nachV=alphaFeld(cv), dV=0;
      for (var iv=0;iv<vorV.length;iv+=7) dV+=Math.abs(nachV[iv]-vorV[iv]);
      verdeckt = false;
      bilder(1, 1000/30);
      var vorW=alphaFeld(cv);
      bilder(20, 1000/30);
      var nachW=alphaFeld(cv), dW=0;
      for (var iw=0;iw<vorW.length;iw+=7) dW+=Math.abs(nachW[iw]-vorW[iw]);
      log("      Bewegung verdeckt " + dV + ",  danach sichtbar " + dW);
      pruef("verdeckt bewegt sich nichts", dV === 0);
      pruef("und sichtbar laeuft es weiter", dW > 0);
      log("");

      log("6b  info() am laufenden Kit");
      var i1=kit.info();
      bilder(10, 1000/30);
      var i2=kit.info();
      log("      Bilder " + i1.bilder + " -> " + i2.bilder + "   Zellen " + i2.zellen +
          "   Kachel " + i2.kachelPx + "px Abstand " + i2.abstandPx + "px (Puffer)" +
          "   Blinken/s " + i2.blinkenJeSekunde + "   Blinkdauer " + i2.blinkMs + "ms" +
          "   Ruhe " + i2.ruheDeckkraft + " Gipfel " + i2.maxDeckkraft);
      pruef("der Bildzaehler waechst -- daran ist von aussen zu sehen, dass es laeuft",
        i2.bilder > i1.bilder);
      pruef("und info() nennt kein Hindernis",
        i2.laeuft && i2.sichtbar && !i2.tabVerdeckt && !i2.ruhemodus);
      log("");

      log("7  Faellt die Huelle aus dem Dokument, endet die Schleife");
      /* Der Beweis ohne echte Uhr: die Warteschlange. Wer weiterlaufen will, legt in jedem Bild
         einen neuen Aufruf hinein. Unser Kit und die Vorlage sind zusammen zwei; nach dem
         Entfernen der Huelle darf nur noch die Vorlage nachlegen. */
      bilder(2, 1000/30);
      var vorher=warteschlange.length;
      host.parentNode.removeChild(host);
      bilder(3, 1000/30);
      var nachher=warteschlange.length;
      log("      Eintraege in der Warteschlange: vorher " + vorher + ", nachher " + nachher);
      pruef("nach dem Entfernen legt nur noch EINE Schleife nach (die Vorlage)",
        vorher === 2 && nachher === 1);
      log("");

      /* ---- 7  prefers-reduced-motion: EIN Bild, dann Schluss ---- */
      log("8  Bei prefers-reduced-motion bewegt sich nichts");
      var host2=d.createElement("span");
      host2.className="up-bgart-flimmer";
      host2.style.cssText="position:absolute;left:0;top:0;width:200px;height:120px";
      wurzel.appendChild(host2);
      var altMM=v.matchMedia;
      v.matchMedia=function(q){
        if (String(q).indexOf("reduced-motion") >= 0) return { matches:true, addListener:function(){}, addEventListener:function(){} };
        return altMM ? altMM.call(v, q) : { matches:false, addListener:function(){}, addEventListener:function(){} };
      };
      var q0=warteschlange.length;
      var kit2=UC.makeFlickerGrid(host2, { squareSize:5, gap:13, maxOpacity:0.25, fps:30 });
      var cv3=host2.querySelector("canvas");
      var vorRuhig=alphaFeld(cv3);
      var voll=0; for (var j=0;j<vorRuhig.length;j++) if (vorRuhig[j]>0) voll++;
      bilder(10, 1000/30);
      var nachRuhig=alphaFeld(cv3);
      var diff=0; for (var j2=0;j2<vorRuhig.length;j2++) diff+=Math.abs(nachRuhig[j2]-vorRuhig[j2]);
      log("      gefuellte Pixel " + voll + "   Bewegung nach 10 Bildern " + diff +
          "   neue Warteschlangen-Eintraege " + (warteschlange.length-q0));
      pruef("es steht EIN Bild da", voll > 200);
      pruef("und es bewegt sich nichts mehr", diff === 0);
      pruef("und es fragt kein einziges Bild an", warteschlange.length - q0 === 0);
      var inf=kit2.info ? kit2.info() : null;
      log("      info(): " + (inf ? JSON.stringify({ruhemodus:inf.ruhemodus, bilder:inf.bilder,
        laeuft:inf.laeuft, zellen:inf.zellen}) : "fehlt"));
      /* Die Auskunft muss den Grund NENNEN. "Es bewegt sich nichts" hat vier moegliche Gruende,
         und von aussen sehen alle gleich aus -- ohne diese Zeile ist die naechste Meldung
         wieder "das ist ein statisches Bild" und niemand kann sie beantworten. */
      pruef("und info() sagt, dass es der Ruhemodus ist", !!inf && inf.ruhemodus === true);
      v.matchMedia=altMM;
      log("");
      log((schlecht ? "==> FALSCH  " : "==> RICHTIG ")+gut+" von "+(gut+schlecht)+" Pruefungen");
      log("FERTIG");
    });
  });
}).catch(function(e){ log("ABBRUCH "+e+"\n"+(e&&e.stack||"")); });
</script>
