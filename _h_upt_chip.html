<!doctype html><meta charset="utf-8">
<title>Der Themen-Chip in der Prompts-Tabelle -- auch mit der alten Fassung dahinter</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne" style="position:absolute;left:-4000px;top:0"></div>
<script>
/* Gemeldet am 07.09.: "bei den Topics im Prompts Table sehe ich schon wieder das alte Styling mit
   den Borders um die 28px". Die Regeln in prompts-table.js hatten laengst border:0 -- aber auf
   derselben einen Klasse wie die aeltere, eigenstaendige UstTopics-Fassung, die auf derselben
   Bubble-Seite liegen kann. Bei gleicher Spezifitaet entscheidet die Ladereihenfolge.
   Dieser Prueftand haengt genau diese alte Fassung HINTER unsere und schaut, was gewinnt.
   Fall A ist der Alltag (nur wir), Fall B der gemeldete (die alte Kopie liegt dahinter). */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok,ms); }); }

/* Wortgleich die alte Fassung: eine Klasse, mit Rahmen, andere Polsterung. */
var ALT = '.ust-tag{height:28px;padding:0 10px;border-radius:8px;display:inline-flex;' +
          'align-items:center;gap:7px;border:1px solid color-mix(in srgb,var(--ust-tag-color,#6b7280) 35%,transparent);' +
          'background:color-mix(in srgb,var(--ust-tag-color,#6b7280) 10%,transparent);font-size:12px;}';

function fall(name, kernCss, kernJs, ptCss, ptJs, vorlage, altHinterher){
  var f = document.createElement("iframe");
  f.style.cssText = "width:1400px;height:400px;border:0";
  document.getElementById("buehne").appendChild(f);
  var d = f.contentDocument, v = f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  try { v.localStorage.setItem("pref_theme","dark"); } catch(e){}
  [kernCss, ptCss].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var roh = vorlage.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim();
  var w = d.createElement("div"); w.innerHTML = roh;
  var r = w.querySelector(".upt-root") || w.querySelector(".up-root") || w.firstElementChild;
  r.setAttribute("data-instance", "chip_" + name);
  r.setAttribute("data-cdn-pin","t"); r.setAttribute("data-isdark","yes");
  d.body.appendChild(r);
  [kernJs, ptJs].forEach(function(j){ var sc=d.createElement("script"); sc.textContent=j; d.head.appendChild(sc); });
  return warte(1500).then(function(){
    /* Erst NACH prompts-table.js, damit die alte Kopie wirklich dahinter liegt -- genau die
       Reihenfolge, die auf der Seite herauskommt, wenn das alte Element unten steht. */
    if (altHinterher){ var st=d.createElement("style"); st.id="ust-topics-style"; st.textContent=ALT; d.head.appendChild(st); }
    /* Ein Thema in die Zelle, damit es einen Chip zum Messen gibt. */
    var zelle = d.querySelector(".ust-cell") || d.querySelector(".upt-td-topics");
    if (!zelle) return { name:name, fehler:"keine .ust-cell in der Vorlage" };
    if (!zelle.classList.contains("ust-cell")) zelle.className += " ust-cell";
    zelle.setAttribute("data-theme","dark");
    zelle.innerHTML = '<span class="ust-row"><span class="ust-tag" style="--ust-tag-color:#3586e6">' +
                      '<span class="ust-tag-label">Preise</span></span></span>';
    return warte(120).then(function(){
      var chip = zelle.querySelector(".ust-tag");
      var c = v.getComputedStyle(chip);
      return { name:name,
               hoehe: Math.round(chip.getBoundingClientRect().height),
               rahmen: c.borderTopWidth + " " + c.borderTopStyle,
               breiteL: c.borderLeftWidth, polster: c.paddingLeft + " / " + c.paddingRight,
               lueckeGap: c.gap, flaeche: c.backgroundColor };
    });
  });
}

Promise.all([hol("core.css"), hol("core.js"), hol("prompts-table.css"), hol("prompts-table.js"),
             hol("bubble/prompts_table_bubble.html")]).then(function(t){
  function zeig(e, alt){
    if (e.fehler){ log("   ABBRUCH " + e.name + ": " + e.fehler); return false; }
    var ohne = parseFloat(e.breiteL) === 0 && e.rahmen.indexOf("none") >= 0 || parseFloat(e.breiteL) === 0;
    log("   " + e.name);
    log("      Hoehe " + e.hoehe + "px   Rahmen " + e.rahmen + " (links " + e.breiteL + ")");
    log("      Polster " + e.polster + "   Luecke " + e.lueckeGap + "   Flaeche " + e.flaeche);
    log("      " + ja(ohne) + " kein Rahmen");
    log("      " + ja(e.hoehe === 28) + " 28px hoch");
    log("      " + ja(e.polster === "12px / 9px") + " Polster wie .up-topicchip in core (12 / 9)");
    return ohne && e.hoehe === 28 && e.polster === "12px / 9px";
  }
  log("Der Chip in der Themenspalte, dunkel");
  log("");
  return fall("A  nur unsere Fassung", t[0],t[1],t[2],t[3],t[4], false).then(function(a){
    var okA = zeig(a);
    log("");
    return fall("B  die alte Fassung liegt DAHINTER", t[0],t[1],t[2],t[3],t[4], true).then(function(b){
      var okB = zeig(b);
      log("");
      log("==> " + ja(okA && okB) + "  beide Faelle gleich -- die Ladereihenfolge entscheidet nicht mehr");
      log("FERTIG");
    });
  });
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"")); });
</script>
