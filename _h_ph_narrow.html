<meta charset="utf-8"><title>seitenkopf schmal</title>
<style>html,body{margin:0;font:12px ui-monospace,monospace;background:#fff}
#buehne{width:420px;border:1px dashed #ccc}   /* breit: kein is-vnarrow */
#buehne.schmal{width:380px}
pre{white-space:pre-wrap;background:#111;color:#eee;padding:8px}</style>
<body><div id="buehne"><div class="up-root up-ph-root pph-root"
     data-instance="ph1"
     data-cdn-pin=""
     data-isdark="no"
     data-brand-name="Mercedes"
     data-brand-logo=""
     data-nav-fn="bubble_fn_pphNav"
     data-add-fn="bubble_fn_pphAdd"
     data-refresh-fn="bubble_fn_pphRefresh">
  <div class="up-ph-top">
    <div class="up-ph-left">
      <div class="up-ph-meta">
        <img class="up-ph-metalogo" alt="" style="display:none"/>
        <span class="up-ph-metatxt"><span class="pph-metaname"></span> Database</span>
      </div>
      <h1 class="up-ph-heading">Prompt Insights</h1>
      <p class="up-ph-desc">Manage Prompts, Topics and monitor latest Responses</p>
    </div>
    <div class="pph-topright">
      <button class="up-ph-addbtn up-export" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /> <path d="M12 5v14" /></svg>
        <span>Add <span class="up-ph-addbtn-full">Prompts</span></span>
      </button>
      <button class="pph-refreshbtn up-ph-iconbtn" type="button" aria-label="Refresh" data-tip="Refresh Data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></svg>
      </button>
    </div>
  </div>

  <!-- UC.makePageNav (core.js) builds the three tab items + the sliding indicator into this on init. -->
  <div class="up-ph-nav" role="tablist"></div>
</div>
</div><pre id="out">laeuft</pre>
<script>
window.__fehler=[]; window.addEventListener("error",function(e){window.__fehler.push(String(e.message))});
try{ localStorage.setItem("pref_theme","light"); }catch(e){}
(function(){
  var alt=/alt=1/.test(location.search);
  var files=[alt?"_alt_core.css":"core.css","page-headers/settings-page-header.css",
             alt?"_alt_pph.css":"page-headers/prompts-page-header.css"];
  Promise.all(files.map(function(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){return r.text()}); }))
  .then(function(t){
    t.forEach(function(x){ var e=document.createElement("style"); e.textContent=x; document.head.appendChild(e); });
    setTimeout(function(){
      var root=document.querySelector(".up-ph-root");
      function mess(){
        var cs=getComputedStyle(root);
        var tr=document.querySelector(".pph-topright"), add=document.querySelector(".up-ph-addbtn");
        var rr=root.getBoundingClientRect();
        return { polsterung_oben: cs.paddingTop,
          topright_versatz: tr?Math.round(tr.getBoundingClientRect().top-rr.top):null,
          topright_margin: tr?getComputedStyle(tr).marginTop:null,
          add_margin: add?getComputedStyle(add).marginTop:null };
      }
      /* Die Klasse setzt UC.widthTiers aus der eigenen Breite -- hier von Hand, es ist eine
         CSS-Frage. */
      var breit = mess();
      root.classList.add("is-vnarrow");
      var schmal = mess();
      var res={ datei: alt?"alt":"neu", breit: breit, schmal: schmal,
        sprung_der_polsterung: parseFloat(schmal.polsterung_oben) - parseFloat(breit.polsterung_oben),
        sprung_des_knopfs: (schmal.topright_versatz!=null&&breit.topright_versatz!=null) ? (schmal.topright_versatz-breit.topright_versatz) : null,
        fehler: window.__fehler };
      document.getElementById("out").textContent=JSON.stringify(res,null,1); window.__fertig=res;
    }, 600);
  });
})();
</script>
