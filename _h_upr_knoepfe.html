<!doctype html><meta charset="utf-8">
<title>Prompt Research: bleiben die Knopftexte auf Deutsch ganz?</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne"></div>
<script>
/* Gemeldet am 08.09.: "bei DE Settings sind die Buttons rechts truncated. Das darf nie
   passieren! Immer ganzer Text sichtbar, alles fit width."

   Auf Deutsch heissen die zwei Knoepfe "Ignorieren" und "Beobachten" statt "Ignore" und
   "Track". Die Aktionsspalte war eine feste Zahl (erst 200px, dann 236) und die Beschriftung
   kuerzte mit Auslassungspunkten. Jede feste Zahl ist eine Wette auf die laengste Sprache.

   GEMESSEN WIRD NICHT "sieht gut aus", SONDERN ZWEIERLEI:
     1. scrollWidth gegen clientWidth an Knopf UND Beschriftung. Ist der Inhalt breiter als der
        Kasten, ist er abgeschnitten -- egal ob mit Auslassungspunkten oder ohne.
     2. Die Kanten: kein Knopf darf ueber seine Zelle hinausragen, und die Zeile nicht ueber den
        Kasten. Sonst waere "nicht abgeschnitten" nur verlagert.

   UND DIE ALTE FASSUNG LAEUFT ALS GEGENPROBE im selben Aufbau: die drei Zeilen, die vorher
   dastanden, werden NACH unseren eingehaengt. Sie muessen dort kuerzen -- sonst prueft die
   Messung nicht, was sie behauptet. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
var gut=0, schlecht=0;
function pruef(t,b){ if(b) gut++; else schlecht++; log("   "+ja(b)+" "+t); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok,ms); }); }

Promise.all([hol("core.css"), hol("prompt-research.css")]).then(function(t){
  var f=document.createElement("iframe");
  f.style.cssText="width:1100px;height:520px;border:1px solid #ccc;display:block";
  document.getElementById("buehne").appendChild(f);
  var d=f.contentDocument, v=f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  t.forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var st2=d.createElement("style");
  st2.textContent="*,*::before,*::after{transition:none!important;animation:none!important}";
  d.head.appendChild(st2);

  /* Das ECHTE Markup der Zeile, aus prompt-research.js abgeschrieben -- Klasse fuer Klasse.
     Ein nachgebauter Kasten haette eigene Breiten und wuerde die eigene Messung messen. */
  function zeile(ignore, track){
    return '<div class="up-row">' +
      '<div class="up-td"><span class="upr-prompt-text">Welche Anbieter fuer eine ' +
        'Kfz-Versicherung sind im Vergleich am guenstigsten und was sagen Testberichte dazu?' +
      '</span></div>' +
      '<div class="up-td"><span class="up-topicchip">Tarife</span></div>' +
      '<div class="up-td"><div class="upr-volume-wrap"><div class="upr-volume-track">' +
        '<span class="upr-volume-seg is-filled level-2"></span>' +
        '<span class="upr-volume-seg is-filled level-2"></span>' +
        '<span class="upr-volume-seg"></span><span class="upr-volume-seg"></span>' +
      '</div></div></div>' +
      '<div class="up-td upr-td-actions"><div class="upr-row-actions">' +
        '<button class="upr-row-btn is-ignore" type="button"><span>' + ignore + '</span>' +
          '<svg viewBox="0 0 24 24"></svg></button>' +
        '<button class="upr-row-btn is-accept" type="button"><span>' + track + '</span>' +
          '<svg viewBox="0 0 24 24"></svg></button>' +
      '</div></div>' +
    '</div>';
  }
  var wurzel=d.createElement("div");
  wurzel.className="up-root upr-root"; wurzel.setAttribute("data-theme","light");
  wurzel.innerHTML =
    '<div class="upr-box up-box" data-box style="width:900px">' +
      '<div class="up-table">' +
        '<div class="up-thead"><div class="up-th">Prompt</div><div class="up-th">Topics</div>' +
          '<div class="up-th">Volumen</div><div class="up-th">&nbsp;</div></div>' +
        '<div class="up-tbody" data-body></div>' +
      '</div>' +
    '</div>';
  d.body.appendChild(wurzel);

  function messen(titel, ignore, track){
    wurzel.querySelector("[data-body]").innerHTML = zeile(ignore, track);
    var box=wurzel.querySelector("[data-box]");
    var zelle=wurzel.querySelector(".upr-td-actions");
    var knoepfe=[].slice.call(wurzel.querySelectorAll(".upr-row-btn"));
    var raus=[];
    log(titel);
    log("      Spalte: " + Math.round(zelle.getBoundingClientRect().width) + "px" +
        "   --up-cols: " + v.getComputedStyle(box).getPropertyValue("--up-cols").trim());
    knoepfe.forEach(function(b){
      var sp=b.querySelector("span");
      var bb=b.getBoundingClientRect(), zz=zelle.getBoundingClientRect();
      var abgeschnitten = sp.scrollWidth > sp.clientWidth + 0.5 ||
                          b.scrollWidth > b.clientWidth + 0.5;
      var raus1 = bb.left < zz.left - 0.5 || bb.right > zz.right + 0.5;
      log("      \"" + sp.textContent + "\"   Knopf " + Math.round(bb.width) + "px" +
          "   Text " + sp.scrollWidth + " in " + sp.clientWidth +
          (abgeschnitten ? "   ABGESCHNITTEN" : "") + (raus1 ? "   RAGT AUS DER ZELLE" : ""));
      raus.push({ abgeschnitten: abgeschnitten, raus: raus1 });
    });
    var zeilenBreite=wurzel.querySelector(".up-row").scrollWidth;
    var boxBreite=box.clientWidth;
    log("      Zeile " + zeilenBreite + "px im Kasten " + boxBreite + "px");
    return { alle: raus, ueber: zeilenBreite > boxBreite + 0.5 };
  }

  return warte(250).then(function(){
    log("1  Deutsch -- die langen Beschriftungen");
    var de=messen("   \"Ignorieren\" und \"Beobachten\"", "Ignorieren", "Beobachten");
    pruef("kein Knopftext ist abgeschnitten",
      de.alle.every(function(x){ return !x.abgeschnitten; }));
    pruef("kein Knopf ragt aus seiner Zelle", de.alle.every(function(x){ return !x.raus; }));
    pruef("und die Zeile laeuft nicht ueber den Kasten hinaus", !de.ueber);
    log("");
    log("2  Englisch -- die kurzen, damit nichts unnoetig Platz frisst");
    var en=messen("   \"Ignore\" und \"Track\"", "Ignore", "Track");
    pruef("auch hier nichts abgeschnitten",
      en.alle.every(function(x){ return !x.abgeschnitten; }));
    log("");
    log("3  Und eine erfundene, noch laengere Sprache");
    /* Der Punkt von max-content ist, dass niemand mehr nachrechnen muss. Also wird eine
       Beschriftung genommen, die laenger ist als alles im Katalog -- passt die auch, ist die
       Regel richtig und nicht nur fuer Deutsch zurechtgebogen. */
    var xx=messen("   \"Diesen Vorschlag ignorieren\" und \"Dauerhaft beobachten\"",
      "Diesen Vorschlag ignorieren", "Dauerhaft beobachten");
    pruef("auch eine viel laengere Beschriftung bleibt ganz",
      xx.alle.every(function(x){ return !x.abgeschnitten; }));
    log("");

    log("4  GEGENPROBE: die alte Fassung im selben Aufbau");
    /* Wortgleich die drei Zeilen, die vorher dastanden -- feste Spalte plus Auslassungspunkte. */
    var alt=d.createElement("style");
    alt.textContent =
      ".upr-box { --up-cols: minmax(0, 2.4fr) minmax(0, 1.7fr) 150px 236px; }" +
      ".upr-td-actions { overflow: hidden; min-width: 0; }" +
      ".upr-row-actions { min-width: 0; }" +
      ".upr-row-btn { flex: 0 1 auto; min-width: 0; overflow: hidden; }" +
      ".upr-row-btn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }";
    d.head.appendChild(alt);
    return warte(150).then(function(){
      var vgl=messen("   alte Fassung, Deutsch", "Ignorieren", "Beobachten");
      /* ZWEI WEGE, WIE EIN KNOPF ABGESCHNITTEN WIRD, und die alte Fassung nimmt den zweiten:
         die zwei Knoepfe brauchen zusammen 254px (101 + 8 + 117 plus das Polster der Zelle), die
         feste Spalte gibt 236 -- also wird der linke aus der Zelle geschoben und von ihrem
         overflow: hidden LINKS beschnitten. Der Text darin bleibt dabei formal ungekuerzt.
         Die Gegenprobe muss deshalb auf BEIDES schauen, sonst meldet sie "die alte Fassung war
         in Ordnung" -- der erste Anlauf hat genau das getan. */
      pruef("die alte Fassung schneidet ab (Text gekuerzt ODER Knopf aus der Zelle geschoben)",
        vgl.alle.some(function(x){ return x.abgeschnitten || x.raus; }));
      alt.parentNode.removeChild(alt);
      log("");
      log((schlecht ? "==> FALSCH  " : "==> RICHTIG ")+gut+" von "+(gut+schlecht)+" Pruefungen");
      log("FERTIG");
    });
  });
}).catch(function(e){ log("ABBRUCH "+e); });
</script>
