<!-- Der echte Ablauf auf einer Seite OHNE Performance Radar: der Page-Load-Workflow feuert seinen
     Run-JS-Schritt, bevor core.js geladen ist. Ohne Stub ist window.setUpstreemBrands undefined,
     der Schritt wirft, und der ganze Aufruf ist weg -- Quick Actions steht dann bei "No brands
     loaded", ohne dass irgendwo ein Fehler sichtbar wird. -->
<script>
var LOG = [];
var GUARD = new URLSearchParams(location.search).get("guard") === "1";
if (GUARD){
  /* Genau die zwei Zeilen, die in den Run-JS-Schritt gehoeren. */
  window.__upBrandsQueue = window.__upBrandsQueue || [];
  window.setUpstreemBrands = window.setUpstreemBrands || function(rows){ window.__upBrandsQueue.push(rows); };
}
try {
  window.setUpstreemBrands([
    {id:"b1", name:"Anfragenfluss", logo:"https://www.google.com/s2/favicons?domain=anfragenfluss.de&sz=64"},
    {id:"b2", name:"LeeUp Media",   logo:"//www.google.com/s2/favicons?domain=lee-up.de&sz=64"},
    {id:"b3", name:"Candidate Flow", logo:""}
  ]);
  LOG.push("Run-JS (vor core.js): durchgelaufen");
} catch(e){
  LOG.push("Run-JS (vor core.js): GEWORFEN -- " + e.message);
}
</script>

<script src="core.js?v=e1"></script>
<script src="quick-actions.js?v=e1"></script>
<script>
var out = document.getElementById("out");
function markenImMenue(){
  var api = window.MiraQuickActions;
  api.open();
  var inp = document.querySelector(".mqa-input");
  inp.value = "/mentioning "; inp.dispatchEvent(new Event("input", {bubbles:true}));
  return new Promise(function(r){ setTimeout(function(){
    var txt = document.querySelector(".mqa-results").innerText;
    api.close();
    r(txt);
  }, 200); });
}
setTimeout(function(){
  LOG.push("guard=" + (GUARD ? "an" : "aus"));
  LOG.push("Store nach core.js: " + (UpstreemCore.getBrands()||[]).length + " Marken");
  markenImMenue().then(function(t){
    LOG.push("/mentioning zeigt: " + t.replace(/\n/g, " | "));
    var l = (UpstreemCore.getBrands()||[])[1];
    LOG.push("Feld-Normalisierung b2: " + JSON.stringify(l && {id:l.company_id, name:l.name, logo:l.logo_url}));
    out.textContent = LOG.join("\n");
  });
}, 300);
</script>
