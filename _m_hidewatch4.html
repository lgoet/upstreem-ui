<script>
window.__OBS = [];               /* je Observer: {opts:[], fires:0, cbName} */
(function(){
  var RealMO = window.MutationObserver;
  function Wrapped(cb){
    var rec = { opts: [], fires: 0, cb: (cb.name || String(cb).slice(0,60)) };
    window.__OBS.push(rec);
    var mo = new RealMO(function(m, o){ rec.fires++; return cb.call(this, m, o); });
    rec.mo = mo;
    var realObs = mo.observe.bind(mo);
    mo.observe = function(t, o){ rec.opts.push(((t===document.body)?'body':(t===document.documentElement)?'html':(t.className||t.tagName)) + ' ' + JSON.stringify(o)); return realObs(t,o); };
    return mo;
  }
  Wrapped.prototype = RealMO.prototype;
  window.MutationObserver = Wrapped;
})();
window.__GCR = 0; window.__GCS = 0; window.__GCR_T = [];
(function(){
  var realGCR = Element.prototype.getClientRects;
  Element.prototype.getClientRects = function(){
    if (this.classList && this.classList.contains('upt-root')) { window.__GCR++; window.__GCR_T.push(performance.now()); }
    return realGCR.apply(this, arguments);
  };
  var realGCS = window.getComputedStyle;
  window.getComputedStyle = function(el){ if (el && el.classList && el.classList.contains('upt-root')) window.__GCS++; return realGCS.apply(window, arguments); };
})();
window.__T = [];                 /* armierte Timer mit Verzoegerung 60 */
(function(){ var real = window.setTimeout;
  window.__realTimeout = real;
  window.setTimeout = function(fn, ms){ if (ms === 60) window.__T.push(performance.now()); return real.apply(window, arguments); };
})();
</script>

<div id="mout" style="position:fixed;right:8px;top:8px;width:560px;max-height:92vh;overflow:auto;background:#111;color:#0f0;font:12px/1.45 monospace;padding:10px;z-index:99999;white-space:pre-wrap">messe...</div>
<script>
var ML=[]; function mlog(s){ ML.push(s); document.getElementById('mout').textContent = ML.join("\n"); window.__M = ML.join("\n"); }
var ST = window.__realTimeout;
function sleep(ms){ return new Promise(function(r){ ST(r, ms); }); }
function med(a){ a=a.slice().sort(function(x,y){return x-y;}); return a.length?a[a.length>>1]:0; }
async function run(){
  window.__load();
  await sleep(600);
  var root = document.querySelector('.upt-root');

  /* --- 1) Existenz + Frische beweisen --- */
  mlog("Observer insgesamt: " + window.__OBS.length);
  window.__OBS.forEach(function(o,i){ mlog("  ["+i+"] cb="+o.cb.replace(/\s+/g,' ')+"  fires="+o.fires+"\n        "+o.opts.join("\n        ")); });
  var pt = window.__OBS.filter(function(o){ return /scheduleHideCheck/.test(o.cb); })[0];
  mlog("prompts-table-Observer gefunden: " + !!pt);
  mlog("Controller lebt: " + !!root.__uptController);

  /* --- 2) Kontrolle: eine einzige Fremd-Einfuegung --- */
  var f0 = pt ? pt.fires : -1, g0 = window.__GCR, t0 = window.__T.length;
  document.body.appendChild(document.createElement('span'));
  await sleep(250);
  mlog("");
  mlog("A) 1 Fremd-Einfuegung: observer-fires +"+((pt?pt.fires:0)-f0)+
       " | 60ms-Timer armiert +"+(window.__T.length-t0)+
       " | getClientRects(root) +"+(window.__GCR-g0)+" | getComputedStyle(root) +"+(window.__GCS));

  /* --- 3) Der behauptete Fall: 220ms-Transition, dabei LAUFEND Knoten (setTimeout-getaktet) --- */
  var host=document.createElement('div');
  host.style.cssText='position:fixed;right:0;top:0;width:420px;height:100vh;background:#eee;transform:translateX(100%);transition:transform 220ms ease';
  document.body.appendChild(host);
  await sleep(60);
  var fA=pt?pt.fires:0, tA=window.__T.length; window.__GCR=0; window.__GCS=0; window.__GCR_T=[];
  var start=performance.now(), ticks=0, ins=0;
  host.style.transform='translateX(0)';
  await new Promise(function(res){
    (function step(){
      ticks++;
      for (var i=0;i<8;i++){ var d=document.createElement('div'); d.textContent='row '+(ins++); host.appendChild(d); }
      if (performance.now()-start < 240) ST(step, 12); else ST(res, 120);
    })();
  });
  mlog("");
  mlog("B) Drawer 220ms, Einfuegungen alle 12ms:");
  mlog("   Takte: "+ticks+" | Knoten: "+ins+" | observer-fires: "+((pt?pt.fires:0)-fA)+" | 60ms-Timer armiert: "+(window.__T.length-tA));
  mlog("   rootIsHidden-Laeufe: "+window.__GCR+" (getComputedStyle(root): "+window.__GCS+")");
  mlog("   Zeitpunkte ms nach Start: "+window.__GCR_T.map(function(t){return (t-start).toFixed(0);}).join(", "));

  /* --- 4) Kosten des Waechters je Mutation, und Kosten der vorgeschlagenen Vorpruefung --- */
  var bulk=document.createElement('div'); document.body.appendChild(bulk);
  var HTML=''; for (var i=0;i<400;i++) HTML+='<div class="x"><span>x'+i+'</span></div>';
  function burst(){ return new Promise(function(res){ var t=performance.now(); bulk.innerHTML=HTML; Promise.resolve().then(function(){ res(performance.now()-t); }); }); }
  var a,k;
  for(k=0;k<20;k++) await burst();
  a=[]; for(k=0;k<60;k++) a.push(await burst());
  var ist=med(a);
  var LIVE=[root];
  var fx=new MutationObserver(function(muts){
    for (var i=0;i<muts.length;i++){
      var ad=muts[i].addedNodes, j, n, q;
      for (j=0;j<ad.length;j++){ n=ad[j]; if(n.nodeType!==1) continue;
        if ((n.classList&&n.classList.contains('upt-root'))||(n.querySelector&&n.querySelector('.upt-root'))) return;
        for (q=0;q<LIVE.length;q++) if (n.contains(LIVE[q])) return; }
      var rm=muts[i].removedNodes;
      for (j=0;j<rm.length;j++){ n=rm[j]; if(n.nodeType!==1) continue; for(q=0;q<LIVE.length;q++) if(n.contains(LIVE[q])) return; }
    }
  });
  fx.observe(document.body,{childList:true,subtree:true});
  for(k=0;k<20;k++) await burst();
  a=[]; for(k=0;k<60;k++) a.push(await burst());
  var mitfix=med(a); fx.disconnect();
  mlog("");
  mlog("C) 400 Knoten je Burst, Median von 60:");
  mlog("   Ist-Waechter allein:                  "+ist.toFixed(3)+" ms");
  mlog("   + vorgeschlagene Filter-Vorpruefung:  "+mitfix.toFixed(3)+" ms   (Aufschlag "+(mitfix-ist).toFixed(3)+" ms je Burst)");

  /* --- 5) Ist offsetParent layout-frei? --- */
  var op=[],cr=[];
  for (i=0;i<50;i++){
    document.body.style.paddingTop=(Math.random()*2).toFixed(3)+'px';
    var t=performance.now(); var x=root.offsetParent; op.push(performance.now()-t);
    document.body.style.paddingTop=(Math.random()*2).toFixed(3)+'px';
    t=performance.now(); var y=root.getClientRects().length; cr.push(performance.now()-t);
  }
  mlog("");
  mlog("D) nach Layout-Invalidierung, Median:");
