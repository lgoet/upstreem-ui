<!doctype html><meta charset="utf-8">
<title>Mira: die zwei Bubble-Schritte fuer die Skelette der Chatleiste</title>
<pre id="out" style="font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="rahmen"></div>
<script>
/* Geprueft werden die ZWEI RUN-JS-SCHRITTE, wortgleich aus bubble/runjs/ geholt -- nicht eine
   Nachbildung davon. Wenn der Nutzer sie in Bubble einfuegt, ist es genau dieser Text.

   Vier Lagen, und die dritte ist die, um die es geht:
     1. "yes", waehrend die Komponente laeuft            -> Skelettzeilen stehen da
     2. "no"                                             -> Skelett weg, Liste da
     3. "yes" BEVOR ask-mira.js ueberhaupt geladen ist    -> beim Start nachgeholt
        (auf der Seite der Normalfall: der Page-Load-Workflow ist vor der Datei dran)
     4. eine LEERE Chatliste beendet das Laden nicht       -> sonst blinkt das Skelett weg,
        bevor die Daten da sind (Bubble ruft den Setter einmal leer, bevor der RPC zurueck ist) */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function ja(b){ return b ? "RICHTIG" : "FALSCH"; }

var DATEIEN = ["core.css","ask-mira.css","core.js","ask-mira.js","bubble/ask_mira_bubble.html",
               "bubble/runjs/ask_mira_chats_loading_yes.js",
               "bubble/runjs/ask_mira_chats_loading_no.js"];

function rahmen(){
  var f = document.createElement("iframe");
  f.style.cssText = "width:1240px;height:300px;border:1px solid #ccc;display:block;margin-bottom:6px";
  document.getElementById("rahmen").appendChild(f);
  var d = f.contentDocument;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  return { f:f, d:d, v:f.contentWindow };
}
function baue(u, t, vorher){
  var d = u.d, v = u.v;
  [t[0], t[1]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var roh = t[4].replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"");
  d.body.innerHTML = roh;
  /* vorher: der Run-JS-Schritt laeuft, BEVOR die Dateien da sind -- Lage 3. */
  if (vorher) v.eval(vorher);
  var j1=d.createElement("script"); j1.textContent=t[2]; d.head.appendChild(j1);
  var j2=d.createElement("script"); j2.textContent=t[3]; d.head.appendChild(j2);
  return warte(1400);
}
function skelettZeilen(d){ return d.querySelectorAll(".am-prev-skel-row").length; }
function eintraege(d){ return d.querySelectorAll(".am-prev-section").length; }

Promise.all(DATEIEN.map(hol)).then(function(t){
  var SCHRITT_AN = t[5], SCHRITT_AUS = t[6];
  var A = rahmen();
  return baue(A, t).then(function(){
    A.v.eval(SCHRITT_AN);
    return warte(300).then(function(){
      var n = skelettZeilen(A.d);
      log("1) SCHRITT \"Skelette AN\", Komponente laeuft schon");
      log("   Skelettzeilen: " + n + "   Abschnitte: " + eintraege(A.d));
      log("   ==> " + ja(n >= 5) + " (die Leiste zeigt Skelette statt leer dazustehen)");
      log("");
      A.v.eval(SCHRITT_AUS);
      return warte(300);
    }).then(function(){
      var n = skelettZeilen(A.d);
      log("2) SCHRITT \"Skelette AUS\"");
      log("   Skelettzeilen: " + n + "   Abschnitte: " + eintraege(A.d));
      log("   ==> " + ja(n === 0 && eintraege(A.d) > 0) +
          " (Skelett weg, und die echte Leiste steht da -- auch ohne einen einzigen Chat)");
      log("");
      /* ---- Lage 3: der Schritt laeuft VOR der Komponente ---- */
      var B = rahmen();
      return baue(B, t, SCHRITT_AN).then(function(){
        var n2 = skelettZeilen(B.d);
        log("3) SCHRITT \"Skelette AN\" LAEUFT VOR ask-mira.js");
        log("   Warteschlange beim Start: " + ((B.v.__amBootQueue||[]).length) +
            "   Skelettzeilen danach: " + n2);
        log("   ==> " + ja(n2 >= 5) +
            " (der Aufruf wurde eingereiht und beim Start nachgeholt -- das ist der Normalfall" +
            " beim Seitenaufbau)");
        log("");
        /* ---- Lage 4: die leere Liste darf das Laden nicht beenden ---- */
        B.v.askMiraSetPreviousChats([]);
        return warte(300).then(function(){
          var n3 = skelettZeilen(B.d);
          log("4) LEERE Chatliste waehrend des Ladens (Bubble ruft den Setter einmal leer)");
          log("   Skelettzeilen: " + n3);
          log("   ==> " + ja(n3 >= 5) + " (das Skelett bleibt -- die Daten sind noch unterwegs)");
          B.v.askMiraSetPreviousChats([{ id:"1", title:"Erster Chat" }]);
          return warte(300).then(function(){
            log("   nach der echten Liste: " + skelettZeilen(B.d) + " Skelettzeilen, " +
                B.d.querySelectorAll(".am-prev-item").length + " Chats");
            log("   ==> " + ja(skelettZeilen(B.d) === 0) + " (echte Daten beenden es von selbst)");
            log("FERTIG");
          });
        });
      });
    });
  });
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"").split("\n").slice(0,3).join("\n")); });
</script>
