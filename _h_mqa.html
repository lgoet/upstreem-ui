<meta charset="utf-8"><title>quick actions chips</title>
<style>html,body{margin:0;font-family:system-ui,sans-serif;background:#fff}
#log{position:fixed;left:0;bottom:0;width:100%;max-height:16%;overflow:auto;font:10px/1.4 ui-monospace,monospace;background:#f6f6f6;border-top:1px solid #ddd;margin:0;padding:6px;white-space:pre-wrap}
html.dunkel body{background:#121212}</style>
<body>
<pre id="log">laeuft</pre>
<div id="buehne"></div>
<script>
window.__fehler=[]; window.addEventListener("error",function(e){window.__fehler.push(String(e.message)+" @"+e.lineno)});
function log(s){ var l=document.getElementById("log"); l.textContent += "\n"+s; }
var DUNKEL = /dark=1/.test(location.search);
if (DUNKEL) document.documentElement.classList.add("dunkel");
/* Markup aus bubble/ geholt, nicht selbst getippt -- ein eigenes waere ein anderes Element.
   CSS und JS per fetch mit no-store: ein ?v= hat in dieser Sitzung dreimal nicht gewirkt. */
Promise.all(["quick-actions.css"].map(function(f){
  return fetch(f,{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){
    var e=document.createElement("style"); e.textContent=t; document.head.appendChild(e); });
})).then(function(){
  return fetch("_h_mqa_markup.html",{cache:"no-store"}).then(function(r){return r.text();});
}).then(function(t){
  document.getElementById("buehne").innerHTML = t;
  var r = document.getElementById("mira-quick-actions");
  r.setAttribute("data-theme", DUNKEL ? "dark" : "light");
  return fetch("quick-actions.js",{cache:"no-store"}).then(function(x){return x.text();});
}).then(function(js){
  var e=document.createElement("script"); e.textContent=js; document.head.appendChild(e);
  setTimeout(function(){
    /* Palette oeffnen und zwei Filter-Chips setzen -- genau die, die beim Tippen von /brand
       oben im Eingabefeld erscheinen. */
    window.MiraQuickActions.setBrands([{id:"b1",name:"Mercedes Benz"},{id:"b2",name:"BMW"}]);
    window.MiraQuickActions.open();
    setTimeout(function(){
      var ov = document.querySelector(".mqa-overlay");
      if (ov) ov.setAttribute("data-theme", DUNKEL ? "dark" : "light");
      /* Die Chips direkt setzen, falls die API sie nicht auf Zuruf baut. */
      var ce = document.querySelector("#mqa-chips");
      if (ce && !ce.children.length){
        ce.innerHTML =
          '<span class="mqa-chip" data-slot="brand">Brand <b>Mercedes Benz</b>' +
          '<button class="mqa-chip-x" type="button" aria-label="Remove filter">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>' +
          '<span class="mqa-chip" data-slot="market">Market <b>DE</b>' +
          '<button class="mqa-chip-x" type="button" aria-label="Remove filter">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>';
        log("Chips von Hand gesetzt");
      }
      /* Eine Recent-Search-Zeile und eine Favorites-Zeile von Hand einsetzen: sie entstehen erst
         nach echten Suchen, und fuer die Messung der Chips genuegt dieselbe Struktur, die
         entryLineHtml/miniChips bauen. */
      var rw = document.querySelector("#mqa-recent");
      if (rw) rw.innerHTML =
        ['<div class="mqa-sec-label">Recent Searches</div>',
         '<button class="mqa-action" type="button"><span class="mqa-recent-ic"></span>' +
         '<span class="mqa-main"><span class="mqa-primary mqa-recent-line">' +
         '<span class="mqa-mini">Brand <b>Mercedes Benz</b></span>' +
         '<span class="mqa-mini">Market <b>DE</b></span>' +
         '<span class="mqa-recent-q">solaranlagen anbieter</span></span></span></button>',
         '<div class="mqa-sec-label">Favorites</div>',
         '<button class="mqa-action" type="button"><span class="mqa-recent-ic"></span>' +
         '<span class="mqa-main"><span class="mqa-primary mqa-recent-line">' +
         '<span class="mqa-mini">Rank <b>Top 3</b></span>' +
         '<span class="mqa-recent-q">gespeicherte suche</span></span></span></button>'].join("");
      window.__bereit = true; log("bereit");
    }, 500);
  }, 400);
}).catch(function(e){ log("FEHLER " + e.message); });
</script>
