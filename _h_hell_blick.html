<!doctype html><meta charset="utf-8">
<title>Der helle Modus zum Ansehen</title>
<link rel="stylesheet" href="core.css">
<body class="up-root" style="margin:0;background:#ffffff;padding:24px;font-family:Geist,system-ui,sans-serif;display:flex;gap:24px;align-items:flex-start">
<div style="background:var(--vc-bg);border:1px solid var(--vc-border);border-radius:16px;padding:16px;width:420px">
  <div style="font-size:15px;font-weight:600;color:var(--vc-text);margin-bottom:12px">Eine Karte auf der Seite</div>
  <div style="background:var(--vt-head-bg);border:1px solid var(--vc-border);border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--vc-muted)">Tabellenkopf</div>
  <div style="padding:9px 12px;font-size:13.5px;color:var(--vc-text)">eine Zeile</div>
  <div style="padding:9px 12px;font-size:13.5px;color:var(--vc-text);background:var(--vt-row-hover);border-radius:9px">eine ueberfahrene Zeile</div>
  <div style="height:14px"></div>
  <div style="background:var(--vc-sk);height:12px;border-radius:6px;width:70%"></div>
</div>
<div class="up-filter-menu" style="position:static;display:block;width:240px">
  <div class="up-pop-head">Ein Menue darueber</div>
  <div class="up-pop-opt">nicht gewaehlt</div>
  <div class="up-pop-opt is-active" style="background:var(--up-sel-bg)">gewaehlt</div>
  <div class="up-pop-opt">nicht gewaehlt</div>
</div>
<div style="display:flex;flex-direction:column;gap:0;width:200px;border:1px solid var(--vc-border);border-radius:12px;overflow:hidden">
  <div style="height:40px;background:#ffffff;font-size:11.5px;color:var(--vc-muted);padding:0 10px;display:flex;align-items:center">Seite #ffffff</div>
  <div style="height:40px;background:#f9f8f9;font-size:11.5px;color:var(--vc-muted);padding:0 10px;display:flex;align-items:center">Karte #f9f8f9</div>
  <div style="height:40px;background:#f4f2f4;font-size:11.5px;color:var(--vc-muted);padding:0 10px;display:flex;align-items:center">Kopfzeile #f4f2f4</div>
  <div style="height:40px;background:#eeedef;font-size:11.5px;color:var(--vc-muted);padding:0 10px;display:flex;align-items:center">Auswahl #eeedef</div>
  <div style="height:40px;background:#e9e8ea;font-size:11.5px;color:var(--vc-muted);padding:0 10px;display:flex;align-items:center">Skelett #e9e8ea</div>
</div>
</body>
