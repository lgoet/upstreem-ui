<!doctype html>
<meta charset="utf-8">
<title>Skeleton: fuellt seine Gruppe</title>
<link rel="stylesheet" href="/core.css">
<link rel="stylesheet" href="/skeleton.css">
<style>
  html,body{margin:0;background:#f6f6f6;color:#1f1f1b;
    font:13px/1.5 Geist,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #raus{white-space:pre-wrap;padding:14px 16px;font:12px/1.6 ui-monospace,Menlo,monospace}
  .ja{color:#1a7f37;font-weight:600}.nein{color:#c0392b;font-weight:600}
  .kopf{display:block;margin:14px 0 4px;font-weight:700}
  /* DIE BUEHNE: Gruppen mit verschiedenen Groessen, wie sie in Bubble stehen wuerden.
     Sie steht bei -4000px, damit sie nichts verdeckt -- gemessen wird trotzdem echt,
     ein Kasten dort hat seine Groesse. */
  #buehne{position:absolute;left:-4000px;top:0;width:1000px}
  #buehne.zeigen{position:static;left:auto}
  .gruppe{background:#fff;border:1px solid #e4e2e4;margin:8px}
  .g-hoch{width:320px;height:240px}
  .g-flach{width:320px;height:40px}
  .g-null{width:320px}
  .g-breit{width:800px;height:120px}
  .g-dunkel{background:#101114;border-color:#34343a}
</style>
<div id="buehne">
  <div class="gruppe g-hoch"><div class="up-root usk-root" id="s-hoch" data-variant="rows" data-isdark="no"></div></div>
  <div class="gruppe g-flach"><div class="up-root usk-root" id="s-flach" data-variant="rows" data-isdark="no"></div></div>
  <div class="gruppe g-null"><div class="up-root usk-root" id="s-null" data-variant="rows" data-isdark="no"></div></div>
  <div class="gruppe g-breit"><div class="up-root usk-root" id="s-block" data-variant="block" data-radius="20" data-isdark="no"></div></div>
  <div class="gruppe g-hoch"><div class="up-root usk-root" id="s-card" data-variant="card" data-isdark="no"></div></div>
  <div class="gruppe g-hoch g-dunkel"><div class="up-root usk-root" id="s-dunkel" data-variant="rows" data-isdark="yes"></div></div>
  <div class="gruppe g-hoch"><div class="up-root usk-root" id="s-kaputt" data-variant="quatsch" data-isdark="no"></div></div>
  <div class="gruppe g-hoch"><div class="up-root usk-root" id="s-setter" data-instance="A" data-variant="block" data-isdark="no"></div></div>
</div>
<pre id="raus">laeuft…</pre>
<script src="/frische.js"></script>
<script src="/core.js"></script>
<script src="/skeleton.js"></script>
<script src="/_h_usk_pruef.js"></script>
