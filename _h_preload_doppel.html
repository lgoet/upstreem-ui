<meta charset="utf-8"><title>preload: Teilbaum-Einhaengung</title>
<body style="font:12px ui-monospace,monospace;padding:14px">
<pre id="out">laeuft</pre>
<script>window.__warn=[]; var w=console.warn; console.warn=function(){window.__warn.push([].join.call(arguments," ")); w.apply(console,arguments);};</script>
<script>
(function(){
  var PIN = "e966e982e199d52034078d998a23f371683c795e";
  if (!PIN || PIN === "CDN_" + "PIN") PIN = "main";

  var VORRAT = "sofort";
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + PIN + "/";

  ["preconnect", "dns-prefetch"].forEach(function(rel){
    var l = document.createElement("link");
    l.rel = rel; l.href = "https://cdn.jsdelivr.net";
    if (rel === "preconnect") l.crossOrigin = "anonymous";
    document.head.appendChild(l);
  });

  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  var geladen = {};
  function once(rohUrl, make){
    var name = rohUrl.slice(rohUrl.lastIndexOf("/") + 1);
    var da = L[name] || L[rohUrl];
    if (da){
      if (da !== rohUrl && String(da).indexOf("http") === 0 && window.console) console.warn("upstreem: " + name +
        " ist schon von einem anderen Pin geladen. Geladen bleibt " + da +
        ", ignoriert wird " + rohUrl + ". Setzt alle Elemente auf denselben Pin.");
      return;
    }
    L[name] = rohUrl; L[rohUrl] = rohUrl; geladen[name] = true; make();
  }
  function minUrl(f){ return base + f.replace(/\.(js|css)$/, ".min.$1"); }

  function css(f){ once(base + f, function(){
    var l = document.createElement("link"); l.rel = "stylesheet"; l.href = minUrl(f);
    l.setAttribute("data-up-preload", "1");
    l.onerror = function(){
      var r = document.createElement("link"); r.rel = "stylesheet"; r.href = base + f;
      r.setAttribute("data-up-preload", "1");
      document.head.appendChild(r);
      if (l.parentNode) l.parentNode.removeChild(l);
    };
    document.head.appendChild(l);
  }); }

  function js(f){ once(base + f, function(){
    var s = document.createElement("script"); s.src = minUrl(f); s.async = false; s.setAttribute("data-up-preload", "1");
    s.onerror = function(){
      var r = document.createElement("script"); r.src = base + f; r.async = false; r.setAttribute("data-up-preload", "1");
      document.head.appendChild(r);

      if (s.parentNode) s.parentNode.removeChild(s);
    };
    document.head.appendChild(s);
  }); }

  ["Topics","Markets","Brands"].forEach(function(n){
    var q = "__up" + n + "Queue";
    window[q] = window[q] || [];
    if (typeof window["setUpstreem" + n] !== "function"){
      window["setUpstreem" + n] = function(rows){ window[q].push(rows); };
    }
  });

  window.__upstreemMarketQueue = window.__upstreemMarketQueue || [];
  if (typeof window.setUpstreemAllMarkets !== "function"){
    window.setUpstreemAllMarkets = function(rows){
      window.__upstreemMarketQueue.push({ all: true, rows: rows }); return true;
    };
  }

  css("core.css");     js("core.js");
  css("sidebar.css");  js("sidebar.js");

  function welle2(){
    css("visibility-chart.css");        js("visibility-chart.js");
    css("topcitations-dashboard.css");  js("topcitations-dashboard.js");
    css("citations-combo-chart.css");   js("citations-combo-chart.js");
    css("prompts-table.css");           js("prompts-table.js");
    css("urls-table.css");              js("urls-table.js");
    css("domains-table.css");           js("domains-table.js");
    css("topics-manager.css");          js("topics-manager.js");
    css("responses-table.css");         js("responses-table.js");
    css("brands-overview.css");         js("brands-overview.js");
    css("performance-radar.css");       js("performance-radar.js");
    css("quick-actions.css");           js("quick-actions.js");
    css("performance-detail.css");      js("performance-detail.js");
    css("discover-brands.css");         js("discover-brands.js");
    css("settings-brand.css");          js("settings-brand.js");
    css("opportunities.css");           js("opportunities.js");
    css("ask-mira.css");                js("ask-mira.js");
    css("prompt-research.css");         js("prompt-research.js");
    css("add-prompts.css");             js("add-prompts.js");
    css("create-with-ai.css");          js("create-with-ai.js");

    once("chartjs", function(){
      var c = document.createElement("script");
      c.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js";
      c.setAttribute("data-upstreem-chartjs", "1");
      c.async = false;
      document.head.appendChild(c);
    });
  }

  function doppelWaechter(){
    if (!window.MutationObserver) return;
    var gemeldet = 0;

    function pruefen(n){
      if (!n || n.nodeType !== 1 || !n.getAttribute) return;
      if (!n.getAttribute("data-up-preload")){
        var u = null;
        if (n.tagName === "SCRIPT") u = n.getAttribute("src");
        else if (n.tagName === "LINK" && (n.getAttribute("rel") || "").indexOf("stylesheet") >= 0) u = n.getAttribute("href");
        if (u && u.indexOf("upstreem-ui@") >= 0){
          var name = u.slice(u.lastIndexOf("/") + 1).replace(".min.", ".");
          if (geladen[name]){
            if (n.parentNode) n.parentNode.removeChild(n);
            if (!gemeldet && window.console){
              gemeldet = 1;
              console.warn("upstreem: doppelt eingehaengte Dateien werden entfernt (zuerst " + name +
                "). Das Element bringt einen aelteren Loader mit, der die gemeinsame Liste nicht kennt " +
                "-- funktioniert so, laesst sich aber sauberer loesen, indem der Loader in diesem " +
                "Element ausgetauscht wird.");
            }
            return;
          }
        }
      }
      if (!n.querySelectorAll) return;
      var drin = n.querySelectorAll('script[src*="upstreem-ui@"], link[href*="upstreem-ui@"]');
      for (var q = 0; q < drin.length; q++) pruefen(drin[q]);
    }
    new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++){
        var neu = muts[i].addedNodes;
        for (var j = 0; j < neu.length; j++) pruefen(neu[j]);
      }
    }).observe(document.documentElement, { childList: true, subtree: true });
  }
  doppelWaechter();

  function pinWaechter(){
    var versuche = 0;
    (function schauen(){
      var els = document.querySelectorAll("[data-cdn-pin]");
      for (var i = 0; i < els.length; i++){
        var p = (els[i].getAttribute("data-cdn-pin") || "").trim();
        if (!p || p === "CDN_" + "PIN") continue;
        if (p === PIN) return;
        if (window.console) console.error("upstreem: Der Pin im Header-Snippet (" + PIN +
          ") ist nicht derselbe wie am Element \"" + (els[i].className || els[i].id) + "\" (" + p +
          "). Solange sie sich unterscheiden, laedt ein Teil der Elemente seine Dateien ZUSAETZLICH " +
          "-- doppelte Dateien, doppeltes core, langsamer Seitenaufbau. Beide auf dieselbe " +
          "Zeichenfolge setzen (nicht nur denselben Commit: kurzer und langer Hash sind zwei URLs).");
        return;
      }
      if (++versuche < 20) setTimeout(schauen, 500);
    })();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", pinWaechter);
  else pinWaechter();

  function welle2Planen(){
    if (window.requestIdleCallback) window.requestIdleCallback(welle2, { timeout: 2500 });
    else setTimeout(welle2, 1200);
  }
  if (VORRAT === "sofort") welle2();
  else if (document.readyState === "complete") welle2Planen();
  else window.addEventListener("load", welle2Planen);
})();
</script>

<script>
var BASE_EL = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@e966e982e199d52034078d998a23f371683c795e/";
/* DREI Wege, wie eine Datei ankommt -- alle drei muessen abgefangen werden:
   1. direkt an den Kopf gehaengt (alte Loader-Generation)
   2. als KIND eines Containers, der als GANZES eingehaengt wird (Bubbles insertExpression)
   3. tief in einem Teilbaum */
function direkt(f){ var s=document.createElement("script"); s.src=BASE_EL+f; s.async=false; document.head.appendChild(s); }
function alsKind(f){
  var box=document.createElement("div");
  var s=document.createElement("script"); s.src=BASE_EL+f; s.async=false; box.appendChild(s);
  document.body.appendChild(box);
}
function tief(f){
  var a=document.createElement("div"), b=document.createElement("div"), c=document.createElement("span");
  var s=document.createElement("script"); s.src=BASE_EL+f; s.async=false;
  c.appendChild(s); b.appendChild(c); a.appendChild(b); document.body.appendChild(a);
}
window.addEventListener("load", function(){
  setTimeout(function(){ direkt("core.js"); alsKind("topics-manager.js"); tief("urls-table.js"); alsKind("core.css"); }, 60);
  window.__gesehen = [];
  new MutationObserver(function(m){
    for (var i=0;i<m.length;i++) for (var j=0;j<m[i].addedNodes.length;j++){
      var n=m[i].addedNodes[j];
      if (!n || n.nodeType!==1) continue;
      var u = n.tagName==="SCRIPT" ? n.getAttribute("src") : (n.tagName==="LINK" ? n.getAttribute("href") : null);
      if (u && u.indexOf("upstreem-ui@")>=0) window.__gesehen.push("direkt " + u.slice(u.lastIndexOf("/")+1));
      else if (n.querySelectorAll){
        var d=n.querySelectorAll('script[src*="upstreem-ui@"], link[href*="upstreem-ui@"]');
        for (var q=0;q<d.length;q++){ var v=d[q].getAttribute("src")||d[q].getAttribute("href"); window.__gesehen.push("im Teilbaum " + v.slice(v.lastIndexOf("/")+1)); }
        if (!d.length && n.tagName === "DIV") window.__gesehen.push("Container ohne Treffer: " + (n.innerHTML||"").slice(0,60));
      }
    }
  }).observe(document.documentElement, { childList: true, subtree: true });
  setTimeout(function(){
    var tags=[].slice.call(document.querySelectorAll('script[src*="upstreem-ui@"], link[href*="upstreem-ui@"]'));
    var kurz=function(e){ var u=e.src||e.href; return u.replace(/^.*upstreem-ui@[^/]+\//,"").replace(".min.","."); };
    var z={}; tags.forEach(function(e){ var k=kurz(e); z[k]=(z[k]||0)+1; });
    var UC=window.UpstreemCore;
    document.getElementById("out").textContent = JSON.stringify({
      tags: tags.length,
      mehrfach_im_dom: Object.keys(z).filter(function(k){ return z[k]>1; }),
      topics_manager_tags: tags.filter(function(e){ return kurz(e).indexOf("topics-manager.js")===0; }).length,
      urls_table_tags: tags.filter(function(e){ return kurz(e).indexOf("urls-table.js")===0; }).length,
      core_tags: tags.filter(function(e){ return /^core\./.test(kurz(e)); }).length,
      kern_teile: UC?Object.keys(UC).length:0,
      warnungen: window.__warn.length, gesehen: window.__gesehen
    }, null, 1);
  }, 7000);
});
</script>
