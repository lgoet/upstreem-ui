<style>
  /* Form der echten Bubble-Seite: der Koerper scrollt nicht, #main scrollt, darueber schwebt eine
     171px hohe Topbar -- genau der Wert, den --up-sticky-top annimmt. Ohne diese Form ist ein
     Sticky-Test wertlos.
     KEIN padding-top an #main: Chrome rechnet das obere Padding des Scrollcontainers auf den
     sticky-Versatz drauf (gemessen: 171 + 171 = 342). Der Platz kommt aus einem Abstandhalter. */
  html, body { margin: 0; height: 100%; }
  body { font-family: sans-serif; overflow: hidden; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 171px; z-index: 100;
    background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: flex-end;
    padding: 0 24px 12px; box-sizing: border-box; font: 600 20px/1 sans-serif; color: #111; }
  #main { height: 100vh; overflow-y: auto; padding: 0 24px 400px; box-sizing: border-box; }
  #spacer { height: 171px; }
  /* Der zu kurze Bubble-Wrapper mit overflow:hidden, den unclipAncestors aufmachen muss. */
  #wrap { overflow: hidden; }
  /* Haengende Transitions halten computed styles auf dem Startwert und sehen wie kaputte CSS aus.
     Mit ?notrans=1 aus. */
  body.notrans * { transition: none !important; animation: none !important; }
</style>
<script>
/* Die Seitenflaeche der echten App ist --up-surface -- daran haengt der Deckstreifen der
   klebenden Werkzeugleiste (.up-sticky .up-head::before) und der Grund des Seitenkopfes. Ein
   Harness mit weissem Koerper waere im Dunkelmodus ein anderer Test als die App: der Streifen
   waere dort #121212 auf weiss und damit als Rechteck sichtbar, obwohl in der App beide dieselbe
   Farbe haben. Also nach jedem Themenwechsel die Farbe der Wurzel auf Koerper und Topbar
   uebernehmen. */
window.addEventListener("DOMContentLoaded", function(){
  function sync(){
    var r = document.querySelector(".uts-root");
    if (!r) return;
    var c = getComputedStyle(r).getPropertyValue("--up-surface").trim() || "#fff";
    document.body.style.background = c;
    var t = document.getElementById("topbar");
    /* Halbtransparent wie in der App: nur so ist zu sehen, ob Zeilen dahinter hochlaufen. */
    if (t) t.style.background = "color-mix(in srgb, " + c + " 60%, transparent)";
  }
  sync(); setInterval(sync, 500);
});
</script>

/* Genau die zwei Sanitizer-Zeilen aus §46, wie im Run-JS-Schritt. */

  return window.__ROH
    .replace(/:\s*([,}\]])/g, ": null$1")
    .replace(/:\s*(yes|no)\s*([,}\]])/g, function (_, v, t) { return ": " + (v === "yes") + t; });
};

/* Der GANZE Payload als EIN Text, so wie ein Run-JS-Schritt ihn auch schicken darf --
   normParams in core muss das lesen. Mit instanceId, sonst landet der Aufruf zurecht in der
   Warteschlange von makeLate (kein Root mit id "default"). */

};

};
window.__loadEmpty = function () { window.renderTeams({ instanceId: "teams1", rows: [] }); };
window.__loadMany  = function () {
  var a = JSON.parse(window.__payload()), out = [], i, j;

    c.total_count = a.length * 3;
    out.push(c);
  }
  window.renderTeams({ instanceId: "teams1", rows: out });
};
/* Abgeschnittener Payload: muss den Lesefehler ins UI bringen, nicht ins Skelett laufen. */
