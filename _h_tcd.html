<meta charset="utf-8">
<link rel="stylesheet" href="core.css?v=2">
<link rel="stylesheet" href="topcitations-dashboard.css?v=2">
<body style="margin:0;padding:16px;width:1400px">
<script>window.__err=[];window.onerror=function(msg){window.__err.push(msg);};</script>
<div class="up-root tcd-root"
     data-instance="t1"
     data-cdn-pin=""
     data-isdark="no"
     data-processing="IS_PROCESSING"
     data-processing2="IS_PROCESSING_2"
     data-mode-fn="bubble_fn_tcdMode"
     data-rowclick-fn="bubble_fn_tcdRowClick"
     data-goto-fn="bubble_fn_tcdGoTo"
     data-export-fn="bubble_fn_tcdExportTable"
     data-types-fn="bubble_fn_tcdApplyTypeFilter"
     data-dimension-fn="bubble_fn_tcdFilterDimension"
     data-brand-fn="bubble_fn_tcdBrandMentioned">

  <div class="tcd-unit tcd-unit-left">
    <div class="tcd-head">
      <div class="tcd-mode" role="tablist" aria-label="Mode">
        <button class="tcd-mode-btn is-active" data-mode="domain" type="button" role="tab">Domains</button>
        <button class="tcd-mode-btn" data-mode="url" type="button" role="tab">URLs</button>
      </div>
      <div class="tcd-head-tools">
        <div class="tcl-seg" role="tablist" aria-label="Chart type">
          <button class="tcl-seg-btn is-active" data-chart="doughnut" role="tab" aria-selected="true" data-tip="Doughnut" aria-label="Doughnut">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
          </button>
          <button class="tcl-seg-btn" data-chart="bar" role="tab" aria-selected="false" data-tip="Bars" aria-label="Bars">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="9" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="tcd-box">
      <div class="tcd-panel-body">
        <div class="tcl-top-total"><span class="n">0</span><span class="lbl">Citations</span></div>
        <div class="up-donut-body"></div>
      </div>
    </div>
  </div>

  <div class="tcd-unit tcd-unit-right">
    <div class="tcd-head">
      <div class="tcd-heading tcd-heading-right"><span class="tcd-head-label">Top Domains</span><span class="tcd-head-sep"></span><span class="tcd-head-count"></span></div>
      <div class="tcd-head-tools">
        <button class="tcd-brand-toggle" type="button" data-tip="Filter by brand mention">
          <span class="tcd-brand-toggle-lbl">
            <img class="tcd-brand-logo" src="" style="display:none"/>
            <span class="tcd-brand-label"></span>
          </span>
          <span class="tcd-brand-check">
            <svg class="tcd-brand-check-yes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <svg class="tcd-brand-check-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </span>
        </button>
        <div class="tcd-filter">
          <button class="tcd-filter-btn tcd-iconbtn" type="button" data-tip="Filter" aria-label="Filter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            <span class="tcd-filter-badge"></span>
          </button>
          <div class="up-filter-menu" role="menu" aria-hidden="true"></div>
        </div>
        <button class="tcd-export tcd-iconbtn" type="button" data-tip="Export" aria-label="Export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="tcd-goto tcd-iconbtn" type="button" data-tip="Open" aria-label="Open">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </button>
      </div>
    </div>
    <div class="tcd-box">
      <div class="tct-table"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
