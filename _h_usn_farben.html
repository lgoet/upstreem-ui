<!doctype html><meta charset="utf-8">
<title>Seitenleiste: Luecke, Grundfarbe, Aktivzustand, Tastenkuerzel</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne" style="position:absolute;left:-4000px;top:0"></div>
<script>
/* Vier Angaben vom 07.09., je Thema geprueft:
     1  Luecke zwischen Zeichen und Wort eine Spur kleiner (8px)
     2  Grundfarbe der Menuepunkte in der Sekundaerfarbe
     3  der gewaehlte Punkt in der Primaerfarbe -- Zeichen UND Wort -- aber ohne mehr Gewicht
     4  das Tastenkuerzel der Schnellaktionen in der dritten Textstufe
   Punkt 3 hat zwei Haelften, und die zweite ist die, die man leicht vergisst: dass das Gewicht
   GLEICH bleibt. Deshalb wird es hier gegen den nicht gewaehlten Punkt verglichen, nicht gegen
   eine Zahl. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }

Promise.all([hol("core.css"), hol("sidebar.css"), hol("quick-actions.css")]).then(function(t){
  var f=document.createElement("iframe");
  f.style.cssText="width:400px;height:400px;border:0";
  document.getElementById("buehne").appendChild(f);
  var d=f.contentDocument, v=f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  t.forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });

  function pruefe(thema){
    var bar=d.createElement("div");
    bar.className="up-root up-portal usn-bar";
    bar.setAttribute("data-theme", thema);
    /* Handgebautes Markup mit genau den Klassen, die sidebar.js ausgibt -- die Datei selbst
       braucht Bubble-Attribute und einen Mount, und geprueft wird hier reine CSS. */
    bar.innerHTML =
      '<div class="usn-nav">' +
        '<button class="usn-item" type="button"><span class="usn-ic">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>' +
        '</span><span class="usn-txt">Nicht gewaehlt</span></button>' +
        '<button class="usn-item is-active" type="button"><span class="usn-ic">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>' +
        '</span><span class="usn-txt">Gewaehlt</span></button>' +
      '</div>' +
      '<button class="mqa-trigger" type="button"><span class="mqa-trigger-ic"></span>' +
        '<span class="mqa-trigger-label">Quick Actions</span>' +
        '<span class="mqa-kbd">⌘K</span></button>';
    d.body.appendChild(bar);
    var aus = bar.querySelector(".usn-item:not(.is-active)");
    var an  = bar.querySelector(".usn-item.is-active");
    var cw  = v.getComputedStyle(bar);
    var ergebnis = {
      thema: thema,
      luecke: v.getComputedStyle(aus).gap,
      farbeAus: v.getComputedStyle(aus).color,
      farbeAn: v.getComputedStyle(an).color,
      icAus: v.getComputedStyle(aus.querySelector(".usn-ic")).color,
      icAn: v.getComputedStyle(an.querySelector(".usn-ic")).color,
      gewichtAus: v.getComputedStyle(aus).fontWeight,
      gewichtAn: v.getComputedStyle(an).fontWeight,
      kbd: v.getComputedStyle(bar.querySelector(".mqa-kbd")).color,
      tokenText: cw.getPropertyValue("--vc-text").trim(),
      tokenMuted: cw.getPropertyValue("--vc-muted").trim(),
      tokenThird: cw.getPropertyValue("--vc-third").trim(),
      breiteAus: Math.round(aus.getBoundingClientRect().width),
      breiteAn: Math.round(an.getBoundingClientRect().width)
    };
    return ergebnis;
  }
  function hex(rgb){
    var m = String(rgb).match(/(\d+),\s*(\d+),\s*(\d+)/); if (!m) return String(rgb);
    function z(n){ n=(+n).toString(16); return n.length<2 ? "0"+n : n; }
    return "#"+z(m[1])+z(m[2])+z(m[3]);
  }
  ["light","dark"].forEach(function(th){
    var e = pruefe(th);
    log(th.toUpperCase() + "   Tokens: Text " + e.tokenText + "  gedaempft " + e.tokenMuted +
        "  dritte " + e.tokenThird);
    log("   1  Luecke Zeichen/Wort: " + e.luecke);
    log("      " + ja(parseFloat(e.luecke) === 8) + " 8px");
    log("   2  nicht gewaehlt: Wort " + hex(e.farbeAus) + "   Zeichen " + hex(e.icAus));
    log("      " + ja(hex(e.farbeAus) === e.tokenMuted.toLowerCase()) + " Wort in der Sekundaerfarbe");
    log("      " + ja(hex(e.icAus) === e.tokenMuted.toLowerCase()) + " Zeichen ebenfalls");
    log("   3  gewaehlt: Wort " + hex(e.farbeAn) + "   Zeichen " + hex(e.icAn));
    log("      " + ja(hex(e.farbeAn) === e.tokenText.toLowerCase()) + " Wort in der Primaerfarbe");
    log("      " + ja(hex(e.icAn) === e.tokenText.toLowerCase()) + " Zeichen ebenfalls");
    log("      Gewicht: nicht gewaehlt " + e.gewichtAus + ", gewaehlt " + e.gewichtAn);
    log("      " + ja(e.gewichtAus === e.gewichtAn) + " kein zusaetzliches Gewicht");
    log("      Breite: " + e.breiteAus + "px gegen " + e.breiteAn +
        "px -- " + ja(e.breiteAus === e.breiteAn) + " die Zeile springt beim Wechsel nicht");
    log("   4  Tastenkuerzel: " + hex(e.kbd));
    log("      " + ja(hex(e.kbd) === e.tokenThird.toLowerCase()) + " in der dritten Textstufe");
    log("");
  });
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: " + e.message); });
</script>
