<!doctype html><meta charset="utf-8">
<title>Malen die Komponenten-Huellen im Dunkeln noch eine eigene Flaeche?</title>
<pre id="out" style="font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="rahmen"></div>
<script>
/* Gemeldet am 08.09. fuer sieben Komponenten nacheinander: "hat noch einen dunklen Hintergrund im
   Darkmode, hinter Heading und Toolbar zu erkennen". Immer dieselbe Ursache -- die Huelle malte
   var(--up-surface), also UNSEREN Wert fuer "die Farbe der Seite". Der ist nur dann unsichtbar,
   wenn die Seite in Bubble wirklich diese Farbe hat.
   Statt die Meldung ein achtes Mal einzeln zu bearbeiten, prueft dieser Prueftand die REGEL: die
   Huelle einer Komponente und ihre angeheftete Kopfzeile malen nichts. Was IN der Tabelle liegt
   (Zeilen, Kopfzeile der Tabelle, Karten) ist ausdruecklich nicht gemeint und wird nicht geprueft. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function ja(b){ return b ? "RICHTIG" : "FALSCH"; }
function durchsichtig(c){ return !c || c === "rgba(0, 0, 0, 0)" || c === "transparent"; }

var KOMP = [
  { name:"urls-table",      css:"urls-table.css",      js:"urls-table.js",      w:"uut-root",
    vorlage:"bubble/urls_table_bubble.html" },
  { name:"domains-table",   css:"domains-table.css",   js:"domains-table.js",   w:"udt-root",
    vorlage:"bubble/domains_table_bubble.html" },
  { name:"prompts-table",   css:"prompts-table.css",   js:"prompts-table.js",   w:"upt-root",
    vorlage:"bubble/prompts_table_bubble.html" },
  { name:"responses-table", css:"responses-table.css", js:"responses-table.js", w:"urt-root",
    vorlage:"bubble/responses_table_bubble.html" },
  { name:"teams",           css:"teams.css",           js:"teams.js",           w:"uts-root",
    vorlage:"bubble/teams_bubble.html" },
  { name:"ask-mira",        css:"ask-mira.css",        js:"ask-mira.js",        w:"am-root",
    vorlage:"bubble/ask_mira_bubble.html" }
];

function pruefe(k, kern){
  return Promise.all([hol(k.css), hol(k.js), hol(k.vorlage)]).then(function(t){
    var f = document.createElement("iframe");
    f.style.cssText = "width:1200px;height:150px;border:1px solid #ccc;display:block;margin-bottom:4px";
    document.getElementById("rahmen").appendChild(f);
    var d = f.contentDocument, v = f.contentWindow;
    d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
    try { v.localStorage.setItem("pref_theme","dark"); } catch(e){}
    v.__fehler = []; v.addEventListener("error", function(e){ v.__fehler.push(String(e.message)); });
    [kern.css, t[0]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
    var roh = t[2].replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim();
    var w = d.createElement("div"); w.innerHTML = roh;
    var r = w.querySelector("." + k.w) || w.querySelector(".up-root") || w.firstElementChild;
    if (!r) return { name:k.name, fehler:"keine Wurzel in der Vorlage" };
    r.setAttribute("data-instance", k.name + "_h"); r.setAttribute("data-cdn-pin","t");
    r.setAttribute("data-isdark","yes");
    d.body.appendChild(r);
    var j1=d.createElement("script"); j1.textContent=kern.js; d.head.appendChild(j1);
    var j2=d.createElement("script"); j2.textContent=t[1]; d.head.appendChild(j2);
    return warte(1800).then(function(){
      var wurzel = d.querySelector("." + k.w) || d.querySelector(".up-root");
      var kopf = d.querySelector(".up-head") || d.querySelector("[class*='pagehead']");
      var cw = wurzel ? v.getComputedStyle(wurzel).backgroundColor : null;
      var ck = kopf ? v.getComputedStyle(kopf).backgroundColor : null;
      var streifen = kopf ? v.getComputedStyle(kopf, "::before").backgroundColor : null;
      return { name:k.name, wurzel:cw, kopf:ck, streifen:streifen,
               ok: durchsichtig(cw) && (!kopf || durchsichtig(ck)) &&
                   (!streifen || durchsichtig(streifen)),
               fehlerZahl: v.__fehler.length };
    });
  }, function(e){ return { name:k.name, fehler:e.message }; });
}

Promise.all([hol("core.css"), hol("core.js")]).then(function(t){
  var kern = { css:t[0], js:t[1] };
  var raus = [];
  function naechste(i){
    if (i >= KOMP.length) return Promise.resolve();
    return pruefe(KOMP[i], kern).then(function(e){ raus.push(e); return naechste(i+1); });
  }
  log("Die Huelle und ihre angeheftete Kopfzeile duerfen nichts malen (dunkel)");
  log("");
  return naechste(0).then(function(){
    raus.forEach(function(e){
      if (e.fehler){ log("   " + e.name.padEnd(17," ") + " ABBRUCH: " + e.fehler); return; }
      log("   " + (e.ok ? "RICHTIG" : "FALSCH ") + "  " + e.name.padEnd(17," ") +
          " Wurzel " + String(e.wurzel).padEnd(22," ") +
          " Kopf " + String(e.kopf).padEnd(22," ") + " Streifen " + String(e.streifen));
    });
    var gut = raus.filter(function(e){ return e.ok; }).length;
    log("");
    log("==> " + ja(gut === KOMP.length) + "  " + gut + " von " + KOMP.length);
    log("FERTIG");
  });
}).catch(function(e){ log("ABBRUCH: " + e.message); });
</script>
