<meta charset="utf-8">
<link rel="stylesheet" href="core.css?v=e5">
<link rel="stylesheet" href="filters/date-range.css?v=e5">
<link rel="stylesheet" href="filters/topics-filter.css?v=e5">
<style>
  /* Host-Geometrie: Seite scrollt nicht, #main scrollt, Drawer als position:fixed auf z 9910,
     darin fremde Gruppen auf z 9 und 18. Identische Komponenten links auf der Seite und rechts
     im Drawer, damit der Unterschied direkt vergleichbar ist. */
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  body { overflow: hidden; background: #eee; }
  #main { height: 100vh; overflow: hidden auto; padding: 20px; }
  .wrap { position: relative; z-index: 5; overflow: hidden; padding: 10px; border: 1px dashed #bbb;
          display: flex; gap: 10px; align-items: flex-start; }
  .drawer { position: fixed; top: 0; right: 0; width: 620px; height: 100%; background: #fff;
            z-index: 9910; padding: 20px; overflow: hidden auto; }
  .fremd  { position: absolute; left: 0; right: 0; height: 300px; background: rgba(255,80,80,.30); }
  .fremd9 { top: 300px; z-index: 9; }
  .fremd18{ top: 480px; z-index: 18; }
  #out { font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; background: #fff; padding: 10px; margin-top: 12px; }
  button.tb { font: 12px system-ui; padding: 6px 10px; }
</style>
<body>
<div id="main">
  <button class="tb" onclick="probe().then(function(t){document.getElementById('out').textContent=t;})">TEST</button>
  <div class="wrap">
    <div class="up-root utf-root" id="pageTopics" data-instance="pt" data-isdark="no" data-isprocessing="no"></div>
    <div class="up-root udr-root" id="pageCal" data-instance="pc" data-isdark="no" data-isprocessing="no"></div>
  </div>
  <div id="out"></div>
  <div style="height:1200px"></div>
</div>

<div class="drawer" id="drawer">
  <div class="wrap">
    <div class="up-root utf-root" id="drwTopics" data-instance="dt" data-isdark="no" data-isprocessing="no"></div>
    <div class="up-root udr-root" id="drwCal" data-instance="dc" data-isdark="no" data-isprocessing="no"></div>
  </div>
  <div class="fremd fremd9"></div>
  <div class="fremd fremd18"></div>
  <div style="height:1400px"></div>
</div>

<script src="core.js?v=e5"></script>
<script src="filters/topics-filter.js?v=e5"></script>
<script src="filters/date-range.js?v=e5"></script>
<script>
window.setUpstreemTopics && window.setUpstreemTopics(JSON.stringify([
  {topic_id:"t1", name:"Digitalisierung", emoji:null, hex_light:"#575757", hex_dark:"#575757", prompt_count:12},
  {topic_id:"t2", name:"Solar", emoji:null, hex_light:"#8d6a11", hex_dark:"#8d6a11", prompt_count:9},
  {topic_id:"t3", name:"LeadGen", emoji:"⚡", hex_light:"#787878", hex_dark:"#787878", prompt_count:7}
]));

function hitAt(x,y){ var e=document.elementFromPoint(x,y); return e? String(e.id||e.className||e.tagName).slice(0,28):'null'; }
/* Statisch messen: das Browser-Pane friert Transitions ein, wenn es nicht rendert -- jede
   Messung waehrend der 140ms-Einblendung ist dann Zufall. Transition aus = reproduzierbar. */
function freeze(on){
  var id = 'freezeStyle', el = document.getElementById(id);
  if (on && !el){ el = document.createElement('style'); el.id = id;
    el.textContent = '.utf-menu, .udr-menu { transition: none !important; }'; document.head.appendChild(el); }
  if (!on && el) el.remove();
}
function restRect(menu){
  var pt = menu.style.transform; menu.style.transform = 'none';
  var r = menu.getBoundingClientRect(); menu.style.transform = pt; return r;
}

function probe(){
  freeze(true);
  var o = [];
  o.push("KONTROLLE vw=" + innerWidth + " | Mitte=" + hitAt(innerWidth/2, innerHeight/2));
  var faelle = [
    ["Topics  SEITE ", "#pageTopics", ".utf-trigger", ".utf-menu"],
    ["Topics  DRAWER", "#drwTopics",  ".utf-trigger", ".utf-menu"],
    ["Kalend. SEITE ", "#pageCal",    ".udr-trigger", ".udr-menu"],
    ["Kalend. DRAWER", "#drwCal",     ".udr-trigger", ".udr-menu"]
  ];
  faelle.forEach(function(f){
    var root = document.querySelector(f[1]);
    var trig = root && root.querySelector(f[2]);
    var menu = root && root.querySelector(f[3]);
    if (!trig || !menu){ o.push(f[0] + ": Markup fehlt (trigger=" + !!trig + " menu=" + !!menu + ")"); return; }
    var rest = restRect(menu);
    trig.click();
    var e = menu.getBoundingClientRect();
    o.push(f[0] + " | popover=" + (menu.getAttribute("popover")||"null") +
      " | ruhe l=" + rest.left.toFixed(1) + " r=" + rest.right.toFixed(1) +
      " | offen l=" + e.left.toFixed(1) + " r=" + e.right.toFixed(1) +
      " | dl=" + (e.left-rest.left).toFixed(1) + " dr=" + (e.right-rest.right).toFixed(1) +
      " | Deckung=" + hitAt(e.left+e.width/2, Math.min(e.bottom-8, innerHeight-8)));
    trig.click();
  });
  freeze(false);
  return Promise.resolve(o.join("\n"));
}
</script>
