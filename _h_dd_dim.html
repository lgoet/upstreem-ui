<script>
/* Gleicher Aufbau fuer BEIDE Komponenten, damit der Vergleich etwas wert ist: dasselbe Dokument,
   dieselbe core.js, derselbe Klick. Gemessen wird der gleitende Streifen (--up-seg-*) und die
   Klassen am Umschalter -- Bild fuer Bild. */
window.__fehler = []; window.__ev = [];
window.onerror = function(m){ window.__fehler.push(String(m)); };
["uutSearch","uutSort","uutFilter","uutBrand","uutRowClick","uutPage","uutMentioned",
 "tcdMode","tcdRowClick","tcdGoTo","tcdExportTable","tcdApplyTypeFilter","tcdFilterDimension","tcdBrandMentioned"]
  .forEach(function(n){ window["bubble_fn_"+n] = function(a,b){ window.__ev.push([n,a,b]); }; });
try { localStorage.clear(); } catch(e){}
</script>

<script>
window.__uutRows = [
  { url:"https://dbaudio.com/pricing", title:"Pricing", domain:"dbaudio.com", favicon:"",
    global_share_pct:6.1, share_delta_pct:0.3, used_total:22, url_type:"guide",
    citation_type:"Editorial", last_seen:"2026-08-01T10:00:00+00:00", total_count:2 },
  { url:"https://rcf.it/blog/guide", title:"Guide", domain:"rcf.it", favicon:"",
    global_share_pct:4.4, share_delta_pct:-0.2, used_total:15, url_type:"review",
    citation_type:"Competition", last_seen:"2026-07-20T10:00:00+00:00", total_count:2 }
];
window.__load = function(){
  window.renderUrlsTable({ instanceId:"u1", rows: window.__uutRows, totalCount: 2 });
  window.renderTopCitations({ instanceId:"t1", mode:"url", totalCountUrl:2, citations_total:100,
    top_urls: window.__uutRows.map(function(r){ return { url:r.url, title:r.title, favicon:"",
      global_share_pct:r.global_share_pct, share_delta_pct:r.share_delta_pct,
      used_total:r.used_total, url_type:r.url_type }; }),
    types_breakdown:[{type:"guide",share_pct:55},{type:"review",share_pct:45}] });
};

/* Liest den Zustand des Streifens an EINEM Umschalter. */
window.__seg = function(box){
  if (!box) return null;
  var cs = getComputedStyle(box);
  var aktiv = box.querySelector("button.is-active");
  return {
    klassen: box.className,
    gleitend: box.classList.contains("is-gleitend"),
    sofort: box.classList.contains("is-sofort"),
    x: cs.getPropertyValue("--up-seg-x").trim(),
    w: cs.getPropertyValue("--up-seg-w").trim(),
    aktiv: aktiv ? aktiv.getAttribute("data-dim") : null,
    aktivGrund: aktiv ? getComputedStyle(aktiv).backgroundColor : null,
    vorGrund: getComputedStyle(box, "::before").backgroundColor,
    vorOpacity: getComputedStyle(box, "::before").opacity,
    vorTransform: getComputedStyle(box, "::before").transform
  };
};
window.__dimBox = function(sel){ return document.querySelector(sel + " .up-filter-dim"); };
</script>
