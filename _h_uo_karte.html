<!doctype html><meta charset="utf-8">
<title>Opportunities: was auf der Karte steht -- und was die Kaskade daraus macht</title>
<pre id="out" style="font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="rahmen"></div>
<script>
/* Der erste Anlauf dieser Aenderungen war WIRKUNGSLOS, und das ist der Grund fuer diesen
   Prueftand: die neuen Regeln standen VOR den Originalen in derselben Datei, und bei gleicher
   Spezifitaet gewinnt die spaetere. Auf dem Schirm hat sich nichts geaendert, im Quelltext schon
   -- die schlimmste Sorte Fix.
   Geprueft wird darum nicht "steht die Regel da", sondern was der Browser am Ende WIRKLICH
   rechnet: getComputedStyle an den echten Knoten einer gerenderten Karte. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function ja(b){ return b ? "RICHTIG" : "FALSCH"; }
function durchsichtig(c){ return !c || c === "rgba(0, 0, 0, 0)" || c === "transparent"; }

Promise.all(["core.css","opportunities.css","core.js","opportunities.js",
             "bubble/opportunities_bubble.html"].map(hol)).then(function(t){
  var f = document.createElement("iframe");
  f.style.cssText = "width:1240px;height:620px;border:1px solid #ccc;display:block";
  document.getElementById("rahmen").appendChild(f);
  var d = f.contentDocument, v = f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  try { v.localStorage.setItem("pref_theme","dark"); } catch(e){}
  v.__fehler = []; v.addEventListener("error", function(e){ v.__fehler.push(String(e.message)); });
  [t[0],t[1]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var roh = t[4].replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim();
  var w = d.createElement("div"); w.innerHTML = roh;
  var r = w.querySelector(".uo-root") || w.firstElementChild;
  r.setAttribute("data-instance","uo_karte"); r.setAttribute("data-cdn-pin","t");
  r.setAttribute("data-isdark","yes");
  d.body.appendChild(r);
  var j1=d.createElement("script"); j1.textContent=t[2]; d.head.appendChild(j1);
  var j2=d.createElement("script"); j2.textContent=t[3]; d.head.appendChild(j2);
  return warte(1500).then(function(){
    /* Eine Karte mit allem, was der Bericht nennt. */
    /* Der Setter heisst opportunitiesSetItems und nimmt die LISTE, nicht ein Objekt mit
       instance_id -- steht so in opportunities.js:1008. */
    v.opportunitiesSetItems([{
      id:"o1", status:"Pending", recommendation_type:"Create Matching Content",
      headline:"Vergleichsseite fuer Modell X bauen",
      reason:"Diese Domain wird zitiert, deine Seite fehlt in der Aufzaehlung.",
      lead_title:"Die 7 besten Modelle 2026", lead_domain:"beispiel.de",
      created_at:"2026-09-01", topics:"" }]);
    return warte(1200).then(function(){ return { d:d, v:v }; });
  });
}).then(function(u){
  var d = u.d, v = u.v;
  function cs(sel){ var e = d.querySelector(sel); return e ? v.getComputedStyle(e) : null; }
  var karte = cs(".uo-card"), spalte = cs(".uo-col"), kopf = cs(".uo-col-head"),
      koerper = cs(".uo-col-body"), eyebrow = cs(".uo-eyebrow"), grund = cs(".uo-card-reason"),
      fuss = cs(".uo-card-foot"), titel = cs(".uo-source-title"), domain = cs(".uo-source-domain"),
      punkt = cs(".uo-col-dot"), ctitel = cs(".uo-col-title"), zahl = cs(".uo-col-count");
  if (!karte){ log("ABBRUCH: keine Karte gerendert   Fehler: " + JSON.stringify(v.__fehler.slice(0,2))); return; }
  var wurzel = v.getComputedStyle(d.querySelector(".uo-root"));
  var colBg = wurzel.getPropertyValue("--uo-col-bg").trim();
  var pruef = [
    ["Spalte ohne eigene Flaeche",        durchsichtig(spalte.backgroundColor)],
    ["Spaltenkoerper ohne Seitenpolster", parseFloat(koerper.paddingLeft) === 0 && parseFloat(koerper.paddingRight) === 0],
    ["Kopfzeile ohne Seitenpolster",      parseFloat(kopf.paddingLeft) === 0 && parseFloat(kopf.paddingRight) === 0],
    ["Kopfzeile ohne Rundung oben",       parseFloat(kopf.borderTopLeftRadius) === 0],
    /* Die Karte traegt jetzt den Grund der Seite -- den Ton, den die Ueberschriften abgegeben
       haben. Verglichen wird gegen den Token, nicht gegen einen Zahlenwert im Test. */
    ["Karte traegt --up-surface",         karte.backgroundColor ===
                                          "rgb(8, 9, 10)".replace("8, 9, 10", (function(){
                                            var h = wurzel.getPropertyValue("--up-surface").trim().replace("#","");
                                            return [0,2,4].map(function(i){ return parseInt(h.substr(i,2),16); }).join(", ");
                                          })())],
    ["Kopfzeile der Spalte OHNE Flaeche", durchsichtig(kopf.backgroundColor)],
    ["Zeile mit Titel+Werkzeugen OHNE Flaeche", (function(){
        var h = d.querySelector(".up-head");
        return !h || durchsichtig(v.getComputedStyle(h).backgroundColor);
      })()],
    /* DER SCHALTER IM POPOVER -- und warum hier der TOKEN geprueft wird und nicht die gezeichnete
       Farbe. Aufgefallen ist der Fall bei dieser Messung: die Schiene stand hell im dunklen
       Menue. Ursache war ein FESTER Wert in der Regel (#d6d6d4), und feste Werte erben nicht
       ueber eine Attributgrenze -- Token tun es. Der Schalter holt seine Schiene jetzt aus
       --up-switch-off, und der Token ist in jedem Themenblock gesetzt.
       Die GEZEICHNETE Farbe taugt hier nicht als Messwert: in diesem Aufbau entstehen die
       Popover-Knoten, BEVOR core data-theme setzt, und Chrome rechnet den Stil solcher Knoten
       danach nicht neu -- derselbe Befund wie am 07.09. beim Schalter im Kalender (ein frischer
       Klon an derselben Stelle bekommt sofort den richtigen Wert). Die echte App zeichnet ihre
       Popover-Inhalte erst nach dem Thema; dass die Schiene DORT stimmt, misst
       _h_switch_orte.html auf allen drei Untergruenden. */
    ["Token der Schiene ist dunkel", (function(){
        var sw = d.querySelector(".up-menu .up-switch, .up-pop-row .up-switch");
        if (!sw) return true;
        var t = v.getComputedStyle(sw).getPropertyValue("--up-switch-off").trim();
        return t === "#444444";
      })()],
    ["Typ oben ohne Flaeche",             durchsichtig(eyebrow.backgroundColor)],
    ["Beschreibung nicht sichtbar",       grund.display === "none"],
    ["Datum unten nicht sichtbar",        fuss.display === "none"],
    ["Titel in Sekundaerfarbe",           titel.color === wurzel.getPropertyValue("--vc-muted").trim() ||
                                          titel.color !== wurzel.getPropertyValue("--vc-text").trim()],
    ["Domain in Drittfarbe",              domain.color !== titel.color],
    ["Punkt 10px",                        Math.round(parseFloat(punkt.width)) === 10],
    ["Spaltentitel 15px",                 Math.round(parseFloat(ctitel.fontSize)) === 15],
    ["Zaehler 16px und leichter",         Math.round(parseFloat(zahl.fontSize)) === 16 &&
                                          parseInt(zahl.fontWeight,10) < parseInt(ctitel.fontWeight,10)]
  ];
  log("--uo-col-bg = " + colBg + "   Kartenflaeche = " + karte.backgroundColor);
  /* WER MALT UEBERHAUPT? Gemeldet am 08.09.: hinter den Karten, hinter den drei Ueberschriften und
     oben hinter Ueberschrift und Werkzeugleiste stehe im Dunkeln noch eine Flaeche. Statt zu
     suchen, wird gezaehlt: jedes Element im Bauteil, das eine nicht durchsichtige Flaeche traegt,
     mit Klasse und Farbe. Ohne diese Liste repariert man die Stelle, die man vermutet. */
  var maler = [];
  [].forEach.call(d.querySelectorAll(".uo-root, .uo-root *"), function(el){
    var c = v.getComputedStyle(el).backgroundColor;
    if (durchsichtig(c)) return;
    var kl = String(el.className || el.tagName).split(" ")[0];
    maler.push(kl + "  " + c);
  });
  var zusammen = {};
  maler.forEach(function(m){ zusammen[m] = (zusammen[m] || 0) + 1; });
  log("");
  log("FLAECHEN IM BAUTEIL (Klasse, Farbe, Anzahl):");
  Object.keys(zusammen).sort().forEach(function(k){ log("   " + zusammen[k] + "x  " + k); });
  log("");
  pruef.forEach(function(p){ log("   " + (p[1] ? "RICHTIG" : "FALSCH ") + "  " + p[0]); });
  log("");
  log("Fehler im Rahmen: " + v.__fehler.length);
  log("==> " + ja(pruef.every(function(p){ return p[1]; }) && !v.__fehler.length));
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"").split("\n").slice(0,3).join("\n")); });
</script>
