<!doctype html><meta charset="utf-8">
<title>Konto-Menue: wird der Logout unten abgeschnitten?</title>
<pre id="out" style="font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="rahmen"></div>
<script>
/* Dreimal gemeldet: "der Logout-Button wird abgeschnitten, gleiches Bottom-Padding wie oben".
   Zweimal habe ich eine Regel geschrieben -- padding-bottom steht laengst da. Also wird jetzt
   gemessen, WORAN es liegt: an der Polsterung, an einer Hoehenbegrenzung, oder daran, dass das
   Menue nach oben aufklappt und oben aus dem Bild laeuft. Drei verschiedene Ursachen mit
   demselben Bild. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function ja(b){ return b ? "RICHTIG" : "FALSCH"; }

Promise.all(["core.css","sidebar.css","core.js","sidebar.js","bubble/sidebar_bubble.html"].map(hol))
.then(function(t){
  var f = document.createElement("iframe");
  f.style.cssText = "width:420px;height:760px;border:1px solid #ccc;display:block";
  document.getElementById("rahmen").appendChild(f);
  var d = f.contentDocument, v = f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0;height:100%'></body></html>"); d.close();
  try { v.localStorage.setItem("pref_theme","dark"); } catch(e){}
  v.__fehler = []; v.addEventListener("error", function(e){ v.__fehler.push(String(e.message)); });
  [t[0],t[1]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var roh = t[4].replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim();
  d.body.innerHTML = roh;
  /* Die Wurzel heisst .usn-root (so steht sie in der Bubble-Vorlage); .usn-bar baut sidebar.js
     selbst darin auf. Der erste Anlauf suchte .usn-bar und fand vor dem Start nichts. */
  var r = d.querySelector(".usn-root") || d.querySelector("[class*='usn']");
  if (r){ r.setAttribute("data-cdn-pin","t"); r.setAttribute("data-isdark","yes"); }
  var j1=d.createElement("script"); j1.textContent=t[2]; d.head.appendChild(j1);
  var j2=d.createElement("script"); j2.textContent=t[3]; d.head.appendChild(j2);
  return warte(1600).then(function(){ return { d:d, v:v }; });
}).then(function(u){
  var d = u.d, v = u.v;
  var knopf = d.querySelector("[data-acc]") || d.querySelector(".usn-acc");
  log("Ausloeser gefunden: " + !!knopf + "   Fehler: " + u.v.__fehler.length);
  if (knopf) knopf.click();
  return warte(600).then(function(){
    var menu = d.querySelector("[data-acc-menu]");
    if (!menu) { log("ABBRUCH: kein Konto-Menue im DOM"); return; }
    var cs = v.getComputedStyle(menu);
    var kasten = menu.getBoundingClientRect();
    var letzte = menu.lastElementChild ? menu.lastElementChild.lastElementChild : null;
    var lk = letzte ? letzte.getBoundingClientRect() : null;
    log("");
    log("DAS MENUE");
    log("   Polster oben " + cs.paddingTop + "   unten " + cs.paddingBottom);
    log("   Hoehe " + Math.round(kasten.height) + "px   Inhalt " + menu.scrollHeight +
        "px   max-height " + cs.maxHeight + "   overflow-y " + cs.overflowY);
    log("   Oberkante " + Math.round(kasten.top) + "   Unterkante " + Math.round(kasten.bottom) +
        "   Fensterhoehe " + v.innerHeight);
    if (lk){
      log("   letzte Zeile: \"" + (letzte.textContent||"").trim().slice(0,24) + "\"" +
          "   Unterkante " + Math.round(lk.bottom) + "   Luft bis zum Menuerand " +
          Math.round(kasten.bottom - lk.bottom) + "px");
    }
    var polsterGleich = cs.paddingTop === cs.paddingBottom;
    var passtRein = menu.scrollHeight <= Math.ceil(kasten.height) + 1;
    var imBild = kasten.top >= 0 && kasten.bottom <= v.innerHeight + 1;
    var luftUnten = lk ? (kasten.bottom - lk.bottom) : 0;
    log("");
    log("   ==> " + ja(polsterGleich) + "  Polster oben und unten gleich");
    log("   ==> " + ja(passtRein) + "  der Inhalt passt in das Menue (sonst scrollt oder schneidet es)");
    log("   ==> " + ja(imBild) + "  das Menue steht vollstaendig im Bild");
    log("   ==> " + ja(luftUnten >= parseFloat(cs.paddingBottom) - 1) +
        "  unter der letzten Zeile steht die volle Polsterung (" + Math.round(luftUnten) + "px)");
    log("FERTIG");
  });
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"").split("\n").slice(0,3).join("\n")); });
</script>
