<!doctype html><meta charset="utf-8">
<title>Markenzeile in der Leiste und die Einstellung dahinter</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne" style="position:absolute;left:-4000px;top:0"></div>
<script>
/* Angefordert am 07.09.: "mach in die Sidebar nach ganz oben links mein Logo und den
   Teamswitcher quasi eine Row tiefer" plus eine Einstellung "Show upstreem branding", Vorgabe an.
   Vier Dinge, die man dabei falsch machen kann, und darum geprueft werden:
     1  Die Reihenfolge im DOM -- Marke VOR der Teamzeile.
     2  Der Rueckfall: ohne Bildquelle darf die Zeile nicht leer sein.
     3  Die Vorgabe: ohne gespeicherte Einstellung ist die Marke DA.
     4  Das Umschalten wirkt ohne Neuladen und verschiebt die Leiste NICHT -- die Zeile bleibt
        stehen, weil der Einklappknopf darin sitzt. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok,ms); }); }

Promise.all([hol("core.css"), hol("core.js"), hol("sidebar.css"), hol("sidebar.js"),
             hol("quick-actions.css")]).then(function(t){
  var f=document.createElement("iframe");
  f.style.cssText="width:400px;height:700px;border:0";
  document.getElementById("buehne").appendChild(f);
  var d=f.contentDocument, v=f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  try { v.localStorage.clear(); v.localStorage.setItem("pref_theme","dark"); } catch(e){}
  [t[0], t[2], t[4]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var host=d.createElement("div");
  host.className="up-root usn-root"; host.setAttribute("data-instance","marke");
  host.setAttribute("data-isdark","yes"); host.setAttribute("data-cdn-pin","t");
  host.setAttribute("data-team-id","1");
  d.body.appendChild(host);
  [t[1], t[3]].forEach(function(j){ var sc=d.createElement("script"); sc.textContent=j; d.head.appendChild(sc); });
  return warte(1600).then(function(){
    var bar=d.querySelector(".usn-bar");
    if (!bar){ log("ABBRUCH: keine .usn-bar gebaut"); return; }
    var UC=v.UpstreemCore;
    var marke=bar.querySelector(".usn-brand"), top=bar.querySelector(".usn-top");
    if (!marke || !top){ log("ABBRUCH: Markenzeile oder Teamzeile fehlt"); return; }

    log("1  Reihenfolge");
    var vorher = marke.compareDocumentPosition(top) & Node.DOCUMENT_POSITION_FOLLOWING;
    log("   " + ja(!!vorher) + " die Markenzeile steht VOR der Teamzeile");
    log("   " + ja(!!marke.querySelector("[data-toggle]")) + " der Einklappknopf sitzt in der Markenzeile");
    log("   " + ja(!top.querySelector("[data-toggle]")) + " und nicht mehr in der Teamzeile");
    /* Dieselbe linke Kante: das ist der Grund fuer die -8px und die 0 6px im CSS. */
    var wort=marke.querySelector(".usn-brand-word, .usn-brand-img");
    var teamLogo=top.querySelector(".usn-teamlogo");
    if (wort && teamLogo){
      var a=wort.getBoundingClientRect().left, b=teamLogo.getBoundingClientRect().left;
      log("   " + ja(Math.abs(a-b) < 1.5) + " Marke und Teamlogo auf derselben linken Kante (" +
          Math.round(a) + " gegen " + Math.round(b) + ")");
    }
    log("");
    log("2  Rueckfall ohne Bildquelle");
    log("   " + ja(!!marke.querySelector(".usn-brand-word")) +
        " der Schriftzug steht als Text da: \"" +
        (marke.querySelector(".usn-brand-word") || {}).textContent + "\"");
    log("");
    log("3  Vorgabe");
    log("   getPref(\"branding\") = " + (UC.getPref ? UC.getPref("branding") : "?"));
    log("   " + ja(UC.getPref("branding") === "on") + " ohne gespeicherte Wahl ist sie AN");
    var sicht=v.getComputedStyle(marke.querySelector(".usn-brand-mark")).visibility;
    log("   " + ja(sicht === "visible") + " und die Marke ist sichtbar (" + sicht + ")");
    log("");
    log("4  Umschalten");
    var vorH=Math.round(marke.getBoundingClientRect().height);
    var navVor=Math.round(bar.querySelector(".usn-nav").getBoundingClientRect().top);
    UC.setPref("branding","off");
    return warte(120).then(function(){
      var nachSicht=v.getComputedStyle(marke.querySelector(".usn-brand-mark")).visibility;
      var nachH=Math.round(marke.getBoundingClientRect().height);
      var navNach=Math.round(bar.querySelector(".usn-nav").getBoundingClientRect().top);
      log("   " + ja(nachSicht === "hidden") + " nach setPref(\"off\") ist die Marke weg (" + nachSicht + ")");
      log("   " + ja(vorH === nachH) + " die Zeile behaelt ihre Hoehe (" + vorH + " -> " + nachH + ")");
      log("   " + ja(navVor === navNach) + " die Navigation darunter springt nicht (" + navVor + " -> " + navNach + ")");
      log("   " + ja(!!marke.querySelector("[data-toggle]")) + " der Einklappknopf bleibt bedienbar");
      /* Und mit Bildquelle: das Attribut wird live mitgelesen. */
      host.setAttribute("data-upstreem-logo", "_h_logo.svg");
      return warte(200).then(function(){
        var img=marke.querySelector(".usn-brand-img");
        log("");
        log("5  Bildquelle, live gesetzt");
        log("   " + ja(!!img) + " aus data-upstreem-logo wird ein Bild" +
            (img ? " (" + img.getAttribute("src") + ")" : ""));
        log("   " + ja(!marke.querySelector(".usn-brand-word")) + " und der Text weicht");
        UC.setPref("branding","on");
        log("FERTIG");
      });
    });
  });
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"")); });
</script>
