<meta charset="utf-8"><title>Themawechsel, alle Detailseiten</title><pre id="out">laeuft</pre>
<div class="up-root udd-root" data-instance="d1" data-isdark="no"></div>
<div class="up-root urd-root" data-instance="r1" data-isdark="no"></div>
<div class="up-root uud-root" data-instance="u1" data-isdark="no"></div>
<script>
Promise.all(["core.js","domain-detail.js","response-detail.js","url-detail.js"].map(function(f){
  return fetch(f + "?n=" + Math.random(), { cache: "no-store" }).then(function(r){ return r.text(); });
})).then(function(qs){
  qs.forEach(function(t){ var e = document.createElement("script"); e.textContent = t; document.head.appendChild(e); });
  setTimeout(function(){
    function stand(){
      return {
        domain: document.querySelector(".udd-root").getAttribute("data-theme"),
        response: document.querySelector(".urd-root").getAttribute("data-theme"),
        url: document.querySelector(".uud-root").getAttribute("data-theme")
      };
    }
    var log = [{ wann: "start", stand: stand() }];
    window.setUpstreemTheme("dark");
    setTimeout(function(){
      log.push({ wann: "nach dark", stand: stand() });
      window.setUpstreemTheme("light");
      setTimeout(function(){
        log.push({ wann: "nach light", stand: stand() });
        window.__ok = log;
        document.getElementById("out").textContent = JSON.stringify(log, null, 1);
      }, 400);
    }, 400);
  }, 900);
});
</script>
