<meta charset="utf-8">
<link rel="stylesheet" href="core.css?v=perf1">
<link rel="stylesheet" href="visibility-chart.css?v=perf1">
<body style="margin:0;padding:20px;font-family:sans-serif;background:#fff">
<div class="up-root vot-root"
     data-instance="vc1" data-cdn-pin="" data-isdark="no"
     data-processing="no" data-processing2="no"
     data-gran-fn="bubble_fn_votGranularity"
     data-rowclick-fn="bubble_fn_votRowClick"
     data-goto-fn="bubble_fn_votGoTo"
     data-sort-fn="bubble_fn_votSortTable"
     data-submit-fn="bubble_fn_votSubmitCompanies"
     data-export-fn="bubble_fn_votExportTable">
  <div class="vot-unit vot-unit-left">
    <div class="vot-head">
      <div class="vot-heading">Visibility over Time</div>
      <div class="vot-head-tools">
        <div class="vc-gran" role="tablist" aria-label="Granularity">
          <button class="vc-gran-btn is-active" data-gran="day" type="button" role="tab">Day</button>
          <button class="vc-gran-btn" data-gran="week" type="button" role="tab">Week</button>
          <button class="vc-gran-btn" data-gran="month" type="button" role="tab">Month</button>
        </div>
        <button class="vot-maximize vot-max-top vot-iconbtn" type="button" data-tip="Minimize" aria-label="Minimize">
          <svg class="ic-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline></svg>
          <svg class="ic-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"></polyline></svg>
        </button>
      </div>
    </div>
    <div class="vot-box vot-box-left">
      <div class="vot-panel-body">
        <button class="vot-scale-btn" type="button" data-tip="Chart Settings" aria-label="Chart Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="up-line-wrap"><canvas class="up-line-canvas"></canvas></div>
        <div class="up-legend"></div>
      </div>
    </div>
  </div>
  <div class="vot-unit vot-unit-right">
    <div class="vot-head">
      <div class="vot-heading vot-heading-right"><span class="vot-head-label">Top Brands</span><span class="vot-head-sep"></span><span class="vot-head-count"></span></div>
      <div class="vot-head-tools">
        <div class="vot-sort">
          <button class="vot-sort-btn vot-iconbtn" type="button" data-tip="Sort" aria-label="Sort">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
          </button>
          <div class="up-sort-menu" role="menu" aria-hidden="true"></div>
        </div>
        <div class="vot-filter">
          <button class="vot-filter-btn vot-iconbtn" type="button" data-tip="Filter brands" aria-label="Filter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            <span class="vot-filter-badge"></span>
          </button>
          <div class="up-ment-menu" role="menu" aria-hidden="true"></div>
        </div>
        <button class="vot-export vot-iconbtn" type="button" data-tip="Export" aria-label="Export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="vot-goto vot-iconbtn" type="button" data-tip="Open" aria-label="Open">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </button>
      </div>
    </div>
    <div class="vot-box vot-box-right"><div class="vt-table"></div></div>
  </div>
</div>
<script>
/* FRISCH laden statt ueber ?v= -- ein fester Versionsparameter liefert die gecachte Datei, und
   genau daran ist die Messung dreimal gescheitert. fetch(no-store) plus Einspeisen umgeht jeden
   Cache; window.__frisch sagt hinterher, WELCHE Fassung wirklich lief. */
window.__frisch = { laeuft: true };
(function(){
  Promise.all(["core.js","visibility-chart.js"].map(function(f){
    return fetch(f + "?n=" + Math.random(), { cache: "no-store" }).then(function(r){ return r.text(); });
  })).then(function(t){
    window.__frisch = { laeuft: false,
      coreHatHelfer: t[0].indexOf("function einmalProBild") >= 0,
      votNutztHelfer: t[1].indexOf("UC.einmalProBild(trendFitJetzt)") >= 0 };
    t.forEach(function(code){
      var s = document.createElement("script"); s.textContent = code; document.head.appendChild(s);
    });
    window.__frischFertig = true;
  });
})();
</script>
<script>
window.__events = [];
["votGranularity","votRowClick","votGoTo","votSortTable","votSubmitCompanies","votExportTable"]
  .forEach(function(n){ window["bubble_fn_"+n] = function(v){ window.__events.push([n, v]); }; });

var COMPANIES = [
  {company_id:"c1", name:"Toyota",  color:"#e11d48", favicon_url:"https://www.google.com/s2/favicons?domain=toyota.de&sz=64",     visibility_window_pct:42},
  {company_id:"c2", name:"Audi",    color:"#0ea5e9", favicon_url:"https://www.google.com/s2/favicons?domain=audi.de&sz=64",       visibility_window_pct:31},
  {company_id:"c3", name:"Volvo",   color:"#22c55e", favicon_url:"https://www.google.com/s2/favicons?domain=volvo.com&sz=64",     visibility_window_pct:18},
  {company_id:"c4", name:"VW",      color:"#a855f7", favicon_url:"https://www.google.com/s2/favicons?domain=volkswagen.de&sz=64", visibility_window_pct:9}
];
var DAYS = ["2026-07-28","2026-07-29","2026-07-30","2026-07-31","2026-08-01","2026-08-02","2026-08-03"];
var SERIES = [];
COMPANIES.forEach(function(c, ci){
  DAYS.forEach(function(d, di){
    SERIES.push({ company_id:c.company_id, day:d, visibility_pct: Math.max(0, c.visibility_window_pct + ((di*7+ci*13)%17) - 8) });
  });
});
var TABLE = COMPANIES.map(function(c, i){
  return { company_id:c.company_id, name:c.name, logo_url:c.favicon_url, position:i+1,
           visibility_pct:c.visibility_window_pct, visibility_delta_pct: (i%2?-1:1)*(2+i),
           avg_rank: 1.4+i, avg_rank_delta: (i%2?0.4:-0.3),
           sentiment: 78-i*11, sentiment_delta: (i%2?-3:5) };
});
window.addEventListener("load", function(){
  setTimeout(function(){
    window.renderVisibilityChart({ instanceId:"vc1", series:SERIES, companies:COMPANIES,
      filterCompanies:COMPANIES, table:TABLE, totalCount:4, granularity:"day" });
  }, 300);
});
</script>
