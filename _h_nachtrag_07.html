<!doctype html><meta charset="utf-8">
<title>Zwei Nachtraege vom 07.09.: Topics-Karte in Sekundaerfarbe, Mention-Schalter auf Deutsch</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne" style="position:absolute;left:-4000px;top:0"></div>
<script>
/* 1  Prompts Table, Karte "Verteilung nach Topics": Namen UND Zaehler in der Sekundaerfarbe.
      Geprueft wird an der gebauten Liste, nicht an der Regel -- die Vorgabe in core setzt beide
      auf die volle Textfarbe, und im Dunkeln stand am Zaehler zusaetzlich ein aufgehellter
      Sonderwert mit hoeherer Spezifitaet. Genau der haette die neue Regel geschlagen.
   2  Der Mention-Schalter im Top Citations Dashboard hat DREI Beschriftungen. Zwei davon standen
      in keinem Katalog und blieben deshalb englisch. Geprueft wird, was t() zurueckgibt. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok,ms); }); }
function hex(rgb){
  var m=String(rgb).match(/(\d+),\s*(\d+),\s*(\d+)/); if(!m) return String(rgb);
  function z(n){ n=(+n).toString(16); return n.length<2?"0"+n:n; }
  return "#"+z(m[1])+z(m[2])+z(m[3]);
}

Promise.all([hol("core.css"), hol("core.js"), hol("prompts-table.css")]).then(function(t){
  function rahmen(thema){
    var f=document.createElement("iframe");
    f.style.cssText="width:600px;height:400px;border:0";
    document.getElementById("buehne").appendChild(f);
    var d=f.contentDocument, v=f.contentWindow;
    d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
    try { v.localStorage.setItem("pref_theme", thema); v.localStorage.setItem("pref_locale","de"); } catch(e){}
    [t[0], t[2]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
    var host=d.createElement("div");
    host.className="up-root"; host.setAttribute("data-theme", thema);
    host.innerHTML='<div class="upt-kpis"><div class="upt-kpi upt-kpi-topics">' +
      '<div class="upt-kpi-head"><span class="upt-kpi-title">Verteilung</span></div>' +
      '<div class="upt-kpi-body"></div></div></div>';
    d.body.appendChild(host);
    var sc=d.createElement("script"); sc.textContent=t[1]; d.head.appendChild(sc);
    return warte(500).then(function(){ return { d:d, v:v, host:host }; });
  }
  function messe(thema){
    return rahmen(thema).then(function(u){
      var UC=u.v.UpstreemCore;
      if (!UC || !UC.makeBarList){ log(thema + ": ABBRUCH, kein UC.makeBarList"); return; }
      var koerper=u.host.querySelector(".upt-kpi-body");
      /* Signatur laut core: makeBarList(cfg) mit mount, isDark, labelCol als FUNKTION, pctCol.
         items tragen key/name/share/color. */
      var liste=UC.makeBarList({ mount: koerper, isDark: function(){ return thema === "dark"; },
                                 labelCol: function(){ return true; }, pctCol: true,
                                 fmt: function(v){ return String(v); } });
      liste.render([
        { key:"t1", name:"Preise",  share:42, color:"#3586e6" },
        { key:"t2", name:"Support", share:19, color:"#349f40" }
      ]);
      return warte(250).then(function(){
        var lbl=u.host.querySelector(".up-bar-labeltxt");
        var pct=u.host.querySelector(".up-bar-pctcol");
        var cw=u.v.getComputedStyle(u.host);
        var muted=cw.getPropertyValue("--vc-muted").trim().toLowerCase();
        if (!lbl || !pct){
          log("   " + thema + ": nur " + (lbl?"Name":"") + (pct?" Zaehler":"") +
              " gefunden -- die Liste hat Beschriftungsspalte oder Wertspalte nicht gebaut");
          return;
        }
        var cl=hex(u.v.getComputedStyle(lbl).color), cp=hex(u.v.getComputedStyle(pct).color);
        log("   " + thema.padEnd(6," ") + " Name " + cl + "   Zaehler " + cp + "   --vc-muted " + muted);
        log("      " + ja(cl === muted) + " Name in der Sekundaerfarbe");
        log("      " + ja(cp === muted) + " Zaehler ebenfalls");
      });
    });
  }
  log("1  Prompts Table, Karte Verteilung nach Topics");
  return messe("light").then(function(){ return messe("dark"); }).then(function(){
    log("");
    log("2  Der Mention-Schalter, Katalog Deutsch");
    return rahmen("light").then(function(u){
      var UC=u.v.UpstreemCore;
      if (!UC){ log("   ABBRUCH: kein UC"); return; }
      if (UC.setPref) UC.setPref("locale","de");
      var faelle = [
        ["{brand} mentioned?",     "Nike erwähnt?"],
        ["{brand} is mentioned",   "Nike wird erwähnt"],
        ["{brand} is not mentioned","Nike wird nicht erwähnt"]
      ];
      faelle.forEach(function(p){
        var raus = UC.t(p[0]).replace("{brand}", "Nike");
        log("   " + ja(raus === p[1]) + " " + p[0] + "  ->  \"" + raus + "\"" +
            (raus === p[1] ? "" : "   erwartet: \"" + p[1] + "\""));
      });
      log("");
      log("FERTIG");
    });
  });
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"")); });
</script>
