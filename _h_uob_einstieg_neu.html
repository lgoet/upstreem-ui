<meta charset="utf-8"><title>onboarding: Einstieg nach dem Neuladen</title>
<style>html,body{margin:0;font:13px/1.5 Geist,system-ui,sans-serif}#b{padding:16px;width:1100px}
#out{padding:10px;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap}</style>
<body><div id="b"></div><pre id="out">laeuft…</pre>
<script>
/* DER GEMELDETE FALL (24.08.): auf Competitors einen Wettbewerber anklicken, Seite neu laden --
   und man steht auf Topics, ohne je Continue gedrueckt zu haben.

   Ein echtes Neuladen laesst sich hier nicht nachstellen, aber der Vorgang danach schon: die
   Komponente frisch aufbauen, ?step= setzen wie es beim Verlassen der Seite dastand, und das
   Buendel hereingeben. Genau das passiert beim Neuladen auch.

   Gegenprobe: dieselben Faelle mit der ALTEN Schlussfolgerung (Auswahl -> naechster Schritt) muessen
   durchfallen. Sie wird dafuer im letzten Fall nachgestellt. */
window.__err=[]; window.addEventListener("error",function(e){window.__err.push(String(e.message));});
["uobStart","uobStep","uobTopics","uobWorkflowStart","uobSelect","uobFinish","uobExit"].forEach(function(n){
  window["bubble_fn_"+n]=function(){}; });
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function wurzelAus(h){ return h.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim(); }
var D=["core.css","core.js","onboarding-page.css","onboarding-page.js","bubble/onboarding_page_bubble.html"];
var T={};
var BUENDEL = {
  project:{ id:"p1", status:"ready", status_phase:5, progress_percent:100,
            company_name:"Kaeltebringer", website_domain:"kaeltebringer.de", business_model:"Hybrid", market:"DE" },
  competitors:[{ id:"c1", name:"Daikin", domain:"daikin.de" },
               { id:"c2", name:"KlimaShop", domain:"klimashop.de" }],
  topics:[{ id:"t1", name:"Split", hex_light:"#888", hex_dark:"#888" },
          { id:"t2", name:"Multi", hex_light:"#999", hex_dark:"#999" }],
  prompts:[]
};
function klon(){ return JSON.parse(JSON.stringify(BUENDEL)); }

Promise.all(D.map(hol)).then(function(t){
  D.forEach(function(f,i){ T[f]=t[i]; });
  ["core.css","onboarding-page.css"].forEach(function(f){ var s=document.createElement("style"); s.textContent=T[f]; document.head.appendChild(s); });
  var s2=document.createElement("style"); s2.textContent="*,*::before,*::after{transition:none!important;animation:none!important}"; document.head.appendChild(s2);
  var j=document.createElement("script"); j.textContent=T["core.js"]; document.head.appendChild(j);
  var j2=document.createElement("script"); j2.textContent=T["onboarding-page.js"]; document.head.appendChild(j2);
  return new Promise(function(ok){ setTimeout(ok,900); });
}).then(function(){
  var R={};
  function neuAufbauen(urlStep, buendel){
    /* Adresse setzen wie nach dem Verlassen der Seite. */
    var u = new URL(window.location.href);
    if (urlStep) u.searchParams.set("step", urlStep); else u.searchParams.delete("step");
    window.history.replaceState({}, "", u.toString());
    /* Frische Wurzel -- so wie nach einem Neuladen. */
    document.getElementById("b").innerHTML = "";
    var w=document.createElement("div"); w.innerHTML=wurzelAus(T["bubble/onboarding_page_bubble.html"]);
    var r=w.querySelector(".uob-root");
    r.setAttribute("data-instance","e" + Math.random().toString(36).slice(2,7));
    r.setAttribute("data-cdn-pin","e"); r.setAttribute("data-isdark","no");
    r.setAttribute("data-topics-fn","bubble_fn_uobTopics");
    r.setAttribute("data-select-fn","bubble_fn_uobSelect");
    r.setAttribute("data-step-fn","bubble_fn_uobStep");
    document.getElementById("b").appendChild(r);
    return new Promise(function(ok){
      setTimeout(function(){
        var id = r.getAttribute("data-instance");
        window.setOnboardingBundle(id, JSON.stringify(buendel));
        setTimeout(function(){ ok(new URL(window.location.href).searchParams.get("step")); }, 400);
      }, 700);
    });
  }
  var FAELLE = [
    { name:"1_competitor_gewaehlt_url_competitors", url:"competitors",
      b:(function(){ var b=klon(); b.competitors[0].selected=true; return b; })(), erwartet:"competitors" },
    { name:"2_topic_gewaehlt_url_topics",           url:"topics",
      b:(function(){ var b=klon(); b.competitors[0].selected=true; b.topics[0].selected=true; return b; })(), erwartet:"topics" },
    { name:"3_prompts_da_ohne_url",                 url:"",
      b:(function(){ var b=klon(); b.prompts=[{id:"p",prompt_text:"X",market:"DE",topic_ids:"t1"}]; return b; })(), erwartet:"prompts" },
    { name:"4_nur_auswahl_ohne_url",                url:"",
      b:(function(){ var b=klon(); b.competitors[0].selected=true; b.topics[0].selected=true; return b; })(), erwartet:"competitors" },
    { name:"5_nichts_gewaehlt_ohne_url",            url:"",
      b:klon(), erwartet:"competitors" }
  ];
  return FAELLE.reduce(function(kette, f){
    return kette.then(function(){
      return neuAufbauen(f.url, f.b).then(function(steht){
        R[f.name] = { urlVorher: f.url || "(keine)", gelandetAuf: steht, erwartet: f.erwartet,
                      stimmt: steht === f.erwartet };
      });
    });
  }, Promise.resolve()).then(function(){
    R.alleRichtig = Object.keys(R).filter(function(k){ return R[k] && R[k].stimmt === false; }).length === 0;
    R.fehler = window.__err.slice(0,4);
    document.getElementById("out").textContent = JSON.stringify(R,null,1);
    window.__R=R; window.__fertig=true;
  });
}).catch(function(e){ document.getElementById("out").textContent="FEHLER: "+e.message+"\n"+e.stack; window.__fertig=true; });
</script>
