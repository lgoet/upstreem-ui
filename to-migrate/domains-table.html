<!--
  UPSTREEM — DOMAINS TABLE (standalone, Citations main page)

  Table only. The chart lives in its own component; this is the bigger, full-width
  Top-Domains table with its own toolbar.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance        = "ROOTID_[dynamic id]"   unique per placement
  data-isdark          = "yes" / "no"
  data-brand-name      = the brand's display name (for the "X mentioned" toggle)
  data-brand-logo      = the brand's logo url (optional)
  data-export-instance = the instanceId of the EXPORT POPUP component you place on
                         the same page (e.g. "export_citations"). Clicking Export here
                         calls window.upstreemExportOpen(thatId) — see "Export" below.

  ── Event names must be unique per placement ─────────────────────────────────
  data-search-fn="bubble_fn_udtSearch_[dynamic id]"
  data-sort-fn="bubble_fn_udtSort_[dynamic id]"
  data-filter-fn="bubble_fn_udtFilter_[dynamic id]"
  data-brand-fn="bubble_fn_udtBrand_[dynamic id]"
  data-rowclick-fn="bubble_fn_udtRowClick_[dynamic id]"
  data-page-fn="bubble_fn_udtPage_[dynamic id]"
  data-mentioned-fn="bubble_fn_udtMentioned_[dynamic id]"

  Every one fires ONE JSON string (same shape as Mira's miraAction and the export
  popup), values pulled out on the Bubble side by regex. All of them are SERVER-side:
  they tell Bubble to re-run the RPC — this component never filters or sorts locally.

    search   {"query":"nike","query_folded":"nike","query_de":"nike","requestId":"udt_…"}
    sort     {"sort_field":"share","sort_dir":"desc"}
    filter   {"citation_types":"Editorial,Competition"}
    brand    {"brand_mentioned":"yes"}          "yes" | "no" | ""  (empty = off)
    rowclick {"domain":"youtube.com"}
    page      {"limit":25,"offset":50,"page":3}   -> p_limit / p_offset in your RPC
    mentioned {"brands":"id1,id2"}                -> multi-brand mention filter

  Regex, as everywhere else:
    (?<="query":")[^"]*        (?<="query_folded":")[^"]*   (?<="query_de":")[^"]*
    (?<="requestId":")[^"]*    (?<="sort_field":")[^"]*     (?<="sort_dir":")[^"]*
    (?<="citation_types":")[^"]*                            (?<="brand_mentioned":")[^"]*
    (?<="brands":")[^"]*       (?<="domain":")[^"]*
    (?<="limit":)[0-9]+        (?<="offset":)[0-9]+         (?<="page":)[0-9]+

  ── Export ───────────────────────────────────────────────────────────────────
  Place the export popup component anywhere on the same page and give it an
  instanceId, e.g. "export_citations". Put that same string in data-export-instance
  here. The Export button then just calls upstreemExportOpen() on it — no second
  popup, no duplicated markup. If the id doesn't match anything, the button logs a
  warning naming the id it looked for rather than doing nothing silently.

  ── Filling the table ────────────────────────────────────────────────────────
  window.renderDomainsTable({ instanceId: "...", rows: [...], totalCount: 123 });
  window.setDomainsTableLoading("INSTANCE_ID", "yes" | "no");

  Row fields (straight from your RPC, no renaming needed):
    domain, favicon, share_pct, share_delta_pct, urls_count, last_used_at,
    citation_type, runs_with_domain
  "Used" reads runs_with_domain (falling back to used_total / used / total_used) —
  NOT total_count, which is the same grand total on every row.
-->
<div class="udt-root"
     data-instance="INSTANCE_ID"
     data-isdark="IS_DARK"
     data-brand-name="BRAND_NAME"
     data-brand-logo="BRAND_LOGO"
     data-processing="IS_PROCESSING"
     data-export-instance="EXPORT_INSTANCE_ID"
     data-search-fn="bubble_fn_udtSearch"
     data-sort-fn="bubble_fn_udtSort"
     data-filter-fn="bubble_fn_udtFilter"
     data-brand-fn="bubble_fn_udtBrand"
     data-rowclick-fn="bubble_fn_udtRowClick"
     data-page-fn="bubble_fn_udtPage"
     data-mentioned-fn="bubble_fn_udtMentioned">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap");

    .udt-root {
      --vc-text: #1f1f1b; --vc-muted: #6f737c; --vc-border: #e0e2e6;
      --vc-bg: #ffffff; --vc-heading-bg: #f5f5f5; --vc-sk: #e8e8e8;
      --vc-switch-bg: #f5f5f5; --vc-switch-border: #e0e2e6; --vc-third: #9e9e9e;
      --vt-head-bg: rgba(245,245,245,0.3); --vt-logo-bg: #ffffff; --vt-row-hover: rgba(245,245,245,0.75);
      --vt-up: #2ea84a; --vt-down: #b0200c;
      --vc-hover-border: #6f6f6f;
      /* Sticky-Header: Abstand von oben in px. DAS ist die Zahl, die du anpasst, damit der
         Header sichtbar unter deiner Topbar einrastet (Topbar ~157px, Content startet 171px).
         Einfach den Wert hier aendern - KEIN Bubble-Attribut noetig. */
      --udt-sticky-top: 171px; --udt-thead-off: 32px;
      display: flex; flex-direction: column; position: relative;
      font-family: Geist, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--vc-text); width: 100%; box-sizing: border-box; -webkit-font-smoothing: antialiased;
    }
    .udt-root * { box-sizing: border-box; }
    .udt-root[data-theme="dark"] {
      --vc-text: #e0e0e0; --vc-muted: #a0a0a0; --vc-border: #353535;
      --vc-bg: #1b1b1b; --vc-heading-bg: rgba(42,42,42,0.6); --vc-sk: #3a3a3a;
      --vc-switch-bg: rgba(42,42,42,0.6); --vc-switch-border: #353535; --vc-third: #808080;
      --vt-head-bg: #121212; --vt-logo-bg: #e0e0e0; --vt-row-hover: rgba(42,42,42,0.6);
      --vt-up: #60d25d; --vt-down: #d25d5d;
      --vc-hover-border: #707070;
    }

    /* ---------- toolbar ---------- */
    .udt-head { display: flex; align-items: center; height: 32px; margin-bottom: 16px; gap: 8px; }
    .udt-heading { display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; color: var(--vc-text); line-height: 1.2; white-space: nowrap; }
    /* separator + count exactly as in the other components: 4px dot, 8px gap either side */
    .udt-head-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--vc-muted); margin: 0 8px; flex: 0 0 auto; display: none; }
    .udt-head-count { font-size: 14px; font-weight: 500; color: var(--vc-muted); display: none; }
    .udt-head-count.is-sk { width: 28px; height: 14px; border-radius: 4px; background: var(--vc-sk); animation: udtpulse 1.2s ease-in-out infinite; }
    .udt-heading.has-count .udt-head-sep, .udt-heading.has-count .udt-head-count { display: block; }
    .udt-head-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: 0 0 auto; }

    .udt-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border: 0; border-radius: 8px;
      background: transparent; color: #6f6f6f; cursor: pointer; padding: 0; flex: 0 0 auto; position: relative;
    }
    .udt-root[data-theme="dark"] .udt-iconbtn { color: #a0a0a0; }
    .udt-iconbtn:hover { color: var(--vc-text); background: var(--vc-heading-bg); }
    .udt-iconbtn svg { width: 16px; height: 16px; display: block; }

    /* export: a real filled button, identical to the one in the export popup component */
    .udt-export {
      display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px;
      border: 0; border-radius: 8px; background: var(--vc-text); color: var(--vc-bg);
      font: inherit; font-size: 12px; font-weight: 560; line-height: 1;
      white-space: nowrap; cursor: pointer; outline: 0; flex: 0 0 auto;
      transition: opacity .14s ease;
    }
    .udt-export:hover { opacity: .9; }
    .udt-export svg { width: 16px; height: 16px; flex: 0 0 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- search (slides out from the magnifier) ---------- */
    .udt-search { display: inline-flex; align-items: center; flex: 0 0 auto; position: relative; }
    /* Magnifier stays on the left; when opened, the box grows to its right and, because the tools
       are right-aligned, the whole search shifts left. Active = primary color, no background. */
    .udt-search.is-open .udt-search-btn { color: var(--vc-text); background: transparent; }
    .udt-search-box {
      width: 0; opacity: 0; pointer-events: none; overflow: hidden;
      display: flex; align-items: center; position: relative;
      transition: width .22s cubic-bezier(.22,1,.36,1), opacity .16s ease, margin-left .22s cubic-bezier(.22,1,.36,1);
      margin-left: 0;
    }
    .udt-search.is-open .udt-search-box { width: 200px; opacity: 1; pointer-events: auto; margin-left: 2px; }
    /* No box/border — just free text like Notion's in-table search. */
    .udt-search-input {
      flex: 1 1 auto; min-width: 0; height: 32px; padding: 0;
      border: 0; background: transparent; color: var(--vc-text);
      font: inherit; font-size: 13px; outline: 0;
    }
    .udt-search-input::placeholder { color: var(--vc-third); }
    /* The clear button's slot is ALWAYS reserved (visibility, not display), so text never shifts
       when the x appears. */
    .udt-search-clear {
      flex: 0 0 20px; width: 20px; height: 20px; border: 0; border-radius: 6px; background: transparent;
      color: var(--vc-muted); cursor: pointer; padding: 0; margin-left: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      visibility: hidden;
    }
    .udt-search-clear svg { width: 13px; height: 13px; display: block; }
    .udt-search-clear:hover { color: var(--vc-text); background: var(--vc-heading-bg); }
    .udt-search.has-text .udt-search-clear { visibility: visible; }
    /* Mobile: an open search takes over the toolbar row. Below MOBILE_SEARCH_MAX the other
       tools hide so the field spans from the heading to the right edge; they return on close. */
    .udt-root.is-searchtakeover .udt-head-tools { flex: 1 1 auto; min-width: 0; }
    .udt-root.is-searchtakeover .udt-head-tools > :not(.udt-search) { display: none !important; }
    .udt-root.is-searchtakeover .udt-search { flex: 1 1 auto; min-width: 0; }
    .udt-root.is-searchtakeover .udt-search-box { width: auto; flex: 1 1 auto; }
    .udt-root.is-searchtakeover .udt-heading { display: none; }             /* search owns the whole row */
    .udt-root.is-searchtakeover .udt-search-clear { visibility: visible; }  /* far-right X closes/resets search */

    /* ---------- column info icon + explainer tooltip ---------- */
    .udt-th-info {
      width: 14px; height: 14px; flex: 0 0 14px; margin-left: auto;
      color: var(--vc-third); opacity: 0; transition: opacity .14s ease;
    }
    .udt-th-info svg { width: 14px; height: 14px; display: block; }
    .udt-th:hover .udt-th-info { opacity: 1; }
    /* Appended to <body>, so it sits OUTSIDE .udt-root — the component's CSS variables do not
       reach here and every colour has to be literal. Using var(--vc-text) was exactly why the
       dark panel rendered with no background at all. */
    .udt-explain {
      position: fixed; z-index: 2147483001; width: 248px; padding: 8px;
      border-radius: 14px; background: #1f1f1b;
      box-shadow: 0 12px 32px rgba(0,0,0,.28);
      opacity: 0; pointer-events: none; transition: opacity .14s ease, transform .14s ease;
      transform: translateY(-4px);
      font-family: Geist, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      box-sizing: border-box;
    }
    .udt-explain * { box-sizing: border-box; }
    .udt-explain.is-on { opacity: 1; transform: translateY(0); }
    /* caret, positioned per-instance so it always points at the info icon that opened it */
    .udt-explain::before {
      content: ""; position: absolute; top: -6px; left: var(--udt-caret, 50%);
      transform: translateX(-50%);
      border-left: 12px solid transparent; border-right: 12px solid transparent;
      border-bottom: 11px solid #1f1f1b;
    }
    /* flipped above the header when there is no room below */
    .udt-explain.is-flipped::before {
      top: auto; bottom: -10px;
      border-bottom: 0; border-top: 11px solid #1f1f1b;
    }
    /* the visual sits in its own light panel on top; explanation below it on the dark ground */
    .udt-explain-vis {
      background: #ffffff; border-radius: 9px; padding: 11px 12px;
      display: flex; flex-direction: column; gap: 7px; align-items: flex-start;
      margin-bottom: 9px; min-height: 46px; justify-content: center;
    }
    .udt-explain-h { font-size: 14.5px; font-weight: 600; line-height: 1.2; padding: 0 3px; margin-bottom: 4px; color: #ffffff; }
    .udt-explain-t { font-size: 13.5px; font-weight: 400; line-height: 1.5; padding: 0 3px; color: rgba(255,255,255,0.68); }
    /* dark mode inverts the whole card; the inner panel stays a light surface either way */
    .udt-explain-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 7px;
      font-size: 11px; font-weight: 600; white-space: nowrap; }
    .udt-explain-row { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: #1f1f1b; }
    .udt-explain-row svg { width: 14px; height: 14px; display: block; }
    .udt-explain-up { color: #2ea84a; }
    .udt-explain-down { color: #b0200c; }

    /* ---------- pagination ---------- */
    .udt-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-top: 16px; min-height: 32px; flex-wrap: wrap;
    }
    .udt-pagesize { display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .udt-pagesize-lbl { font-size: 12px; font-weight: 400; color: var(--vc-muted); white-space: nowrap; }
    .udt-pagesize-seg { display: inline-flex; align-items: center; gap: 0; height: 32px; padding: 0;
      background: var(--vc-switch-bg); border-radius: 8px; }
    .udt-pagesize-btn { height: 32px; min-width: 34px; padding: 0 9px; border: 1px solid transparent; border-radius: 8px;
      background: transparent; color: var(--vc-muted); cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 500; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; }
    .udt-pagesize-btn:hover:not(.is-active) { color: var(--vc-text); }
    .udt-pagesize-btn.is-active { background: #ffffff; color: var(--vc-text); border-color: var(--vc-switch-border); }
    .udt-root[data-theme="dark"] .udt-pagesize-btn.is-active { background: #121212; border-color: #353535; }

    .udt-pager { display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto; margin-left: auto; }
    .udt-pager-info { font-size: 12px; font-weight: 400; color: var(--vc-muted); white-space: nowrap; margin-right: 8px; }
    .udt-page {
      min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: 8px;
      background: transparent; color: var(--vc-muted); cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 500; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
    }
    /* :hover:not(:disabled) is (0,3,0) and outranks .is-active (0,2,0) — without excluding the
       active page here, hovering the page you are already on lightened it back up. */
    .udt-page:hover:not(:disabled):not(.is-active) { background: var(--vc-heading-bg); color: var(--vc-text); }
    .udt-page.is-active { background: var(--vc-text); color: var(--vc-bg); border-color: var(--vc-text); font-weight: 600; }
    .udt-page:disabled { opacity: .35; cursor: default; }
    .udt-page svg { width: 15px; height: 15px; display: block; }
    .udt-page-gap { min-width: 20px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
      color: var(--vc-third); font-size: 12px; flex: 0 0 auto; }
    .udt-root.is-vnarrow .udt-pager-info, .udt-root.is-vnarrow .udt-pagesize-lbl { display: none; }

    /* ---------- filter dropdown (citation types) ---------- */
    .udt-filter { position: relative; flex: 0 0 auto; }
    /* a labelled control rather than a bare icon: the active selection has to be readable
       without opening the menu */
    .udt-filter-btn {
      display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
      border: 1px solid var(--vc-border); border-radius: 8px; background: transparent;
      color: var(--vc-text); font: inherit; font-size: 12px; font-weight: 500; line-height: 1;
      cursor: pointer; white-space: nowrap; max-width: 220px;
    }
    /* Same hover/open treatment as every other dropdown trigger in the app: background goes to
       --vc-heading-bg, text to --vc-text, and the border is NOT re-coloured on open. */
    .udt-filter-btn:hover { background: var(--vc-heading-bg); color: var(--vc-text); border-color: var(--vc-hover-border); }
    .udt-filter-btn:hover .udt-filter-btn-chev { color: var(--vc-text); }
    .udt-filter.is-open .udt-filter-btn { background: transparent; color: var(--vc-text); border-color: var(--vc-hover-border); }
    .udt-filter.is-open .udt-filter-btn-chev { color: var(--vc-text); }
    /* An applied filter wears the same face as an open dropdown: border in --vc-hover-border,
       label in --vc-text, background still transparent. "This control is doing something" and
       "this control is open" are the same visual weight on purpose — both mean "look here". */
    .udt-filter.is-active .udt-filter-btn { background: transparent; color: var(--vc-text); border-color: var(--vc-hover-border); }
    .udt-filter.is-active .udt-filter-btn-chev { color: var(--vc-text); }
    /* Hovering an ACTIVE trigger swaps the chevron for an x: the shortcut out of the filter,
       without opening the menu to reach Reset. Inactive triggers keep their chevron. */
    .udt-filter-btn-clear { display: none; width: 14px; height: 14px; flex: 0 0 14px; color: var(--vc-muted); }
    .udt-filter-btn-clear:hover { color: var(--vc-text); }
    .udt-filter.is-active .udt-filter-btn:hover .udt-filter-btn-chev { display: none; }
    .udt-filter.is-active .udt-filter-btn:hover .udt-filter-btn-clear { display: block; }
    .udt-filter-btn-lbl { overflow: hidden; text-overflow: ellipsis; }
    .udt-filter-btn-chev { width: 14px; height: 14px; flex: 0 0 14px; color: var(--vc-muted); }
    .udt-filter-menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 60;
      min-width: 280px; max-width: 320px; max-height: 400px;
      background: var(--vc-bg); border: 1px solid var(--vc-border); border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: 6px;
      display: flex; flex-direction: column;
      opacity: 0; transform: translateY(-4px) scale(0.985); pointer-events: none; transition: opacity 140ms ease, transform 140ms ease;
    }
    .udt-filter-menu.is-shown { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .udt-root[data-theme="dark"] .udt-filter-menu { background: #151515; }
    .udt-filter-head { flex: 0 0 auto; height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 9px; margin-bottom: 6px; }
    .udt-filter-title { font-size: 11px; font-weight: 600; color: var(--vc-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .udt-filter-reset { border: 0; background: transparent; color: var(--vc-muted); font-family: inherit; font-size: 11px; font-weight: 500; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
    .udt-filter-reset:hover { color: var(--vc-text); }
    .udt-filter-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .udt-filter-item { display: flex; align-items: center; gap: 10px; padding: 6px 9px; border-radius: 8px; cursor: pointer; min-width: 0; }
    .udt-filter-item:hover { background: var(--vc-heading-bg); }
    .udt-filter-check { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--vc-border); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; color: #fff; }
    .udt-filter-check svg { width: 11px; height: 11px; display: none; }
    .udt-filter-item.is-checked .udt-filter-check { background: var(--vc-text); border-color: var(--vc-text); }
    .udt-root[data-theme="dark"] .udt-filter-item.is-checked .udt-filter-check { color: #1f1f1b; }
    .udt-filter-item.is-checked .udt-filter-check svg { display: block; }
    /* the dropdown shows the SAME chip the table uses — identical to TopCitations, so a type
       looks the same wherever it appears */
    .udt-filter-tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 7px;
      font-size: 12px; font-weight: 600; white-space: nowrap; max-width: 100%; overflow: hidden; }
    .udt-filter-tag-lbl { overflow: hidden; text-overflow: ellipsis; }
    .udt-filter-submit { flex: 0 0 auto; display: block; width: 100%; margin-top: 6px; height: 34px; border: 0; border-radius: 9px; background: var(--vc-text); color: #fff; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .udt-root[data-theme="dark"] .udt-filter-submit { color: #1f1f1b; }
    .udt-filter-submit:hover { background: #585855 !important; }
    .udt-root[data-theme="dark"] .udt-filter-submit:hover { background: #a0a0a0 !important; }

    /* ---------- mentioned brands filter (multi-select) ---------- */
    .udt-ment { position: relative; flex: 0 0 auto; }
    .udt-ment-btn {
      display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
      border: 1px solid var(--vc-border); border-radius: 8px; background: transparent;
      color: var(--vc-text); font: inherit; font-size: 12px; font-weight: 500; line-height: 1;
      cursor: pointer; white-space: nowrap; max-width: 200px;
    }
    .udt-ment-btn:hover { background: var(--vc-heading-bg); color: var(--vc-text); border-color: var(--vc-hover-border); }
    .udt-ment-btn:hover .udt-ment-chev { color: var(--vc-text); }
    .udt-ment.is-open .udt-ment-btn { background: transparent; color: var(--vc-text); border-color: var(--vc-hover-border); }
    .udt-ment.is-open .udt-ment-chev { color: var(--vc-text); }
    .udt-ment.is-active .udt-ment-btn { background: transparent; color: var(--vc-text); border-color: var(--vc-hover-border); }
    .udt-ment.is-active .udt-ment-chev { color: var(--vc-text); }
    .udt-ment-clear { display: none; width: 14px; height: 14px; flex: 0 0 14px; color: var(--vc-muted); }
    .udt-ment-clear:hover { color: var(--vc-text); }
    .udt-ment.is-active .udt-ment-btn:hover .udt-ment-chev { display: none; }
    .udt-ment.is-active .udt-ment-btn:hover .udt-ment-clear { display: block; }
    .udt-ment-lbl { overflow: hidden; text-overflow: ellipsis; }

    .udt-pop-head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .udt-pop-action { border: 0; background: transparent; color: var(--vc-muted); font-family: inherit;
      font-size: 11px; font-weight: 500; cursor: pointer; padding: 2px 4px; border-radius: 6px; text-transform: none; letter-spacing: 0; }
    .udt-pop-action:hover { color: var(--vc-text); }
    .udt-pop-head { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--vc-muted); padding: 4px 10px 8px; }
    .udt-pop-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--vc-text); }

    .udt-brand-toggle { display: none; align-items: center; justify-content: space-between; gap: 10px; height: 32px; padding: 0 8px; border-radius: 8px;
      background: transparent; border: 0; cursor: pointer; flex: 0 0 auto; }

    .udt-brand-check svg { width: 11px; height: 11px; display: none; }
    .udt-brand-toggle.is-yes .udt-brand-check, .udt-brand-toggle.is-no .udt-brand-check { background: var(--vc-text); border-color: var(--vc-text); }
    .udt-root[data-theme="dark"] .udt-brand-toggle.is-yes .udt-brand-check, .udt-root[data-theme="dark"] .udt-brand-toggle.is-no .udt-brand-check { color: #1f1f1b; }
    .udt-brand-toggle.is-yes .udt-brand-check .udt-brand-check-yes { display: block; }
    .udt-brand-toggle.is-no .udt-brand-check .udt-brand-check-no { display: block; }
    .udt-brand-logo { width: 16px; height: 16px; border-radius: 4px; flex: 0 0 auto; display: block; object-fit: cover; }
    .udt-brand-label { font-size: 12px; font-weight: 500; color: var(--vc-text); white-space: nowrap; }

    /* ---------- table ---------- */
    .udt-box { border: 1px solid var(--vc-border); background: var(--vc-bg); border-radius: 16px; overflow: hidden; }
    /* ---------- sticky header (default on >=1000px page width, off via data-sticky="no") ----------
       Both the component head and the column header stick to the scrolling ancestor. overflow:hidden
       on .udt-box would trap the column header, so in sticky mode it becomes visible and the visible
       border moves onto the header and body (see below). Backgrounds must be OPAQUE or rows bleed
       through while scrolling underneath. */
    .udt-sticky .udt-head {
      position: sticky; top: var(--udt-sticky-top); z-index: 6;
      background: var(--vc-bg);
      /* the 16px between head and table becomes opaque padding while stuck, so the gap stays but
         no rows show through it. height grows to match (border-box), otherwise the padding would
         eat into the 32px content box and clip the toolbar buttons. */
      margin-bottom: 0; height: 48px; padding-bottom: 16px;
    }
    /* Rows scroll up past the pinned header; without this they'd show behind a transparent page
       topbar. This opaque strip covers everything from the header up to the top of the viewport. */
    .udt-sticky .udt-head::before {
      content: ""; position: absolute; left: 0; right: 0; bottom: 100%;
      height: var(--udt-sticky-top); background: var(--vc-bg);
    }
    /* In sticky mode the box's visible border is dropped (kept transparent so layout doesn't
       shift) and drawn on the header and body instead. Both span the full width and align exactly,
       so there's no 1px offset between a header sitting inside the box border and the box's own
       border — that offset was what left a doubled corner and a missing straight top edge. */
    .udt-sticky .udt-box { overflow: visible; border-color: transparent; }
    .udt-sticky .udt-table { background: transparent; }
    .udt-sticky .udt-thead {
      position: sticky; top: calc(var(--udt-sticky-top) + var(--udt-thead-off)); z-index: 5;
      background-image: linear-gradient(var(--vt-head-bg), var(--vt-head-bg));
      background-color: var(--vc-bg);
      border: 1px solid var(--vc-border); border-bottom: none;
      border-top-left-radius: 16px; border-top-right-radius: 16px;
    }
    /* The rounded top corners are transparent by nature, so the body's straight side border shows
       through them as it scrolls behind the pinned header (the little vertical stub). These two
       corner pieces fill ONLY the triangle outside the radius with the page background, hiding that
       border while leaving the rounded corner itself (inside the radius) untouched. Absolute takes
       them out of the header's grid flow. */
    .udt-sticky .udt-thead::before,
    .udt-sticky .udt-thead::after {
      content: ""; position: absolute; top: -1px; width: 16px; height: 16px; pointer-events: none; z-index: 2;
    }
    .udt-sticky .udt-thead::before { left: -1px;  background: radial-gradient(circle at bottom right, rgba(0,0,0,0) 16px, var(--vc-bg) 16.5px); }
    .udt-sticky .udt-thead::after  { right: -1px; background: radial-gradient(circle at bottom left,  rgba(0,0,0,0) 16px, var(--vc-bg) 16.5px); }
    .udt-sticky .udt-tbody {
      border: 1px solid var(--vc-border); border-top: none;
      border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
      overflow: hidden;
    }
    .udt-table { width: 100%; display: flex; flex-direction: column; background: var(--vc-bg); }
    /* Column widths per spec. The percentages are MINIMUMS; the 1fr maxima let the
       flexible columns absorb the leftover space. Actions is fixed-width but allowed
       to grow, never to shrink below 120px. */
    .udt-thead, .udt-row {
      display: grid;
      grid-template-columns:
        minmax(25%, 1fr)      /* Domain     */
        minmax(18%, 150px)    /* Share      */
        minmax(10%, 1fr)      /* Used       */
        minmax(15%, 1fr)      /* Type       */
        minmax(104px, 0.7fr) /* Last Seen  */
        minmax(120px, auto);  /* Actions    */
      align-items: center;
    }
    .udt-thead { height: 45px; flex: 0 0 45px; background: var(--vt-head-bg); }
    .udt-th { font-size: 12px; font-weight: 400; color: var(--vc-muted); padding: 0 16px 0 12px; height: 100%;
      white-space: nowrap; overflow: hidden;
      display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--vc-border); border-bottom: 1px solid var(--vc-border); }
    .udt-th:last-child { border-right: none; }
    .udt-th.is-sortable { cursor: pointer; user-select: none; }

    .udt-root.is-resizing { cursor: col-resize; user-select: none; }

    .udt-th.is-sortable:hover { color: var(--vc-text); }

    /* header sorter: two 14px chevrons stacked, pulled together by 2px each */
    .udt-thsort { display: inline-flex; flex-direction: column; align-items: center; flex: 0 0 auto; line-height: 0; }
    .udt-thsort svg { width: 14px; height: 14px; display: block; color: var(--vc-third); transition: color 120ms ease; }
    .udt-thsort .udt-thsort-up { margin-bottom: -2px; }

    .udt-thsort.is-desc .udt-thsort-down { color: var(--vc-text); }

    .udt-th-sub { font-size: 11px; font-weight: 500; color: var(--vc-text); }

    .udt-tbody { display: flex; flex-direction: column; }
    .udt-row { height: 55px; flex: 0 0 55px; cursor: pointer; transition: background 120ms ease; }
    .udt-row:hover { background: var(--vt-row-hover); }
    .udt-td { height: 100%; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 12px; min-width: 0;
      border-right: 1px solid var(--vc-border); border-bottom: 1px solid var(--vc-border); }
    .udt-td:last-child { border-right: none; }
    .udt-tbody .udt-row:last-child .udt-td { border-bottom: none; }

    .udt-logo-box { width: 24px; height: 24px; border-radius: 8px; background: var(--vt-logo-bg); padding: 1px; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center; position: relative; }
    .udt-logo-box img { width: 22px; height: 22px; border-radius: 7px; object-fit: cover; display: block; }
    /* Letter fallback: a broken/missing favicon used to leave an empty square, which reads as a

    .udt-logo-ltr { font-size: 11px; font-weight: 600; color: var(--vc-muted); line-height: 1; text-transform: uppercase; }
    .udt-logo-box.has-img .udt-logo-ltr { display: none; }

    /* go-to arrow, revealed on row hover with a delay — same behaviour as the other tables */
    .udt-row-goto { margin-left: auto; width: 16px; height: 16px; flex: 0 0 auto; color: var(--vc-third);

    .udt-row-goto svg { width: 16px; height: 16px; display: block; }

    .udt-domain-wrap { display: flex; align-items: baseline; gap: 16px; min-width: 0; }   /* doubled — "x pages" needs air */
    .udt-name { font-size: 14px; font-weight: 500; color: var(--vc-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .udt-hl { background: rgba(255, 214, 10, 0.38); color: inherit; border-radius: 3px; padding: 0 1px; }

    .udt-pages { font-size: 12px; font-weight: 400; color: var(--vc-third); white-space: nowrap; flex: 0 0 auto; }
    .udt-num { font-size: 14px; font-weight: 500; color: var(--vc-text); white-space: nowrap; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .udt-used { font-size: 14px; font-weight: 500; color: var(--vc-text); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .udt-date { font-size: 12px; font-weight: 500; color: var(--vc-text); white-space: nowrap; }
    .udt-tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 7px;
      font-size: 12px; font-weight: 600; white-space: nowrap; max-width: 100%; overflow: hidden; }
    .udt-tag-lbl { overflow: hidden; text-overflow: ellipsis; }
    .udt-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .udt-trend svg { width: 16px; height: 16px; display: block; }
    .udt-trend.pos { color: var(--vt-up); }
    .udt-trend.neg { color: var(--vt-down); }

    .udt-actions { display: inline-flex; align-items: center; gap: 2px; flex: 0 0 auto; }
    .udt-td-actions { overflow: hidden; }
    .udt-actbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border: 0; border-radius: 7px;
      background: transparent; color: var(--vc-third); cursor: pointer; padding: 0; flex: 0 0 auto;
    }
    .udt-actbtn:hover { color: var(--vc-text); background: var(--vc-heading-bg); }
    .udt-actbtn svg { width: 15px; height: 15px; display: block; }

    /* brief checkmark after copying — confirms the action at the button itself, not only in the toast */
    /* `.udt-actbtn svg { display:block }` is more specific than a bare `.udt-ic-done`, which is
       why the checkmark showed permanently. Both states are qualified the same way now. */
    .udt-actbtn.is-done { color: var(--vt-up); }
    .udt-actbtn svg.udt-ic-done { display: none; }
    .udt-actbtn.is-done svg.udt-ic-copy { display: none; }
    .udt-actbtn.is-done svg.udt-ic-done { display: block; }

    .udt-empty { padding: 48px 24px; text-align: center; }
    .udt-empty-ic { width: 28px; height: 28px; margin: 0 auto 12px; color: var(--vc-third); }
    .udt-empty-ic svg { width: 28px; height: 28px; display: block; }
    .udt-empty-h { font-size: 14px; font-weight: 500; color: var(--vc-text); margin-bottom: 4px; }
    .udt-empty-t { font-size: 12.5px; color: var(--vc-muted); margin-bottom: 14px; }
    .udt-empty-btn { height: 32px; padding: 0 12px; border: 1px solid var(--vc-border); border-radius: 8px;
      background: transparent; color: var(--vc-text); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
    .udt-empty-btn:hover { background: var(--vc-heading-bg); }
    .udt-row.udt-tsk { cursor: default; }
    .udt-row.udt-tsk:hover { background: transparent; }
    .udt-tsk-bar { display: inline-block; height: 12px; border-radius: 4px; background: var(--vc-sk); animation: udtpulse 1.2s ease-in-out infinite; }
    .udt-tsk-logo { display: inline-block; width: 24px; height: 24px; border-radius: 8px; background: var(--vc-sk); animation: udtpulse 1.2s ease-in-out infinite; flex: 0 0 auto; }
    @keyframes udtpulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    /* Narrow layouts drop columns too, but that is handled together with the gear menu in
       applyCols() — an inline grid-template from JS would beat a class rule here, so both
       have to come from the same place. */
    /* ---------- progressive disclosure by width ----------
       Four breakpoints, dropping the least important control first. Order of sacrifice:
       brand toggle (a shortcut, reachable via the filter) → citation type label collapses to an
       icon-width control → sort (the header sorters still work) → columns gear. Export and search
       survive longest: export is the reason people come to the table, search is the only way to
       find something in a long list. */
    /* Labelled dropdowns are never squeezed into icon-sized buttons: a control that loses its
       label stops saying what it filters, which is the whole reason it is labelled. They drop out
       one at a time instead, least important first.
         w3  brand toggle      (a shortcut; the same filter exists in the dropdowns)
         w2  mentioned brands  (the broader of the two brand filters)
         w1  sort              (the header sorters still cover Share and Last Seen)
         w0  columns gear      + Export collapses to its icon
       Search and the type filter survive longest: search is the only way through a long list,
       and the type filter is the one people actually reach for. */
    .udt-root.is-w3 .udt-brand-toggle { display: none !important; }
    .udt-root.is-w2 .udt-ment { display: none; }
    .udt-root.is-w1 .udt-sort { display: none; }
    .udt-root.is-w0 .udt-cols { display: none; }
    .udt-root.is-w0 .udt-export span { display: none; }        /* export shrinks to its icon */
    .udt-root.is-w0 .udt-export { padding: 0 8px; }
    .udt-root.is-w0 .udt-search.is-open .udt-search-box { width: 120px; }
    .udt-root.is-vnarrow .udt-search.is-open .udt-search-box { width: 140px; }

    /* table: same idea, dropping cell content before dropping whole columns
       (a domain name you can't read is worse than a missing trend chip) */
    .udt-root.is-t2 .udt-td-actions, .udt-root.is-t2 .udt-th-actions { display: none !important; }
    .udt-root.is-t1 .udt-pages { display: none; }
    .udt-root.is-t0 .udt-trend { display: none; }

    /* ---------- tooltip (same as the other components) ---------- */
    .udt-tip {
      position: fixed; z-index: 2147483000; box-sizing: border-box;
      height: 24px; display: inline-flex; align-items: center; padding: 0 8px;
      border-radius: 6px; background: #1f1f1b; color: #ffffff;
      font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 500; line-height: 1;
      white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 120ms ease;
    }
    .udt-tip.is-on { opacity: 1; }
    /* Tooltips keep the same dark card in both themes: they float above the page, not inside
       the surface, so inverting them made them read as a different component. */
