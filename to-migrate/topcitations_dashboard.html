<!-- ============================================================================
     Upstreem — Top Citations Dashboard component
     LEFT  = Citation Type / URL Type doughnut+bar chart (same engine as the standalone Citations
             Overview chart), RIGHT = Top Domains / Top URLs table (same visual language as the
             Visibility chart's Top Brands table).

     ► SET IN THIS HTML (top, no workflow needed):
         data-instance="INSTANCE_ID"      → unique id per reusable/page
         data-isdark="IS_DARK"            → "yes" / "no"
         data-processing="IS_PROCESSING"  → "yes" shows skeleton
         data-processing2="IS_PROCESSING_2" → second independent loading flag; skeleton shows if EITHER is "yes"

     ► WORKFLOW STEP sends the payload (Run JavaScript), e.g.:
         (function(){
           var payload = {
             instanceId: "INSTANCE_ID",
             mode: "domain",                 // "domain" | "url" — which list/chart is active
             totalCountDomain: 42,            // optional: shown next to "Top Domains" while in domain mode
             totalCountUrl: 128,              // optional: shown next to "Top URLs" while in url mode
             citations_total: 15899,
             top_domains: [ {...}, ... ],     // present when mode === "domain"
             top_urls: [ {...}, ... ],        // present when mode === "url"
             // the API reuses THIS SAME field for both dimensions: citation-type slices in domain
             // mode, url-type slices in url mode — there is no separate url_types_breakdown field.
             types_breakdown: [ {type, share_pct}, ... ],
             brand: { id: "...", name: "ADAC", logo: "https://..." },  // for the "ADAC mentioned?" filter row
             filterTypeSel: [...], filterUrlTypeSel: [...], filterDimension: "citation_type", brandMentioned: ""  // "" | "yes" | "no"
           };
           var tries = 0;
           (function go(){
             var fn = window.renderTopCitations || (window.parent && window.parent.renderTopCitations);
             if (typeof fn === "function"){ fn(payload); return; }
             if (tries++ < 60) setTimeout(go, 100);
           })();
         })();
     ========================================================================== -->
<div class="tcd-root" data-instance="INSTANCE_ID" data-isdark="IS_DARK" data-processing="IS_PROCESSING" data-processing2="IS_PROCESSING_2"
     data-mode-fn="bubble_fn_tcdMode" data-rowclick-fn="bubble_fn_tcdRowClick" data-goto-fn="bubble_fn_tcdGoTo"
     data-export-fn="bubble_fn_tcdExportTable" data-types-fn="bubble_fn_tcdApplyTypeFilter"
     data-dimension-fn="bubble_fn_tcdFilterDimension" data-brand-fn="bubble_fn_tcdBrandMentioned">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap");

    /* ---------- shared root theme (matches the rest of the app) ---------- */
    .tcd-root {
      --vc-text: #1f1f1b; --vc-muted: #6f737c; --vc-border: #e0e2e6;
      --vc-bg: #ffffff; --vc-topbar-bg: #ffffff; --vc-heading-bg: #f5f5f5; --vc-sk: #e8e8e8;
      --vc-switch-bg: #f5f5f5; --vc-switch-border: #e0e2e6;
      --vc-primary: #14b8a6; --vc-third: #9e9e9e;
      --vt-head-bg: rgba(245,245,245,0.3); --vt-logo-bg: #ffffff; --vt-row-hover: rgba(245,245,245,0.75);
      --vt-up: #2ea84a; --vt-down: #b0200c;
      display: flex; flex-direction: row; align-items: stretch; position: relative; gap: 16px;
      font-family: Geist, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--vc-text); width: 100%; box-sizing: border-box; -webkit-font-smoothing: antialiased;
    }
    .tcd-root * { box-sizing: border-box; }
    .tcd-root[data-theme="dark"] {
      --vc-text: #e0e0e0; --vc-muted: #a0a0a0; --vc-border: #353535;
      --vc-bg: #1b1b1b; --vc-topbar-bg: #121212; --vc-heading-bg: rgba(42,42,42,0.6); --vc-sk: #3a3a3a;
      --vc-switch-bg: rgba(42,42,42,0.6); --vc-switch-border: #353535; --vc-third: #808080;
      --vt-head-bg: #121212; --vt-logo-bg: #e0e0e0; --vt-row-hover: rgba(42,42,42,0.6);
      --vt-up: #60d25d; --vt-down: #d25d5d;
    }

    /* ---------- two units: each = header + bordered box (475px total, matches the other elements) ---------- */
    .tcd-unit { display: flex; flex-direction: column; min-width: 0; }
    .tcd-unit-left  { flex: 0 0 35%; max-width: 35%; }
    .tcd-unit-right { flex: 1 1 65%; max-width: 65%; }
    .tcd-head { display: flex; align-items: center; height: 32px; margin-bottom: 16px; padding: 0; }
    .tcd-unit-left .tcd-head { padding-right: 0; }
    .tcd-heading { font-size: 14px; font-weight: 500; color: var(--vc-text); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tcd-head-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: 0 0 auto; }
    .tcd-box {
      flex: 1 1 auto; min-height: 0; height: 430px;   /* 45px table head + 7×55px rows, fits exactly */
      border: 1px solid var(--vc-border); background: var(--vc-bg); overflow: hidden;
      display: flex; flex-direction: column; position: relative; transition: background 200ms ease;
      border-radius: 16px;
    }
    .tcd-panel-body { flex: 1 1 auto; min-height: 0; padding: 16px; position: relative; display: flex; flex-direction: column; transition: opacity 200ms ease; }

    /* ---------- stacked (mobile) layout ---------- */
    .tcd-root.is-max, .tcd-root.is-narrow { flex-direction: column; gap: 32px; }
    .tcd-root.is-max .tcd-unit, .tcd-root.is-narrow .tcd-unit { flex: 0 0 auto; width: 100%; max-width: 100%; }
    .tcd-root.is-max .tcd-box, .tcd-root.is-narrow .tcd-box { height: 430px; }
    .tcd-root.is-max .tcd-unit-left .tcd-head, .tcd-root.is-narrow .tcd-unit-left .tcd-head { padding-right: 0; }

    /* ---------- icon buttons (32x32) ---------- */
    .tcd-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border: 0; border-radius: 8px;
      background: transparent; color: #6f6f6f; cursor: pointer; padding: 0; flex: 0 0 auto; position: relative;
    }
    .tcd-root[data-theme="dark"] .tcd-iconbtn { color: #a0a0a0; }
    .tcd-iconbtn:hover { color: var(--vc-text); }
    .tcd-root[data-theme="dark"] .tcd-iconbtn:hover { color: var(--vc-text); }
    .tcd-iconbtn svg { width: 16px; height: 16px; display: block; }

    /* dark button tooltip (Mira style) */
    .tcd-tip {
      position: fixed; z-index: 2147483000; box-sizing: border-box;
      height: 24px; display: inline-flex; align-items: center;
      padding: 0 9px; border-radius: 6px;
      font-family: Geist, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      opacity: 0; transform: translateY(4px); pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
    }
    .tcd-tip.show { opacity: 1; transform: translateY(0); }

    /* Go-To: primary-font-color bg */
    .tcd-goto { background: var(--vc-text) !important; color: #e0e0e0; }
    .tcd-root[data-theme="dark"] .tcd-goto { color: #1f1f1b; }
    .tcd-goto:hover, .tcd-filter-submit:hover { background: #585855 !important; }
    .tcd-root[data-theme="dark"] .tcd-goto:hover, .tcd-root[data-theme="dark"] .tcd-filter-submit:hover { background: #a0a0a0 !important; }
    .tcd-goto:hover { color: #e0e0e0; }
    .tcd-root[data-theme="dark"] .tcd-goto:hover { color: #1f1f1b; }

    /* ---------- mode switcher (Domains / URLs) — replaces the left heading ---------- */
    .tcd-mode { display: inline-flex; padding: 0; gap: 0; background: var(--vc-switch-bg); border-radius: 8px; border: 0; height: 32px; flex: 0 0 auto; }
    .tcd-mode-btn { height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: 8px; background: transparent;
      color: var(--vc-muted); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; }
    .tcd-mode-btn:hover { color: var(--vc-text); }
    .tcd-mode-btn.is-active { background: #ffffff; color: var(--vc-text); border-color: var(--vc-switch-border); }
    .tcd-root[data-theme="dark"] .tcd-mode-btn.is-active { background: #121212; border-color: #353535; }

    /* right heading with total-count */
    .tcd-heading-right { display: flex; align-items: center; }
    .tcd-head-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--vc-muted); margin: 0 8px; flex: 0 0 auto; display: none; }
    .tcd-head-count { font-size: 14px; font-weight: 500; color: var(--vc-muted); display: none; }
    .tcd-head-count.is-sk { width: 28px; height: 14px; border-radius: 4px; background: var(--vc-sk); animation: tcdpulse 1.2s ease-in-out infinite; }
    .tcd-heading-right.has-count .tcd-head-sep, .tcd-heading-right.has-count .tcd-head-count { display: block; }

    /* ================= LEFT: doughnut/bar chart (ported from the standalone Citations Overview chart) ================= */
    .tcl-seg { display: inline-flex; padding: 0; gap: 0; background: var(--vc-switch-bg); border-radius: 8px; border: 0; height: 32px; flex: 0 0 auto; }
    .tcl-seg-btn { height: 32px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: transparent;
      color: var(--vc-muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .tcl-seg-btn svg { width: 16px; height: 16px; color: var(--vc-muted); display: block; }
    .tcl-seg-btn:hover, .tcl-seg-btn:hover svg { color: var(--vc-text); }
    .tcl-seg-btn.is-active { background: #ffffff; color: var(--vc-text); border-color: var(--vc-switch-border); }
    .tcl-seg-btn.is-active svg { color: var(--vc-text); }
    .tcd-root[data-theme="dark"] .tcl-seg-btn.is-active { background: #121212; border-color: #353535; }

    .tcl-top-total { display: none; align-items: baseline; gap: 6px; margin-right: auto; margin-bottom: 12px; }
    .tcl-top-total .n { font-size: 16px; font-weight: 500; color: var(--vc-text); line-height: 1; }
    .tcl-top-total .lbl { font-size: 12px; font-weight: 400; color: var(--vc-third); }

    .tcl-body { width: 100%; position: relative; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    .tcl-body > .tcl-bars, .tcl-body > .tcl-donut-layout, .tcl-body > .tcl-skeleton, .tcl-body > .tcl-empty { margin-top: auto; margin-bottom: auto; }

    .tcl-donut-layout { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 28px; width: 100%; }
    .tcl-donut-wrap { position: relative; flex: 0 0 auto; width: min(52%, 200px); aspect-ratio: 1 / 1; }
    .tcl-donut-wrap canvas { width: 100% !important; height: 100% !important; }
    .tcl-donut-layout.is-collapsed .tcl-donut-wrap { width: min(75%, 220px); }
    .tcl-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .tcl-center .n { font-size: 22px; font-weight: 500; color: var(--vc-text); line-height: 1; }
    .tcl-center .lbl { font-size: 14px; font-weight: 400; color: var(--vc-third); margin-top: 8px; line-height: 1; }
    .tcl-legend { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .tcl-legend-row { display: flex; align-items: center; gap: 10px; }
    .tcl-legend-chip { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; }
    .tcl-legend-name { font-size: 12px; font-weight: 500; color: var(--vc-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; flex: 1 1 auto; min-width: 0; }
    .tcl-legend-pct { font-size: 12px; font-weight: 500; color: var(--vc-muted); white-space: nowrap; flex: 0 0 auto; }
    .tcl-donut-layout.is-collapsed { flex-direction: column; gap: 18px; }
    .tcl-donut-layout.is-collapsed .tcl-legend { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px 16px; }

    .tcl-bars { display: flex; flex-direction: column; gap: 0; width: 100%; }
    .tcl-bar-row { display: flex; align-items: center; padding: 5px 0; }
    .tcl-bar-track { flex: 1; height: 32px; background: var(--vc-heading-bg); border-radius: 8px; overflow: visible; position: relative; min-width: 0; }
    .tcl-bar-fill { height: 100%; border-radius: 8px; transition: width .5s cubic-bezier(.4,0,.2,1);
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px; min-width: 0; gap: 8px; overflow: hidden; }
    .tcl-bar-name { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .18s ease; }
    .tcl-bar-pct { font-size: 11px; font-weight: 600; white-space: nowrap; flex: 0 0 auto; transition: opacity .18s ease; }
    .tcl-bar-outside { position: absolute; top: 50%; transform: translateY(-50%); left: 0; pointer-events: none;
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; transition: opacity .18s ease; }
    .tcl-bar-name-out { font-size: 11px; font-weight: 600; }
    .tcl-bar-pct-out { font-size: 11px; font-weight: 600; }
    .tcl-empty { font-size: 13px; color: var(--vc-muted); text-align: center; padding: 40px 0; }

    .tcl-skeleton { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 28px; width: 100%; pointer-events: none; }
    .tcl-sk-chart { flex: 0 0 auto; width: min(52%, 180px); aspect-ratio: 1; }
    .tcl-sk-chart svg { width: 100%; height: 100%; display: block; }
    .tcl-sk-ring { stroke: var(--vc-sk); }
    .tcl-sk-g0 { stop-color: var(--vc-sk); } .tcl-sk-g1 { stop-color: #ffffff; }
    .tcd-root[data-theme="dark"] .tcl-sk-g1 { stop-color: #555555; }
    .tcl-sk-legend { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .tcl-sk-row { display: flex; align-items: center; gap: 10px; }
    .tcl-sk-dot { width: 12px; height: 12px; border-radius: 4px; background: var(--vc-sk); flex: 0 0 auto; position: relative; overflow: hidden; }
    .tcl-sk-lbl { height: 10px; background: var(--vc-sk); border-radius: 5px; position: relative; overflow: hidden; }
    .tcl-sk-pct { height: 10px; background: var(--vc-sk); border-radius: 5px; flex: 0 0 auto; position: relative; overflow: hidden; }
    .tcl-sk-dot::after, .tcl-sk-lbl::after, .tcl-sk-pct::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.14) 50%, rgba(255,255,255,0) 100%);
      transform: translateX(-100%); animation: tcd-shimmer 1200ms linear infinite; }
    @keyframes tcd-shimmer { 100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce){ .tcl-sk-dot::after,.tcl-sk-lbl::after,.tcl-sk-pct::after{ animation:none; } }

    /* ================= RIGHT: Top Domains/URLs table (same language as the Top Brands table) ================= */
    .tct-table { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--vc-bg); overflow: hidden; }
    .tct-thead, .tct-row { display: grid; grid-template-columns: 44px minmax(120px,1fr) 18% 20% 16%; align-items: center; }
    .tct-table.tct-hide-used .tct-th-used, .tct-table.tct-hide-used .tct-td-used { display: none; }
    .tct-table.tct-hide-used .tct-thead, .tct-table.tct-hide-used .tct-row { grid-template-columns: 44px minmax(120px,1fr) 22% 24%; }
    .tct-table.tct-hide-type .tct-th-type, .tct-table.tct-hide-type .tct-td-type { display: none; }
    .tct-table.tct-hide-type.tct-hide-used .tct-thead, .tct-table.tct-hide-type.tct-hide-used .tct-row { grid-template-columns: 44px minmax(120px,1fr) 30%; }
    .tct-table.tct-hide-trend .tct-trend { display: none; }
    .tct-thead { height: 45px; flex: 0 0 45px; background: var(--vt-head-bg); }
    .tct-th { font-size: 12px; font-weight: 400; color: var(--vc-muted); padding: 0 16px 0 8px; height: 100%;
      display: flex; align-items: center; border-right: 1px solid var(--vc-border); border-bottom: 1px solid var(--vc-border); }
    .tct-th-idx { justify-content: center; padding: 0; }
    .tct-th-idx svg { width: 12px; height: 12px; color: var(--vc-third); display: block; }
    .tct-th:last-child { border-right: none; }
    .tct-tbody { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .tct-row { height: 55px; flex: 0 0 55px; cursor: pointer; transition: background 120ms ease; }
    .tct-row:hover, .tct-row.is-hl { background: var(--vt-row-hover); }
    .tct-td { height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 8px; min-width: 0;
      border-right: 1px solid var(--vc-border); border-bottom: 1px solid var(--vc-border); }
    .tct-td:last-child { border-right: none; }
    .tct-td-idx { justify-content: center; padding: 0; gap: 0; font-size: 13px; font-weight: 500; color: var(--vc-third); }
    .tct-logo-box { width: 24px; height: 24px; border-radius: 8px; background: var(--vt-logo-bg); padding: 1px; flex: 0 0 auto; display: block; }
    .tct-logo-box img { width: 22px; height: 22px; border-radius: 7px; object-fit: cover; display: block; }
    .tct-name { font-size: 14px; font-weight: 500; color: var(--vc-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .tct-row-goto { margin-left: auto; width: 16px; height: 16px; flex: 0 0 auto; color: var(--vc-third);
      opacity: 0; transform: translateX(-3px); transition: opacity .18s ease, transform .18s ease; transition-delay: 0ms; }
    .tct-row-goto svg { width: 16px; height: 16px; display: block; }
    .tct-row:hover .tct-row-goto { opacity: 1; transform: translateX(0); transition-delay: 220ms; }
    .tct-root.is-narrow-cell .tct-row-goto { display: none; }
    .tct-num { font-size: 14px; font-weight: 500; color: var(--vc-text); white-space: nowrap; flex: 0 0 auto; }
    .tct-used { font-size: 14px; font-weight: 500; color: var(--vc-text); white-space: nowrap; }
    .tct-tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 7px;
      font-size: 12px; font-weight: 600; white-space: nowrap; max-width: 100%; overflow: hidden; }
    .tct-tag-dot { width: 6px; height: 6px; border-radius: 999px; flex: 0 0 auto; }
    .tct-tag-lbl { overflow: hidden; text-overflow: ellipsis; }
    .tct-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; flex: 0 0 auto; }
    .tct-trend svg { width: 16px; height: 16px; display: block; }
    .tct-trend.pos { color: var(--vt-up); }
    .tct-trend.neg { color: var(--vt-down); }
    .tct-empty { padding: 24px; text-align: center; color: var(--vc-muted); font-size: 13px; }
    .tct-row.tct-tsk { cursor: default; }
    .tct-row.tct-tsk:hover { background: transparent; }
    .tct-tsk-bar { display: inline-block; height: 12px; border-radius: 4px; background: var(--vc-sk); animation: tcdpulse 1.2s ease-in-out infinite; }
    .tct-tsk-logo { display: inline-block; width: 24px; height: 24px; border-radius: 8px; background: var(--vc-sk); animation: tcdpulse 1.2s ease-in-out infinite; flex: 0 0 auto; }
    @keyframes tcdpulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    /* ================= filter (fader) dropdown — Citation Types / URL Types + Brand mentioned ================= */
    .tcd-filter { position: relative; flex: 0 0 auto; }
    /* active-filter count badge, sits on the top-right corner of the fader button */
    .tcd-filter-badge {
      position: absolute; top: -3px; right: -3px; z-index: 2;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      background: var(--vc-text); color: #e0e0e0;
      font-family: inherit; font-size: 10px; font-weight: 600; line-height: 1;
      display: none; align-items: center; justify-content: center;
      font-variant-numeric: tabular-nums; pointer-events: none;
    }
    .tcd-root[data-theme="dark"] .tcd-filter-badge { color: #1f1f1b; }
    .tcd-filter-badge.is-visible { display: inline-flex; }
    .tcd-filter-menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 60;
      min-width: 280px; max-width: 320px; max-height: 400px;
      background: var(--vc-bg); border: 1px solid var(--vc-border); border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: 6px;
      display: flex; flex-direction: column;
      opacity: 0; transform: translateY(-4px) scale(0.985); pointer-events: none; transition: opacity 140ms ease, transform 140ms ease;
    }
    .tcd-filter.is-open .tcd-filter-menu { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .tcd-root[data-theme="dark"] .tcd-filter-menu { background: #151515; }
    .tcd-filter.is-open .tcd-filter-btn { color: var(--vc-text); background: var(--vc-heading-bg); }
    .tcd-filter-dim { flex: 0 0 auto; margin: 2px 2px 8px; display: inline-flex; padding: 0; gap: 0;
      background: var(--vc-switch-bg); border-radius: 8px; border: 0; height: 32px; width: 100%; }
    .tcd-filter-dim-btn { height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: 8px; background: transparent;
      color: var(--vc-muted); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; flex: 1 1 50%; }
    .tcd-filter-dim-btn:hover { color: var(--vc-text); }
    .tcd-filter-dim-btn.is-active { background: #ffffff; color: var(--vc-text); border-color: var(--vc-switch-border); }
    .tcd-root[data-theme="dark"] .tcd-filter-dim-btn.is-active { background: #121212; border-color: #353535; }
