<!--
  UPSTREEM VISIBILITY CHART

  data-instance="ROOTID_[dynamic id]"  -- must be unique across every placement
  that can exist on the page at the same time (e.g. one on a Dashboard, one
  inside a Company popup).

  EVENT NAMES MUST BE UNIQUE PER PLACEMENT OF THIS REUSABLE, same reasoning
  as the instance id above: if two placements share one bubble_fn_* name,
  Bubble can only ever wire ONE workflow to it, and whichever placement
  calls it, the SAME (wrong, for one of them) workflow fires. Give every
  placement its own suffix, built the same way as the instance id:

  data-gran-fn="bubble_fn_votGranularity_[dynamic id]"
  data-rowclick-fn="bubble_fn_votRowClick_[dynamic id]"
  data-goto-fn="bubble_fn_votGoTo_[dynamic id]"
  data-sort-fn="bubble_fn_votSortTable_[dynamic id]"
  data-submit-fn="bubble_fn_votSubmitCompanies_[dynamic id]"
  data-export-fn="bubble_fn_votExportTable_[dynamic id]"

  On the Bubble side, place a separate Toolbox "Javascript to Bubble"
  element for each of the six INSIDE EACH reusable that contains this
  chart, with the matching dynamic name for that placement. The suffix can
  be a hardcoded string (fine if this reusable is only ever placed once per
  page) or a real dynamic expression (needed if it can appear more than
  once at a time). Whatever ends up in these attributes must match the full
  generated name on the Toolbox element exactly, character for character.
-->
<div class="vot-root" data-instance="INSTANCE_ID" data-isdark="IS_DARK" data-processing="IS_PROCESSING" data-processing2="IS_PROCESSING_2" data-gran-fn="bubble_fn_votGranularity" data-rowclick-fn="bubble_fn_votRowClick" data-goto-fn="bubble_fn_votGoTo" data-sort-fn="bubble_fn_votSortTable" data-submit-fn="bubble_fn_votSubmitCompanies" data-export-fn="bubble_fn_votExportTable">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap");

    /* ---------- combo layout ---------- */
    .vot-root {
      --vc-text: #1f1f1b; --vc-muted: #6f737c; --vc-border: #e0e2e6;
      --vc-bg: #ffffff; --vc-topbar-bg: #ffffff; --vc-heading-bg: #f5f5f5; --vc-sk: #e8e8e8;
      --vc-switch-bg: #f5f5f5; --vc-switch-border: #e0e2e6;
      --vc-primary: #14b8a6; --vc-third: #9e9e9e;
      --vt-head-bg: rgba(245,245,245,0.3); --vt-logo-bg: #ffffff; --vt-row-hover: rgba(245,245,245,0.75);
      --vt-up: #2ea84a; --vt-down: #b0200c;
      display: flex; flex-direction: row; align-items: stretch; position: relative; gap: 16px;
      font-family: Geist, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--vc-text); width: 100%; box-sizing: border-box; -webkit-font-smoothing: antialiased;
    }
    .vot-root * { box-sizing: border-box; }
    .vot-root[data-theme="dark"] {
      --vc-text: #e0e0e0; --vc-muted: #a0a0a0; --vc-border: #353535;
      --vc-bg: #1b1b1b; --vc-topbar-bg: #121212; --vc-heading-bg: rgba(42,42,42,0.6); --vc-sk: #3a3a3a;
      --vc-switch-bg: rgba(42,42,42,0.6); --vc-switch-border: #353535; --vc-third: #808080;
      --vt-head-bg: #121212; --vt-logo-bg: #e0e0e0; --vt-row-hover: rgba(42,42,42,0.6);
      --vt-up: #60d25d; --vt-down: #d25d5d;
    }

    /* ---------- two units: each = header + bordered chart-box ---------- */
    .vot-unit { display: flex; flex-direction: column; min-width: 0; }
    .vot-unit-left  { flex: 1 1 50%; max-width: 50%; }
    .vot-unit-right { flex: 1 1 50%; max-width: 50%; }

    .vot-head { display: flex; align-items: center; height: 32px; margin-bottom: 16px; padding: 0; }
    .vot-unit-left .vot-head { padding-right: 0; }
    .vot-heading { font-size: 14px; font-weight: 500; color: var(--vc-text); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vot-head-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: 0 0 auto; }

    .vot-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border: 0; border-radius: 8px;
      background: transparent; color: #6f6f6f; cursor: pointer; padding: 0; flex: 0 0 auto;
    }
    .vot-root[data-theme="dark"] .vot-iconbtn { color: #a0a0a0; }
    .vot-iconbtn:hover { color: var(--vc-text); }
    .vot-root[data-theme="dark"] .vot-iconbtn:hover { color: var(--vc-text); }
    .vot-iconbtn svg { width: 16px; height: 16px; display: block; }

    .vot-box {
      flex: 1 1 auto; min-height: 0; height: 427px;
      border: 1px solid var(--vc-border); background: var(--vc-bg); overflow: hidden;
      display: flex; flex-direction: column;
      transition: height 200ms ease, opacity 200ms ease;
    }
    /* both boxes full-bordered, separated by the root's 8px gap */
    .vot-box-left  { border-radius: 16px; }
    .vot-box-right { border-radius: 16px; }
    .vot-panel-body { flex: 1 1 auto; min-height: 0; padding: 16px; position: relative; display: flex; flex-direction: column; transition: opacity 200ms ease; }
    .vot-box-left .vot-panel-body { padding-top: 24px; }   /* extra breathing room above the line chart */

    /* ---------- maximize / auto-stack: two separate stacked containers ---------- */
    .vot-root.is-max, .vot-root.is-narrow { flex-direction: column; gap: 32px; }
    .vot-root.is-max .vot-unit, .vot-root.is-narrow .vot-unit { flex: 0 0 auto; width: 100%; max-width: 100%; }
    .vot-root.is-max .vot-box-left, .vot-root.is-narrow .vot-box-left { height: 427px; }
    .vot-root.is-max .vot-box-right, .vot-root.is-narrow .vot-box-right { height: 427px; }
    .vot-root.is-narrow .vot-max-right { display: none; }
    .vot-root.is-narrow .vot-max-top { display: none; }
    .vot-root.is-max .vot-unit-left .vot-head, .vot-root.is-narrow .vot-unit-left .vot-head { padding-right: 0; }

    /* ---------- hide (collapse both boxes → just the 32px header rows) ---------- */
    .vot-root.is-hidden-view .vot-box { height: 0 !important; opacity: 0; border-width: 0; }
    .vot-root.is-hidden-view .vot-panel-body { opacity: 0; }
    .vot-root.is-hidden-view .vot-head { margin-bottom: 0; }
    .vot-root.is-hidden-view .vot-unit-left { margin-bottom: 0; }
    /* grey out the (now inactive) controls; the Hide/Show toggle stays active */
    .vot-root.is-hidden-view .vc-gran,
    .vot-root.is-hidden-view .vt-seg,
    .vot-root.is-hidden-view .vot-filter,
    .vot-root.is-hidden-view .vot-maximize { opacity: 0.4; pointer-events: none; }

    /* maximize icon swap */
    .vot-maximize .ic-min { display: none; }
    .vot-root.is-max .vot-maximize .ic-max { display: none; }
    .vot-root.is-max .vot-maximize .ic-min { display: block; }
    /* maximize sits top-right next to the switcher once maximized; the right-panel one is used in row mode */
    .vot-max-top { display: none; }
    .vot-root.is-max .vot-max-top { display: inline-flex; }
    .vot-root.is-max .vot-max-right { display: none; }
    /* hide/show icon swap */
    .vot-hide .ic-show { display: none; }
    .vot-root.is-hidden-view .vot-hide .ic-hide { display: none; }
    .vot-root.is-hidden-view .vot-hide .ic-show { display: block; }

    /* ---------- filter dropdown ---------- */
    .vot-filter { position: relative; flex: 0 0 auto; }
    /* selected-company count badge, sits on the top-right corner of the fader button */
    .vot-filter-badge {
      position: absolute; top: -3px; right: -3px; z-index: 2;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      background: var(--vc-text); color: #e0e0e0;
      font-family: inherit; font-size: 10px; font-weight: 600; line-height: 1;
      display: none; align-items: center; justify-content: center;
      font-variant-numeric: tabular-nums; pointer-events: none;
    }
    .vot-root[data-theme="dark"] .vot-filter-badge { color: #1f1f1b; }
    .vot-filter-badge.is-visible { display: inline-flex; }
    .vot-filter-menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 60;
      min-width: 440px; max-width: 560px; max-height: 360px;
      background: var(--vc-bg); border: 1px solid var(--vc-border); border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: 6px;
      display: flex; flex-direction: column;
      opacity: 0; transform: translateY(-4px) scale(0.985); pointer-events: none; transition: opacity 140ms ease, transform 140ms ease;
    }
    .vot-root.is-narrow .vot-filter-menu { min-width: 220px; max-width: 280px; }
    .vot-filter.is-open .vot-filter-menu { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .vot-root[data-theme="dark"] .vot-filter-menu { background: #151515; }
    .vot-filter.is-open .vot-filter-btn { color: var(--vc-text); background: var(--vc-heading-bg); }
    .vot-filter-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 4px 9px 6px; margin-bottom: 4px; }
    .vot-filter-title { font-size: 11px; font-weight: 600; color: var(--vc-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .vot-filter-head-actions { display: flex; align-items: center; gap: 10px; }
    .vot-filter-count { font-size: 11px; font-weight: 600; color: var(--vc-muted); font-variant-numeric: tabular-nums; }
    .vot-filter-reset, .vot-filter-toggle { border: 0; background: transparent; color: var(--vc-muted); font-family: inherit; font-size: 11px; font-weight: 500; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
    .vot-filter-reset:hover, .vot-filter-toggle:hover { color: var(--vc-text); background: transparent; }
    .vot-filter-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0 6px; align-content: start; }
    .vot-root.is-narrow .vot-filter-list { grid-template-columns: 1fr; }
    .vot-filter-item { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--vc-text); min-width: 0; }
    .vot-filter-item:hover { background: var(--vc-heading-bg); }
    .vot-filter-item.is-disabled { opacity: .4; cursor: default; }
    .vot-filter-check { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--vc-border); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; color: #fff; }
    .vot-filter-check svg { width: 11px; height: 11px; display: none; }
    .vot-filter-item.is-checked .vot-filter-check { background: var(--vc-text); border-color: var(--vc-text); }
    .vot-root[data-theme="dark"] .vot-filter-item.is-checked .vot-filter-check { color: #1f1f1b; }
    .vot-filter-item.is-checked .vot-filter-check svg { display: block; }
    .vot-filter-logo-box { width: 20px; height: 20px; border-radius: 6px; background: var(--vt-logo-bg); padding: 1px; flex: 0 0 auto; display: block; }
    .vot-filter-logo-box img { width: 18px; height: 18px; border-radius: 5px; object-fit: cover; display: block; }
    .vot-filter-dot { width: 10px; height: 10px; min-width: 10px; border-radius: 3px; flex: 0 0 auto; }
    .vot-filter-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vot-filter-empty { padding: 10px; font-size: 12px; color: var(--vc-muted); text-align: center; }
    @keyframes votpulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    /* right heading with total-count */
    .vot-heading-right { display: flex; align-items: center; }
    .vot-head-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--vc-muted); margin: 0 8px; flex: 0 0 auto; display: none; }
    .vot-head-count { font-size: 14px; font-weight: 500; color: var(--vc-muted); display: none; }
    .vot-heading-right.has-count .vot-head-sep, .vot-heading-right.has-count .vot-head-count { display: block; }

    /* sort dropdown (Opportunities uo-pop style) */
    .vot-sort { position: relative; flex: 0 0 auto; }
    .vot-sort-menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; width: 220px;
      background: var(--vc-bg); border: 1px solid var(--vc-border); border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: 8px;
      opacity: 0; transform: translateY(-4px) scale(0.985); pointer-events: none; transition: opacity 140ms ease, transform 140ms ease; }
    .vot-sort.is-open .vot-sort-menu { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .vot-root[data-theme="dark"] .vot-sort-menu { background: #151515; }
    .vot-sort.is-open .vot-sort-btn { color: var(--vc-text); background: var(--vc-heading-bg); }
    .vot-pop-head { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--vc-muted); padding: 4px 10px 8px; }
    .vot-pop-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--vc-text); }
    .vot-pop-opt:hover { background: var(--vc-heading-bg); }
    .vot-pop-opt .vot-check { width: 16px; height: 16px; color: var(--vc-text); opacity: 0; flex: 0 0 auto; }
    .vot-pop-opt.is-active .vot-check { opacity: 1; }
    .vot-pop-div { height: 1px; background: var(--vc-border); margin: 7px 4px; }
    .vot-pop-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 10px; border-radius: 9px; }
    .vot-pop-row:hover { background: var(--vc-heading-bg); }
    .vot-pop-label { font-size: 13.5px; font-weight: 500; color: var(--vc-text); }
    .vot-switch { width: 38px; height: 22px; border-radius: 999px; background: var(--vc-border); position: relative; flex: 0 0 auto; transition: background 160ms ease; cursor: pointer; }
    .vot-root[data-theme="dark"] .vot-switch { background: rgba(42,42,42,0.6); }
    .vot-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 160ms ease; }
    .vot-switch.is-on { background: var(--vc-text); }
    .vot-switch.is-on::after { transform: translateX(16px); }
    .vot-root[data-theme="dark"] .vot-switch::after { background: #e0e0e0; }
    .vot-root[data-theme="dark"] .vot-switch.is-on { background: var(--vc-text); }
    .vot-root[data-theme="dark"] .vot-switch.is-on::after { background: #1f1f1b; }

    /* filter submit button */
    .vot-filter-submit { flex: 0 0 auto; display: block; width: 100%; margin-top: 6px; height: 34px; border: 0; border-radius: 9px; background: var(--vc-text); color: #fff; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .vot-root[data-theme="dark"] .vot-filter-submit { color: #1f1f1b; }

    /* Go-To button: primary FONT color as bg, icon = the other theme's primary font color */
    .vot-goto { background: var(--vc-text) !important; color: #e0e0e0; }
    .vot-root[data-theme="dark"] .vot-goto { color: #1f1f1b; }
    /* hover for ALL primary-colour buttons: only the bg changes */
    .vot-goto:hover, .vot-filter-submit:hover { background: #585855 !important; }
    .vot-root[data-theme="dark"] .vot-goto:hover, .vot-root[data-theme="dark"] .vot-filter-submit:hover { background: #a0a0a0 !important; }
    .vot-goto:hover { color: #e0e0e0; }
    .vot-root[data-theme="dark"] .vot-goto:hover { color: #1f1f1b; }

    /* dark button tooltip (~24px, 12px text, dark bg in light mode) */
    .vot-tip {
      position: fixed; z-index: 2147483000; box-sizing: border-box;
      height: 24px; display: inline-flex; align-items: center;
      padding: 0 9px; border-radius: 6px;
      font-family: Geist, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      opacity: 0; transform: translateY(4px); pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
    }
    .vot-tip.show { opacity: 1; transform: translateY(0); }

    /* row hover → clickable go-to icon at the far right of the Brand cell */
    .vt-td-brand { position: relative; }
    .vt-row-goto { margin-left: auto; width: 16px; height: 16px; flex: 0 0 auto; color: var(--vc-third);
      opacity: 0; transform: translateX(-3px); transition: opacity .18s ease, transform .18s ease; transition-delay: 0ms; }
    .vt-row-goto svg { width: 16px; height: 16px; display: block; }
    .vt-row:hover .vt-row-goto { opacity: 1; transform: translateX(0); transition-delay: 220ms; }
    /* hide it when the brand cell is too narrow */
    .vot-root.is-narrow-cell .vt-row-goto { display: none; }

    /* granularity switcher (in the header) */
    .vc-gran { display: inline-flex; padding: 0; gap: 0; background: var(--vc-switch-bg); border-radius: 8px; border: 0; height: 32px; flex: 0 0 auto; }
    .vc-gran-btn { height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: 8px; background: transparent;
      color: var(--vc-muted); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; }
    .vc-gran-btn:hover { color: var(--vc-text); }
    .vc-gran-btn.is-active { background: #ffffff; color: var(--vc-text); border-color: var(--vc-switch-border); }
    .vot-root[data-theme="dark"] .vc-gran-btn.is-active { background: #121212; border-color: #353535; }
    .vc-gran-btn.is-disabled { opacity: 0.4; pointer-events: none; cursor: default; }

    .vc-line-wrap { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; }
    .vc-line-canvas { display: block; width: 100% !important; height: 100% !important; }
    .vc-line-empty { position:absolute; left:0; right:0; top:58%; transform:translateY(-50%); display:flex; align-items:center; justify-content:center; font-size:13px; color: var(--vc-muted); }

    .vc-line-sk { position:absolute; inset:0; pointer-events:none; --shimmer:.14; }
    .vc-line-sk .sk-linechart { width:100%; height:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:6px; padding:32px; }
    .vc-line-sk .sk-lc-grid { flex:1; position:relative; display:flex; flex-direction:column; justify-content:space-between; }
    .vc-line-sk .sk-lc-hline { height:1px; background:var(--vc-sk); border-radius:1px; position:relative; overflow:hidden; }
    .vc-line-sk .sk-lc-hline::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,var(--shimmer)) 50%, rgba(255,255,255,0) 100%); transform:translateX(-100%); animation:vc-skt 1200ms linear infinite; }
    .vc-line-sk .sk-lc-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .vc-line-sk .sk-lc-astop0 { stop-color:var(--vc-sk); stop-opacity:.5; }
    .vc-line-sk .sk-lc-astop1 { stop-color:var(--vc-sk); stop-opacity:0; }
    .vc-line-sk .sk-lc-stroke { fill:none; stroke:var(--vc-sk); stroke-width:1.875; stroke-linecap:round; }
    .vc-line-sk .sk-lc-shimmer-path { stroke-dasharray:1000; stroke-dashoffset:1000; animation:vc-skt-path 1200ms linear infinite; stroke:rgba(255,255,255,var(--shimmer)); fill:none; stroke-width:2.25; stroke-linecap:round; }
    .vc-line-sk .sk-lc-xaxis { display:flex; justify-content:space-between; flex-shrink:0; padding:0 1px; }
    .vc-line-sk .sk-lc-xlabel { height:8px; width:24px; background:var(--vc-sk); border-radius:4px; position:relative; overflow:hidden; }
    .vc-line-sk .sk-lc-xlabel::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,var(--shimmer)) 50%, rgba(255,255,255,0) 100%); transform:translateX(-100%); animation:vc-skt 1200ms linear infinite; }
    @keyframes vc-skt { 100% { transform:translateX(100%); } }
    @keyframes vc-skt-path { 0% { stroke-dashoffset:1000; } 100% { stroke-dashoffset:-1000; } }
    @media (prefers-reduced-motion: reduce){ .vc-line-sk .sk-lc-hline::after,.vc-line-sk .sk-lc-xlabel::after,.vc-line-sk .sk-lc-shimmer-path{ animation:none; } }

    /* ---------- line legend (balanced rows, same styling/behaviour as the provided component) ---------- */
    .vc-legend { width:100%; height:auto; box-sizing:border-box; overflow:visible; --up-column-gap:16px; margin-top:12px; flex:0 0 auto; }
    .vc-legend.is-hidden { display:none; }
    .vc-legend .up-company-rows { width:100%; height:auto; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; row-gap:8px; box-sizing:border-box; }
    .vc-legend .up-company-row { width:100%; min-height:24px; display:flex; align-items:center; justify-content:center; column-gap:var(--up-column-gap,16px); box-sizing:border-box; overflow:hidden; min-width:0; }
    .vc-legend .up-company-item { height:24px; padding:2px 8px; border:0; background:transparent; display:inline-flex; align-items:center; justify-content:flex-start; flex:0 1 auto; min-width:0; box-sizing:border-box; white-space:nowrap; }
    .vc-legend .up-company-color { width:10px; height:10px; min-width:10px; min-height:10px; border-radius:4px; flex:0 0 auto; }
    .vc-legend .up-company-favicon { width:16px; height:16px; min-width:16px; min-height:16px; border-radius:4px; object-fit:cover; display:block; flex:0 0 auto; }

<script>
(function(){
  "use strict";

  /* ================= Chart.js loader (SHARED across ALL upstreem components on the page) ================= */
  function loadChartJs(){
    if (window.Chart) return Promise.resolve();
    if (window.__upstreemChartJs) return window.__upstreemChartJs;
    window.__upstreemChartJs = new Promise(function(res, rej){
      // if a Chart.js script is already present (e.g. from another upstreem component on this
      // same page), wait for IT instead of loading a second copy — loading Chart.js twice breaks
      // existing chart instances (each load overwrites window.Chart with a fresh module/registry)
      var existing = document.querySelector('script[data-upstreem-chartjs], script[data-ccchart], script[src*="chart.umd"], script[src*="chart.js@"], script[src*="chart.local"]');
      if (existing){
        var iv = setInterval(function(){ if (window.Chart){ clearInterval(iv); res(); } }, 40);
        setTimeout(function(){ clearInterval(iv); if (window.Chart) res(); else rej(new Error("chartjs timeout")); }, 10000);
        return;
      }
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js";
      s.setAttribute("data-upstreem-chartjs", "1");
      s.onload = function(){ res(); };
      s.onerror = rej;
      document.head.appendChild(s);
    });
    return window.__upstreemChartJs;
  }

  /* ================= colours (identical to the citations element) ================= */

  /* ================= helpers ================= */
  function isYes(v){ return /^(1|true|yes|y)$/i.test(String(v == null ? "" : v).trim()); }
  /* Outbound event lookup: window/parent/top first (covers the common case with zero extra
     cost), then fall back to a full BFS over every iframe reachable from window.top. Needed
     when the receiving Toolbox "Javascript to Bubble" element sits deeper than one level above
     this component's own iframe (e.g. this reusable placed on another reusable). */
  function resolveBubbleFn(fnName){
    var fn = window[fnName] || (window.parent && window.parent[fnName]) || (window.top && window.top[fnName]);
    if (typeof fn === "function") return fn;
    var start; try { start = window.top || window.parent || window; } catch(e){ start = window; }
    var queue = [start], seen = [];
    while (queue.length){
      var win = queue.shift();
      if (seen.indexOf(win) !== -1) continue;
      seen.push(win);
      try { if (typeof win[fnName] === "function") return win[fnName]; } catch(e){}
      var frames; try { frames = win.document.querySelectorAll("iframe"); } catch(e){ continue; }
      for (var i = 0; i < frames.length; i++){
        var cw; try { cw = frames[i].contentWindow; } catch(e){ cw = null; }
        if (cw && seen.indexOf(cw) === -1) queue.push(cw);
      }
    }
    return null;
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function truncate(s, n){ s = String(s==null?"":s); return s.length > n ? s.slice(0, n-1) + "…" : s; }
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MONTHS_DE = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function dateFmt(day){
    var m = String(day||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return String(day||"");
    return parseInt(m[3],10) + " " + MONTHS[parseInt(m[2],10)-1] + " " + m[1];
  }
  // tooltip title: same rule as the x-axis label — in month mode show only the month name
  function dateFmtTitle(day, gran){
    var m = String(day||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return String(day||"");
    if (gran === "month") return MONTHS_DE[parseInt(m[2],10) - 1] || dateFmt(day);
    return dateFmt(day);
  }


  /* ================= doughnut plugins ================= */
  var RING_PX = 12, SEG_GAP = 6, CORNER = 4, HOVER = 12;
  var ringWidthPlugin = {
    id: "ucRingWidth",
    beforeDatasetDraw: function(chart, args){
      var meta = chart.getDatasetMeta(args.index);
      meta.data.forEach(function(arc){ arc.innerRadius = Math.max(1, arc.outerRadius - RING_PX); });
    }
  };
  var constantGapPlugin = {
    id: "ucConstantGap",
    beforeDatasetDraw: function(chart, args){
      var meta = chart.getDatasetMeta(args.index);
      if (!meta || !meta.data || !meta.data.length) return;
      var r = (meta.data[0] && meta.data[0].outerRadius) || 100;
      var gap = SEG_GAP / r, N = meta.data.length;
      var available = (Math.PI*2) - gap*N;
      var total = meta.total || chart.data.datasets[args.index].data.reduce(function(a,b){return a+Number(b||0);},0);
      var cur = -Math.PI/2;
      meta.data.forEach(function(arc, i){
        var value = chart.data.datasets[args.index].data[i];
        var frac = total>0 ? (value/total) : 0;
        var span = frac*available;
        arc.startAngle = cur + gap/2;
        arc.endAngle = cur + span + gap/2;
        arc.circumference = span;
        cur += span + gap;
      });
    }
  };

  /* ================= doughnut tooltip ================= */

  /* ================= line chart plugins + tooltip ================= */
  var LINE_TENSION = 0.3, LINE_WIDTH = 1.5, LINE_POINT_HOVER = 4, LINE_POINT_HIT = 6, LINE_POINT_BORDER = 1.4;
  var X_MAX_TICKS = 7, Y_PAD = 1.15;

  var hoverLinePlugin = {
    id: "ccHoverLine",
    afterDatasetsDraw: function(chart){
      var act = chart.tooltip && chart.tooltip.getActiveElements ? chart.tooltip.getActiveElements() : [];
      if (!act || !act.length) return;
      var x = act[0].element.x, ca = chart.chartArea, ctx = chart.ctx;
      ctx.save();
      ctx.beginPath(); ctx.moveTo(x, ca.top); ctx.lineTo(x, ca.bottom);
      ctx.lineWidth = 1; ctx.strokeStyle = chart.$ccHoverLineColor || "rgba(0,0,0,0.12)";
      ctx.stroke(); ctx.restore();
    }
  };
  // dashed horizontal grid at every y tick, drawn behind the lines
  var dashedYGridPlugin = {
    id: "ccDashedYGrid",
    beforeDatasetsDraw: function(chart){
      var y = chart.scales.y, ca = chart.chartArea, ctx = chart.ctx;
      if (!y || !ca) return;
      var ticks = (y.getTicks && y.getTicks()) || y.ticks || [];
      if (!ticks.length) return;

      });

    }
  };

  // index-mode tooltip: shows ALL series at the hovered day, with a date header + favicon rows
  function makeLineTooltip(wrap){
    var pos = { x:null, y:null }, target = { x:0, y:0 }, running = false, visible = false, raf = null;
    var FOLLOW = 0.18;   // per-frame easing toward the target (smooth follow, ~280ms feel)
    function loop(){
      var el = wrap.querySelector(".vc-line-tt");
      if (pos.x == null){ pos.x = target.x; pos.y = target.y; }
      pos.x += (target.x - pos.x) * FOLLOW;
      pos.y += (target.y - pos.y) * FOLLOW;
      if (el) el.style.transform = "translate3d(" + pos.x + "px," + pos.y + "px,0)";
      var dx = Math.abs(target.x - pos.x), dy = Math.abs(target.y - pos.y);
      if (visible || dx > 0.4 || dy > 0.4){ raf = requestAnimationFrame(loop); }
      else { running = false; }
    }
    return function(context){
      var chart = context.chart, tooltip = context.tooltip;
      var el = wrap.querySelector(".vc-line-tt");
      if (!el){
        el = document.createElement("div");
        el.className = "vc-line-tt";
        el.style.cssText = "position:absolute;left:0;top:0;pointer-events:none;z-index:9999;opacity:0;transform:translate3d(0,0,0);transition:opacity 120ms ease;";
        wrap.appendChild(el);
      }
      if (tooltip.opacity === 0){ el.style.opacity = "0"; visible = false; pos.x = null; pos.y = null; return; }
      var dps = (tooltip.dataPoints || []).filter(function(dp){ return dp && dp.parsed && dp.parsed.y != null; });
      if (!dps.length){ el.style.opacity = "0"; visible = false; pos.x = null; pos.y = null; return; }
      var themeRoot = chart.canvas.closest(".vot-root");
      var dark = !!(themeRoot && themeRoot.getAttribute("data-theme") === "dark");
      var boxBg = dark ? "#121212" : "#ffffff";
      var boxBorder = dark ? "" : "border:1px solid #e0e2e6;";
      var boxShadow = dark ? "box-shadow:0 4px 14px rgba(0,0,0,.25);" : "box-shadow:0 4px 14px rgba(0,0,0,.10);";
      var textColor = dark ? "#e6e6e6" : "#1f1f1b";
      var mutedColor = dark ? "#8a8a8a" : "#6f737c";
      var idx = dps[0].dataIndex;
      var dayLabel = chart.data.labels[idx];
      dps = dps.slice().sort(function(a,b){ return b.parsed.y - a.parsed.y; });
      var ff = "Geist,system-ui,-apple-system,Segoe UI,Roboto,Arial";
      var rows = dps.map(function(dp){
        var ds = dp.dataset;
        var icon = ds.__favicon
          ? '<img src="' + esc(ds.__favicon) + '" width="16" height="16" style="border-radius:4px;display:block;object-fit:cover" onerror="this.style.visibility=\'hidden\'"/>'
          : '<span style="width:16px;height:16px;border-radius:4px;background:' + ds.__baseColor + ';display:block"></span>';
        var name = truncate(ds.label, 32);
        var vy = Number(dp.parsed.y) || 0, vr = Math.round(vy);
        var val = (vy > 0 && vr === 0) ? "<1%" : (vr + "%");
        return '<div style="display:flex;align-items:center;gap:8px;margin-top:8px">' +
            '<span style="flex:0 0 16px;display:flex">' + icon + '</span>' +
            '<span style="flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:' + textColor + '">' + esc(name) + '</span>' +
            '<span style="flex:0 0 auto;margin-left:77px;color:' + textColor + ';font-weight:500">' + val + '</span>' +
          '</div>';
      }).join("");
      el.innerHTML =
        '<div style="background:' + boxBg + ';color:' + textColor + ';' + boxBorder + 'border-radius:16px;padding:10px 12px;font-family:' + ff + ';font-size:13px;line-height:1.35;' + boxShadow + 'white-space:nowrap;min-width:220px;">' +
          '<div style="color:' + mutedColor + ';font-size:11px">' + esc(dateFmtTitle(dayLabel, chart.__curGran)) + '</div>' +
          rows +
        '</div>';
      var cx = chart.canvas.offsetLeft, cy = chart.canvas.offsetTop, ca = chart.chartArea;
      var caretX = cx + (tooltip.caretX != null ? tooltip.caretX : dps[0].element.x), m = 16;
      el.style.left = "0px"; el.style.top = "0px";
      var rect = el.getBoundingClientRect();
      var tx = (caretX + rect.width + m > cx + ca.right) ? (caretX - rect.width - m) : (caretX + m);
      tx = Math.max(cx + ca.left, Math.min(tx, cx + ca.right - rect.width));
      var ty = Math.max(cy + ca.top, Math.min(cy + ca.top + 8, cy + ca.bottom - rect.height));
      target.x = tx; target.y = ty;
      if (pos.x == null){ pos.x = tx; pos.y = ty; el.style.transform = "translate3d("+tx+"px,"+ty+"px,0)"; }
      el.style.opacity = "1"; visible = true;
      if (!running){ running = true; raf = requestAnimationFrame(loop); }
    };

  /* ================= data prep ================= */

  function buildLineDatasets(series, companies){
    series = Array.isArray(series) ? series : [];
    companies = Array.isArray(companies) ? companies : [];
    var metaMap = {};
    companies.forEach(function(c){
      if (!c || c.company_id == null) return;
      metaMap[String(c.company_id)] = {
        color: c.color || null,
        favicon: c.favicon_url || c.favicon || "",
        name: c.name != null ? String(c.name) : String(c.company_id),
        global_share: (c.visibility_window_pct != null ? Number(c.visibility_window_pct) : null)
      };
    });
    var byId = {}, daySet = {};

  function legRowWidth(widths, start, end, gap){ var total = 0; for (var i = start; i < end; i++){ total += widths[i]; if (i > start) total += gap; } return total; }
  function legGreedyRowCount(widths, cw, gap){
    var rows = 1, cur = 0;
    for (var i = 0; i < widths.length; i++){
      var next = cur === 0 ? widths[i] : cur + gap + widths[i];
      if (cur > 0 && next > cw){ rows++; cur = widths[i]; } else { cur = next; }
    }

  }
  function legBalancedBreaks(widths, rowCount, cw, gap){
    var n = widths.length;
    if (rowCount <= 1 || n <= 1) return [];
    var dp = [], prev = [];
    for (var r = 0; r <= rowCount; r++){ dp.push(new Array(n + 1).fill(Infinity)); prev.push(new Array(n + 1).fill(-1)); }
    dp[0][0] = 0;
    for (var r2 = 1; r2 <= rowCount; r2++){
      for (var i = 1; i <= n; i++){
        for (var k = r2 - 1; k < i; k++){
          var w = legRowWidth(widths, k, i, gap);
          if (w > cw) continue;
          var score = Math.max(dp[r2 - 1][k], w);
          if (score < dp[r2][i]){ dp[r2][i] = score; prev[r2][i] = k; }
        }
      }
    }
    if (!isFinite(dp[rowCount][n])) return [];
    var breaks = [], ii = n;
    for (var r3 = rowCount; r3 > 1; r3--){ var kk = prev[r3][ii]; if (kk <= 0) break; breaks.unshift(kk); ii = kk; }
    return breaks;
  }

    var TREND_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>';

    // disagree with what's on screen, even if a payload arrives with a stale/missing `companies`.
    function syncFilterBadge(){
      var badge = root.querySelector(".vot-filter-badge");
      if (!badge) return;

    function activeCompanyIds(){
