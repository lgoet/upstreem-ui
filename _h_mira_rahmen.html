<meta charset="utf-8"><title>Mira: Seitenleiste, gemessen in einem Rahmen fester Breite</title>
<style>html,body{margin:0;font:12px/1.6 ui-monospace,monospace}
iframe{width:1100px;height:620px;border:0;display:block}
#out{padding:10px;white-space:pre-wrap}</style>
<body><iframe id="r" src="_h_mira_kind.html"></iframe><pre id="out">laeuft…</pre>
<script>
/* WARUM EIN RAHMEN: die Browser-Flaeche war eingeklappt, window.innerWidth stand auf 0 -- und
   damit trifft JEDE max-width-Abfrage. Gemessen wurde also der Telefon-Zweig der eigenen CSS,
   waehrend ich den Schirm-Zweig gemessen zu haben glaubte. Ein iframe hat seinen EIGENEN
   Viewport (1100px), unabhaengig davon, ob die Flaeche sichtbar ist. */
var r=document.getElementById("r");
r.addEventListener("load", function(){
  var w=r.contentWindow;
  var t=setInterval(function(){
    if (!w.__fertig) return;
    clearInterval(t);
    var R=w.__R||{};
    R.rahmen={ innerWidth:w.innerWidth, schmal:w.matchMedia("(max-width: 720px)").matches };
    document.getElementById("out").textContent=JSON.stringify(R,null,1);
    window.__R=R; window.__fertig=true;
  },160);
  setTimeout(function(){ clearInterval(t); if(!window.__fertig){ window.__R=w.__R||{offen:"Zeit abgelaufen"}; window.__fertig=true; } },22000);
});
</script>
