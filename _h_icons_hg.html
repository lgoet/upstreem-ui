<meta charset="utf-8"><title>Der Zeichensatz</title>
<style>
html,body{margin:0;background:#1f1f1b;color:#e0e0e0;font:14px/1.4 Geist,system-ui,sans-serif}
.kopf{padding:18px 22px 6px;font-size:13px;color:#a0a0a0}
.kopf b{color:#e0e0e0}
.r{display:grid;grid-template-columns:repeat(6,1fr);gap:2px 14px;padding:10px 22px 30px}
.z{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:10px;
   padding:6px 0;border-bottom:1px solid #2a2a2e}
.n{font:11px ui-monospace,monospace;color:#9a9a9a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg{display:block;margin:0 auto}
.fehl{color:#d25d5d}
</style><body>
<div class="kopf">Alle Zeichen aus <b>UC.icon</b> -- Hugeicons 4.3.5, stroke-rounded, Strichstaerke 1.5.
  <span id="zahl"></span></div>
<div class="r" id="r"></div>
<script>
/* Zeigt den Satz, wie er GERADE ist -- die Namen holt es aus core selbst, nicht aus einer
   Liste hier. Damit kann das Blatt nicht veralten: kommt ein Zeichen dazu, steht es hier.
   Vorher stand hier eine Gegenueberstellung alt/neu mit fest eingetragenen hg-Schluesseln --
   die gab es nach der Umstellung nicht mehr, und das Blatt zeigte nur noch Fehler. */
fetch("core.js?n="+Math.random(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){
  var s=document.createElement("script"); s.textContent=t; document.head.appendChild(s);
  var UC=window.UpstreemCore;
  var namen=[], alt=console.error;
  console.error=function(m){ var s2=String(m), i=s2.indexOf("vorhanden sind: ");
    if(i>=0) namen=s2.slice(i+16).split(", "); };
  UC.icon("--gibtesnicht--"); console.error=alt;
  namen.sort();
  var r=document.getElementById("r"), leer=0;
  namen.forEach(function(n){
    var sv=UC.icon(n,1.5).replace('width="24"','width="22"').replace('height="24"','height="22"');
    var d=document.createElement("div"); d.className="z";
    var h=document.createElement("div"); h.innerHTML=sv;
    var ok = h.firstChild && h.firstChild.children.length;
    if(!ok) leer++;
    d.innerHTML='<span>'+sv+'</span><span class="n'+(ok?'':' fehl')+'">'+n+(ok?'':' LEER')+'</span>';
    r.appendChild(d);
  });
  document.getElementById("zahl").textContent =
    namen.length + " Zeichen" + (leer ? " -- " + leer + " LEER" : " -- alle gefuellt");
  window.__erg={ zeichen:namen.length, leer:leer }; window.__fertig=1;
});
</script>
