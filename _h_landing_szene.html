<meta charset="utf-8">
<title>landing hero: Erscheinen und Filterwechsel</title>
<!-- Wozu: die sieben Aenderungen dieser Runde MESSEN, nicht ansehen.
     1 Polster oben 1px, 2 gestaffeltes Erscheinen, 3 Umschalterflaeche 60%, 4 Chipring halbiert
     und Chiptext 11.5px, 5 der Filterwechsel nach drei Sekunden, 6 das # auf 11px,
     7 der Doughnut/Balken-Schalter wie der D/W/M-Schalter.

     Eigener Dateiname und nicht _h_landing.html mit neuem ?v=: ein Versionsanhang hat in dieser
     Sitzung mehrfach nicht gewirkt, ein neuer Name wirkt immer.
     Die Dateiliste kommt aus landing-boot.js -- keine zweite Liste, die veralten kann. -->
<style>
  body { margin: 0; font: 12px ui-monospace, monospace; background: #fff; }
  #bar { padding: 8px; background: #eee; display: flex; gap: 6px; flex-wrap: wrap;
         position: sticky; top: 0; z-index: 99999; }
  #out { font: 11px/1.5 ui-monospace, monospace; background: #f6f6f6; padding: 8px; margin: 0;
         white-space: pre-wrap; max-height: 300px; overflow: auto; }
</style>
<body>
<div id="bar">
  <button onclick="zeigen(frische())">FRISCHE</button>
  <button onclick="zeigen(masse())">MASSE</button>
  <button onclick="zeigen(erscheinenMessen())">ERSCHEINEN</button>
  <button onclick="szeneMessen()">SZENE</button>
  <button onclick="zeigen(bild())">ZUSTAND</button>
  <button onclick="zeigen(verlauf())">VERLAUF</button>
  <button onclick="zeigen(mira())">MIRA JETZT</button>
  <button onclick="zeigen(miraBild())">MIRA ZUSTAND</button>
  <button onclick="zeigen(prompts())">PROMPTS JETZT</button>
  <button onclick="zeigen(chancen())">CHANCEN JETZT</button>
  <button onclick="zeigen(brettBild())">BRETT ZUSTAND</button>
  <button onclick="zeigen(zugMessen())">ZUG MESSEN</button>
  <button onclick="zeigen(neu())">NEUSTART</button>
  <button onclick="zeigen(klein())">KLEIN AN/AUS</button>
  <button onclick="zeigen(fenster())">FENSTER</button>
</div>
<pre id="out">laedt</pre>

<div class="ulh-root" data-cdn-pin=""></div>

<script>
function W(){ return document.querySelector(".ulh-root"); }
function zeigen(o){ document.getElementById("out").textContent = JSON.stringify(o, null, 1); return o; }
function cs(sel, prop){
  var e = W().querySelector(sel);
  return e ? getComputedStyle(e).getPropertyValue(prop).trim() : null;
}

/* Ohne diesen Beweis ist jeder weitere Messwert wertlos: steht die neue Regel im geladenen
   Stylesheet, und ist der neue JS-Zweig da? Am Ergebnis geprueft, das es vorher NICHT gab. */
function frische(){
  function regel(text){
    return [].some.call(document.styleSheets, function(ss){
      try { return [].some.call(ss.cssRules, function(r){
        return (r.cssText || "").indexOf(text) >= 0; }); } catch(e){ return false; }
    });
  }
  return {
    css_hash11: regel("up-hash"),
    css_rise: regel("ulhRise"),
    css_seg: regel("tcl-seg"),
    js_szene: typeof (W() || {}).__ulhSzene,
    fehler: window.__fehler || null
  };
}

function masse(){
  var chip = W().querySelector(".ulh-chip");
  var hash = W().querySelector(".ulh-app .up-hash");
  return {
    polster_oben_main: cs(".ulh-main", "padding-top"),
    gran_bg: cs(".ulh-app .vc-gran", "background-color"),
    gran_hoehe: cs(".ulh-app .vc-gran", "height"),
    seg_bg: cs(".ulh-app .tcl-seg", "background-color"),
    seg_hoehe: cs(".ulh-app .tcl-seg", "height"),
    seg_btn_hoehe: cs(".ulh-app .tcl-seg-btn", "height"),
    chip_ring: chip ? getComputedStyle(chip).backgroundColor : null,
    chip_breite: chip ? Math.round(chip.getBoundingClientRect().width) : null,
    chip_text_groesse: cs(".ulh-chip-in", "font-size"),
    hash: hash ? [hash.getBoundingClientRect().width.toFixed(2),
                  hash.getBoundingClientRect().height.toFixed(2)] : null,
    hash_css: hash ? getComputedStyle(hash).width + " x " + getComputedStyle(hash).height : null,
    gran_aktiv_rahmen: cs(".ulh-app .vc-gran-btn.is-active", "border-color"),
    seg_aktiv_rahmen: cs(".ulh-app .tcl-seg-btn.is-active", "border-color"),
    sub_farbe: cs(".ulh-sub", "color"),
    sub_gewicht: cs(".ulh-sub", "font-weight"),
    driver_farbe: cs(".ulh-driver", "color"),
    driver_gewicht: cs(".ulh-driver", "font-weight"),
    driver_icon: cs(".ulh-driver svg", "color"),
    zeile_uebergang: cs(".ulh-app .vt-row", "transition"),
    punkt_rand: (function(){
      var c = W().querySelector(".up-line-canvas");
      var ch = c && window.Chart && window.Chart.getChart ? window.Chart.getChart(c) : null;
      if (!ch) return null;
      var d = ch.data.datasets[0];
      return "linie " + d.borderWidth + " punkt " + d.pointBorderWidth + " hover " + d.pointHoverBorderWidth +
             " fuellung " + d.pointHoverBackgroundColor;
    })(),
    plugin_reihenfolge: (function(){
      var c = W().querySelector(".up-line-canvas");
      var ch = c && window.Chart && window.Chart.getChart ? window.Chart.getChart(c) : null;
      if (!ch) return null;
      return (ch.config.plugins || []).map(function(p){ return p.id + (p.beforeDatasetsDraw ? "/vor" : "/nach"); }).join(" ");
    })()
  };
}

/* Die Animationen LAUFEN in diesem Fenster nicht. Messbar ist trotzdem, ob die richtige Animation
   mit der richtigen Verzoegerung an der richtigen Stelle haengt -- und das ist die Behauptung. */
function erscheinenMessen(){
  var r = W();
  r.classList.add("is-entering");                    /* faellt im Betrieb nach 1100ms ab */
  function a(sel){
    var e = r.querySelector(sel);
    if (!e) return null;
    var s = getComputedStyle(e);
    return s.animationName + " " + s.animationDuration + " " + s.animationDelay + " " + s.animationFillMode;
  }
  var o = {
    is_shown: r.classList.contains("is-shown"),
    stage_deckkraft: cs(".ulh-stage", "opacity"),
    rahmen: a(".ulh-frame"),
    seitenkopf: a(".dph-root"),
    chart: a(".vot-root"),
    zitate: a(".tcd-root")
  };
  r.classList.remove("is-entering");
  return o;
}

/* Der Zustand der Tabelle, der Kopfzeile und der Linien -- in genau der Form, in der er sich
   vorher und nachher vergleichen laesst. */
function bild(){
  var r = W();
  var zeilen = [].slice.call(r.querySelectorAll(".vot-unit-right .vt-row")).map(function(z){
    function t(sel){ var e = z.querySelector(sel); return e ? e.textContent.trim() : null; }
    var punkt = z.querySelector(".vt-td-sentiment .up-sent-dot");
    return {
      id: z.getAttribute("data-id"),
      idx: t(".vt-td-idx"),
      name: t(".vt-brand-name"),
      vis: t(".vt-td-visibility .up-num"),
      visT: t(".vt-td-visibility .up-trend"),
      rank: t(".vt-td-ranking .up-num"),
      rankT: t(".vt-td-ranking .up-trend"),
      sent: t(".vt-td-sentiment .up-sent-val"),
      sentT: t(".vt-td-sentiment .up-trend"),
      punkt: punkt ? punkt.style.background : null,
      tf: z.style.transform || "",
      tr: z.style.transition || ""
    };
  });
  var kpis = [].slice.call(r.querySelectorAll(".dph-kpis .dph-kpi")).map(function(k){
    var v = k.querySelector(".dph-kpi-value"), t = k.querySelector(".up-trend");
    return (v ? v.textContent.trim() : "?") + " / " + (t ? t.textContent.trim() : "-");
  });
  var lein = r.querySelector(".up-line-canvas");
  var chart = lein && window.Chart && window.Chart.getChart ? window.Chart.getChart(lein) : null;
  var linien = null, ymax = null, hoechster = null;
  if (chart){
    linien = chart.data.datasets.map(function(d){
      return d.__id + ":" + d.data.map(function(v){ return Number(v).toFixed(1); }).join(",");
    });
    ymax = chart.scales && chart.scales.y ? Number(chart.scales.y.max).toFixed(2) : null;
    hoechster = 0;
    chart.data.datasets.forEach(function(d){ d.data.forEach(function(v){ if (v > hoechster) hoechster = v; }); });
    hoechster = hoechster.toFixed(1);
  }
  var ttBox = r.querySelector(".up-line-tt");
  var tt = ttBox ? [].slice.call(ttBox.querySelectorAll(".up-line-tt-row")).map(function(z){
    return z.getAttribute("data-id") + ":" + (z.querySelector(".up-line-tt-val") || {}).textContent;
  }) : null;
  return {
    tooltip: tt,
    reihenfolge: zeilen.map(function(z){ return z.idx + z.id; }).join(" "),
    zeilen: zeilen, kpis: kpis, linien: linien,
    y_achse_max: ymax, hoechster_wert: hoechster,
    tipp_offen: !!(chart && chart.tooltip && chart.tooltip.getActiveElements &&
                   chart.tooltip.getActiveElements().length)
  };
}

/* Drei Aufnahmen: vorher, unmittelbar nach dem Ausloesen (da muss die Umsortierung schon im DOM
   stehen und die Zeilen per transform noch an der ALTEN Stelle haengen -- der Invert-Schritt), und
   nach dem Ende. Die mittlere Aufnahme ist der Beweis, dass es eine Wanderung gibt und nicht nur
   ein Umschreiben. */
function szeneMessen(){
  var r = W();
  var o = { vor: bild() };
  var ok = r.__ulhSzene ? r.__ulhSzene() : "keine Handhabe";
  o.ausgeloest = ok;
  o.sofort = bild();
  setTimeout(function(){
    o.nach_1200 = bild();
    o.zweiter_versuch = r.__ulhSzene ? r.__ulhSzene() : null;   /* muss false sein: nur einmal */
    zeigen(o);
  }, 1200);
  zeigen(o);
}

/* Die zweite Szene von Hand ausloesen, statt achteinhalb Sekunden zu warten. */
function mira(){ var r = W(); return { ausgeloest: r.__ulhMira ? r.__ulhMira() : "keine Handhabe" }; }

/* Die dritte und vierte Szene von Hand, ohne die Minuten dazwischen abzuwarten. */
function prompts(){ var r = W(); return { ausgeloest: r.__ulhPrompts ? r.__ulhPrompts() : "keine Handhabe" }; }
function chancen(){ var r = W(); return { ausgeloest: r.__ulhChancen ? r.__ulhChancen() : "keine Handhabe" }; }
function neu(){ var r = W(); return { ausgeloest: r.__ulhNeu ? r.__ulhNeu() : "keine Handhabe" }; }

/* Die Verkleinerung von Hand schalten. Sie haengt sonst am Scrollen, und im verdeckten Tab ist
   der Takt, der sie setzt, langsam -- fuer eine Messung der drei Nebenfenster ist das der Weg.
   Der Inline-Stil muss MIT gesetzt werden: die Klasse traegt nur den Auftritt der Nebenfenster,
   die Groesse des Fensters schreibt landing-hero.js als Inline-Stil (Begruendung dort). */
function klein(){
  var r = W(), b = r.querySelector(".ulh-buehne");
  var an = !r.classList.contains("is-klein");
  /* Uebergaenge AUS, und zwar dauerhaft in diesem Aufbau: in einem verdeckten Tab friert jeder
     laufende Uebergang auf seinem STARTWERT ein, und jede Messung danach misst die Lage VOR dem
     Auftritt (gemessen: Deckkraft 0 und die 0.94-Skalierung, Minuten nach dem Umschalten). Wer
     die Endlage messen will, muss den Uebergang wegnehmen -- nicht laenger warten. */
  if (!document.getElementById("h-sofort")){
    var st = document.createElement("style");
    st.id = "h-sofort";
    st.textContent = ".ulh-fen, .ulh-buehne { transition: none !important; }";
    document.head.appendChild(st);
  }
  r.classList.toggle("is-klein", an);
  /* Der Faktor steht in landing-hero.js (KLEIN_FAKTOR) -- hier wird er aus der Datei gelesen,
     damit die Messung nicht an einer zweiten, veralteten Zahl haengt. */
  var faktor = (function(){
     var t = (window.__geladen && document.querySelector("script")) ? null : null;
     var q = document.querySelectorAll("style,script");
     for (var i = 0; i < q.length; i++){
       var m = /var KLEIN_FAKTOR = ([0-9.]+)/.exec(q[i].textContent || "");
       if (m) return m[1];
     }
     return "0.76";
  })();
  b.style.transform = an ? ("scale(" + faktor + ")") : "scale(1)";
  return { klein: an, transform: b.style.transform, faktor: faktor, hinweis: "Uebergaenge fuer die Messung aus" };
}

/* Die drei Nebenfenster: Groesse, Lage zu den Kanten des Hauptfensters, und wie viel von ihnen im
   Ausschnitt der Sektion steht. */
function fenster(){
  var r = W(), stage = r.querySelector(".ulh-stage").getBoundingClientRect();
  var buehne = r.querySelector(".ulh-buehne").getBoundingClientRect();
  function mess(sel){
    var f = r.querySelector(sel); if (!f) return null;
    var fr = f.getBoundingClientRect();
    var links = fr.left - stage.left, rechts = fr.right - stage.left;
    var drin = Math.max(0, Math.min(rechts, stage.width) - Math.max(links, 0));
    var v = f.querySelector(".ulh-fen-view"), a = f.querySelector(".ulh-fen-app");
    return {
      schirm: v ? Math.round(v.offsetWidth) + "x" + Math.round(v.offsetHeight) : null,
      inhalt: a ? Math.round(a.offsetWidth) + "x" + Math.round(a.offsetHeight) +
                  " ueberlauf=" + (a.scrollHeight - a.offsetHeight) : null,
      sichtbar: Math.round(drin) + " von " + Math.round(fr.width) +
                " (" + Math.round(drin / fr.width * 100) + "%)",
      zumFenster: { links: Math.round(fr.left - buehne.left), oben: Math.round(fr.top - buehne.top),
                    rechts: Math.round(fr.right - buehne.left), unten: Math.round(fr.bottom - buehne.top) },
      ebene: getComputedStyle(f).zIndex, deckkraft: getComputedStyle(f).opacity,
      punkte: f.querySelectorAll(".ulh-dot").length
    };
  }
  return {
    klein: r.classList.contains("is-klein"),
    mass: getComputedStyle(r).getPropertyValue("--ulh-mass").trim(),
    dokBreite: document.documentElement.scrollWidth + " (Fenster " + window.innerWidth + ")",
    teams: mess(".ulh-fen-teams"),
    urls: mess(".ulh-fen-urls"),
    antwort: mess(".ulh-fen-antwort"),
    teamzeilen: [].map.call(r.querySelectorAll(".ulh-fen-teams .usn-teamrow"), function(z){
      return (z.querySelector(".usn-teamrow-name") || {}).textContent +
             (z.classList.contains("is-active") ? " *" : "") +
             (z.querySelector(".ulh-teamchip") ? " [" + z.querySelector(".ulh-teamchip").textContent + "]" : ""); }),
    donut: [].map.call(r.querySelectorAll(".ulh-fen-urls .up-donut-legend-row"), function(z){
      return (z.querySelector(".up-donut-legend-name") || {}).textContent + " " +
             (z.querySelector(".up-donut-legend-pct") || {}).textContent; }),
    donutMitte: (r.querySelector(".ulh-fen-urls .up-donut-center") || {}).textContent,
    karte: (function(k){ return k ? { hoehe: k.offsetHeight,
        modell: (k.querySelector(".urt-model-chip") || {}).textContent,
        marken: k.querySelectorAll(".urt-card-brands .up-stack-item").length,
        zitate: k.querySelectorAll(".urt-card-citations .up-stack-item").length } : "keine";
      })(r.querySelector(".ulh-fen-antwort .urt-card"))
  };
}

/* Der Zustand des Bretts: was in welcher Spalte steht, wie die Karten liegen, was die Karten
   tragen (Themen, Prioritaet), und ob die Schublade offen ist. */
function brettBild(){
  var r = W();
  var seite = r.querySelector(".ulh-chancen");
  var spalten = [].slice.call(r.querySelectorAll(".uo-col")).map(function(c){
    var kopf = c.querySelector(".uo-col-head");
    return {
      kopf: kopf ? kopf.textContent.replace(/\s+/g, " ").trim() : null,
      karten: [].slice.call(c.querySelectorAll(".uo-card")).map(function(k){
        return { id: k.getAttribute("data-id"), x: k.offsetLeft, y: k.offsetTop,
                 h: k.offsetHeight, i: k.style.getPropertyValue("--ulh-i"),
                 sicht: getComputedStyle(k).visibility,
                 klassen: k.className.replace("uo-card", "").trim(),
                 themen: k.querySelectorAll(".up-topicchip").length,
                 balken: k.querySelectorAll(".uo-pot-bar").length,
                 balkenMass: (function(b){ if (!b) return null; var cs = getComputedStyle(b);
                   return cs.width + " x " + cs.height + " r" + cs.borderTopLeftRadius; })(k.querySelector(".uo-pot-bar")),
                 quelle: (k.querySelector(".uo-source-domain")||{}).textContent,
                 logo: (function(i){ return i ? i.getAttribute("src").slice(0, 62) : null; })(k.querySelector(".uo-source img")) };
      })
    };
  });
  var modal = document.querySelector(".uo-modal");
  var kpis = modal ? [].slice.call(modal.querySelectorAll(".uo-kpi")).map(function(k){
    var cs = getComputedStyle(k);
    return { k: (k.querySelector(".uo-kpi-label")||{}).textContent,
             v: (k.querySelector(".uo-kpi-val")||{}).textContent,
             disp: cs.display, rahmen: cs.borderTopWidth + "/" + cs.borderBottomWidth,
             polster: cs.padding, radius: cs.borderTopLeftRadius,
             wert_px: getComputedStyle(k.querySelector(".uo-kpi-val")).fontSize };
  }) : null;
  var meta = modal ? [].slice.call(modal.querySelectorAll(".uo-meta-item")).slice(0,1).map(function(m){
    var cs = getComputedStyle(m);
    return { disp: cs.display, rahmen: cs.borderTopWidth + "/" + cs.borderBottomWidth,
             polster: cs.padding, wert_px: getComputedStyle(m.querySelector(".uo-meta-v")).fontSize };
  }) : null;
  return {
    seite: seite ? seite.className.replace("ulh-seite ", "") : null,
    spalten: spalten,
    schublade: (function(){ var p = document.querySelector(".uo-portal");
      return p ? p.className + " op=" + getComputedStyle(p).opacity : "keine"; })(),
    kpis: kpis, metaErste: meta
  };
}

/* Einen Zug messen, ohne auf die Uhr der Szene zu warten: Lage vorher, Zug ausloesen, sofort die
   Inline-Stile lesen (im verdeckten Tab friert jeder Uebergang auf seinem Startwert ein -- genau
   dieser Startwert IST die gemessene Strecke). */
function zugMessen(){
  var r = W();
  function lagen(){ var o = {}; [].forEach.call(r.querySelectorAll(".uo-card"), function(k){
    o[k.getAttribute("data-id")] = k.offsetLeft + "," + k.offsetTop; }); return o; }
  var vor = lagen();
  if (!window.opportunitiesSetStatus) return { fehler: "kein Setter" };
  var vorher = {};
  [].forEach.call(r.querySelectorAll(".uo-card"), function(k){
    vorher[k.getAttribute("data-id")] = { x: k.offsetLeft, y: k.offsetTop }; });
  window.opportunitiesSetStatus("o2", "in_progress");
  var nach = {}, stil = {};
  [].forEach.call(r.querySelectorAll(".uo-card"), function(k){
    var id = k.getAttribute("data-id");
    nach[id] = k.offsetLeft + "," + k.offsetTop;
    stil[id] = k.getAttribute("style");
  });
  return { vor: vor, nach: nach, stil: stil };
}

/* Der Zustand von Mira: welche Seite sichtbar ist, was im Eingabefeld steht, welche Nachrichten
   da sind, ob die Antwort tippt, und ob die Marken-Chips wirklich ein Logo bekommen haben. */
function miraBild(){
  var r = W();
  var dash = r.querySelector(".ulh-main"), mira = r.querySelector(".ulh-mira");
  var am = r.querySelector("#ask-mira");
  var chips = am ? [].slice.call(am.querySelectorAll(".am-msg.is-assistant .am-logo-wrap")) : [];
  var tab = am ? am.querySelector(".am-msg.is-assistant table") : null;
  return {
    dash: dash ? getComputedStyle(dash).opacity + " " + dash.className : null,
    mira_klassen: mira ? mira.className : null,
    mira_deckkraft: mira ? getComputedStyle(mira).opacity : null,
    mira_animation: mira ? getComputedStyle(mira).animationName + " " + getComputedStyle(mira).animationDuration : null,
    mira_hoehe: mira ? Math.round(mira.getBoundingClientRect().height) : null,
    am_hoehe: am ? Math.round(am.getBoundingClientRect().height) : null,
    leiste_aktiv: (function(){ var a = r.querySelector(".usn-item.is-active"); return a ? a.textContent.trim() : null; })(),
    kategorien: (function(){ var k = r.querySelector("#am-suggested"); return k ? getComputedStyle(k).display : "fehlt"; })(),
    eingabe: am ? (am.querySelector("#am-textarea") || {}).value : null,
    nachrichten: am ? am.querySelectorAll(".am-msg").length : 0,
    laedt: am ? !!am.querySelector(".am-msg-loading") : null,
    tippt: am ? !!am.querySelector(".am-msg.am-typing") : null,
    tabelle: tab ? tab.querySelectorAll("tbody tr").length + " Zeilen, " +
                   (tab.querySelectorAll("thead th").length) + " Spalten" : "keine",
    chips: chips.length,
    chips_mit_logo: chips.filter(function(c){ return !!c.querySelector("img"); }).length,
    chip_bilder: chips.slice(0, 3).map(function(c){ var i = c.querySelector("img");
      return c.textContent.trim() + ":" + (i ? (i.getAttribute("src") || "").slice(0, 22) : "kein img"); }),
    fehler: window.__fehler || null
  };
}

/* Der Mitschnitt laeuft VOM START an. Beim ersten Versuch habe ich ihn per Hand nach dem Laden
   gestartet -- da war der Wechsel schon vorbei, und die erste Aufnahme zeigte bereits den
   Endzustand. Ein Messfehler, der wie "es gibt keine Bewegung" aussah. */
window.__log = [];
window.__t0 = performance.now();
window.__iv = setInterval(function(){
  var r = W(); if (!r) return;
  var zs = [].slice.call(r.querySelectorAll(".vot-unit-right .vt-row"));
  if (!zs.length) return;
  var ke = zs.filter(function(z){ return z.getAttribute("data-id") === "ke"; })[0];
  var lein = r.querySelector(".up-line-canvas");
  var ch = lein && window.Chart && window.Chart.getChart ? window.Chart.getChart(lein) : null;
  var kd = null, pix = null;
  if (ch) ch.data.datasets.forEach(function(d, i){
    if (d.__id !== "ke") return;
    kd = Number(d.data[0]).toFixed(2);
    var m = ch.getDatasetMeta(i);
    if (m && m.data && m.data[0]) pix = m.data[0].y.toFixed(1);
  });
  window.__log.push({
    ms: Math.round(performance.now() - window.__t0),
    ord: zs.map(function(z){ return z.getAttribute("data-id"); }).join(""),
    idx: zs.map(function(z){ var e = z.querySelector(".vt-td-idx"); return e ? e.textContent.trim() : "?"; }).join(""),
    keVis: ke ? (ke.querySelector(".vt-td-visibility .up-num") || {}).textContent : null,
    keRank: ke ? (ke.querySelector(".vt-td-ranking .up-num") || {}).textContent : null,
    keSent: ke ? (ke.querySelector(".vt-td-sentiment .up-sent-val") || {}).textContent : null,
    kpi: (function(){ var v = r.querySelector(".dph-kpis .dph-kpi .dph-kpi-value"); return v ? v.textContent : null; })(),
    keTf: ke ? (ke.style.transform || "") : "",
    /* Der GERECHNETE transform. Der Inline-Stil steht sofort auf 0 -- ob die Zeile dorthin
       GLEITET, steht nur hier: laeuft die Transition, liefert getComputedStyle die Matrix des
       Zwischenstands. Steht hier "none" oder sofort die Endmatrix, gleitet nichts. */
    keTfC: ke ? getComputedStyle(ke).transform : "",
    /* Die Kachel: Fuellung und Linie oben stecken in EINEM box-shadow, dazu der Stapelplatz. */
    keSh: ke ? (getComputedStyle(ke).boxShadow + " z" + (ke.style.zIndex || "-")) : "",
    dsKe0: kd, pixKe0: pix,
    /* Der Tooltip: Reihenfolge, Werte, und der GERECHNETE transform der Kestrel-Zeile -- daran
       haengt die Behauptung "der Tooltip macht dieselbe Bewegung". */
    tt: (function(){
      var box = r.querySelector(".up-line-tt");
      if (!box) return null;
      var zs = [].slice.call(box.querySelectorAll(".up-line-tt-row"));
      if (!zs.length) return null;
      var ke = zs.filter(function(z){ return z.getAttribute("data-id") === "ke"; })[0];
      return zs.map(function(z){ return z.getAttribute("data-id") + ":" +
               (z.querySelector(".up-line-tt-val") || {}).textContent; }).join(" ") +
             " || keTf " + (ke ? getComputedStyle(ke).transform : "-") +
             " bg " + (ke ? (ke.style.backgroundColor || "-") : "-") +
             " op " + box.style.opacity + "/" + (ch && ch.tooltip ? ch.tooltip.opacity : "?") +
             " parsed " + (ch && ch.tooltip && ch.tooltip.dataPoints
               ? ch.tooltip.dataPoints.map(function(dp){ return Number(dp.parsed.y).toFixed(1); }).join(",")
               : "-");
    })()
  });
  if (window.__log.length > 220) clearInterval(window.__iv);
}, 40);

/* Der Mitschnitt, auf das Wesentliche gekuerzt: die Aufnahmen um die erste Aenderung herum. */
function verlauf(){
  var L = window.__log, i0 = -1;
  for (var i = 1; i < L.length; i++) if (L[i].ord !== L[0].ord || L[i].keVis !== L[0].keVis){ i0 = i; break; }
  return { aufnahmen: L.length, erste: L[0], wechsel_bei_ms: i0 >= 0 ? L[i0].ms : null,
           fenster: i0 >= 0 ? L.slice(i0 - 1, i0 + 17) : [], letzte: L[L.length - 1] };
}

window.addEventListener("error", function(e){
  window.__fehler = (window.__fehler || []).concat([String(e.message).slice(0, 160)]);
});

(function(){
  function hol(f){ return fetch(f + "?nocache=" + Math.random(), { cache: "no-store" })
                     .then(function(r){ return r.text(); }); }
  hol("landing-boot.js").then(function(boot){
    var files = [];
    boot.replace(/\bcss\("([^"]+)"\)/g, function(_, f){ files.push(f); return ""; });
    boot.replace(/\bjs\("([^"]+)"\)/g,  function(_, f){ files.push(f); return ""; });
    var texts = {};
    return Promise.all(files.map(function(f){
      return hol(f).then(function(t){ texts[f] = t; });
    })).then(function(){
      files.forEach(function(f){
        var el = document.createElement(/\.css$/.test(f) ? "style" : "script");
        el.textContent = texts[f];
        document.head.appendChild(el);
      });
      window.__geladen = files;
      setTimeout(function(){ zeigen({ geladen: files.length, frische: frische(), masse: masse() }); }, 2200);
    });
  });
})();
