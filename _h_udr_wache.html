<meta charset="utf-8"><title>Kalender: die Wache an den Bubble-Funktionen</title>
<style>html,body{margin:0;font:13px/1.5 system-ui,sans-serif;padding:8px}
#out{font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;padding:10px;background:#f6f6f6;margin-top:12px}</style>
<body><div id="halter"></div><pre id="out">laeuft…</pre>
<script>
/* Die Wache soll JEDEN Aufruf der bubble_fn_* mitschreiben -- auch die, die NICHT von dieser
   Bibliothek kommen. Genau das ist die Frage, um die sich alles gedreht hat: wer ruft
   udr_apply_dashboard? Also wird hier ein FREMDER Aufruf gestellt und geprueft, ob er in der Spur
   landet und als "VON DER SEITE" erkannt wird.
   Im obersten Fenster, weil die Wache am window haengt. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
/* Der Schalter wird NICHT gesetzt: geprueft wird die Vorgabe des Diagnosestands (Spur an, ohne
   dass jemand etwas setzen muss). Das ist die Aussage, um die es geht -- ein Prueftand, der den
   Schalter selbst setzt, haette sie nicht gemessen. */
try { localStorage.removeItem("up_dates_trace");
      localStorage.setItem("up_prefs", JSON.stringify({date_sync:"on",date_preset:"last30"})); } catch(e){}
var RUF={boot:0,range:0,apply:0};
/* Die Bruecke kommt SPAET, wie bei Bubble (dort 3400ms). Vorher existiert keine Funktion --
   deshalb kann die Wache lueckenlos sein. */
setTimeout(function(){
  /* Eine Bubble-Funktion, die in KEINEM data-*-fn-Attribut steht -- so wie das apply_-Event, das
     der date_range-Workflow im Reusable am Ende ruft. Sie muss trotzdem bewacht werden, sonst
     bleibt genau die Frage offen, um die es geht. */
  window.bubble_fn_irgendwas_fremdes = function(){ RUF.fremd = (RUF.fremd||0)+1; };
  window.bubble_fn_udr_date_boot_x  = function(){ RUF.boot++; };
  window.bubble_fn_udr_date_range_x = function(){ RUF.range++; };
  window.bubble_fn_udr_apply_x      = function(){ RUF.apply++; };
}, 1200);
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function wurzelAus(h){ return h.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim(); }
Promise.all([hol("core.css"),hol("filters/date-range.css"),hol("core.js"),
             hol("filters/date-range.js"),hol("filters/bubble/date_range_bubble.html")])
.then(function(t){
  [t[0],t[1]].forEach(function(c){ var s=document.createElement("style"); s.textContent=c; document.head.appendChild(s); });
  var w=document.createElement("div"); w.innerHTML=wurzelAus(t[4]);
  var r=w.querySelector(".udr-root");
  r.setAttribute("data-instance","dates_v2_dashboard"); r.setAttribute("data-cdn-pin","t");
  r.setAttribute("data-isdark","no");
  r.setAttribute("data-boot-fn","bubble_fn_udr_date_boot_x");
  r.setAttribute("data-range-fn","bubble_fn_udr_date_range_x");
  r.setAttribute("data-range-apply-fn","bubble_fn_udr_apply_x");
  r.setAttribute("data-range-apply-delay","0");
  document.getElementById("halter").appendChild(r);
  var j=document.createElement("script"); j.textContent=t[2]; document.head.appendChild(j);
  var j2=document.createElement("script"); j2.textContent=t[3]; document.head.appendChild(j2);
  return new Promise(function(ok){ setTimeout(ok,3000); });
}).then(function(){
  /* EIN FREMDER AUFRUF, wie die Seite ihn machen wuerde. */
  window.bubble_fn_udr_apply_x('{"von":"der Seite"}');
  /* Und die, die in keinem Attribut steht: der eigentliche Fall. */
  window.bubble_fn_irgendwas_fremdes('{"von":"einem Bubble-Workflow"}');
  return new Promise(function(ok){ setTimeout(ok,300); });
}).then(function(){
  var spur=window.__udrLog||[];
  var aufrufe=spur.filter(function(e){ return e.art==="aufruf"; });
  var unser=aufrufe.filter(function(e){ return e.vonUns; });
  var fremd=aufrufe.filter(function(e){ return !e.vonUns; });
  log("Bubble-Aufrufe gezaehlt: "+JSON.stringify(RUF));
  log("Spur-Eintraege \"aufruf\": "+aufrufe.length+
      "   davon VON UNS: "+unser.length+"   VON DER SEITE: "+fremd.length);
  aufrufe.forEach(function(e){
    log("   "+e.fn+"  "+(e.vonUns?"VON UNS":"VON DER SEITE")+"  "+String(e.wert).slice(0,40));
  });
  var ungenannt = fremd.filter(function(e){ return e.fn==="bubble_fn_irgendwas_fremdes"; });
  log("   ==> "+(unser.length>=1 && fremd.length===2 && ungenannt.length===1
        ? "RICHTIG (auch eine Funktion, die in keinem Attribut steht, wird bewacht)"
        : "FALSCH -- "+(ungenannt.length===0
            ? "die nicht in einem Attribut genannte Funktion fehlt -- genau die, um die es geht"
            : (unser.length===0?"der eigene fehlt":"falsch zugeordnet"))));
  /* GEGENPROBE: ohne up_dates_trace darf NICHTS umgeschlossen werden. */
  log("   Wache aktiv (Funktion ersetzt): "+(!!window.bubble_fn_udr_apply_x.__udrWache)+
      "   ==> "+(window.bubble_fn_udr_apply_x.__udrWache
        ?"RICHTIG (ohne jeden Konsolenbefehl -- die Vorgabe ist an)":"FALSCH"));
  /* GEGENPROBE ZUR MELDUNG: upstreemDatesWatch() darf nur zaehlen, was es WIRKLICH bewacht.
     Alles ist hier schon bewacht, also muss die Antwort 0 sein -- die erste Fassung meldete die
     Zahl der Kalender und behauptete damit eine Wache, die sie nicht gelegt hatte. */
  var nochmal = window.upstreemDatesWatch();
  log("   upstreemDatesWatch() bei schon bewachten Funktionen: "+nochmal+
      "   ==> "+(nochmal===0 ? "RICHTIG (zaehlt nur echte Zugaenge)" : "FALSCH -- meldet zu viel"));
  /* Und ohne Diagnosemodus: der ausdrueckliche Aufruf muss trotzdem wirken. */
  try { localStorage.setItem("up_dates_trace","off"); } catch(e){}
  window.bubble_fn_udr_neu_x = function(){};
  var r2=document.querySelector(".udr-root");
  r2.setAttribute("data-range-apply-fn","bubble_fn_udr_neu_x");
  var erzwungen = window.upstreemDatesWatch();
  log("   mit up_dates_trace=off, ausdruecklich gerufen: "+erzwungen+" neu bewacht"+
      "   ==> "+(erzwungen===1 ? "RICHTIG (die Anweisung wirkt auch ohne Schalter)" : "FALSCH"));
  /* DER GEMELDETE MECHANISMUS: das Snippet am Ende des date_range-Workflows liest
     data-range-json vom Element und ruft damit apply. Beim AUFBAU darf dort nichts stehen --
     sonst ist der Aufbau von einer Nutzerauswahl nicht zu unterscheiden. */
  var el=document.querySelector(".udr-root");
  log("Nach dem Aufbau (Grund \"boot\"):");
  log("   data-range-reason = \""+el.getAttribute("data-range-reason")+"\"");
  log("   data-range-json   = "+(el.getAttribute("data-range-json")===null?"(nicht gesetzt)":el.getAttribute("data-range-json").slice(0,40)));
  log("   ==> "+(el.getAttribute("data-range-json")===null && el.getAttribute("data-range-reason")==="boot"
        ? "RICHTIG (der Bote bleibt leer -- das Snippet kann den Aufbau nicht als Auswahl lesen)"
        : "FALSCH -- der Aufbau hinterlaesst eine scheinbare Nutzerauswahl"));
  /* data-range-current: der Stand ZUM ABHOLEN. Er muss ab dem Mount dastehen, damit ein
     view_first-Workflow nicht auf Bubbles Bruecke warten muss (auf der echten Seite 3,3s). */
  var akt=el.getAttribute("data-range-current");
  var o={}; try { o=JSON.parse(akt||"{}"); } catch(e){}
  log("   data-range-current = "+(akt?akt.slice(0,70)+"…":"(nicht gesetzt)"));
  log("   ==> "+(akt && /^\d{4}-\d{2}-\d{2}$/.test(o.date_from||"") && o.preset==="last30"
        ? "RICHTIG (abholbar, ohne dass wir etwas gerufen haben)"
        : "FALSCH -- ein view_first-Workflow findet keinen Zeitraum"));
  /* GEGENPROBE: eine echte Auswahl MUSS den Boten setzen, sonst laedt die Seite nach einem Klick
     nicht mehr nach. */
  document.querySelector(".udr-trigger").click();
  return new Promise(function(ok){ setTimeout(ok,400); });
}).then(function(){
  var p2=document.querySelector('.udr-preset[data-preset="last7"]');
  if (p2) p2.click();
  return new Promise(function(ok){ setTimeout(ok,400); });
}).then(function(){
  var el=document.querySelector(".udr-root");
  var j=el.getAttribute("data-range-json");
  log("GEGENPROBE  Klick auf ein Preset (Grund \"user\"):");
  log("   data-range-reason = \""+el.getAttribute("data-range-reason")+"\"");
  log("   data-range-json   = "+(j?j.slice(0,50)+"…":"(nicht gesetzt)"));
  log("   ==> "+(j && el.getAttribute("data-range-reason")==="user"
        ? "RICHTIG (der Bote traegt die Auswahl -- das Snippet auf der Seite funktioniert weiter)"
        : "FALSCH -- eine echte Auswahl erreicht die Seite nicht mehr"));
  var akt2=el.getAttribute("data-range-current"), o2={};
  try { o2=JSON.parse(akt2||"{}"); } catch(e){}
  log("   data-range-current zieht mit: preset=\""+o2.preset+"\""+
      "   ==> "+(o2.preset==="last7"?"RICHTIG (folgt der Auswahl)":"FALSCH -- steht auf dem alten Stand"));
  /* DOPPELUNG: unsere automatische Aufbau-Uebergabe ist schon gelaufen. Ein view_first-Schritt,
     der upstreemDatesActivate mit DEMSELBEN Zeitraum ruft, darf keinen zweiten Workflow-Lauf
     ausloesen -- im Log der echten Seite standen genau diese zwei wortgleichen Uebergaben
     (4423ms und 5272ms). */
  /* ZWEIMAL hintereinander, ohne Aenderung dazwischen. Der erste Anlauf pruefte gegen die
     Aufbau-Uebergabe -- aber der Prueftand hatte zwischendurch ein Preset geklickt, der Zeitraum
     war also wirklich neu und das Feuern richtig. Meine Erwartung war falsch, nicht der Code. */
  RUF.boot=0;
  window.upstreemDatesActivate("dashboard");
  return new Promise(function(ok){ setTimeout(function(){
    RUF.boot=0;
    ok(window.upstreemDatesActivate("dashboard"));
  },400); });
}).then(function(r1){
  return new Promise(function(ok){ setTimeout(function(){ ok(r1); },300); });
}).then(function(r1){
  var spur=(window.__udrLog||[]);
  var uebersprungen=spur.filter(function(e){ return e.art==="activate-uebersprungen"; }).length;
  log("DOPPELUNG  upstreemDatesActivate mit demselben Zeitraum:");
  log("   Rueckgabe="+r1+"   neue boot-Aufrufe="+RUF.boot+"   uebersprungen="+uebersprungen);
  /* ZURUECKGENOMMEN: der zweite Aufruf MUSS feuern. Er ist die Absicherung des
     view_first-Workflows ("setz den Zeitraum, egal was vorher war") -- ob Bubble unseren Wert von
     vorhin noch hat, kann diese Datei nicht wissen, und die States nicht lesen. */
  log("   ==> "+(RUF.boot===1 && uebersprungen===0 && r1===true
        ? "RICHTIG (feuert auch beim zweiten Mal -- die Absicherung bleibt eine)"
        : "FALSCH -- "+(RUF.boot===0?"der zweite Aufruf wurde wegoptimiert":"falsche Rueckgabe")));
  /* GEGENPROBE: nach einer ECHTEN Aenderung muss activate wieder feuern. */
  var m=document.querySelector('.udr-preset[data-preset="last3"]');
  document.querySelector(".udr-trigger").click();
  return new Promise(function(ok){ setTimeout(function(){
    var m2=document.querySelector('.udr-preset[data-preset="last3"]');
    if (m2) m2.click();
    setTimeout(function(){ RUF.boot=0; ok(window.upstreemDatesActivate("dashboard")); },400);
  },300); });
}).then(function(r2){
  return new Promise(function(ok){ setTimeout(function(){ ok(r2); },300); });
}).then(function(r2){
  log("   GEGENPROBE nach einem Preset-Wechsel: neue boot-Aufrufe="+RUF.boot+
      "   ==> "+(RUF.boot===1
        ? "RICHTIG (bei neuem Zeitraum wird uebergeben -- der Vergleich ist also echt)"
        : "FALSCH -- activate feuert auch bei einer Aenderung nicht mehr"));
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: "+e.message); });
</script>
