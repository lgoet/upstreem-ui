<!--
  UPSTREEM — BRANDS PAGE HEADER

  Sits at the very top of the Brands page: meta row, page heading + description, a 2-tab page nav
  (Tracked / Discover) with an animated sliding active indicator, and "Add Brand" + Refresh buttons
  top right. Same page-headers/ family as prompts-page-header.js / dashboard-page-header.js /
  citations-page-header.js -- all the actual visual styling and the sliding-tab nav interaction
  live in core.css/core.js's shared Page Header Kit (the ".up-ph-*" classes and UC.makePageNav) so
  every page header gets them for free; this file only supplies the PAGES list, the heading/
  description text, and the event names. Copying this file for the next page's header means
  duplicating this whole file and swapping those three things in the .js and the two text nodes in
  the markup below; nothing about the boot/mount/event plumbing or the kit underneath changes.

  Almost nothing here is dynamic. Unlike a table, this component has no server data to wait on: no
  render()/reset() functions, no loading state. It reads its two dynamic inputs straight off the
  root element's own attributes at mount and never touches them again.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance   = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin    = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the literal
                    "CDN_PIN" placeholder) to load @main. Point this at a Bubble constant/Option
                    Set field you control so every placement can be repinned to a new commit in
                    one edit instead of hunting down every embed's URL by hand.
  data-isdark     = "yes" / "no"
  data-brand-name = "Acme"                              plain text, no HTML
  data-brand-logo = "https://.../favicon.ico"            any image URL; left empty hides the <img>
                    entirely rather than showing a broken-image icon

  ── Event names must be unique per placement ─────────────────────────────────
  data-nav-fn     = "bubble_fn_bphNav_[dynamic id]"
  data-add-fn     = "bubble_fn_bphAdd_[dynamic id]"
  data-refresh-fn = "bubble_fn_bphRefresh_[dynamic id]"

  All three fire ONE JSON string, values pulled out on the Bubble side by regex — same convention
  as every other component in this library.

    nav     {"page":"tracked"}  -> fires on every tab click, AFTER the sliding indicator has
                                   already been told to animate to it. One of exactly two values:
                                   tracked | discover.
    add     {}                  -> "Add Brand" button. No fields at all — this component's whole
                                   job here is "tell Bubble the button was clicked", not to carry
                                   any data along with it.
    refresh {}                  -> the icon-only Refresh button. Same "no fields" shape as add —
                                   this component does not reload anything itself.

  Regex reference for a Bubble "extract" step:
    (?<="page":")[^"]*

  This component does not manage navigation itself (no actual page change happens client-side) —
  clicking a tab only animates the indicator and fires the event above. Wiring the resulting
  Bubble workflow up to an actual page/state change (or leaving the SPA-style content below this
  header to swap based on it) is a Bubble-side decision, not something this component does for you.

  ── Filling the component ─────────────────────────────────────────────────────
  Nothing to fill — every attribute above is set once when the element is placed (Property
  Editor), not via a Run-JS "Render" step the way a table's rows are. If data-brand-name/
  data-brand-logo need to reflect the logged-in user's own team (not a fixed value), bind those
  two attributes directly in the Property Editor to whatever dynamic expression already resolves
  the current team's brand elsewhere in the app — no JS needed on your end for that either.
-->

<div class="up-root up-ph-root bph-root"
     data-instance="ROOTID_[dynamic id]"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-brand-name="BRAND_NAME"
     data-brand-logo="BRAND_LOGO_URL"
     data-nav-fn="bubble_fn_bphNav"
     data-add-fn="bubble_fn_bphAdd"
     data-refresh-fn="bubble_fn_bphRefresh">
  <div class="up-ph-top">
    <div class="up-ph-left">
      <div class="up-ph-meta">
        <img class="up-ph-metalogo" alt="" style="display:none"/>
        <span class="up-ph-metatxt"><span class="pph-metaname"></span> Database</span>
      </div>
      <h1 class="up-ph-heading">Brands</h1>
      <p class="up-ph-desc">Manage tracked brands, compare performance, and discover untracked competitors</p>
    </div>
    <div class="bph-topright">
      <button class="up-ph-addbtn up-export" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span>Add <span class="up-ph-addbtn-full">Brand</span></span>
      </button>
      <button class="bph-refreshbtn up-ph-iconbtn" type="button" aria-label="Refresh" data-tip="Refresh Data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      </button>
    </div>
  </div>

  <!-- UC.makePageNav (core.js) builds the two tab items + the sliding indicator into this on init. -->
  <div class="up-ph-nav" role="tablist"></div>
</div>
<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). Byte-for-byte the same loader every other component in this repo ships —
   see prompts_page_header_bubble.html's own copy for the full reasoning in comments. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      if (p && p !== "CDN_PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("bph-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("page-headers/brands-page-header.css");
  js("core.js"); js("page-headers/brands-page-header.js");
})();
</script>
