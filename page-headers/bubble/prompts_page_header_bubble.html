<!--
  UPSTREEM — PROMPTS PAGE HEADER

  Sits at the very top of the Prompts page: meta row, page heading + description, a 3-tab page
  nav (All Prompts / Responses / Topics) with an animated sliding active indicator, and an "Add
  Prompts" button top-right. First of a new component family (page-headers/) meant for the top of
  every page in the app -- one small dedicated component PER page, not a single generic component
  fed different config. All the actual visual styling and the sliding-tab nav interaction live in
  core.css/core.js's shared Page Header Kit (the ".up-ph-*" classes and UC.makePageNav) so every
  future page header gets them for free; this file only supplies the PAGES list, the heading/
  description text, and the two event names. Copying this file for the next page's header means
  duplicating this whole file and swapping those three things in the .js and the two text nodes in
  the markup below; nothing about the boot/mount/event plumbing or the kit underneath changes.

  Almost nothing here is dynamic. Unlike a table, this component has no server data to wait on: no
  render()/reset() functions, no loading state. It reads its two dynamic inputs straight off the
  root element's own attributes at mount and never touches them again.

  ── Bubble dynamic values on the root element ────────────────────────────────
  data-instance   = "ROOTID_[dynamic id]"   unique per placement
  data-cdn-pin    = commit hash to load from, e.g. "71ed61f" — leave EMPTY (or leave the literal
                    "CDN_PIN" placeholder) to load @main. Point this at a Bubble constant/Option
                    Set field you control so every placement can be repinned to a new commit in
                    one edit instead of hunting down every embed's URL by hand — @main itself lags
                    jsDelivr's cache, sometimes for hours, so a fresh fix may not actually be live
                    yet even right after it's pushed. The loader script at the bottom reads this
                    once and builds every asset URL from it.
  data-isdark     = "yes" / "no"
  data-brand-name = "Acme"                              plain text, no HTML
  data-brand-logo = "https://.../favicon.ico"            any image URL; left empty hides the <img>
                    entirely rather than showing a broken-image icon

  ── Event names must be unique per placement ─────────────────────────────────
  data-nav-fn     = "bubble_fn_pphNav_[dynamic id]"
  data-add-fn     = "bubble_fn_pphAdd_[dynamic id]"
  data-refresh-fn = "bubble_fn_pphRefresh_[dynamic id]"

  All three fire ONE JSON string, values pulled out on the Bubble side by regex — same convention
  as every other component in this library.

    nav     {"page":"allprompts"} -> fires on every tab click, AFTER the sliding indicator has
                                     already been told to animate to it. One of exactly three
                                     values: allprompts | mentions | topics. "mentions" is not a
                                     typo for the Responses tab — it's the same internal name the
                                     rest of the app already uses for that page.
    add     {}                    -> "Add Prompts" button. No fields at all — this component's
                                     whole job here is "tell Bubble the button was clicked", not to
                                     carry any data along with it.
    refresh {}                    -> the icon-only Refresh button, top right. Same "no fields,
                                     just tell Bubble it happened" shape as add — this component
                                     does not reload anything itself.

  Regex reference for a Bubble "extract" step:
    (?<="page":")[^"]*

  This component does not manage navigation itself (no actual page change happens client-side) —
  clicking a tab only animates the indicator and fires the event above. Wiring the resulting
  Bubble workflow up to an actual page/state change (or leaving the SPA-style content below this
  header to swap based on it) is a Bubble-side decision, not something this component does for you.

  ── Filling the component ─────────────────────────────────────────────────────
  Nothing to fill — every attribute above is set once when the element is placed (Property
  Editor), not via a Run-JS "Render" step the way a table's rows are. If data-brand-name/
  data-brand-logo need to reflect the logged-in user's own team (not a fixed value), bind those
  two attributes directly in the Property Editor to whatever dynamic expression already resolves
  the current team's brand elsewhere in the app — no JS needed on your end for that either.
-->

<div class="up-root up-ph-root pph-root"
     data-instance="ROOTID_[dynamic id]"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-brand-name="BRAND_NAME"
     data-brand-logo="BRAND_LOGO_URL"
     data-nav-fn="bubble_fn_pphNav"
     data-add-fn="bubble_fn_pphAdd"
     data-refresh-fn="bubble_fn_pphRefresh">
  <div class="up-ph-top">
    <div class="up-ph-left">
      <div class="up-ph-meta">
        <img class="up-ph-metalogo" alt="" style="display:none"/>
        <span class="up-ph-metatxt"><span class="pph-metaname"></span> Database</span>
      </div>
      <h1 class="up-ph-heading">Prompt Insights</h1>
      <p class="up-ph-desc">Manage Prompts, Topics and monitor latest Responses</p>
    </div>
    <div class="pph-topright">
      <button class="up-ph-addbtn up-export" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /> <path d="M12 5v14" /></svg>
        <span>Add <span class="up-ph-addbtn-full">Prompts</span></span>
      </button>
      <button class="pph-refreshbtn up-ph-iconbtn" type="button" aria-label="Refresh" data-tip="Refresh Data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></svg>
      </button>
    </div>
  </div>

  <!-- UC.makePageNav (core.js) builds the three tab items + the sliding indicator into this on init. -->
  <div class="up-ph-nav" role="tablist"></div>
</div>
<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin on
   the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder). The pin is found by looking the root element up BY CLASS — deliberately
   NOT via document.currentScript, because Bubble injects an HTML element's inline scripts in a way
   that leaves document.currentScript null/misattached. Each asset url is fetched and evaluated at most
   ONCE per page — see the dedupe guard below for why that matters. */
(function(){
  function readPin(cls){
    var els = document.getElementsByClassName(cls), i, p;
    for (i = 0; i < els.length; i++){
      p = (els[i].getAttribute("data-cdn-pin") || "").trim();
      /* Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
         Waechter treffen -- der Vergleich waere dann pin === "<der Hash>" und der Loader liefe
         dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
      if (p && p !== "CDN_" + "PIN") return p;
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("pph-root") + "/";
  /* Bubble re-injects this whole block (this script tag included) every time the reusable this
     component sits in re-renders — i.e. on every drawer/view open. Without this guard each of
     those re-runs appended ANOTHER <link> + <script> for the SAME urls, forever. The registry
     lives on window, not in this closure, because every component ships its own copy of this
     loader. Skipping the re-run is safe: a re-rendered root is picked up and initialised by
     core.js's own root observer + 1.5s heartbeat, it does not need the scripts evaluated again. */
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("page-headers/prompts-page-header.css");
  js("core.js"); js("page-headers/prompts-page-header.js");
  /* The Add button opens the Add-Prompts dialog, so this header brings it along. Loading it from
     here rather than from an element of its own is the difference between "the button works" and
     "the button works once you also place a second HTML element on the page" -- and a button that
     silently falls back to the old event because someone forgot that element is exactly the kind
     of half-wired state that costs a debugging round. */
  css("add-prompts.css"); js("add-prompts.js");
})();
</script>
