<script>
/* Zaehlwerk VOR core: was wird angelegt, was wieder abgeraeumt? */
window.__z = { iv: 0, ivWeg: 0, ro: 0, roWeg: 0, mo: 0, moWeg: 0, raf: 0 };
var sI = window.setInterval, cI = window.clearInterval;
window.setInterval = function(f, t){ window.__z.iv++; return sI.apply(window, arguments); };
window.clearInterval = function(id){ window.__z.ivWeg++; return cI.apply(window, arguments); };
var RO = window.ResizeObserver;
if (RO){
  window.ResizeObserver = function(cb){
    window.__z.ro++;
    var o = new RO(cb), d = o.disconnect.bind(o);
    o.disconnect = function(){ window.__z.roWeg++; return d(); };
    return o;
  };
}
var MO = window.MutationObserver;
window.MutationObserver = function(cb){
  window.__z.mo++;
  var o = new MO(cb), d = o.disconnect.bind(o);
  o.disconnect = function(){ window.__z.moWeg++; return d(); };
  return o;
};
var rAF = window.requestAnimationFrame;
window.requestAnimationFrame = function(f){ window.__z.raf++; return rAF.call(window, f); };
</script>

<script>
var daten = { rows: [], companies: [{company_id:"1",name:"Alpha"},{company_id:"2",name:"Beta"}] };
(function(){
  var heute = new Date("2026-08-01T00:00:00Z");
  for (var i = 0; i < 30; i++){
    var d = new Date(heute.getTime() + i * 86400000).toISOString().slice(0,10);
    daten.rows.push({ date: d, company_id: "1", visibility_pct: 20 + (i % 7) * 3 });
    daten.rows.push({ date: d, company_id: "2", visibility_pct: 35 + (i % 5) * 2 });
  }
})();

function mounten(){
  document.getElementById("buehne").innerHTML = MARKUP;
  if (window.UpstreemCore && window.UpstreemCore.initAll) window.UpstreemCore.initAll();
}
function wechseln(n, fertig){
  var i = 0;
  (function schritt(){
    if (i++ >= n){ fertig(); return; }
    mounten();
    setTimeout(function(){
      if (window.renderVisibilityChart) try { window.renderVisibilityChart(daten); } catch(e){}
      setTimeout(function(){ document.getElementById("buehne").innerHTML = ""; setTimeout(schritt, 120); }, 420);
    }, 120);
  })();
}
var NURSTEHEN = /stehen=1/.test(location.search);
setTimeout(function(){
  var z0 = JSON.parse(JSON.stringify(window.__z));
  if (NURSTEHEN){
    mounten();
    setTimeout(function(){ if (window.renderVisibilityChart) try { window.renderVisibilityChart(daten); } catch(e){} }, 200);
    setTimeout(function(){
      var z = window.__z;
      document.getElementById("out").textContent = JSON.stringify({
        fall: "Komponente bleibt stehen, 13s Aufraeumer gelaufen",
        groessenAngelegt: z.ro, groessenAbgeraeumt: z.roWeg,
        dokumentAngelegt: z.mo, dokumentAbgeraeumt: z.moWeg,
        wurzelNochDa: !!document.querySelector(".vot-root"),
        chartCanvasDa: !!document.querySelector(".vot-root canvas")
      }, null, 1);
    }, 13000);
    return;
  }
  wechseln(5, function(){
    setTimeout(function(){
      var z = window.__z;
      var charts = 0;
      try { charts = window.Chart ? Object.keys(window.Chart.instances || {}).length : -1; } catch(e){ charts = -2; }
      var vor = z.raf;
      setTimeout(function(){
        var offenSofort = { ro: z.ro - z.roWeg, mo: z.mo - z.moWeg };
        setTimeout(function(){
        document.getElementById("out").textContent = JSON.stringify({
          direktNachDenWechseln: offenSofort,
          nachFuenfWechseln: {
            uhrenOffen: z.iv - z.ivWeg,
            groessenBeobachterOffen: z.ro - z.roWeg,
            dokumentBeobachterOffen: z.mo - z.moWeg,
            chartsLebend: charts,
            watcherInCore: (window.__upRootWatch ? window.__upRootWatch.watchers.length : -1)
          },
          rafAufrufeInZweiRuhigenSekunden: z.raf - vor,
          angelegtInsgesamt: { uhren: z.iv, groessen: z.ro, dokument: z.mo },
          nachDemAufraeumer: { groessenOffen: z.ro - z.roWeg, dokumentOffen: z.mo - z.moWeg }
        }, null, 1);
        }, 12000);
      }, 2000);
    }, 600);
  });
}, 700);
</script>
