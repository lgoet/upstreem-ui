<meta charset="utf-8"><title>pin purge</title>
<body style="font:12px ui-monospace,monospace;padding:16px">
<pre id="out">laeuft...</pre>
<script>
/* Alle Dateien am Pin purgen und danach pruefen. Der Fehlschlag haengt pro Datei im Cache --
   die Sammel-API nimmt Pfade als POST-Liste, das sind statt 76 Anfragen vier. */
var PIN = (new URLSearchParams(location.search)).get("pin") || "main";
var FILES = ["add-brand.css", "add-brand.js", "add-prompts.css", "add-prompts.js", "ask-mira.css", "ask-mira.js", "auth-page.css", "auth-page.js", "brand-detail.css", "brand-detail.js", "brands-overview.css", "brands-overview.js", "bubble/diagnostics/_diagnose_chart_console.js", "bubble/diagnostics/_diagnose_drawer_console.js", "bubble/diagnostics/_diagnose_rpc_to_render.js", "bubble/diagnostics/_diagnose_view_console.js", "citations-combo-chart.css", "citations-combo-chart.js", "core.css", "core.js", "create-with-ai.css", "create-with-ai.js", "discover-brands.css", "discover-brands.js", "domains-table.css", "domains-table.js", "export-data.css", "export-data.js", "filters/date-range.css", "filters/date-range.js", "filters/markets-filter.css", "filters/markets-filter.js", "filters/models-filter.css", "filters/models-filter.js", "filters/topics-filter.css", "filters/topics-filter.js", "notification-card.css", "notification-card.js", "opportunities.css", "opportunities.js", "page-headers/brands-page-header.css", "page-headers/brands-page-header.js", "page-headers/citations-page-header.css", "page-headers/citations-page-header.js", "page-headers/dashboard-page-header.css", "page-headers/dashboard-page-header.js", "page-headers/opportunities-page-header.js", "page-headers/performance-page-header.js", "page-headers/prompts-page-header.css", "page-headers/prompts-page-header.js", "page-headers/settings-page-header.css", "page-headers/settings-page-header.js", "performance-detail.css", "performance-detail.js", "performance-radar.css", "performance-radar.js", "prompt-research.css", "prompt-research.js", "prompts-table.css", "prompts-table.js", "quick-actions.css", "quick-actions.js", "responses-table.css", "responses-table.js", "settings-brand.css", "settings-brand.js", "sidebar.css", "sidebar.js", "topcitations-dashboard.css", "topcitations-dashboard.js", "topics-manager.css", "topics-manager.js", "urls-table.css", "urls-table.js", "visibility-chart.css", "visibility-chart.js"];
var out = document.getElementById("out");
function bloecke(a, n){ var r=[]; for (var i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; }
var GRUPPEN = bloecke(FILES.map(function(f){ return "/gh/lgoet/upstreem-ui@" + PIN + "/" + f; }), 20);
var log = [];
function purge(i){
  if (i >= GRUPPEN.length){ out.textContent = log.join("\n") + "\n\nPURGE DURCH -- jetzt pruefen"; window.__purgeFertig = true; pruefe(0); return; }
  fetch("https://purge.jsdelivr.net/", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: GRUPPEN[i] }) })
    .then(function(r){ return r.text(); })
    .then(function(t){ log.push("Gruppe " + (i+1) + "/" + GRUPPEN.length + ": " + t.slice(0,80)); out.textContent = log.join("\n"); purge(i+1); })
    .catch(function(e){ log.push("Gruppe " + (i+1) + " FEHLER: " + e); out.textContent = log.join("\n"); purge(i+1); });
}
var kaputt = [], ok = 0;
function pruefe(i){
  if (i >= FILES.length){
    window.__kaputt = kaputt;
    out.textContent = log.join("\n") + "\n\ngeprueft " + FILES.length + ", ok " + ok +
      ", KAPUTT " + kaputt.length + "\n" + kaputt.join("\n");
    return;
  }
  /* Parallel in Zehnerpaketen, sonst dauert es Minuten. */
  var paket = FILES.slice(i, i+10);
  Promise.all(paket.map(function(f){
    return fetch("https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + PIN + "/" + f, { cache: "no-store" })
      .then(function(r){ return r.text(); })
      .then(function(t){ if (t.length < 200 && /Failed to fetch|not found/i.test(t)) kaputt.push(f); else ok++; })
      .catch(function(e){ kaputt.push(f + " (fetch " + e + ")"); });
  })).then(function(){ out.textContent = log.join("\n") + "\n\ngeprueft " + Math.min(i+10, FILES.length) + "/" + FILES.length + ", kaputt " + kaputt.length; pruefe(i+10); });
}
purge(0);
</script>
