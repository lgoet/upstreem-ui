<meta charset="utf-8"><title>pin purge</title>
<body style="font:12px ui-monospace,monospace;padding:16px">
<pre id="out">laeuft...</pre>
<script>
/* Alle Dateien am Pin purgen und danach pruefen. Der Fehlschlag haengt pro Datei im Cache --
   die Sammel-API nimmt Pfade als POST-Liste, zwanzig je Anfrage.
   Die Liste ist FEST (dieselbe wie in _h_pin_check2.html) und muss mit jeder neuen ausgelieferten
   Datei wachsen -- bis zum 25.09. fehlten 39, darunter die neue invite-page. */
var PIN = (new URLSearchParams(location.search)).get("pin") || "main";
var FILES = ["access-gate.css", "access-gate.js", "add-brand.css", "add-brand.js", "add-prompts.css", "add-prompts.js", "ask-mira.css", "ask-mira.js", "auth-page.css", "auth-page.js", "brand-detail.css", "brand-detail.js", "brand-editor.css", "brand-editor.js", "brands-overview.css", "brands-overview.js", "bubble/diagnostics/_check_console.js", "bubble/diagnostics/_diagnose_kalender.js", "bubble/diagnostics/_diagnose_backtick.js", "bubble/diagnostics/_diagnose_chart_console.js", "bubble/diagnostics/_diagnose_core_doppelt.js", "bubble/diagnostics/_diagnose_dashboard_modus.js", "bubble/diagnostics/_diagnose_drawer_console.js", "bubble/diagnostics/_diagnose_flimmern.js", "bubble/diagnostics/_diagnose_lazy_potenzial.js", "bubble/diagnostics/_diagnose_nachkontrolle.js", "bubble/diagnostics/_diagnose_parkleser.js", "bubble/diagnostics/_diagnose_rpc_to_render.js", "bubble/diagnostics/_diagnose_upw_aufrufe.js", "bubble/diagnostics/_diagnose_view_console.js", "citations-combo-chart.css", "citations-combo-chart.js", "core.css", "core.js", "create-with-ai.css", "create-with-ai.js", "discover-brands.css", "discover-brands.js", "domain-detail.css", "domain-detail.js", "domains-table.css", "domains-table.js", "drawer-topbar.css", "drawer-topbar.js", "events.css", "events.js", "export-data.css", "export-data.js", "filters/date-range.css", "filters/date-range.js", "filters/filter-bar.css", "filters/filter-bar.js", "filters/markets-filter.css", "filters/markets-filter.js", "filters/models-filter.css", "filters/models-filter.js", "filters/topics-filter.css", "filters/topics-filter.js", "invite-page.css", "invite-page.js", "landing-boot.js", "landing-hero.css", "landing-hero.js", "notification-card.css", "notification-card.js", "onboarding-page.css", "onboarding-page.js", "opportunities.css", "opportunities.js", "page-headers/brands-page-header.css", "page-headers/brands-page-header.js", "page-headers/citations-page-header.css", "page-headers/citations-page-header.js", "page-headers/dashboard-page-header.css", "page-headers/dashboard-page-header.js", "page-headers/opportunities-page-header.js", "page-headers/performance-page-header.js", "page-headers/prompts-page-header.css", "page-headers/prompts-page-header.js", "page-headers/settings-page-header.css", "page-headers/settings-page-header.js", "performance-detail.css", "performance-detail.js", "performance-radar.css", "performance-radar.js", "power-dashboard.css", "power-dashboard.js", "preferences.css", "preferences.js", "prompt-research.css", "prompt-research.js", "prompts-table.css", "prompts-table.js", "quick-actions.css", "quick-actions.js", "response-detail.css", "response-detail.js", "responses-table.css", "responses-table.js", "settings-billing.css", "settings-billing.js", "settings-brand.css", "settings-brand.js", "sidebar.css", "sidebar.js", "skeleton.css", "skeleton.js", "team-orga.css", "team-orga.js", "teams.css", "teams.js", "topcitations-dashboard.css", "topcitations-dashboard.js", "topics-manager.css", "topics-manager.js", "url-detail.css", "url-detail.js", "urls-table.css", "urls-table.js", "vendor-coloris.min.css", "vendor-coloris.min.js", "view-switch.css", "view-switch.js", "visibility-chart.css", "visibility-chart.js"];
/* AUCH DIE .min-FASSUNGEN (01.10.): das Vorlade-Snippet laedt jede Datei zuerst als .min.js/.min.css
   (jsDelivr minifiziert auf Anfrage) und faellt nur bei einem NETZFEHLER auf die rohe zurueck.
   Ein zwischengespeicherter Fehltext mit Status 200 ("429: Too Many Requests") wird also ausgefuehrt
   -- so war der Models-Filter tot, waehrend diese Seite "0 kaputt" meldete: sie kannte die .min
   gar nicht. */
FILES = FILES.concat(FILES.filter(function(f){ return !/\.min\.(js|css)$/.test(f) && f.indexOf("bubble/") !== 0; })
                         .map(function(f){ return f.replace(/\.(js|css)$/, ".min.$1"); }));
var out = document.getElementById("out");
function bloecke(a, n){ var r=[]; for (var i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; }
var GRUPPEN = bloecke(FILES.map(function(f){ return "/gh/lgoet/upstreem-ui@" + PIN + "/" + f; }), 20);
var log = [];
function purge(i){
  if (i >= GRUPPEN.length){ out.textContent = log.join("\n") + "\n\nPURGE DURCH -- jetzt pruefen"; window.__purgeFertig = true; pruefe(0); return; }
  fetch("https://purge.jsdelivr.net/", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: GRUPPEN[i] }) })
    .then(function(r){ return r.text(); })
    .then(function(t){ log.push("Gruppe " + (i+1) + "/" + GRUPPEN.length + ": " + t.slice(0,80)); out.textContent = log.join("\n"); purge(i+1); })
    .catch(function(e){ log.push("Gruppe " + (i+1) + " FEHLER: " + e); out.textContent = log.join("\n"); purge(i+1); });
}
var kaputt = [], ok = 0;
function pruefe(i){
  if (i >= FILES.length){
    window.__kaputt = kaputt;
    out.textContent = log.join("\n") + "\n\ngeprueft " + FILES.length + ", ok " + ok +
      ", KAPUTT " + kaputt.length + "\n" + kaputt.join("\n");
    return;
  }
  /* Parallel in Zehnerpaketen, sonst dauert es Minuten. */
  var paket = FILES.slice(i, i+10);
  Promise.all(paket.map(function(f){
    return fetch("https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + PIN + "/" + f, { cache: "no-store" })
      .then(function(r){ return r.text(); })
      .then(function(t){ if (t.length < 400 && /Failed to fetch|not found|Couldn't find|Too Many Requests|\b429\b/i.test(t)) kaputt.push(f); else ok++; })
      .catch(function(e){ kaputt.push(f + " (fetch " + e + ")"); });
  })).then(function(){ out.textContent = log.join("\n") + "\n\ngeprueft " + Math.min(i+10, FILES.length) + "/" + FILES.length + ", kaputt " + kaputt.length; pruefe(i+10); });
}
purge(0);
</script>
