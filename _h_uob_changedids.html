<meta charset="utf-8"><title>onboarding: changed_ids bei ueberschneidenden Themen</title>
<style>html,body{margin:0;font:13px/1.5 Geist,system-ui,sans-serif}#b{padding:16px;width:1100px}
#out{padding:10px;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap}</style>
<body><div id="b"></div><pre id="out">laeuft…</pre>
<script>
/* DER GEMELDETE FALL (25.08.): ein Prompt kann mehrere Themen tragen. Steht er unter "Partyreihe",
   weil das sein primary_topic_id ist, traegt aber auch "Hardtekk", dann trifft ein serverseitiges
   "alle Prompts mit Topic Hardtekk" ihn MIT -- obwohl er unter einer anderen Ueberschrift steht
   und der Nutzer ihn nicht angefasst hat.

   Der Datensatz macht das unmissverstaendlich: 4 Prompts mit primary=Partyreihe, die Hardtekk
   ZUSAETZLICH tragen, plus 3 mit primary=Hardtekk. Ein naives "alle mit Topic Hardtekk" traefe 7.
   Die Gruppe Hardtekk zeigt 3.

   Geprueft wird, dass changed_ids GENAU die 3 traegt -- und die Gegenprobe rechnet daneben aus,
   was die naive Aufloesung getroffen haette. Ohne diese Gegenzahl wuerde "3 Ids" nichts belegen. */
window.__err=[]; window.addEventListener("error",function(e){window.__err.push(String(e.message));});
window.__ereignisse=[];
["uobStart","uobStep","uobTopics","uobWorkflowStart","uobFinish","uobExit"].forEach(function(n){ window["bubble_fn_"+n]=function(){}; });
window.bubble_fn_uobSelect=function(v){ window.__ereignisse.push(v); };
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function wurzelAus(h){ return h.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim(); }
var D=["core.css","core.js","onboarding-page.css","onboarding-page.js",
       "bubble/onboarding_page_bubble.html","_h_uob_overlap.json"];
var T={};
Promise.all(D.map(hol)).then(function(t){
  D.forEach(function(f,i){ T[f]=t[i]; });
  ["core.css","onboarding-page.css"].forEach(function(f){ var s=document.createElement("style"); s.textContent=T[f]; document.head.appendChild(s); });
  var s2=document.createElement("style"); s2.textContent="*,*::before,*::after{transition:none!important;animation:none!important}"; document.head.appendChild(s2);
  var w=document.createElement("div"); w.innerHTML=wurzelAus(T["bubble/onboarding_page_bubble.html"]);
  var r=w.querySelector(".uob-root");
  r.setAttribute("data-instance","ci"); r.setAttribute("data-cdn-pin","x"); r.setAttribute("data-isdark","no");
  r.setAttribute("data-select-fn","bubble_fn_uobSelect");
  document.getElementById("b").appendChild(r);
  var j=document.createElement("script"); j.textContent=T["core.js"]; document.head.appendChild(j);
  var j2=document.createElement("script"); j2.textContent=T["onboarding-page.js"]; document.head.appendChild(j2);
  return new Promise(function(ok){ setTimeout(ok,1200); });
}).then(function(){
  var E=JSON.parse(T["_h_uob_overlap.json"]);
  var HT=E.topics[1].id, PR=E.topics[0].id;
  window.setOnboardingBundle("ci", JSON.stringify(E));
  return new Promise(function(ok){ setTimeout(ok,600); }).then(function(){
    var r=document.querySelector(".uob-root");
    var R={};
    /* Die Vergleichszahl: was haette "alle Prompts mit Topic Hardtekk" getroffen? */
    R.naiveAufloesung = { topic:"Hardtekk",
      traefe: E.prompts.filter(function(p){ return (p.topics||[]).some(function(t){ return t.id===HT; }); })
                       .map(function(p){ return p.id; }) };
    /* Was die Gruppe Hardtekk zeigt. */
    var knopf = r.querySelector('[data-all="'+HT+'"]');
    R.gruppenknopfDa = !!knopf;
    window.__ereignisse.length=0;
    if (knopf) knopf.click();
    return new Promise(function(ok2){ setTimeout(function(){
      R.klick1 = window.__ereignisse.slice();
      window.__ereignisse.length=0;
      if (knopf) knopf.click();
      setTimeout(function(){
        R.klick2 = window.__ereignisse.slice();
        /* Und ein Einzelklick, zum Vergleich der Form. */
        window.__ereignisse.length=0;
        var eine = r.querySelector('[data-pick="prompts"][data-id="pr0"]');
        if (eine) eine.click();
        setTimeout(function(){
          R.einzelklick = window.__ereignisse.slice();
          /* Auswertung */
          function feld(js, n){ try { return JSON.parse(js)[n]; } catch(e){ return null; } }
          var ci1 = (feld(R.klick1[0]||"{}","changed_ids")||"").split(",").filter(Boolean);
          R.auswertung = {
            changed_ids_beimGruppenklick: ci1,
            anzahl: ci1.length,
            naive_anzahl: R.naiveAufloesung.traefe.length,
            /* Der Beweis: changed_ids enthaelt KEINEN Prompt, dessen primary Partyreihe ist. */
            keineFremden: ci1.every(function(id){
              var p=E.prompts.filter(function(x){return x.id===id;})[0];
              return p && p.primary_topic_id===HT; }),
            richtung_klick1: feld(R.klick1[0]||"{}","on"),
            richtung_klick2: feld(R.klick2[0]||"{}","on"),
            changed_ids_klick2: (feld(R.klick2[0]||"{}","changed_ids")||"").split(",").filter(Boolean),
            einzelklick_changed_ids: feld(R.einzelklick[0]||"{}","changed_ids"),
            einzelklick_on: feld(R.einzelklick[0]||"{}","on")
          };
          R.fehler=window.__err.slice(0,4);
          document.getElementById("out").textContent=JSON.stringify(R,null,1);
          window.__R=R; window.__fertig=true; ok2();
        }, 250);
      }, 250);
    }, 250); });
  });
}).catch(function(e){ document.getElementById("out").textContent="FEHLER: "+e.message+"\n"+e.stack; window.__fertig=true; });
</script>
