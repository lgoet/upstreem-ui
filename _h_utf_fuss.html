<!doctype html><meta charset="utf-8">
<title>Topics-Dropdown: Fusszeile ohne Flaechen, Umschalter ganz auf Deutsch</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne" style="position:absolute;left:-4000px;top:0"></div>
<script>
/* Zwei Meldungen vom 07.09.:
     "der Switcher Or/And ist nur halb auf Deutsch"  -- im Katalog stand "And", "Or" fehlte.
     "die Buttons in der Bottom Bar sollen alle keinen Background haben" -- sie trugen --vc-bg,
     also die Farbe einer KARTE, obwohl sie in einem MENUE stehen (im Dunkeln #1c1c1f in #232326,
     der Knopf war dort ein dunklerer Kasten).
   Geprueft wird beides an der geladenen Datei, nicht am Gedaechtnis. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok,ms); }); }

Promise.all([hol("core.css"), hol("core.js"), hol("filters/topics-filter.css")]).then(function(t){
  var f=document.createElement("iframe");
  f.style.cssText="width:600px;height:400px;border:0";
  document.getElementById("buehne").appendChild(f);
  var d=f.contentDocument, v=f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  try { v.localStorage.setItem("pref_locale","de"); } catch(e){}
  [t[0], t[2]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var sc=d.createElement("script"); sc.textContent=t[1]; d.head.appendChild(sc);
  return warte(600).then(function(){
    var UC=v.UpstreemCore;
    log("1  Der Umschalter im Fuss");
    if (!UC){ log("   ABBRUCH: kein UC"); return; }
    if (UC.setPref) UC.setPref("locale","de");
    [["Or","Oder"],["And","Und"]].forEach(function(p){
      var raus=UC.t(p[0]);
      log("   " + ja(raus === p[1]) + " " + p[0] + " -> \"" + raus + "\"" +
          (raus === p[1] ? "" : "   erwartet: \"" + p[1] + "\""));
    });
    log("");
    log("2  Die Knoepfe im Fuss, in beiden Themen");
    var ok=true;
    ["light","dark"].forEach(function(thema){
      /* Der Fuss liegt in einem MENUE. Also wird hier auch ein Menue gebaut -- ein Knopf auf
         einer Karte zu messen waere der falsche Untergrund. */
      var root=d.createElement("div");
      root.className="up-root up-portal"; root.setAttribute("data-theme",thema);
      root.innerHTML='<div class="utf-menu"><div class="utf-foot">' +
        '<span class="up-seg" role="group" aria-label="Match mode">' +
          '<button class="up-seg-btn" type="button">Oder</button>' +
          '<button class="up-seg-btn is-active" type="button">Und</button>' +
        '</span>' +
        '<span class="utf-foot-right">' +
          '<button class="utf-grpbtn" type="button"></button>' +
          '<button class="utf-new" type="button"><span>Neues Topic</span></button>' +
        '</span></div></div>';
      d.body.appendChild(root);
      function bg(sel){ var e=root.querySelector(sel); return e ? v.getComputedStyle(e).backgroundColor : null; }
      function durchsichtig(c){ return c === "rgba(0, 0, 0, 0)" || c === "transparent"; }
      var g=bg(".utf-grpbtn"), n=bg(".utf-new");
      var menue=v.getComputedStyle(root).getPropertyValue("--up-menu-bg").trim();
      var gut = durchsichtig(g) && durchsichtig(n);
      if (!gut) ok=false;
      log("   " + thema.padEnd(6," ") + " Menuegrund " + menue +
          "   .utf-grpbtn " + g + "   .utf-new " + n);
      log("      " + ja(gut) + " beide ohne eigene Flaeche");
      /* Der Rahmen muss dafuer da sein -- er ist jetzt das Einzige, was den Knopf ausweist. */
      var rg=v.getComputedStyle(root.querySelector(".utf-grpbtn")).borderTopWidth;
      log("      " + ja(parseFloat(rg) >= 1) + " der Rahmen traegt sie stattdessen (" + rg + ")");
      root.remove();
    });
    log("");
    log("==> " + ja(ok) + "  kein Knopf im Fuss malt mehr eine Flaeche");
    log("FERTIG");
  });
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"")); });
</script>
