<meta charset="utf-8"><title>core: readBubble</title><pre id="out">laeuft</pre>
<script>
fetch("core.js?n=" + Math.random(), { cache: "no-store" }).then(function (r) { return r.text(); })
  .then(function (t) {
    var e = document.createElement("script"); e.textContent = t; document.head.appendChild(e);
    var UC = window.UpstreemCore;
    function z(v){ return Array.isArray(v) ? "array:" + v.length : v === null ? "null" : typeof v; }
    var f = {
      "Objekt direkt":      UC.readBubble([{a:1}]),
      "normale Liste":      UC.readBubble('[{"id":"a"},{"id":"b"}]'),
      "leere Liste":        UC.readBubble('[]'),
      "leerer Text":        UC.readBubble(''),
      "Muell":              UC.readBubble('das ist kein json'),
      "unescaptes Zitat":   UC.readBubble('[{"n":"Paro "Fest""}]'),
      "abgeschnitten":      UC.readBubble('[{"n":"Lang\\"}]'),
      "doppelt verpackt":   UC.readBubble(JSON.stringify('[{"id":"x"}]')),
      "nacktes yes":        UC.readBubble('[{"id":"a","sel": yes}]'),
      "einzelnes Objekt":   UC.readBubble('{"id":"a"}')
    };
    var out = {}; Object.keys(f).forEach(function (k) { out[k] = z(f[k]); });
    document.getElementById("out").textContent = JSON.stringify(out, null, 1);
    window.__ok = out;
  });
</script>
