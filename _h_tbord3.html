<meta charset="utf-8">
<title>toolbar order harness</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#fff; }
  .probe { border-bottom:1px solid #eee; padding:8px 12px; }
  .probe::before { content:attr(data-komp); font:11px ui-monospace,monospace; color:#888; display:block; margin-bottom:4px; }
  pre { font:11px/1.5 ui-monospace,monospace; background:#f6f6f6; padding:10px; white-space:pre-wrap; }
</style>
<body>
<pre id="out">laedt</pre>
<div class="up-root" data-instance="t1" data-isdark="no" id="host">
<div class="probe" data-komp="responses_table#0"><div class="up-head-tools">
      <button class="urt-brand-toggle" type="button" data-tip="Filter for your brand mentions">
        <span class="urt-brand-toggle-lbl">
          <img class="urt-brand-logo" src="" style="display:none" alt=""/>
          <span class="urt-brand-label"></span>
        </span>
        <span class="urt-brand-check">
          <svg class="urt-brand-check-yes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
          <svg class="urt-brand-check-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /></svg>
        </span>
      </button>

      <div class="up-ment">
        <button class="up-ment-btn" type="button" data-tip="Filter for brand mentions" aria-haspopup="menu" aria-expanded="false">

        <div class="up-ment-menu" role="menu" aria-hidden="true"></div>
      </div>

      <!-- feather "sliders" — the SAME filter glyph visibility-chart / topcitations / combo-chart
           use. .up-iconbtn makes it behave like every other toolbar icon button. -->
      <div class="urt-fader">
        <button class="urt-fader-btn up-iconbtn" type="button" data-tip="Filter by rank &amp; sentiment" aria-label="Filter by rank and sentiment" aria-haspopup="menu" aria-expanded="false">

      </div>

      <div class="up-sort">
        <button class="up-sort-btn up-iconbtn" type="button" data-tip="Sort" aria-label="Sort">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>

        <div class="up-sort-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="up-search">
        <button class="up-search-btn up-iconbtn" type="button" data-tip="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg>

        <div class="up-search-box">
          <input class="up-search-input" type="text" placeholder="Search prompts..." autocomplete="off" spellcheck="false" aria-label="Search responses"/>

          </button>
        </div>
      </div>

      <div class="up-cols">
        <button class="up-cols-btn up-iconbtn" type="button" data-tip="Table Settings" aria-label="Table settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <span class="urt-cols-badge"></span>
        <div class="up-cols-menu" role="menu" aria-hidden="true"></div>
      </div>

      <!-- .up-dense / .up-dense-btn are core's segmented control — the same one the Row Height
           picker uses. Reused verbatim so this switcher IS the app's switcher, not a lookalike.
           .urt-viewswitch only overrides the width (core's is full-width for the popover). -->
      <div class="up-dense urt-viewswitch" role="group" aria-label="View">
        <button class="up-dense-btn up-dense-btn-icon is-active" type="button" data-view="table" data-tip="Table view" aria-label="Table view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
        </button>
        <button class="up-dense-btn up-dense-btn-icon" type="button" data-view="cards" data-tip="Card view" aria-label="Card view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        </button>
      </div>

      <button class="up-export" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></svg>
        <span>Export</span>
      </button>
    </div></div>
<div class="probe" data-komp="opportunities#0"><div class="up-head-tools">

      <div class="uo-popwrap">
        <button class="uo-settings-btn up-iconbtn" type="button" data-tip="Board settings" aria-label="Board settings" aria-haspopup="menu" aria-expanded="false">

        </button>

          <div class="up-pop-row" data-board="pending"><span class="up-pop-label"><span class="uo-col-dot" style="background:#9ca3af;"></span>Pending</span><span class="up-switch is-on" role="switch"></span></div>
