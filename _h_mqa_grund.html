<!doctype html><meta charset="utf-8">
<title>Quick Actions gegen ein Dropdown: dieselben Flaechen im Dunkeln?</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne" style="position:absolute;left:-4000px;top:0"></div>
<script>
/* Gemeldet am 07.09.: "mach den Quick-Actions-Background so wie die Dropdown-Backgrounds, im
   Darkmode -- also den Background vom Popup."
   quick-actions.css hat mit Absicht ihre eigenen --am-Namen: das Element ist ein Singleton der
   Seite und laeuft auch ohne core.css. Es kann also nicht var(--up-menu-bg) lesen -- die Werte
   muessen doppelt stehen und damit auch doppelt gepruegt werden. Genau das tut dieser Prueftand:
   er liest die Flaechen des Panels UND die Tokens von core und vergleicht sie. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }

Promise.all([hol("core.css"), hol("quick-actions.css")]).then(function(t){
  var f=document.createElement("iframe");
  f.style.cssText="width:900px;height:500px;border:0";
  document.getElementById("buehne").appendChild(f);
  var d=f.contentDocument, v=f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  t.forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });

  /* Die Tokens von core -- an einer .up-root, so wie jede Komponente sie sieht. */
  var kern=d.createElement("div"); kern.className="up-root"; kern.setAttribute("data-theme","dark");
  d.body.appendChild(kern);
  var kc=v.getComputedStyle(kern);
  function tok(n){ return kc.getPropertyValue(n).trim(); }

  /* Und die Quick Actions in ihrer eigenen Huelle. */
  var qa=d.createElement("div"); qa.className="mqa-overlay"; qa.setAttribute("data-theme","dark");
  qa.innerHTML = '<div class="mqa-modal">' +
      '<div class="mqa-row">Zeile</div>' +
      '<div class="mqa-row is-active">aktive Zeile</div>' +
      '<span class="mqa-kbd">K</span>' +
    '</div>';
  d.body.appendChild(qa);

  function rgb(wert){
    var p=d.createElement("div"); p.style.background=wert; d.body.appendChild(p);
    var c=v.getComputedStyle(p).backgroundColor; p.remove(); return c;
  }
  function flaeche(sel){
    var e=qa.querySelector(sel); return e ? v.getComputedStyle(e).backgroundColor : null;
  }

  var PAARE = [
    ["Grund des Panels",   ".mqa-modal",        "--up-menu-bg"],
    ["aktive Zeile",       ".mqa-row.is-active","--up-sel-bg"]
  ];
  log("Quick Actions gegen die Tokens von core, dunkel");
  log("");
  var gut = true;
  PAARE.forEach(function(p){
    var ist=flaeche(p[1]), soll=rgb(tok(p[2]));
    var ok = ist === soll;
    if (!ok) gut = false;
    log("   " + ja(ok) + " " + p[0].padEnd(18," ") + " " + String(ist).padEnd(22," ") +
        " gegen " + p[2] + " " + soll);
  });
  /* Der Rahmen des Panels: derselbe Wert wie an jedem anderen schwebenden Kasten. */
  var rand=v.getComputedStyle(qa.querySelector(".mqa-modal")).borderTopColor;
  var sollRand=rgb(tok("--up-menu-border"));
  if (rand !== sollRand) gut = false;
  log("   " + ja(rand === sollRand) + " Rahmen des Panels    " + rand.padEnd(22," ") +
      " gegen --up-menu-border " + sollRand);
  /* Und das Tastenkuerzel im Panel: halbdurchsichtig, also MUSS es sich vom Panel abheben,
     ohne einen festen Wert zu tragen. */
  var kbd=flaeche(".mqa-kbd");
  log("   Tastenkuerzel im Panel: " + kbd + " (halbdurchsichtig, rechnet sich auf seinem Grund aus)");
  log("   " + ja(/rgba|color\(/.test(String(kbd))) + " es traegt keinen festen Wert");
  log("");
  log("==> " + ja(gut) + "  die drei Flaechen des Panels sind die der Dropdowns");

  /* Gegenprobe: im HELLEN ist nichts angefasst worden. */
  qa.setAttribute("data-theme","light");
  var hellPanel=flaeche(".mqa-modal");
  log("   im Hellen: Panel " + hellPanel + " " +
      ja(hellPanel === "rgb(255, 255, 255)") + " unveraendert weiss");
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"")); });
</script>
