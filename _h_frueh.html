<!doctype html>
<meta charset="utf-8">
<title>Auffangnetz: Zustandsobjekte bleiben unangetastet</title>
<link rel="stylesheet" href="core.css">
<div class="up-root" id="wurzel" data-isdark="no"></div>
<pre id="out" style="background:#111;color:#eee;padding:10px;white-space:pre-wrap">…</pre>
<script>
var UP_API = ["setUpstreemTheme","askMiraSetTheme"];
window.__upFrueh = [];
UP_API.forEach(function(n){
  if (typeof window[n] === "function") return;
  var f = function(){ window.__upFrueh.push([n, [].slice.call(arguments)]); };
  f.__upShim = 1; f.__amStub = true; window[n] = f;
});
var fehler = null;
try { setUpstreemTheme("dark"); askMiraSetTheme("dark"); } catch(e){ fehler = String(e); }
var vor = { fehler: fehler, warteschlange: window.__upFrueh.length,
            askMiraStateIstShim: typeof window.askMiraState === "function",
            createWithAiIstShim: typeof window.createWithAi === "function",
            promptResearchIstShim: typeof window.upstreemPromptResearch === "function" };
</script>
<script src="core.js"></script>
<script>
setTimeout(function(){
  document.getElementById("out").textContent =
    "vor core:  " + JSON.stringify(vor, null, 1) + "\n" +
    "nach core: Thema = " + (document.getElementById("wurzel").getAttribute("data-theme") || "(keins)") +
    " | Rest: " + JSON.stringify(window.__upFrueh.map(function(e){ return e[0]; }));
}, 900);
</script>
