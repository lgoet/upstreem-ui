<meta charset="utf-8"><title>Theme: der Rueckkanal muss beim Pageload feuern</title>
<style>html,body{margin:0;font:13px/1.5 system-ui,sans-serif;padding:8px}
#out{font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;padding:10px;background:#f6f6f6}</style>
<body><pre id="out">laeuft…</pre>
<script>
/* Dieser Prueftand haelt eine ZURUECKNAHME fest. Ich hatte den Rueckkanal
   bubble_fn_theme_pref auf "nur bei echter Aenderung" verengt, weil in einem Bubble-Stack die
   Kette setUpstreemTheme -> theme_pref -> State -> Datenquelle -> zweiter Fetch auftauchte und
   ich sie fuer ein sinnloses Echo hielt.

   Sie ist kein Echo: die Seite SETZT ihren is_dark-State ueber genau diesen Rueckkanal. Mit dem
   Riegel blieb er beim Aufbau aus, und der State wurde nie gesetzt -- gemeldet als "mein
   Theme-Workflow ist kaputt". Der Aufruf der Seite ist eine Anweisung, keine Wiederholung.

   Geprueft wird deshalb das GEGENTEIL von vorher: setUpstreemTheme MUSS melden, auch wenn der
   Wert derselbe ist. Nur core's eigene Wiederherstellung beim Start bleibt still. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
var RUF=[];
window.bubble_fn_theme_pref = function(v){ RUF.push(String(v)); };
try { localStorage.setItem("pref_theme","dark"); } catch(e){}
fetch("core.js?n="+Math.random(),{cache:"no-store"}).then(function(r){ return r.text(); })
.then(function(js){
  var s=document.createElement("script"); s.textContent=js; document.head.appendChild(s);
  return new Promise(function(ok){ setTimeout(ok,600); });
}).then(function(){
  log("Nach dem Aufbau (core stellt \"dark\" aus dem Speicher wieder her):");
  log("   Meldungen: "+JSON.stringify(RUF)+
      "   ==> "+(RUF.length===0
        ? "RICHTIG (die eigene Wiederherstellung meldet core nicht -- sie wuerde den Wert aus der Datenbank ueberschreiben)"
        : "FALSCH"));
  RUF=[];
  window.setUpstreemTheme("dark");
  return new Promise(function(ok){ setTimeout(ok,200); });
}).then(function(){
  log("Der PAGELOAD-FALL  setUpstreemTheme(\"dark\") bei bereits dunkel:");
  log("   Meldungen: "+JSON.stringify(RUF)+
      "   ==> "+(RUF.length===1&&RUF[0]==="dark"
        ? "RICHTIG (meldet -- die Seite setzt is_dark hierueber)"
        : "FALSCH -- der Rueckkanal bleibt aus, is_dark wird nie gesetzt"));
  RUF=[];
  window.setUpstreemTheme("yes");
  return new Promise(function(ok){ setTimeout(ok,200); });
}).then(function(){
  log("   in Bubble-Form (\"yes\"): "+JSON.stringify(RUF)+
      "   ==> "+(RUF.length===1&&RUF[0]==="dark"?"RICHTIG":"FALSCH"));
  RUF=[];
  window.setUpstreemTheme("light");
  return new Promise(function(ok){ setTimeout(ok,200); });
}).then(function(){
  log("   echter Wechsel auf hell: "+JSON.stringify(RUF)+
      "   ==> "+(RUF.length===1&&RUF[0]==="light"?"RICHTIG":"FALSCH"));
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: "+e.message); });
</script>
