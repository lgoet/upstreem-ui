<meta charset="utf-8">
<link rel="stylesheet" href="core.css?v=13">
<link rel="stylesheet" href="brands-overview.css?v=13">
<body style="margin:0;padding:20px;font-family:sans-serif;background:#fff">

<div class="up-root ubo-root"
     data-instance="bo1"
     data-cdn-pin=""
     data-isdark="no"
     data-processing="no"
     data-processing2="no"
     data-gran-fn="bubble_fn_uboGranularity"
     data-submit-fn="bubble_fn_uboSubmitBrands"
     data-sort-fn="bubble_fn_uboSortTable"
     data-search-fn="bubble_fn_uboSearch"
     data-status-fn="bubble_fn_uboStatus"
     data-export-fn="bubble_fn_uboExportTable"
     data-rowclick-fn="bubble_fn_uboRowClick"
     data-setinactive-fn="bubble_fn_uboSetInactive"
     data-edit-fn="bubble_fn_uboEdit"
     data-opendomain-fn="bubble_fn_uboOpenDomain"
     data-activate-fn="bubble_fn_uboActivate">

  <!-- ============ chart container ============ -->
  <div class="ubo-unit">
    <div class="ubo-head">
      <div class="ubo-heading">Visibility over Time</div>
      <div class="ubo-head-tools">
        <div class="vc-gran" role="tablist" aria-label="Granularity">
          <button class="vc-gran-btn is-active" data-gran="day" type="button" role="tab">Day</button>
          <button class="vc-gran-btn" data-gran="week" type="button" role="tab">Week</button>
          <button class="vc-gran-btn" data-gran="month" type="button" role="tab">Month</button>
        </div>

        <div class="ubo-filter">
          <button class="ubo-filter-btn ubo-iconbtn" type="button" data-tip="Filter brands" aria-label="Filter brands">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            <span class="ubo-filter-badge"></span>
          </button>
          <div class="up-ment-menu" role="menu" aria-hidden="true"></div>
        </div>

        <div class="ubo-yaxis" role="tablist" aria-label="Y axis">
          <button class="ubo-yaxis-btn is-active" data-yaxis="sentiment" type="button" role="tab">Sentiment</button>
          <button class="ubo-yaxis-btn" data-yaxis="ranking" type="button" role="tab">Ranking</button>
        </div>
        <div class="ubo-seg" role="tablist" aria-label="Chart type">
          <button class="ubo-seg-btn is-active" data-chartmode="line" type="button" role="tab">Linechart
          </button>
          <button class="ubo-seg-btn" data-chartmode="landscape" type="button" role="tab">Landscape
          </button>
        </div>
        <button class="ubo-hide ubo-iconbtn" type="button" data-tip="Hide" aria-label="Hide">
          <svg class="ic-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ic-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>

    <div class="ubo-box ubo-box-chart">
      <div class="ubo-panel-body">
        <button class="ubo-scale-btn" type="button" data-tip="Chart Settings" aria-label="Chart Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

        <div class="ubo-line-holder">
          <div class="up-line-wrap"><canvas class="up-line-canvas"></canvas></div>
          <div class="up-legend"></div>
        </div>

        <div class="ubo-mx-holder">
          <div class="ubo-mx">
            <div class="ubo-mx-legend-y">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><path d="M9 9h.01"></path><path d="M15 9h.01"></path></svg>
              <span>Sentiment</span>
            </div>
            <div class="ubo-mx-wrap"><canvas class="ubo-mx-canvas"></canvas></div>
            <div class="ubo-mx-spacer"></div>
            <div class="ubo-mx-legend-x">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
              <span>Visibility</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ table container ============ -->
  <div class="ubo-unit">
    <div class="ubo-head">
      <div class="ubo-seg" role="tablist" aria-label="Brand status">
        <button class="ubo-seg-btn is-active" data-status="active" type="button" role="tab">Active<span class="ubo-seg-n"></span></button>
        <button class="ubo-seg-btn" data-status="inactive" type="button" role="tab">Inactive<span class="ubo-seg-n"></span></button>
      </div>

      <div class="ubo-head-tools">
        <div class="ubo-sort">
          <button class="ubo-sort-btn ubo-iconbtn" type="button" data-tip="Sort" aria-label="Sort">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 7.5L16.5 4.5L19.5 7.5"/><path d="M16.5 19.5V4.5"/><path d="M10.5 16.5L7.5 19.5L4.5 16.5"/><path d="M7.5 4.5V19.5"/></svg>
          </button>
          <div class="up-sort-menu" role="menu" aria-hidden="true"></div>
        </div>

        <div class="up-search">
          <button class="up-search-btn ubo-iconbtn" type="button" data-tip="Search" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <div class="up-search-box">
            <input class="up-search-input" type="text" placeholder="Search brands..." autocomplete="off" spellcheck="false" aria-label="Search brands"/>
            <button class="up-search-clear" type="button" aria-label="Clear search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>

        <div class="ubo-cols">
          <button class="ubo-cols-btn ubo-iconbtn" type="button" data-tip="Table Settings" aria-label="Table settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="ubo-cols-badge"></span>
          </button>
          <div class="up-cols-menu" role="menu" aria-hidden="true"></div>
        </div>

        <button class="up-export" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Export</span>
        </button>
      </div>
    </div>

    <div class="ubo-box"><div class="up-table ubo-table"></div></div>
  </div>
</div>

<script src="core.js?v=13"></script>
<script src="brands-overview.js?v=13"></script>
<script>
window.__events = [];
["uboGranularity","uboSubmitBrands","uboSortTable","uboSearch","uboStatus","uboExportTable",
 "uboRowClick","uboSetInactive","uboEdit","uboOpenDomain","uboActivate"].forEach(function(n){
  window["bubble_fn_"+n] = function(v){ window.__events.push([n, v]); };
});

var COMPANIES = [
  {company_id:"c1", name:"Toyota", color:"#e11d48", favicon_url:"https://www.google.com/s2/favicons?domain=toyota.de&sz=64",     visibility_window_pct:42},
  {company_id:"c2", name:"Audi",   color:"#0ea5e9", favicon_url:"https://www.google.com/s2/favicons?domain=audi.de&sz=64",       visibility_window_pct:31},
  {company_id:"c3", name:"Volvo",  color:"#22c55e", favicon_url:"https://www.google.com/s2/favicons?domain=volvo.com&sz=64",     visibility_window_pct:18},
  {company_id:"c4", name:"VW",     color:"#a855f7", favicon_url:"https://www.google.com/s2/favicons?domain=volkswagen.de&sz=64", visibility_window_pct:9},
  {company_id:"c5", name:"BMW",   color:"#f59e0b", favicon_url:"https://www.google.com/s2/favicons?domain=bmw.de&sz=64",        visibility_window_pct:0.3}
];
var DAYS = ["2026-07-28","2026-07-29","2026-07-30","2026-07-31","2026-08-01","2026-08-02","2026-08-03"];
var SERIES = [];
COMPANIES.forEach(function(c, ci){ DAYS.forEach(function(d, di){
  SERIES.push({company_id:c.company_id, day:d, visibility_pct: Math.max(0, c.visibility_window_pct + ((di*7+ci*13)%17) - 8)});
}); });
/* sentiments chosen to land in all four quadrants, plus one null-sentiment row */
var SENT = {c1:82, c2:64, c3:38, c4:21, c5:null};
var TABLE = COMPANIES.map(function(c, i){
  return { company_id:c.company_id, name:c.name, logo_url:c.favicon_url, position:i+1,
           visibility_pct:c.visibility_window_pct, visibility_delta_pct:(i%2?-1:1)*(2+i),
           avg_rank:1.4+i, avg_rank_delta:(i%2?0.4:-0.3),
           sentiment:SENT[c.company_id], sentiment_delta:(i%2?-3:5) };
});
var INACTIVE = [
  {company_id:"563e406e", name:"kellerdigital",  favicon_url:"https://www.google.com/s2/favicons?domain=kellerdigital.de&sz=64", deactivated_at:"2026-03-12T11:30:26.522954+00:00"},
  {company_id:"4a50d6d7", name:"SocialNatives",  favicon_url:"https://www.google.com/s2/favicons?domain=socialnatives.de&sz=64", deactivated_at:"2026-03-12T11:30:17.183062+00:00"},
  {company_id:"d95500d5", name:"wolf-of-seo",    favicon_url:"https://www.google.com/s2/favicons?domain=wolf-of-seo.de&sz=64",   deactivated_at:"2026-03-11T20:59:46.493025+00:00"}
];
/* Byte-for-byte the sanitizers from the documented Run-JS step (bubble/brands_overview_bubble.html),
   so the harness exercises the step the user actually pastes into Bubble -- not a cleaned-up
   version of it. TABLE_RAW below is deliberately RAW Bubble output: a null column arrives as
   `"sentiment":,` and there is a trailing comma before the closing bracket. Both are exactly what
   toArr() has to repair; a plain JSON.parse dies on either. */
function toArr(raw) {
  var s = String(raw == null ? "" : raw).trim();
  if (!s) return [];
  if (s[0] === "{") s = "[" + s + "]";
  s = s.replace(/:\s*([,}\]])/g, ": null$1");
  s = s.replace(/,\s*([}\]])/g, "$1");
  try { return eval("(" + s + ")"); } catch (e) { return []; }
}
function toNum(raw) {
  var s = String(raw == null ? "" : raw).trim();
  var n = parseFloat(s.replace(/,/g, ""));
  return isNaN(n) ? 0 : n;
}
var TABLE_RAW = JSON.stringify(TABLE)
  .replace('"sentiment":78', '"sentiment":')      // null column, Bubble-style
  .replace(/\}\]$/, '},]');                       // trailing comma before the bracket

window.addEventListener("load", function(){
  setTimeout(function(){
    /* ONE step, one payload, one backtick slot per RPC -- the shape documented in
       bubble/brands_overview_bubble.html and used by the visibility-chart step. */
    var payload = {
      instanceId: "bo1",
      isDark: "no",
      granularity: "day",
      totalCount: toNum("5"),
      totalCountInactive: toNum("3"),
      series: toArr(JSON.stringify(SERIES)),
      companies: toArr(JSON.stringify(COMPANIES)),
      table: toArr(TABLE_RAW),
      filterCompanies: toArr(JSON.stringify(COMPANIES)),
      inactive: toArr(JSON.stringify(INACTIVE))
    };
    var t = 0;
    (function go () {
      var fn = window.renderBrandsOverview
            || (window.parent && window.parent.renderBrandsOverview)
            || (window.top && window.top.renderBrandsOverview);
      if (typeof fn === "function") { fn(payload); return; }
      if (t++ < 60) setTimeout(go, 100);
    })();
  }, 300);
});
</script>
