<div class="up-root uut-root"
     data-instance="INSTANCE_ID"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-domain-mode="DOMAIN_MODE"
     data-brand-name="BRAND_NAME"
     data-brand-logo="BRAND_LOGO"
     data-export-instance="EXPORT_INSTANCE_ID"
     data-sticky-top="171"
     data-search-fn="bubble_fn_uutSearch"
     data-sort-fn="bubble_fn_uutSort"
     data-filter-fn="bubble_fn_uutFilter"
     data-brand-fn="bubble_fn_uutBrand"
     data-rowclick-fn="bubble_fn_uutRowClick"
     data-page-fn="bubble_fn_uutPage"
     data-mentioned-fn="bubble_fn_uutMentioned">
  <div class="up-head">
    <div class="up-heading"><span class="up-head-label">URLs</span><span class="up-head-sep"></span><span class="up-head-count"></span></div>
    <div class="up-head-tools">
      <button class="uut-brand-toggle" type="button" data-tip="Filter for your brand mentions">
        <span class="uut-brand-toggle-lbl">
          <img class="uut-brand-logo" src="" style="display:none" alt=""/>
          <span class="uut-brand-label"></span>
        </span>
        <span class="uut-brand-check">
          <svg class="uut-brand-check-yes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13.2592L7.58583 15.9568C8.2525 16.6523 8.58583 17 9.00004 17C9.41425 17 9.74759 16.6523 10.4143 15.9568L19 7"/></svg>
          <svg class="uut-brand-check-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20.9922 12L2.99219 12"/></svg>
        </span>
      </button>

      <div class="up-ment">
        <button class="up-ment-btn" type="button" data-tip="Filter for brand mentions" aria-haspopup="menu" aria-expanded="false">
          <span class="up-ment-lbl">All Brands</span>
          <svg class="up-ment-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"/></svg>
          <svg class="up-ment-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"/></svg>
        </button>
        <div class="up-ment-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="up-filter">
        <button class="up-filter-btn" type="button" data-tip="Filter Citation and URL Types" aria-haspopup="menu" aria-expanded="false">
          <span class="up-filter-btn-lbl">All Types</span>
          <svg class="up-filter-btn-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"/></svg>
          <svg class="up-filter-btn-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"/></svg>
        </button>
        <div class="up-filter-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="up-sort">
        <button class="up-sort-btn up-iconbtn" type="button" data-tip="Sort" aria-label="Sort">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
        </button>
        <div class="up-sort-menu" role="menu" aria-hidden="true"></div>
      </div>

      <div class="up-search">
        <button class="up-search-btn up-iconbtn" type="button" data-tip="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17L21 21"/><path d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z"/></svg>
        </button>
        <div class="up-search-box">
          <input class="up-search-input" type="text" placeholder="Type in url..." autocomplete="off" spellcheck="false" aria-label="Search URLs"/>
          <button class="up-search-clear" type="button" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"/></svg>
          </button>
        </div>
      </div>

      <div class="up-cols">
        <button class="up-cols-btn up-iconbtn" type="button" data-tip="Table Settings" aria-label="Table settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12C2.5 7.52166 2.5 5.28249 3.89124 3.89124C5.28249 2.5 7.52166 2.5 12 2.5C16.4783 2.5 18.7175 2.5 20.1088 3.89124C21.5 5.28249 21.5 7.52166 21.5 12C21.5 16.4783 21.5 18.7175 20.1088 20.1088C18.7175 21.5 16.4783 21.5 12 21.5C7.52166 21.5 5.28249 21.5 3.89124 20.1088C2.5 18.7175 2.5 16.4783 2.5 12Z"/><path d="M8.5 10C7.67157 10 7 9.32843 7 8.5C7 7.67157 7.67157 7 8.5 7C9.32843 7 10 7.67157 10 8.5C10 9.32843 9.32843 10 8.5 10Z"/><path d="M15.5 17C16.3284 17 17 16.3284 17 15.5C17 14.6716 16.3284 14 15.5 14C14.6716 14 14 14.6716 14 15.5C14 16.3284 14.6716 17 15.5 17Z"/><path d="M10 8.5L17 8.5"/><path d="M14 15.5L7 15.5"/></svg>
        </button>
        <span class="uut-cols-badge"></span>
        <div class="up-cols-menu" role="menu" aria-hidden="true"></div>
      </div>

      <button class="up-export" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></svg>
        <span>Export</span>
      </button>
    </div>
  </div>

  <div class="up-box">
    <div class="up-table">
      <div class="up-thead">
        <div class="up-th up-th-domain">URL<span class="up-grip" data-grip="domain"></span></div>
        <div class="up-th up-th-share is-sortable" data-sortcol="share">
          <span class="up-th-txt">Share</span>
          <span class="up-th-info" data-explain="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16V12"/><path d="M12.125 8.25H12M12.25 8.25C12.25 8.11193 12.1381 8 12 8C11.8619 8 11.75 8.11193 11.75 8.25C11.75 8.38807 11.8619 8.5 12 8.5C12.1381 8.5 12.25 8.38807 12.25 8.25Z"/></svg></span>
          <span class="up-thsort" data-for="share">
            <svg class="up-thsort-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15C18 15 13.5811 9.00001 12 9C10.4188 8.99999 6 15 6 15"/></svg>
            <svg class="up-thsort-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"/></svg>
          </span>

        </div>
        <div class="up-th up-th-type">Type<span class="up-th-info" data-explain="type"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16V12"/><path d="M12.125 8.25H12M12.25 8.25C12.25 8.11193 12.1381 8 12 8C11.8619 8 11.75 8.11193 11.75 8.25C11.75 8.38807 11.8619 8.5 12 8.5C12.1381 8.5 12.25 8.38807 12.25 8.25Z"/></svg></span></div>
        <div class="up-th up-th-ment">
          <img class="up-th-brandlogo" src="" alt="" style="display:none"/>
          <span class="up-th-mentlbl">mentioned</span>

        </div>
        <div class="up-th up-th-brands">Brands mentioned<span class="up-th-info" data-explain="brands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16V12"/><path d="M12.125 8.25H12M12.25 8.25C12.25 8.11193 12.1381 8 12 8C11.8619 8 11.75 8.11193 11.75 8.25C11.75 8.38807 11.8619 8.5 12 8.5C12.1381 8.5 12.25 8.38807 12.25 8.25Z"/></svg></span></div>
        <div class="up-th up-th-lastseen is-sortable" data-sortcol="last_seen">
          <span class="up-th-txt">Last Seen</span>
          <span class="up-thsort" data-for="last_seen">
            <svg class="up-thsort-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15C18 15 13.5811 9.00001 12 9C10.4188 8.99999 6 15 6 15"/></svg>
            <svg class="up-thsort-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"/></svg>
          </span>

        </div>
        <div class="up-th uut-th-actions">Actions</div>
      </div>
      <div class="up-tbody"></div>
    </div>
  </div>

  <div class="up-foot">
    <div class="up-pagesize">
      <span class="up-pagesize-lbl">Rows per page</span>
      <div class="up-pagesize-seg" role="group" aria-label="Rows per page"></div>
    </div>
    <div class="up-pager"></div>
  </div>
</div>
