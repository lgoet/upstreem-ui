<meta charset="utf-8"><title>notification im rahmen</title>
<style>html,body{margin:0;background:#eee}iframe{width:1100px;height:700px;border:0;display:block}</style>
<body><iframe id="f" src="_h_unc2.html"></iframe>
<script>
document.getElementById("f").addEventListener("load", function(){
  var f=document.getElementById("f");
  setTimeout(function(){
    var w=f.contentWindow, d=f.contentDocument;
    try { w.zeige("whats_new"); } catch(e){}
    setTimeout(function(){
      var card=d.querySelector(".unc-card"), body=d.querySelector(".unc-body");
      if(!card){ window.__mess={fehler:"keine Karte"}; return; }
      var cs=w.getComputedStyle(card), bs=w.getComputedStyle(body), r=card.getBoundingClientRect();
      window.__mess = { sicht: w.innerWidth+"x"+w.innerHeight,
        rechts_regel: cs.right, unten_regel: cs.bottom,
        abstand_rechts: Math.round(w.innerWidth - r.right), abstand_unten: Math.round(w.innerHeight - r.bottom),
        blur: bs.backdropFilter, schatten_lagen: (cs.boxShadow.match(/rgba?\(/g)||[]).length,
        typ: (d.querySelector(".unc-type")||{}).textContent };
    }, 1200);
  }, 2200);
});
</script>
