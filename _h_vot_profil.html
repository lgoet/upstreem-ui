<meta charset="utf-8"><title>visibility-chart: Dauer der Anpassung beim Ziehen</title>
<!-- Wozu: der Rueckruf, der in der App 431ms brauchte, meldet sich unter derselben Zeile an wie
     der Sammellauf (beide ueber einmalProBild). Hier laeuft NUR das Visibility Chart, mit vielen
     Zeilen, und window.upstreemProfil() trennt die beiden. -->
<link rel="stylesheet" href="core.css?v=v1">
<link rel="stylesheet" href="visibility-chart.css?v=v1">
<body style="margin:0;background:#fff;font-family:system-ui,sans-serif">
<pre id="out" style="font:12px/1.6 ui-monospace,monospace;background:#f6f6f6;padding:10px;margin:0">laedt</pre>
<div id="buehne" style="width:1200px">
<div class="up-root vot-root"
     data-instance="v1"
     data-cdn-pin=""
     data-isdark="IS_DARK"
     data-export-instance="EXPORT_INSTANCE_ID"
     data-processing="IS_PROCESSING"
     data-processing2="IS_PROCESSING_2"
     data-gran-fn="bubble_fn_votGranularity"
     data-rowclick-fn="bubble_fn_votRowClick"
     data-goto-fn="bubble_fn_votGoTo"
     data-sort-fn="bubble_fn_votSortTable"
     data-submit-fn="bubble_fn_votSubmitCompanies"
     data-export-fn="bubble_fn_votExportTable">

  <div class="vot-unit vot-unit-left">
    <div class="vot-head">
      <div class="vot-heading">Visibility over Time</div>
      <div class="vot-head-tools">
        <div class="vc-gran" role="tablist" aria-label="Granularity">
          <button class="vc-gran-btn is-active" data-gran="day" type="button" role="tab" data-tip="Day" aria-label="Day">D</button>
          <button class="vc-gran-btn" data-gran="week" type="button" role="tab" data-tip="Week" aria-label="Week">W</button>
          <button class="vc-gran-btn" data-gran="month" type="button" role="tab" data-tip="Month" aria-label="Month">M</button>
        </div>
        <button class="vot-maximize vot-max-top vot-iconbtn" type="button" data-tip="Minimize" aria-label="Minimize">
          <svg class="ic-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/></svg>
          <svg class="ic-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 10 7-7"/><path d="M20 10h-6V4"/><path d="m3 21 7-7"/><path d="M4 14h6v6"/></svg>
        </button>
      </div>
    </div>
    <div class="vot-box vot-box-left">
      <div class="vot-panel-body">
        <button class="vot-scale-btn" type="button" data-tip="Chart Settings" aria-label="Chart Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="up-line-wrap"><canvas class="up-line-canvas"></canvas></div>
        <div class="up-legend"></div>
      </div>
    </div>
  </div>

  <div class="vot-unit vot-unit-right">
    <div class="vot-head">
      <div class="vot-heading vot-heading-right"><span class="vot-head-label">Top Brands</span><span class="vot-head-sep"></span><span class="vot-head-count"></span></div>
      <div class="vot-head-tools">
        <div class="vot-sort">
          <button class="vot-sort-btn vot-iconbtn" type="button" data-tip="Sort" aria-label="Sort">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
          </button>
          <div class="up-sort-menu" role="menu" aria-hidden="true"></div>
        </div>
        <div class="vot-filter">
          <button class="vot-filter-btn vot-iconbtn" type="button" data-tip="Filter brands" aria-label="Filter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            <span class="vot-filter-badge"></span>
          </button>
          <div class="up-ment-menu" role="menu" aria-hidden="true"></div>
        </div>
        <button class="vot-export vot-iconbtn" type="button" data-tip="Export" aria-label="Export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></svg>
        </button>
        <button class="vot-maximize vot-max-right vot-iconbtn" type="button" data-tip="Maximize" aria-label="Maximize">
          <svg class="ic-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/></svg>
          <svg class="ic-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 10 7-7"/><path d="M20 10h-6V4"/><path d="m3 21 7-7"/><path d="M4 14h6v6"/></svg>
        </button>
        <button class="vot-goto vot-iconbtn" type="button" data-tip="Open" aria-label="Open">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /> <path d="M7 17 17 7" /></svg>
        </button>
      </div>
    </div>
    <div class="vot-box vot-box-right">
      <div class="vt-table"></div>
    </div>
  </div>
</div>
</div>
<script src="core.js?v=v1"></script>
<script src="visibility-chart.js?v=v1"></script>
<script>
window.addEventListener("load", function(){
  setTimeout(function(){
    var wurzel = document.querySelector(".vot-root, .up-root");
    window.__wurzel = wurzel && wurzel.className + " / " + (wurzel && wurzel.getAttribute("data-instance"));
    var inst = wurzel && wurzel.getAttribute("data-instance") || "default";
    var reihen = [], serien = [];
    for (var i = 0; i < 25; i++){
      var id = "c" + i;
      reihen.push({ company_id:id, name:"Marke "+i, logo_url:"", position: i+1, visibility_pct: 40 - i,
                    visibility_delta_pct: (i % 5) - 2, avg_rank: 2 + i/10, avg_rank_delta: 0.3,
                    sentiment: 60 + i, sentiment_delta: -0.7 });
      for (var d = 1; d <= 12; d++) serien.push({ company_id:id, day:"2026-08-"+(d<10?"0"+d:d), visibility_pct: 20+i+d });
    }
    if (window.renderVisibilityChart){
      window.renderVisibilityChart({ instanceId: inst, series: serien, companies: reihen,
        filterCompanies: reihen, table: reihen, totalCount: reihen.length });
    }
    setTimeout(messen, 2000);
  }, 400);
});
function messen(){
  window.upstreemProfilReset();
  var b = document.getElementById("buehne");
  var k = 0;
  var uhr = setInterval(function(){
    b.style.width = (1200 - (++k) * 12) + "px";
    window.dispatchEvent(new Event("resize"));
    if (k >= 20){
      clearInterval(uhr);
      setTimeout(function(){
        var p = window.upstreemProfil();
        document.getElementById("out").textContent =
          "Zeilen in der Tabelle: " + document.querySelectorAll(".vt-row, .up-row").length + "\n" +
          p.map(function(r){ return r.Name + ": " + r["Summe ms"] + "ms in " + r.Aufrufe +
                             " Aufrufen, laengster " + r["laengster ms"] + "ms"; }).join("\n");
        window.__ergebnis = p;
      }, 800);
    }
  }, 30);
}
</script>
