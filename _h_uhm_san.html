<meta charset="utf-8">
<link rel="stylesheet" href="core.css?v=s1">
<link rel="stylesheet" href="performance-radar.css?v=s1">
<body style="margin:0;padding:20px;font-family:sans-serif">
<!-- Prueft den Sanitizer aus bubble/performance_radar_bubble.html gegen einen Payload in der
     Form, in der er bei Bubble ankommt: JSON-nulls sind zu LEEREN Werten geworden
     ("avg_rank_prev": ,). Der Sanitizer hier ist eine 1:1-Kopie des dokumentierten Schritts --
     aendert sich der eine, muss der andere mit. -->
<div class="up-root uhm-root" data-instance="s1" data-isdark="no" data-sticky-top="16"
     data-metric-fn="bubble_fn_uhmMetric" data-select-fn="bubble_fn_uhmSelect">
  <div class="up-head">
    <div class="up-heading">Performance Chart</div>
    <div class="up-head-tools">
      <div class="uhm-metric up-seg" role="tablist" aria-label="Metric">
        <button class="up-seg-btn is-active" data-metric="visibility" type="button" role="tab">Visibility</button>
        <button class="up-seg-btn" data-metric="rank" type="button" role="tab">Ranking</button>
        <button class="up-seg-btn" data-metric="sentiment" type="button" role="tab">Sentiment</button>
      </div>
      <div class="uhm-pick">
        <button class="uhm-pick-btn up-iconbtn" type="button" data-tip="Brands &amp; Topics"></button>
        <div class="uhm-pick-menu" role="menu" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <div class="uhm-box"><div class="uhm-scroll"><div class="uhm-grid"></div></div></div>
</div>

<script src="core.js?v=s1"></script>
<script src="performance-radar.js?v=s1"></script>
<script>
window.__ev = [];
["uhmMetric","uhmSelect"].forEach(function(n){ window["bubble_fn_"+n] = function(p){ window.__ev.push([n,p]); }; });

window.__hole = function(name){
  var x = new XMLHttpRequest(); x.open("GET", name, false); x.send(null); return x.responseText;
};

/* ===== 1:1 der Sanitizer aus bubble/performance_radar_bubble.html ===== */
window.__toObj = function (raw) {
  var s = String(raw == null ? "" : raw).trim();
  if (!s) return {};
  s = s.replace(/:\s*([,}\]])/g, ": null$1");
  s = s.replace(/,\s*([}\]])/g, "$1");
  try { return eval("(" + s + ")"); } catch (e) { return {}; }
};
</script>
