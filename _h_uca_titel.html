<!doctype html>
<meta charset="utf-8">
<title>create-with-ai: Titel aus dem Attribut</title>
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="create-with-ai.css">
<style>body{font:13px Geist,system-ui,sans-serif;padding:18px}
 pre{background:#111;color:#eee;padding:10px;white-space:pre-wrap}</style>

<!-- Fall A: NUR Attribute, kein Run-JS-Schritt. Genau der Aufbau des Nutzers. -->
<div class="up-root uca-root" id="a"
     data-url="https://www.lee-up.de/solar"
     data-title="Solaranlagen fuer Handwerksbetriebe"
     data-citation-type="You"
     data-brand="Kestrel"></div>

<!-- Fall B: Attribut gesetzt UND ein Run-JS-Schritt ohne Titel (setzt _explicit) -->
<div class="up-root uca-root" id="b" data-instance="b"
     data-url="https://www.lee-up.de/solar"
     data-title="Titel aus dem Attribut"
     data-brand="Kestrel"></div>

<!-- Fall C: Attribut gesetzt, Run-JS-Schritt mit LEEREM Titel -->
<div class="up-root uca-root" id="c" data-instance="c"
     data-url="https://www.lee-up.de/solar"
     data-title="Titel aus dem Attribut"
     data-brand="Kestrel"></div>

<pre id="out">…</pre>
<script src="core.js"></script>
<script src="create-with-ai.js"></script>
<script>
function titelVon(id){
  var r = document.getElementById(id);
  var t = r.querySelector("[data-source-title]");
  return t ? t.textContent : "(kein Titelfeld)";
}
setTimeout(function(){
  try { window.createWithAiSetContext("b", '{"url":"https://www.lee-up.de/solar","citation_type":"You"}'); } catch(e){}
  try { window.createWithAiSetContext("c", '{"url":"https://www.lee-up.de/solar","citation_type":"You","lead_title":""}'); } catch(e){}
  var wurzeln = document.querySelectorAll(".uca-root");
  [].forEach.call(wurzeln, function(r){
    var ctrl = r.__ucaController;
    if (ctrl && ctrl.open) { try { ctrl.open(); } catch(e){} }
  });
  setTimeout(function(){
    document.getElementById("out").textContent =
      "A nur Attribut      : " + titelVon("a") + "\n" +
      "B Run-JS ohne Titel : " + titelVon("b") + "\n" +
      "C Run-JS Titel leer : " + titelVon("c");
  }, 400);
}, 700);
</script>
