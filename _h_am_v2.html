<!-- Das Viewport-Meta ist fuer die MESSUNG noetig, nicht fuer die Optik: ohne es nimmt
     ein mobiler Browser 980px an, und eine Messung bei "375px" liefert dann Desktopwerte.
     Die Wirtsseite in Bubble traegt es; hier muss es also auch stehen. -->
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Ask Mira: Composer v2 -- Aufwand-Slider und Picker</title>
<!--
  WARUM DIESER PRUEFSTAND KOPIEN LAEDT UND NICHT DAS REPO:
  Der lokale Server hat auf diesem Rechner keinen Lesezugriff auf ~/Documents (macOS-
  Ordnerschutz). GEMESSEN: /private/tmp liefert 200, ~/Documents liefert 404 fuer jede Datei.
  Deshalb kopiert scratchpad/sync.sh die Dateien in ein Verzeichnis, das der Server lesen darf,
  und schreibt zu jeder ihre Groesse und ihren Hash nach frische.js -- damit die Frische der
  geladenen Datei BEWIESEN werden kann und nicht gehofft.

  ZWEI FALLEN DIESER UMGEBUNG, die beide schon zu falschen Schluessen gefuehrt haben:
  1. Im verdeckten Browser-Fenster laeuft requestAnimationFrame NICHT und document.hidden ist
     wahr. Eine Animationsmessung meldet dort 0 und sieht aus wie ein Standbild. Der Abschnitt
     PARTIKEL treibt die Bilder daher selbst -- und die gefaelschte Uhr muss bei
     performance.now() anfangen, sonst ist dt negativ und jedes Bild wird verworfen.
  2. Haengende CSS-Uebergaenge halten den berechneten Wert auf dem STARTWERT. Ein max-height,
     das 0 meldet, sieht dann wie eine nicht greifende Regel aus. Jede Geometriemessung laeuft
     deshalb mit abgeschalteten Uebergaengen; die 200ms werden getrennt an der
     transition-duration geprueft, nicht am Endwert.
  3. Das Fenster kann 0x0 gross sein. Dann ist ALLES 0. Der Prueftand meldet die Fenstergroesse
     als erste Zeile und bricht ab, wenn sie zu klein ist.
-->
