<meta charset="utf-8"><title>Kalender: Zeitraum in der URL</title>
<style>html,body{margin:0;font:13px/1.5 system-ui,sans-serif;padding:8px}
#out{font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;padding:10px;background:#f6f6f6;margin-top:12px}</style>
<body>
<div id="halter"></div><pre id="out">laeuft…</pre>
<script>
/* Dieser Prueftand laeuft im OBERSTEN Fenster und mountet den Kalender direkt hier -- kein
   iframe. Grund: der Kalender liest den Zeitraum nur aus der URL des obersten Fensters
   (window === window.top), weil nur die beim naechsten Seitenaufbau gelesen wird. In einem
   Rahmen ist window !== window.top, dort waere die Mechanik gar nicht pruefbar.

   Aufruf:
     _h_udr_url.html?range=last30   Bubble haette den Zeitraum vor der ersten Abfrage
     _h_udr_url.html                   ohne Parameter, die Gegenprobe

   Die Einstellungen werden VOR core.js gesetzt, danach liest core sie einmal und cacht sie. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
var P=new URLSearchParams(location.search);
var MIT=P.get("range");
/* Die URL beim Start festhalten. "unberuehrt" heisst UNVERAENDERT, nicht "ohne Parameter" -- der
   erste Anlauf verglich auf Abwesenheit und meldete deshalb FALSCH fuer eine URL, die der Test
   selbst mit dem Parameter aufgerufen hatte. */
var SEARCH0=location.search;
try { localStorage.setItem("up_prefs", JSON.stringify({ date_sync:"on", date_preset:"last30" })); } catch(e){}
var RUF={from:0,to:0,range:0,boot:0,apply:0}, LETZTE=null, WER=[];
/* Die Aufrufe der Host-App, VOR core.js -- core umschliesst sie beim Start und beantwortet
   daraus "welche Ansicht ist offen" bzw. "welcher Drawer". showView wird hier absichtlich NIE
   gerufen: geprueft wird der Fall Seitenaufbau/Deeplink, in dem es nur die Adresse gibt. */
window.__views=[]; window.__drawer=[];
window.showView=function(n){ window.__views.push(String(n)); };
window.openDrawer=function(art,id){ window.__drawer.push("auf:"+art); };
window.closeDrawer=function(art){ window.__drawer.push("zu:"+art); };
window.bubble_fn_udr_date_from=function(){ RUF.from++; };
window.bubble_fn_udr_date_to=function(){ RUF.to++; };
window.bubble_fn_udr_date_range=function(j){ RUF.range++; try{LETZTE=JSON.parse(j);}catch(e){} };
window.bubble_fn_udr_date_boot=function(j){ RUF.boot++; try{LETZTE=JSON.parse(j);}catch(e){} };
window.bubble_fn_udr_apply=function(j){ RUF.apply++;
  try { var o=JSON.parse(j); WER.push(o.instance_id+":"+o.reason); } catch(e){ WER.push("?"); } };
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function wurzelAus(h){ return h.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim(); }

Promise.all([hol("core.css"),hol("filters/date-range.css"),hol("core.js"),
             hol("filters/date-range.js"),hol("filters/bubble/date_range_bubble.html")])
.then(function(t){
  [t[0],t[1]].forEach(function(c){ var s=document.createElement("style"); s.textContent=c; document.head.appendChild(s); });
  var w=document.createElement("div"); w.innerHTML=wurzelAus(t[4]);
  var r=w.querySelector(".udr-root");
  r.setAttribute("data-instance","dates_v2_dashboard"); r.setAttribute("data-cdn-pin","t");
  r.setAttribute("data-isdark","no");
  /* AUSDRUECKLICH einschalten -- ohne dieses Attribut fasst der Kalender die URL nicht an.
     So ist es jetzt richtig: die URL der App wird nur geaendert, wenn die Seite es sagt. */
  if (P.get("urlmodus") !== "aus") r.setAttribute("data-url-range","on");
  r.setAttribute("data-range-apply-fn","bubble_fn_udr_apply");
  r.setAttribute("data-range-apply-delay","0");
  document.getElementById("halter").appendChild(r);
  /* Zwei weitere Kalender fuer die Phase "wer ist offen": eine zweite ANSICHT und ein DRAWER.
     Die Reihenfolge ist Absicht -- dates_v2_dashboard mountet zuerst und macht damit die
     Aufbau-Uebergabe, obwohl die Adresse eine ANDERE Ansicht nennt. Genau daran muss sich
     zeigen, ob ?view= gelesen wird oder ob der erste Kalender gewinnt. */
  ["dates_v2_citations","dates_v2_domainspotlight"].forEach(function(id){
    var w2=document.createElement("div"); w2.innerHTML=wurzelAus(t[4]);
    var r2=w2.querySelector(".udr-root");
    r2.setAttribute("data-instance", id); r2.setAttribute("data-cdn-pin","t");
    r2.setAttribute("data-isdark","no");
    r2.setAttribute("data-range-apply-fn","bubble_fn_udr_apply");
    r2.setAttribute("data-range-apply-delay","0");
    document.getElementById("halter").appendChild(r2);
  });
  var j=document.createElement("script"); j.textContent=t[2]; document.head.appendChild(j);
  var j2=document.createElement("script"); j2.textContent=t[3]; document.head.appendChild(j2);
  return new Promise(function(ok){ setTimeout(ok,1800); });
}).then(function(){
  /* Die Spur ist raus. Geprueft wird jetzt die WIRKUNG: kein Bubble-Aufruf, wenn die URL den
     Zeitraum schon trug -- und genau einer, wenn nicht. Das ist ohnehin die Aussage; die
     Spur-Zeile war nur ihre Begleitung. */
  var lbl=(document.querySelector(".udr-label")||{}).textContent||"";
  log(MIT ? "MIT ?range="+MIT : "OHNE Parameter (Gegenprobe)");
  log("   window===window.top: "+(window===window.top)+"   location.search: \""+location.search+"\"");
  log("   Bubble-Aufrufe: "+JSON.stringify(RUF));
  log("   Beschriftung: \""+lbl.trim()+"\"");
  if (P.get("urlmodus") === "aus"){
    log("   URL beim Start: \""+SEARCH0+"\"   jetzt: \""+location.search+"\"");
    log("   ==> "+(RUF.boot===1 && location.search===SEARCH0
          ? "RICHTIG (ohne data-url-range: URL unveraendert, und es wird uebergeben)"
          : "FALSCH -- "+(RUF.boot!==1?"keine Uebergabe":"die URL wurde veraendert")));
    log("FERTIG"); return;
  }
  if (MIT){
    log("   ==> "+(RUF.boot===0&&RUF.range===0&&RUF.from===0&&RUF.to===0
          ? "RICHTIG (keine Uebergabe -- also kein zweiter Abfragedurchlauf)"
          : "FALSCH -- es wurde uebergeben, obwohl Bubble den Zeitraum schon hatte"));
    log("   ==> "+(lbl.indexOf("30")>=0 ? "RICHTIG (Anzeige passt zur URL)" : "FALSCH"));
  } else {
    log("   ==> "+(RUF.boot===1&&RUF.range===0
          ? "RICHTIG (ohne Parameter wird genau einmal uebergeben)"
          : "FALSCH -- "+(RUF.boot===0?"gar keine Uebergabe":"mehr als ein Kanal")));
    log("   URL danach: \""+location.search+"\""+
        "   ==> "+(/range=last30/.test(location.search)
          ? "RICHTIG (nachgezogen -- der naechste Aufbau braucht die Uebergabe nicht mehr)"
          : "FALSCH -- die URL wurde nicht geschrieben"));
  }
  return ansichtAusDerUrl();
}).then(function(){
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: "+e.message+"\n"+(e.stack||"").split("\n").slice(0,3).join("\n")); });

/* ---- WER IST OFFEN, WENN showView NOCH NIE GEFEUERT HAT? ----------------------------------
   Der Fall: Seitenaufbau oder Reload auf einer Ansicht, dazu ein offener Drawer, und darin wird
   der Zeitraum umgestellt. Bedient werden muessen der DRAWER (sein eigener Klick) und die
   ANSICHT dahinter -- und die steht nur in der Adresse: ?view=.

   Die Probe ist scharf gestellt: dates_v2_dashboard mountet ZUERST und macht die
   Aufbau-Uebergabe, die Adresse nennt aber citations. Wird das Dashboard bedient, ist die
   Adresse nicht gelesen worden. */
function warte(ms,w){ return new Promise(function(ok){ setTimeout(function(){ ok(w); },ms); }); }
function ansichtAusDerUrl(){
  var u = new URL(location.href);
  u.searchParams.set("view", "citations");
  history.replaceState(null, "", u.href);
  log("ANSICHT AUS DER ADRESSE  \"" + location.search + "\"");
  log("   showView gerufen: " + JSON.stringify(window.__views) + " (absichtlich nie)");
  /* Drawer auf, wie die App es tut. */
  window.openDrawer("domainspotlight", "ID1");
  return warte(1300).then(function(){
    RUF={from:0,to:0,range:0,boot:0,apply:0}; WER=[];
    var sel = '[data-instance="dates_v2_domainspotlight"] ';
    document.querySelector(sel + ".udr-trigger").click();
    return warte(300).then(function(){
      document.querySelector(sel + '[data-preset="last3"]').click();
      return warte(1400);
    });
  }).then(function(){
    var wer = WER.slice().sort();
    var hatAnsicht = wer.join().indexOf("dates_v2_citations") >= 0;
    var hatDash    = wer.join().indexOf("dates_v2_dashboard") >= 0;
    log("   im Drawer umgestellt: apply=" + RUF.apply + "  bedient: " + JSON.stringify(wer));
    log("   ==> " + (hatAnsicht && !hatDash
      ? "RICHTIG (der Drawer und die Ansicht aus ?view= -- nicht der Kalender, der zuerst mountete)"
      : "FALSCH -- " + (hatDash ? "das Dashboard wurde bedient: die Adresse wurde nicht gelesen"
                                : "die Ansicht aus ?view= wurde nicht bedient")));
    /* GEGENPROBE: showView schlaegt die Adresse. Ein Wechsel auf brands, dann derselbe Klick --
       jetzt muss brands bedient werden und citations nicht mehr. */
    var w3=document.createElement("div");
    return warte(50).then(function(){
      window.showView("citations");   /* damit currentView() gesetzt ist */
      return warte(600);
    }).then(function(){
      RUF={from:0,to:0,range:0,boot:0,apply:0}; WER=[];
      var sel2 = '[data-instance="dates_v2_domainspotlight"] ';
      document.querySelector(sel2 + ".udr-trigger").click();
      return warte(300).then(function(){
        document.querySelector(sel2 + '[data-preset="last7"]').click();
        return warte(1400);
      });
    }).then(function(){
      var wer2 = WER.slice().sort();
      log("   GEGENPROBE mit showView(\"citations\"): bedient " + JSON.stringify(wer2));
      log("   ==> " + (wer2.join().indexOf("dates_v2_citations") >= 0
        ? "RICHTIG (dieselbe Ansicht, jetzt ueber showView -- beide Quellen zeigen dorthin)"
        : "FALSCH"));
    });
  });
}
</script>
