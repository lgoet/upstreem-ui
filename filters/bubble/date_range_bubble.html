<!-- ============================================================
     Upstreem — Date Range (filter dropdown)
     Paste this whole block into a Bubble HTML element. The loader at the bottom pulls
     core.css/core.js + date-range.css/js from jsDelivr, pinned to the commit in data-cdn-pin.

     The visible element is just the 32px trigger button. The calendar panel is rendered by the
     script into this element and shown on click — the markup below is deliberately only the root
     div, there is nothing else for you to paste or keep in sync.

     ── Migrated from the standalone date picker ─────────────────────────────────
     THE BUBBLE CONTRACT IS UNCHANGED. Same three data-*-fn attributes, same JSON payload with the
     same four keys, same two CustomEvents, and window.resetUpstreemDateRangePicker('your_id')
     still behaves exactly as before (silent — see below). Existing workflows need no edit.

     What changed inside:
       - Flatpickr is gone. The calendar is the component's own code, so nothing is fetched from a
         third-party CDN at runtime and a Flatpickr release can no longer break the styling. The
         ~200 lines of !important that existed only to override its skin are gone with it.
       - Colours come from core's --vc-* tokens, so the picker follows a theme switch. The
         standalone wrote hex values inline with !important and did not.
       - The panel is a normal absolutely-positioned dropdown instead of a body-mounted fixed
         panel that chased its trigger with JS on every scroll event (STYLEGUIDE §14).
       - The iframe-tree scan for bubble_fn_* and the 1200ms DOM re-scan interval are both gone;
         core's resolveBubbleFn and UC.watchRoots cover the same ground.
       - Grid is always 6 rows, so the panel keeps its height when you page to a 5-row month.
       - Leading/trailing days of the neighbouring month are blank. In the two-month view they are
         literally the same days as the other grid, so a range crossing the boundary used to be
         painted twice and read as two separate ranges.
       - Day cells are real buttons: Tab reaches them, arrow keys move across month boundaries.

     ── Bubble dynamic values on the root element ────────────────────────────────
     data-instance      = "ROOTID_[dynamic id]"  — unique per placement. This is the id you pass to
                          resetUpstreemDateRangePicker(). Keep whatever you use today.
     data-cdn-pin       = commit hash to load from. NEVER leave this empty: blank falls back to
                          @main, and jsDelivr caches branch URLs for days.
     data-isdark        = "yes" / "no"
     data-isprocessing  = "yes" while the page is fetching. The trigger goes inert (no dimming,
                          no cursor change — a greyed-out filter reads as broken when the only
                          thing happening is that the table behind it is loading) and an open
                          panel closes.

     Optional, both have sensible defaults:
     data-min-date          = "YYYY-MM-DD"  earliest selectable day. Default 2024-01-01.
     data-max-span-months   = number        how far the second click may sit from the first.
                              Default 6. Stops anyone accidentally asking for three years of rows.

     ── Bubble element size ──────────────────────────────────────────────────────
     FIT TO CONTENT, or a fixed 32px height. The element only ever contains the trigger button —
     the panel is absolutely positioned and does not affect the element's own box.
     Make sure the Bubble group AROUND it does not have "clip content" on, otherwise the open
     panel gets cut off. The script calls UC.unclipAncestors() at boot to handle the usual cases.

     ── Events to Bubble ─────────────────────────────────────────────────────────
     Create these as Toolbox "JavaScript to Bubble" elements and put their names in the
     data-*-fn attributes below. All three fire together on every committed change.

       data-date-from-fn    receives a real DATE object   (type: date)
       data-date-to-fn      receives a real DATE object   (type: date)
       data-range-fn        receives a JSON TEXT string   (type: text)
                            {"instance_id":"...","date_from":"YYYY-MM-DD",
                             "date_to":"YYYY-MM-DD","event_id":"..."}
       data-range-apply-fn  receives the SAME JSON TEXT string   (type: text)   OPTIONAL
       data-boot-fn         receives the SAME JSON TEXT string   (type: text)   OPTIONAL,
                          -- and to push into it from a page workflow, call
                          upstreemDatesActivate('<view name>'). Do NOT read data-range-current
                          from the DOM and pass it yourself: measured on the real app, that
                          snippet delivered null and overwrote the correct dates the picker had
                          just handed over.
                            but see "Why the page load has its own channel" below — on a page
                            whose range workflow reloads data, you want this one.

     event_id is unique per change — use it as the trigger for your filter version counter if you
     want to be certain two identical ranges in a row still count as two events.

     ── Why the page load has its own channel ───────────────────────────────────
     On page load the picker hands Bubble the range ONCE, so the date states are right before the
     page runs its own queries. That handover has two requirements at the same time: SET THE
     STATES, and DO NOT RELOAD. On a set-up page those two live on the same function — the
     workflow behind data-range-fn writes the states AND refreshes — so a single channel cannot
     satisfy both. Measured on the real app: routing the handover through data-range-fn made every
     RPC run twice; routing it through the two date functions instead set no states at all,
     because on that page they have no workflow behind them.

     So the page load calls data-boot-fn instead, with the identical JSON (reason: "boot"). Its
     workflow should set the two date states and NOTHING else — no refresh. Create it by copying
     the two "Set state" actions out of your data-range-fn workflow.

     Leave data-boot-fn off and the handover falls back to data-range-fn, with one console line
     saying so: a page without a date range is worse than a page that loads twice, and neither
     should happen silently.

     data-boot-mode on the root steers the handover:
       (unset)  the boot channel, one single call. What you want.
       "full"   from + to + range, like a click. For a page that deliberately loads off it.
       "off"    no handover at all. The proof switch: if the page still runs its queries twice
                with this on, the second run is not coming from this file.

     ONE call, not three. from/to are NOT fired on page load: date_from and date_to are in the
     boot channel's JSON as ISO text, so its workflow sets both states from there. Three calls
     meant three Bubble events for one handover, and that was measured on the real app.

     ── Why there are two JSON channels ──────────────────────────────────────────
     Same split the topics, markets and models filters already use, and for the same reason:

       data-range-fn        an element INSIDE the reusable. It owns the selection and writes it
                            into the reusable's own states.
       data-range-apply-fn  an element ON THE PAGE. It is what tells the table to reload. A
                            reusable cannot trigger a page-level workflow by itself — that is the
                            whole reason this second name exists, and why this component used to
                            need a filter-version counter state as a detour.

     Fired in that order, so the reusable's states are already set when the page reacts. Both get
     the IDENTICAL JSON, so a workflow on the second channel never has to read those states.

     Optional: leave the attribute off and nothing is called and nothing is logged — a page that
     still drives its reload through a counter keeps working exactly as before. There is no
     default name on purpose: an invented one would silently hit nothing on a page that has never
     heard of it.

     Fires on EVERY change that alters the data — a preset, a custom range, a reset.

     ── Timing ───────────────────────────────────────────────────────────────────
     The apply call is deliberately held back by 120ms. The three calls above it each kick off a
     Bubble workflow, and those run ASYNCHRONOUSLY in Bubble's own queue while the JS call returns
     immediately. Firing apply in the same millisecond made the page reload BEFORE the workflow
     inside the reusable had written its states — you saw the new granularity next to the old
     data. Adjust with data-range-apply-delay (milliseconds, 0 fires immediately).

     This is a heuristic, not a guarantee: JS cannot know when Bubble has drained its queue. The
     robust route is to read date_from/date_to out of THIS payload instead of the reusable's
     states — then nothing has to be in sync at all.

     If a function is missing the component still dispatches:
       - a "change" CustomEvent on the root element
       - an "upstreem:date-range" CustomEvent on window
     both carrying the same payload object, so nothing is silently lost.

     NOTHING is emitted on page load. The picker starts on "Last 7 Days" and stays quiet until the
     user actually changes something — your page's own initial load already has the default range.

     ── Control from "Run JavaScript" ────────────────────────────────────────────
     resetUpstreemDateRangePicker('dates_v2_')   back to Last 7 Days, SILENT (no events).
     resetUpstreemDateRangePicker()              same, for every picker on the page.
       Silent is deliberate: you call this to realign the picker with a date change that already
       happened somewhere else. Emitting here would kick off a second page-wide refresh nobody
       asked for. The Reset button inside the panel DOES publish normally.
       Returns true if it matched a picker, false if the id was not found.

     setDateRangePreset('dates_v2_', 'last30')        set a preset, SILENT
     setDateRangePreset('dates_v2_', 'last30', true)  set it AND publish
       keys: 'last7' | 'last30' | 'last3' | 'last6'
       Use the silent form to keep this picker in sync with e.g. an export dialog that shows the
       same four presets.

     setDateRangeTheme('dates_v2_', 'dark' | 'light')

     All of these are stubbed and QUEUED before core.js finishes loading, then replayed in call
     order — an early Bubble workflow cannot get lost.

     ── State across page changes ────────────────────────────────────────────────
     The chosen range survives Bubble swapping the element out and back in, keyed by
     data-instance. In memory only, on purpose: a range restored from localStorage days later is
     worse than the default.
     ============================================================ -->
<div class="up-root udr-root"
     data-instance="ROOTID_[dynamic id]"
     data-cdn-pin="CDN_PIN"
     data-isdark="IS_DARK"
     data-isprocessing="IS_PROCESSING"
     data-range-fn="bubble_fn_udr_date_range"
     data-date-from-fn="bubble_fn_udr_date_from"
     data-date-to-fn="bubble_fn_udr_date_to"
     data-boot-fn="bubble_fn_udr_date_boot"
     data-range-apply-fn="bubble_fn_udr_apply_dashboard"
     data-range-apply-delay="120"></div>

<script>
/* Loads this component's CSS/JS from jsDelivr, pinned to the commit hash you put in data-cdn-pin
   on the root div above (falls back to @main only if data-cdn-pin is left blank or at the literal
   "CDN_PIN" placeholder — don't, see the note at the top). Byte-for-byte the same loader every
   other component in this repo ships. */
(function(){
  function echterPin(p){
    /* trim: ein Leerzeichen aus der Bubble-Konstante ergaebe sonst .../upstreem-ui@ abc /core.js,
       jsDelivr antwortet mit 404, und weder CSS noch JS landen. Ohne trim greift auch kein
       Rueckfall, weil "   " truthy ist.
       Gespaltener Platzhalter: wer "CDN_PIN" global im Element ersetzt, wuerde sonst auch diesen
       Waechter treffen, und der Loader liefe dauerhaft auf @main, obwohl ein Pin gesetzt ist. */
    p = String(p == null ? "" : p).trim();
    return (p && p !== "CDN_" + "PIN") ? p : "";
  }
  function readPin(cls){
    var i, p, els = document.getElementsByClassName(cls);
    for (i = 0; i < els.length; i++){
      p = echterPin(els[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* ---- Rueckfall: einen Pin nehmen, der auf DIESER Seite schon gilt ----------------------
       Gemeldet am 31.08. mit drei Stapelspuren, alle aus einem solchen Loader: "core.css ist
       schon von einem anderen Pin geladen ... ignoriert wird @main" -- obwohl der Pin am Element
       stand. Der Grund ist die Reihenfolge: Bubble baut ein Element bei jedem Rerender neu und
       fuehrt Scripts nicht in DOM-Reihenfolge aus, dieser Loader lief also, waehrend seine eigene
       Wurzel noch nicht im Dokument stand -- die Klasse oben fand nichts.
       Und das war mehr als eine Warnung: core kam durch die Entdoppelung unten noch aus dem Pin,
       die Dateien DIESER Komponente aber tatsaechlich von @main. Eine Seite, die zur Haelfte auf
       @main laeuft, ist genau das, was ein Pin verhindern soll.
       Geraten wird nichts: jede der drei Stufen liest einen Pin, der auf dieser Seite schon in
       Gebrauch ist. */
    if (echterPin(window.__upPin)) return window.__upPin;
    var alle = document.querySelectorAll ? document.querySelectorAll("[data-cdn-pin]") : [];
    for (i = 0; i < alle.length; i++){
      p = echterPin(alle[i].getAttribute("data-cdn-pin"));
      if (p) return (window.__upPin = p);
    }
    /* Aus einer schon geladenen Datei ablesen. Diese Stufe greift auch dann, wenn alle anderen
       Elemente der Seite noch die ALTE Fassung dieses Loaders tragen -- die fuellen
       __upAssetsLoaded genauso. "main" wird NICHT gemerkt: das ist kein Pin, und die naechste
       Komponente wuerde ihn sonst fuer einen halten. */
    var L0 = window.__upAssetsLoaded, k, m;
    for (k in L0){
      if (!Object.prototype.hasOwnProperty.call(L0, k)) continue;
      m = String(L0[k] || "").match(/upstreem-ui@([^/]+)\//);
      if (m && m[1] && m[1] !== "main") return (window.__upPin = m[1]);
    }
    return "main";
  }
  var base = "https://cdn.jsdelivr.net/gh/lgoet/upstreem-ui@" + readPin("udr-root") + "/";
  var L = window.__upAssetsLoaded || (window.__upAssetsLoaded = {});
  function once(url, make){ if (L[url]) return; L[url] = 1; make(url); }
  function css(f){ once(base + f, function(u){ var l = document.createElement("link"); l.rel = "stylesheet"; l.href = u; document.head.appendChild(l); }); }
  function js(f){ once(base + f, function(u){ var s = document.createElement("script"); s.src = u; s.async = false; document.head.appendChild(s); }); }
  css("core.css"); css("filters/date-range.css");
  js("core.js"); js("filters/date-range.js");
})();
</script>
