<!doctype html><meta charset="utf-8">
<title>Leiste: die drei Abstaende Team - Quick Actions - erste Ueberschrift</title>
<pre id="out" style="font:12px/1.55 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="buehne"></div>
<script>
/* Gemeldet am 07.09.: "das Gap zwischen Team-Container, Quick Actions und DATENBANK gleich gross
   machen -- das zwischen Quick Actions und Datenbank ist kleiner als das nach oben."
   In der Datei stehen beide auf 24px. Wenn es trotzdem verschieden AUSSIEHT, liegt es nicht am
   Aussenabstand, sondern an den Kaesten: Teamname und Quick-Actions-Beschriftung sitzen mittig in
   32 bzw. 36px hohen Knoepfen, die Ueberschrift ist blosser Text ohne Polster oben. Zwischen zwei
   Kastenkanten sind es dieselben 24 -- zwischen den SCHRIFTEN nicht.
   Deshalb wird hier zweierlei gemessen und getrennt ausgewiesen: Kasten gegen Kasten und Schrift
   gegen Schrift. Das Urteil faellt an der Schrift, denn die sieht man. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function ja(b){ return b ? "RICHTIG" : "FALSCH "; }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok,ms); }); }

Promise.all([hol("core.css"), hol("core.js"), hol("sidebar.css"), hol("sidebar.js"),
             hol("quick-actions.css"), hol("quick-actions.js")]).then(function(t){
  var f=document.createElement("iframe");
  f.style.cssText="width:1400px;height:700px;border:1px solid #ccc;display:block";
  document.getElementById("buehne").appendChild(f);
  var d=f.contentDocument, v=f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  try { v.localStorage.clear(); } catch(e){}
  [t[0], t[2], t[4]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var host=d.createElement("div");
  host.className="up-root usn-root"; host.setAttribute("data-instance","gaps");
  host.setAttribute("data-isdark","no"); host.setAttribute("data-cdn-pin","t");
  host.setAttribute("data-team-id","1"); host.setAttribute("data-active","dashboard");
  /* MIT LOGO, sonst gibt es die Linie gar nicht -- und der erste der drei Abstaende, um die es
     hier geht, haengt an ihr. Ohne diese zwei Zeilen ist die Markenzeile is-off und der
     Prueftand messt eine Leiste, die es beim Nutzer nicht gibt. */
  host.setAttribute("data-upstreem-logo","_h_logo.svg");
  host.setAttribute("data-upstreem-logo-dark","_h_logo.svg");
  d.body.appendChild(host);
  [t[1], t[3], t[5]].forEach(function(j){ var sc=d.createElement("script"); sc.textContent=j; d.head.appendChild(sc); });
  return warte(1800).then(function(){
    var bar=d.querySelector(".usn-bar");
    if (!bar){ log("ABBRUCH: keine .usn-bar"); return; }
    /* Ein Team, damit der Name dasteht und nicht das Skelett. */
    try { v.setSidebarTeams(JSON.stringify([{ id:"1", name:"Upstreem GmbH" }])); } catch(e){}
    try { v.setSidebarUser(JSON.stringify({ name:"Lukas", email:"l@u.io" })); } catch(e){}
    try { v.setSidebarBrands(JSON.stringify([{ id:"b1", name:"ADAC" }])); } catch(e){}
    return warte(900).then(function(){
      var top=bar.querySelector(".usn-top");
      var qa=bar.querySelector(".usn-qa");
      var nav=bar.querySelector(".usn-nav");
      var name=bar.querySelector(".usn-teamname");
      var qaLbl=bar.querySelector(".mqa-trigger-label");
      var kopf=bar.querySelector(".usn-head-lbl") || bar.querySelector(".usn-head");
      if (!top || !qa || !nav || !kopf){ log("ABBRUCH: eine der drei Zeilen fehlt"); return; }
      function r(e){ return e.getBoundingClientRect(); }
      function z(x){ return Math.round(x*100)/100; }

      /* ---- Der Rahmen des Quick-Actions-Knopfes (08.09. wieder bestellt) ----
         Er wird HIER mitgeprueft und nicht in einem eigenen Prueftand: an der Hoehe dieses
         Knopfes haengen die drei Abstaende, um die es in dieser Datei geht. Ein Rahmen, der die
         Hoehe um 2px wachsen laesst, verschiebt genau die Zahlen darunter -- also stehen beide
         Messungen zusammen. */
      var trig=bar.querySelector(".mqa-trigger");
      if (trig){
        var ct=v.getComputedStyle(trig);
        var rt=trig.getBoundingClientRect();
        log("QUICK ACTIONS: DER RAHMEN");
        log("   Rahmen " + ct.borderTopWidth + " " + ct.borderTopStyle + " " + ct.borderTopColor +
            "   Radius " + ct.borderRadius + "   Hoehe " + rt.height + "px (" + ct.boxSizing + ")");
        log("   " + ja(parseFloat(ct.borderTopWidth) === 1) + " der Knopf hat einen 1px-Rahmen");
        log("   " + ja(ct.borderTopColor === v.getComputedStyle(bar).getPropertyValue("border-right-color") ||
             ct.borderTopColor.indexOf("rgb") === 0) + " und zwar in einer echten Farbe (" +
             ct.borderTopColor + ")");
        log("   " + ja(Math.abs(rt.height - 36) < 0.6) +
            " er bleibt 36px hoch -- die Abstaende darunter haengen daran");
        log("");
      }
      /* ---- DIE DREI ABSTAENDE AN IHREN SICHTBAREN KANTEN (08.09.) ----
         Angefordert: "das Gap von Separator zu Teamswitcher zu Quick Actions, mach das 32px,
         also beide Gaps". Kasten gegen Kasten ist damit erledigt -- aber was das AUGE nimmt,
         ist je Anker etwas anderes:
             die Linie unter der Marke   eine harte 1px-Kante
             der Teamumschalter          KEIN Rahmen, also sieht man seinen Inhalt (das
                                         Teamlogo), nicht seine Kastenkante
             der Quick-Actions-Knopf     hat seit dem 08.09. wieder einen RAHMEN, also ist seine
                                         Kastenkante die sichtbare Kante
             die Ueberschrift DATABASE   blosser Text
         Darum wird beides ausgewiesen: die Kastenabstaende (die Zahlen aus der Datei) und die
         Abstaende zwischen den sichtbaren Kanten. Das Urteil faellt an den sichtbaren. */
      var marke=bar.querySelector(".usn-brand");
      var teamlogo=bar.querySelector(".usn-teamlogo") || bar.querySelector(".usn-team");
      var qaBtn=bar.querySelector(".mqa-trigger");
      if (marke && teamlogo && qaBtn && kopf){
        var linieUnten=r(marke).bottom;   /* die Linie liegt auf bottom: 0 der Markenzeile */
        var lg=r(teamlogo), qb=r(qaBtn), kf=r(kopf);
        log("SICHTBARE KANTEN");
        log("   Linie -> Teamlogo        " + z(lg.top - linieUnten) + "px");
        log("   Teamlogo -> QA-Rahmen    " + z(qb.top - lg.bottom) + "px");
        log("   QA-Rahmen -> DATABASE    " + z(kf.top - qb.bottom) + "px");
        var g1=lg.top - linieUnten, g2=qb.top - lg.bottom, g3=kf.top - qb.bottom;
        /* GEPRUEFT WIRD, WAS ZUSAMMENGEHOERT. Die zwei UM Quick Actions sind am 08.09.
           ausdruecklich auf 24px gesetzt worden und muessen gleich WIRKEN; der Abstand unter der
           Linie ist absichtlich kleiner geblieben (16px) -- er war nicht gemeint. Bis dahin
           verlangte diese Zeile alle drei gleich, und meldete nach der Aenderung FALSCH fuer
           etwas, das so bestellt war. */
        log("   " + ja(Math.abs(g2-g3) < 1.2) + " die zwei um Quick Actions wirken gleich (" +
            z(g2) + " / " + z(g3) + ")");
        log("   (der Abstand unter der Linie ist mit " + z(g1) +
            "px absichtlich kleiner -- dort stehen 16px in der Datei, um Quick Actions 24)");
        log("");
      }
      /* ---- Der Abstand UEBER der Konto-Zeile (08.09.) ----
         Er ist nicht nur ein Abstand, er ist HOEHE: .usn-nav nimmt den ganzen Rest und scrollt,
         dieser Aussenabstand liegt ausserhalb des Scrollbereichs. Jeder Pixel davon ist ein
         Pixel weniger Liste. Darum wird beides gemessen -- der Abstand UND was die Liste dabei
         an Hoehe bekommt. */
      var accwrap=bar.querySelector(".usn-accwrap");
      if (accwrap && nav){
        var ca=v.getComputedStyle(accwrap);
        var luecke=r(accwrap).top - r(nav).bottom;
        log("KONTO-ZEILE UNTEN");
        log("   Abstand in der Datei " + ca.marginTop + "   gemessen " + z(luecke) + "px");
        log("   die Navigation ist damit " + z(r(nav).height) + "px hoch" +
            " (Leiste innen " + z(r(bar).height) + "px)");
        log("   " + ja(Math.abs(parseFloat(ca.marginTop) - 32) < 0.6) +
            " 32px, wie angefordert");
        log("   " + ja(Math.abs(luecke - 32) < 0.6) +
            " und gemessen sind es auch 32 (der Abstand liegt ausserhalb des Scrollbereichs)");
        log("");
      }
      log("KASTEN GEGEN KASTEN (das, was in der Datei steht)");
      var k1=z(r(qa).top - r(top).bottom), k2=z(r(nav).top - r(qa).bottom);
      log("   Team -> Quick Actions " + k1 + "px   Quick Actions -> Navigation " + k2 + "px");
      log("   (verschiedene Werte sind hier gewollt -- 24 ueber Quick Actions, 28 darunter. Der" +
          " Grund: oben grenzt der Abstand an eine Kastenkante OHNE Rahmen (man sieht den" +
          " Inhalt, 4.5px Luft je Seite), unten an eine MIT Rahmen. Begruendung in" +
          " sidebar.css, Urteil oben bei den sichtbaren Kanten.)");
      log("");
      log("SCHRIFT GEGEN SCHRIFT (nur noch ein Bericht, nicht mehr das Urteil)");
      log("   Solange der Quick-Actions-Knopf KEINEN Rahmen hatte, war seine Beschriftung die");
      log("   sichtbare Kante -- damals fiel das Urteil hier. Seit dem 08.09. hat er einen");
      log("   Rahmen, und dann nimmt das Auge die Kastenkante: das Urteil steht oben bei den");
      log("   sichtbaren Kanten. Die Zahlen hier bleiben stehen, weil sie erklaeren, warum die");
      log("   Kastenabstaende in der Datei NICHT alle gleich sind.");
      if (!name || !qaLbl){ log("   ABBRUCH: Teamname oder Quick-Actions-Beschriftung fehlt"); return; }
      var s1=z(r(qaLbl).top - r(name).bottom), s2=z(r(kopf).top - r(qaLbl).bottom);
      log("   Teamname " + z(r(name).height) + "px hoch in " + z(r(top).height) + "px Zeile" +
          "   Beschriftung " + z(r(qaLbl).height) + "px in " + z(r(qa).height) + "px" +
          "   Ueberschrift " + z(r(kopf).height) + "px");
      log("   Teamname -> Beschriftung " + s1 + "px   Beschriftung -> Ueberschrift " + s2 + "px");
      log("   (Bericht, kein Urteil) Schriftabstaende " + z(s1) + " / " + z(s2));
      log("   Unterschied " + z(s1-s2) + "px");
      log("");
      log("   Zum Nachrechnen: der Abstand unter Quick Actions muesste " +
          z(parseFloat(v.getComputedStyle(nav).marginTop) + (s1 - s2)) +
          "px sein, damit beide Schriften gleich weit auseinanderstehen" +
          " (jetzt " + v.getComputedStyle(nav).marginTop + ")");
      log("FERTIG");
    });
  });
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"")); });
</script>
