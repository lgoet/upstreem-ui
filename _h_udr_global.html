<meta charset="utf-8"><title>Globaler Kalender: zehn Picker, ein Klick</title>
<style>html,body{margin:0;font:13px/1.5 system-ui,sans-serif}
#out{font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;padding:10px;background:#f6f6f6}</style>
<body><iframe id="rahmen" style="width:1280px;height:520px;border:0"></iframe><pre id="out">laeuft…</pre>
<script>
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
var IDS=["dates_v2_dashboard","dates_v2_prompts","dates_v2_citations","dates_v2_brands",
         "dates_v2_performance","dates_v2_prompt_spotlight","dates_v2_domainspotlight",
         "dates_v2_urlspotlight","dates_v2_company_spotlight","dates_v2_export"];
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function wurzelAus(h){ return h.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim(); }
var T=null, ladungen=0;
function prefs(){ try { return JSON.parse(window.localStorage.getItem("up_prefs")||"{}"); } catch(e){ return {}; } }
function bauen(prefs, ohneBootFn, ohneBruecke, urlPreset){
  return Promise.all([hol("core.css"),hol("filters/date-range.css"),hol("core.js"),
                      hol("filters/date-range.js"),hol("filters/bubble/date_range_bubble.html")])
  .then(function(t){
    T=t;
    /* NEUES iframe-Element und nicht document.open() im alten. document.open() legt ein neues
       DOKUMENT an, aber dasselbe WINDOW: window.UpstreemCore aus dem vorigen Aufbau ueberlebt,
       die Verdraengungssperre in core.js laesst das zweite core.js gar nicht laufen, und dessen
       Einstellungs-Cache (_prefs) steht noch auf dem alten Stand. Gemessen: Phase 9 schrieb
       date_preset=last3 in den Speicher und bekam last7 zurueck -- und Phase 8 bestand aus
       demselben Grund mit der richtigen Zahl aus dem falschen Grund. */
    var alt=document.getElementById("rahmen");
    var neu=document.createElement("iframe");
    neu.id="rahmen"; neu.setAttribute("style", alt.getAttribute("style"));
    neu.addEventListener("load", function(){ ladungen++; });
    alt.parentNode.replaceChild(neu, alt);
    /* Mit urlPreset braucht der Rahmen eine ECHTE URL: about:blank hat kein location.search,
       und genau das liest der Kalender. Also eine leere Datei vom Server, mit Query. */
    if (urlPreset !== undefined){
      neu.src = "_h_leer.html" + (urlPreset ? "?range=" + urlPreset : "?leer=1");
      return new Promise(function(ok){
        neu.addEventListener("load", function(){ ok(bestuecken(neu.contentDocument)); }, { once:true });
      });
    }
    var d=neu.contentDocument;
    d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0;padding:8px'></body></html>"); d.close();
    return bestuecken(d);
    function bestuecken(d){
    var v=d.defaultView;
    try { if (prefs) v.localStorage.setItem("up_prefs", JSON.stringify(prefs));
          else v.localStorage.removeItem("up_prefs"); } catch(e){}
    /* Reload beobachten statt zulassen: die Fassung im Rahmen ruft location.reload() -- wir
       zaehlen den Aufruf und laden von Hand neu, damit der Test in der Hand bleibt. */
    /* location.reload laesst sich NICHT ueberschreiben -- der erste Anlauf tat es und der Rahmen
       lud danach wirklich neu, wodurch alle Referenzen starben. Der Reload wird stattdessen am
       load-Ereignis des Rahmens gezaehlt, und die Einstellungen liest der ELTERN-Kontext: ein
       about:blank-Rahmen erbt den Ursprung, localStorage ist also derselbe Speicher. */
    /* Die drei Bubble-Funktionen zaehlen -- das ist die Zahl, um die es geht */
    v.__ruf = { from:0, to:0, range:0, apply:0, boot:0 };
    if (ohneBruecke){
      /* Nichts am Fenster: genau der Zustand, in dem der Kalender auf der echten Seite mountet. */
      [t[0],t[1]].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
      var w0=d.createElement("div"); w0.innerHTML=wurzelAus(t[4]);
      var r0=w0.querySelector(".udr-root");
      r0.setAttribute("data-instance","dates_v2_dashboard"); r0.setAttribute("data-cdn-pin","t");
      r0.setAttribute("data-range-apply-fn","bubble_fn_udr_apply");
      r0.setAttribute("data-range-apply-delay","0");
      r0.setAttribute("data-isdark","no");
      d.body.appendChild(r0);
      var jA=d.createElement("script"); jA.textContent=t[2]; d.head.appendChild(jA);
      var jB=d.createElement("script"); jB.textContent=t[3]; d.head.appendChild(jB);
      return new Promise(function(ok){ setTimeout(function(){ ok(d); },900); });
    }
    v.__letzte = null;             /* das JSON des letzten range-Aufrufs, fuer Grund und Datum */
    v.bubble_fn_udr_date_from  = function(d2){ v.__ruf.from++; v.__von = d2; };
    v.bubble_fn_udr_date_to    = function(d2){ v.__ruf.to++;   v.__bis = d2; };
    v.bubble_fn_udr_date_range = function(j){ v.__ruf.range++;
      try { v.__letzte = JSON.parse(j); } catch(e){ v.__letzte = { kaputt: String(j) }; } };
    /* Der ZWEITE Kanal -- der, der auf der Seite nachlaedt. Er ist die Zahl, um die es hier geht:
       beim Aufbau und beim Ansichtswechsel muss er 0 bleiben, sonst laedt die Seite zweimal. */
    v.bubble_fn_udr_apply = function(){ v.__ruf.apply++; };
    /* Der AUFBAU-Kanal: setzt auf der echten Seite nur die zwei States, ohne Refresh.
       ohneBootFn laesst ihn weg -- fuer den Rueckfall-Test. */
    if (!ohneBootFn) v.bubble_fn_udr_date_boot = function(j){ v.__ruf.boot++;
      try { v.__letzte = JSON.parse(j); } catch(e){ v.__letzte = { kaputt: String(j) }; } };
    v.__warn=[]; var aw=v.console.warn;
    v.console.warn=function(){ v.__warn.push([].join.call(arguments," ")); return aw.apply(this,arguments); };
    /* showView der Host-App nachstellen -- MUSS vor core.js stehen, core umschliesst es beim
       Start. Der Stub merkt sich die Aufrufe, damit auch bewiesen ist, dass das Original
       weiterhin laeuft und nicht vom Wrapper geschluckt wird. */
    v.__views = [];
    v.showView = function(n){ v.__views.push(String(n)); };
    [t[0],t[1]].forEach(function(c){ var s=d.createElement("style"); s.textContent=c; d.head.appendChild(s); });
    var s2=d.createElement("style"); s2.textContent="*,*::before,*::after{transition:none!important;animation:none!important}";
    d.head.appendChild(s2);
    var vorlage=wurzelAus(t[4]);
    IDS.forEach(function(id){
      var w=d.createElement("div"); w.innerHTML=vorlage;
      var r=w.querySelector(".udr-root");
      r.setAttribute("data-instance", id); r.setAttribute("data-cdn-pin","t");
      r.setAttribute("data-range-apply-fn", "bubble_fn_udr_apply");
      r.setAttribute("data-range-apply-delay", "0");
      r.setAttribute("data-isdark","no");
      d.body.appendChild(r);
    });
    var j=d.createElement("script"); j.textContent=t[2]; d.head.appendChild(j);
    var j2=d.createElement("script"); j2.textContent=t[3]; d.head.appendChild(j2);
    return new Promise(function(ok){ setTimeout(function(){ ok(d); },1600); });
    }
  });
}
/* Wie bauen(), nur ohne den Aufbau-Kanal am window -- fuer den Rueckfall-Test. */
function bauenOhneBootFn(prefs){ return bauen(prefs, true); }
/* Der Rahmen mit einem ?range= in der URL. about:blank nimmt kein replaceState mit Pfad, also
   bekommt der Rahmen eine echte Datei mit Query -- eine leere Seite aus dem Server. */
function bauenMitUrl(prefs, preset){
  return bauen(prefs, false, false, preset).then(function(d){ return { d:d, v:d.defaultView }; });
}
/* Wie bauen(), aber die bubble_fn_* kommen erst, wenn bruecke() gerufen wird -- so verhaelt sich
   Bubble beim Seitenaufbau (gemessen auf der echten Seite: bei ms 229 existierte keine einzige). */
function bauenOhneBruecke(prefs){
  return bauen(prefs, false, true).then(function(d){
    var v=d.defaultView;
    return { d:d, v:v, bruecke: function(){
      v.bubble_fn_udr_date_from  = function(x){ v.__ruf.from++; v.__von=x; };
      v.bubble_fn_udr_date_to    = function(x){ v.__ruf.to++;   v.__bis=x; };
      v.bubble_fn_udr_date_range = function(j){ v.__ruf.range++;
        try { v.__letzte=JSON.parse(j); } catch(e){} };
      v.bubble_fn_udr_apply      = function(){ v.__ruf.apply++; };
      v.bubble_fn_udr_date_boot  = function(j){ v.__ruf.boot++;
        try { v.__letzte=JSON.parse(j); } catch(e){} };
    } };
  });
}
function schalter(d,id){ return d.querySelector('[data-instance="'+id+'"] [data-udr-sync]'); }
function label(d,id){ var e=d.querySelector('[data-instance="'+id+'"] .udr-label'); return e?e.textContent.trim():"?"; }

bauen(null).then(function(d){
  var v=d.defaultView;
  log("PHASE 1  Schalter AUS (Vorgabe)");
  log("   Picker gebaut: "+d.querySelectorAll(".udr-root").length+
      "   Bubble-Aufrufe beim Aufbau: "+JSON.stringify(v.__ruf));
  /* Die Uebergabe laeuft jetzt AUCH mit ausgeschaltetem Schalter -- ein Moment fuer beide Faelle.
     Erwartet: genau eine (drei Funktionen), Grund "boot", Vorgabe-Zeitraum, kein Nachladen. */
  var s7a=new Date(); s7a.setHours(0,0,0,0); s7a.setDate(s7a.getDate()-6);
  function isoA(x){ return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
  log("   von="+v.__von+"   bis="+v.__bis);
  /* Der Range-Kanal MUSS beim Aufbau still sein: an ihm haengt auf der Seite der Workflow, der
     nachlaedt. Nur die zwei Datums-States werden gesetzt. */
  log("   Aufbau-Kanal="+v.__ruf.boot+"  Range="+v.__ruf.range+"  Apply="+v.__ruf.apply+
      "   JSON: "+JSON.stringify(v.__letzte));
  /* Auch mit ausgeschaltetem Schalter wird uebergeben, genau einmal. Zwischenzeitlich hatte ich
     hier eine Ausnahme eingebaut ("Schalter aus -> nichts zu korrigieren"). Sie war falsch: auf
     der echten Seite gibt es kein Startup-Event mehr, das den Anfangszeitraum setzt, also lief
     ohne Uebergabe gar keiner (gemessen: p_date_from: null). Ein doppelter Ladevorgang mit
     richtigen Daten ist schlimm, ein einzelner ohne Daten schlimmer. */
  log("   ==> "+(v.__ruf.boot===1&&v.__ruf.range===0&&v.__ruf.apply===0&&
                 v.__ruf.from===0&&v.__ruf.to===0&&
                 v.__letzte&&v.__letzte.date_from===isoA(s7a)&&v.__letzte.reason==="boot"
        ? "RICHTIG (GENAU EIN Bubble-Aufruf: der Aufbau-Kanal, Vorgabe 7 Tage)"
        : "FALSCH -- "+(v.__ruf.range>0?"der Nachlade-Kanal feuert"
                       :(v.__ruf.boot===0?"kein Zeitraum: die RPCs laufen ohne Datum"
                                         :"falsches Datum"))));
  var mit=IDS.filter(function(id){ return !!schalter(d,id); });
  var ohne=IDS.filter(function(id){ return !schalter(d,id); });
  log("   Schalter DA bei:    "+mit.join(", "));
  log("   Schalter FEHLT bei: "+ohne.join(", "));
  log("   ==> "+(ohne.length===5 && ohne.every(function(id){return /export|spotlight/.test(id);})
        ? "RICHTIG (Export und die vier Spotlights nehmen nicht teil)" : "FALSCH"));
  /* Schalter klicken -> speichern + Reload anfordern */
  ladungen=0;
  schalter(d,"dates_v2_prompts").click();
  return new Promise(function(ok){ setTimeout(ok,900); });
}).then(function(d){
  var p=prefs();
  log("PHASE 2  Klick auf den Schalter");
  log("   gespeichert: date_sync="+p.date_sync+"  date_preset="+p.date_preset+
      "   ==> "+(p.date_sync==="on"&&p.date_preset?"RICHTIG":"FALSCH"));
  log("   Rahmen hat neu geladen: "+(ladungen>0?"ja ("+ladungen+")":"NEIN")+
      "   ==> "+(ladungen>0?"RICHTIG":"FALSCH"));
}).then(function(){
  return bauen({ date_sync:"on", date_preset:"last30" });
}).then(function(d){
  var v=d.defaultView;
  log("PHASE 3  nach dem Reload, Schalter AN, gespeichert last30");
  log("   Bubble-Aufrufe beim Aufbau: "+JSON.stringify(v.__ruf));
  /* DER GEMELDETE FEHLER: das Datum, das bei Bubble ankommt. 30 Tage muessen 30 Tage sein. */
  var soll30 = new Date(); soll30.setHours(0,0,0,0); soll30.setDate(soll30.getDate()-29);
  function isoV(d2){ return d2.getFullYear()+"-"+String(d2.getMonth()+1).padStart(2,"0")+"-"+String(d2.getDate()).padStart(2,"0"); }
  log("   JSON am Aufbau-Kanal: "+JSON.stringify(v.__letzte));
  log("   date_from soll "+isoV(soll30)+" (30 Tage)   ist "+(v.__letzte&&v.__letzte.date_from));
  log("   ==> "+(v.__letzte&&v.__letzte.date_from===isoV(soll30)&&v.__ruf.boot===1&&
                 v.__ruf.from===0&&v.__ruf.to===0
        ? "RICHTIG (30 Tage, GENAU EIN Aufruf)" : "FALSCH -- der gemeldete Fehler"));
  log("   Range-Kanal="+v.__ruf.range+"  Apply-Kanal="+v.__ruf.apply+
      "   ==> "+(v.__ruf.range===0&&v.__ruf.apply===0
        ? "RICHTIG (beide still -- kein zweiter Ladevorgang)"
        : "FALSCH -- die Seite laedt doppelt"));
  log("   Beschriftungen: prompts=\""+label(d,"dates_v2_prompts")+"\"  brands=\""+
      label(d,"dates_v2_brands")+"\"  export=\""+label(d,"dates_v2_export")+"\"");
  log("   getUpstreemDateRange(): "+JSON.stringify(v.getUpstreemDateRange()));
  /* Presets pruefen: last6 muss gesperrt sein */
  var men=d.querySelector('[data-instance="dates_v2_prompts"] .udr-menu');
  var b6=men.querySelector('[data-preset="last6"]'), b30=men.querySelector('[data-preset="last30"]');
  log("   last6 gesperrt="+b6.disabled+"   last30 gesperrt="+b30.disabled+
      "   ==> "+(b6.disabled && !b30.disabled?"RICHTIG":"FALSCH"));
  /* DER KERNTEST: ein Preset-Klick bei zehn Pickern */
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0};
  d.querySelector('[data-instance="dates_v2_prompts"] .udr-trigger').click();
  return new Promise(function(ok){ setTimeout(function(){
    d.querySelector('[data-instance="dates_v2_prompts"] [data-preset="last7"]').click();
    setTimeout(function(){ ok(d); },500);
  },300); });
}).then(function(d){
  var v=d.defaultView, r=v.__ruf;
  log("PHASE 4  EIN Preset-Klick bei zehn Pickern");
  log("   Bubble-Aufrufe: from="+r.from+"  to="+r.to+"  range="+r.range+"  SUMME="+(r.from+r.to+r.range));
  log("   ==> "+(r.from===1&&r.to===1&&r.range===1
        ? "RICHTIG (drei, nicht dreissig)" : "FALSCH -- Lawine oder nichts gefeuert"));
  /* GEGENPROBE zu Phase 3: ein echter Klick MUSS den seitenweiten Kanal treffen und den Grund
     "user" tragen. Ohne diese Zeile waere "apply=0" oben nur der Beweis, dass der Kanal tot ist. */
  log("   seitenweiter Kanal (apply): "+r.apply+"   Grund: \""+(v.__letzte&&v.__letzte.reason)+"\"");
  log("   ==> "+(r.apply===1&&v.__letzte&&v.__letzte.reason==="user"
        ? "RICHTIG (der Klick laedt nach, der Aufbau nicht)" : "FALSCH"));
  var p={}; try { p=JSON.parse(v.localStorage.getItem("up_prefs")||"{}"); } catch(e){}
  log("   gespeichert: date_preset="+p.date_preset);
  log("   Beschriftungen still nachgezogen: brands=\""+label(d,"dates_v2_brands")+
      "\"  citations=\""+label(d,"dates_v2_citations")+"\"  (Export bleibt) export=\""+
      label(d,"dates_v2_export")+"\"");
  /* upstreemDatesActivate: genau drei Aufrufe */
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0};
  v.upstreemDatesActivate("brands");
  return new Promise(function(ok){ setTimeout(function(){ ok(d); },400); });
}).then(function(d){
  var r=d.defaultView.__ruf;
  log("PHASE 5  upstreemDatesActivate(\"brands\")");
  log("   Bubble-Aufrufe: boot="+r.boot+" from="+r.from+" to="+r.to+" range="+r.range+" apply="+r.apply+
      "   Grund=\""+(d.defaultView.__letzte&&d.defaultView.__letzte.reason)+"\"");
  log("   ==> "+(r.boot===1&&r.from===0&&r.to===0&&r.range===0&&r.apply===0
        ? "RICHTIG (EIN Aufruf ueber den Aufbau-Kanal -- States, kein Nachladen)":"FALSCH"));
  /* PHASE 6: Ansichtswechsel ueber showView -- ohne jeden Bubble-Schritt */
  var v=d.defaultView;
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0}; v.__views=[];
  v.showView("citations");
  return new Promise(function(ok){ setTimeout(function(){ ok(d); },400); });
}).then(function(d){
  var v=d.defaultView, r=v.__ruf;
  log("PHASE 6  showView(\"citations\") -- kein Bubble-Schritt, core umschliesst showView");
  log("   boot="+r.boot+" from="+r.from+" to="+r.to+" range="+r.range+" apply="+r.apply);
  log("   ==> "+(r.boot===1&&r.range===0&&r.apply===0&&r.from===0&&r.to===0
        ? "RICHTIG (EIN stiller Aufruf: States der Ansicht, kein Nachladen)"
        : "FALSCH -- "+(r.range>0?"Nachlade-Kanal":"keine Uebergabe: die Ansicht laedt mit null")));
  log("   Original-showView lief weiter: "+JSON.stringify(v.__views)+
      "   ==> "+(v.__views.length===1&&v.__views[0]==="citations"?"RICHTIG":"FALSCH"));
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0};
  v.showView("citations");
  return new Promise(function(ok){ setTimeout(function(){ ok(d); },400); });
}).then(function(d){
  var v=d.defaultView, r=v.__ruf;
  log("   zweites Mal dieselbe Ansicht: SUMME="+(r.from+r.to+r.range)+
      "   ==> "+(r.from+r.to+r.range===0?"RICHTIG (schon uebergeben, kein zweiter Workflow)":"FALSCH"));
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0};
  v.showView("prompt_spotlight");
  return new Promise(function(ok){ setTimeout(function(){ ok(d); },400); });
}).then(function(d){
  var r=d.defaultView.__ruf;
  log("   Spotlight aktiviert: SUMME="+(r.from+r.to+r.range)+
      "   ==> "+(r.from+r.to+r.range===0?"RICHTIG (nimmt nicht teil)":"FALSCH"));
}).then(function(){
  return bauen(null);           /* Schalter aus */
}).then(function(d){
  var v=d.defaultView;
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0};
  v.showView("citations");
  return new Promise(function(ok){ setTimeout(function(){ ok(d); },400); });
}).then(function(d){
  var v=d.defaultView, r=v.__ruf;
  log("PHASE 7  Schalter AUS: der Ansichtswechsel muss still bleiben");
  log("   Bubble-Aufrufe beim Ansichtswechsel: SUMME="+(r.from+r.to+r.range)+
      "   ==> "+(r.from+r.to+r.range===0
        ? "RICHTIG (ohne Schalter loest ein Ansichtswechsel nichts aus)" : "FALSCH"));
  /* PHASE 8: DER GEMELDETE DOPPELDURCHLAUF. Beim Aufbau hat die automatische Uebergabe schon
     gefeuert; ruft Bubbles Startup-Event danach upstreemDatesBoot(), darf NICHTS mehr passieren.
     Vorher feuerte es ein zweites Mal, und der ganze Page-Load-Durchlauf lief zweimal. */
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0}; v.__letzte=null; v.__warn=[];
  var erg=v.upstreemDatesBoot("dashboard");
  return new Promise(function(ok){ setTimeout(function(){ ok({d:d,erg:erg}); },400); });
}).then(function(st){
  var d=st.d, v=d.defaultView, r=v.__ruf;
  log("PHASE 8  upstreemDatesBoot() NACH der automatischen Uebergabe (der Doppeldurchlauf)");
  log("   Aufrufe: from="+r.from+" to="+r.to+" range="+r.range+" apply="+r.apply);
  log("   Rueckgabe: "+JSON.stringify(st.erg));
  log("   ==> "+(r.from+r.to+r.range+r.apply+r.boot===0
        ? "RICHTIG (Nullvorgang -- kein zweiter Durchlauf)"
        : "FALSCH -- der ganze Page-Load laeuft zweimal"));
  log("   Konsole: "+(v.__warn.filter(function(w){ return /zu spaet/.test(w); })[0]||"(nichts)"));
  log("   ==> "+(v.__warn.some(function(w){ return /zu spaet/.test(w); })
        ? "RICHTIG (sagt, dass der Schritt raus kann)" : "FALSCH -- still verpufft"));
  /* PHASE 9: date-range.js ZWEIMAL geladen -- zwei Komponenten, zwei CDN-Einbindungen. Jeder
     Lauf baut seine eigene CONTROLLERS-Liste und uebergab vorher jeweils einmal. */
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0}; v.__warn=[];
  var j=d.createElement("script"); j.textContent=T[3]; d.head.appendChild(j);
  return new Promise(function(ok){ setTimeout(function(){ ok(d); },900); });
}).then(function(d){
  var v=d.defaultView, r=v.__ruf;
  log("PHASE 9  date-range.js ein ZWEITES Mal geladen");
  log("   Aufrufe: from="+r.from+" to="+r.to+" range="+r.range+" apply="+r.apply+" boot="+r.boot+
      "   Picker im Dokument: "+d.querySelectorAll(".udr-root").length);
  log("   ==> "+(r.from+r.to+r.range+r.apply+r.boot===0
        ? "RICHTIG (der zweite Lauf uebergibt nicht noch einmal)"
        : "FALSCH -- doppelte Einbindung = doppelter Durchlauf"));
  /* PHASE 10: der frische Aufbau mit Schalter AN muss weiter genau EINMAL uebergeben --
     die Gegenprobe zu 8 und 9. Ohne sie waere "0 Aufrufe" auch mit einem toten Merker wahr. */
  return bauen({ date_sync:"on", date_preset:"last3" });
}).then(function(d){
  var v=d.defaultView, r=v.__ruf;
  function isoV(x){ return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
  var s3=new Date(); s3.setHours(0,0,0,0); s3.setMonth(s3.getMonth()-3);
  log("PHASE 10  Gegenprobe: frischer Aufbau, Schalter AN (last3)");
  log("   Aufrufe: from="+r.from+" to="+r.to+" boot="+r.boot+" range="+r.range+" apply="+r.apply);
  log("   date_from soll "+isoV(s3)+"   ist "+(v.__letzte&&v.__letzte.date_from));
  log("   ==> "+(r.boot===1&&r.range===0&&r.apply===0&&
                 v.__letzte&&v.__letzte.date_from===isoV(s3)&&v.__letzte.preset==="last3"
        ? "RICHTIG (genau eine Uebergabe -- der Merker sperrt nicht die neue Seite)" : "FALSCH"));
  /* PHASE 11: OHNE Aufbau-Kanal. Dann muss der Range-Kanal einspringen -- eine Seite ohne
     Zeitraum ist schlimmer als eine, die zweimal laedt -- und die Konsole muss sagen, was fehlt. */
  return bauenOhneBootFn({ date_sync:"on", date_preset:"last30" });
}).then(function(d){
  var v=d.defaultView, r=v.__ruf;
  log("PHASE 11  ohne bubble_fn_udr_date_boot: Rueckfall auf den Range-Kanal");
  log("   Aufrufe: boot="+r.boot+" range="+r.range+" apply="+r.apply+
      "   JSON: "+JSON.stringify(v.__letzte));
  log("   ==> "+(r.boot===0&&r.range===1&&r.apply===0&&v.__letzte&&v.__letzte.reason==="boot"
        ? "RICHTIG (Zeitraum kommt an, statt still auszufallen)" : "FALSCH"));
  var w=(v.__warn||[]).filter(function(x){ return /date_boot/.test(x); })[0];
  log("   Konsole: "+(w?w.slice(0,150)+" ...":"(nichts)"));
  log("   ==> "+(w?"RICHTIG (sagt, welches Element fehlt)":"FALSCH -- still"));
  /* PHASE 12: BUBBLES BRUECKE KOMMT SPAET -- der gemeldete Fall. Beim Mounten des Kalenders gibt
     es noch keine bubble_fn_*; sie erscheinen erst 1,2s spaeter. Erwartet: der Kalender wartet und
     uebergibt dann GENAU EINMAL ueber den Aufbau-Kanal -- kein Range, kein Apply, also auch kein
     zweiter Ladevorgang. Das ist die Sorge "wenn wir spaeter feuern, feuert der RPC doppelt". */
  return bauenOhneBruecke({ date_sync:"on", date_preset:"last30" });
}).then(function(o){
  var v=o.v;
  log("PHASE 12  Bubbles Bruecke erscheint erst nach 1,2s");
  log("   direkt nach dem Mount: "+JSON.stringify(v.__ruf)+
      "   ==> "+(v.__ruf.boot+v.__ruf.range+v.__ruf.apply===0
        ? "RICHTIG (nichts ins Leere gefeuert)" : "FALSCH"));
  /* Jetzt die Bruecke aufsetzen, wie Bubble es tut. */
  o.bruecke();
  return new Promise(function(ok){ setTimeout(function(){ ok(o); },1400); });
}).then(function(o){
  var v=o.v, r=v.__ruf;
  var soll=new Date(); soll.setHours(0,0,0,0); soll.setDate(soll.getDate()-29);
  function isoZ(x){ return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
  log("   nachdem sie da ist: boot="+r.boot+" range="+r.range+" apply="+r.apply);
  log("   JSON: "+JSON.stringify(v.__letzte));
  log("   ==> "+(r.boot===1&&r.range===0&&r.apply===0&&r.from===0&&r.to===0&&
                 v.__letzte&&v.__letzte.date_from===isoZ(soll)
        ? "RICHTIG (GENAU EIN Aufruf -- kein zweiter Ladevorgang moeglich)"
        : "FALSCH -- "+(r.range>0?"der Nachlade-Kanal hat gefeuert":"keine Uebergabe")));
  var log2=(v.__udrLog||[]);
  var wartete=log2.filter(function(e){ return e.art==="aufbau-wartet"; }).length;
  var fertig=log2.filter(function(e){ return e.art==="aufbau"; })[0];
  log("   Spur: "+wartete+"x aufbau-wartet, dann aufbau nach "+(fertig?fertig.wartete_ms:"?")+"ms");
  /* >=250, nicht >=1000: gewartet wird ab dem Mount des Pickers, und der liegt im Prueftand
     schon 900ms vor dem Aufsetzen der Bruecke -- die Erwartung 1000 war meine, nicht die des
     Codes. Was zaehlt: es wurde MINDESTENS eine Runde gewartet und die Spur sagt es. */
  log("   ==> "+(wartete===1&&fertig&&fertig.wartete_ms>=250
        ? "RICHTIG (hat gewartet und es steht in der Spur)"
        : "FALSCH -- "+(fertig?"wartete_ms="+fertig.wartete_ms:"kein aufbau-Eintrag")));
  /* GEGENPROBE: der Merker darf einen GESCHEITERTEN Versuch nicht als erledigt zaehlen.
     Genau das war der zweite Fehler -- der Ansichtswechsel wurde danach uebersprungen. */
  var uebersprungen=log2.filter(function(e){ return e.art==="ansicht-uebersprungen"; }).length;
  log("   uebersprungene Ansichtswechsel: "+uebersprungen+
      "   ==> "+(uebersprungen===0?"RICHTIG (kein Fehlversuch hat sich als erledigt vermerkt)":"FALSCH"));
  /* Die URL-Mechanik wird NICHT hier geprueft: der Kalender liest die URL nur im obersten
     Fenster (window === window.top), und in einem Rahmen-Prueftand ist das nie der Fall. Sie hat
     einen eigenen Prueftand, der selbst das oberste Fenster ist: _h_udr_url.html. */
  /* DER GEMELDETE FALL (03.09.): Dashboard mit last30 aufgebaut, Wechsel zu Citations, dort auf
     last3, dann ZURUECK zum Dashboard. Kalender und URL stehen auf last3, die Zahlen im Dashboard
     sind aber die von last30 -- weil State-Setzen nichts nachlaedt. Erwartet: beim Zurueckkehren
     laeuft der Nachlade-Kanal EINMAL fuer das Dashboard, und nur fuer das. */
  return bauen({ date_sync:"on", date_preset:"last30" });
}).then(function(d){
  /* DIE STARTANSICHT ist die, die beim Aufbau sichtbar ist -- hier alle, also nimmt der Nachtrag
     sie alle mit. Auf der echten Seite ist genau eine sichtbar. Wichtig ist: KEIN showView fuer
     sie, denn genau daran ist der erste Anlauf gescheitert. */
  var v=d.defaultView;
  v.showView("dashboard");
  return new Promise(function(ok){ setTimeout(function(){ ok(d); },500); });
}).then(function(d){
  /* Im Dashboard auf last3 wechseln -- ein echter Klick. */
  d.querySelector('[data-instance="dates_v2_dashboard"] .udr-trigger').click();
  return new Promise(function(ok){ setTimeout(function(){
    d.querySelector('[data-instance="dates_v2_dashboard"] [data-preset="last3"]').click();
    setTimeout(function(){ ok(d); },500);
  },300); });
}).then(function(d){
  var v=d.defaultView;
  log("VERALTET  Aufbau auf Citations -> Dashboard -> last3 -> ZURUECK zu Citations");
  log("   Beschriftung Citations jetzt: \""+label(d,"dates_v2_citations")+"\" (still nachgezogen)");
  var st=(v.__udrLog||[]).filter(function(e){ return e.art==="startansicht"; });
  log("   Startansicht nachgetragen fuer: "+(st.map(function(e){ return e.instanz; }).join(", ")||"(keine)"));
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0};
  v.showView("citations");
  return new Promise(function(ok){ setTimeout(function(){ ok(d); },600); });
}).then(function(d){
  var v=d.defaultView, r=v.__ruf;
  var sp=(v.__udrLog||[]).filter(function(e){ return e.art==="veraltet"; }).pop();
  log("   beim Zurueckkehren zu Citations: boot="+r.boot+" apply="+r.apply+" range="+r.range);
  log("   Spur: "+(sp?("geladen_mit="+sp.geladen_mit+"  jetzt="+sp.jetzt):"(keine veraltet-Zeile)"));
  log("   ==> "+(r.boot===1 && r.apply===1 && r.range===0 && sp
        ? "RICHTIG (States gesetzt UND einmal nachgeladen -- nur diese Ansicht)"
        : "FALSCH -- "+(r.apply===0?"kein Nachladen: die Zahlen bleiben vom alten Zeitraum"
                       :(r.apply>1?"mehr als einmal nachgeladen":"unerwartete Aufrufe"))));
  /* GEGENPROBE: NOCHMAL zum Dashboard, ohne Aenderung dazwischen. Jetzt darf NICHT nachgeladen
     werden -- sonst laedt jeder Ansichtswechsel nach und wir sind wieder beim Doppel. */
  v.__ruf={from:0,to:0,range:0,apply:0,boot:0};
  v.showView("dashboard");
  return new Promise(function(ok){ setTimeout(function(){
    v.showView("citations");
    setTimeout(function(){ ok(d); },600);
  },500); });
}).then(function(d){
  var r=d.defaultView.__ruf;
  log("   GEGENPROBE zweiter Wechsel ohne Aenderung: apply="+r.apply+
      "   ==> "+(r.apply===0
        ? "RICHTIG (kein Nachladen ohne Grund -- der Vergleich ist also echt)"
        : "FALSCH -- jeder Wechsel laedt nach"));
  /* OHNE data-range-apply-fn: das Nachladen kann nicht gehen -- aber es muss es SAGEN.
     Auf der echten Seite stand in der Spur nur "range-apply  fn: null  getroffen: false", und die
     Ansicht blieb still mit den alten Zahlen stehen. */
  var v3=d.defaultView;
  [].forEach.call(d.querySelectorAll(".udr-root"), function(r3){ r3.removeAttribute("data-range-apply-fn"); });
  v3.__warn=[]; var aw=v3.console.warn; v3.console.warn=function(){ v3.__warn.push([].join.call(arguments," ")); return aw.apply(this,arguments); };
  v3.__udrApplyFnGesagt = false;
  v3.__ruf={from:0,to:0,range:0,apply:0,boot:0};
  d.querySelector('[data-instance="dates_v2_dashboard"] .udr-trigger').click();
  return new Promise(function(ok){ setTimeout(function(){
    d.querySelector('[data-instance="dates_v2_dashboard"] [data-preset="last7"]').click();
    /* Zaehler NACH dem Klick zurueck: der Klick feuert den Range-Kanal selbst, und der erste
       Anlauf hat ihn mitgezaehlt und deshalb range=2 gemeldet. Gezaehlt werden soll nur, was der
       Ansichtswechsel ausloest. */
    setTimeout(function(){
      v3.__ruf={from:0,to:0,range:0,apply:0,boot:0};
      v3.showView("citations"); setTimeout(function(){ ok(d); },700);
    },500);
  },300); });
}).then(function(d){
  var v3=d.defaultView, r=v3.__ruf, el=d.querySelector('[data-instance="dates_v2_citations"]');
  log("OHNE data-range-apply-fn  (der Fall auf der echten Seite)");
  log("   Aufrufe beim Wechsel: boot="+r.boot+"  range="+r.range+"  apply="+r.apply);
  log("   Attribute an der Wurzel: data-range-apply=\""+el.getAttribute("data-range-apply")+
      "\"  data-range-reason=\""+el.getAttribute("data-range-reason")+"\"");
  /* reason MUSS "user" sein: ein Snippet mit der Bedingung reason === "user" haette ein "stale"
     geblockt -- der Range-Kanal feuert dann richtig und trotzdem laedt nichts nach. */
  log("   ==> reason "+(el.getAttribute("data-range-reason")==="user"
        ? "RICHTIG (\"user\" -- eine Bedingung auf reason blockt das Nachladen nicht)"
        : "FALSCH -- \""+el.getAttribute("data-range-reason")+"\" wuerde ein Snippet blocken"));
  var jr={}; try { jr=JSON.parse(el.getAttribute("data-range-json")||"{}"); } catch(e){}
  log("   ==> JSON traegt den echten Grund: \""+jr.reason+"\" "+
      (jr.reason==="stale"?"RICHTIG":"FALSCH"));
  var j=el.getAttribute("data-range-json")||"";
  log("   data-range-json: "+(j?j.slice(0,60)+"…":"(leer)"));
  log("   ==> "+(r.boot===1 && r.range===1 && el.getAttribute("data-range-apply")==="yes" && /"last7"/.test(j)
        ? "RICHTIG (Rueckfall auf den Range-Kanal -- der Weg, den die Seite ohnehin hat)"
        : "FALSCH -- "+(r.range===0?"kein Nachladen: die Ansicht bleibt beim alten Zeitraum"
                       :"Attribute stimmen nicht")));
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: "+e.message+"\n"+(e.stack||"").split("\n").slice(0,3).join("\n")); });
</script>
