<meta charset="utf-8"><title>onboarding: Weltkarte im Formular</title>
<style>html,body{margin:0;font:13px/1.5 Geist,system-ui,sans-serif}
#b{padding:0} #out{padding:10px;font:11px/1.45 ui-monospace,monospace;white-space:pre-wrap}</style>
<body><div id="b"></div><pre id="out">laeuft…</pre>
<script>
/* Die Karte darf NUR beim Formular stehen, darf keine Bildlaufleiste erzeugen und muss hinter dem
   Inhalt liegen. ?dark=1 dunkel, ?w=420 schmal (dort ist sie aus), ?step=... anderer Schritt.
   Das Stylesheet wird hier als <style> eingehaengt, nicht als <link> -- der relative Pfad in der
   Maske loest damit gegen localhost auf, und die Datei liegt im Wurzelverzeichnis. Auf der echten
   Seite kommt die CSS als <link> vom CDN, dort loest derselbe Pfad gegen den Pin auf. */
["uobStart","uobStep","uobTopics","uobWorkflowStart","uobSelect","uobFinish","uobExit"].forEach(function(n){
  window["bubble_fn_"+n]=function(){}; });
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){ return r.text(); }); }
function wurzelAus(h){ return h.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim(); }
var D=["core.css","core.js","onboarding-page.css","onboarding-page.js",
       "bubble/onboarding_page_bubble.html","_h_uob_eastside_voll.json"];
var T={};
Promise.all(D.map(hol)).then(function(t){
  D.forEach(function(f,i){ T[f]=t[i]; });
  ["core.css","onboarding-page.css"].forEach(function(f){ var s=document.createElement("style"); s.textContent=T[f]; document.head.appendChild(s); });
  [ "core.js","onboarding-page.js"].forEach(function(f){ var j=document.createElement("script"); j.textContent=T[f]; document.head.appendChild(j); });
  return new Promise(function(ok){ setTimeout(ok,600); });
}).then(function(){
  var q=new URL(window.location.href).searchParams;
  var dunkel=q.get("dark")==="1", breite=q.get("w"), schritt=q.get("step")||"";
  if (breite) document.getElementById("b").style.width = breite+"px";
  document.body.style.background = dunkel ? "#0f0f10" : "#fff";
  var u=new URL(window.location.href);
  if (schritt) u.searchParams.set("step",schritt); else u.searchParams.delete("step");
  window.history.replaceState({}, "", u.toString());
  var w=document.createElement("div"); w.innerHTML=wurzelAus(T["bubble/onboarding_page_bubble.html"]);
  var r=w.querySelector(".uob-root"); var id="we"+Math.random().toString(36).slice(2,7);
  r.setAttribute("data-instance",id); r.setAttribute("data-cdn-pin","we");
  r.setAttribute("data-isdark", dunkel?"yes":"no");
  document.getElementById("b").appendChild(r);
  var n=0; (function warte(){ if (r.__uobController || n++>40){
    /* Ohne Buendel bleibt es beim Formular. Mit ?step=topics kommt eins, damit ein anderer
       Schritt sichtbar wird -- die Karte muss dort AUS sein. */
    if (schritt) window.setOnboardingBundle(id, T["_h_uob_eastside_voll.json"]);
    /* Warten, bis der ZIELSCHRITT wirklich steht. Der erste Versuch hat 700ms nach dem Aufbau
       gemessen und dabei das Bootskelett erwischt: is-form war noch nicht gesetzt, die Maske stand
       auf "none", und der Waehler fetchte die Adresse "none" -- 404. Gemessen wurde also der
       Ladezustand, nicht die Karte. */
    var wunsch = schritt || "brand";
    var m = 0;
    /* Warten, bis der Zielschritt steht UND die Breite sich nicht mehr aendert. Zwei Messungen
       hintereinander mit demselben Wert -- und NICHT gegen window.innerWidth vergleichen: das ist
       hier 0, sobald das Browserfenster im Hintergrund liegt, und die Bedingung waere nie erfuellt.
       (Genau daran hing der Aufbau eine Minute lang.)
       Der Grund fuer das Warten: zweimal hat dieser Aufbau 160px Ueberlauf gemeldet, den es nicht
       gab -- gemessen waehrend des Layouts. Deshalb steht die Breite jetzt auch im Ergebnis: ein
       Ueberlauf, der bei 32px Wurzelbreite gemessen wurde, ist kein Befund. */
    var letzteBreite = -1;
    (function bereit(){
      var pn = r.querySelector('.uob-pane:not(.is-off)');
      var b = r.clientWidth;
      var steht = b > 400 && b === letzteBreite;
      letzteBreite = b;
      if ((pn && pn.getAttribute("data-pane") === wunsch && steht) || m++ > 40) return los();
      setTimeout(bereit, 80);
    })();
    function los(){ setTimeout(function(){
      var vor = window.getComputedStyle(r, "::before");
      var pane = r.querySelector(".uob-pane:not(.is-off)");
      /* Laedt die Maskendatei wirklich? Der berechnete Wert sagt nur, dass eine Adresse dasteht. */
      var adresse = (vor.maskImage || vor.webkitMaskImage || "").replace(/^url\(["']?|["']?\)$/g, "");
      fetch(adresse, {cache:"no-store"}).then(function(a){
        document.getElementById("out").textContent = JSON.stringify({
          schritt: pane ? pane.getAttribute("data-pane") : "-",
          klasseIsForm: r.classList.contains("is-form"),
          schmal: r.classList.contains("is-narrow"),
          maskeAdresse: adresse,
          maskeStatus: a.status,
          maskeBytes: a.headers.get("content-length"),
          /* content und nicht display: getComputedStyle liefert display auch fuer ein
             Pseudoelement, das gar keinen Kasten erzeugt. Ohne content kein Kasten. */
          inhalt: vor.content,
          anzeige: vor.display,
          deckkraft: vor.opacity,
          ebene: vor.zIndex,
          farbe: vor.backgroundColor,
          groesse: vor.maskSize || vor.webkitMaskSize,
          lage: vor.maskPosition || vor.webkitMaskPosition,
          stapel: window.getComputedStyle(r).isolation,
          wurzelBreite: r.clientWidth,
          ueberlaufWurzel: r.scrollWidth - r.clientWidth,
          ueberlaufSeite: document.documentElement.scrollWidth - document.documentElement.clientWidth
        }, null, 1);
        window.__fertig=true;
      });
    }, 300); }
  } else setTimeout(warte,60); })();
});
</script>
