<!doctype html><meta charset="utf-8">
<title>Tabellen: mit Skelett starten, nie mit dem Leerzustand</title>
<pre id="out" style="font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;white-space:pre-wrap"></pre>
<div id="rahmen"></div>
<script>
/* Gemeldet am 07.09. und davor schon mehrfach: beim allerersten Aufbau der URLs-Tabelle stand
   fuer eine Sekunde "No URLs" da, bevor die Ladeanimation losging. Ein Leerzustand ist eine
   AUSSAGE ("es gibt nichts") -- die darf nicht dastehen, bevor jemand gefragt hat.

   Geprueft wird der Zustand DIREKT nach dem Mounten, ohne einen einzigen Setter-Aufruf: so
   kommt die Tabelle auf der Seite an, bevor der erste RPC zurueck ist. Vier Tabellen, und dazu
   die Gegenprobe, ohne die der Riegel eine Falle waere: nach der Notbremse muss der Leerzustand
   erscheinen, sonst dreht eine Tabelle ohne Daten ewig.
   Dieselbe Uebersetzungsfrage steht hier mit drin: die Typ-Spalte kommt aus einer Tabellenzelle,
   und die faesst der Sprachlauf absichtlich nicht an. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function warte(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function ja(b){ return b ? "RICHTIG" : "FALSCH"; }

var TAB = [
  { name:"urls-table",      css:"urls-table.css",      js:"urls-table.js",
    vorlage:"bubble/urls_table_bubble.html",      wurzel:"uut-root", leer:".up-empty" },
  { name:"domains-table",   css:"domains-table.css",   js:"domains-table.js",
    vorlage:"bubble/domains_table_bubble.html",   wurzel:"udt-root", leer:".up-empty" },
  { name:"responses-table", css:"responses-table.css", js:"responses-table.js",
    vorlage:"bubble/responses_table_bubble.html", wurzel:"urt-root", leer:".up-empty" },
  { name:"prompts-table",   css:"prompts-table.css",   js:"prompts-table.js",
    vorlage:"bubble/prompts_table_bubble.html",   wurzel:"upt-root", leer:".up-empty" }
];

function baue(k, t){
  var f = document.createElement("iframe");
  f.style.cssText = "width:1240px;height:200px;border:1px solid #ccc;display:block;margin-bottom:6px";
  document.getElementById("rahmen").appendChild(f);
  var d = f.contentDocument, v = f.contentWindow;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  try { v.localStorage.clear(); } catch(e){}
  try { v.localStorage.setItem("up_prefs", JSON.stringify({ locale:"de" })); } catch(e){}
  try { v.localStorage.setItem("pref_theme", "light"); } catch(e){}
  /* Den ERSTEN Fehler im Rahmen mit vollem Stapel festhalten -- "Cannot read properties of
     undefined" ohne Aufrufer ist eine Meldung, keine Diagnose. */
  v.__fehler = [];
  v.addEventListener("error", function(e){
    v.__fehler.push(String(e.message) + "\n" + ((e.error && e.error.stack) || "(kein Stapel)"));
  });
  [t.core_css, t.css].forEach(function(c){ var st=d.createElement("style"); st.textContent=c; d.head.appendChild(st); });
  var roh = t.vorlage.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim();
  var w = d.createElement("div"); w.innerHTML = roh;
  var r = w.querySelector("." + k.wurzel) || w.firstElementChild;
  r.setAttribute("data-instance", k.name + "_start"); r.setAttribute("data-cdn-pin","t");
  r.setAttribute("data-isdark","no");
  d.body.appendChild(r);
  var j1=d.createElement("script"); j1.textContent=t.core_js; d.head.appendChild(j1);
  var j2=d.createElement("script"); j2.textContent=t.js; d.head.appendChild(j2);
  return warte(2200).then(function(){ return { d:d, v:v, r:r }; });
}

hol("core.css").then(function(coreCss){ return hol("core.js").then(function(coreJs){
  return { core_css: coreCss, core_js: coreJs };
}); }).then(function(kern){
  var ergebnis = [];
  function naechste(i){
    if (i >= TAB.length) return Promise.resolve();
    var k = TAB[i];
    return Promise.all([hol(k.css), hol(k.js), hol(k.vorlage)]).then(function(t){
      return baue(k, { core_css:kern.core_css, core_js:kern.core_js, css:t[0], js:t[1], vorlage:t[2] });
    }).then(function(u){
      var d = u.d;
      var skel = d.querySelectorAll(".up-sk, .up-skel, [class*='-sk']").length;
      var leerEl = d.querySelector(k.leer);
      var leerSichtbar = !!(leerEl && !leerEl.hidden &&
        u.v.getComputedStyle(leerEl).display !== "none");
      ergebnis.push({ name: k.name, skel: skel, leer: leerSichtbar });
      log("   " + k.name.padEnd(17," ") + " Skelettteile: " + String(skel).padStart(3," ") +
          "   Leerzustand sichtbar: " + leerSichtbar);
      return naechste(i + 1);
    }, function(e){
      log("   " + k.name.padEnd(17," ") + " ABBRUCH: " + e.message);
      return naechste(i + 1);
    });
  }
  log("1) DIREKT NACH DEM MOUNTEN, ohne einen einzigen Setter-Aufruf");
  return naechste(0).then(function(){
    var schlecht = ergebnis.filter(function(e){ return e.leer; });
    log("   ==> " + ja(ergebnis.length === TAB.length && !schlecht.length) +
        " (keine Tabelle zeigt einen Leerzustand)" +
        (schlecht.length ? "  -- betroffen: " + schlecht.map(function(e){ return e.name; }).join(", ") : ""));
    log("");
    /* ---- DER GEMELDETE FALL ---------------------------------------------------------------
       "beim allerersten Laden ist fuer eine Sekunde der No-URLs-Platzhalter sichtbar, bevor es
       in loading/Skelett geht". Er entsteht NICHT aus dem Anfangszustand -- renderTable zeigt
       ohne Daten ohnehin ein Skelett --, sondern aus einem LEEREN Datensatz, den Bubble vor dem
       echten schickt: damit gilt die Tabelle als "hat Daten, hat aber keine Zeilen", und der
       Gnadenweg in renderTable zeigt nach seinem Fenster den Leerzustand.
       Genau das wird hier nachgestellt: leerer Datensatz, warten, nachsehen. */
    var f = document.querySelectorAll("#rahmen iframe")[0];
    var d = f.contentDocument, v = f.contentWindow;
    function leerDa(){
      var e = d.querySelector(".up-empty");
      return !!(e && !e.hidden && v.getComputedStyle(e).display !== "none");
    }
    /* Der Setter heisst renderUrlsTable, nicht setUrlsTable -- steht so in urls-table.js:1581.
       Der erste Anlauf riet den Namen und brach mit "is not a function" ab. */
    v.renderUrlsTable(JSON.stringify({ instance_id:"urls-table_start", rows:[], total_count:0 }));
    log("2) BUBBLE SCHICKT ZUERST EINEN LEEREN DATENSATZ");
    return warte(2500).then(function(){
      var zwischen = leerDa();
      log("   nach 2,5s: Leerzustand sichtbar = " + zwischen);
      log("   ==> " + ja(!zwischen) +
          " (das Skelett bleibt stehen -- der Leerzustand ist eine Aussage und keine Zwischenstufe)");
      /* Und der echte Datensatz danach: er muss die Zeilen zeigen. */
      v.renderUrlsTable(JSON.stringify({ instance_id:"urls-table_start", total_count:1,
        rows:[{ url:"https://example.com/a", url_type:"article", citations:5, share_pct:12.5 }] }));
      return warte(1200).then(function(){
        var zeilen = d.querySelectorAll(".up-row").length;
        var typ = d.querySelector(".uut-tag-lbl");
        log("3) DANACH DER ECHTE DATENSATZ");
        log("   Zeilen: " + zeilen + "   Typ-Chip: \"" + (typ ? typ.textContent.trim() : "(keiner)") + "\"");
        log("   ==> " + ja(zeilen > 0) + " (die Daten kommen an)");
        log("   ==> " + ja(typ && /Artikel/.test(typ.textContent)) +
            " (der Typ steht auf Deutsch -- die Zelle uebersetzt der Sprachlauf nicht)");
        log("");
        /* ---- DAS LOGO IM SPALTENKOPF -----------------------------------------------------
           Gemeldet am 07.09.: "im urls table fehlt jetzt in der Kopfspalte das Logo vor
           'erwaehnt', bei responses ist es noch da". Beide Dateien machten dasselbe -- nur
           baute responses die zwei Elemente selbst, wenn das Bubble-Markup sie nicht mitbringt,
           und urls-table stieg in dem Fall aus. Hier wird genau dieser Fall nachgestellt: die
           Elemente werden aus dem Markup ENTFERNT, dann kommen die Markendaten. */
        var kopf = d.querySelector(".up-th-ment") || d.querySelector(".up-th-mentioned");
        [].forEach.call((kopf || d).querySelectorAll(".up-th-brandlogo, .up-th-mentlbl"),
                        function(e){ e.parentNode.removeChild(e); });
        d.querySelector(".uut-root").setAttribute("data-brand-logo", "https://example.com/l.png");
        d.querySelector(".uut-root").setAttribute("data-brand-name", "Volkswagen");
        v.renderUrlsTable(JSON.stringify({ instance_id:"urls-table_start", total_count:1,
          rows:[{ url:"https://example.com/a", url_type:"article", citations:5, share_pct:12.5 }] }));
        return warte(900).then(function(){
          var logo = d.querySelector(".up-th-brandlogo");
          var lbl  = d.querySelector(".up-th-mentlbl");
          log("4) DER SPALTENKOPF, wenn das Markup Logo und Beschriftung NICHT mitbringt");
          log("   Logo gebaut: " + !!logo + "   sichtbar: " +
              (logo ? v.getComputedStyle(logo).display !== "none" : false) +
              "   Beschriftung: \"" + (lbl ? lbl.textContent.trim() : "(keine)") + "\"");
          log("   ==> " + ja(!!logo && !!lbl && v.getComputedStyle(logo).display !== "none") +
              " (die Komponente baut sich beides selbst -- wie responses-table es laengst tut)");
          log("FERTIG");
        });
      });
    });
  });
}).catch(function(e){ log("ABBRUCH: " + e.message + "\n" + (e.stack||"").split("\n").slice(0,3).join("\n")); });
</script>
