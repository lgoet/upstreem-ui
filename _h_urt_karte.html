<meta charset="utf-8"><title>Responses-Karte: Hover an den Raendern</title>
<style>html,body{margin:0;font:13px/1.5 system-ui,sans-serif}
#out{font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;padding:10px;background:#f6f6f6}</style>
<body><div id="halter"></div><pre id="out">laeuft…</pre>
<script>
/* Zwei Meldungen vom 04.09. zum Karten-Modus:
   a) der gruene Haken (eigene Marke erwaehnt) geht beim Hover nicht mit, das "+N" schiebt sich
      darueber
   b) bei den Citation-Chips steht das "+N" im Hover-Zustand am rechten Rand, ohne Polster

   Gemessen wird mit echten Rechtecken -- Ueberlappung in Pixeln und Abstand zur Innenkante der
   Karte. Der Hover wird ueber :hover gebraucht, den ein synthetisches mouseover NICHT erzeugt;
   im verdeckten Panel gibt es keinen Zeiger. Deshalb wird die Hover-WIRKUNG gemessen, indem die
   Transform-Regel von Hand angewandt wird -- dieselbe, die :hover setzt. Was dabei geprueft wird,
   ist die Geometrie, nicht die Frage, ob :hover feuert. */
var L=[]; function log(t){ L.push(t); document.getElementById("out").textContent=L.join("\n"); }
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error(f+" -> "+r.status); return r.text(); }); }
function wurzelAus(h){ return h.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim(); }
var D=null;
function marke(n){ return { name:"Brand "+n, brand_name_raw:"Brand "+n }; }
/* citationsChips liest title und favicon -- nicht domain/favicon_url. Der erste Anlauf gab die
   falschen Felder, brandStack filterte alle Chips als "ohne Namen und ohne Logo" weg, und der
   Prueftand meldete "Testdaten zu klein". Eine leere Messung, kein Befund. */
function quelle(n){ return { title:"Seite "+n, favicon:"" }; }
Promise.all([hol("core.css"),hol("responses-table.css"),hol("core.js"),hol("responses-table.js"),
             hol("bubble/responses_table_bubble.html")]).then(function(t){
  var f=document.createElement("iframe"); f.setAttribute("style","width:1100px;height:620px;border:0");
  document.getElementById("halter").appendChild(f);
  var d=f.contentDocument; D=d;
  d.open(); d.write("<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0'></body></html>"); d.close();
  var v=d.defaultView;
  try { v.localStorage.removeItem("up_prefs"); v.localStorage.removeItem("pref_theme"); } catch(e){}
  [t[0],t[1]].forEach(function(c){ var s=d.createElement("style"); s.textContent=c; d.head.appendChild(s); });
  /* TRANSITIONS AUS. Ohne diese Zeile hat der Prueftand dreimal denselben Fehlschluss gebaut:
     .up-stack-vis traegt transition: transform .16s -- unmittelbar nach dem Setzen der Klasse
     liefert getComputedStyle den STARTWERT, also identity, und jede Messung sagt "Hover = Ruhe".
     Genau so sind die falschen RICHTIGs von vorhin entstanden. */
  var sT=d.createElement("style");
  sT.textContent="*,*::before,*::after{transition:none!important;animation:none!important}";
  d.head.appendChild(sT);
  var w=d.createElement("div"); w.innerHTML=wurzelAus(t[4]);
  var r=w.querySelector(".urt-root")||w.querySelector(".up-root");
  r.setAttribute("data-instance","k"); r.setAttribute("data-cdn-pin","k"); r.setAttribute("data-isdark","no");
  /* Der Karten-Modus haengt an data-default-view, nicht an der Klasse: das MARKUP ist ein anderes
     (renderCards statt Tabellenzeilen). Der erste Anlauf setzte nur is-cards-view und fand keine
     Karte -- eine leere Messung, kein Befund. */
  r.setAttribute("data-default-view","cards");
  d.body.appendChild(r);
  var j=d.createElement("script"); j.textContent=t[2]; d.head.appendChild(j);
  var j2=d.createElement("script"); j2.textContent=t[3]; d.head.appendChild(j2);
  return new Promise(function(ok){ setTimeout(ok,1800); });
}).then(function(){
  var d=D, v=d.defaultView;
  var reihen=[{ id:"1", run_at:new Date().toISOString(), prompt_text:"Was kostet X?",
    response_preview:"Antwort…", has_user_brand:"yes",
    companies_preview:[marke(1),marke(2),marke(3),marke(4)], companies_preview_totalcount:9,
    sources_preview:[quelle(1),quelle(2),quelle(3),quelle(4),quelle(5)], sources_totalcount:12 }];
  v.renderResponsesTable(JSON.stringify({ instanceId:"k", view_active:"yes", totalCount:1, rows:reihen }));
  return new Promise(function(ok){ setTimeout(ok,1200); });
}).then(function(){
  return new Promise(function(ok){ setTimeout(function(){ ok(); },600); });
}).then(function(){
  var d=D, v=d.defaultView;
  var karte=d.querySelector(".urt-card");
  if (!karte){ log("ABBRUCH: keine Karte gerendert -- Karten-Modus nicht aktiv"); log("FERTIG"); return; }
  var cs=v.getComputedStyle(karte);
  var innenRechts = karte.getBoundingClientRect().right - parseFloat(cs.paddingRight);
  var bStack=d.querySelector(".urt-card-brands .up-stack");
  var bMore=d.querySelector(".urt-card-brands .up-stack-more");
  var tail=d.querySelector(".urt-card-brands .up-stack-tail");
  var cMore=d.querySelector(".urt-card-citations .up-stack-more");
  log("a) GRUENER HAKEN im Marken-Stapel");
  log("   Haken liegt IM Stapel: "+(!!tail)+"   (up-stack-tail)");
  log("   ==> "+(tail?"RICHTIG (die Geschwister-Regeln erreichen ihn)":"FALSCH -- er steht daneben"));
  if (tail && bMore){
    /* Die Hover-Wirkung von Hand: dieselbe Verschiebung, die .up-stack-item:hover setzt. */
    var vorMore=bMore.getBoundingClientRect(), vorTail=tail.getBoundingClientRect();
    var lueckeVor=Math.round(vorTail.left-vorMore.right);
    [].forEach.call(d.querySelectorAll(".urt-card-brands .up-stack-more, .urt-card-brands .up-stack-tail"),
      function(e){ e.style.transform="translateX(16px)"; });
    var nachMore=bMore.getBoundingClientRect(), nachTail=tail.getBoundingClientRect();
    var lueckeNach=Math.round(nachTail.left-nachMore.right);
    log("   Luecke +N -> Haken:  ohne Hover "+lueckeVor+"px   mit Hover "+lueckeNach+"px");
    log("   ==> "+(lueckeVor===lueckeNach
      ? "RICHTIG (beide gehen gleich weit, nichts schiebt sich darueber)"
      : "FALSCH -- die Luecke aendert sich um "+(lueckeNach-lueckeVor)+"px"));
    [].forEach.call(d.querySelectorAll(".urt-card-brands .up-stack-more, .urt-card-brands .up-stack-tail"),
      function(e){ e.style.transform=""; });
  }
  /* ---- b) DIE CITATION-CHIPS, MIT ECHTEM HOVER ---------------------------------------------
     Die erste Fassung hat hier die Hover-WIRKUNG von Hand nachgebaut ("dieselbe Verschiebung,
     die :hover setzt") und dabei genau das nicht gemessen, worum es geht -- sie hat zwei
     Ruhezustaende verglichen und "ohne Hover 744px / mit Hover 744px" gemeldet. Zwei gleiche
     Zahlen waren der Hinweis, und ich habe ihn als Bestaetigung gelesen.

     Jetzt werden die ECHTEN Regeln benutzt: jede geladene Regel, deren Selektor ":hover"
     enthaelt, wird einmal geklont, mit ".uhov" statt ":hover", und angehaengt. Damit gelten
     dieselben Deklarationen, dieselben Kombinatoren (~) und dieselben :has()-Ketten -- nur
     ausgeloest durch eine Klasse, die auch ein verdecktes Panel setzen kann, wo es keinen Zeiger
     und kein :hover gibt.
     Gegenprobe direkt darunter: ohne die Klasse MUSS eine andere Zahl herauskommen. */
  var regeln = 0;
  (function hoverAlsKlasse(){
    var aus = [];
    [].forEach.call(d.styleSheets, function(ss){
      var rs; try { rs = ss.cssRules; } catch(e){ return; }
      [].forEach.call(rs || [], function(r){
        if (!r.selectorText || r.selectorText.indexOf(":hover") < 0) return;
        aus.push(r.selectorText.replace(/:hover/g, ".uhov") + "{" + r.style.cssText + "}");
      });
    });
    regeln = aus.length;
    var st = d.createElement("style"); st.textContent = aus.join("\n"); d.head.appendChild(st);
  })();
  log("b) CITATION-CHIPS mit echtem Hover (" + regeln + " Hover-Regeln geklont)");

  var karten = d.querySelector(".urt-cards");
  /* Die rechte Kante von allem, was man SIEHT. Der 4px-Ring der Chips (box-shadow) zaehlt mit:
     er steht in keinem Rechteck, ist aber gemalt -- und genau er beruehrt sonst das Polster. */
  /* .up-stack-vis, NICHT .up-stack-item: die Verschiebung beim Hover sitzt auf der Sichtebene
     INNEN. Der zweite Fehlgriff derselben Sorte -- die erste Fassung las die Chip-Kaesten, die
     sich nie bewegen, und meldete darum "Hover = Ruhe" fuer jede Breite. Erst die Gegenprobe an
     der linken Kante hat es gezeigt: zwei gleiche Zahlen, wo eine Verschiebung sein muss.
     Der 4px-Ring (box-shadow) zaehlt mit: er steht in keinem Rechteck, ist aber gemalt. */
  function rechtesteKante(){
    var max = -1e9;
    [].forEach.call(d.querySelectorAll(".urt-card-citations .up-stack-vis"), function(c){
      max = Math.max(max, c.getBoundingClientRect().right + 4);
    });
    var m = d.querySelector(".urt-card-citations .up-stack-more");
    if (m) max = Math.max(max, m.getBoundingClientRect().right);
    return max;
  }
  function linkesteKante(){
    var min = 1e9;
    [].forEach.call(d.querySelectorAll(".urt-card-citations .up-stack-vis"), function(c){
      min = Math.min(min, c.getBoundingClientRect().left - 4);
    });
    return min;
  }
  function innenRechtsVon(k){
    var cs = v.getComputedStyle(k);
    return k.getBoundingClientRect().right - parseFloat(cs.paddingRight) - parseFloat(cs.borderRightWidth || 0);
  }
  function messen(){
    var k = d.querySelector(".urt-card");
    var chips = d.querySelectorAll(".urt-card-citations .up-stack-item");
    var iR = innenRechtsVon(k), schlimm = 0, wer = -1;
    for (var i = 0; i < chips.length; i++){
      chips[i].classList.add("uhov");
      var ueber = rechtesteKante() - iR;
      if (ueber > schlimm){ schlimm = ueber; wer = i; }
      chips[i].classList.remove("uhov");
    }
    return { ueber: Math.round(schlimm), chip: wer, ruhe: Math.round(rechtesteKante() - iR),
             breite: Math.round(k.getBoundingClientRect().width), chips: chips.length };
  }

  /* GEGENPROBE ZUM MESSINSTRUMENT: die Klasse muss ueberhaupt etwas verschieben. Im
     links-spreizenden Stapel wandert beim Anfassen eines Chips alles VOR ihm nach links -- also
     wird die linke Kante beobachtet. Bewegt sie sich nicht, sind die geklonten Regeln nicht
     angekommen und jede Zahl darunter ist wertlos. */
  var chipsG = d.querySelectorAll(".urt-card-citations .up-stack-item");
  var linksRuhe = Math.round(linkesteKante());
  chipsG[chipsG.length - 1].classList.add("uhov");
  var linksHover = Math.round(linkesteKante());
  chipsG[chipsG.length - 1].classList.remove("uhov");
  log("   GEGENPROBE: linke Kante ohne Hover " + linksRuhe + "px, mit Hover " + linksHover + "px");
  log("   ==> " + (linksRuhe !== linksHover
        ? "RICHTIG (die geklonten Regeln wirken, die Messung ist echt)"
        : "FALSCH -- kein Unterschied: hier wurde nur zweimal der Ruhezustand gemessen"));

  /* Die Kartenbreiten, die die Komponente WIRKLICH annimmt: computeCardCols laesst keine Karte
     unter CARD_MIN_W (424px) zu -- mehr Spalten heisst nicht engere Karten, sondern gar keine
     weitere Spalte. Die 265px und 209px der ersten Fassung gibt es also nie; sie bleiben
     trotzdem stehen, als Reserve nach unten. 37 Quellen geben das breiteste Schild, 5 Quellen
     gar keins (dann ist der letzte CHIP das rechteste Ding, samt Ring). */
  var falsch = 0;
  [["1",12],["2",12],["2",37],["3",12],["4",12],["5",12],["2",5],["3",5],["4",5],["5",37]].forEach(function(fall){
    var sp = fall[0], gesamt = fall[1];
    karten.style.setProperty("--urt-cols", sp);
    /* Mit gesamt === Anzahl der Chips gibt es KEIN "+N" -- dann ist der letzte CHIP das
       rechteste Ding, samt Ring. Der Fall fehlte oben ganz. gesamt 37 gibt ein breites Schild. */
    v.renderResponsesTable(JSON.stringify({ instanceId:"k", view_active:"yes", totalCount:1,
      rows:[{ id:"1", run_at:new Date().toISOString(), prompt_text:"Was kostet X?",
        response_preview:"Antwort…", has_user_brand:"yes",
        companies_preview:[marke(1),marke(2),marke(3),marke(4)], companies_preview_totalcount:9,
        sources_preview:[quelle(1),quelle(2),quelle(3),quelle(4),quelle(5)],
        sources_totalcount:gesamt }] }));
    var m = messen();
    var ok = m.ueber <= 0;
    if (!ok) falsch++;
    log("   " + sp + " Spalten (" + m.breite + "px Karte), " + gesamt + " Quellen" +
        (gesamt === m.chips ? " (kein +N)" : "") + ":  Ruhe " + m.ruhe + "px" +
        "   schlimmster Hover " + m.ueber + "px" + (m.chip >= 0 ? " (Chip " + (m.chip + 1) + ")" : "") +
        "   " + (ok ? "RICHTIG" : "FALSCH -- ragt in das Polster"));
  });
  log("   ==> " + (falsch === 0
    ? "RICHTIG (in jeder Kartenbreite und in jedem Hover-Zustand innerhalb des Polsters)"
    : "FALSCH -- " + falsch + " Fall/Faelle ragen heraus"));
  karten.style.setProperty("--urt-cols","3");
  log("FERTIG");
}).catch(function(e){ log("ABBRUCH: "+e.message+"\n"+(e.stack||"").split("\n")[1]); });
</script>
