<script>
var W = document.getElementById("out");
function root(){ return document.getElementById("ask-mira"); }
function thema(t){ if (window.askMiraSetTheme) window.askMiraSetTheme(t); else root().setAttribute("data-theme", t);
  document.body.style.background = t === "dark" ? "#121212" : "#fff"; }
/* Die REIHENFOLGE von Bubble nachbauen: erst die Liste, dann die Nachrichten, dann der aktive
   Chat. Ohne setActiveChat faellt die Komponente nach 140ms absichtlich auf den Startschirm zurueck
   (_maybeHomeIfUnknownChat: Nachrichten ohne bekannten Chat sind ein inkonsistenter Zustand) -- der
   erste Messversuch hatte genau das gemessen und es sah nach einem Fehler in der Blende aus. */
function chatAuf(){
  window.askMiraSetPreviousChats(JSON.stringify([{ chat_id:"c1", title:"Citation sources", updated_at:"2026-08-27T09:00:00Z" }]));
  window.askMiraSetMessages(JSON.stringify([
    { message_id:"m1", role:"user",      content:"Which sources cite us most?" },
    { message_id:"m2", role:"assistant", content:"Here is what the last 30 days look like." }
  ]));
  window.askMiraSetActiveChat("c1");
}
function chatZu(){ window.askMiraSetActiveChat(null); window.askMiraSetMessages("[]"); }
var vst = null;
function verstaerken(){
  if (vst){ vst.remove(); vst = null; return; }
  vst = document.createElement("style"); vst.textContent = "#ask-mira{filter:brightness(6)}";
  document.head.appendChild(vst);
}
function messen(){
  var r = root(), sch = r.querySelector(".am-shell"), eb = r.querySelector(".am-bgart");
  var frisch = [].some.call(document.styleSheets, function(ss){
    try { return [].some.call(ss.cssRules, function(x){ return (x.cssText||"").indexOf(".am-bgart") >= 0; }); }
    catch(e){ return false; }
  });
  var o = { frisch_am_bgart_in_css: frisch, thema: r.getAttribute("data-theme"),
            hat_is_bgart: r.classList.contains("is-bgart"),
            hat_has_messages: r.classList.contains("has-messages"),
            ebene_im_dom: !!eb, kinder: eb ? eb.children.length : 0 };
  if (eb){
    var cs = getComputedStyle(eb);
    o.ebene = { opacity: cs.opacity, zIndex: cs.zIndex, position: cs.position,
                uebergang: cs.transitionProperty + " " + cs.transitionDuration,
                erstesKind: eb.firstChild ? eb.firstChild.className : null };
    ["licht","bogen","raster","marken"].forEach(function(k){
      var el = eb.querySelector(".up-bgart-" + k);
      if (!el) { o["L_" + k] = "FEHLT"; return; }
      var c = getComputedStyle(el);
      o["L_" + k] = c.opacity + " | " + (k === "licht"
        ? ((c.backgroundImage.match(/radial-gradient/g)||[]).length + " Verlaeufe")
        : ("Maske " + (c.maskImage !== "none") + " " + c.backgroundColor));
    });
    /* Deckt die Ebene etwas zu? Der Punkt in der Mitte des Eingabefeldes und in der Mitte der
       Kopfzeile muss die Komponente treffen und nicht die Ebene. */
    ["#am-composer", ".am-hero", "#am-welcome-title"].forEach(function(s){
      var t = r.querySelector(s); if (!t) { o["treffer" + s] = "nicht da"; return; }
      /* Erst in den Blick holen: elementFromPoint rechnet in FENSTERkoordinaten, und was unter dem
         unteren Rand liegt, gibt null zurueck -- das saehe aus wie "von der Ebene verdeckt". */
      t.scrollIntoView({ block: "center" });
      var b = t.getBoundingClientRect();
      var e = document.elementFromPoint(b.left + b.width/2, b.top + Math.min(12, b.height/2));
      o["treffer" + s] = e ? (e.className || e.tagName) : "ausserhalb des Fensters";
    });
  }
  o.altes_raster = sch ? getComputedStyle(sch, "::before").opacity : null;
  W.textContent = JSON.stringify(o, null, 1);
  return o;
}
setTimeout(messen, 400);
