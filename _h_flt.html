<!-- Pruefstand "More Filters leer" (27.09.). Baut die Werkzeugzeile der Prompts-Seite nach:
     vier Bubble-HTML-Elemente (Leiste + Topics/Models/Markets), jedes ein Behaelter, dessen Inhalt
     Bubble bei einer Aenderung per jQuery .html() NEU setzt -- also: alle Kinder DES BEHAELTERS
     raus, frisches Vorlagen-Markup rein. Eine Filterwurzel, die die Leiste zu sich gezogen hat,
     ist dann kein Kind des Behaelters mehr.
     ?s=<szenario>  &v=alt laedt die HEAD-Fassungen (*_alt.js) -- die Gegenprobe.
     Szenarien: s6 (Seitenaufbau mit Gruppierung: Leiste neu, Page-Load-Setter im Fenster; &grp=0
     ohne Gruppierung), s6k Gegenprobe, s6w (Filter sofort heimgeschickt; &ohneWatch=1 misst den
     Weg ueber die Leiste allein), s1/s1k (Listen je Instanz bzw. Store + Themenwechsel), s3
     (Auffrischen im Fenster, dann Reset + Laden), s7 (Instanz-Setter im Fenster), s8 (Leiste kurz
     ausgehaengt), s9 (&leiste=0: Filter allein), s10 (Reset-Verhalten), s11 (Auswahl und
     Ereignisse, &weg=1), kosten (Zaehler im Normalfall).
     dup0..dup3 (28.09.): Duplikate nach einem Neubau der FILTER-Elemente -- dup0 ohne Neubau
     (Gegenprobe), dup1 nur die Filter, dup2 alle vier (Themenwechsel), dup3 erst Filter, dann Leiste.
     Betrieb: der Server auf 8099 darf ~/Documents nicht lesen -- Dateien nach /private/tmp/uprt/flt
     kopieren, HEAD-Fassungen per git show als core_alt.js und filters/*_alt.js daneben. -->
<script>
/* UHR-ERSATZ. Im verdeckten Tab laufen setTimeout/setInterval erst nach >=1000ms und rAF gar
   nicht. Hier ueber MessageChannel, mit echter Zeit (performance.now): die Reihenfolge und die
   Abstaende bleiben, nur die Drosselung faellt weg. window.__uhrStop haelt alles an. */
(function(){
  var timers = {}, nid = 1, mc = new MessageChannel(), an = false, raf = [];
  function jetzt(){ return performance.now(); }
  function kick(){ if (!an && !window.__uhrStop){ an = true; mc.port2.postMessage(0); } }
  mc.port1.onmessage = function(){
    an = false;
    if (window.__uhrStop) return;
    var r = raf; raf = [];
    for (var i = 0; i < r.length; i++){ try { r[i](jetzt()); } catch(e){ window.__fehler && window.__fehler.push("raf: " + e.message); } }
    var t = jetzt(), due = [];
    for (var k in timers) if (timers[k].at <= t) due.push(timers[k]);
    due.sort(function(a, b){ return a.at - b.at || a.id - b.id; });
    for (var j = 0; j < due.length; j++){
      var tm = due[j];
      if (!timers[tm.id]) continue;
      if (tm.iv) tm.at = t + tm.ms; else delete timers[tm.id];
      try { tm.fn.apply(window, tm.args); } catch(e){ window.__fehler && window.__fehler.push("uhr: " + e.message); }
    }
    for (var x in timers){ kick(); return; }
    if (raf.length) kick();
  };
  function neu(fn, ms, args, iv){
    var id = nid++;
    timers[id] = { id: id, fn: typeof fn === "function" ? fn : new Function(String(fn)),
                   at: jetzt() + Math.max(0, +ms || 0), ms: Math.max(4, +ms || 0), args: args, iv: iv };
    kick(); return id;
  }
  window.setTimeout = function(fn, ms){ return neu(fn, ms, [].slice.call(arguments, 2), false); };
  window.setInterval = function(fn, ms){ return neu(fn, ms, [].slice.call(arguments, 2), true); };
  window.clearTimeout = window.clearInterval = function(id){ delete timers[id]; };
  window.requestAnimationFrame = function(cb){ raf.push(cb); kick(); return raf.length; };
  window.cancelAnimationFrame = function(){};
})();
window.__fehler = [];
window.addEventListener("error", function(e){ window.__fehler.push(String(e.message)); });
window.__ev = [];
["utfTopics_prompts","utfTopicsApply_prompts","umfModels_prompts","umfApply_prompts","umkMarkets_prompts","umkApply_prompts"].forEach(function(n){
  window["bubble_fn_" + n] = function(j){ window.__ev.push([n, j]); };
});
try { localStorage.clear(); } catch(e){}
var Q = new URLSearchParams(location.search), ALT = Q.get("v") === "alt", SZ = Q.get("s") || "s6";
function ext(f){ return ALT ? f.replace(/(\.js)$/, "_alt$1") : f; }
var T = "?t=" + Date.now();
["core.css","filters/filter-bar.css","filters/topics-filter.css","filters/models-filter.css","filters/markets-filter.css"]
  .forEach(function(f){ document.write('<link rel="stylesheet" href="' + f + T + '">'); });
</script>

<script>
/* Die Vorlagen: die Wurzeln aus filters/bubble/*.html, mit den festen Ids der Prompts-Seite.
   Der Loader steht als inertes Skript daneben -- er ist das Geschwister, an dem die Leiste sich
   beim ersten Einziehen die Heimatadresse merkt. */
var LADER = '<script type="text/x-lader"><\/script>';
var VORLAGE = {
  "c-bar": function(o){ return '<div class="up-root ufb-root" data-instance="filterbar_prompts" data-cdn-pin="x"' +
    ' data-isdark="' + (o.dunkel ? "yes" : "no") + '" data-topics-instance="topics_prompts"' +
    ' data-models-instance="models_prompts" data-markets-instance="markets_prompts"' +
    ' data-topics-visible="' + (o.gruppiert ? "no" : "yes") + '"></div>' + LADER; },
  "c-top": function(o){ return '<div class="up-root utf-root" data-instance="topics_prompts" data-cdn-pin="x"' +
    ' data-isdark="' + (o.dunkel ? "yes" : "no") + '" data-isprocessing="' + (o.laedt ? "yes" : "no") + '"' +
    ' data-topics-fn="bubble_fn_utfTopics_prompts" data-topics-apply-fn="bubble_fn_utfTopicsApply_prompts">' +
    '<script class="utf-topics-json" type="application/json">TOPICS_JSON<\/script></div>' + LADER; },
  "c-mod": function(o){ return '<div class="up-root umf-root" data-instance="models_prompts" data-cdn-pin="x"' +
    ' data-isdark="' + (o.dunkel ? "yes" : "no") + '" data-isprocessing="' + (o.laedt ? "yes" : "no") + '"' +
    ' data-models-fn="bubble_fn_umfModels_prompts" data-models-apply-fn="">' +
    '<script class="umf-models-json" type="application/json">MODELS_JSON<\/script></div>' + LADER; },
  "c-mkt": function(o){ return '<div class="up-root umk-root" data-instance="markets_prompts" data-cdn-pin="x"' +
    ' data-isdark="' + (o.dunkel ? "yes" : "no") + '" data-isprocessing="' + (o.laedt ? "yes" : "no") + '"' +
    ' data-markets-fn="bubble_fn_umkMarkets_prompts" data-markets-apply-fn="">' +
    '<script class="umk-markets-json" type="application/json">MARKETS_JSON<\/script></div>' + LADER; }
};
/* Genau das, was jQuery .html() mit einem Markup tut, das <script> enthaelt: empty() -- alle
   KINDER DES BEHAELTERS raus --, dann append. Was die Leiste woandershin gezogen hat, ist kein
   Kind mehr und bleibt, wo es ist. */
function bubbleSetzt(id, o){
  var c = document.getElementById(id);
  while (c.firstChild) c.removeChild(c.firstChild);
  c.insertAdjacentHTML("beforeend", VORLAGE[id](o || {}));
}
["c-bar","c-top","c-mod","c-mkt"].forEach(function(id){ bubbleSetzt(id, {}); });
/* ?leiste=0: die Filter stehen allein, ohne "More Filters" (Szenario s9). */
if (new URLSearchParams(location.search).get("leiste") === "0") document.getElementById("c-bar").innerHTML = "";

var TOPICS = [
  { id: "t1", name: "Leadgen", hex_light: "#2563eb", hex_dark: "#2563eb", prompt_count: 42 },
  { id: "t2", name: "Solar", hex_light: "#059669", hex_dark: "#059669", prompt_count: 31 },
  { id: "t3", name: "Waermepumpe", hex_light: "#d97706", hex_dark: "#d97706", prompt_count: 18 }
];
var MODELS = [
  { key: "gpt-4o",  display_name: "GPT-4o",        provider: "OpenAI",     is_active: true, logo_url: "" },
  { key: "claude",  display_name: "Claude Sonnet", provider: "Anthropic",  is_active: true, logo_url: "" },
  { key: "gemini",  display_name: "Gemini 2.0",    provider: "Google",     is_active: true, logo_url: "" },
  { key: "perplex", display_name: "Perplexity",    provider: "Perplexity", is_active: true, logo_url: "" }
];
var MARKETS = [
  { alpha2: "DE", name: "Germany",     prompt_count: 120 },
  { alpha2: "AT", name: "Austria",     prompt_count: 40 },
  { alpha2: "CH", name: "Switzerland", prompt_count: 22 }
];
/* Der Page-Load-Schritt der Seite: die drei seitenweiten Setter, roh als Text, wie ein
   Run-JS-Schritt sie uebergibt. */
function ladeStore(t, m, k){
  window.setUpstreemTopics(JSON.stringify(t || TOPICS));
  window.setUpstreemModels(JSON.stringify(m || MODELS));
  window.setUpstreemMarkets(JSON.stringify(k || MARKETS));
}
function ladeJeInstanz(t, m, k){
  window.setTopicsFilterTopics("topics_prompts", JSON.stringify(t || TOPICS));
  window.setModelsFilterModels("models_prompts", JSON.stringify(m || MODELS));
  window.setMarketsFilterMarkets("markets_prompts", JSON.stringify(k || MARKETS));
}

<script>
function w(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
var STORE = { utf: "__upTopics", umf: "__upModels", umk: "__upMarkets" };
var ZEILE = { utf: "utf-opt", umf: "umf-opt", umk: "umk-opt" };
var LEER  = { utf: "utf-empty", umf: "umf-empty", umk: "umk-empty" };
/* Was die Leiste JETZT zeigen wuerde: die Wurzel in ihrem Untermenue, deren Listenzeilen, der
   Leertext, und ob diese Wurzel noch beim seitenweiten Store angemeldet ist. */
function stand(){
  var bar = document.querySelector("#c-bar .ufb-root");
  var o = { leiste: bar ? (bar.__ufbCtrl ? "eingerichtet" : "ohne Controller") : "fehlt" };
  ["umf","umk","utf"].forEach(function(p){
    var alle = document.querySelectorAll("." + p + "-root");
    var drin = bar ? bar.querySelector("." + p + "-root") : null;
    var liste = drin ? drin.querySelector("." + p + "-list") : null;
    var leer = liste ? liste.querySelector("." + LEER[p]) : null;
    var S = window[STORE[p]];
    o[p] = {
      imDok: alle.length,
      inLeiste: !!drin,
      zeilen: liste ? liste.querySelectorAll("." + ZEILE[p]).length : null,
      leer: leer ? leer.textContent : "",
      abo: drin && S ? S.subs.some(function(s){ return s.owner === drin; }) : null,
      store: S ? S.list.length : null
    };
  });
  return o;
}
function kurz(o){
  function f(p){ var x = o[p]; return p + ": " + (x.inLeiste ? x.zeilen + " Zeilen" + (x.leer ? ' "' + x.leer + '"' : "") : "nicht in der Leiste") +
    " | abo " + x.abo + " | Store " + x.store + " | Wurzeln im Dok " + x.imDok; }
  return "Leiste " + o.leiste + "\n    " + f("umf") + "\n    " + f("umk") + "\n    " + f("utf");
}
async function oeffnen(){
  var bar = document.querySelector("#c-bar .ufb-root");
  var btn = bar && bar.querySelector(".ufb-btn");
  if (btn) btn.click();
  await w(80);
}

/* ZAEHLER: jede Frage nach dem Stand laeuft ueber UC.storeStand -- also laesst sich an genau
   einer Stelle zaehlen, WER fragt (sync, setModels, Aufbau) und wie oft nachgeholt wird. */
var Z = { fragen: {}, nachgeholt: 0 };
function zaehlerAn(){
  var UC = window.UpstreemCore;
  if (!UC || !UC.storeStand || UC.__gezaehlt) return;
  UC.__gezaehlt = 1;
  var orig = UC.storeStand;
  UC.storeStand = function(n){
    var st = String(new Error().stack || "");
    var wer = /\.sync /.test(st) ? (/nachziehen/.test(st) ? "sync von der Leiste" : /setOpen/.test(st) ? "sync beim Aufgehen" : /initRoot/.test(st) ? "sync beim Wiederaufnehmen" : "sync sonst")
            : /\.set(Models|Markets|Topics) /.test(st) ? "Liste gesetzt" : /\.reset /.test(st) ? "reset" : "Aufbau";
    Z.fragen[wer] = (Z.fragen[wer] || 0) + 1;
    return orig(n);
  };
  ["getModels","getMarkets","getTopics"].forEach(function(k){
    var o = UC[k];
    UC[k] = function(){ if (/\.sync /.test(String(new Error().stack || ""))) Z.nachgeholt++; return o.apply(UC, arguments); };
  });
}
function zaehlerText(){ return "Standfragen " + JSON.stringify(Z.fragen) + " | nachgeholte Listen " + Z.nachgeholt; }

/* DUPLIKATE (28.09.): Bubble baut die FILTER-Elemente neu, waehrend ihre Wurzeln in der Leiste
   stecken. Jede Wurzel traegt ihre Generation als Eigenschaft (kein Attribut -- das weckte die
   Beobachter der Komponenten): 1 = beim Seitenaufbau, 2 = nach dem ersten Neubau. Gezaehlt wird je
   Filter: Wurzeln im Dokument, in der Leiste (und welche Generation), daneben (und ob sichtbar). */
var GEN = 1;
function stempeln(){
  ["utf","umf","umk"].forEach(function(p){
    [].forEach.call(document.querySelectorAll("." + p + "-root"), function(r){ if (!r.__gen) r.__gen = GEN; });
  });
}
function dupStand(){
  var o = {};
  ["utf","umf","umk"].forEach(function(p){
    var alle = [].slice.call(document.querySelectorAll("." + p + "-root"));
    var drin = alle.filter(function(r){ return !!r.closest(".ufb-root"); });
    var drau = alle.filter(function(r){ return !r.closest(".ufb-root"); });
    var sicht = drau.filter(function(r){ return r.getClientRects().length > 0 && getComputedStyle(r).visibility !== "hidden"; });
    o[p] = { imDok: alle.length, inLeiste: drin.length, daneben: drau.length, sichtbar: sicht.length,
             genLeiste: drin.map(function(r){ return r.__gen || "?"; }).join(","),
             genDaneben: drau.map(function(r){ return r.__gen || "?"; }).join(","),
             auswahl: drin.map(function(r){ return r.classList.contains("has-sel") ? "ja" : "nein"; }).join(",") };
  });
  return o;
}
function dupKurz(o){
  return ["utf","umf","umk"].map(function(p){ var x = o[p];
    return p + ": im Dok " + x.imDok + " | in der Leiste " + x.inLeiste + (x.inLeiste ? " (Gen " + x.genLeiste + ", Auswahl " + x.auswahl + ")" : "") +
      " | daneben " + x.daneben + (x.daneben ? " (Gen " + x.genDaneben + ", sichtbar " + x.sichtbar + ")" : ""); }).join("\n    ");
}
function filterNeu(o){ ["c-top","c-mod","c-mkt"].forEach(function(id){ bubbleSetzt(id, o || {}); }); GEN++; stempeln(); }
async function dupStart(L){
  await w(900);
  ladeStore();
  window.setModelsFilterSelected("models_prompts", "gpt-4o");   /* eine Auswahl, die den Neubau ueberleben muss */
  await w(300);
  stempeln();
  L("1 Seitenaufbau: Leiste hat die Filter eingezogen, Models gewaehlt\n    " + dupKurz(dupStand()));
}
async function dupEnde(L){
  await oeffnen();
  var bar = document.querySelector("#c-bar .ufb-root");
  var m = bar && bar.querySelector(".umf-root");
  L("   More Filters offen: Models-Liste in der Leiste " + (m ? m.querySelectorAll(".umf-opt").length : "-") + " Zeilen" +
    " | Fehler " + JSON.stringify(window.__fehler));
}

/* RESET GEGEN NEUBAU (01.10.): "ein Filterchip ist nach resetFilterBar stehengeblieben, die Daten
   waren richtig". Gemessen wird, was die LEISTE zeigt (Chips), was JEDE Wurzel je Filter als Auswahl
   haelt, und welche Ereignisse nach Bubble gingen. */
function chipsJetzt(){
  var bar = document.querySelector("#c-bar .ufb-root");
  return bar ? [].map.call(bar.querySelectorAll(".ufb-chip-lbl"), function(c){ return c.textContent; }) : ["(keine Leiste)"];
}
function wurzelAuswahl(){
  var o = {};
  [["umf","__umfCtrl","model_keys"],["umk","__umkCtrl","market_codes"],["utf","__utfCtrl","topic_ids"]].forEach(function(p){
    o[p[0]] = [].map.call(document.querySelectorAll("." + p[0] + "-root"), function(r){
      var c = r[p[1]], s = c && c.getSelected ? c.getSelected()[p[2]] : "?";
      return (r.closest(".ufb-root") ? "Leiste" : "daneben") + " Gen" + (r.__gen || "?") + "=" + JSON.stringify(s);
    }).join(" | ");
  });
  return "umf: " + o.umf + "\n    umk: " + o.umk + "\n    utf: " + o.utf;
}
async function rstStart(L){
  await w(900);
  ladeStore();
  window.setModelsFilterSelected("models_prompts", "gpt-4o");
  window.setMarketsFilterSelected && window.setMarketsFilterSelected("markets_prompts", "DE");
  await w(300);
  stempeln();
  window.__ev = [];
  L("1 Auswahl steht. Chips: " + JSON.stringify(chipsJetzt()));
}
async function rstEnde(L, was){
  L(was + " Chips: " + JSON.stringify(chipsJetzt()) + "\n    " + wurzelAuswahl() +
    "\n    Ereignisse: " + JSON.stringify(window.__ev.map(function(e){ return e[0] + "=" + String(e[1]).slice(0, 60); })) +
    "\n    Fehler " + JSON.stringify(window.__fehler));
}

var SZENARIEN = {
  /* Gegenprobe: Reset ohne Neubau. */
  rst0: async function(L){
    await rstStart(L);
    window.resetFilterBar("filterbar_prompts");
    await w(2500);
    await rstEnde(L, "2 Reset, nach 2,5s.");
  },
  /* Bubble baut die Filter neu (die frischen Wurzeln lesen die Ablage MIT der Auswahl), und im
     selben Augenblick laeuft der Reset -- bevor der Waechter die frischen einzieht. */
  rst1: async function(L){
    await rstStart(L);
    filterNeu({});
    window.resetFilterBar("filterbar_prompts");
    await rstEnde(L, "2 Filter neu + Reset, sofort.");
    await w(2500);
    await rstEnde(L, "3 nach 2,5s (Waechter hat getauscht).");
  },
  /* DAS FENSTER: die frischen Wurzeln sind schon HOCHGEFAHREN (haben die Ablage mit der Auswahl
     gelesen), aber der Waechter hat sie noch nicht eingezogen -- genau dann der Reset. */
  rst3: async function(L){
    await rstStart(L);
    filterNeu({});
    var t0 = performance.now();
    while (performance.now() - t0 < 2000){
      var frisch = [].filter.call(document.querySelectorAll(".umf-root"), function(r){ return !r.closest(".ufb-root") && r.__umfCtrl; });
      if (frisch.length) break;
      await w(10);
    }
    L("2 frische Wurzeln hochgefahren nach " + Math.round(performance.now() - t0) + "ms, noch nicht eingezogen:\n    " + wurzelAuswahl());
    window.resetFilterBar("filterbar_prompts");
    await rstEnde(L, "3 Reset, sofort.");
    await w(2500);
    await rstEnde(L, "4 nach 2,5s (Waechter hat getauscht).");
    await oeffnen();
    var bar = document.querySelector("#c-bar .ufb-root");
    L("5 More Filters offen, Models-Zeile zeigt: " + JSON.stringify((bar.querySelector('.up-subwrap[data-sub="models"] [data-mirror]') || {}).textContent));
  },
  /* DAS FENSTER, DETERMINISTISCH: die frische Wurzel meldet sich bei der Leiste
     (window.__ufbWurzelNeu), und die tauscht erst im naechsten Takt (setTimeout 0). Laeuft der Reset
     GENAU dazwischen -- so wie ein Run-JS-Schritt, den Bubble im selben Zug wie den Neubau ausfuehrt
     --, leert er die alte Wurzel, und die frische bringt danach die alte Auswahl mit. */
  rst4: async function(L){
    await rstStart(L);
    var orig = window.__ufbWurzelNeu, einmal = false, vorher = "";
    window.__ufbWurzelNeu = function(r){
      var ret = orig.apply(this, arguments);
      if (!einmal && r && r.classList && r.classList.contains("umf-root")){
        einmal = true;
        vorher = wurzelAuswahl();
        window.resetFilterBar("filterbar_prompts");
      }
      return ret;
    };
    filterNeu({});
    await w(50);
    window.__ufbWurzelNeu = orig;
    L("2 Reset lief zwischen Hochfahren und Einziehen. Stand davor:\n    " + vorher);
    await w(2500);
    await rstEnde(L, "3 nach 2,5s.");
    await oeffnen();
    var bar = document.querySelector("#c-bar .ufb-root");
    L("4 More Filters offen, Models-Zeile zeigt: " + JSON.stringify((bar.querySelector('.up-subwrap[data-sub="models"] [data-mirror]') || {}).textContent));
  },
  /* Wie rst1, aber der Neubau kommt 150ms NACH dem Reset (liest also die geleerte Ablage). */
  rst2: async function(L){
    await rstStart(L);
    window.resetFilterBar("filterbar_prompts");
    await w(150);
    filterNeu({});
    await w(2500);
    await rstEnde(L, "2 Reset, 150ms spaeter Filter neu, nach 2,5s.");
  },
  /* Gegenprobe: kein Neubau. Beide Fassungen muessen hier gleich stehen. */
  dup0: async function(L){
    await dupStart(L);
    await w(2500);
    L("2 nach 2,5s ohne Neubau\n    " + dupKurz(dupStand()));
    await dupEnde(L);
  },
  /* Nur die drei Filter neu (etwa data-isprocessing kippt), die Leiste bleibt. */
  dup1: async function(L){
    await dupStart(L);
    filterNeu({});
    L("2 Bubble baut die drei Filter neu\n    " + dupKurz(dupStand()));
    await w(2500);
    L("3 nach 2,5s\n    " + dupKurz(dupStand()));
    await dupEnde(L);
  },
  /* Themenwechsel: alle vier Elemente neu, im selben Augenblick. */
  dup2: async function(L){
    await dupStart(L);
    bubbleSetzt("c-bar", { dunkel: true });
    filterNeu({ dunkel: true });
    L("2 Themenwechsel: alle vier neu\n    " + dupKurz(dupStand()));
    await w(3200);
