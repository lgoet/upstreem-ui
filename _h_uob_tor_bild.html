<meta charset="utf-8"><title>onboarding: Tor, Sichtprobe</title>
<style>html,body{margin:0;font:13px/1.5 Geist,system-ui,sans-serif}
#b{padding:16px} #out{padding:8px;font:11px/1.4 ui-monospace,monospace}</style>
<body><div id="b"></div><pre id="out">laeuft…</pre>
<script>
/* Sichtprobe zum Tor. ?dark=1 dunkel, ?w=420 schmal (der Umbruch der Komponente liegt bei 760),
   ?fall=ok|limit|lauf. Zahlen sagen nicht, ob eine Karte gut aussieht. */
["uobStart","uobStep","uobTopics","uobWorkflowStart","uobSelect","uobFinish","uobExit"].forEach(function(n){
  window["bubble_fn_"+n]=function(){}; });
function hol(f){ return fetch(f+"?n="+Math.random(),{cache:"no-store"}).then(function(r){ return r.text(); }); }
function wurzelAus(h){ return h.replace(/<!--[\s\S]*?-->/g,"").replace(/<script[\s\S]*?<\/script>/gi,"").trim(); }
var D=["core.css","core.js","onboarding-page.css","onboarding-page.js",
       "bubble/onboarding_page_bubble.html","_h_uob_eastside_voll.json"];
var T={};
Promise.all(D.map(hol)).then(function(t){
  D.forEach(function(f,i){ T[f]=t[i]; });
  ["core.css","onboarding-page.css"].forEach(function(f){ var s=document.createElement("style"); s.textContent=T[f]; document.head.appendChild(s); });
  [ "core.js","onboarding-page.js"].forEach(function(f){ var j=document.createElement("script"); j.textContent=T[f]; document.head.appendChild(j); });
  return new Promise(function(ok){ setTimeout(ok,600); });
}).then(function(){
  var q = new URL(window.location.href).searchParams;
  var dunkel = q.get("dark")==="1", breite = q.get("w") || "1100", fall = q.get("fall") || "ok";
  document.body.style.background = dunkel ? "#0f0f10" : "#fff";
  document.getElementById("b").style.width = breite + "px";
  var ROH = T["_h_uob_eastside_voll.json"];
  var b = JSON.parse(ROH);
  /* ?felder=alias: die Zeitfelder heissen anders. Genau der Fall, der auf der echten Seite nicht
     zu unterscheiden war von "kein Datum da" -- die Zeile blieb weg und sagte nicht, warum. */
  if (q.get("felder") === "alias") {
    b.project.created = b.project.created_at; delete b.project.created_at;
    b.project.last_updated = b.project.updated_at; delete b.project.updated_at;
  }
  /* ?felder=muster: Namen, die in KEINER Liste stehen, aber wie Zeitfelder heissen. Dazu ein
     created_by mit einer Uuid -- es traegt "creat" im Namen und ist kein Zeitpunkt; stuende es im
     Tor, waere die Mustersuche schlimmer als die Liste. */
  if (q.get("felder") === "muster") {
    b.project.record_created_at = b.project.created_at; delete b.project.created_at;
    b.project.row_changed_at = b.project.updated_at; delete b.project.updated_at;
    b.project.created_by = "aea6e317-d901-419b-b2b2-5ca3573ea2f5";
  }
  /* ?felder=keine: gar keine Zeiten. Dann darf auch kein leerer Kasten stehen. */
  if (q.get("felder") === "keine") {
    delete b.project.created_at; delete b.project.updated_at;
  }
  /* KEINE eigenen Zeiten und KEIN eigener restart-Block mehr: beides steht im echten Payload des
     Nutzers. Vorher hat dieser Aufbau sich seine Eingabe selbst gebaut und damit gemessen, dass
     meine Annahme zu meiner Annahme passt. */
  if (fall === "limit") { b.restart.allowed=false; b.restart.reason="rate_limited"; b.restart.used=5;
    b.restart.remaining=0; b.restart.next_allowed_at=new Date(Date.now()+5*3600e3).toISOString(); }
  if (fall === "lauf") { b.restart.allowed=false; b.restart.reason="run_in_progress";
    b.restart.run_in_progress=true; }
  /* EINMAL am Ende, fuer alle Zweige. Vorher baute nur der felder-Zweig den Rohtext neu, und die
     Aenderungen der fall-Zweige fielen unter den Tisch: ?fall=limit zeigte das Tor mit aktivem
     Start over, also gar nicht den Fall, um den es ging. */
  ROH = JSON.stringify(b);
  /* Der Schritt in der Adresse entscheidet, welchen Weg einstieg() nimmt: gehe() oder render().
     Genau daran koennte haengen, ob die Karte ihr Projekt schon hat -- state.projekt wird in
     setBundle NACH den Listen gesetzt, und die zeichnen dazwischen. Also alle drei Wege messen. */
  var u=new URL(window.location.href);
  var wunsch = u.searchParams.has("step") ? u.searchParams.get("step") : "prompts";
  if (wunsch) u.searchParams.set("step", wunsch); else u.searchParams.delete("step");
  window.history.replaceState({}, "", u.toString());
  var w=document.createElement("div"); w.innerHTML=wurzelAus(T["bubble/onboarding_page_bubble.html"]);
  var r=w.querySelector(".uob-root"); var id="tb"+Math.random().toString(36).slice(2,7);
  r.setAttribute("data-instance",id); r.setAttribute("data-cdn-pin","tb");
  r.setAttribute("data-isdark", dunkel?"yes":"no");
  document.getElementById("b").appendChild(r);
  var n=0; (function warte(){ if (r.__uobController || n++>40){
    /* ROHTEXT, wie ihn der Run-JS-Step uebergibt -- er laeuft dann durch UC.readBubble samt
       Sanitizer. Vorher stand hier JSON.stringify(JSON.parse(...)): das prueft den Parser gar
       nicht, sondern nur, dass mein eigenes Objekt zu meinem eigenen Objekt passt. */
    /* Ein MutationObserver stand hier und sollte die Zwischenzustaende mitschreiben. Er kann das
       nicht: sein Rueckruf ist eine Mikroaufgabe und laeuft erst NACH dem synchronen Setter, da
       steht schon der Endzustand. Ein Instrument, das nichts messen kann, ist schlimmer als
       keines -- also raus. Der Zwischenzustand bleibt hier ungemessen und ist als solcher benannt. */
    window.setOnboardingBundle(id, (new URL(window.location.href).searchParams.get("roh")==="0")
      ? JSON.stringify(b) : ROH);
    setTimeout(function(){
      var karte = r.querySelector(".uob-res-meta");
      document.getElementById("out").textContent = JSON.stringify({
        breiteWurzel: r.clientWidth, schmal: r.classList.contains("is-narrow"),
        kartenBreite: karte ? Math.round(karte.getBoundingClientRect().width) : null,
        zeilen: [].map.call(r.querySelectorAll(".uob-res-row"), function(d){
          return (d.querySelector(".uob-res-k")||{}).textContent + " = " +
                 (d.querySelector(".uob-res-v")||{}).textContent; }),
        marke: (r.querySelector(".uob-load-name")||{}).textContent,
        domain: (r.querySelector(".uob-load-dom")||{}).textContent,
        pane: (r.querySelector(".uob-pane:not(.is-off)")||{getAttribute:function(){return "-";}}).getAttribute("data-pane"),
        knopfBreite: Math.round((r.querySelector("[data-resume]")||{getBoundingClientRect:function(){return{width:0}}}).getBoundingClientRect().width),
        ueberlauf: r.scrollWidth > r.clientWidth ? (r.scrollWidth - r.clientWidth) : 0,
        noteZeilen: [].map.call(r.querySelectorAll(".uob-res-note span"), function(x){ return x.textContent; }),
        noteKasten: (function(){ var k=r.querySelector(".uob-res-note");
          if (!k) return null; var v=getComputedStyle(k);
          return { grund: v.backgroundColor, radius: v.borderTopLeftRadius, polster: v.padding,
                   rahmen: v.borderTopWidth, zeilen: k.querySelectorAll("span").length,
                   hoehe: Math.round(k.getBoundingClientRect().height) }; })(),
        note: (r.querySelector(".uob-res-note")||{}).textContent,
        projektDa: !!document.querySelector(".uob-load-dom"),
        /* Unterlaengen: passt die Zeilenhoehe zur Schrift, oder schneidet overflow:hidden das
           "g" ab? Gemessen wird die Kastenhoehe gegen die Zeilenhoehe -- ist der Kasten kleiner,
           wird geschnitten. */
        zeilenkasten: (function(){
          var v=r.querySelector(".uob-res-v"); if (!v) return null;
          var st=getComputedStyle(v);
          return { schrift: st.fontSize, zeile: st.lineHeight,
                   hoehe: Math.round(v.getBoundingClientRect().height * 10) / 10,
                   scrollHoehe: v.scrollHeight, reicht: v.scrollHeight <= Math.ceil(v.getBoundingClientRect().height) };
        })(),
        warnung: (function(){
          var w=r.querySelector("[data-overwarn]"); if (!w) return null;
          return { da: true, an: w.className.indexOf("is-on") >= 0,
                   hoehe: Math.round(w.getBoundingClientRect().height),
                   text: (w.textContent||"").trim().slice(0,50) };
        })(),
        knopfText: (r.querySelector("[data-restart]")||{}).textContent,
        knopfBreiten: [].map.call(r.querySelectorAll(".uob-res-acts button"), function(x){
          return Math.round(x.getBoundingClientRect().width); }),
        kastenBreiteGemessen: (function(){ var k=r.querySelector(".uob-res-meta");
          return k ? Math.round(k.getBoundingClientRect().width) : null; })()
      });
      /* Und beide Knoepfe wirklich druecken. "startet und updatet nicht" kann auch heissen:
         die Karte steht, aber nichts passiert beim Klicken. */
      var vorPane = (r.querySelector(".uob-pane:not(.is-off)")||{getAttribute:function(){return "-";}}).getAttribute("data-pane");
      var welcher = new URL(window.location.href).searchParams.get("klick");
      if (welcher === "weiter" || welcher === "over") {
        var b2 = r.querySelector(welcher === "weiter" ? "[data-resume]" : "[data-restart]");
        if (b2) b2.click();
        setTimeout(function(){
          var o = JSON.parse(document.getElementById("out").textContent);
          o.klick = { welcher: welcher, knopfDa: !!b2, paneVorher: vorPane,
            paneNachher: (r.querySelector(".uob-pane:not(.is-off)")||{getAttribute:function(){return "-";}}).getAttribute("data-pane"),
            schritt: new URL(window.location.href).searchParams.get("step"),
            vorspann: (r.querySelector(".uob-sub")||{}).textContent };
          document.getElementById("out").textContent = JSON.stringify(o);
          window.__fertig=true;
        }, 300);
        return;
      }
      window.__fertig=true;
    }, 500);
  } else setTimeout(warte,60); })();
});
</script>
