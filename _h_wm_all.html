<meta charset="utf-8"><title>watermark alle</title>
<style>
 body{margin:0;font:12px ui-monospace,monospace}
 .platz{position:relative;height:200px;margin:8px;border:1px solid rgba(128,128,128,.3)}
 pre{padding:10px;white-space:pre-wrap}
</style>
<body>
<pre id="out">laeuft</pre>
<!-- Fuenf Wraps, so wie die fuenf Komponenten sie haben: derselbe Aufruf, denselben Weg. -->
<div class="up-root" data-instance="a1" data-isdark="no"><div class="up-line-wrap platz" id="w1"></div></div>
<div class="up-root" data-instance="a2" data-isdark="no"><div class="up-line-wrap platz" id="w2"></div></div>
<div class="up-root" data-instance="a3" data-isdark="no"><div class="up-line-wrap platz" id="w3"></div></div>
<div class="up-root" data-instance="a4" data-isdark="no"><div class="upd-linewrap platz" id="w4"></div></div>
<div class="up-root" data-instance="a5" data-isdark="no"><div class="ubd-chartwrap platz" id="w5"></div></div>
<link rel="stylesheet" href="core.css?frisch=wmall1">
<script src="core.js?frisch=wmall1"></script>
<script>
setTimeout(function(){
  var UC=window.UpstreemCore;
  ["w1","w2","w3","w4","w5"].forEach(function(id){ UC.injectWatermark(document.getElementById(id)); });
  function bild(){
    return [].map.call(document.querySelectorAll(".upstreem-watermark"), function(e){
      var cs=getComputedStyle(e), r=e.getBoundingClientRect(), p=e.parentNode.getBoundingClientRect();
      var url=(cs.backgroundImage.match(/lockup-([0-9a-f]+)\.svg/)||[])[1]||cs.backgroundImage.slice(0,40);
      return { wrap:e.parentNode.id, datei:url, kasten:[Math.round(r.width*10)/10, Math.round(r.height*10)/10],
        deckkraft:cs.opacity, groesse:cs.backgroundSize, z:cs.zIndex,
        /* Lage pruefen: Mitte waagerecht, 47% senkrecht. */
        mitte_x_ab: Math.round((r.left+r.width/2)-(p.left+p.width/2)),
        mitte_y_prozent: Math.round((r.top+r.height/2-p.top)/p.height*1000)/10 };
    });
  }
  var res={ hell: bild() };
  setUpstreemTheme("dark");
  setTimeout(function(){
    res.dunkel = bild();
    document.getElementById("out").textContent = JSON.stringify(res,null,1);
    window.__wm = res;
  }, 400);
}, 400);
</script>
