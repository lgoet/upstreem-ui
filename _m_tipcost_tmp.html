<!doctype html>
<meta charset="utf-8">
<title>line tooltip messung</title>
<link rel="stylesheet" href="core.css?m=1">
<style>
  body { margin:0; font-family: Geist, system-ui, Arial; background:#fff; }
  .app { display:flex; min-height:100vh; }
  .side { flex:0 0 248px; display:flex; flex-direction:column; gap:8px; padding:12px; }
  .side .it { display:flex; align-items:center; gap:10px; height:36px; padding:0 10px; }
  .main { flex:1 1 auto; display:flex; flex-direction:column; gap:16px; padding:16px; min-width:0; }
  .panel { display:flex; flex-direction:column; gap:12px; border:1px solid #e0e2e6; border-radius:16px; padding:16px; }
  .trow { display:grid; grid-template-columns: 320px 120px 120px 120px 1fr; align-items:center;
          height:44px; border-bottom:1px solid #eee; }
  .trow > div { display:flex; align-items:center; gap:8px; padding:0 12px; min-width:0; }
  .ell { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #cw { position:relative; height:300px; }
</style>
<body>
<div class="app">
  <div class="side" id="side"></div>
  <div class="main">
    <div class="panel">
      <div id="cw"><canvas id="cv"></canvas></div>
      <div id="lg" class="up-company-legend"></div>
    </div>
    <div class="panel" id="tbl"></div>
  </div>
</div>
<pre id="out" style="padding:16px;white-space:pre-wrap">laedt…</pre>
<script src="core.js?m=1"></script>
<script>
var L = [];
function log(s){ L.push(s); document.getElementById("out").textContent = L.join("\n"); }

/* Umgebung wie die echte Seite: Leiste, 300 Grid-Zeilen. */
var side = document.getElementById("side");
for (var i = 0; i < 24; i++){
  var it = document.createElement("div"); it.className = "it";
  it.innerHTML = '<span style="width:16px;height:16px"></span><span>Nav ' + i + '</span>';
  side.appendChild(it);
}
var tbl = document.getElementById("tbl"), f = document.createDocumentFragment();
for (i = 0; i < 300; i++){
  var r = document.createElement("div"); r.className = "trow";
  r.innerHTML = '<div><span style="width:20px;height:20px;border-radius:4px;background:#eee"></span>' +
    '<span class="ell">Prompt Nummer ' + i + ' mit langem Text der abgeschnitten wird</span></div>' +
    '<div><span>34.3%</span></div><div><span>3.0</span></div><div><span>76</span></div>' +
    '<div><span class="ell">chatgpt.com, perplexity.ai, gemini.google.com</span></div>';
  f.appendChild(r);
}
tbl.appendChild(f);

/* 7 Marken x 30 Tage — genau die Form, die makeLine im Produkt bekommt. */
var COMP = [], SER = [];
for (i = 0; i < 7; i++){
  COMP.push({ company_id: "c" + i, name: "Beispielmarke " + i, color: null,
              favicon_url: "", visibility_window_pct: 40 - i * 4 });
  for (var d = 0; d < 30; d++){
    SER.push({ company_id: "c" + i, day: "2026-07-" + String(d + 1 < 10 ? "0" + (d+1) : d+1),
               visibility_pct: 20 + i * 2 + 8 * Math.sin(d / 3 + i) });
  }
}
var UC = window.UpstreemCore;
var built = UC.buildLineDatasets(SER, COMP, null);

var line = UC.makeLine({
  wrap: document.getElementById("cw"),
  canvas: document.getElementById("cv"),
  legend: document.getElementById("lg"),
  isDark: function(){ return false; },
  isOwner: function(){ return true; },
  gran: function(){ return "day"; },
  watermark: false
});
line.render(built);

/* ── Messung ──────────────────────────────────────────────────────────────────
   Der external-Handler wird umschlossen, damit gezaehlt und gestoppt werden kann:
   wie oft laeuft er je Mausbewegung, und wie lange. Danach ein Sweep aus echten
   mousemove-Ereignissen ueber den Canvas, wie beim Hin- und Herfahren. */
setTimeout(function(){
  var ch = window.Chart.getChart(document.getElementById("cv"));
  if (!ch){ log("KEIN Chart — Chart.js nicht geladen?"); return; }
  var to = ch.options.plugins.tooltip;
  var orig = to.external;
  var calls = 0, tExt = 0, inhalte = 0, letzterIdx = null;
  to.external = function(ctx){
    calls++;
    var dp = ctx.tooltip && ctx.tooltip.dataPoints && ctx.tooltip.dataPoints[0];
    var idx = dp ? dp.dataIndex : null;
    if (idx !== letzterIdx){ inhalte++; letzterIdx = idx; }
    var t0 = performance.now();
    orig.call(this, ctx);
    tExt += performance.now() - t0;
  };
  /* rAF-Schleifen zaehlen: jede geschachtelte Anforderung wird mitgezaehlt. */
  var rafs = 0, origRaf = window.requestAnimationFrame;
  window.requestAnimationFrame = function(cb){ rafs++; return origRaf.call(window, cb); };

  var cv = document.getElementById("cv");
  var R = cv.getBoundingClientRect();
  var y = R.top + R.height / 2;
  function move(x){
    cv.dispatchEvent(new MouseEvent("mousemove", { clientX: x, clientY: y, bubbles: true }));
  }
  /* Ein Sweep hin und zurueck: 200 Bewegungen, so wie ein Nutzer 2x quer fährt. */
  var xs = [];
  for (i = 0; i < 100; i++) xs.push(R.left + 8 + (R.width - 16) * (i / 99));
  for (i = 0; i < 100; i++) xs.push(R.left + 8 + (R.width - 16) * (1 - i / 99));

  move(xs[0]);
  calls = 0; tExt = 0; inhalte = 0; rafs = 0;
  var t0 = performance.now();
  for (i = 0; i < xs.length; i++) move(xs[i]);
  var gesamt = performance.now() - t0;

  log("DOM-Elemente: " + document.getElementsByTagName("*").length);
  log("");
  log("200 mousemove ueber den Canvas (2 Sweeps, 30 Tage, 7 Serien):");
  log("  gesamt in dispatchEvent (Chart.js + Tooltip): " + gesamt.toFixed(1) + " ms");
  log("  = " + (gesamt / 200).toFixed(2) + " ms je Mausbewegung");
  log("  external-Handler lief " + calls + "x  (" + (calls / 200 * 100).toFixed(0) + "% der Bewegungen)");
  log("  davon mit WIRKLICH neuem Inhalt: " + inhalte + "x");
  log("  Zeit IM external-Handler: " + tExt.toFixed(1) + " ms  = " + (calls ? (tExt/calls).toFixed(2) : 0) + " ms je Aufruf");
  log("  Rest (Chart.js selbst): " + (gesamt - tExt).toFixed(1) + " ms = " +
      ((gesamt - tExt) / 200).toFixed(2) + " ms je Bewegung");
  log("  rAF-Anforderungen waehrend des Sweeps: " + rafs);
  log("");
  log("Budget: 16.7 ms je Frame bei 60 Hz. Ein Trackpad liefert 100-120 Bewegungen/s.");

  /* Wie viele rAF-Schleifen laufen dauerhaft, wenn das Chart waehrend eines Hovers
     neu gebaut wird? (Filterwechsel, Theme, Linienbreite.) */
  setTimeout(function(){
    var vorher = 0, zaehlen = true;
    var rr = window.requestAnimationFrame;
    window.requestAnimationFrame = function(cb){ if (zaehlen) vorher++; return rr.call(window, cb); };
    move(xs[50]);                                  /* Tooltip sichtbar */
    setTimeout(function(){
      vorher = 0;
      setTimeout(function(){
        var ruheRate = vorher;                     /* rAF/100ms im Hover-Ruhezustand */
        /* Jetzt neu bauen, waehrend das Tooltip sichtbar ist — wie ein Filterwechsel. */
        line.render(UC.buildLineDatasets(SER.map(function(p){
          return { company_id: p.company_id, day: p.day, visibility_pct: p.visibility_pct * 1.05 };
        }), COMP, null));
        setTimeout(function(){
          vorher = 0;
          setTimeout(function(){
            log("");
            log("rAF-Anforderungen je 100 ms, Maus steht still auf dem Chart:");
            log("  vor dem Neubau:  " + ruheRate);
            log("  nach dem Neubau: " + vorher + "   <- jede Zahl ueber der ersten ist eine Schleife, die nie endet");
            zaehlen = false;
          }, 100);
        }, 900);
      }, 100);
    }, 200);
  }, 300);
}, 2500);
</script>
